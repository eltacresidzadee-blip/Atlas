# iPhone və Android üçün quraşdırıla bilən veb-tətbiq (PWA): GitHub Pages-də dərc olunur.
# Bir dəfə: Settings → Pages → Source: «GitHub Actions» seçin.
name: Veb-tətbiq (iPhone / Android)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: d
        uses: actions/deploy-pages@v4
