# iPhone və Android üçün quraşdırıla bilən veb-tətbiq (PWA).
# www/ qovluğu gh-pages şaxəsinə dərc olunur → https://eltacresidzadee-blip.github.io/Atlas/
name: Veb-tətbiq (iPhone / Android)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: touch www/.nojekyll
      - name: Gömrük İmtahanı səhifəsini saxla (gomruk-imtahan budağından)
        run: |
          git fetch --depth=1 origin gh-pages || exit 0
          git archive FETCH_HEAD gomruk | tar -x -C www || true
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Veb-tətbiq yeniləndi
