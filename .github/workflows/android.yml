# GitHub-a yüklədikdən sonra Android APK avtomatik yığılır.
# Nəticə: «Releases» bölməsində Gomruk-sual-cavab.apk (və Actions → son iş → Artifacts)
name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK yoxlanılır
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms || true
      - name: Asılılıqlar
        run: npm install
      - name: Android layihəsi, ikonlar və açılış ekranı
        run: npm run android
      - name: APK yığılır
        working-directory: android
        run: |
          chmod +x gradlew
          # Sabit imza açarı: hər yığım eyni açarla imzalanır ki, yeni versiya köhnənin üstünə quraşdırılsın və işarələr itməsin.
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: APK-nı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gomruk-sual-cavab.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Gomruk-sual-cavab-apk
          path: Gomruk-sual-cavab.apk
      - name: «Releases» bölməsində dərc et (telefondan rahat yükləmək üçün)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gömrük sual-cavab 1.0.${{ github.run_number }}
          body: Android üçün Gömrük sual-cavab tətbiqi. Telefonda Gomruk-sual-cavab.apk faylını yükləyin və quraşdırın.
          files: Gomruk-sual-cavab.apk
          make_latest: true
