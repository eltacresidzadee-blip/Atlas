# GitHub-a yüklədikdən sonra Android APK avtomatik yığılır.
# Nəticə: Actions → «Android APK» → son işə daxil olun → Artifacts → Atlas-android-apk
name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK yoxlanılır
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms || true
      - name: Asılılıqlar
        run: npm install
      - name: Android layihəsi, ikonlar və açılış ekranı
        run: npm run android
      - name: APK yığılır
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK-nı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Atlas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-android-apk
          path: Atlas.apk
