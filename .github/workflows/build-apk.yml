# Gömrük İmtahanı — Android APK (bu budağa hər push-da avtomatik yığılır)
name: Gomruk Imtahani APK
on:
  push:
    branches: [gomruk-imtahan]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: APK yığılır
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK-nı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk GomrukImtahani.apk
      - uses: actions/upload-artifact@v5
        with:
          name: GomrukImtahani-apk
          path: GomrukImtahani.apk
      - name: Releases bölməsində dərc et
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gomruk-1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Gömrük İmtahanı 1.0.${{ github.run_number }}
          body: Gömrük qanunvericiliyi imtahanına hazırlıq tətbiqi (29 sənəd, 2017 sual). Telefonda GomrukImtahani.apk faylını yükləyin və quraşdırın.
          files: GomrukImtahani.apk
          make_latest: false
