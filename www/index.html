parılması üçün sənədlər üzrə","2022"],["Ümumi meyarın mallar hissəsinə nələr daxildir?","• Riskli mallar\n• Yayındırıcı mallar\n• Xarici İqtisadi Fəaliyyətin Mal Nomenklaturası üzrə\n• Daşınma xüsusiyyətləri","2022"],["Ümumi meyarın ölkələr hissəsinə nələr daxildir?","• Malın mənşə ölkəsi üzrə\n• Göndərən ölkə üzrə","2022"],["Riskli mallar üzrə hansı meyarlar var?","• Aksizli mallar\n• Kombinə edilmiş və spesifik gömrük tarifi tədbirləri tətbiq olunan mallar\n• Yüksək advalor gömrük tarifləri tətbiq olunan mallar\n• Qeyri-tarif tədbirləri tətbiq olunan mallar və ixrac nəzarətinə düşən mallar\n• Xüsusi Gömrük Proseduru altında bəyan olunmuş mallar","2022"],["Yayındırcı mallar üzrə hansı meyarlar var?","• Aşağı advalor gömrük tarifi tətbiq olunan mallar\n• Tarif güzəştləri olan və gömrük rüsumlarından qismən və tamamilə azad olan mallar","2022"],["Fiziki şəxs özü və ailəsinin istehlakı üçün nəzərdə tutulmuş eyni və eynicinsli mallardan hansı miqdarda keçirildikdə gömrük ödənişləri ödənilmir?","• 2 ədəd keçirildikdə","2022"],["Fiziki şəxslər tərəfindən gömrük orqanına gətirilmiş təyinatı istehsal və ya kommersiya üçün nəzərdə tutulmayan malların elektron sistemdə uçotu hansı orqanın müəyyən etdiyi qaydalara əsasən aparılır?","• Azərbaycan Respublikası Dövlət Gömrük Komitəsinin müəyyən etdiyi qaydalara uyğun olaraq","2022"],["Fiziki şəxslər tərəfindən gömrük sərhəddindən hansı mallar güzəştli qaydada keçirilə bilər?","• Şəxsin ehtiyacının qarşılaması üçün nəzərdə tutulmuş şəxsi əşyalar\n• 800 ABŞ dolları ekvivalenti məbləğində mallara ( Hər təqvim ayı ərzində 1 dəfə)\n• 300 ABŞ dolları ekvivalenti məbləğində beynəlxalq poçt göndərişi ilə göndərilən mallar ( hər təqvim ayı ərzində 1 dəfə)\n• Yanacaq bakında gətirilən yanacaq (200 litrə qədər)\n• Şəxsi istifadə üçün nəzərdə tutulan qeydiyyatdan keçməmiş dərman vasitələridə daxil olmaqla dərman vasitələri\n• MM –yə əsasən vərəsəlik hüququ ilə əldə edilmiş əmlak\n• 1,5 litr alkokoqllu içki\n• 200 ədəd siqaret\n• 20 qram qızıl\n• 0,5 karat almaz\n• 30 kq-a qədər ərzaq məhsulu ( hər təqvim ayı)\n• 5 kq-a qədər nərə cinsli balıq ( hər təqvim ayı)\n• 125 qram nərə cinsli balıq kürüsü ( hət təqvim ayı)\n159.Azərbaycan Respublikasının diplomatik nümayəndəliklərində və konsulluqlarında xidmət etmiş, diplomatik xidmət əməkdaşları və inzibati-texniki heyətidə daxil olmaqla hansı müddətə xidmət etdikdə və ölkə ərazisinə geri çağırılıqda hansı dəyərdə və mühərriki hansı həcmdə olan avtonəqliyyat vasitəsini gömrük ödənişləri alınmadan ölkə ərazisinə gətirə bilər və bununla bağlı hansı sənədlər təqdim olunmalıdır?\n• 2 ildən az olmamaqla xidmət etmiş , 40000 ABŞ dolları ekvivalentində 3000 kubsantimetr həcmində\n• Avtonəqliyyat vasitəsinin dəyərinin ödənilməsi ilə bağlı sənəd\n• Avtonəqliyyat vasitəsinin 1 il ərzində özgəninkiləşdirilməməsi ilə bağlı sənəd","2022"],["Fiziki şəxslərin gömrük sərhədindən keçirilən malların bəyan edilməsinin güzəştli və sadələşdirilmiş qaydalarına əsasən hansı buraxılış sistemlərindən istifadə olunur?","• Yaşıl kanal\n• Qırmızı kanal","2022"],["Yaşıl kanal buraxılış sistemində mallar necə bəyan edilir?","• Şifahi formada","2022"],["Qırmızı kanal buraxılış sistemində mallar necə bəyan edilir?","• Yazılı formada","2022"],["Beynəlxalq poçt göndərişi ilə göndərilən və hansı sənədlə müşayiət olunan mallara görə gömrük bəyannaməsi tələb olunmur?","• ÜmumDünya Poçt İttifaqı aktlarında nəzərdə tutulmuş sənədlərlə müşaiyət olunan mallar","2022"],["Hansı şəxslər gömrük ərazisinə gətirilmiş hansı avtonəqliyyat və hansı sənədlərə əsasən gömrük ödənişləri ödəmir?","• Əliliyi olan şəxslər\n• Xüsusi hazırlanmış avtonəqliyyat vasitələri\n• Əmək və Əhalinin Sosial Müdafiəsi tərəfindən təsdiq edilmiş sənədlə","2022"],["Qeyri-rezidentlər tərəfindən gətirilən avtonəqliyyat vasitələrinin gömrük ərazisində qalma müddəti nə qədərdir?","• 90 gün ( hər təqvim ili üzrə), müəyyən edilmiş hallarda qalma müddətinə uyğun olaraq 1 ilə qədər uzadıla bilər.","2022"],["Qeyri-rezidentlər tərəfindən müəyyən edilmiş mal kodlarında olmayan avtonəqliyyat vasitələri gətirilən zaman onların ölkə ərazisində müvəqqəti qalma müddəti hansı tələb ödənildikdən sonra icazə verilir?","• XİF MN –nin 8703 və 8711 kodları üzrə olmayan avtonəqliyyat vasitələri gətirildikdə gömrük borcu yaranacaq təqdirdə ödənilməsi üçün gömrük təminatı tələb edirlər.","2022"],["Avtonəqliyyat vasitəsinin müvəqqəti saxlama müddəti keçəcənədək, tranzit qaydada keçərkən 72 saat ərzində hansı qaydalara əməl etməlidir?","• Gömrük ərazisindən aparılmalı\n• Gömrük nəzarəti altında saxlanmalı\n• Gömrük təminatı alınmalı\n• DİN Baş Dövlət Yol Polisinin həbslə bağlı təsdiq edici sənədi\n• Tarif və qeyri-tarif tədbirlərinə uyğun sadələşdirilmiş qaydada gömrük ödənişləri ödənilməli","2022"],["Hansı avtonəqliyyat vasitələrinin gömrük ərazisinə gətirilməsinə icazə verilmir?","• Daimi qeydiyyatda olamayan\n• Qeydiyyatdan çıxarılmış","2022"],["Azərbaycan Respublikasında qeydiyyatda olan avtomobil hansı müddətə gömrük ərazisindən kənara aparıla bilər?","• 2 il müddətinə","2022"],["Fiziki şəxslər tərəfindən Azərbaycan Respublikasına gətirilən hansı mallar yazılı bəyan edilməlidir?","• Nəzərdə tutulmuş həddən artıq gətirilən mallar\n• 10000 ABŞ dollarından yuxarı ekvivalentdə gətirilmiş xarici valyuta və qiymətli kağızlar\n• 20000 manat məbləğində və ondan yuxarı həcmdə gətirilən milli valyuta və qiymətli kağızlar\n• Şəxslər tərəfindən gətirilən və ya beynəlxalq poçt göndərişi ilə göndərilən mobil telefonlar və simsiz rabitə avadanlıqları\n• Avtonəqliyyat vasitələri\n• Nəzərdə tutulmuş həcmdən artıq gətirilən qiymətli metal və daşlar\n• Lisenziya və icazə sənədi tələb olunan mallar\n• Müşayiət olunmayan baqajda və daşıyıcı tərəfindən gətirilən mallar\nValyuta Tənzimlənməsi Haqqında\n173. Fiziki şəxslər tərəfindən Azərbaycan Respublikasına nağd şəkildə gətirilən valyuta sərvətlərinin məbləği 50 min ABŞ dollarından artıq olduqda gömrük orqanı hara və hansı müddətə məlumatları təqdim edir ?\n• 7 gün müddətinə\n• Mərkəzi Bank\n• Maliyyə monitorinqi orqanına\n• Müvafiq İcra Hakimiyyəti orqanına","2022"],["Fiziki şəxs olan rezidentlər əvvəl Azərbaycan Respublikası ərazisinə gətirilən 50 min ABŞ dolları ekvivalentində valyuta sərvətini hansı sənədlər əsasında kənara köçürə bilər?","• Gətirilməsini təsdiq edən sənədlər əsasında","2022"],["Valyuta nəzarətinin məqsədi nədir?","• Valyuta mübadiləsinin valyuta tənzimlənməsi haqqında qanunvericiliyə uyğun aparılmasına nəzarət etmək","2022"],["Rezident və qeyri-rezident fiziki şəxslər hansı məbləğədək olan milli valyuta və milli valyuta ilə ifadə olunmuş qiymətli kağızların aparılma və gətirilmə prosesi hansı formada olur?","• 20000 manat məbləğində milli valyutanı və milli valyuta ilə ifadə olunmuş qiymətli kağızları nağd şəkildə apararkən şifahi formada bəyan etməlidir.\n• 20000 manat məbləğindən artıq olan milli valyuta və milli valyuta ilə ifadə olunmuş qiymətli kağızları nağd şəkildə aparıb gətirən zaman yazılı şəkildə bəyan etməlidir.","2022"],["Rezident və qeyri-rezident fiziki şəxslərin milli valyutada ifadə olunmuş yubiley və xatirə pul nişanlarını hansı formada apara və gətirə bilərlər?","• Məbləğindən aslı olmayaraq milli valyuta ilə ifadə olunmuş yubiley və xatirə pul nişanlarını yazılı formada bəyan etməklə aparıb - gətirə bilər.","2022"],["Valyuta nəzarətinin əsas istiqamətləri hansılardır?","• Aparılan valyuta əməliyyatlarının qüvvədə olan qanunvericiliyə uyğun olmasının və bunun üçün lisenziya , icazələrinin olmasını müəyyən etmək.\n• Xarici valyuta ilə ödənişlərin əsaslandırılmış olduğunu yoxlamaq.\n• Valyuta bazarında valyutanın satışı üzrə öhdəliklərin rezidentlər tərəfindən yerinə yetirilməsi vəziyyətini yoxlamaq.","2022"],["Valyuta qanunveiciliyinin pozulmasına görə hansı məsuliyyətləti daşıyır?","• Cinayət\n• Mülki-hüquqi\n• İnzibati","2022"],["Mülki dövriyyədə olmasına yol verilməyən mallar hansılardır?","• Döyüş təyinatlı hərbi texnika\n• Dövriyyəsi qadağan edilən silah və döyüş sursatı\n• Hərbi səfərbərlik təyinatlı əmlak\n• Dövlət kəmiyyət etalon vahidləri\n• Azərbaycan Respublikası qızıl ehtiyatı və əyar damğası\n• İnsan orqanları və toxumaları ( alqı-satqısına münasibətdə)\n• Narkotik vasitələr və onların prekursorları\n• 0,5 mm –dən az diametrli sintetik təkqat sapla hörülmüş və arasındakı dəliklər ölçüləri 120 mm-dən kiçik balıq tutan torlar\n• Dövlət Arxiv Fondunun sənədləri\n• Pul və poçt ödənişi nişanlarının buraxılması üçün avadanlıq","2022"],["Mülki dövriyyəsi müəyyən iştirakçılarına mənsub olan və xüsusi icazə əsasında yol verilən mallar hansılardır?","• Hərbi silah və sursatın istehsalı üçün avadanlıq\n• Döyüş təyinatlı məhsulları istehsal etmək üçün avadanlıq\n• Xidməti və mülki silah\n• Ozondağıdıcı maddələr və tərkibində belə maddələr olan məhsullar\n• Qiymətli kağızların çap edilməsi üçün avadanlıq və belə avadanlığın istehsalı üçün avadanlıq\n• İnsan orqanları və toxumaları ( alqı-satqısı istisna olmaqla)\n• Partlayıcı maddələr və qurğular , tez alışan maddələr və pirotexniki məmulatlar\n• Məsafədən idarə edilən pilotsuz uçuş aparatları\n• Kosmik peyk-rabitə vasitələri\n• Gizli qaydada informasiya alınması üçün nəzərdə tutulmuş texniki vasitələr","2022"],["Hansı məhsulların ixracı Ekologiya və Təbii sərvətlər nazirliyinin rəyi tələb olunur?","• İlan, böyə və əqrəb zəhəri\n• Çöl heyvanları və yabanı bitkilər\n• İstilik enerji və mineral xammal yataqları","2022"],["Hansı malların ixracı zamanı Səhiyyə Nazirliyinin rəyi tələb olunur?","• İlan, böyə və əqrəb zəhəri\n• Dövriyyəsinə nəzarət edilən psixotrop maddələr","2022"],["Hansı malların ixracı zamanı Elmlər Akademiyası və Əqli Mülkiyyət Agentliyinin rəyi tələb olunur?","• Elmi ixtiralar, Nou Hau və elmi tədqiqat işlərinin nəticələri","2022"],["Hansı malların ixracında Mədəniyyət Nazirliyinin rəyi tələb olunur?","• İncəsənət əsərləri,kolleksiya əşyaları və əntiq mallar\n• Dövlət siyahısına daxil edilmiş mədəni sərvətlər","2022"],["Xarici dövlətlər tərəfindən verilmiş xüsusi icazənin tanınması nəyə əsaslanır?","• Azərbaycan Respublikasının tərəfdar çıxdığı dövlətlərarası müqavilələrə əsaslanır.","2022"],["Xüsusi icazələri kim tərəfindən müəyyən edilmiş və hansı orqanlar tərəfindən verilir?","• Azərbaycan Respublikasının Prezidenti tərəfindən müəyyən edilmiş Mərkəzi İcra Hakimiyyəti orqanları tərəfindən verilir.\nƏcnəbilər və vətəndaşlığı olmayan şəxslər tərəfindən Azərbaycan Respublikasının ərazisində alınmış istehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan mallara görə ödənilmiş əlavə dəyər vergisinin qaytarılması\n376. Əcnəbilər və vətəndaşlığı olmayan şəxslər tərəfindən istehlak və ya kommersiya məqsədi üçün nəzərdə tutulmayan mallara görə ödənilmiş ƏDV-nin geri qaytarılması hansı mallara şamil edilmir?\n• Aksizli mallar\n• Ərzaq mallarına\n• ƏDV-dən azad edilən mallara\n• Külçə şəklində qiymətli metallar\n• Qiymətli daşlar\n• Nəqliyyat vasitələri və onların ehtiyyat hissələri\n377. ƏDV-nin alıcıya qaytarılması hansı yolla aparılır?\n• Nağd ödəniş\n• Bank kartı vasitəsilə\n378. Vergi ödəyicisi satıcı kimi qeydiyyata alınmaq üçün hansı orqan tərəfindən təsdiq edilmiş ərizə ilə hansı orqana müraciət etməlidir?\n• Azərbaycan Respublikası İqtisadiyyat Nazirliyi tərəfindən təsdiq edilmiş ərizə əsasında qeydiyyatda olduğu vergi orqanına müraciət etməlidir.\n379. Azərbaycan Respublikasında operator səlahiyyətlərini hansı orqan həyata keçirir?\n• Azərbaycan Respublikası İqtisadiyyat Nazirliyi","2022"],["Sərbəst zonaya gətirilə, orada saxlanıla, istifadə və emal oluna bilər və bu zaman hansı mallar sərbəst zona xüsusi gömrük proseduru altında yerləşdirilmiş hesab edilmir?","• Daxili mallar","2022"],["Sərbəst zonaya gətirilən, emal əməliyyatına məruz qalan və sərbəst zonada sərbəst dövriyyəyə buraxılmış malların daxili mallar gömrük statusunun təsdiq edilməsi üçün hansı əlavə sənədlər təqdim olunmalıdır?","• Malların gömrük dəyərini müəyyən edən sənəd ( invoys, hesab-faktura)\n• Malların mənşə sertifikatı\n• Sərbəst zona daxilində sərbəst dövriyyəyə buraxılışla bağlı gömrük orqanı tərəfindən təsdiq edilmiş müvafiq gömrük bəyannaməsinin surəti.","2022"],["Malların daxili mallar olmasına dair nə təqdim olunur və onun qüvvədə olma müddəti nə qədərdir?","• Şəhadətnamə\n• Qüvvədə olma müddəti 12 aydır.\nSahibkarlıq sahəsində aparılan yoxlamaların tənzimlənməsi və sahibkarların maraqlarının müdafiəsi haqqında\n383. Sahibkarlıq sahəsində aparılan yoxlama nə deməkdir?\n• Yoxlayıcı orqanların sahibkarların sahibkarlıq fəaliyyətinə dair məcburi tələblərini yerinə yetirmələrini qiymətləndirməsi üzrə tədbirlər məcmusudur.","2022"],["Mallardan dövlət xeyrinə imtina hansı orqanın icazəsi əsasında həyata keçirilir?","• Gömrük orqanının icazəsi əsasında","2022"],["Mallardan dövlət xeyrinə imtinaya icazə verilməsi üçün kim qərar qəbul edir?","• Gömrük orqanın rəhbəri tərəfindən","2022"],["Mallardan dövlət xeyrinə imtina nəyə səbəb olmamalıdır?","• Dövlət tərəfindən hər hansı bir xərcə səbəb olmamalıdır.","2022"],["Hansı mallardan dövlət xeyrinə imtina edilə bilməz?","• Azərbaycan Respublikasının qanunvericiliyinə uyğun olaraq qadağan edilmiş və ya məhdudlaşdırılmış mallardan ( istisna icazə sənədinin təqdim olunması)\n• Dövlət xeyrinə imtina hər hansı bir xərcə səbəb olan mallardan\n• Malların satışından əldə olunan gəlirləri gömrük orqanının xərclərini ödəməyən mallardan\n• Yararlılıq müddəti keçmiş və texniki norma-standartlara cavab verməyən mallardan\n• Qüsurlu mallardan\n• Sənaye tullantılarından\n• Radioaktiv maddələr və partlayıcı maddələrin tullantılarından\n• Raket yanacağının bütün növlərindən\n240. Malların məhv edilməsi hansı formada həyata keçirilir ?\n• Gömrük nəzarəti altında həyata keçirilir.","2022"],["Malların məhv edilməsi üsulları hansı tələblərə cavab verməlidir?","• Malların istehlak xassələrinin bərpasını istisna etməlidir.\n• Malların məhv edilməsi nəticəsində təhlükəli maddələrin və tullantıların əmələ gəlməsinə səbəb olmamalıdır.","2022"],["Malların məhv edilməsinin ətraf mühitə zərər vura biləcəyi hallar mövcud olduqda hansı orqanın rəyi alınmalıdır?","• Ekologiya və Təbii Sərvətlər Nazirliyinin","2022"],["Mallar hansı hallarda məhv edilir?","• Şəxslərin müraciəti olduqda\n• Gömrük orqanlarının təşəbbüsü ilə","2022"],["Şəxsin müraciəti əsasında hansı malların məhv edilməsinə icazə verilmir?","• Gətirilməsi qadağan olunmuş malların\n• Mədəni, tarixi, arxeoloji sərvətlərin\n• Nadir və nəsli kəsilməkdə olan heyvan və bitiki növlərinin, həmçinin onların hissələrinin və törəmələrinin","2022"],["Gömrük orqanı tərəfindən malların məhv edilməsinə hansı hallarda icazə verilmir?","• Malların məhv edilməsi ətraf mühitə və insan sağlamlığına zərər vura bilərsə\n• Dövlət üçün xərclərə səbəb ola bilərsə\n• Malların məhv edilməsinə nəzarət etmək imkanı olmazsa\nDövlət xeyrinə imtina edilmiş mallar və nəqliyyat vasitələrinin gömrük hərraclarında satılması\n246. Dövlət mülkiyyətinə keçirilmiş mallar və nəqliyyat vasitələrinin hərracı DGK-nin hansı orqanı tərəfindən və hansı qanunvericilik əsasında həyata keçirilir?\n• ―Azterminalkompleks‖ birliyi tərəfindən və mülki qanunvericiliyə uyğun olaraq","2022"],["Gönrük hərraclarında satışa çıxarılan malın ilkin qiyməti hansı formada müəyyən edilir?","• Sərbəst bazar qiymətinə uyğun olaraq","2022"],["Gömrük hərraclarında iştirak edən şəxs nə və hansı miqdarda ödəməlidir?","• İştirakla bağlı haqq ödəməlidir və malın ilkin qiymətinin 0,5 faizi miqdarında","2022"],["Gömrük hərraclarında iştirak haqqı qazana şəxslər hansı həcmdə beh verməlidir?","• Malın ilkin qiymətinin 5 faizi həcmində\n250. Malların gömrük hərraclarında satılması üçün nə yaradılır?\n• Hərrac Komissiyası yaradılır","2022"],["Hərrac komissiyasının tərkibi neçə nəfərdir və kimlərdən təşkil olunur?","• Hərrac komissiyasının tərkibi 5 nəfərdən ibarətdir.\n• DGK, Maliyyə Nazirliyinin və satış əməkdaşlarından ibarətdir.","2022"],["Hərrac komissiyasınln bir nəfər üzvü kim tərəfindən seçilir?","• DGK-nin sədri tərəfindən təyin edilir.","2022"],["Hərraca çıxarılmış mal ilk 2 satışda satılmadıqda üçüncü, dördüncü və beşinci hərracda nə dəyişiliklər olur?","• Üçüncü hərracda 10 faiz, Dördüncü hərracda 25 faiz, Beşinci hərracda 50 faiz malın ilkin qiyməti aşağı salınır.","2022"],["Mülki dövriyyədə olmasına yol verilməyən malların müsadirə edilməsinə yol verilmədiyi hallarda hansı tədbirlər görülür?","• Azərbaycan Respublikası ərazisindən çıxarılması və ya bu əraziyə geri qaytarılması\n256. Mülki dövriyyədə olmasına yol verilməyən malları gömrük ərazisindən çıxarmaq və ya bu əraziyə qaytarmaq dərhal mümkün olmadıqda hansı prosedur altında, hansı müddətə saxlanılır ?\n• Müvəqqəti saxlanc xüsusi gömrük proseduru altında, 3 gün saxlanılır.","2022"],["Dövlət mülkiyyətinə keçirilmiş və gömrük hərraclarında satılmamış qalan mallar barəsində hansı formalarda sərəncam verilir?","• Əvəzsiz olaraq aidiyyəti dövlət orqanlarına verilməsi\n• Təkrar emal\n• Məhv etmə","2022"],["Tez xarab olan mallar barəsində sərəncam verilməsi saxlanc müddəti bitdikdən sonra hansı müddət ərzində həyata keçirilir?","• 24 saat ərzində\nAksiz vergisi.\n259. Aksiz vergisi nədir ?\n• Aksizli malların satış qiymətinə tətbiq edilən vergidir.","2022"],["BYD hansı şərtlərə uyğun olaraq həyata keçirilir?","• Beynəlxalq yük daşımalarda altı aydan az olmayan təcrübəyə malik olan, əvvəlcədən daşımaya buraxılmış yol nəqliyyat vasitələri, nəqliyyat vasitələri qatarından və ya konteynerindən istifadə olunmalıdır.\n• BYD zəmanət birliyinin zəmanəti ilə təmin olunmalıdır.\n• Doldurulmuş və rəsmiləşdirilmiş BYD kitabçası ilə müşaiyət olunmalıdır.","2022"],["BYD-nin bir hissəsi BYD konvensiyasına üzv olmayan ölkə ərazisindən keçdikdə hansı tədbir görülür?","• BYD yolun bu hissəsində dayandırılır.","2022"],["BYD kitabçası neçə səhifəli üz qabığından ibarətdir və hansılardır?","• 4 səhifəli üz qabğıdından ibarətdir.\n• Qoparılmayan №1/№2 vərəqdən və №1/№2 kötüydən ( sarı vərəq)\n• Qoparılan №1 vərəqdən və №1 kötüydən ( ağ vərəq)\n• Qoparılan №2 vərəqdən və №2 kötüydən ( yaşıl vərəq)\n• Yol nəqliyyat hadisəsinə dair protokoldan ( sarı vərəq)","2022"],["Hansı vərəqlər göndərən və giriş gömrük orqanlarının istifadəsi üçün nəzərdə tutulmuşdur?","• Qoparılan №1 vərəqdən və №1 kötüydən ( ağ vərəq)","2022"],["Hansı vərəqlər çıxış və təyinat gömrük orqanlarının istifadəsi üçün nəzərdə tutulmuşdur?","• Qoparılan №2 vərəqdən və №2 kötüydən ( yaşıl vərəq)","2022"],["Multimodal daşıma nədir və bu zaman BYD kitabçasına nələr əlavə olunur?","• Multimodal daşıma çoxnövlü daşımadır\n• BYD kitabçasına xüsusi vərəq əlavə edilir.","2022"],["BYD kitabçasında düzəlişlər hansı yolla aparılır?","• Səhv yazılan məlumatın üstündən xətt çəkilir və onun üzərində düzgün məlumat yazılır.","2022"],["BYD kitabçasının etibarlılıq müddəti harda qeyd olunur?","• BYD kitabçasının üz qabığında yuxarı hissədə 1-ci qrafada\n• Əgər BYD kitabçası, onun etibarlılıq müddətinin sonuncu günü və ya həmin tarixədək göndərən gömrük orqanı tərəfindən rəsmiləşdirmə üçün qəbul edilmişsə, onda BYD kitabçası BYD daşıması təyinat gömrük orqanında başa çatanadək etibarlıdır.","2022"],["BYD kitabçasının etibarlılıq müddəti hansı orqan tərəfindən verilir və uzadılır və nəylə təsdiq edilir?","• Zəmanət Birliyi tərəfindən verilir və uzadılır. Zəmanət Birliyinin möhürü ilə təsdiq edilir.","2022"],["Gömrük qanunvericiliyi pozulduğu halda daşıyıcılar tərəfindən ödənilməli olan gömrük ödənişlərini hansı orqan ödəyir?","• Zəmanət Birliyi tərəfindən ödənilir.","2022"],["Hər bir BYD kitabçası üzrə gömrük ödənişlərinin ödənilməsinə hansı həcmdə təminat verir?","• 50000 ABŞ dolları həcmində","2022"],["Yol nəqliyyat vasitələri hansı sənədlə müşayiət olunmalıdır?","• Daşımaya buraxılış şəhadətnaməsi","2022"],["Buraxılış şəhadətnaməsi nə zaman təqdim edilmir?","• Ağırçəkili və irihəcmli mallar daşınan zaman","2022"],["Giriş (göndərən) gömrük orqanına hansı sənədlər təqdim olunmalıdır?","• Mal-müşayiət sənədləri\n• Daşımaya buraxılış şəhadətnaməsi\n• Göndərən ölkənin və ya tranzit ölkənin gömrük orqanları tərəfindən doldurulmuş və rəsmiləşdirilmiş BYD kitabçası","2022"],["Giriş (göndərən) gömrük orqanı BYD kitabçasını rəsmiləşdirərkən nələrə diqqət yetirir?","• Yük manifestinin doldurulmasına\n• BYD kitabçalarının kötüyündə göndərən gömrük orqanının və aralıq gömrük orqanlarının gömrük möhürlərinin olmasına;","2022"],["Giriş (göndərən) gömrük orqanı nəyə əmin olmalıdır?","• Daşımanı həyata keçirən şəxsin BYD kitabçasının üz qabğının 3-cü qrafasında eyd edilən şəxslə eyni olmasına","2022"],["Göndərən gömrük orqanının vəzifəli şəxsləri nəyi yoxlayır?","• Nəqliyyat vasitələrinin və ya konteynerlərin yük bölmələrinin texniki vəziyyətini yoxlayırlar\n• Konteynerlərdə buraxılış şəhadətnamələrinin və buraxılış lövhəciklərinin olmasını yoxlayırlar;\n• Gömrük möhür və plomblarının vəziyyətini yoxlayırlar;\n• Müstəsna hallarda gömrük yoxlaması keçirirlər.","2022"],["Təyinat gömrük orqanına hansı sənədlər təqdim olunmalıdır?","• Yük və mal müşayiəti sənədləri\n• Giriş gömrük orqanının qeydləri olan BYD kitabçası","2022"],["Aksizli malların BYD kitabçasının zəmanət həcmi nə qədərdir?","• 200000 ABŞ dolları","2022"],["Beynəlxalq yük daşınmasına icazə hansı orqan tərəfindən verilir (Azərbaycanda)?","• Dövlət Gömrük Komitəsi tərəfindən","2022"],["Beynəxalq yük daşınmasına buraxılması üçün şəxslərin siyahısını hansı orqan təqdim edir?","• Təminat birliyi","2022"],["Beynəlxalq yük daşınmasına buraxılması üçün şəxslərdən nələr tələb olunur?","• Beynəlxalq yük daşımalarda altı aydan az olmayan təcrübəyə malik olmaq;\n• BYD Konvensiyasında nəzərdə tutulmuş öhdəliklərin təmin edilməsi üçün maliyyə imkanlarının olması;\n• Daşıyıcı tərəfindən gömrük qaydalarının kobud surətdə pozulması faktının olmaması və vergi qanunvericiliyinin tələblərinə riayət olunması;\n• BYD Konvensiyasının tətbiqi ilə əlaqədar biliyə malik olmaq.","2022"],["İnzibati xətalar qanunvericiliyinin prinsipləri hansılardır?","• İnsan və vətəndaş hüquq və azadlıqlarının qorunması\n• Qanunçuluq\n• Qanun qarşsında bərabərlik\n• Təqsirsizlik prezumpsiyası\n• Ədalətlilik\n• İnzibati xətanın qarşısının alınması","2022"],["İnzibati xəta nədir?","• İctimai münasibətlərə qəsd edən, hüquqa zidd olan, təqsirli sayılan və inzibati məsuliyyətə səbəb olan əməl inzibati xəta hesab olunur.","2022"],["İnzibati xəta neçə cür törədilə bilər və hansılardır?","• Qəsdən törədilən\n• Ehtiyatsızlıqdan törədilən\n• Anlaqsız törədilən","2022"],["Hüquqi şəxs inzibati məsuliyyətə hansı şəxslərin törətdiyi inzibati xətaya görə cəlb edilir?","• Hüquqi şəxsin təmsil etmək səlahiyyətinə malik vəzifəli şəxs\n• Hüquqi şəxsin adından qərar qəbul etmək səlahiyyətinə malik vəzifəli şəxs\n• Hüquqi şəxsin fəaliyyətinə nəzarət etmək hüququ olan vəzifəli şəxs\n• Hüquqi şəxsin işçisi","2022"],["İnzibati tənbeh neçə hissəyə ayrılır və hansılardır?","• Əsas və əlavə tənbeh növlərinə ayrılır","2022"],["Yalnız əsas inzibati tənbeh növü kimi nələr tətbiq edilir?","• İctimai işlər\n• Xəbərdarlıq\n• İnzibati həbs\n• İnzibati cərimə","2022"],["Həm əsas, həm də əlavə tənbeh növü kimi nələr tətbiq edilir?","• Fiziki şəxsin hüququnun məhdudlaşdırılması\n• Azərbaycan Respublikasının hüdudlarından kənara inzibati qaydada çıxarılması\n• Predimentin müsadirəsi","2022"],["Şəxslərdən alınan inzibati cərimələr hansı məbləğlərdən yuxarı ola bilməz?","• Fiziki şəxslərdən maksimum 5000 manat\n• Vəzifəli şəxslərdən maksimum 10000 manat\n• Hüquqi şəxslərdən maksimum 50000 manat","2022"],["Hansı inzibati tənbeh növləri yalnız hakim tərəfindən tətbiq edilir?","• Predimentin müsadirəsi\n• Şəxsin hüquqlarının məhdudlaşdırılması\n• İctimai işlər","2022"],["İctimai işlər hansı müddətə tətbiq edilə bilər?","• 60 saatdan 240 saatadək gün ərzindən 4 saatdan çox olmamaq şərti ilə","2022"],["Azərbaycan Respublikasının hüdudlarından kənara çıxarma hansı müddətə tətbiq edilir?","• 1 il müddətindən 5 il müddətinədək","2022"],["İnzibati həbs hansı müddətə tətbiq edilir?","• 3 gündən 3 ayadək","2022"],["İnzibati xətaya görə məsuliyyəti yüngülləşdirən hallar hansılardır?","• Şəxsin yetkinlik yaşına çatmaması\n• Zəruri müdafiə və son zərurət halları\n• Səmimi peşmançılıq\n• Hamilə qadın və himayəsində azyaşlı uşağı olan qadın\n• Hərəkətin güclü ruhu həyəcan altında törədilməsi","2022"],["İnzibati xətaya görə məsuliyyəti ağırlaşdıran hallar hansılardır?","• Bir qrup şəxs tərəfindən törədilməsi\n• Yetkinlik yaşına çatmayanlara qarşı törədilməsi\n• Təbii fəlakət, fövqəladə hallar və hərbi vəziyyət dövründə törədilməsi\n• Sərxoş halda olan şəxs tərəfindən törədilməsi\nCinayət Məcəlləsi\n475. Cinayət Məcəlləsinin vəzifələri nələrdir?\n• Sülhü və bəşəriyyətin təhlükəsizliyini təmin etmək\n• Konstitusiya quruluşunu cinayətkar qəsdlərdən qorumaq\n• Cinayətlərin qarşısını almaq\n• İnsan və vətəndaş hüquq və azadlıqlarını, ətraf mühiti, ictimai təhlükəsizliyi qorumaq","2022"],["Gömrük ekspertizası kim tərəfindən təşkil edilir?","• Gömrük labaratoriyasının rəhbəri tərəfindən","2022"],["Mallardan prob və nümunələr kimlər tərəfindən götürülür?","• Gömrük orqanın vəzifəli şəxsləri tərəfindən\n• Gömrük orqanının vəzifəli şəxslərinin iştirakı ilə bəyannaməçi,mallar barəsində səlahiyyətli olan digər şəxslər tərəfindən\n• Gömrük orqanının vəzifəli şəxslərinin iştirakı ilə dövlət mütəxəssiləri və ekspertləri tərəfindən\n• Vəzifəli şəxslərin iştirakı ilə gömrük labaratoriyasının ekspetrləri tərəfindən götürülür","2022"],["Mallardan götürülən prob və nümunələr neçə hissəyə bölünür və hansı məqsədlər üçün istifadə olunur?","• 3 hissəyə bölünür\n• Labaratoriya tədqiqatlarının aparılması üçün\n• Təkrar və əlavə ekspertiza üçün\n• Yarana bilən mübahisələrin həlli üçün","2022"],["Gömrük ekspertizası hansı müddətə aparılır?","• Gömrük ekspertizası 20 iş günü müddətində aparılır. 4 aydan çox olmayan müddətə uzadıla bilər.","2022"],["Hansı hallarda gömrük ekspertizası vaxtı uzadılır?","• Əlavə tədqiqat aparılmasına ehtiyac olduqda\n• Ekspertiza mürəkkəb olduqda","2022"],["Gömrük ekspertizasının hansı növləri var?","• İlkin ekspertiza\n• Əlavə ekspertiza\n• Təkrar ekspertiza\n• Komisyon ekspertiza\n• Kompleks ekspertiza","2022"],["İlkin və əlavə ekspertiza nədir?","• İlk dəfə aparılan ekspertizadır\n• İlkin ekspertizaya dair rəydə qoyulmuş suallara tam cavab verilmədikdə və ya tədqiqat obyektinə dair əlavə suallar yarandıqda aparılan ekspertizadır. Əlavə ekspertizanın aparılması həmin və ya başqa ekspertə həvalə edilir;","2022"],["Təkrar ekspertiza nədir?","• Ekspert rəyinin əsaslandırılmadığı və ya onun düzgünlüyünə gömrük orqanlarında şübhə yarandığı hallarda, yaxud bəyannaməçinin, mallar barəsində səlahiyyəti olan digər şəxslərin və ya onların nümayəndələrinin şikayəti əsasında, keçirilməsi başqa ekspertə tapşırılmaqla aparılan ekspertizadır. Əvvəlki ekspertizanı aparmış ekspert təkrar\nekspertizada iştirak edə və izahlar verə bilər, lakin tədqiqat zamanı və rəy tərtib edilərkən iştirak edə bilməz. Təkrar ekspertiza aparıldıqda, ekspertə əvvəlki ekspertizanın sənədləri verilir;","2022"],["Komisyon ekspertiza nədir?","• Mürəkkəb ekspert tədqiqatlarının aparılması tələb olunduqda, gömrük laboratoriyasının rəhbərinin göstərişi əsasında eyni ixtisaslı ekspertlərin komissiyası tərəfindən aparılan ekspertizadır. Komisyon ekspertizanın aparılması zamanı ekspertlər arasında fikir ayrılığı yaranarsa, hər bir ekspert ayrıca rəy təqdim etmək hüququna malikdir.","2022"],["Kompleks ekspertiza nədir?","• Göstərilənlərin müəyyən edilməsi müxtəlif bilik sahələri, yaxud biliyin bir sahəsi daxilində müxtəlif üsullar sistemi əsasında yalnız bir neçə tədqiqat aparılmaqla mümkün olduqda aparılan ekspertizadır. Kompleks ekspertiza aparıldıqda, hər bir ekspert rəyin ona aid olan hissəsini imzalayır.","2022"],["Kollegiya üzvlərinin sayını və tərkibini kim təsdiq edir?","• Kollegiya üzvlərinin sayı və tərkibini prezident təsdiq edir.\nGömrük yığımları haqqında.\n65. Gömrük yığımı nədir ?\n• Gömrük yığımlarının tətbiqi daxili bazarın tənzimlənməsi və fiskal məqsədlər üçün deyil, gömrük orqanlarının göstərdiyi ximətin təxmini dəyərini əks elətdirir.\n66. Gömrük yığımlarının növləri hansılardır?\n• Gömrük nəzarətinin həyata keçirilməsi ilə bağlı gömrük yığımları\n• Gömrük müşayiətinə görə gömrük yığımları;\n• Malların saxlancına görə gömrük yığımları;\n• İxtisas attestanın verilməsinə görə gömrük yığımları;\n• Bank və ya bank olmayan kredit təşkilatlarının reysterə daxil edilməsinə görə gömrük yığımları.\n67. Gömrük nəzarətinin həyata keçirilməsi ilə bağlı gömrük yığımlarının növləri hansılardır?\n• Malların gömrük rəsmiləşdirilməsinə görə gömrük yığımları;\n• Malların gömrük ekspertizasının aparılmasına görə gömrük yığımları;\n• Malların gömrük nəzarəti altında məhvinə görə gömrük yığımları;","2022"],["Bank və bank olmayan kredit təşkilatlarının dövlət reyestrinə daxil edilməsi üçün nə qədər gömrük yığımı alınır?","• 2000 manat\nGömrük borcu və gömrük borcuna görə təminatın verilməsi haqqında.","2022"],["Avro-4 ekoloji norması Azərbaycan Respublikasında nə vaxtdan tətbiq edilir?","• 2014-cü il aprelin 1","2022"],["Ratiret avtonəqliyyat vasitəsi nədir?","• Azərbaycan Respublikası gömrük ərazisinə idxal edilən mühərriki, banı və şassisi orjinal vəziyyətdə olan və ya orjinal vəziyyətə gətirilmiş gömrük ərazisinə idxal edilənədək zavod buraxılış tarixindən 40 ildən çox vaxt keçmiş avtonəqliyyat vasitəsidir.","2022"],["Ratiret avtonəqliyyat vasitələri gömrük ərazisinə idxal olunan zaman hansı standart tələb olunur və bu standart neçənci ildən tətbiq olunur?","• Avro 2 standartı, 2010-cu ildən tətbiq edilir.\nFiziki şəxslər tərəfindən istehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan malların gömrük sərhədindən keçirilməsinin güzəştli və sadələşdirilmiş qaydaları\n155. Fiziki şəxslərin istehsal və kommersiya məqsədi üçün nəzərdə tutulmayan malların güzəştli və sadələşdirilmiş formada keçirilməsi qaydası hansı mallara şamil edilmir ?\n• Qadağan olunmuş və lisenziya tələb edən mallara şamil olunmur.","2022"],["Qeyri-rezidentlər müvəkkil banklarda valyuta hesabı aça bilərlərmi və bunun qaydalarını hansı orqanlar müəyyən edir?","• Qeyri-rezidentlər müvəkkil bankda valyuta hesabı aça bilərlər\n• Maliyyə bazarlarına nəzarət orqanı\n• Mərkəzi Bank","2022"],["Valyuta mübadiləsi həyata keçirmək istəyən fiziki və hüquqi şəxslər hansı sənədə malik olmalıdır və bu sənədin alınması üçün hara müraciət etməlidir?","• Valyuta mübadiləsi həyata keçirmək istəyən fiziki və hüquqi şəxslər lisenziyaya malik olmalıdır və bunun üçün maliyyə bazarlarına nəzarət orqanına müraciət etməlidir.","2022"],["Bank hesabı açılmadan hansı şəxslər Azərbaycan Respublikası ərazisindən kənara və ya Azərbaycan Respublikası ərazisinə pul köçürə bilər?","• Rezident və qeyri-rezident fiziki şəxslər","2022"],["Hansı şəxslər bank hesabı açılmadan pul köçürməsi həyata keçirə bilməz?","• Rezident və qeyri-rezident hüquqi şəxslər","2022"],["Rezident və qeyri-rezident fiziki şəxslərin bank hesabı açılmadan pul köçürməsi fəaliyyəti hansı formada olur?","• Bir əməliyyat günü ərzində 1000 ABŞ dolları ekvivalentində\n• Bir təqvim ayı ərzində 10000 ABŞ dolları ekvivalentində","2022"],["Azərbaycan Respublikasından kənara bank hesablarından xarici valyutada köçürmələr hansı əməliyyatlar üzrə aparıla bilər?","• İdxal olunan mallar və xidmətlərin ödənilməsi üzrə köçürmələr\n• Şəxsi məqsədlər üçün köçürmələr\n• Təkrar ixrac əməliyyatları üzrə köçürmələr\n• Qabaqcadan ödənilmiş, lakin icra olunmayan əməliyyatlar üzrə vəsaitlərin geri qaytarılması\n• Rezident hüquqi şəxslərin xaricdə açılmış filialları və nümayəndəliklərinə məqsədi bəyan edilməklə köçürmələr\n• Xaricdən cəlb edilmiş kreditlər və digər borc öhdəlikləri üzrə faiz, komisyon haqlar və cərimələrin ödənilməsi üzrə köçürmələr.\nGömrük təmsilçiliyi, gömrük brokeri, mütəxəssis, səalahiyyətli iqtisadi operator\n186. Gömrük təmsilçiliyi hansı formalarda ola bilər və formaların anlamı nədi ?\n• Birbaşa təmsilçilik --- təmsil edilən şəxsin tapşırığı ilə onun adından və onun mənafeyi üçün\n• Dolayı---təmsil edilən şəxsin tapşırığı ilə öz adından və onun mənafeyi üçün","2022"],["Gömrük borkeri nədir?","• Malların və nəqliyyat vasitələrinin gömrük ərazisinə gətirilməsi və ya gömrük ərazisindən aparılması, həmçinin tranziti ilə əlaqədar olaraq dolayı gömrük təmsilçiliyi həyata keçirən hüquqi şəxsdir.\n188. Gömrük borkeri ilə təmsil etdiyi şəxs arasında müqavilə hansı məcəlləyə uyğun olaraq bağlanılır ?\n• Mülki Məcəlləyə\n189. Gömrük borkeri kimi fəaliyyət göstərmək üçün hansı sənəd alınmalıdır və bu sənədin alınması üçün nə ödənilir ?\n• Lisenziya alınmalıdı və bu lisenziyanın alınmasına görə dövlət rüsumu ödənilir.\n190. Gömrük borkerinə münasibətdə gömrük sərhəddindən keçirilən malların uçotunun və onlar haqqında hesabatın düzgün olmaması gömrük orqanları tərəfindən hansı fəaliyyətin həyata keçirilməsinə səbəb olur?\n• Xüsusi Gömrük Auditinin","2022"],["Gömrük rəsmiləşdirilməsi üzrə mütəxəssisə dair tələblər hansılardır?","• Ali təhsilli olmalıdır.\n• Azərbaycan Respublikası vətəndaşı olmalıdır.","2022"],["İxtisas attestatının alınması üçün hara müraciət edilir?","• Dövlət Gömrük Komitəsinə","2022"],["Gömrük rəsmiləşdirilməsi üçün mütəxsəssis kimi fəaliyyət göstərməsi üçün hansı sahələrdə biliyi olmalıdır?","• Gömrük qanunvericiliyi və gömrük işi sahəsində\n• İqtisadiyyat, maliyyə-kredit, bank işi barədə\n• Xarici iqtisadi fəaliyyət və onun dövlət tənzimləməsi barədə\n• Maliyyə hüququ, cinayət hüququ, mülki hüquq, beynəlxalq hüquq barədə\n• Elektron məlumat sistemlərindən istifadə barədə","2022"],["İxtisas attestatına görə nə ödənilir və qüvvədə olma müddəti nə qədərdir?","• Gömrük yığımı ödənilir və qüvvədə olma müddəti 5 ildir.","2022"],["Komitə tərəfindən ixtisas attestatı hansı müddətə dayandırılır?","• 1 il müddətinə dayandırılır.","2022"],["Franko-zavod şərtli qiymət nədir?","• Malın sonuncu emala məruz qaldığı müəssisənin istehsalçısına ödənilməli olan qiymət.","2022"],["Əlavə Dəyər Vergisi nədir?","• Əlavə Dəyər Vergisi istehlak vergisinin bir növüdür. Bu vergi məhsula və ya materiala hər bir istehsal və çatdırılma mərhələsində əlavə olunan bazar dəyərinə qoyulur və axırda istehlakçının üzərinə düşür.","2022"],["Əlavə Dəyər Vergisinin ödəyiciləri kimlərdir?","• Əlavə Dəyər Vergisinin ödəyicisi kimi qeydiyyatdan keçən və qeydiyyatdan keçməli olan şəxslər verginin ödəyicisi hesab olunur.\n• Azərbaycan Respublikası ərazisində kənd təsərrüfatı mallarının pərakəndə və topdan satışı ilə məşğul olan şəxslər ƏDV ödəyicisi hesab olunur 2022-ci il yanvarın birindən 3 il müddətinə.\n• Azərbaycan Respublikası ərazisinə ƏDV tutulan malları idxal edən şəxlər bu cür idxal malları üzrə ƏDV-nin ödəyicisi sayılırlar.","2022"],["ƏDV ödəyicisinin qeydiyyat bildirişi neçə dəfə verilir və itirildiyi halda hansı tədbirlər görülür?","• Qeydiyyat bildirişi bir dəfə verilir və itirildiyi hallarda surəti təqdim edilir.","2022"],["ƏDV-nin məcburi qeydiyyat halları hansılardır?","• Ardıcıl 12 aylıq dövrün istənilən ayında vergi tutulan əməliyyatların həcmi 200000 manatdan artıq olduqda\n• Bir əqd və müqavilə üzrə ƏDV-yə cəlb olunan əməliyyatın ümumi məbləği 200000 manatdan artıq olduqda","2022"],["ƏDV qeydiyyatının ləğv edildiyi hallar hansılardır?","• ƏDV-yə cəlb olunan əməliyyatların aparılmağı dayandırıldıqda\n• Vergiyə cəlb olunan əməliyyatların məbləği tam 12 təqvim ayı ərazində 100000 manatdan azdırsa","2022"],["ƏDV-nin vergi tutma obyekti nələrdir?","• Təqdim olunan xidmətlər\n• Təqdim olunan mallar\n• İşlərin görülməsi\n• Azərbaycan Respublikası ərazisində istehsal olunan kənd təsərrüfatı məhsullarının pərakəndə satışı","2022"],["Kənd təsərrüfatı məhsullarının topdan və ya pərakəndə satışı zamanı tətbiq edilən ticarət əlavəsi hansı vaxtdan və neçə müddətə ƏDV-nin vergitutma obyektidir?","• 2022-ci il yanvar ayının 1-dən 3 il müddətinə","2022"],["Hansı fəaliyyətlər vergi tutulan əməliyyatlara daxil edilmir?","• Azərbaycan Respublikasından kənarda xidmətlər göstərilməsi və ya işlər görülməsi vergi tutulan əməliyyatlara daxil edilmir.","2022"],["Vergi tutulan idxalın dəyəri nədir?","• Malların Azərbaycan Respublikası Gömrük Qanunvericiliyinə uyğun olaraq müəyyən edilən gömrük dəyərindən və mallar Azərbaycan Respublikası ərazisinə gətirilərkən ödənilməli olan rüsumlar və vergilərdir.","2022"],["İdxal zamanı əlavə dəyər vergisindən azad edilən xammal və materiallar hansılardır?","• Gübrələr, kvarsit, kvars qumu, xrom filizləri, aliminium filizləri, hazrə çörək tozları, maya kulturaları, qara metal külçələri, propan, butan, dikalsium fosfat, E vitamini və onun törəmələri.","2022"],["ƏDV-dən azad olma halları hansılardır?","• Milli və ya xarici valyutanın, həmçinin qiymətli kağızların göndərilməsi və ya idxal edilməsi;\n• Mərkəzi Bankının və Dövlət Neft Fondunun aktivlərində yerləşdirilməsi üçün nəzərdə tutulan qızılın, habelə Mərkəzi Bankının valyuta sərvətlərinin, xaricdə istehsal edilmiş Azərbaycan Respublikası pul nişanlarının, yubiley sikkələrinin və digər bu qəbildən olan qiymətlilərin idxalı;\n• Siyahısı MİHO-nun müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilən kütləvi informasiya vasitələri məhsullarının və kitabların, həmin malların istehsalı ilə bağlı rulon və ya vərəqə şəklində kağızın idxalı və satışı;\n• Azərbaycan Respunlikasında qeydiyyatdan keçmiş humanitar təşkilatlar tərəfindən yardım məqsədilə gətirilən mallar\n• Texniki yardım məqsədilə gətirilən mallar\n• Kənd təsərrüfatı məhsullarının istehsalçıları tərəfindən özlərinin istehsal etdikləri kənd təsərrüfatı məhsullarının satışı üzrə dövriyyələr - 2014-cü il yanvarın 1-dən 10 il müddətinə;\n• Fiziki şəxslər tərəfindən gömrük sərhəddindən keçirilən istehsal və kommersiya mqəsədləri üçün nəzərdə tutulmayan mallar\n• Xüsusi iqtisadi zonaya idxal edilən mallar ( aksizli mallar istisna olmaqla)\n• Damazlıq heyvanların idxalı və satışı\n• Toxum və tinglərin idxalı və satışı\n• Mineral gübrələrin və pestisidlərin idxalı və satışı\n• 10 nəfərdən çox adamı daşımaq üçün nəzərdə tutulan sıxılmış qazla işləyən avtobusların idxalı – 2020-ci ilin yanvarın1-dən 5 il müddətinə\n• Elektrik mühərriklə işləyən avtomobillərin idxalı və satışı\n• İstehsal tarixi 3 ildən və mühərrik həcmi 2500 kubsantimetrdən çox olmayan avtomobillərin idxalı və satışı – 2022-ci il yanvarın 1-dən 4 il müddətinə\n• Kəpəyin istehsalı və satışı – 2019-cu il martın 1-dən 5 il müddətinə\n• Buğdanın idxalı və satışı, buğda ununun və çörəyin istehsalı və satışı - 2017-ci il yanvarın 1-dən 7 il müddətinə;\n• Elektrik mühərriki ilə işləyən avtomobillər üçün ikinci və üçüncü səviyyə elektrik enerji doldurucularının idxalı və satışı - 2022-ci il yanvarın 1-dən 3 il müddətinə;\n• Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) təsdiqedici sənədi əsasında müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqanın (qurumun) yenidən qurulması layihəsi çərçivəsində avadanlıqların və ehtiyat hissələrinin idxalı – 2023-cü il yanvarın 1-dən 3 il müddətinə.","2022"],["ƏDV-nin 0 (sıfır) dərəcə ilə tətbiq edildiyi hallar hansılardır?","• Diplomatik və konsulluq nümayəndələrinin rəsmi istifadə və ailə üzvlərinin şəxsi istifadəsi üçün nəzərdə tutulan mallar\n• Xaricdən alınan qrantlar hesabına malların idxalı\n• Beynəlxalq və tranzit sərnişin və yük daşıması\n• Azərbaycan Respublikası Mərkəzi Bankına qızıl və digər qiymətlilərin göndərilməsi\nMallardan dövlət xeyrinə imtina edilməsi və malların məhv edilməsi.","2022"],["Aksiz vergisinin ödəyicisi kimlərdir?","• Azərbaycan Respublikası ərazisində aksili malların istehsalı və idxalı ilə məşğul olan bütün müəssisələr və fiziki şəxslər\n• Azərbaycan Respublikasının hüdudlarından kənarda bilavasitə özü və ya podratçı vasitəsilə aksizli malları istehsal edən və istehsal etdiyi yerdə vergi ödəyicisi kimi qeydiyyatda olmayan Azərbaycan Respublikası rezidentləri","2022"],["Aksizin vergitutma obyekti nələrdir?","• Azərbaycan Respublikası ərazisində istehsal edilən aksizli malların istehsal binasının hüdudlarından kənara çıxarıldıqda\n• İdxal olunan mallara münasibətdə - Gömrük Məcəlləsinə uyğun olaraq aksizli mallar gömrük nəzarətindən çıxması","2022"],["Neft məhsulları üçün vergi tutulan əməliyyatın məbləği nədir?","• Topdansatış bazar qiymətindən aşağı olmayan məbləğdir.","2022"],["İdxal olunan avtobuslar, minik avtomobilləri, platin, qızıl, almaz bu məhsulların vergi tutma əməliyyatı necə aparılır?","• Platinin hər qramına\n• Qızılın min çəki vahidinə\n• Almazın hər karatına\n• Avtobuslar və minik avtomobillərinin mühərriklərinin həcminə\n264. Aksizli malların ixracı zamanı mallar hansı dərəcə ilə vergiyə cəlb olunur ?\n• Sıfır dərəcə ilə vergiyə cəlb olunur","2022"],["Aksizli mallar hansılardır?","• Spirtli içkilər\n• Tütün məhsulları\n• Xəz-dəri məlumatları\n• Minik avtomobilləri və avtobuslar\n• Qızıl,platin,almaz\n• Neft məhsulları\n• İstirahət və idman üçün yaxtalar\n• Enerji içkiləri","2022"],["Aksizli mallardan azad olma halları hansılardır?","• 1,5 litr alkoqollu içki\n• 200 ədəd siqaret\n• 20 qram qızıl\n• 0,5 karat almaz\n• Azərbaycan Respublikası ərazisindən tranzit daşınan mallar\n• Mərkəzi Bankın aktivlərində yerləşdirilməsi üçün qızıl, platin, almaz\n• Dövlət Neft Fondunun aktivlərində yerləşdirilməsi üçün qızıl\n• İdxal olunan platin, qızıl, almaz ----2021-ci il yanvarın 1-dən 3 il müddətinə","2022"],["Minik avtomobillərində aksiz dərəcəsi necə hesablanır?","• 0-2000 kubsantimetr ----0,30 manat\n• 2000-3000 kubsantimetr ---- 600 manat + 5 manat\n• 3000-4000 kubsantimetr ---- 5600 manat + 13 manat\n• 4000-5000 kubsantimetr ---- 18600 manat +35 manat\n• 5000-6000 kubsantimetr ---- 53600 manat + 70 manat","2022"],["Avtobuslarda aksiz dərəcəsi necə hesablanır?","• 0-4000 kubsantimetr ----- 2 manat\n• 4000-6000 kubsantimetr ---- 8000 manat + 4 manat\n• 6000-8000 kubsantimetr ---- 16000 manat + 6 manat\n• 8000-10000 kubsantimetr ---- 28000 manat +8 manat\n• 10000 kubsantimetr yuxarı ---- 44000 manat + 10 manat","2022"],["İdxal olunan platində aksiz dərəcəsi necə hesablanır?","• Hər qramına 4 manat","2022"],["İdxal olunan qızıla aksiz dərəcəsi necə hesablanır?","• 375 əyar üçün 1,5 manat ( hər qramına)\n• 500 əyar üçün 2 manat\n• 585 əyar üçün 2,4 manat\n• 750 əyar üçün 3 manat\n• 958 əyar üçün 5 manat\n• 999 əyar üçün 6 manat","2022"],["İdxal olunan almaza aksiz dərəcəsi necə hesablanır?","• 1 karat üçün 400 manat\n• 1-2 karat üçün 2 əmsal\n• 2-3 karat üçün 3 əmsal\n• 3-4 karat üçün 4 əmsal\n• 4-5 karat üçün 5 əmsal\n• 5 karatdan yuxarı 10 əmsal","2022"],["İdxal olunan xəz-dəri məmulatlarına aksiz necə hesablanır?","• Topdan satış bazar qiymətinin 10%","2022"],["İdxal olunan idman və istirahət məqsədləri üçün yaxtalar və digər üzən vasitələr aksiz dərəcəsi necə hesablanır?","• Mühərrik həcminin 1 kubsantimetrinə görə 6 manat\nİxrac nəzarəti haqqında\n274. İxrac nəzarəti nədir?\n• İxrac nəzarətinə düşən malların Azərbaycan Respublikası ərazisinə gətirilməsinə, bu ərazidən çıxarılmasına və tranzitinin Azərbaycan Respublikası qanunvericiliyi ilə müəyyən edilmiş qaydalara uyğun həyata keçirilməsinin təmin edən tədbirlər toplusudur.","2022"],["İxrac nəzarətinə düşən mallar hansılardır?","• İkili təyinatlı mallar\n• Nüvə və xüsusi qeyri-nüvə materialları\n• Kütləvi qırğın silahları və onların çatdırılma vasitələri\n• Hərbi texnika, silah-sursatın yaradılmasında istifadə edilən mallar","2022"],["İkili təyinatlı mallar nədir?","• Mülki məqsədlər üçün istifadə edilən, lakin hərbi texnika və silah sursatın, kütləvi qırğın silahlarının hazırlana bilməsində istifadə edilə bilən mallardır.","2022"],["İxrac nəzarəti haqqında qanunvericiliyin tətbiq sahələri hansılardır?","• İxrac nəzarətinə düşən malların ixracı, təkrar ixracı, idxalı, təkrar idxalı, tranziti və xarici iqtisadi fəaliyyətin digər sahələrinə tətbiq edilə bilər.","2022"],["İxrac nəzarətinin həyata keçirilməsinin məqsədi nədir?","• Azərbaycan Respublikasının milli təhlükəsizliyinin təmin edilməsi\n• Azərbaycan Respublikasının iqtisadi, siyasi və hərbi maraqlarının təmin edilməsi\n• Tərəfdar çıxdığı kütləvi qırğın silahlarının və başqa növ silahların yayılmaması barədə öhdəliklərə riayət edilməsi.","2022"],["İxrac nəzarətinə düşən malların ixracı, idxalı, təkrar ixracı, təkrar idxalı, tranziti nə əsasında həyata keçirilir?","• Müvafiq icra hakimiyyəti orqanı tərəfindən verilmiş xüsusi icazə sənədi əsasında\n280. İxrac nəzarəti haqqında qanunvericiliyin pozulmasına görə hansı məsuliyyəti daşıyırlar?\n• İnzibati məsuliyyətə\n• Cinayət məsuliyyətinə\n• Mülki məsuliyyətə\nGömrük sərhəddindən boru kəmər və elektirikötürücü xətlər vasitəsilə keçirilən mallar haqqında.\n281. Gömrük sərhəddindən boru kəməri vasitəsilə keçirilən mallarla əlaqədər nə tələb olunmur ?\n• Gömrük orqanlarına faktiki təqdim olunması\n282. Boru kəmər vasitəsilə keçirilən malların seçilmiş gömrük proseduru altında yerləşdirilənədək hansı şərtlə və hansı vəziyyətdə saxlanılır ?\n• Müvəqqəti saxlanc xüsusi gömrük proseduru altında saxlanılmaması şərtilə, qəbul məntəqələrində saxlanılır.\n283. Boru kəməri vasitəsilə keçirilən mallar üzərində hansı əməliyyatlar aparıla bilməz?\n• Özgəninkiləşdirilmə,istifadə və mallar barəsində sərəncam verilmə","2022"],["Lisenziya nədir?","• Müvafiq sahibkarlıq fəaliyyəti növlərinin həyata keçirilməsi üçün şəxsə verilən rəsmi sənəddir.","2022"],["Lisenziyanın hansı növləri var?","• 2 növü var\n• Ümumi lisenziya--- lisenziya verilən sahibkarlıq sahəsi və onun bütün alt növlərinin hər biri üçün xüsusi lisenziya almadan həyata keçirmək hüququ verən lisenziyadır.\n• Xüsusi lisenziya--- lisenziya tələb olunan fəaliyyət növünün yalnız bir və ya bir neçə alt növünü həyata keçirməyə icazə verən lisenziyadır.","2022"],["Lisenziya haqqında qanun tətbiq dairəsi nədir?","• Azərbaycan Respublikası ərazisində fəaliyyət göstərən, təşkilati hüquqi formasından asılı olmayaraq, bütün hüquqi şəxslərə, xarici hüquqi şəxslərin filial və nümayəndələrinə və fərdi sahibkarlara, habelə lisenziya verən orqana şamil olunur ( maliyyə bazarları sahəsi istisna olmaqla)","2022"],["Lisenziya tələb olunan fəaliyyət növləri hansı meyarlar nəzərə alınmaqla müəyyən olunur?","• Fəaliyyət növü dövlət təhlükəsizliyinə təsir edir.\n• Fəaliyyət növü məhdud təbii ehtiyatların istifadəsini nəzərdə tutur.\n• Fəalyyət növü ətraf mühitin ekoloji vəziyyətinə mənfi təsir göstərə bilər.\n• Fəaliyyət növü qeyri-məhdud sayda şəxsin həyatı, sağlamlığı və əmlakı üçün təhlükə doğurur.","2022"],["Lisenziyadan istifadə hüququ yalnız kimə məxsusdur?","• Lisenziyanın sahibinə","2022"],["Lisenziyanın etibarlılıq müddəti nə qədərdir?","• Müddətsiz verilir.","2022"],["Lisenziya tələb edən sahələr hansılardır (Gömrüklə əlaqəli olan )?","• Təhlükəli yüklərin nəqliyyat vasitəsilə daşınmasına, o cümlədən ölkə ərazisindən tranzit keçirilməsinə icazə;\n• Dini təyinatlı ədəbiyyatın audio və videomaterialların, mal və dini məzmunlu başqa məlumat materiallarının istehsalına, idxalına, ixracına və yayılmasına razılıq;\n• Dəniz nəqliyyatı sahəsində beynəlxalq müqavilələrə uyğun olaraq verilən sənədlər;\n• Mülki aviasiya sahəsində beynəlxalq müqavilələrə uyğun olaraq verilən sənədlər;\n• “İxrac nəzarəti haqqında” Azərbaycan Respublikasının Qanununa əsasən ixrac nəzarətinə düşən malların ixracı, təkrar ixracı, idxalı, təkrar idxalı və tranziti üçün icazə;\n• İxrac edilən heyvanlara, heyvan mənşəli məhsullara və xammala beynəlxalq baytarlıq sertifikatı;\n• Elektrik enerjisinin nəqlinə icazə;\n• Qazın nəqli üçün icazə;\n• Neft və neft məhsullarının boru kəmərləri vasitəsilə nəqlinə icazə;","2022"],["İcazə sahibi nə deməkdir?","• Gömrük qanunvericiliyi ilə müəyyən edilmiş qaydada malların emalı və xüsusi istifadə xgp altında yerləşdirilməsi üzrə icazə almış şəxsdir.","2022"],["Əməliyyatların uçotu hansı formada olur və uçot məlumatlarında qeyd olunan malların miqdarı necə göstərilir?","• Kağız üzərində yazılı formada olur.\n• Xarici iqtisadi fəaliyyətin aml nomenklaturasında nəzərdə tutulan ölçü vahidində göstərilir.\nAzərbaycanın qoşulduğu gömrüklə əlaqəli Beynəlxalq Konvensiyalar haqqında.\n334. Azərbaycanın 1992-ci ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?\n• ― Mülki avisasiya haqqında‖ Beynəlxalq Konvensiya (1944, Çikaqo)\n• ―Konsul əlaqələri haqqında‖ Vyana Konvensiyası ( 1963,Vyana)\n• ―Diplomatik əlaqələr haqqında‖ Vyana Konvensiyası (1961, Vyana)\n• ―Nüvə silahlarının yayılmaması haqqında‖ Saziş (1968, Moskva, London, Vaşinqton)\n• BMT-nin ― Narkotik və psixotrop maddələrin qeyri-qanuni dövriyyəsinə qarşı mübarizə haqqında‖ Konvensiyası (1988, Vyana)","2022"],["Azərbaycanın 1996-cı ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?","• ― Ozon qatını dağıdan maddələr üzrə‖ Monreal Protokolu (1987-ci il)\n• ―Beynəlxalq Yük Daşımaları haqqında‖ Gömrük Konvensiyası (1975, Cenevrə)","2022"],["Azərbaycanın 1997-ci ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?","• ―Yük nişanlanması haqqında‖ Beynəlxalq Konvensiya (1966-cı il)\n• ―Mədəni sərvətlərin qanunsuz olaraq gətirilməsinin, çıxarılmasının və onların üzərində mülkiyyət hüququnun başqasına verilməsinin qadağan edilməsi və qarşısının alınmasına yönəldilmiş tədbirlər haqqında‖ Konvensiya (1970, Paris)","2022"],["Azərbaycanın 1998-ci ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?","• ―Kökünün kəsilməsi təhlükəsi olan vəhşi fauna və flora növlərinin beynəlxalq ticarəti haqqında (CİTİES)‖ Konvensiyası (1973, Vaşinqton)\n• BMT-nin ― Psixotrop vasitələr haqqında‖ Konvensiyası (1971-ci il)\n• BMT-nin ― Narkotik vasitələr haqqında‖ Konvensiyası (1961-ci il)","2022"],["Azərbaycanın 2000-ci ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?","• ―Sərhəddə yüklərin nəzarətdən keçirilməsi şərtlərinin razılaşdırılması haqqında‖ Beynəlxalq Konvensiya (1982-ci il)\n• ―Beynəlxalq Yük Daşımaları Müqaviləsi haqqında‖ Konvensiya (1956-cı il)\n• ―Konteynerlər haqqında‖ Gömrük Konvensiyası (1972-ci il, Cenevrə)\n• ―Malların təsviri və kodlaşdırılması üzrə Harmonikləşdirilmiş Sistem haqqında‖ Beynəlxalq Konvensiya (1983-cü il , Brüssel)\n• ― Yol nəqliyyat vasitələrinin ticarət və kommersiya məqsədi ilə müvəqqəti idxalının‖ Gömrük Konvensiyası (1956-cı il, Cenevrə)","2022"],["Azərbaycanın 2001-ci ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?","• BMT ―Təhlükəli tullantıların sərhədlərarası daşınmasına və kənarlaşdırılmasına nəzarət haqqında‖ BAZEL Konvensiyası (1989-cu il, Bazel şəhəri)","2022"],["Azərbaycanın 2002-ci ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?","• ―Gömrük hüquqpozmalarının qarşısının alınması, tədqiq edilməsi və aradan qaldırılmasına dair qarşılıqlı inzibati yardım haqqında‖ Beynəlxalq Konvensiya (1977,Nayrobi)","2022"],["Azərbaycanın 2003-cü ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?","• ―Gömrük prosedurunun sadələşdirilməsi və uzlaşdırılması haqqında‖ Beynəlxalq Konvensiya (1973-cü il, Kioto)","2022"],["Azərbaycanın 2012-ci ildə qoşulduğu Beynəlxalq Konvensiyalar hansılardır?","• ―Ümumidünya Poçt‖ Konvensiyası və Yekun Protokol (2008-ci il, Cenevrə)\n• “Beynəlxalq Dəmiryol Daşımaları haqqında” Konvensiyaya (KOTİF) -2015-ci il\nYol vergisi haqqında.\n343. Yol vergisinin ödəyiciləri kimlərdir?\n• Azərbaycan Respublikası ərazisinə daxil olan və həmin ərazidə sərnişin və yük daşıması üçün istifadə edən avtonəqliyyat vasitələrinin sahibi olan qeyri-rezident şəxslər\n• Azərbaycan Respublikası ərazisində avtomobil benzini, dizel yanacağı və maye qaz istehsalı və ya idxalı ilə məşğul olan şəxslər","2022"],["Yol vergisinin vergitutma obyekti nədir?","• Azərbaycan Respublikası ərazisinə daxil olan və bu ərazini tərk edən zaman yol vergisinə cəlb olunmalı olan xarici dövlətlərdə qeydiyyatda olan avtonəqliyyat vasitələri","2022"],["Xarici ölkədə qeydiyyatda olan minik avtomobillərinin 1 ay ərzində ölkədə qalması üçün hansı dərəcələrdə vergi ödənilir?","• 2000 kubsantimetrə qədər 15 ABŞ dolları\n• 2000-4000 kubsantimetr 20 ABŞ dolları\n• 4000 kubsantimetrdən çox 40 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan minik avtomobillərinin 3 ay ərzində ölkədə qalması üçün hansı dərəcədə vergi ödənilir?","• 2000 kubsantimetrə qədər 30 ABŞ dolları\n• 2000-4000 kubsantimetr 40 ABŞ dolları\n• 4000 kubsantimetrdən çox 60 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan minik avtomobillərinin 1 ilə qədər ölkədə qalmasına görə hansı dərəcədə vergi ödənilir?","• 2000 kubsantimetrə qədər 60 ABŞ dolları\n• 2000-4000 kubsantimetr 80 ABŞ dolları\n• 4000 kubsantimetrdən çox 120 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan minik avtomobillərinin 1 ildən çox ölkədə qalmasına görə hansı dərəcədə vergi ödənilir?","• 2000 kubsantimetrə qədər 60 ABŞ dolları + hər gün üçün 0,5 ABŞ dolları\n• 2000-4000 kubsantimetr 80 ABŞ dolları + hər gün üçün 0,6 ABŞ dolları\n• 4000 kubsantimetrdən çox 30 ABŞ dolları + hər gün üçün 1,2 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan avtobusların 1 gün üçün ölkədə qalmasına görə hansı dərəcədə vergi ödənilir?","• Oturacaq yerlərinin sayı 12-dək -15 ABŞ dolları\n• Oturacaq yerlərinin sayı 13-30 -20 ABŞ dolları\n• Oturacaq yerlərinin sayı 31və ondan yuxarı -25 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan avtobusların 1 həftə üçün ölkədə qalmasına görə hansı dərəcədə vergi ödənilir?","• Oturacaq yerlərinin sayı 12-dək -30 ABŞ dollar\n• Oturacaq yerlərinin sayı 13-30 – 40 ABŞ dolları\n• Oturacaq yerlərinin sayı 31və ondan yuxarı – 50 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan avtobusların 1 ay üçün ölkədə qalmasına görə hansı dərəcədə vergi ödənilir?","• Oturacaq yerlərinin sayı 12-dək -100 ABŞ dolları\n• Oturacaq yerlərinin sayı 13-30 – 140 ABŞ dolları\n• Oturacaq yerlərinin sayı 31və ondan yuxarı – 175 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan avtobusların 3 ay üçün ölkədə qalmasına görə hansı dərəcədə vergi ödənilir?","• Oturacaq yerlərinin sayı 12-dək – 300 ABŞ dolları\n• Oturacaq yerlərinin sayı 13-30 – 400 ABŞ dolları\n• Oturacaq yerlərinin sayı 31və ondan yuxarı – 500 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan avtobusların 1 il üçün ölkədə qalmasına görə hansı dərəcədə vergi ödənilir?","• Oturacaq yerlərinin sayı 12-dək – 1050 ABŞ dolları\n• Oturacaq yerlərinin sayı 13-30 – 1400 ABŞ dolları\n• Oturacaq yerlərinin sayı 31və ondan yuxarı – 1750 ABŞ dolları","2022"],["Xarici ölkədə qeydiyyatda olan avtobusların 1 ildən çox ölkədə qalmasına görə hansı dərəcədə vergi ödənilir?","• Oturacaq yerlərinin sayı 12-dək – 1050 ABŞ dolları + hər gün üçün 12 ABŞ dolları\n• Oturacaq yerlərinin sayı 13-30 – 1400 ABŞ dolları+ hər gün üçün 15 ABŞ dolları\n• Oturacaq yerlərinin sayı 31və ondan yuxarı – 1750 ABŞ dolları+ hər gün üçün 20 ABŞ dolları\nXarici Ticarətin Gömrük Statistikası\n355. Xarici ticarətin gömrük statistikası ( XTGS) nələrə əsasən formalaşır?\n• Gömrük bəyannamələrində\n• Gömrük orqanlarına təqdim edilən digər sənədlərdə olan məlumatlar əsasında formalaşır.","2022"],["XTGS-yə hansı məlumatlar daxil edilir?","• İdxalı respublikanın maddi ehtiyatlarını artıran mallara dair məlumatlar\n• İxracı respublikanın maddi ehtiyatlarını azaldan mallara dair məlumatlar","2022"],["XTGS-nin aparılmasında əsas məqsədlər nələrdir?","• Xarici ticarət axınının əsas tendensiyası, dinamikası və strukturunun təhlili\n• Makroiqtisadi göstəricilərin proqnozlaşdırılması\n• Miqdar,dəyər və orta qiymət indeksinin hesablanması\n• XİF-in tənzimlənməsində tarif və qeyri-tarif tədbirlərinin tətbiq edilməsi nəticələrinin təhlili\n• Gömrük ödənişlərinin dövlət büdcəsinə daxil olmasına nəzarətin həyata keçirilməsi","2022"],["XTGS-nin əsas göstəriciləri hansılardır?","• XİF MN üzrə malın adı\n• XİF MN üzrə malın kodu\n• Malın mənşə ölkəsi\n• Malı göndərən ölkə\n• Malın təyinat ölkəsi\n• Ticarət edən ölkə\n• Malın statistik dəyəri\n• Malın Netto şəkisi\n• Hesabat dövrü\n• Malın hərəkət istiqaməti\n• Əlavə ölçü vahidi üzrə malın miqdarı","2022"],["Hansı hallarda malların idxalı göndərən ölkə üzrə aparılır?","• Malın mənşə ölkəsi məlum olmadıqda\n• ―Təkrar idxal‖ gp altında yerləşdirilmiş mallar üçün\n• 97-ci mal qrupuna daxil olan mallar üçün (İncəsənət əsərləri, kolleksiya əşyaları və antikvariat)","2022"],["Hansı hallarda malın idxalı ticarət edən ölkə üzrə aparılır?","• Malın mənşə ölkəsi və göndırın ölkə məlum olmadıqda","2022"],["Hansı hallarda malın ixracı ticarət edən ölkə üzrə aparılır?","• Malın təyinat ölkəsi məlum olmadıqda","2022"],["Aylıq, rüblük və illik məlumatlar hansı müddət ərzində DGK-nin rəsmi internet saytında yerləşdirilir və ya mətbu orqanda dərc edilir?","• Aylıq göstəricilər növbəti ayın 15-nə kimi\n• Rüblük göstəricilər sonrakı rübdə 90 gün ərzində\n• İllik göstəricilər növbəti ilin ikinci rübünün sonunadək","2022"],["Xüsusi gömrük statistikası nədir?","• Azərbaycan Respublikası xarici ticarət gömrük statistikası ilə bağlı olmayan, Azərbaycan Respublikası gömrük orqanlarının fəaliyyətinin müxtəlif istiqamətlərini əks etdirən, onların fəaliyyətini optimallaşdırmaq və tənzimləmək üçün nəzərdə tutulmuş sistemləşdirilmiş məlumatlar məcmusudur.","2022"],["Xüsusi gömrük statistikasının predimenti nələrdir?","• Gömrük orqanlarının fəaliyyətinin müşahidə edilməsi və öyrənilməsidir.\n• Gömrük orqanlarının fəaliyyətinin statistik və mühasibat uçotu şəklində faktiki məlumatlarla əks etdirilməsidir.","2022"],["Gömrük orqanının fəaliyyət istiqamətlərinə hansı müşahidə obyektləri daxildir?","• Valyuta nəzarəti\n• Gömrük prosedurları\n• Gömrük dəyərinə nəzarət\n• Gömrük ödənişlərinin tutulması\n• Risklərin idarə edilməsi sistemi\n• Əməliyyat-axtarış fəaliyyəti\n• Vəzifəli şəxslərin peşə hazırlığı\n• Gömrük işi sahəsində cinayətlərlə və gömrük hüquqpozmaları ilə mübarizə","2022"],["Yoxlayıcı orqan nədir?","• Sahibkarlıq sahəsində məcburi tələblərin yerinə yetirilməsini yoxlamaq səlahiyyəti verilmiş dövlət orqanı və ya publik hüquqi şəxsdir.","2022"],["Yoxlamanın predimenti nədir?","• Sahibkarların məcburi tələblərə riayət etməsinin qiymətləndirilməsidir.","2022"],["Yoxlayıcı hansı hallarda yoxlama apara bilməz?","• Yoxlanılan hüquqi şəxsin təsisçisi olduqda\n• Yoxlanılan hüquqi şəxsin təsisçisinin , fərdi sahibkarın yaxın qohumu olduqda","2022"],["Yoxlama neçə cür ola bilər və hansılardır?","• 2 cür olur\n• Plan üzrə yoxlama\n• Plandankənar yoxlama","2022"],["Plan üzrə yoxlamaların təşkili və aparılması üçün sahibkarlar hansı risk qruplarına bölünür?","• Yüksək ---- Ümumi sahibkarların 10 faizdən çox olmayan hissəsi bu qrupa daxil edilir.\n• Orta---- Sahibkarların 30 faizdən çox olmayan hissəsi bu qrupa daxil edilir.\n• Aşağı ---- Sahibkarların yerdə qalan hissəsi bu qrupa daxil edilir.","2022"],["Sahibkarlar üzərində plan üzrə yoxlamanın dövriliyi nəydən aslıdır?","• Sahibkarların daxil edildiyi risk qruplarından aslıdır.","2022"],["Aşağı, orta və yüksək risk qrupuna daxil olan sahibkarların plan üzrə yoxlamaların dövriliyi nə qədərdir?","• Aşağı risk qrupu ---- üç ildə bir dəfədən çox olmayaraq\n• Orta risk qrupu ---- iki ildə bir dəfədən çox olmayaraq\n• Yüksək risk qrupu---- bir ildə bir dəfədən çox olmayaraq","2022"],["Plan üzrə yoxlamanın müddəti nə qədərdir?","• İri sahibkarlar ---- 10 iş günü müddətindən artıq olmamalıdır\n• Mikro, orta və xırda sahibkarlar ----5 iş günündən artıq olmamalıdır","2022"],["Plandankənar yoxlamanın müddəti nə qədərdir?","• İri sahibkarlar ---- 5 iş günündən artıq olmamalıdır\n• Mikro, xırda və orta sahibkarlar ---- 3 iş günündən artıq olmamalıdır.\nBüdcə sistemi haqqında.\n393. Büdcə nədir?\n• Azərbaycan Respublikasının müvafiq dövlət hakimiyyəti və özünüidarəetmə orqanları vasitəsilə dövlətə və bələdiyələrə məxsus vəzifə və funksiyaları yerinə yetirmək üçün lazım olan pul vəsaitinin yığılması və istifadə olunması üçün əsas maliyyə sənədidir.","2022"],["Büdcə ili nədir?","• Yanvar ayının 1-dən dekabr ayının 31-dək olan bir illik dövrdür.","2022"],["Büdcə kəsri (defisiti) nədir?","• Büdcə xərclərinin gəlirlərlə təmin olunmayan məbləğidir.","2022"],["Büdcə artıqlığı (profisiti) nədir?","• Büdcə gəlirlərinin büdcə xərclərindən artıq olan məbləğidir.","2022"],["Dotasiya nədir?","• Dövlət büdcəsindən NMR büdcəsinə və yerli büdcələrə onların gəlir və xərclərini tənzimləmək məqsədilə əvəzsiz verilən maliyyə vəsaitidir.","2022"],["Qrant nədir?","• Daxili və xarici mənbələr hesabına əvəzsiz verilən məqsədli maliyyə yardımıdır.","2022"],["Subvensiya nədir?","• Məqsədli maliyələşdirmənin həyata keçirilməsi üçün dövlət büdcəsindən NMR büdcəsinə və yerli büdcələrə verilən, lakin həmin məqsəd üçün və ya müəyyən edilmiş müddətdə istifadə edilmədikdə geri qaytarılan maliyyə vəsaitidir.","2022"],["Subsidiya nədir?","• Dövlət büdcəsindən NMR büdcəsinə, yerli büdcələrə və hüquqi şəxslərə əvəzsiz olaraq verilən maliyyə vəsaitidir.","2022"],["Transfert nədir?","• Dövlət büdcəsindən NMR büdcəsinə, yerli büdcələrə, büdcədən kənar dövlət fondlarına, məqsədli büdcə fondlarına, büdcədən kənar dövlət fondlarından və məqsədli büdcə fondlarından dövlət büdcəsinə və yerli büdcələrə, NMR büdcəsinə əvəzsiz olaraq köçürülən maliyyə vəsaitidir.","2022"],["Azərbaycan Respublikasının büdcə sisteminə nələr daxildir?","• Dövlət büdcəsi\n• Naxçıvan Muxtar Respublikasının büdcəsi\n• Yerli büdcələr","2022"],["Müdafiə olunan və sekvestr tətbiq olunmayan xərclər hansılardır?","• Əmək haqqı\n• Əmək haqqına üstəlik\n• Pensiya, başqa sosial müavinətlər və ödənişlər\n• Dövlətin xarici və daxili borclarına xidmətlə bağlı xərclər","2022"],["Məqsədli büdcə fondu nədir?","• Dövlət büdcəsinin, Naxçıvan Muxtar Respublikasının büdcəsinin, yerli büdcələrin tərkibində konkret tapşırıqların həyata keçirilməsi üçün formalaşan və istifadə edilən pul vəsaitidir. Bu fondlar müstəqil mədxail mənbələrinə malik ola bilərlər.","2022"],["Ehtiyyat fondları hansılardır?","• Dövlət büdcəsinin ehtiyat fondları dövlət büdcəsinin 5faizindən artıq olmamalıdır.\n• Azərbaycan Respublikası Prezidentinin ehtiyat fondları dövlət büdcəsinin gəlirlərinin 2 faizindən artıq olmamalıdır.\n• NMR büdcəsinin ehtiyyat fondaları\n• Yerli büdcələrin ehtiyat fondları","2022"],["Dövlət büdcəsinin gəlirləri nələrdir?","• Dövlət vergiləri\n• Qrantlar\n• Digər gəlirlər\n407. Dövlət büdcəsinin xərclərinə nələr daxildir ?\n• Cari xərclər: əmək haqqı, əmək haqqına üstəlik, pensiya, sosial müavinətlər, qrant, subsidiyalar\n• Əsaslı xərclər : əsas vəsaitlərin alınması, səhmlərin alınması, kapital qoyuluşları\n• Kreeditlər üzrə borclar, faizlərə xidmət xərcləri və layihələrdə pay iştirakı","2022"],["Dövlət büdcəsinin tərtibi prosesi nə vaxt başlanılır?","• Növbəti büdcə ilinə 11 ay qalmış başlanır.\nİdxal olunan malların kabotaj daşınması.\n409. Kabotaj daşıma zamanı eyniləşdirmə tədbirlərindən hansı hallarda istifadə edilir?\n• Şəxsin müraciəti olduqda\n• Gəminin göyərtəsindən malların götürülməsi ehtimalı olduqda\n• Gəminin göyərtəsində kabotaj daşınan mallardan başqa mallar yerləşdirildikdə","2022"],["Reysterə daxil edilməsi üçün hansı sənədlər təqdim edilməlidir?","• Resyterə daxil olması üçün ərizə\n• Son kənar audit yoxlamalrının nəticələrinin surəti\n• Maliyyə hesabatları\n• Bank fəaliyyətini həyata keçirmək üçün lisenziya\n• Bank qarantiyasını imzalamaq hüququ olan şəxsin notarial qaydada təsdiq edilmiş imza və möhür nümunələri","2022"],["Reysterə daxil olması üçün təqdim edilmiş sənədlərə hansı müddət ərzində baxılır?","• Komitə tərəfindən 30 təqvim günü ərzində baxılır","2022"],["Minimum nizamnamə kapitalından 2 dəfə çox olduqda banklar və bank olmayan kredit təşkilatları üçün təminatın maksimal məbləği nə qədərdir?","• Banklar üçün bir qarantiya üzrə ---- 1 mln ABŞ dolları\n• Banklar üçün bütövlükdə belə qarantiyalar üzrə ----2 mln ABŞ dolları\n• Bank olmayan kredit təşkilatları üçün bir və ya bir neçə qarantiya üzrə ---- 150 min ABŞ dolları","2022"],["Minimum nizamnamə kapitalından 1,5 dəfə çox olduqda banklar və bank olmayan kredit təşkilatları üçün təminatın maksimal məbləği nə qədərdir?","• Banklar üçün bir qarantiya üzrə---500 min ABŞ dolları\n• Banklar üçün bütövlükdə belə qarantiyalar üzrə---1 mln ABŞ dolları\n• Bank olmayan kredit təşkilatları üçün bir və ya bir neçə qarantiya üzrə---100 min ABŞ dolları","2022"],["Minimum nizamnamə kapitalından 1 dəfə çox olduqda banklar və bank olmayan kredit təşkilatları üçün təminatın maksimal məbləği nə qədərdir?","• Banklar üçün bir qarantiya üzrə---250 min ABŞ dolları\n• Banklar üçün bütövlükdə belə qarantiyalar üzrə---500 min ABŞ dolları\n• Bank olmayan kredit təşkilatları üçün bir və ya bir neçə qarantiya üzrə---50 min ABŞ dolları\n424. Komitə reysterdən çıxarılmış kredit təşkilatları haqqında yazılı məlumatı hansı orqana təqdim edir?\n• Maliyyə Bazarlarına Nəzarət Palatasına\nƏDV üzrə gömrük borcu haqqında.\n425. ƏDV üzrə gömrük borcu hesablanarkən nə əsas götürülür?\n• ƏDV üzrə gömrük borcu hesablanarkən Gömrük məcəlləsi və ― Gömrük tarifi haqqında‖ qanuna əsasən malın gömrük dəyəri əsasında hesablanır.","2022"],["ƏDV üzrə gömrük borcu kimlər tərəfindən və hansı pul vahidi ilə ödənilir?","• İstənilən maraqlı şəxs tərəfindən ödənilə bilər\n• Azər baycan Respublikasının Milli Valyutası ilə ödənilir.","2022"],["ƏDV üzrə gömrük borcunun ödənilməsində məsul olan şəxslər kimlərdir?","• Gömrük orqanına gömrük bəyannaməsi təqdim edən şəxs\n• Adından gömrük bəyannaməsi təqdim edilən şəxs","2022"],["ƏDV üzrə gömrük borcu idxal və ixrac olunan mallara münasibətdə hansı vaxtdan hesablanır?","• İdxal olunan mallara münasibətdə mallar gömrük sərhəddindən keçirilərkən\n• İxrac olunan mallara münasibətdə mallar dair gömrük bəyannaməsi təqdim olunduğu gündən","2022"],["ƏDV üzrə gömrük borcu necə hesablanır?","• ƏDV = (D+A+R)V/100\n• D-gömrük dəyəri\n• A- aksiz\n• R-gömrük rüsumu\n• V- qüvvədə olan vergi dərəcəsi","2022"],["ƏDV üzrə gömrük borcu nə zaman ödənilir?","• Mallara dair gömrük bəyannaməsi təqdim edilərkən\n• Gömrük bəyannaməsinin təsdiqi ilə eyni vaxtda ödənilir.","2022"],["Dövri bəyannamə verildiyi halda ƏDV üzrə gömrük borcu hansı müddət ərzində ödənilməlidir?","• 15 gündən gec olmayaraq Rüsumsuz ticarət mağazaları.\n432. Rüsumsuz ticarət mağazalarında hansı mallar satıla bilər?\n• Gömrük rüsumlarından, vergilərdən və ticarət siyasəti tədbirlərindən azad olmaqla son istifadə xüsusi gömrük proseduru altında yerləşdirilən mallar\n• Şəxsi istifadə üçün nəzərdə tutulmuş mallar","2022"],["Rüsumsuz ticarət mağazalarının ərazisi nə hesab edilir?","• Gömrük nəzarəti zonası","2022"],["Mağazanın fəaliyyətinə hansı orqan nəzarət edir?","• Rüsumsuz ticarət mağazalarının fəaliyyətinə yaradıldığı ərazi üzrə məsul gömrük orqanı nəzarət edir.","2022"],["Mağazanın yaradılmasına hansı orqan icazə verir?","• Dövlət Gömrük Komitəsi","2022"],["Mağazanın yaradılmasına verilən icazənin müddəti nə qədərdir?","• İcazə müddəti 5 ildir.","2022"],["Mağaza hansı yerlərdə yaradıla bilər?","• Beynəlxalq Hava Limanının gömrük nəzarəti zonasında\n• Beynəlxalq Dəniz Limanının gömrük nəzarəti zonasında\n• Gömrük Sərhəd Buraxılış Məntəqələrinin gömrük nəzarəti zonasında","2022"],["Mağaza hansı hissələrdən ibarət olmalıdır?","• Ticarət zalı\n• Köməkçi otaq\n• Anbar","2022"],["Mağaza sahibi hansı müddət ərzində gömrük orqanına məlumat verməlidir?","• Mağaza sahibi 3 ayda bir dəfədən çox olmayaraq mağazaya daxil edilmiş və satılmış mallar barəsində gömrük orqanına məlumat verməlidir.","2022"],["Cinayət məsuliyyətini nə yaradır?","• Cinayət tərkibinin bütün əlamətlərinin mövcud olduğu əməlin törədilməsi","2022"],["Cinayət Məcəlləsi hansı prinsiplər əsasında fəaliyyət göstərir?","• Qanunçuluq\n• Qanun qarşısında bərabərlik\n• Ədalət\n• Humanizm\n• Təqsirə görə məsuliyyət","2022"],["Cinayət qanununun nə üzrə tətbiqinə yol verilmir?","• Analogiya üzrə ( məntiqi cəhətdən bənzətmə, eyni yolla mühakimə üsulu)","2022"],["Cinayət nədir?","• Cəza təhdidi altında qadağan olunmuş ictimai təhlükəli əməlin təqsirli olaraq törədilməsi cinayət sayılır.","2022"],["Cinayət əməllərinin təsnifatı necədir?","• Böyük ictimai təhlükə törətməyən əməllər\n• Az ağır\n• Ağır\n• Xüsusilə ağır cinayətlər","2022"],["Cinayət residivi nədir?","• Qəsdən cinayət törətməyə görə əvvələr məhkum edilmiş şəxs tərəfindən yenidən qəsdən cinayət törədilməsi cinayət residivi sayılır.","2022"],["Cinayətin törədilməsi neçə cür təsnif edilir və hansılardır?","• Qəsdən törədilən\n• Ehtiyatsızlıqdan törədilən əməllər","2022"],["Kimlər cinayətin iştirakçıları sayılır?","• Cinayətin icraçısı\n• Təşkilatçısı\n• T     for (const w of m.keys()) df.set(w, (df.get(w) || 0) + 1);

  IDX = { docs, df, n: R.length };
}
function nearest(text, k) {

    for (const w of qs) { const wt = m.get(w); if (wt) { s += wt * Math.log(1 + IDX.n / (IDX.df.get(w) || 1)); hits++; } }
    if (hits >= 2 || (hits === 1 && qs.size === 1)) sc.push([s, i]);

/* ---------- answers ---------- */
function prose(text) {
  const out = []; let ul = null;
  for (const raw of String(text).split('\n')) {
    const l = raw.trim(); if (!l) continue;
    const m = l.match(/^[•\-–]\s*(.+)$/);
    if (m) { if (!ul) { ul = h('ul'); out.push(ul); } ul.append(h('li', { text: m[1] })); }
    else { ul = null; out.push(h('p', { text: l })); }

}

/* ---------- queues ---------- */
const W = q => (/2025|2024/.test(q.src) ? 4 : /2023/.test(q.src) ? 3 : 1);
const wshuffle = a => a.map(q => [Math.pow(Math.random(), 1 / W(q)), q]).sort((x, y) => y[0] - x[0]).map(x => x[1]);
function daily(n) {
  const due = Q.filter(q => isDue(q.id)).sort((a, b) => P.p[a.id][0] - P.p[b.id][0] || P.p[a.id][1] - P.p[b.id][1]);
  const fresh = wshuffle(Q.filter(q => !isSeen(q.id) && (TOP[q.t].g === 'n' || TOP[q.t].g === 'u')));
  const out = due.slice(0, Math.ceil(n * 0.6));
  for (const q of fresh) { if (out.length >= n) break; out.push(q); }
  for (const q of due.slice(out.length)) { if (out.length >= n) break; if (out.indexOf(q) < 0) out.push(q); }
  return out.map(q => q.id);
}
