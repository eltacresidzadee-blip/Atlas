<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout idea: one narrow column, phone first. A question is a card; its answer opens under it; two marks decide when it comes back. */
:root{
  --paper:#eaefed; --surface:#ffffff; --sunk:#f3f6f5; --ink:#14201d; --muted:#586a66; --line:#cfd9d5;
  --accent:#0d5a4c; --accent-ink:#ffffff;
  --good:#1c7a4b; --warn:#a86400; --bad:#b0352a;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1614; --surface:#17211e; --sunk:#131c19; --ink:#e4ece9; --muted:#93a5a0; --line:#2b3a35;
    --accent:#5cc2ac; --accent-ink:#06231d; --good:#62c48d; --warn:#e2ab52; --bad:#f08375; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1614; --surface:#17211e; --sunk:#131c19; --ink:#e4ece9; --muted:#93a5a0; --line:#2b3a35;
  --accent:#5cc2ac; --accent-ink:#06231d; --good:#62c48d; --warn:#e2ab52; --bad:#f08375; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,summary,select{touch-action:manipulation}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.4rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.82rem;font-weight:700;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px calc(56px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
header.top{display:flex;gap:10px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
header.top p{color:var(--muted);font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)} .small{font-size:.88rem} .nums{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{flex:1 1 140px}
.note{border-left:3px solid var(--warn);background:var(--sunk);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.note:empty{display:none}
input[type=search],select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px;min-height:44px;max-width:100%}
input[type=search]{width:100%;-webkit-appearance:none;appearance:none;font-size:16px}
select{font-size:16px}
.btn,.trow,.seg button,.star{-webkit-appearance:none;appearance:none}
.back{align-self:flex-start}

/* home */
.today{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figs{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.95rem}
.figs b{font-variant-numeric:tabular-nums}
.topics{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 84px 52px;gap:10px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%;min-height:48px}
.trow:hover{background:var(--sunk)}
.trow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.track{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .k{background:var(--good)} .track .f{background:var(--bad)}

/* question card */
.q{font-family:var(--display);font-size:1.3rem;line-height:1.35;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}
.ans{background:var(--sunk);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.ans ul{margin:0;padding-left:20px}
.ans .sim{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.ans .sim:first-of-type{border-top:0;padding-top:0}
.ai{border:1px dashed var(--accent);border-radius:8px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* list */
details.it{border-bottom:1px solid var(--line)}
details.it summary{cursor:pointer;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 2px;list-style:none;min-height:44px}
details.it summary::-webkit-details-marker{display:none}
details.it .body{padding:0 2px 14px 22px;display:flex;flex-direction:column;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);margin-top:7px;background:transparent}
.dot.k{background:var(--good);border-color:var(--good)} .dot.f{background:var(--bad);border-color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.star{border:0;background:transparent;cursor:pointer;font-size:1.25rem;line-height:1;padding:6px;color:var(--muted);min-width:40px;min-height:40px}
.star[aria-pressed="true"]{color:var(--warn)}
@media (max-width:480px){
  .q{font-size:1.15rem}
  .today{grid-template-columns:minmax(0,1fr)}
  .trow{grid-template-columns:minmax(0,1fr) 56px 44px}
}
</style>
</head>

a hökumət institutları tərəfindən yaradılmış və tətbiq edilə bilən qaydalar toplusu, onun dəqiq tərifi uzun müddətdir müzakirə olunan bir məsələdir.\n\"Hüquq\" sözü ərəbcədən \"haqq\" sözünün çoxluğunu ifadə edir. Bu söz ingilis dilində \"right\" sözünə uyğun gəlir.\nMüasir hüquq ədəbiyyatında hüququn ümumi qəbul edilmiş anlayışı yoxdur. Müxtəlif nəzəriyyələrdə hüquqa fərqli tərif verilmişdir.","2023"],["Beynalxalq hüququn prinsiplər hansılardır?","Beynəlxalq hüquq doktrinası on universal prinsipi fərqləndirir:\nGüc tətbiq edilməməsi və güc təhdidi prinsipi;\nBeynəlxalq mübahisələrin sülh yolu ilə həlli prinsipi;\nDövlətlərin daxili səriştəsinə aid olan məsələlərə qarışmamaq prinsipi;\nDövlətlərin bir-biri ilə əməkdaşlıq etməsi öhdəliyi prinsipi;\nBərabər hüquqlar və xalqların öz müqəddəratını təyinetmə prinsipi;\nDövlətlərin suveren bərabərliyi prinsipi;\nBeynəlxalq hüquq çərçivəsində öhdəliklərin vicdanla yerinə yetirilməsi prinsipi;\nDövlət sərhədlərinin toxunulmazlığı prinsipi;\nDövlətlərin ərazi bütövlüyü prinsipi;\nİnsan hüquqlarına və əsas azadlıqlarına hörmət prinsipi.","2023"],["Hansı beynalxalq təşkilatlara üzvük?","1991-ci il 8 dekabr ---- İslam Konfansı Təşkilatı İKT ( ilk üzv olduğumuz təşkilat )\n1992-ci il 30 yanvar----Avropada Təhlükəsizlik və Əməkdaşlıq Təşkilatı ATƏT ( üzv olduğumuz ilk Avropa təşkilatı )\n1992-ci il 2 mart ---- Birləşmiş Millətlər Təşkilatı BMT\n1992-ci il iyul ---- İqtisadi Əməkdaşlıq Təşkilatı (ECO)\n1992ci il ---- Qaradəniz iqtisadi əməkdaşlıq təşkilatı\n1993-cü il 24 sentyabr ---- Müstəqil Dövlətlər Birliyi MDB\n1997-ci il ----- GUAM\n2001-ci il ----- AŞ parlament Assembleyası\n2011-ci il ----- Qoşulmamaq ittifaqı\n2013-cü il 25 yanvar ------ TAQM","2023"],["Azərbaycanı dəstəkləyən ölkələr hansılardır?","Türkiyə, İsrail, Ukrayna, Gürcüstan, Macarıstan, Moldova, Bosniya Hersoqovina","2023"],["Azərbaycanı dəstəkləyən təşkilatlar hansılardır?","İslam Əməkdaşlığı Təşkilatı\nBeynəlxalq Qoşulmama Hərəkatı\nTürk şurası","2023"],["Əsrin müqaviləsi haqqında danışın","Əsrin müqaviləsi – 1994-cü ilin sentyabrın 20-də Bakıda \"Xəzər dənizinin Azərbaycan sektorunda \"Azəri\", \"Çıraq\" yataqlarının dərinlikdə yerləşən hissəsinin birgə işlənməsi və hasil olunan neftin pay şəklində bölüşdürülməsi\" haqqında dünyanın 11 ən iri neft şirkəti ilə bağlanmış müqavilə.\nMüqavilə öz tarixi, siyasi və beynəlxalq əhəmiyyətinə görə \"Əsrin müqaviləsi\" adlanmış, təxminən 400 səhifə həcmində və 4 dildə öz əksini tapmışdır. \"Əsrin müqaviləsi\"ndə dünyanın 8 ölkəsinin (Azərbaycan, ABŞ, Böyük Britaniya, Rusiya, Türkiyə, Norveç, Yaponiya və Səudiyyə Ərəbistanı) 13 ən məşhur neft şirkəti (Amoco, BP, McDermott, UNOCAL, ARDNŞ, Lukoil, Statoil, Exxon, Türkiyə Petrolları, Pennzoil, ITOCHU, Ramco, Delta) iştirak etmişdir.Sual:","2023"],["Rusiyanın müttəfiqləri hansı ölkələrdi?","Kollektiv Təhlükəsizlik Müqaviləsi Təşkilatı (KTMT) üzvləri\nErmənistan\nQazaxıstan\nQırğızıstan\nTacikistan\nÖzbəkistan","2023"],["Excel funksiyalar:","Riyazi funksiyalar:\nSUM – seçilmiş diapazondakı və ya xanalardakı ədədlərin cəmini hesablayır.\nSUMIF – verilmiş diapazondakı yalnız şərti ödəyən ədədləri toplayır.\nABS – ədədin modulunu tapır.\nFACT – verilmiş ədədin faktorialını hesablayır.\nPOWER – birinci verilənin qüvvətinə ikinci veriləni qaldırır (qüvvətə yüksəldir).\nPRODUCT – verilmiş xanalardakı ədədlərin hasilini tapır.\nStatistik funksiyalar:\nAVERAGE – seçilmiş diapazonda olan ədədlərin ədədi ortasını tapır (toplayıb sayına bölür).\nCOUNT – seçilmiş diapazonda yalnız ədəd olan xanaları sayır.\nCOUNTA – seçilmiş diapazonda boş olmayan xanaları sayır.\nCOUNTIF – diapazonun müəyyən şərtini ödəyən ədədlərini saymaq üçündür.\nMAX – verilmiş diapazondakı ədədlərin ən böyük olanını tapır.\nMIN – verilmiş diapazondakı ədədlərin ən kiçik olanını tapır\nMətn funksiyaları\nLEFT – xanadakı məlumatın sol kənarından müəyyən sayda simvol seçməyə imkan verir.\nRIGHT – xanadakı məlumatın sağ kənarından lazım olan sayda simvolları seçmək üçündür.\nLEN – xanadakı simvolların sayını tapır.\nMəntiqi funksiyalar\nIF – funksiyasından istifadə edərək şərtdən asılı olaraq hər hansı əməliyyatlardan birini icra etmək olar.\nAND – məntiqi funksiyası ilə xanalardakı ədədlərə birdən çox şərt tətbiq etmək olar.\nOR – verilmiş iki və ya daha çox sayda şərtdən ən az birini ödəyən verilənləri seçir.\nNOT – əgər şərt ödənirsə, nəticə “FALSE”, əks halda “TRUE” olacaq, yəni nəticəni əksinə göstərir.\nTRUE – xanaya “TRUE” qiymətini daxil edir.\nFALSE – xanaya “FALSE” qiymətini daxil edir.","2023"],["Xalqın suverenliyi haqqında danışın.","Xalqın suverenliyi\nSərbəst və müstəqil öz müqəddəratını həll etmək və öz idarəetmə formasını müəyyən etmək Azərbaycan xalqının suveren hüququdur.\nAzərbaycan xalqı öz suveren hüququnu bilavasitə ümumxalq səsverməsi - referendum və ümumi, bərabər və birbaşa seçki hüququ əsasında sərbəst, gizli və şəxsi səsvermə yolu ilə seçilmiş nümayəndələri vasitəsilə həyata keçirir.","2023"],["Hakimiyyətin bölünməsi haqqında danışın.","Azərbaycan Respublikasında dövlət hakimiyyəti hakimiyyətlərin bölünməsi prinsipi əsasında təşkil edilir:\n- qanunvericilik hakimiyyətini Azərbaycan Respublikasının Milli Məclisi həyata keçirir;\n- icra hakimiyyəti Azərbaycan Respublikasının Prezidentinə mənsubdur;\n- məhkəmə hakimiyyətini Azərbaycan Respublikasının məhkəmələri həyata keçirir.\nBu Konstitusiyanın müddəalarına əsasən qanunvericilik, icra və məhkəmə hakimiyyətləri qarşılıqlı fәaliyyәt göstərir və öz səlahiyyətləri çərçivəsində müstəqildirlər.","2023"],["Konstitusiyaya görə vətəndaşların hansı azadlıqları var?","Fikir və söz azadlığı Maddə\nVicdan azadlığı Maddə\nSərbəst toplaşmaq azadlığı\nMəlumat azadlığı Maddə\nYaradıcılıq azadlığı","2023"],["Konstitusiyaya görə vətəndaşların hansı vəzifələri var?","Vergilər və başqa dövlət ödənişləri\nVətənə sədaqət\nDövlət rəmzlərinə hörmət\nVətəni müdafiə\nTarix və mədəniyyət abidələrinin qorunması\nƏtraf mühitin qorunması","2023"],["Konstitusiyaya görə yalnız Azərbaycan Respublikası vətəndaşlarına məxsus hüquqlar hansılardır?","Cəmiyyətin və dövlətin siyasi həyatında iştirak hüququ\nDövlətin idarə olunmasında iştirak etmək hüququ\nSeçki hüququ\nMüraciət etmək hüququ","2023"],["Gömrük tənzimlənməsi nədir?","Gömrük tənzimlənməsi - gömrük sərhədindən malları və nəqliyyat vasitələrini keçirmək hüququndan istifadə edən şəxslərin riayət etməli olduğu norma və qaydaların müəyyən olunmasıdır.\nGömrük tənzimlənməsi gömrük qanunvericiliyinə və xarici ticarətin dövlət tənzimlənməsinə dair qanunvericiliyə, beynəlxalq müqavilələrə uyğun olaraq həyata keçirilir.\nDövlət Gömrük Komitəsi gömrük işi sahəsində dövlət siyasətini və tənzimlənməsini həyata keçirir.\nAzərbaycan Respublikası gömrük işi sahəsində qanunvericiliyinin və bu sahədə təcrübənin beynəlxalq hüququn normalarına və ümumi qəbul olunmuş beynəlxalq təcrübəyə uyğunlaşdırılması məqsədi ilə gömrük tənzimlənməsi sahəsində beynəlxalq əməkdaşlıqda iştirak edir.","2023"],["Daxili mallar nədir?","Daxili mallar – Azərbaycan Respublikasında tamamilə istehsal olunmuş, yaxud emala məruzqalma meyarlarına uyğun olaraq kifayət qədər emal edilmiş və ya sərbəst dövriyyə üçün buraxılmış mallar","2023"],["Hansı etik davranış qaydaları var?","Şəxsi məsuliyyət\nXidməti davranış prinsipləri\nİctimai etimad\nİctimaiyyətlə münasibət\nMaraqların toqquşmasının qarşısının alınması\nKorrupsiya hallarının qarşısının alınması\nHədiyyə alma ilə əlaqədar məhdudiyyətlər\nXidməti vəsaitlərdən və əmlakdan istifadə\nMəlumatlardan istifadə\nXidmətdənkənar davranış\nMəsuliyyət","2023"],["Maraqların toqquşmasının qarşısının alınması nədir?","Gömrük orqanı əməkdaşı xidmət zamanı maraqların toqquşmasına yol verməməli, öz vəzifə səlahiyyətlərindən və xidməti mövqeyindən şəxsi maraqları üçün istifadə etməməlidir.\nXidməti vəzifələri ilə onun şəxsi maraqları arasında ziddiyyət yarana biləcəyi hallarda, xidməti vəzifəsinin icrası zamanı onunla xüsusi münasibətdə olan hər hansı bir şəxsə qarşı qərar qəbul edilməsi nəticəsində maraqların toqquşması əmələ gəldiyi hallarda, bu barədə öz rəisinə məlumat verməlidir.\nDövlət qulluqçuları və digər vəzifəli şəxslər tərəfindən vəzifə səlahiyyətləri çərçivəsində özünün yaxud yaxın qohumlarının şəxsi və ya maddi maraqlarına toxunan yaxud toxuna bilən qərarların qəbul edilməsi və ya belə qərarların qəbulunda iştirak və ya vəzifə səlahiyyətləri ilə bağlı digər hərəkətlərin edilməsi halları maraqlar toqquşması hesab edilir.","2023"],["İnzibati İcraat haqqinda qanunun prinsipləri hansılardır?","1.Hüquqi dövlətin ümumi prinsipləri\n2.Qanunçuluq prinsipi\n3.Bərabərlik prinsipi\n4.Etimad hüququnun qorunması prinsipi\n5.Diskresion səlahiyyətlərin həyata keçirilməsi qaydası\n6.Formal tələblərdən sui-istifadənin qadağan olunması\n7.Hüququn tətbiqindən imtinanın qadağan olunması\n8.Mütənasiblik prinsipi\n9.Çoxun azı ehtiva etməsi prinsipi\n10.Mötəbərlik prezumpsiyası","2023"],["Etik davranış qaydalarının pozulması hansı məsuliyyətə səbəb olur?","Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksində təsbit olunmuş prinsip və qaydalara gömrük orqanı əməkdaşı tərəfindən əməl edilməməsi, həmçinin, digər əməkdaşlar və vəzifəli şəxslər tərəfindən həmin prinsip və qaydaların pozulması hallarına göz yumulması xidməti intizamın pozulması kimi qiymətləndirilir və «Gömrük orqanlarında xidmət haqqında» Əsasnamədə nəzərdə tutulmuş intizam məsuliyyəti doğurur.","2023"],["Gömrük qanunvericiliyi nələrdən ibarətdir?","Gömrük qanunvericiliyi Azərbaycan Respublikasının Konstitusiyasından, Gömrük Məcəlləsindən, “Gömrük tarifi haqqında” Azərbaycan Respublikasının Qanunundan, “Antidempinq, kompensasiya və mühafizə tədbirləri haqqında” Azərbaycan Respublikasının Qanunundan, onlara uyğun olaraq qəbul edilmiş digər normativ hüquqi aktlardan və Azərbaycan Respublikasının tərəfdar çıxdığı beynəlxalq müqavilələrdən ibarətdir.","2023"],["Gömrük orqanlarının məcburi qərarları haqqında danışın.","Şəxs konkret mallar və əməliyyatlarla əlaqədar malların təsnifatını, gömrük dəyərini, mənşə ölkəsini və gömrük ödənişlərinin məbləğini əvvəlcədən müəyyənləşdirmək məqsədilə gömrük orqanına yazılı, o cümlədən elektron formada müraciət edə bilər. Gömrük orqanları həmin müraciət əsasında bu mallar və əməliyyatlarla əlaqədar malların təsnifatının, gömrük dəyərinin, mənşə ölkəsinin və gömrük ödənişlərinin məbləğinin müəyyən edilməsi baxımından məcburi olan qərarlar qəbul edirlər.","2023"],["Gömrük orqanlarının məcburi qərarları hansı tarixdən qüvvəyə minir?","Məcburi qərar, müvafiq bildirişin və qərarın surətinin barəsində qərar çıxarılmış şəxsə təqdim olunduğu tarixdən qüvvəyə minir. Həmin tarixdən bu qərarın icrası gömrük orqanları üçün məcburidir.","2023"],["Gömrük orqanlarının məcburi qərarları hansı hallarda ləvğ edilir?","1 Gömrük orqanının şəxsin xeyrinə çıxardığı qərar aşağıdakı halların hamısı olduqda ləğv edilir:\n- qərar qeyri-dəqiq və ya natamam məlumat əsasında qəbul edilmişdirsə;\n- şəxs təqdim etdiyi məlumatın qeyri-dəqiq və ya natamam olduğunu bilirdi və ya bilməli idi;\n- şəxsin təqdim etdiyi məlumat düzgün və tamam olsaydı, qərar fərqli olardı.\n2 Qərar qəbul edildikdən sonra malların təsnifatı, gömrük dəyəri, mənşə ölkəsi və gömrük ödənişləri ilə bağlı məsələləri tənzimləyən gömrük qanunvericiliyində qərarla ziddiyyət yaradan dəyişiklik edildikdə.","2023"],["Gömrük orqanlarının məcburi qərarları hansı müddət ərzində qüvvədə olur?","Ləğv edilən qərarlar istisna olmaqla, malların təsnifatına, mənşə ölkəsinə dair məcburi qərarlar qüvvəyə mindiyi tarixdən etibarən 3 (üç) il müddətində, malların gömrük dəyərinə və gömrük ödənişlərinin məbləğinə dair məcburi qərarlar isə qüvvəyə mindiyi tarixdən etibarən 1 (bir) il müddətində qüvvədə olur.","2023"],["Gömrük nəzarəti nədir?","Gömrük nəzarəti – gömrük qanunvericiliyinə riayət olunmasını təmin etmək məqsədi ilə gömrük orqanlarının həyata keçirdiyi tədbirlər;","2023"],["Gömrük nəzarəti üsulları hansılardır?","Seçilmiş gömrük nəzarətinin formasının tətbiqi zamanı səmərəliliyi artırmaq üçün həyata keçirilən tədbirlər gömrük nəzarətinin üsullarını təşkil edir. Gömrük orqanlarının vəzifəli şəxsləri gömrük nəzarətini aşağıdakı üsullarla həyata keçirirlər:\ngömrük təminatı vasitələrindən istifadə etməklə;\ngömrük nəzarətinin həyata keçirilməsinə yardım üçün mütəxəssisləri və ekspertləri cəlb etməklə;\ngömrük nəzarəti zonalarını yaratmaqla və qanunvericilikdə nəzərdə tutulmuş digər üsullarla","2023"],["Gömrük nəzarəti formaları hansılardır?","Gömrük orqanlarının vəzifəli şəxsləri gömrük nəzarətini aşağıdakı formalarda həyata keçirirlər:\nmalların və nəqliyyat vasitələrinin yoxlanılması;\nşəxsi yoxlama;\ngömrük məqsədləri üçün lazım olan məlumatların, elektron və ya kağız üzərində yazılı formalarda sənədlərin, o cümlədən Azərbaycan Respublikasının dövlət sərhədinin buraxılış məntəqələrindən keçirilən malların baytarlıq, fitosanitar, gigiyenik və digər sertifikatlarla (şəhadətnamələrlə), “Qida təhlükəsizliyi haqqında” Azərbaycan Respublikasının Qanununa əsasən tərtib edilən idxal zamanı elektron bildiriş, Qida Təhlükəsizliyi Reyestrindən çıxarış, sağlamlıq sertifikatı, qida və yem məhsullarının təhlükəsizliyini təsdiq edən sənədlərlə müşayiət olunmasının yoxlanılması;[ \\[18\\]](https://www.e-qanun.az/framework/46957#_edn18)\ngömrük auditi;\nşəxslərin sorğu-sual edilməsi;\ngömrük nəzarətindən keçməli olan mallara və nəqliyyat vasitələrinə, onların yerləşdiyi ərazilərə və binalara, müvəqqəti saxlanc və gömrük anbarlarında, sərbəst zonalarda yerləşən ərazilərə və binalara, həmçinin icrasına nəzarət gömrük orqanına həvalə edilmiş fəaliyyətin həyata keçirildiyi digər yerlərə gömrük baxışının keçirilməsi;\nkeşik çəkmənin (patrulluğun) və gömrük müşahidəsinin aparılması.","2023"],["Gömrük nəzarəti vasitələri hansılardır?","Gömrük nəzarətinin həyata keçirilməsi zamanı gömrük orqanları aşağıdakı vasitələrdən istifadə edirlər:\ntexniki nəzarət vasitələrindən (detektorlar, rentgen aparatları, surətçıxaran avadanlıqlar, mexaniki, elektrik, elektron cihazlar, gömrük nəzarəti üzrə müşayiət qurğuları, qlobal mövqetəyinetmə sistemi (GPS) və s.);\ndəniz (çay) və hava gəmilərindən;\ngömrük orqanlarının informasiya resurslarından;\nxidməti itlərdən və gömrük nəzarətinin məqsədlərinə nail olmaq üçün siyahısı Azərbaycan Respublikasının Nazirlər Kabineti tərəfindən müəyyən edilmiş digər vasitələrdən.","2023"],["Gömrük nəzarəti hansı mərhələlərdən ibarətdir?","Gömrük sərhəd buraxılış məntəqələrində mallar və nəqliyyat vasitələri üzərində gömrük nəzarəti bir-birini tamamlayan üç əsas mərhələdə həyata keçirilir:\nmalları və nəqliyyat vasitələrini gömrük orqanına təqdim edən şəxs tərəfindən məlumatlandırma (bundan sonra - məlumatlandırma) və gömrük orqanları tərəfindən qeydiyyat (bundan sonra - qeydiyyat);\nsənədli nəzarət;\nçatdırılmaya nəzarət.","2023"],["Texniki nəzarət vasitələrinin hansı növləri var?","Texniki nəzarət vasitələri texniki xüsusiyyətlərindən və təyinatından asılı olaraq aşağıdakı növlərə bölünür:\nbaxış-rentgen texnikası - fiziki şəxslərin əl yükünün, müşayiət olunan və müşayiət olunmayan baqajların, malların və nəqliyyat vasitələrinin, beynəlxalq poçt göndərişlərinin yoxlanılması üçün rentgen şüalarının aktivləşdirilməsi ilə obyektin daxili quruluşu və içindəki əşyaların təsviri barədə məlumat alınmanı təmin edir. Qeyd olunan avadanlıqlar üzvi və qeyri-üzvi materialların bölünməsi əsasında yoxlanılan obyektlərin ətraflı təsvirini verir;\nyoxlama baxış sistemi - gömrük sərhəd buraxılış məntəqələrindən keçən malların və nəqliyyat vasitələrinin (avtomobil və dəmir yollarında, eləcə də gömrük orqanlarının müəyyən etdiyi digər yerlərdə) yoxlanılması məqsədi ilə skanlaşdırma əməliyyatı əsasında nəzarət ekranında obyektlərin təsvirinə nəzarət etmək üçün onların konturları, əşyaların görüntüləri, daxili quruluşu və təsviri barədə məlumat alınmasını təmin edir;\nbölünən və radioaktiv materialların müəyyən edilməsi məqsədi ilə gömrük nəzarəti tətbiq edilərkən istifadə olunan texniki nəzarət vasitələri - radioaktiv kimyəvi elementlərin və radioaktiv izotopların müəyyən edilməsini, lokallaşdırılmasını, onların kəmiyyət və keyfiyyət göstəricilərinin, habelə aktivliyinin müəyyən edilməsini təmin edir;\naxtarış texniki nəzarət vasitələri - gömrük nəzarəti həyata keçirilərkən fiziki şəxslərin əl yükünə, müşayiət olunan və müşayiət olunmayan baqajlara, beynəlxalq poçt göndərişlərinə, malların və nəqliyyat vasitələrinin daxilinə, girişi çətin olan yerlərə baxış keçirilməsini təmin edir;\neyniləşdirmə texniki nəzarət vasitələri - gömrük nəzarəti həyata keçirilərkən fiziki şəxslərin əl yükünün, müşayiət olunan və müşayiət olunmayan baqajların, malların və nəqliyyat vasitələrinin, beynəlxalq poçt göndərişlərinin, o cümlədən onlara aid sənədlərin eyniləşdirmə tədbirlərinin həyata keçirilməsini təmin edir;\naudio və video məlumat daşıyıcıları üzrə texniki nəzarət vasitələri - gömrük işi sahəsində qanun pozuntularının aşkar edilməsi zamanı qadağan olunmuş məlumatların silinməsini, eyni zamanda foto-kinoplyonkalara, slaydlara, USB və digər yaddaş qurğularına baxılmasını təmin edir. Gömrük Məcəlləsi ilə müəyyən olunmuş hallarda foto, kino və video çəkilişlərdən və ya digər yazan texniki vasitələrdən nəzarət məqsədi ilə istifadə edildikdə, həmin materiallar gömrük nəzarətinin həyata keçirilməsi üzrə hərəkətlərin icraatı zamanı tərtib edilən protokola əlavə olunur;\nvizual texniki nəzarət vasitələri - gömrük nəzarəti aparılan obyektlərin müşahidəsini, hadisələrin, faktların və təsvirlərin qeydə alınmasını təmin edir;\noperativ rabitə üzrə texniki nəzarət vasitələri - gömrük orqanlarının vəzifəli şəxsləri tərəfindən gömrük nəzarəti prosesinin operativ idarəçiliyinin təşkil edilməsini və məlumatların ötürülməsini təmin edir;\nqlobal mövqetəyinetmə sistemi (GPS) - Yer kürəsinin naviqasiya sistemi əsasında elektron xəritə üzərində hava şəraitindən asılı olmayaraq obyektin yerləşdiyi coğrafi koordinatların, vaxtın və məsafənin müəyyən edilməsini təmin edir;\ngömrük təminatının atributlarının vurulması vasitələri - malların və nəqliyyat vasitələrinin gömrük orqanları tərəfindən eyniləşdirilməsini və onların icazəsi olmadan açılmasının qarşısının alınmasını təmin edir.","2023"],["Gömrük auditi nədir?","Gömrük auditi – malların və nəqliyyat vasitələrinin buraxılışından sonra gömrük bəyannaməsində göstərilən məlumatların düzgünlüyünün müəyyən edilməsi, eləcə də, şəxslərin mal və nəqliyyat vasitələri barəsində sərəncam verilməsinə dair məhdudiyyətlərə, tələblərə və şərtlərə riayət edilməsi haqqında öhdəliklərinin yerinə yetirilməsinin yoxlanılması məqsədi ilə gömrük orqanları tərəfindən həyata keçirilən tədbirlər","2023"],["Gömrük auditi hansı müddət ərzində həyata keçirilə bilər?","Gömrük auditi gömrük bəyannaməsində qeyd olunan malların gömrük nəzarəti altında olan mallar statusunu itirməsindən sonrakı 3 (üç) il ərzində və yalnız hüquqi şəxslər və hüquqi şəxs yaratmadan sahibkarlıq fəaliyyəti ilə məşğul olan fiziki şəxslər barəsində həyata keçirilə bilər.","2023"],["Şərti buraxılış nədir?","Şərti buraxılış – mallardan və nəqliyyat vasitələrindən istifadə və onlar barəsində sərəncam verilməsinə dair məhdudiyyətlərə, tələblərə və şərtlərə riayət edəcəyi haqqında şəxsin öhdəlikləri ilə müşayiət olunan buraxılış","2023"],["Bəyannaməçi kimdir?","Bəyannaməçi – gömrük bəyannaməsini təqdim edən və ya adından gömrük bəyannaməsi verilən şəxs","2023"],["Bəyannaməçi kim ola bilər?","Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin sahibi, yaxud onunla bağlanan müqavilə əsasında gömrük brokeri bəyannaməçi ola bilər.","2023"],["Bəyannaməçinin vəzifələri hansılardır?","Malları və nəqliyyat vasitələrini bəyan edən bəyannaməçinin vəzifələri aşağıdakılardır:\nmalları və nəqliyyat vasitələrini bu Məcəllədə nəzərdə tutulan qaydada bəyan etmək;\nmalları və nəqliyyat vasitələrini gömrük orqanlarının tələbi ilə təqdim etmək;\ngömrük məqsədləri üçün lazım olan sənədləri və məlumatları gömrük orqanlarına təqdim etmək;\ngömrük ödənişlərini ödəmək;\ngömrük orqanlarına gömrük rəsmiləşdirilməsində yardım göstərmək.","2023"],["Qısa idxal bəyannaməsi nə vaxt verilir?","Fiziki şəxslər tərəfindən gömrük sərhədindən kommersiya məqsədləri üçün nəzərdə tutulmayan malların keçirilməsi halları istisna olmaqla, mallar gömrük ərazisinə gətirilməzdən əvvəl gömrük orqanlarına elektron formada qısa idxal bəyannaməsi verilir.","2023"],["Qısa idxal bəyannaməsinin verilməməsi hansı məsuliyyətə səbəb olur?","Qısa idxal bəyannaməsinin verilməməsi bəyannaməçinin inzibati məsuliyyətinə səbəb olur, lakin gömrük rəsmiləşdirilməsinin və malların buraxılışının həyata keçirilməsinə mane olmur.\nFiziki şəxslər üçün 1000 manat cərimə\nHüquqi şəxslər üçün 1500 manat cərimə","2023"],["Qısa idxal bəyannaməsinin kimlər təqdim edə bilər?","Qısa idxal bəyannaməsi:\nmalları gömrük ərazisinə gətirən\ndaşınmasına cavabdeh olan şəxslər\nmalları gömrük ərazisinə gətirən və daşınmasına cavabdeh olan şəxslərin nümayəndələri\nidxalatçı\nmalın alıcısı\nmalları gömrük rəsmiləşdirilməsi üçün gömrük orqanına təqdim edən şəxs tərəfindən verilə bilər.","2023"],["Qısa idxal bəyannaməsi təqdim edilmədikdə mallar barədə hansı tədbirlər görülür?","22 iyul 2014-cü 263 nömrəli qərara və Gomrük Məcəlləsinə əsaslanaraq qısa idxal bəyannaməsi verilməməsi inzibati məsuliyyətə səbəb olur, lakin gömrük rəsmiləşdirilməsinin və malların buraxılışının həyata keçirilməsinə mane olmur. Dovlət Gömrük Komitəsinin inzibati xətanın baş verməsi barədə məhkəməyə müraciəti əsasında məhkəmə tərəfindən vəzifəli şəxsə 1000 manat, hüququ şəxsə isə 1500 manat cərimə təyin edilməsi barədə qərar verilir.","2023"],["Ölkəyə gətirilən mallari gömrük orqanına kimlər təqdim edir?","Gömrük ərazisinə gətirilən mallar gömrük orqanlarına aşağıdakı şəxslərdən biri tərəfindən təqdim oluna bilər:\nmalları gömrük ərazisinə gətirmiş şəxs;\nmalları gömrük ərazisinə gətirmiş şəxsin adından çıxış edən şəxs;\nmallar gömrük ərazisinə gətirildikdən sonra onların daşınmasına görə məsul olan şəxs;\nmalları dərhal müvafiq gömrük proseduru altında yerləşdirən şəxs;\nsaxlanc yerlərinin təsis edilməsi üçün verilmiş icazənin sahibi və ya sərbəst zonada fəaliyyət göstərən şəxs.","2023"],["Gömrük orqanları təqdim olunan gömrük bəyannaməsini təsdiq edərkən, hansı şərtlərə uyğunluğunu yoxlayır?","malların nəzərdə tutulan gömrük proseduru altında yerləşdirilərək gömrük rəsmiləşdirilməsinin həyata keçirilməsinin həmin gömrük orqanının səlahiyyətlərinə aid olmasını;\ngömrük bəyannaməsinin təqdim olunma vaxtının və yerinin gömrük qanunvericiliyi ilə müəyyən olunmuş tələblərə uyğunluğunu;\ngömrük bəyannaməsində idxalına, yaxud ixracına qadağa və ya məhdudiyyətlər qoyulmuş mallar haqqında məlumatın olub-olmamasını;\ngömrük bəyannaməsinin NKP müəyyən etdiyi tələblərə uyğunluğunu;\ngömrük bəyannaməsi ilə birgə təqdim olunan sənədlərin mövcudluğunu (bu Məcəllənin 150.5-ci maddəsində müəyyən edilmiş qaydada sənədlərin sonradan təqdim olunduğu hallar istisna edilməklə) və onların qanunvericiliklə müəyyən edilmiş tələblərə cavab verməsini.","2023"],["Sənədlər 45 gün müddətində təqdim olunmasa nə etməlisən?","Bəyannaməçi sənədlərin vaxtında verilməsinə dair gömrük orqanına(idarə rəisinə) yazılı, o cümlədən elektron formada öhdəlik təqdim edir. A.R Inzibati Xətalar Məcəlləsinin 487 maddsinin 2-ci bəndində, həmçinin Gömrük bəyannaməsinin və onunla birgə təqdim edilməli olan sənədlərin qanunvericilikdə nəzərdə tutlmuş müddətdə təqdim olunmamaısna görə inzibati tənbeh növündə cərimə nəzərdə tutulmuşdur.\n487.2. Gömrük nəzarəti altında olan mallara və nəqliyyat vasitələrinə aid müvafiq icra hakimiyyəti orqanına verilmək üçün qəbul edilmiş gömrük sənədlərinin və ya digər sənədlərin itirilməsinə və ya çatdırılmamasına görə –\nfiziki şəxslər yüz əlli manatdan iki yüz əlli manatadək məbləğdə, vəzifəli şəxslər dörd yüz manatdan altı yüz manatadək məbləğdə, hüquqi şəxslər səkkiz yüz manatdan min manatadək məbləğdə cərimə edilir.\n493. Gömrük bəyannaməsinin və onunla birgə təqdim edilməli olan sənədlərin Azərbaycan Respublikasının Gömrük Məcəlləsində müəyyən edilmiş müddətdə müvafiq icra hakimiyyəti orqanına təqdim edilməməsinə görə -\nfiziki şəxslər əlli manat məbləğində, vəzifəli şəxslər yüz əlli manat məbləğində, hüquqi şəxslər üç yüz manat məbləğində cərimə edilir.","2023"],["Ölkə ərazisində iki gömrük anbarı arasında mallar hansı prosedurda daşınır?","Gömrük anbarı xüsusi gömrük proseduru altında yerləşdirilmiş mallar müəyyən edilmiş müddət artirilmadan və digər prosedura yerləşdirilmədən malları bir gömrük anbarından digərinə daşınmasına gömrük orqanlarının icazəsi və nəzarəti altında yol verilir","2023"],["Eyni və eynicinsli mallar həm idxal, həm də ixrac oluna bilərmi?","İdxal və ixracına qadağa və məhdudiyyət yoxdursa idxal və ixrac oluna bilər.","2023"],["Mənşə sertifikatının həqiqi (orginal) olduğunu necə sübüt edə bilərsiz?","Mənşə sertifikatı verən ölkənin səlahiyyətli orqanının rəsmi internet saytına daxil olub təqdim edilən mənşə sertifikatının nömrəsini qeyd edərək eyniləşdirilməsini aparmaq yolu ilə.\nMənşə sertifikatında qeyd olunan malın həmin ölkədə istehsal olunması ehtimalını təhlil etmək ilə. Məsələn Rusiyadan mənşə sertifikatı ilə müşayiət olunan ananası idxal edilməsi zamanı təhlil etməklə nəticəyə qəlmək olarkı bu sertifikat saxtadır, çünki ananas tropik iqlimlərdə yetişir Rusiyada yetişdirilməsi mümkünsüzdür.\nMalları gömrük ekspertizasına göndərərək.\nSorğulanan sertifikatın həqiqiliyi barədə gömrük orqanlarına ixrac ölkəsinin və ya malların mənşə ölkəsinin səlahiyyətli orqanlarından 6 (altı) ay müddətində (ilkin sorğu tarixindən etibarən 3 (üç) ay və təkrar sorğu tarixindən etibarən 3 (üç) ay ) cavab gözləməklə","2023"],["Gömrük ödənişləri hansılardır?","Gömrük ödənişləri – Gömrük məcəlləsi ilə nəzərdə tutulmuş hallarda gömrük orqanları tərəfindən alınan\ngömrük rüsumları\nvergilər (yol vergisi, aksiz vergisi və ƏDV)\ngömrük yığımları\ndövlət rüsumu\nhaqq","2023"],["Gömrük dəyəri nədir?","Gömrük dəyəri – malların “Gömrük tarifi haqqında” Azərbaycan Respublikasının Qanununa müvafiq olaraq müəyyən edilən dəyəri (Gömrük Məcəlləsi)\nMalların gömrük dəyəri - advalor gömrük rüsumu dərəcəsinin tətbiqi məqsədi ilə malların dəyərinin müəyyən edilməsi ( Gömrük Tarifi haqqında qanun)","2023"],["Gömrük rüsümu nədir?","Gömrük rüsumları – malların gömrük ərazisinə gətirilməsi və bu ərazidən aparılması zamanı gömrük orqanları tərəfindən alınan gömrük ödənişlərinin bir növü;","2023"],["Gömrük dəyərinin müəyyən edilməsi üsulları hansılardır?","malların sövdələşmə qiyməti ilə;\neyni malların sövdələşmə qiyməti ilə;\neynicinsli malların sövdələşmə qiyməti ilə;\ndəyərin çıxılması üsulu ilə;\ndəyərin toplanması üsulu ilə;\nehtiyat üsulu ilə.","2023"],["Gömrük rüsümlarının növləri hansılardır?","advalor - malların gömrük dəyərinə görə nisbətən faizlə hesablanan.Əksər mallar,məsələn: üst geyimləri,mobil telefonlar,kompyuterlər,qol saatları və sairə\nspesifik - malın vahidinə görə müəyyən olunmuş məbləğlə hesablanan. Məsələn: minik avtomobilləri,dərinin idxalı və sairə\nkombinə edilmiş – yuxarıda göstərilən hər iki gömrük rüsum növlərinin birləşdirilməsi yolu ilə hesablanan.Məsələn: Saflaşdırılmamış mis üçün ixrac rüsumunun miqdari - 10 faiz, lakin 1000 kq-a 300 ABŞ dollarından az olmamaqla","2023"],["Dövlət qulluğu haqqında qanunun Gömrük Komitəsinin fəaliyyətinə təsiri?","“Dövlət qulluğu haqqında” Azərbaycan Respublikası Qanununun vətəndaşların dövlət qulluğuna qəbul edilmək hüququna, qulluğa qəbulun müsabiqə və şəffaflıq əsasında həyata keçirilməsinə, dövlət qulluqçularının fəaliyyətinin qiymətləndirilməsinə və dövlət qulluğunun digər prinsiplərinə aid müddəaları, həmçinin həmin Qanunun 15-1-ci maddəsi (Dövlət qulluqçusunun şəxsi işi) gömrük orqanlarına xidmətə qəbul edilən şəxslərə şamil edilir","2023"],["Gömrük yığımları nədir?","Gömrük orqanları tərəfindən həyata keçirilən xidmətlərə və hüquqi hərəkətlərə görə alınan gömrük ödənişlərinin bir növüdür.","2023"],["Hansı hallarda malların gömrük rəsmiləşdirilməsinə görə gömrük yığımları alınmır?","Azərbaycan Respublikasının Gömrük Məcəlləsi və Azərbaycan Respublikası Nazirlər Kabinetinin 2013-cü il 14 oktyabr tarixli 305 nömrəli qərarı ilə təsdiq edilmiş “Fiziki şəxslər tərəfindən istehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan malların gömrük sərhədindən keçirilməsinin güzəştli və sadələşdirilmiş Qaydaları” ilə gömrük ödənişlərindən azadolma tətbiq edildiyi hallarda;\nelektrik enerjisinin qarşılıqlı ötürülməsi hallarında;\nqrant müqaviləsi (qərarı) əsasında xaricdən alınan qrantlar hesabına malların idxalı və qrant müqaviləsi (qərarı) əsasında qrantlar hesabına malların xaricə ixracı hallarında;\nhumanitar və texniki yardım məqsədi ilə gömrük sərhədindən keçirilən malların gömrük rəsmiləşdirilməsi zamanı;\nsilah və texnikanın alınması daxil olmaqla, dövlət müdafiə sifarişləri, Azərbaycan Respublikası Silahlı Qüvvələrinin tərkib hissəsi olan qurumlar tərəfindən bağlanmış müqavilələr və Azərbaycan Respublikasının tərəfdar çıxdığı beynəlxalq müqavilələr əsasında hərbi təyinatlı malların idxalı hallarında;\n5-ci bənddə qeyd olunmuş hərbi təyinatlı malların təmiri üçün müvəqqəti ixrac və təkrar idxal əməliyyatları hallarında","2023"],["Gömrük ekspertizası nədir?","Gömrük ekspertizası – gömrük tənzimlənməsi sahəsində məsələlərin həll edilməsi üçün xüsusi və elmi biliklərdən istifadə etməklə, gömrük ekspertləri və (və ya) digər ekspertlər tərəfindən aparılan tədqiqatdır;","2023"],["Gömrük ekspertizasının məqsədləri hansılardır?","malların tərkibinin və texniki göstəricilərinin müəyyən edilməsi;\nmalların xarici iqtisadi fəaliyyətin mal nomenklaturasına uyğun olaraq aidiyyətinin, təsnifat kodunun müəyyən edilməsi və eyniləşdirilməsi;\nmalların mənşə ölkəsinin, emal prosesində hasilat normalarının, istehsal tarixinin və keyfiyyətinin müəyyən edilməsi;\nixrac nəzarətinə düşən malların ikili təyinatlı olmasının yoxlanılması;\nmalların kimyəvi və mineraloji tərkibinin müəyyən edilməsi;\nekoloji baxımdan təhlükəli, tərkibində ozondağıdıcı maddələr olan malların və tullantıların müəyyən edilməsi;\nradiasiya təhlükəsi olan malların müəyyən edilməsi;\nmalların gömrük dəyərinin təyin olunması;\nmalların tarixi və sənətşünaslıq baxımından dəyərliliyinin müəyyən edilməsi.","2023"],["Gömrük ekspertizasının hansı növləri var?","ilkin ekspertiza\nəlavə ekspertiza\ntəkrar ekspertiza\nkomisyon ekspertiza\nkompleks ekspertiza","2023"],["Kimlər gömrük orqanlarının vəzifəli şəxsləri ola bilərlər?","Təhsil səviyyəsinə, peşəkarlığına, səhhətinə, işgüzar, fiziki və mənəvi keyfiyyətlərinə görə gömrük orqanlarına həvalə edilmiş vəzifələri yerinə yetirə bilən və Azərbaycan Respublikasının dövlət dilini sərbəst bilən Azərbaycan Respublikasının vətəndaşları gömrük orqanlarının vəzifəli şəxsləri ola bilərlər.","2023"],["Gömrük orqanının vəzifəli şəxsi kimdir?","\"Gömrük orqanlarında xidmət haqqında\" əsasnaməsinə uyğun olaraq gömrük orqanlarının vəzifəli şəxsləri dedikdə, vahid sistem təşkil edən Azərbaycan Respublikasının gömrük orqanlarında vəzifə tutan və \"Gömrük orqanlarında xidmət haqqında\" Əsasnamədə nəzərdə tutulmuş qaydada xüsusi rütbələr verilmiş vətəndaşlar başa düşülür.","2023"],["Gömrük orqanlarının vəzifəli şəxslərinin hansı hüqüları vardır?","gömrük orqanında tutduğu vəzifəyə dair hüquq və vəzifələrini müəyyən edən sənədlərlə tanış olmağa;\nmüəyyən edilmiş qaydada xidməti vəzifələrini yerinə yetirmək üçün zəruri olan məlumat və sənədlər almağa;\nxidməti vəzifələrini yerinə yetirmək üçün mülkiyyət formasından asılı olmayaraq müəssisələrə getməyə;\nxidməti vəzifələrinə uyğun olaraq qərarlar qəbul etməyə və ya onların hazırlanmasında iştirak etməyə;\nxidmət illərinə görə, xidmətin nəticələri və ixtisasının səviyyəsi nəzərə alınmaqla, əmək haqqının artırılmasına və gömrük orqanlarında xidmət üzrə irəliləməyə;\nşəxsi işində olan materiallarla tanış olmaq və zəruri hallarda öz izahatlarını şəxsi işə əlavə etməyə;\nAzərbaycan Respublikasının gömrük işini aparan icra hakimiyyəti orqanının saxlanılması üçün nəzərdə tutulan vəsaitlər hesabına əlavə təhsil almağa;[ \\[29\\]](https://e-qanun.az/framework/9718#_edn29)\nxidmət illəri nəzərə alınmaqla pensiya təminatına;\nşərəf və ləyaqətini alçaldan məlumatların təkzib edilməsi üçün xidməti araşdırmaların aparılmasını tələb etməyə;\nhəmkarlar ittifaqlarına birləşməyə;\ngömrük orqanlarının vəzifəli şəxslərinin iclaslarında iştirak etməyə;\nAzərbaycan Respublikasının Gömrük Məcəlləsində nəzərdə tutulmuş hallarda və qaydada fiziki qüvvəni, xüsusi vasitələri və odlu silahı tətbiq etməyə.\nGömrük orqanlarının vəzifəli şəxslərinin Azərbaycan Respublikasının qanunvericiliyində nəzərdə tutulan digər hüquqları da vardır.\ngömrük işi sahəsində normayaratma fəaliyyətindən irəli gələn hüquqları həyata keçirmək;\ntəhqiqatı və istintaqı gömrük orqanlarının səlahiyyətinə aid edilmiş cinayətlərin qarşısının alınması, aşkar edilməsi və açılması, onları hazırlayan, törədən və ya törətmiş şəxsləri müəyyənləşdirmək məqsədi ilə qanunvericiliklə müəyyən edilmiş qaydada əməliyyat-axtarış fəaliyyətini həyata keçirmək;\ncinayət-prosessual qanunvericiliyi ilə müəyyən edilmiş qaydada təhqiqat və ibtidai istintaq aparmaq;\nmüvafiq qanunvericiliyə uyğun olaraq inzibati xətalarla bağlı işlər üzrə icraatı aparmaq, bu işlərə baxmaq və inzibati xətalar törətmiş şəxsləri məsuliyyətə cəlb etmək;\nbu Məcəllədə nəzərdə tutulmuş hallarda və qaydada fiziki qüvvədən, xüsusi vasitələrdən (o cümlədən texniki vasitələrdən) və odlu silahdan istifadə etmək;","2023"],["Gömrük orqanının vəzifəli şəxsi nələri etməyə borcludur?","Azərbaycan Respublikasının Konstitusiyasına, qanunlarına və digər normativ hüquqi aktlarına riayət edilməsini təmin etmək;\nfiziki və hüquqi şəxslərin hüquqlarının və qanuni maraqlarının müdafiəsini təmin etmək;\ngömrük orqanlarının rəislərinin səlahiyyətləri çərçivəsində verdikləri əmr və sərəncamlarını yerinə yetirmək;\nxidməti vəzifələri hüdudlarında fiziki və hüquqi şəxslərin müraciətlərinə vaxtında baxmaq;\ngömrük orqanlarında müəyyən edilən daxili intizam və xidməti informasiya ilə rəftar qaydalarını gözləmək, vəzifə təlimatlarını yerinə yetirmək;\ndövlət sirrini və qanunla qorunan digər sirləri qorumaq, xidməti vəzifələrini yerinə yetirərkən ona məlum olmuş məlumatları açıqlamamaq","2023"],["Gömrük orqanlarının vəzifəli şəxslərinə barədə hansı həvəsləndirmə tədbirləri görülür?","təşəkkür elan edilməsi;\npul və ya qiymətli əşya verilməsi;\nAzərbaycan Respublikasının gömrük işini aparan icra hakimiyyəti orqanının fəxri fərmanı ilə təltif edilməsi;\nnövbəti xüsusi rütbənin vaxtından əvvəl verilməsi;\ntəltif silahının verilməsi;\nnövbəti xüsusi rütbənin tutduğu vəzifə üçün nəzərdə tutulandan bir pillə yuxarı verilməsi;\ntətbiq edilmiş intizam tənbehinin vaxtından əvvəl geri götürülməsi;\ndöş nişanı ilə təltif edilmə.","2023"],["Gömrük orqanlarının vəzifəli şəxslərinə barədə hansı intizam tənbehlərindən biri tətbiq oluna bilər?","irad;\ntöhmət;\nsonuncu xəbərdarlıqla şiddətli töhmət;\naşağı vəzifəyə keçirilmə\nxüsusi rütbənin bir pillə aşağı salınması;\nvəzifədən azad etmə (bu halda gömrük orqanının vəzifəli şəxsi Azərbaycan Respublikasının gömrük işini aparan icra hakimiyyəti orqanının sərəncamında ola bilər və həmin müddət ərzində onun gömrük orqanlarından xaric edilməsinə əsaslar olmazsa, o, gömrük orqanlarında işə təyin edilir)\ngömrük orqanlarından xaric etmə\nqanunvericiliklə müəyyən edilmiş hallarda və qaydada xüsusi rütbədən məhrum edilməklə gömrük orqanlarından xaric etmə.","2023"],["Gömrük orqanlarının vəzifəli şəxslərinin nələri etməyə ixtiyarı yoxdur?","sahibkarlıq fəaliyyəti ilə (o cümlədən vasitəçilərin köməyi ilə) məşğul olmağa;\n“Korrupsiyaya qarşı mübarizə haqqında” Azərbaycan Respublikası Qanununun 9-cu maddəsində nəzərdə tutulmuş korrupsiya hüquqpozmaları və korrupsiyaya şərait yaradan hüquqpozmaları törətməyə;\ngömrük məsələləri üzrə üçüncü şəxslərin müvəkkili olmağa;\nmüqavilə ilə mülki-hüquqi xarakterli gömrük işi ilə əlaqədar işləri yerinə yetirməyə;\nöz xidməti vəziyyətindən istifadə etməklə üçüncü şəxslərə Azərbaycan Respublikası qanunvericiliyi ilə nəzərdə tutulmayan hər hansı bir yardım göstərmək və bunun müqabilində haqq, imtiyazlar və xidmətlər əldə etməyə;\ntəsərrüfat subyektlərinin idarə edilməsində bilavasitə və ya nümayəndə vasitəsi ilə iştirak etməyə;\ntətillərin təşkili və onların keçirilməsində iştirak etməyə;\n8 siyasi partiyalar yaratmağa və yaxud onların işində iştirak etməyə;\nəvəzçilik şərti ilə istənilən haqqı ödənilən işi görməyə (elmi-tədris və yaradıcılıq fəaliyyətindən başqa)","2023"],["Gömrük orqanlarının vəzifəli şəxsləri məhdudiyyətlərə əməl etmədikdə hansı tədbirlər göürülür?","Əməldə inzibati və ya cinayət məsuliyyəti səbəb olan hallar varsa, İnzibati Xətalar və ya Cinayət Məcəlləsə uygun olaraq məsuliyyətə cəlb olunur. Əməldə İnzibati və ya cinayət məsuliyyəti yaratmayan hallar olduqda isə intizam məsuliyyətinə cəlb olunur.","2023"],["Gömrük orqanlarında xidməti haqında qanunvericilik nəyə əsaslanır və nədən ibarətdir?","Gömrük orqanlarında xidmət haqqında qanunvericilik Azərbaycan Respublikasının Konstitusiyasına əsaslanır və Azərbaycan Respublikasının Gömrük Məcəlləsindən, bu Əsasnamədən və gömrük orqanlarında xidmətin qaydalarını tənzimləyən Azərbaycan Respublikasının digər normativ hüquqi aktlarından ibarətdir.","2023"],["Gömrük orqanlarının kapitan rütbəsi daşıyan vəzifəli şəxsi hakim təyin edildikdə hansı proseslər olur?","Dövlət Gömrük Komitəsinin təşəbbüsü ilə gömrük orqanlarında xidmətinə xitam verilir və birdəfəlik müavinət verilmir","2023"],["Azərbaycan Respublikası gömrük sahəsində hansı beynalxalq təşkilatlara qoşulub?","Nayrobi\nKioto\nBYD\nCenevrə","2023"],["Son istifadə xüsusi gömrük proseduru nədir?","Son istifadə xüsusi gömrük proseduru altında yerləşdirilmiş mallar bu prosedurun məqsədinə uyğun olaraq, gömrük rüsumlarından və vergilərdən azad edilməklə, sərbəst dövriyyəyə buraxılmasıdır","2023"],["Son istifadə xüsusi gömrük proseduru altında yerləşdirilmiş mallar üzərində gömrük nəzarəti hansı hallarda başa çatır?","mallar gömrük rüsumlarından və vergilərdən azad edilmənin tətbiqi üçün qanunvericiliklə müəyyən edilmiş məqsədlərə istifadə olunduqda;\nmallar ixrac və ya məhv edildikdə, yaxud onlardan dövlətin xeyrinə imtina olunduqda;\nmallardan gömrük rüsumlarından və vergilərdən azad olunmanın məqsədləri üçün istifadə edilmədiyi aşkar olunduqda və bununla əlaqədar qanunvericilikdə nəzərdə tutulmuş gömrük rüsumları və vergilər tam ödənildikdə;\nmallar gömrük idxal rüsumları, vergilər alınmadan və ticarət siyasəti tədbirləri tətbiq edilmədən gömrük ərazisində müvafiq icra hakimiyyəti orqanının müəyyən etdiyi yerlərdə (beynəlxalq hava və dəniz limanlarında və başqa yerlərdə) və qaydada yaradılan və fəaliyyət göstərən rüsumsuz ticarət mağazalarında gömrük nəzarəti altında satıldıqda.","2023"],["Dövlət qulluğunun xüsusi növü nədir?","Dövlət qulluğu Azərbaycan Respublikasının Konstitusiyasına və digər qanunvericilik aktlarına uyğun olaraq dövlətin məqsədlərinin və funksiyalarının həyata keçirilməsi sahəsində dövlət qulluqçularının öz vəzifə səlahiyyətlərini yerinə yetirməsidir. Xüsusi növ Azərbaycan Respublikasının başqa qanunları ilə tənzimlənir.","2023"],["Tranzit xüsusi gömrük prosedurunda təminat qoyulurmu?","Zəruri hallarda gömrük orqanlarının təminat almaq hüqüqu var","2023"],["GMO nədir?","GMO - (Genetik Modifikasiya olunmuş Orqanizm) genetika mühəndisliyi metodları istifadə olunaraq genetik materialı dəyişdirilmiş orqanizmlərə verilən addır","2023"],["İşğaldan azad olunan ərazilərdə hansı gömrük postları istifadəyə verilib?","İşğaldan azad olunan ərazilərdə gömrük xidmətinin təşkili üçün Qubadlı rayonu ərazisində “Qubadlı”, Zəngilan rayonu ərazisində “Qazançı” və Füzuli rayonu ərazisində isə “Füzuli beynəlxalq hava limanı” gömrük postları yaradılaraq istifadəyə verilib","2023"],["Gömrük tarifi nələri tənzimləyir?","idxalın əmtəə strukturunu tənzimləyir\nMallar üzrə tarif güzəştləri, gömrük rüsumlarından azad edilmə, tarif preferensiyalarının və güzəştlərinin verilməsi halları və qaydaları “Gömrük tarifi haqqında” Azərbaycan Respublikasının Qanununa və müvafiq icra hakimiyyəti orqanının normativ hüquqi aktlarına uyğun olaraq tənzimlənir.","2023"],["Fiziki şəxslər tərəfindən Azərbaycan Respublikasının gömrük sərhədindən keçirilərkən yazılı formada bəyan edilməli olan mallar hansılardır?","Müəyyən edilmiş hədlərdən artıq və şərtlərinə uyğun olmayan mallar.\nMüşayiət olunmayan baqajla və daşıyıcı tərəfindən göndərilən mallar.\nMüəyyən edilmiş hədlərdən artıq müvəqqəti keçirilən mallar.\nAvtonəqliyyat vasitələri.\nMüəyyən edilmiş hədlərdən artıq qiymətli metallar və qiymətli daşlar.\n10000 (on min) ABŞ dolları ekvivalentindən artıq xarici valyuta və qiymətli kağızlar.\nGömrük sərhədindən keçirilməsinə görə lisenziya, icazə sənədi tələb olunan mallar.\n10000 (iyirmi min) manat və ondan yuxarı məbləğdə olan nağd milli valyuta (kağız və metal pul nişanları) və milli valyutada ifadə olunan qiymətli kağızlar.\nSəfər zamanı fiziki şəxslər tərəfindən, həmçinin poçt göndərişləri ilə ölkə ərazisinə gətirilən mobil telefon və digər simsiz rabitə avadanlıqları.","2023"],["Gömrük orqanlarının vəzifəli şəxsləri hansı son yaş həddinədək xidmət edirlər?","Gömrük orqanlarının vəzifəli şəxsləri aşağıdakı son yaş həddinədək xidmət edirlər:\ngömrük xidməti giziri, tibb xidməti giziri, gömrük xidməti baş giziri, tibb xidməti baş giziri, gömrük xidməti kiçik leytenantı, tibb xidməti kiçik leytenantı, gömrük xidməti leytenantı, tibb xidməti leytenantı, gömrük xidməti baş leytenantı, tibb xidməti baş leytenantı, gömrük xidməti kapitanı, tibb xidməti kapitanı - 50 yaş;\ngömrük xidməti mayoru, tibb xidməti mayoru, gömrük xidməti polkovnik-leytenantı, tibb xidməti polkovnik-leytenantı - 55 yaş;\ngömrük xidməti polkovniki, tibb xidməti polkovniki, gömrük xidməti general-mayoru, tibb xidməti general-mayoru, gömrük xidməti general-leytenantı, gömrük xidməti general-polkovniki - 60 yaş.","2023"],["Malların daxildə emal xüsusi gömrük proseduru altında yerləşdirilməsinə icazə şəxsə hansı şərtlərlə verilir?","gömrük orqanının daxildə emal xüsusi gömrük proseduruna nəzarəti həyata keçirmək imkanı olduqda;\nicazənin verilməsi yerli istehsalçıların mühüm maraqlarına mənfi təsir göstərmədikdə.","2023"],["Mallar xaricdə emal xüsusi gömrük proseduruna hansı hallarda yerləşdirilə bilməz?","Aşağıdakı daxili malların xaricdə emalına icazə verilmir:\nixracı idxal gömrük rüsumlarının və vergilərin geri qaytarılmasına və ya qanunvericilikdə nəzərdə tutulmuş hallarda onlardan azad olunması ilə nəticələnə biləcək mallar;\ntəmiri üzrə əməliyyatların aparıldığı hallar istisna olmaqla, ixracdan əvvəl son istifadə ilə əlaqədar gömrük rüsumlarından və vergilərdən tam və ya qismən azad edilməklə sərbəst dövriyyəyə buraxılmış mallar;\nixrac edilməsi ixrac üzrə gömrük ödənişlərinin geri qaytarılması ilə nəticələnən mallar.","2023"],["Təkrar ixrac zamanı mallara görə ödənilmiş gömrük ödənişləri hansı şərtlər daxilində şəxsə qaytarılır?","idxal anında malların qüsurlu olması və ya sövdələşmə şərtlərinə cavab verməməsi aşkar edildikdə;\nmalların onları göndərən şəxsə və ya onun təyin etdiyi digər şəxsə geri qaytarılması nəzərdə tutulduqda;\nmallar gömrük ərazisində emal əməliyyatlarına məruz qalmadıqda və ya istifadə olunmadıqda və Gömrük Məcəlləsinin 128.3-cü maddəsi ilə müəyyən edilmiş 1 (bir) il müddətində təkrar ixrac edildikdə.","2023"],["Tranzit xüsusi gömrük proseduru altına yerləşdirilmiş yük əməliyyatları hansı hallarda aparılır?","Gömrük ərazisindən malları tranzit daşıyan nəqliyyat vasitələrinə əlavə malların yüklənməsinə, malların nəqliyyat vasitəsindən boşaldılmasına və ya malları daşıyan nəqliyyat vasitəsinin dəyişdirilməsinə yol verilir. Tranzit xüsusi gömrük proseduru altında daşınan malların bir hissəsi digər gömrük proseduru altında yerləşdirildikdə, həmin mallar nəqliyyat vasitəsindən qismən boşaldılır.\nGömrük ərazisi ilə tranzit daşınan mallar üzərində yük əməliyyatları gömrük nəzarəti zonalarında və ya gömrük orqanının müəyyən etdiyi digər yerlərdə gömrük orqanının vəzifəli şəxslərinin iştirakı ilə həyata keçirilir. Yük əməliyyatları aparıldıqda, tranzit daşınma müddəti belə əməliyyatların aparılması üçün zəruri olan vaxt nəzərə alınmaqla müəyyən edilir.\nMallar üzərində yük əməliyyatları göndərən gömrük orqanı və ya əməliyyatların aparıldığı ərazidə fəaliyyət göstərən gömrük orqanı tərəfindən verilən icazə əsasında həyata keçirilir.\nMalların bir nəqliyyat vasitəsindən digər nəqliyyat vasitəsinə yenidən yüklənməsinə icazə həmin ərazidə fəaliyyət göstərən gömrük orqanı tərəfindən verilir. Malların yenidən yüklənməsinə icazə vermiş gömrük orqanı göndərən gömrük orqanına bu barədə məlumat verir. Yenidən yüklənmiş mallar təyinat gömrük orqanına gömrük nəzarəti altında daşınmalıdır.","2023"],["Azərbaycan Respublikasının Milli Məclisində qanunvericilik təşəbbüsü hüququ nədir və kimlərə məxsusdur?","Azərbaycan Respublikası vətəndaşlarının qanunvericilik təşəbbüsü hüququndan istifadə etməsi qaydası haqqında\nAzərbaycan Respublikasının Milli Məclisində qanunvericilik təşəbbüsü hüququ (qanun layihələrini və başqa məsələləri Azərbaycan Respublikası Milli Məclisinin müzakirəsinə təqdim etmək hüququ) Azərbaycan Respublikası Milli Məclisinin deputatlarına, Azərbaycan Respublikasının Prezidentinə, Azərbaycan Respublikasının Ali Məhkəməsinə, Azərbaycan Respublikasının seçki hüququ olan 40 min vətəndaşına, Azərbaycan Respublikasının Prokurorluğuna və Naxçıvan Muxtar Respublikasının Ali Məclisinə mənsubdur.","2023"],["İnzibati şikayətin baxılmamış saxlanılmasının əsasları hansılardır?","İnzibati şikayətin forması və məzmunu nəzərdə tutulmuş tələblərə cavab vermədikdə\nşikayətin predmeti üzrə digər səlahiyyətli inzibati orqanın və ya məhkəmənin qanuni qüvvəyə minmiş qərarı olduqda;\ninzibati şikayətin verilməsi üçün qanunla müəyyən olunmuş müddət (ümumi 30 gün müddətində) buraxıldıqda və buraxılmış müddət bərpa edilmədikdə;\nşikayət maraqlı şəxsin və ya onun nümayəndəsinin ərizəsinə əsasən geri götürüldükdə.\nŞikayət instansiyası şikayətin baxılmamış saxlanılması barədə qərar qəbul edir. Həmin qərardan bu Qanunla müəyyən olunmuş qaydada şikayət verilə bilər.\nŞikayət instansiyası şikayət üzrə qərar qəbul edilənədək şikayəti vermiş şəxsə öz rəyini bildirmək imkanı verməlidir.\nNəzərdə tutulmuş əsaslar aradan qaldırıldıqdan sonra ümumi qaydada yenidən inzibati şikayət verilə bilər.","2023"],["Sərəncam mahiyyətli sənədlər dedikdə nə nəzərdə tutulur?","Qərar\nSərancam\nƏmr","2023"],["Xidməti davranış nədir?","Dövlət qulluqçusunun xidməti davranışı qanunvericiliklə ona verilmiş hüquqların həyata keçirilməsi və vəzifələrinin yerinə yetirilməsi ilə əlaqədar fəaliyyətidir. Dövlət qulluqçusunun xidməti davranışı Dövlət qulluqçularının etik davranış qaydaları haqqında qanunda müəyyən edilmiş etik davranış qaydalarına və prinsiplərinə əsaslanmalıdır.\nDövlət qulluqçusunun xidməti davranışı Dövlət qulluqçularının etik davranış qaydaları haqqında qanuna və digər normativ hüquqi aktlara uyğun olaraq tənzimlənir.\nDövlət qulluqçularının etik davranış qaydaları haqqında müəyyən olunmuş etik davranış qaydalarını dəqiqləşdirən normalar, onlara riayət olunması ilə bağlı təminatlar dövlət orqanlarının digər normativ hüquqi aktları ilə müəyyənləşdirilə bilər. Göstərilən normativ hüquqi aktlar Dövlət qulluqçularının etik davranış qaydaları haqqında qanunun müddəalarına zidd olmamalıdır.","2023"],["Tələbələri ödənişsiz işləməyə necə sövq etmek olar?","Könüllü gömrükçü dəstəsinə daxil etməklə\nUniversitetlərdə tərcübə proqramlarını DGK-nə istiqamətləndirməklə","2023"],["“Azərbaycan Respublikasının 2022–2026-cı illərdə sosial-iqtisadi inkişaf Strategiyası” haqqında Prezidentin sərəncamına əsasən DGK-nə hansı tapşırıqlar verilib?","Qeyri-neft/qaz ixracına dair statistikanın aparılmasına yenidən baxılması və vahid metodologiyanın tətbiqi\nİxrac əməliyyatlarının şəffaflığının artırılması mexanizmlərinin yaradılması\nXarici bazarlarda ticarəti tənzimləyən maneələrin (ticarətdə tarif və qeyri-tarif maneələri) müəyyənləşdirilməsi sisteminin yaradılması\nİxracın ölkəmizdə elektron platformalar üzərindən tətbiqinin (e-ticarət) asanlaşdırılması\nÖlkə üzrə ərzaq təminatı xəritəsinin hazırlanması\nHədəf turizm bazarları ilə nəqliyyatkommunikasiya əlaqələrinin şaxələndirilməsi və təkmilləşdirilməsi\nAzərbaycanın beynəlxalq nəqliyyat dəhlizlərində potensial roluna əsaslanan tranzit daşımaların inkişafına hədəflənən Vahid Nəqliyyat və Logistika Strategiyasının həyata keçirilməsi\nTranzit daşıma və logistika işinin təkmilləşdirilməsi üçün rəqəmsal texnologiyadan istifadənin genişləndirilməsi\n\\+Sənaye zonalarında (sənaye parkları və məhəllələri) idxalı əvəzləyəcək və ixrac potensiallı məhsulların istehsalının təşviq edilməsi\nTikinti məqsədli xammal ehtiyatlarından istifadə qaydalarının sadələşdirilməsi\nTikinti materialları istehsalının təşviqi mexanizmlərinin yaradılması\nTikinti materiallarının yerli istehsalı üzrə bacarıqların inkişaf etdirilməsi\n\\+Daxili istehsalda istifadə olunan və yerli istehsalı mövcud və ya səmərəli olmayan xammal və aralıq malların idxalına tətbiq olunan vergilərin və gömrük rüsumlarının optimallaşdırılması\n\\+Daimi fəaliyyət göstərən müvəqqəti saxlanc və gömrük anbarları sisteminin inkişaf etdirilməsi\n\\+İxracyönümlü yerli istehsalı artıra biləcək güzəştli gömrük prosedurlarından, xüsusilə daxildə emal xüsusi gömrük prosedurunun istifadə şərtlərinin sadələşdirilməsi\nNəqliyyat əməliyyatlarının 24/7 formatında sürətli həyata keçirilməsi məqsədilə dövlət tərəfindən yaradılacaq rəqəmsal platformaya inteqrasiyası (rəqəmsal gömrük, hesablaşma, saxlama)\nNəqliyyat və logistika sahəsi üzrə effektivliyin və proqnozlaşdırma keyfiyyətinin artırılması, həmçinin axınların “ağıllı” idarə edilməsi məqsədilə sahənin tam rəqəmsallaşmasına (infrastruktur və proqram təminatı, o cümlədən IoT, M2M, AI) subsidiya və güzəştli kreditlərin ayrılması\nElektron ticarət üzrə normativ hüquqi bazanın təkmilləşdirilməsi (maneələrin aradan qaldırılması) və qanunsuz ticarət əməliyyatlarının azaldılmasının təşviqi\nElektromobillik üzrə Milli Planın hazırlanması\nEkoloji təmiz və təhlükəsiz nəqliyyat vasitələrinin (minik avtomobilləri, avtobuslar və s.) dövriyyəsinin stimullaşdırılması və zəruri infrastrukturunun yaradılması","2023"],["Madrid prinsipləri haqqında","Madrid prinsipləri — Azərbaycanla Ermənistan arasında Dağlıq Qarabağ münaqişəsinin həll edilməsi üçün ATƏT-in Minsk qrupu tərəfindən hər iki tərəfə təklif olunan sülh modeli. Madrid prinsipləri münaqişənin həll edilməsində ən ideal sülh planı hesab olunur. Madrid prinsiplərinə əsasən Ermənistan tərəfdən işğal edilmiş və Dağlıq Qarabağ Muxtar Vilayətinə daxil olmayan 7 rayon Azərbaycana qaytarılmalı, daha sonra isə Dağlıq Qarabağ Muxtar Vilayətinin statusu müəyyən olunmalıdır.\nGeri qaytarılması nəzərdə tutulan rayonlar\nMadrid prinsiplərinə əsasən ilk mərhələdə Dağlıq Qarabağ Muxtar Vilayətinə daxil olmayan 5 rayon geri qaytarılmalıdır. Geri qaytarılması nəzərdə tutulan rayonlar aşağıdakı şəkildə sıralanmışdır:\nAğdam rayonu\nFüzuli rayonu\nCəbrayıl rayonu\nZəngilan rayonu\nQubadlı rayonu\nLaçın rayonunun 13 kəndi.\nBundan sonra regionda bütün kommunikasiyalar açılacaq, azad edilmiş torpaqların reabilitasiyası üzrə donor konfransı keçiriləcək. Regionda sülhməramlı müşahidəçilər yerləşdiriləcək, evlərinə qayıdan köçkünlərin təhlükəsizliyi təmin ediləcək. Növbəti mərhələdə Laçın və Kəlbəcər rayonları tamamilə azad edilir, azərbaycanlı icma Dağlıq Qarabağa qayıdır, bundan sonra Azərbaycanın ərazi bütövlüyü çərçivəsində Dağlıq Qarabağın hüquqi statusu müəyyən edilir.","2023"],["Malların bəyan edildiyi gömrük proseduru altında yerləşdirilməsi üçün kağız üzərində yazılı və ya elektron formalarda gömrük bəyannaməsi ilə birgə hansı sənədlər gömrük orqanına təqdim edilməlidir?","xarici ticarətin həyata keçirilməsini təsdiq edən müqavilə və ya şəxsin mallar barədə sahiblik, istifadə və (və ya) sərəncamvermə hüquqlarını təsdiq edən sənəd, yaxud istənilən digər sənəd;\nmalların və nəqliyyat vasitələrinin daşınması zamanı nəqliyyat növündən asılı olaraq nəqliyyat sənədləri.\nGömrük sərhədindən keçirilən malların kateqoriyası, malları keçirən şəxs, ixrac ölkəsi və ya malların yerləşdirildiyi gömrük proseduru nəzərə alınaraq yuxarıda göstərilən sənədlərdən əlavə gömrük bəyannaməsi ilə birlikdə qida təhlukəsizlik sertifikatı,mənşə sertifikatı , fitosanitar sertifikatı ,baytarliq sertifikatı, lisenziya və sarə sənədlərin də təqdim edilməsi tələb olunur","2023"],["Beynəlxalq yükdaşımada vergi öhdəliyi nədir?","Beynəlxalq yükdaşımada daşıyıcı rezident və qeyri rezident ola bilər.\nRezident daşıyıcı ya fiziki şəxs(fərdi sahibkar) və ya hüquqi şəxs ola bilər. Rezident daşıyıcılar fərqlənmə nişanı ilə işləyə bilməz.\nƏgər daşıyıcı rezident fiziki şəxsdirsə o gəlir vergi ödəyicisi olacaqdır. Yəni təqvim ili ərzində əldə etdiyi gəlirlərdən xərcləri çıxaraq 20 faiz dərəcə ilə gəlir vergisi ödəyəcəkdir. ƏDV qeydiyyatında düşdükdə isə 0 dərəcə ilə ƏDV-yə cəlb olunacaqdır. Bu halda daşınan malın sahibinin daşıma ilə bağlı heç bir vergi öhdəliyi yaranmır.\nƏgər daşıyıcı rezident hüquqi şəxsdirsə o mənfəət vergi ödəyicisi olacaqdır. Yəni təqvim ili ərzində əldə etdiyi gəlirlərdən xərcləri çıxaraq 20 faiz dərəcə ilə mənfəət vergisi ödəyəcəkdir. ƏDV qeydiyyatında düşdükdə isə 0 dərəcə ilə ƏDV-yə cəlb olunacaqdır. Bu halda daşınan malın sahibinin daşıma ilə bağlı heç bir vergi öhdəliyi yaranmır.\nƏgər daşıyıcı qeyri rezident şəxsdirsə yükü Azərbaycan ərazisində təhvil vermişdirsə bu halda daşıyıcıya yol pulu ödəyən mal sahibi həmin puldan 6 faiz vergi tutaraq Dövlət Vergi Xidmətinə ödəyəcəkdir.\nQEYD: Misal üçün Türkiyədən Bakıya mal idxal edirik. Ola bilər ki, bizim malı İstanbuldan Batumiyə bir maşın, Batumidən Bakiya isə başqa bir maşın daşısın. Bu halda Birinci maşına ödədiyimiz yol pulundan vergi tutmuruq, çunki Azərbaycan ərazisinə daxil olmayib, ikinci masindan isə tuturuq.","2023"],["Çatdırılmaya nəzarət nə deməkdir?","Çatdırmaya nəzarət mərhələsi gömrük nəzarətində olan malların və nəqliyyat vasitələrinin, o cümlədən onlara dair sənədlərin gömrük ərazisində yerləşən göndərən gömrük orqanından təyinat gömrük orqanına çatdırılmasına nəzarəti əhatə edir və iki gömrük orqanı arasında daşınan mallar və nəqliyyat vasitələri üzərində gömrük nəzarətinin və gömrük rəsmiləşdirilməsinin həyata keçirilməsi qaydaları əsasında təşkil olunur.","2023"],["Avrasiya təşkilatında Azərbaycan hansı tarixdə daxil olub?","Daxil olmayıb\nSəbəb: Ermənistan ilə olan munasibətlər (Ermənistan Respublikası ilə sərhədlərin açılması nəzərdə tutulurdu,həmçinin Ermənistan Respublikasına məxsus beynalxalq daşınmada nəzərdə tutulan nəqliyyat vasitələrinin(avtomobil, hava və sarə) Azərbaycan Respublikasının ərazisindən maneəsiz istifadə etmək huququ vermiş olurduq)","2023"],["Şəxs ölkəyə 50.000 dollar ekvivalentindən artıq pul gətirdikdə gomrük orqanının vəzifəli şəxsi kimi hansı hərəkətləri etməlisiz?","Qeyri-rezidentlər və rezidetlər valyuta sərvətlərini gömrük prosedurlarına riayət etməklə Azərbaycan Respublikasına nağd şəkildə gətirə bilərlər. Qeyri-rezidentlər tərəfindən Azərbaycan Respublikası ərazisinə gətirilən valyuta sərvətlərinin məbləği 50 (əlli) min ABŞ dolları ekvivalentindən artıq olduqda, gömrük orqanları vəsaitlərin məbləği, gətirilmə tarixi, gətirmiş şəxs və onların gətirildiyi ölkə barəsində məlumatları 7 (yeddi) gün müddətində Azərbaycan Respublikasının Mərkəzi Bankına , maliyyə monitorinqi orqanına və müvafiq icra hakimiyyəti orqanına təqdim edirlər.","2023"],["Şəxs ölkədən 10.000 dollar ekvivalentindən artıq pul çıxartdıqda gomrük orqanının vəzifəli şəxsi kimi hansı hərəkətləri etməlisiz?","Fiziki şəxs olan qeyri-rezidentlər və rezidetlər Azərbaycan Respublikasına əvvəllər nağd şəkildə gətirilmiş 50 (əlli) min ABŞ dolları ekvivalentinədək valyuta vəsaitlərini gömrük prosedurlarına əməl etməklə Azərbaycan Respublikasından nağd şəkildə çıxara bilərlər.\nFiziki şəxs olan qeyri-rezidentlər Azərbaycan Respublikasına əvvəllər valyuta vəsaitlərini nağd şəkildə gətirməyibsə o halda yalnız 10 (on) min ABŞ dolları ekvivalentinədək valyuta vəsaitlərini Azərbaycan Respublikasından nağd şəkildə çıxara bilərlər.","2023"],["Türkiyədən Rusya mənşəli malın idxalı zamanı idxal gömrük rüsumundan azad olunurmu?","Xeyr,Türkiyədən idxal olunan mal yalnız Türkiyə mənşəli olduqda idxal gömrük rüsumundan azad olunur","2023"],["Sadələşdirilmiş və əlavə bəyannamə hansı hallarda verilir?","Səlahiyyətli iqtisadi operatorlar malları müvafiq gömrük proseduru altında yerləşdirərkən və Gömrük Məcəlləsinin 112.1-ci maddəsində nəzərdə tutulan yardım yüklərinin gömrük rəsmiləşdirilməsi zamanı sadələşdirilmiş bəyannamə verilərkən, bəyannaməçi aidiyyəti gömrük proseduru üzrə gömrük bəyannaməsinin tamamlanması üçün bu Qaydaların 5 nömrəli əlavəsində göstərilmiş formada əlavə bəyannamə təqdim etməlidir.\nƏlavə bəyannamə bəyannaməçi tərəfindən bu Qaydaların 2.5-ci və 2.6-cı bəndlərində qeyd olunan sənədlərlə birgə gömrük rəsmiləşdirilməsi zamanı sadələşdirilmiş bəyannamənin verildiyi gömrük orqanına onun verildiyi tarixdən 30 (otuz) gündən gec olmayaraq təqdim edilməlidir.","2023"],["Rusya niyə taxılı həm ixrac edir , həmdə idxal edir?","Digər ölkələr ilə məhsulları idxal etmeklə ölklərarası iqtisad əlaqələri daimi qüvvədə saxlamaq məqsədi ilə\nEvrasiya İttifaqınına üzv ölkələrdən taxılı gömrük ödənişlərdən azad olunmaqla və məhdudiyyətsiz idxal edilməsinin məqsədə uyğunluğu\nDunyada taxıl böhranının olması ehtimalına qarşı taxıl ehtiyyatlarını artırmaq məqsədi ilə\nTaxılı ucuz alıb baha satmaq məqsədi ilə , misal çəksək dünyada ən ucuz taxıl Kazaxstandadır","2023"],["Gömrük təminat vasitələri hansılardır?","Gömrük təminatının atributlarının vurulması vasitələrinə aşağıdakılar aid edilir\nplomblayıcılar;\nplomblar və məftillər;\nmöhürlər;\nştamplar;\nmarkalar;\nstikerlər.","2023"],["Gömrük orqanlarının kapıtanı intizam tənbehi ilə xüsusi rütbəsi bir pillə aşağı salınıb (baş ıeytenant olub),lakin sonradan attestasiya nəticəsi müsbət olubdur. Necə olacaq?","Attestasiya komissiyasının tövsiyəsinə əsasən sədr tərəfindən əvvəlki xüsusi rütbəsinə bərpa olunması barədə qərar verə bilər","2023"],["Qısa idxal bəyannaməsində hansı məlumatlar qeyd olunur?","Qısa idxal bəyannaməsində risklərin təhlili, gömrük nəzarətinin düzgün aparılması üçün zəruri olan məlumatlar əks edilməlidir.","2023"],["Sadələşdirilmiş bəyannaməyə görə gömrük yığımın məbləği nə qədərdir?","Fiziki şəxslər tərəfindən istehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan malların gömrük sərhədindən keçirilməsi zamanı gömrük borcu yarandığı halda təqdim edilən sadələşdirilmiş bəyannamələrin rəsmiləşdirilməsi üçün 10 manat məbləğində gömrük yığımı alınır.","2023"],["Investisiya təşviqi sənədi nədir?","Hüquqi şəxslərə və fərdi sahibkarlara Azərbaycan Respublikasının Vergi Məcəlləsində və “Gömrük tarifi haqqında” Qanununda müəyyən edilmiş güzəştləri əldə etməyə əsas verən sənəddir.","2023"],["Investisiya təşviqi sənədi kim ala bilər?","Hüquqi şəxslər və sahibkarlıq fəaliyyətini hüquqi şəxs yaratmadan həyata keçirən fiziki şəxslər investisiya təşviqi sənədini ala bilərlər.","2023"],["Hansı sahələrə investisiya təşviqi sənədi verilir?","Azərbaycan Respublikası Prezidentinin müvafiq Fərmanı ilə təsdiq olunmuş iqtisadi fəaliyyət sahələrinə, inzibati ərazi vahidlərinə və minimal məbləğlərə uyğun olaraq həyata keçirilən layihlələrə investisiya təşviqi sənədi verilir.\nBu mexanizm sənaye, kənd təsərrüfatı, turizm və logistika sahələrini əhatə edir.","2023"],["Investisiya təşviqi sənədi neçə günə verilir?","İnvestisiya təşviqi sənədi 5 iş gününə verilir.","2023"],["Investisiya təşviqi sənədi ilə hansı güzəştlər əldə olunur?","İnvestisiya təşviqi sənədini əldə edən hüquqi şəxslər və fərdi sahibkarlar:\nmüvafiq olaraq mənfəət və gəlir vergisini 7 il müddətinə 50% güzəştlə ödəyirlər;\nmüvafiq əmlaka görə əmlak vergisindən, torpağa görə isə torpaq vergisindən 7 il müddətinə azad olunurlar;\nmüvafiq təsdiqedici sənəd əsasında texnika, texnoloji avadanlıq və qurğuların idxalı ƏDV-dən və gömrük rüsumlarından 7 il müddətinə azad olunurlar.","2023"],["Investisiya təşviqi sənədini teqdim eden hansı orqandır?","Azərbaycan Respublikası İqtisadiyyat Nazirliyi","2023"],["Beynalxalq tranzitde daxili m yersledirile bilermi?","Bəli,məsələn: Bakı-Iran-Naxçıvan","2023"],["Dövlət Gömrük Komitsinin qərarlari hansı qanunvericilyə əsaslanır?","Konstitusiyaya\nQanunlara\nPrezidentin fərmanlarına\nNazirlər Kabinetinin qərarlarına","2023"],["Fiziki şəxs kimdir?","Azərbaycan Respublikasında bütün vətəndaşlar, Azərbaycan Respublikasının ərazisində daimi yaşayan və ya müvəqqəti qalan әcnәbilәr və vətəndaşlığı olmayan şəxslər fiziki şəxslərdir.","2023"],["Hüquqi şəxs kimdir?","Azərbaycan Respublikasının və ya xarici dövlətin qanunvericiliyinə uyğun olaraq hüquqi şəxs statusunda yaradılmış müəssisə və təşkilatlar","2023"],["10 ildən artıq diplomatik nümayəndə olmuş şəxs ölkəyə 20 000 dollar gətirir. Gömrük orqanı nə etməlidir?","gömrük orqanları da nə etməlidir?\nİki ildən az olmayaraq Azərbaycan Respublikasının diplomatik nümayəndəliklərində və konsulluqlarında xidmət etmiş Azərbaycan Respublikasının diplomatik xidmət əməkdaşları və diplomatik xidmət orqanlarının inzibati-texniki xidmətini həyata keçirən şəxslər, Azərbaycan Respublikasının xarici ölkələrdə və beynəlxalq təşkilatlarda fəaliyyət göstərən diplomatik nümayəndəliklərinin və konsulluqlarının mühafizəsini həyata keçirən hərbi qulluqçular tərəfindən müvafiq olaraq Azərbaycan Respublikasının Xarici İşlər Nazirliyi və xarici ölkələrdə və beynəlxalq təşkilatlarda fəaliyyət göstərən diplomatik nümayəndəliklərinin və konsulluqlarının mühafizəsini həyata keçirən dövlət orqanı tərəfindən xarici ölkəyə ezam olunmuş əməkdaşın təyinat və geri çağırılma əmrlərinin təsdiq olunmuş surətləri gömrük orqanına təqdim edilməklə, onların xaricdə işlədikləri dövrdə əldə etdikləri vəsaitin və əmlakın, o cümlədən ümumi gömrük dəyəri 40 000 ABŞ dollarının ekvivalenti məbləğindən və mühərrikin həcmi 3000 kubsantimetrdən artıq olmayan bir ədəd avtonəqliyyat vasitəsinin (avtonəqliyyat vasitəsinin dəyərinin ödənilməsi haqqında sənəd, avtonəqliyyat vasitəsinin bir il müddətində özgəninkiləşdirilməməklə sahibliyi, həmçinin avtonəqliyyat vasitəsini idarə etmək hüququ istisna olmaqla üzərində digər sərəncam verməmək barədə avtonəqliyyat vasitəsi sahibinin öhdəliyinə dair sənəd təqdim olunmaqla) gömrük ərazisinə gətirilməsinə görə gömrük ödənişləri tutulmur.","2023"],["Əməliyyat-axtarış fəaliyyəti nədir?","Əməliyyat-axtarış fəaliyyəti - müvafiq dövlət orqanları tərəfindən aşkar və qeyri-aşkar üsullarla bu qanunla müəyyən edilmiş tədbirlərin həyata keçirilməsidir.","2023"],["Əməliyyat-axtarış tədbirlərinin həyata keçirilməsi üçün səbəblər hansılardır?","1) fiziki şəxslərin ərizələri;\n2) müəssisə, idarə, təşkilatların vəzifəli şəxslərinin müraciətləri;\n3) kütləvi informasiya vasitələrində dərc olunmuş məlumatlar;\n4) əməliyyat-axtarış fəaliyyəti subyektlərinin bilavasitə əldə etdikləri məlumatlar;\n5) əməliyyat-axtarış fəaliyyətinin digər subyektlərinin yazılı sorğuları;\n6) Azərbaycan Respublikasının ali dövlət hakimiyyəti orqanlarını və xüsusi obyektlərini mühafizə edən orqanlarının yazılı sorğuları;\n7) cinayət işləri üzrə təhqiqatı və ya istintaqı aparan şəxslərin yazılı tapşırıqları;\n8) xarici dövlətlərin hüquq-mühafizə orqanlarının və ya müvafiq beynəlxalq təşkilatlarının rəsmi sorğuları.\n9) kəşfiyyat və əks-kəşfiyyat fəaliyyəti subyektlərinin yazılı sorğular","2023"],["Əməliyyat-axtarış tədbirlərinin həyata keçirilməsi üçün əsaslar hansılardır?","1) məhkəmənin (hakimin) qərarları;\n2) istintaq orqanlarının qərarları;\n3) əməliyyat-axtarış fəaliyyətinin səlahiyyətli subyektlərinin qərarları.","2023"],["Hansı əməliyyat-axtarış tədbirləri məhkəmənin (hakimin) qərarı əsasında həyata keçirilir?","telefon danışıqlarına qulaqasma;\npoçt, teleqraf və digər göndərişlərin yoxlanılması;\ntexniki rabitə kanallarından və digər texniki vasitələrdən informasiyanın çıxarılması;\nbinalara, o cümlədən yaşayış yerlərinə, hasarlanmış tikinti obyektlərinə, qurğulara və torpaq sahələrinə daxil olma və baxış keçirmə;\nbinaların, o cümlədən yaşayış yerlərinin, hasarlanmış tikinti obyektlərinin, qurğuların, torpaq sahələrin, nəqliyyat vasitələrinin və digər obyektlərin müşahidəsi;\ninsanların güdülməsi;","2023"],["Dövlət Gömrük Komitəsinin əsas funksiyaları hansılardır?","1. Azərbaycan Respublikasında gömrük işini təşkil etmək və onu\ntəkmilləşdirmək;\n2. Azərbaycan Respublikasının gömrük siyasətini həyata keçirmək;\n3. Öz səlahiyyətləri daxilində Azərbaycan Respublikasının iqtisadi\nmənafeyini və təhlükəsizliyini qorumaq;\n4. Öz səlahiyyətləri daxilində Azərbaycan Respublikasının gömrük\nərazisinin vahidliyini təmin etmək;\n5. Azərbaycan Respublikasında qabaqcıl gömrük tənzimlənməsi\nvasitələrinin tətbiqini təşkil etmək;\n6. İcrasına nəzarət gömrük orqanlarına həvalə olunmuş gömrük işinə\ndair və digər qanunvericiliyinə əməl olunmasını təmin etmək;","2023"],["Komitənin fəaliyyət istiqamətləri hansılardır?","gömrük işi sahəsində vahid dövlət siyasətinin formalaşdırılmasında iştirak edir və bu siyasətin həyata keçirilməsini təmin edir;\ngömrük işini təşkil edir və onun inkişafını təmin edir;\ngömrük işi sahəsində normayaratma fəaliyyətini həyata keçirir;\nhüquq mühafizə fəaliyyətini həyata keçirir;\nAzərbaycan Respublikasında qabaqcıl gömrük tənzimlənməsi vasitələrinin tətbiqini təşkil edir.","2023"],["Baku Elektronics 100 ədəd notebook alıb Cənubi Koreyanın Samsung şirkətindən 10 ədədi qüsurlu chixib ve 10 notebooku Samsunga qeri qaytarır sövdələşmə shərtinə uyğun olmadığı üçün yeni qüsursuz 10 ədəd getizdirir bu hansı prosedur olacaq?","Standart mübadilə (Xaricdə emal proseduru ilə gedəcək, tekrar idxal ilə qeri qayıdacaq)","2023"],["Lisenziya gömrük sahəsində hansı fəaliyyətə verilir?","Bitki mühafizə vasitələrinə\nAqrokimyəvi maddələrə\nPrekursor","2023"],["Həqiqi dövlət gömrük xidməti müşaviri kimdir?","ali rəis heyəti","2023"],["Tarif və qeyri-tarif tədbirləri nədir?","İdxal və ixrac əməliyyatlarına nəzarət etmək üçün dövlət tərəfindən 2 əsas yoldan istifadə olunur. Birinci tarif tədbirləri, ikincisi qeyri-tarif tədbirləri(yəni, ticarət siyasəti tədbirləri). Tarif tədbirlərini bilirik, yəni ki idxal ixrac olunan mallara rüsumlar tətbiq olunur. Qeyri-tarif tədbirləri əsas 2 yerə bölünür(digər növlər də var): iqtisadi və inzibati tədbirlər. İqtisadi tədbirlər: xüsusi növ rüsumlar, müxtəlif dərəcəli vergi və yığımlar, idxal üzrə depozitlər və ya valyuta ilə bağlı tənzimlənmə aparmaq üçün digər tədbirlərdən ibarətdir. İnzibati tədbirlər: embarqo(qadağa), kvotalaşdırma, lisenziyalaşdırma, ixracın məhdudlaşdırılması və s bu formalarda olur.... Bunlar hər hansı gömrük proseduruna tətbiq olunmur. Filan kateqoriya mallar filan prosedurda yerləşdirilə bilməz yazılıbsa bu sadəcə prosedurun şərtidir, ticarət siyasət tədbiri deyil. Ticarət siyasət tədbirləri(qeyri-tarif tədbirləri) hər hansı bir durum üçün, zaman üçün xarici ticarəti tənzimləməyə görədir ki, ölkəyə iqtisadi baxımdan ziyan dəyməsin. \"Müəllimin qeyd etdiyi kimi\": deyək ki, kartof çoxdu ölkədə, iqtisadi tədbir olaraq kartof idxalına dövlət xüsusi rüsum qoyur ki, ölkəyə kartof axını dayansın(və ya azalsın), amma kartof ixracına sahibkarlarda maraq yaratmaq üçün ixrac təşviqi(ixraca həvəsləndirmə) qoyur, məsələn ixrac olunan kartofun gömrük dəyərinin 3 faizi miqdarında sahibkara əlavə pul verir(bank hesabına köçürür). Ölkədə kartof çoxdursa idxal yox, ixraca şərait yardılmalıdır ki, ölkənin malı pula çevrilsin(ixrac olunsun, əvəzində ölkəyə valyuta daxil olsun), mal çürüyüb itkiyə getməsin.Bununla da kartofla bağlı iqtisadi maraqlarını tənzimləyir.","2023"],["BMT-nin gömrük sahəsində konvensiyaları hansılardır?","21 oktyabr 1982 Sərhədlərdə yüklərin nəzarətdən keçirilməsi şərtlərinin razılaşdırılması haqqında Konvensiyasına 11 fevral 2000-ci ildə qoşulub\n14.11.1975 Beynəlxalq Yük Daşımalarına dair Gömrük Konvensiyasına 12.03.1996\nKonteynerlər haqqında Beynəlxalq Konvensiya Cenevrə 02.12.1972 – 12.12.2000 qoşulub\nCustoms Convention on Containers - Konteynerlər haqqında Gömrük Konvensiyası\nCustoms Convention on the Temporary Importation for Private Use of Aircraft and Pleasure Boats - Təyyarələrin və istirahət gəmilərinin şəxsi istifadə üçün müvəqqəti idxalı haqqında Gömrük Konvensiyası\n18.05.1956 Customs Convention on the Temporary Importation of Commercial Road Vehicles - Kommersiya nəqliyyat vasitələrinin müvəqqəti idxalı haqqında Gömrük Konvensiyası 11.02.2000\n4 June 1954 Customs Convention on the Temporary Importation of Private Road Vehicles - Şəxsi yol nəqliyyat vasitələrinin müvəqqəti idxalı haqqında Gömrük Konvensiyası\n4 June 1954 Convention Concerning Customs Facilities for Touring - Gəzinti üçün Gömrük Obyektləri Haqqında Konvensiya","2023"],["Azərbaycanın gömrük sahəsində qoşulduğu konvensiyalar hansılardır?","BYD\nKioto\nCenevrə\nNayrobi","2023"],["Kvota nə üçün tətbiq olunur?","Tarif kvotası – idxal edilən ayrı-ayrı malların müvafiq icra hakimiyyəti orqanı tərəfindən müəyyən edilmiş miqdarına (dəyərinə) qanunvericilikdə nəzərdə tutulduğundan daha aşağı idxal gömrük rüsumunun və həmin miqdardan (dəyərdən) artıq olan hissəsinə daha yüksək idxal gömrük rüsumunun tətbiqini nəzərdə tutan müddətli tənzimlənmə üsuludur","2023"],["Mallar barəsində sərəncam verilməsi malların xüsusiyyətləri nəzərə alınmaqla, hansı formalarda həyata keçirilir?","əvəzsiz olaraq aidiyyəti dövlət orqanlarına vermə;\ntəkrar emal;\nməhv etmə.","2023"],["Standart mübadilə nədir?","Standart mübadilə sistemi çərçivəsində idxal edilmiş məhsul (əvəzləyici məhsul) emal məhsulunu əvəz edə bilər.\nGömrük orqanları standart mübadilə sistemindən istifadəyə emal əməliyyatları qüsurlu daxili malların təmiri ilə əlaqədar olduğu hallarda icazə verirlər.\nƏvəzləyici məhsullar təmirə məruz qalan qüsurlu mallarla eyni keyfiyyətə, eyni texniki göstəricilərə və xarici iqtisadi fəaliyyətin mal nomenklaturası üzrə eyni rəqəmli koda malik olmalıdırlar.\nQüsurlu mallardan ixracdan əvvəl istifadə olunmuşdursa, əvəzləyici məhsullar da istifadə edilmiş olmalıdırlar.\nƏvəzləyici məhsul qanundan irəli gələn öhdəliklər, müqavilədən irəli gələn zəmanət öhdəlikləri, yaxud istehsal və ya material qüsurları ilə əlaqədar olaraq ödənişsiz təqdim edilmişdirsə, gömrük orqanları bu Qaydaların 11.4-cü bəndində qeyd olunan tələbdən imtina edirlər.\nEmal edilmiş məhsullara tətbiq olunması nəzərdə tutulan müddəalar əvəzləyici məhsullara da şamil edilir.","2023"],["Gömrük hərracında behin məbləği?","Əmlakın ilkin satış qiymətinin 5 (beş) faizi həcmində beh alınır","2023"],["Gömrük hərracında qiymətin aşağı salınması ardıcıllığı necədir?","Əmlakın satışı üzrə keçirilən ilk iki hərracda sifariş verilmədikdə və ya mallar satılmadıqda, üçüncü hərracda satıcı tərəfindən əmlakın ilkin satış qiymətinin 10 faizi həcmində, dördüncü hərracda ilkin satış qiymətinin 25 faizi həcmində, beşinci hərracda ilkin satış qiymətinin 50 faizi həcmində aşağı salınır.","2023"],["Bəyannamə hansı hallarda ləğv edilir?","Gömrük orqanları təsdiq olunmuş gömrük bəyannaməsini bəyannaməçinin müraciəti əsasında aşağıdakı hallarda ləğv edirlər:\nmallar dərhal başqa gömrük proseduru altında yerləşdirilməli olduqda;\nfors-major halları ilə əlaqədar malların bəyan edildiyi gömrük proseduru altında yerləşdirilməsi mümkün olmadıqda.\nGömrük orqanları bəyannaməçiyə malları yoxlamaq niyyətini bildirdikdə, gömrük bəyannaməsinin ləğvi barədə müraciətə yalnız müvafiq yoxlama aparıldıqdan sonra baxılır\nGömrük bəyannaməsi malların buraxılışından sonra ləğv edilə bilməz.\nAşağıdakı hallarda gömrük bəyannaməsi malların buraxılışından sonra ləğv edilir:\ngömrük auditi gömrük orqanları tərəfindən malların və nəqliyyat vasitələrinin buraxılışından, o cümlədən şərti buraxılışından sonra gömrük bəyannaməsində göstərilən məlumatların düzgün olmadığını müəyyən etdikdə;\ngömrük auditi şəxsin mallar və nəqliyyat vasitələri barədə sərəncam verilməsinə dair məhdudiyyətlərə, tələblərə və şə
