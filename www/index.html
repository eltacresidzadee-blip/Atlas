 buraxırıq\nBəli kitab qalır şəxs gedir rəy almağa rəydə elektron göndərilir astaraya gömrüyünə","2023"],["Dini təyinatli ədəbiyyatla hansı qanundandır və cinayət məcəlləsində cəriməsi?","Maddə 167-2. Qanunsuz olaraq dini təyinatlı ədəbiyyatı, audio və video materialları, mal və məmulatları və dini məzmunlu başqa məlumat materiallarını istehsal etmə, idxal etmə, satma və ya yayma\n167-2.1. Müvafiq razılıq olmadan dini təyinatlı ədəbiyyatı (kağız və elektron daşıyıcılarında), audio və video materialları, mal və məmulatları və dini məzmunlu başqa məlumat materiallarını istehsal etmə, satış və ya yayma məqsədi ilə idxal etmə, satma və ya yayma -\nbeş min manatdan yeddi min manatadək miqdarda cərimə və ya iki ilədək müddətə azadlığın məhdudlaşdırılması və ya iki ilədək müddətə azadlıqdan məhrum etməklə cəzalandırılır.\n167-2.2. Eyni əməllər:\n167-2.2.1. qabaqcadan əlbir olan bir qrup şəxs və ya mütəşəkkil dəstə tərəfindən törədildikdə;\n167-2.2.2. təkrar törədildikdə;\n167-2.2.3. vəzifəli şəxs tərəfindən öz qulluq mövqeyindən istifadə etməklə törədildikdə -\nyeddi min manatdan doqquz min manatadək miqdarda cərimə və ya iki ildən dörd ilədək müddətə azadlığın məhdudlaşdırılması və ya iki ildən beş ilədək müddətə azadlıqdan məhrum etməklə cəzalandırılır.","2023"],["Gömrük işi əlehinə olan cinayələr hansılardır?","Dərman vasitələrinin qanunsuz dövriyyəsi\nİxrac nəzarətinə aid sənəd və məlumatları yayma\nQiymətli metalları və qiymətli daşları dövlətə satmaqdan yayınma\nQaçaqmalçılıq\nXarici valyuta vəsaitlərini xaricdən qaytarmama\nGömrük ödənişlərinin ödənilməsindən yayınma\nİxrac rejimini pozma\nKibercinayətlərin törədilməsi üçün hazırlanmış vasitələrin dövriyyəsi\nQanunsuz olaraq narkotik vasitələri, psixotrop maddələri və ya onların prekursorlarını hazırlama, istehsal etmə, əldə etmə, saxlama, daşıma, göndərmə və ya satma\nAksiz markası ilə markalanmalı olan malları belə marka olmadan və məcburi nişanlama ilə nişanlanmalı olan malları nişanlanmadan satma, satış məqsədilə saxlama, istehsal binasının hüdudlarından kənara çıxarma və ya idxal etmə, habelə belə malların nağd qaydada alqı-satqısı\nGenetik modifikasiya olunmuş bitkilərin, yaxud müasir biotexnoloji və gen mühəndisliyi metodları ilə yaradılmış kənd təsərrüfatı bitki materiallarının və ya genetik modifikasiya olunmuş bitkilərin genetik materiallarından istifadə edilərək istehsal olunan yeyinti məhsullarının qanunsuz dövriyyəsi","2023"],["Tranzit xüsusi gömrük prosedurunda malın yol vergisinə təsiri varmı, hansı halda yol vergisinin predmeti ola bilər mal?","Bəli, yüklərin təhlükəlik dərəcəsindən,yüklərin çəkisindən asılı olaraq yol vergisinə təsiri var","2023"],["Avtonəqliyyat vasitəsi rəsmiləşdirildikdən sonra verilən yaşıl vərəqə hansı müddətdə hansı orqana verilməlidir?","Nəqliyyat vasitəsinin qeydiyyata alınması üçün verilmiş vəsiqə verildiyi tarixdən etibarən 10 (on) gün müddətində “Yol hərəkəti haqqında“ Azərbaycan Respublikasının Qanununa uyğun olaraq nəqliyyat vasitələrinin dövlət qeydiyyatını aparan orqana(Daxili işlər nazirliyi baş dövlət yol polisi idarəsinə) təqdim edilməlidir.","2023"],["Prosedurların,qərarların,qanunların və fərmanların tarixi və nömrələri","\"Gömrük tarifi haqqında\" Azərbaycan Respublikasının 687-İVQ nömrəli 13.06.2013 tarixli Qanunu\nAzərbaycan Respublikası Nazirlər Kabinetinin 22 iyul 2014-cü il tarixli 263 nömrəli Qərarı ilə təsdiq edilmiş \"Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları\"\nAzərbaycan Respublikası Nazirlər Kabinetinin 2012-ci il 12 oktyabr tarixli 229 nömrəli Qərarı ilə təsdiq edilmiş \"Malların təkrar idxal gömrük proseduru altında yerləşdirilməsi Qaydaları\"\nAzərbaycan Respublikası Nazirlər Kabinetinin 2012-ci il 31 oktyabr tarixli 252 nömrəli Qərarı ilə təsdiq edilmiş \"Malların təkrar ixrac gömrük proseduru altında yerləşdirilməsi Qaydaları\"\nAzərbaycan Respublikası Nazirlər Kabinetinin 2013-cü il 2 sentyabr tarixli 244 nömrəli Qərarı ilə təsdiq edilmiş \"Malların müvəqqəti ixrac gömrük proseduru altında yerləşdirilməsi Qaydaları\"\nAzərbaycan Respublikası Nazirlər Kabinetinin 2013-cü il 2 sentyabr tarixli 245 nömrəli Qərarı ilə təsdiq edilmiş \"Malların müvəqqəti idxal xüsusi gömrük proseduru altında yerləşdirilməsi Qaydaları\"\nAzərbaycan Respublikası Nazirlər Kabinetinin 2014-cü il 14 yanvar tarixli 5 nömrəli Qərarı ilə təsdiq edilmiş \"Malların beynəlxalq və daxili tranzit xüsusi gömrük prosedurları altında yerləşdirilərək daşınması Qaydaları\"\nAzərbaycan Respublikası Nazirlər Kabinetinin 2013-cü il 27 avqust tarixli 233 nömrəli Qərarı ilə təsdiq edilmiş \"Malların son istifadə xüsusi gömrük proseduru altında yerləşdirilməsi Qaydaları\"\nAzərbaycan Respublikasının Konstitusiyası. 12 noyabr 1995-ci il\n“Dövlət qulluğu haqqında” Azərbaycan Respublikasının Qanunu. 21 iyul 2000-ci il, № 926-IQ\n“Dövlət qulluqçularının etik davranış qaydaları haqqında\" Azərbaycan Respublikasının Qanunu. 31 may 2007-ci il, № 352-IIIQ\n“Korrupsiyaya qarşı mübarizə haqqında” Azərbaycan Respublikasının Qanunu. 13 yanvar 2004-cü il, № 580-IIQ\n“Vətəndaşların müraciətləri haqqında” Azərbaycan Respublikasının Qanunu. 30 sentyabr 2015-ci il, № 1308-IVQ\n\"İnzibati icraat haqqında\" Azərbaycan Respublikasının Qanunu. 21 oktyabr 2005-ci il, № 1036-IIQ\n“Azərbaycan Respublikasında dövlət dili haqqında” Azərbaycan Respublikasının Qanunu. 30 sentyabr 2002-ci il № 365-IIQ\n“Azərbaycan Respublikası Dövlət bayrağının istifadəsi qaydaları haqqında” Azərbaycan Respublikasının Qanunu. 8 iyun 2004-cü il № 683-IIQ\n\"Azərbaycan Respublikasının Dövlət Gerbindən istifadə qaydaları haqqında\" Azərbaycan Respublikasının Qanunu. 19 fevral 2019-cu il № 1511-VQ\n\"Azərbaycan Respublikasının Dövlət Himnindən istifadə qaydaları haqqında\" Azərbaycan Respublikasının Qanunu. 19 fevral 2019-cu il № 1512-VQ\n“Gömrük orqanlarında xidmət haqqında Əsasnamə”nin təsdiq edilməsi barədə Azərbaycan Respublikasının Qanunu. 7 dekabr 1999-cu il, № 768-IQ\nAzərbaycan Respublikası Prezidentinin 2012-ci il 4 iyun tarixli 646 nömrəli Fərmanı ilə təsdiq edilmiş “Azərbaycan Respublikasının Dövlət Gömrük Komitəsi haqqında Əsasnamə”\n“Azərbaycan Respublikası Gömrük Komitəsinin yaradılması haqqında” Azərbaycan Respublikası Prezidentinin 1992-ci il 30 yanvar tarixli 561 nömrəli Fərmanı\nAzərbaycan Respublikası Prezidentinin 2003-cü il 27 sentyabr tarixli 935 №-li Fərmanı ilə təsdiq edilmiş “Dövlət orqanlarında, dövlət mülkiyyətində olan və paylarının (səhmlərinin) nəzarət zərfi dövlətə məxsus olan hüquqi şəxslərdə və büdcə təşkilatlarında kargüzarlığın aparılmasına dair Təlimat”\nAzərbaycan Respublikası Dövlət Gömrük Komitəsi Kollegiyasının 2012-ci il 30 yanvar tarixli 01/03 №-li qərarı ilə təsdiq edilmiş Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksi","2023"],["ÜGT-ın baş katibi kimdir?","Kunio Mikuriya (Yaponiya)","2023"],["Hərbi avtonəqliyyat vasitəsi sərhəddən keçərkən təmir olunmalıdır ,hansı prosedura yerləşdiriləcək?","Daxildə emal xüsusi gömrük proseduru\nQəbul etməsələr dövlətlərarası sazişə uyğun olaraq","2023"],["Beynəlxalq poçt göndərişlərində hansı bəyannamələr tətbiq olunur?","BPG-nə gömrük nəzarətinin həyata keçirilməsi ən azı üç nəfər işçinin (iki nəfər poçt işçisi və bir nəfər gömrük orqanının vəzifəli şəxsi) iştirakı ilə həyata keçirilir. Gömrük nəzarəti üçün təqdim olunmuş BPG-nin xarici görünüşü yoxlanılmaqla və faktiki çəkisi dəqiqləşdirilməklə müşayiət qaimələrində və gömrük bəyannamələrində (CN-22 və CN-23) qeyd olunan məlumatlarla eyniləşdirilir.\nİçərisində qəzetlər, dövri nəşrlər, kitablar və digər çap nəşrləri olan və eyni ünvan sahibinə, eləcə də eyni bir bir təyinat yerinə göndərilən xüsusi kisələr hər iki sistemdə M kisələri adlanır; çəki limiti: 30 kq\nSürətli poçt xidməti\nEMS - göndərişinin tərkibi sənədlərdən və ya mallardan, yaxud hər ikisindən ibarət ola bilər.\nSekoqram - içərisində korlar üçün nəzərdə tutulmuş qabarıq şriftli nəşrlər olan poçt göndərişi;\nBanderol — Pul dəstləri bağlamaq üçün Milli Bank tərəfindən təsdiq edilmiş vahid normalı kağız lent","2023"],["Gömrük dəyərinə düzəliş edilmesi barədə gömrük tarifi haqqında qanuna olunan əlavə hansıdı?","“Mallara dair bəyannamənin təsdiq edildiyi gündən 1 (bir) il müddətində malların qüsurlu olması ilə əlaqədar sövdələşmə qiymətinə düzəlişlər edilməsi halları”nın təsdiq edilməsi haqqında Nazirlər Kabinetinin 27 dekabr 2013-cü il № 355 qərarı","2023"],["Dövlət rüsumu nədir?","Dövlət rüsumu - dövlət orqanları və müvafiq icra hakimiyyəti orqanının yaratdığı qurumlar tərəfindən hakimiyyət səlahiyyətlərinin icrası zamanı göstərilən və hüquqi nəticələrin yaranmasına səbəb olan xidmətlərə və hüquqi hərəkətlərə görə (sənədlərin tərtibi, qeydiyyatı, razılıqların verilməsi və s.) ödənilən haqdır (ödənişdir).","2023"],["Beynəlxalq uçuşları həyata keçirən hava nəqliyyatının Azərbaycan Respublikasının gömrük ərazisinə məcburi enmə hallarında hansı prosedura yerləşdirilir?","Mlların beynəlxalq və daxili tranzit xüsusi gömrük prosedurları altında yerləşdirilərək daşınması beynəlxalq uçuşları həyata keçirən hava nəqliyyatının Azərbaycan Respublikasının gömrük ərazisinə (bundan sonra - gömrük ərazisi) məcburi (texniki) enmə hallarına (malların hava nəqliyyatına yüklənilməsi, oradan boşaldılması və bununla əlaqədar digər yük əməliyyatlarının aparılmaması şərtilə) şamil edilmir.Yük əməliyyatı aparıldıqda beynxalxalq tranzitə xüsusi gömrük proseduruna yerləşdiriləcək.Təmir əməliyyatları aparıldıda isə daxildə emal xüsusi gömrük proseduruna","2023"],["“Bir pəncərə” sisteminin 4 prinsipi hansılardı?","Beynelxalq ticaretin asanlasdirilmasi.\nSuni manelerin aradan qaldirilmasi\nSerhed kecid menteqelerinin buraxilis qabiliyyetinin artirilmasi\nIdxal ixrac emeliyyatlarinin muasir telebe uygun aparilmasi","2023"],["Yol vergisinin vergitutma obyekti","Azərbaycan Respublikasının ərazisinə daxil olan və Azərbaycan Respublikasının ərazisini tərk edən zaman yol vergisinə cəlb olunmalı olan xarici dövlətlərin dövlətlərdə qeydiyyatda olan avtonəqliyyat vasitələri, habelə Azərbaycan Respublikasının ərazisində istehsal edilərək daxili istehlaka yönəldilən (topdan satılan) və Azərbaycan Respublikasının ərazisinə idxal edilən avtomobil benzini, dizel yanacağı və maye qaz yol vergisinin vergitutma obyektidir.","2023"],["İnzibati akt nə zaman hüquqi qüvvəyə minir?","İnzibati akt, ünvanlandığı şəxsə və ya maraqlarına toxunduğu şəxsə bu barədə məlumat verildiyi andan və yaxud bu barədə həmin şəxslərə məlum olduğu andan hüquqi qüvvəyə minir. İnzibati akt məlumat verildiyi məzmunda hüquqi qüvvəyə minir və hüquqi cəhətdən etibarlı sayılır.","2023"],["İnzibati akt nə zaman təqdim olunmuş sayılır?","Poçt rabitəsi vasitəsilə ölkə daxilində göndərilmiş inzibati akt, onun poçta təqdim edildiyi gündən 5 gün keçdikdən sonra, elektron üsulla göndərilmiş inzibati akt isə göndərildiyi gündən 3 gün keçdikdən sonra maraqlı şəxsə təqdim olunmuş sayılır.","2023"],["Gömrük tarifi nələrin əsasında müəyyən edilir?","xarici iqtisadi fəaliyyətin mal nomenklaturası;\ntamamilə və ya qismən xarici iqtisadi fəaliyyətin mal nomenklaturasına əsaslanan və malların ticarəti ilə bağlı tarif tədbirlərinin tətbiqi məqsədilə xüsusi sahələri tənzimləyən qanunvericilik aktları ilə müəyyən edilmiş digər nomenklatura;\nxarici iqtisadi fəaliyyətin mal nomenklaturasının əhatə etdiyi mallara tətbiq olunması nəzərdə tutulan avtonom və ya konvensiya idxal gömrük rüsumları;\nmüəyyən ölkələrlə, yaxud beynəlxalq təşkilatlarla bağlanılmış beynəlxalq müqavilələrdə nəzərdə tutulmuş preferensial tarif tədbirləri;\nmüəyyən ölkələrə, yaxud beynəlxalq təşkilatın üzv ölkələrinə münasibətdə birtərəfli qaydada qəbul edilən preferensial tarif tədbirləri;\nmüəyyən mallar üzrə gömrük rüsumlarının azaldılmasını, yaxud gömrük rüsumlarından azadedilməni təmin edən tədbirlər;\nmüəyyən malların xüsusiyyətləri, yaxud son istifadəsi ilə əlaqədar olaraq, bu Məcəllə və müvafiq qanunvericiliklə müəyyən edilmiş güzəştli tarif rejimi;\nkənd təsərrüfatını, ticarəti və başqa sahələri tənzimləyən qanunvericiliklə müəyyən edilmiş digər tarif tədbirləri.","2023"],["Gömrük işində risklərin idarə edilməsi sistemi hansı məqsədlər üçün tətbiq olunur?","gömrük nəzarəti və gömrük rəsmiləşdirilməsi zamanı diqqətin yüksək riskli sahələrə yönəldilməsi və gömrük orqanlarının sərəncamında olan vasitələrdən səmərəli istifadənin təmin edilməsi;\ngömrük işi sahəsində hüquqpozmaların aşkar olunması imkanlarının artırılması;\ngömrük qanunvericiliyinə riayət edən şəxslərə məxsus olan malların və nəqliyyat vasitələrinin gömrük sərhədindən keçirilməsinə əlverişli şərait yaradılması.","2023"],["Hansı kateqoriya mallar qapalı hərracda satılır?","Qanunvericilikdə belə hal nəzərdə ttulmayıb","2023"],["Prezidentə qanunlar imzalanmaq üçün neçə günə təqdim olunur?","Qanunlar qəbul edildiyi gündən 14 gün müddətində Azərbaycan Respublikasının Prezidentinə imzalanmaq üçün təqdim edilir.\nTəcili elan olunan qanun layihəsi Azərbaycan Respublikasının Prezidentinə imzalanmaq üçün qəbul edildiyi gündən 24 saat ərzində təqdim edilir.","2023"],["Prezident seçilmək üçün yaş həddi neçədir?","Qanunvericilikdə belə hal nəzərdə ttulmayıb","2023"],["Gömrük Məcəlləsi nədir?","Azərbaycan Respublikasının Gömrük Məcəlləsi (bundan sonra - Məcəllə) Azərbaycan Respublikasında gömrük işinin hüquqi, iqtisadi və təşkilati əsaslarını, o cümlədən Azərbaycan Respublikasının gömrük ərazisinə gətirilən, bu ərazidən aparılan, tranzitlə keçirilən mallara və nəqliyyat vasitələrinə tətbiq edilən ümumi qaydaları və prosedurları, gömrük işi sahəsində şəxslərin hüquqlarını və vəzifələrini müəyyənləşdirir.","2023"],["Elektron modellər yaradılarkən nələr nəzərə alınır?","Gömrük Məcəlləsində və müvafiq qanunvericilikdə nəzərdə tutulduğu hallarda, sənədlərin elektron formada təqdim edilməsi;\nelektron və kağız üzərində yazılı formalarda sənədlər əsasında məlumatların dəqiqliyinin yoxlanılması üsullarının mövcudluğu;\ngömrük xidmətləri, habelə onlar ilə başqa istifadəçilər arasında gömrük məqsədləri üçün informasiya mübadiləsinin elektron üsullarından istifadə edildilkdə, alınan məlumatları saxlama hüququnun olması;\ngömrük prosedurlarının və gömrük ödənişlərinin elektron idarə edilməsi sistemlərinin yaradılması və tətbiq edilməsi.","2023"],["Bələdiyyə müəyyən etdiyi məsələlər kimlər üçün vacibdir?","Bələdiyyələrin qəbul etdiyi aktın icrası onun ərazisində yaşayan vətəndaşlar və onun ərazisində yerləşən hüquqi şəxslər üçün məcburidir.","2023"],["Yerli icra hakimiyyəti orqanının qərarları normativ aktlara aiddirmi?","Öz səlahiyyətləri daxilində yerli icra hakimiyyəti orqanları qanunvericilik sisteminə daxil olan aktlara zidd gəlməyən normativ xarakterli aktlar qəbul edə bilərlər.\nNormativ xarakterli aktlara aiddir:\nKonstitusiya məhkəməsinin qərarlari\nAR mərkəzi seçki komissiyasinin qərarlari, təlimatlari və izahlari\nMaliyyə bazarlari tənzimləyicisinin qərarlari-mərkəzi bankin qərari, MMX-nin qərari\nMəhkəmə-hüquq şurasinin qərarlari\nAr audiovizual şurasinin qərarlari\nYerli özünüidarə orqanlarinin qərarlari\nYerli icra hakimiyyəti orqanlarinin qərarlari","2023"],["Bir pəncərə nədir?","Bununla əlaqədar dövlət sərhədindən keçirilən malların və nəqliyyat vasitələrinin yoxlanılması zamanı süni maneələrin aradan qaldırılması, idxal-ixrac əməliyyatlarının müasir tələblərə uyğun aparılması üçün münbit şəraitin yaradılması məqsədi ilə tədbiq edilən sistemdir.","2023"],["FHN DGK ilə müştərək gömrük auditi keçirir?","Qanunvericilikdə belə hal nəzərdə tulmayıb","2023"],["Kimlər etik davraniş üzre müvəkkil ola bilər.","Rəhbər vəzifələr üzrə 3 (üç) ildən az olmamaqla, 5 (beş) ildən çox dövlət qulluğunda inzibati vəzifələrdə qulluq keçən və yüksək mənəvi keyfiyyətlərə malik şəxslər etik davranış üzrə müvəkkil ola bilərlər.","2023"],["Konstusiyaya elaveler nece olur?","I. Azərbaycan Respublikası Konstitusiyasına əlavələr Azərbaycan Respublikasının Milli Məclisində 95 səs çoxluğu ilə Konstitusiya qanunları şəklində qəbul edilir.\nII. Azərbaycan Respublikasının Konstitusiyasına əlavələr haqqında Konstitusiya qanunları Azərbaycan Respublikasının Milli Məclisində iki dəfə səsə qoyulur. İkinci səsvermə birinci səsvermədən 6 ay sonra keçirilir.\nIII. Azərbaycan Respublikasının Konstitusiyasına əlavələr haqqında Konstitusiya qanunları həm birinci, həm də ikinci səsvermədən sonra bu Konstitusiyada qanunlar üçün nəzərdə tutulmuş qaydada Azərbaycan Respublikası Prezidentinə imzalanmaq üçün təqdim olunur.\nIV. Azərbaycan Respublikasının Konstitusiyasına əlavələr haqqında Konstitusiya qanunları Azərbaycan Respublikasının Prezidenti tərəfindən ikinci səsvermədən sonra imzalandıqda qüvvəyə minir.\nV. Konstitusiya qanunları Azərbaycan Respublikası Konstitusiyasının ayrılmaz hissəsidir və Azərbaycan Respublikası Konstitusiyasının əsas mətninə zidd olmamalıdır.\nMaddə 157. Azərbaycan Respublikası Konstitusiyasına əlavələrin təklif edilməsi təşəbbüsü\nAzərbaycan Respublikasının Konstitusiyasına əlavələri Azərbaycan Respublikasının Prezidenti və ya Azərbaycan Respublikası Milli Məclisinin azı 63 deputatı təklif edə bilərlər.\nMaddə 158. Azərbaycan Respublikasının Konstitusiyasına əlavələrin təklif edilməsi təşəbbüsünün məhdudlaşdırılması\nBu Konstitusiyanın birinci bölməsində əks etdirilmiş müddəalarla əlaqədar Azərbaycan Respublikası Konstitusiyasına əlavələr təklif edilə bilməz.","2023"],["BMT is prinsipi ne vaxt yarafılıb ve yaranma tesebbuskarları hansı olkeler olub?","Birləşmiş Millətlər Təşkilatı (ing. United Nations) — 1945-ci il oktyabrın 24-də dünyanın ən güclü 50 dövləti tərəfindən yaradılmış \"Ümumdünya Hökuməti\". Hazırda dünyanın 193 ölkəsi, 500 asılı ərazi, Antarktida materiki, Qərbi Səhra, Dünya okeanı bütünlükdə yer kürəsinin 80 — % ərazisi, BMT-nin mandat sisteminə daxildir\nABŞ, SSRİ, Böyük Britaniya, Çin, İtaliya, Yaponiya, Fransa","2023"],["Nəqliyyat sənədləri hansılardı?hava demiryol deniz ayrı ayrılıqda hansılardı?","Ehtiyatlar hesab olunan mallara dair sənədlər. - \"Beynəlxalq mülki aviasiya haqqında\"Konvensiyanın və onun. 9-cu və 15-ci əlavələrinin, \"Beynəlxalq dəniz gəmiçiliyinin asanlaşdırılması haqqında\" Konvensiyanın və onun Əlavəsinin və \"Beynəlxalq dəmiryolu yük daşımaları haqqında\" Sazişin 7-ci maddəsinin tələblərinə uyğun olaraq tərtib edilən və nəqliyyat vasitələrində istifadə və istismar üçün ehtiyatlar hesab olunan malların nomenklaturasını, çeşidini və miqdarını özündə əks etdirən\n\"uçuş tapşırığı\",\n\"gəmi ehtiyatları haqqında arayış\"\n\"dəmiryolu qaiməsi\".","2023"],["Avropa ittifaqı ilə Avropa Şurasının fərqi nədir?","Avropa Şurası — qitənin insan hüquqlarını müdafiə edən aparıcı beynəlxalq təşkilatıdır. Avropa İttifaqının 27 üzv dövlətləri daxil olmaqla 46 üzv dövlətdən ibarətdir.\nAvropa İttifaqı (Aİ)27 dövləti birləşdirən dövlətlərüstü və eyni zamanda dövlətlərarası iqtisadi və siyasi təşkilat.\nFormal olaraq 1 noyabr 1992-cü ildə Maastrixt sazişi ilə təsis edilmiş bu ittifaqın təməli 18 aprel 1951-ci il tarixli Paris Müqaviləsinə əsasən, Belçika, Almaniya, Fransa, Niderland, Lüksemburq və İtaliya tərəfindən Avropa Kömür və Polad Cəmiyyəti (AKPC) yaradılması ilə qoyulub.","2023"],["Tarif guzestleri ile preferensial malin ferqi nedi?","Tarif güzəştləri konkret hansısa prosedur ilə bağlı azadolmadır, prefensial mənşəli mallar isə Azad Ticarət sazişimiz olan ölkələrdən idxal olunan mallar üçün nəzərdə tutulur (idxal gomruk rüsümü tutulmur)","2023"],["İxrac nədir?","• Azərbaycan Respublikası ərazisində tam istehsal edilmiş və ya kifayət qədər emal edilmiş məhsulların digər ölkə ərazisinə nəql edilməsidir.","2022"],["İxrac gömrük proseduru altında hansı mallar yerləşdirilə bilməz?","• Son istifadə xüsusi gömrük proseduru\n• Daxil tranzit xüsusi gömrük proseduru\n• Xaricdə emal xüsusi gömrük proseduru\n• Müvəqqəti ixrac gömrük proseduru","2022"],["Təkrar ixrac nədir?","• Azərbaycan Respublikasına ixrac edilmiş malların, şəxs tərəfindən Gömrük məcəlləsinə uyğun olaraq təkrar ixrac bildirişi verməklə, Azərbaycan Respublikası ərazisindən kənara aparılmasıdır.","2022"],["Təkrar ixrac gömrük proseduru altında hansı mallar yerləşdirilə bilməz?","• Beynəlxalq tranzit xüsusi gömrük proseduru\n• Sərbəst zonadan birbaşa təkrar ixrac edilən mallar\n• Müvəqqəti saxlanc yerlərindən birbaşa təkrar ixrac edilən və müvəqqəti saxlac xüsusi gömrük proseduru altında yerləşdirilən mallar","2022"],["Təkrar ixrac gömrük proseduru üçün müəyyən edilmiş şərtlər hansılardır?","• Malların qüsurlu olması və sövdələşmə şərtlərinə cavab verməməsi\n• Malların onları göndərən şəxsə geri qaytarılması\n• Emal əməliyyatlarına məruz qalmamaq və istehlak edilməmək şərtilə 1 il müddətinə təkrar ixracı","2022"],["Təkrar ixraca alternativ olaraq mallara dair hansı əməliyyatlar aparıla bilər?","• Dövlət xeyrinə imtina ediləməsi\n• Gömrük nəzarəti altında məhv edilməsi","2022"],["Müvəqqəti ixrac gömrük proseduru nədir?","• Təkrar idxal üçün nəzərdə tutulmuş daxili mallar müvəqqəti ixrac gp altında yerləşdirilə bilər.","2022"],["Müvəqqəti ixrac gömrük proseduru hansı mallara şamil edilmir?","• Fiziki şəxslər tərəfindən güzəştli və sadələşdirilmiş qaydada, istehsal və kommersiya məqsədiləri üçün nəzərdə tutulan mallar.","2022"],["Müvəqqəti ixrac gömrük prosedurunun şərtləri hansılardır?","• Təkrar idxalı nəzərdə tutulmalıdır\n• Hər hansı bir başqa dəyişikliyə məruz qalmaması nəzərdə tutulduqda\n• Malların eyniləşdirilməsini təmin etmək mümkün olduqda","2022"],["Hansı malların Müvəqqəti ixrac gömrük proseduru altında yerləşdirilməsinə icazə verilmir?","• Yeyinti məhsulları, spirtli içkilər və tütün məmulatları, xammal və yarımfabrikat malları ( Nümayiş, sərgi və qastrol üçün vahid şəkildə aparılan mallar istisna olmaqla)\n• Sənaye tullantıları\n• Aparılması qadağan edilmiş və məhdudlaşdırılmış mallar","2022"],["Müvəqqəti ixrac gömrük prosedurunun müddəti nə qədərdir?","• 24 aydır. Məqsədə nail olmadıqda 1 ay qalmış şəxsin müraciəti əsasında 12 ay uzadıla bilər.","2022"],["Müvəqqəti ixrac gömrük proseduruna gömrük rüsumları və vergilərin tətbiqi hansı qaydada aparılır?","• 1 il ərzində və daha az müddətdə müvəqqəti ixrac gömrük proseduru altında qaldıqda tamamilə azaddır. 1 ildən artıq müddətə görə ixrac üçün ödəniləcək rüsumların 3 faizi miqdarında aylıq ödənişlər ödənilir. Ödənişlərin miqdarı bərabər oldquda ixrac gömrük rüsumalarına malar ixrac gömrük proseduru altında yerləşdirilmiş hesab eidlir.","2022"],["Sərbəst dövriyyəyə buraxılış gömrük proseduru nədir?","• Xarici malların daxili bazarda satılması, istifadə və istehlakı məqsədilə Azərbaycan Respublikası ərazisinə gətirilməsi zamanı mallar sərbəst dövriyyə buraxılış gp altında yerləşdirlir.","2022"],["Sərbəst dövriyyə buraxılış üçün hansı şərtlər yerinə yetirilməlidir?","• Gömrük rüsumları ödənilməli\n• Ticarət siyasəti tədbirlərinin tətbiqi\n• İdxal ilə bağlı digər prosedurların tamamlanması","2022"],["Hansı mallar sərbəst dövriyyəyə buraxılış gömrük proseduru altında yerləşdirilmir?","• Gömrük ərazisinə gətirilməsi qadağan olunmuş və məhdudlaşdırılmış mallar","2022"],["Malların təkrar idxal gömrük proseduru altında yerləşdirilməsi şərtləri hansılardır?","• Azərbaycan Respublikası ərazisindən ixrac edilən daxili mallar olmalıdır.\n• 3 il müddətinə gömrük ərazisinə qaytarılmalıdır.\n• Mallar aparıldığı vəziyyətdə olmalıdır.","2022"],["Malların təkrar idxal gömrük proseduru altında yerləşdirilməsinə hansı hal mane ola bilməz?","• Azərbaycan Respublikasının hüdudlarından kənarda mallardan istifadə edilməsi həmin malların təkrar idxal gömrük proseduru altında yerləşdirilməsinə mane ola bilməz.","2022"],["Tranzit xüsusi gömrük proseduru hansı hala şamil edilmir?","• Azərbaycan Respublikasının hava məkanından beynəlxalq uçuşlar aparan, keçən və məcburi enmə həyata keçirən hava gəmilərinə şamil edilmir.","2022"],["Mallar hansı tələblər altında tranzit xüsusi gömrük proseduru altında yerləşdirilə bilər?","• Mallar heç bir dəyişikliyə məruz qalmamalı\n• Göndərən gömrük orqanının müəyyən etdiyi marşurut və müddət ərzində təyinat gömrük orqanına çatdırılmalıdır.","2022"],["Beynəlxalq tranzit xüsusi gömrük proseduru nədir?","• Xarici malların heç bir gömrük rüsumu və vergilər, ticarət siyasəti tədbirləri həyata keçirilmədən gömrük nəzarəti altında bir yerdən başqa yerə daşınmasıdır.","2022"],["Beynəlxalq tranzit xüsusi gömrük proseduru altında daşınma qaydaları?","• Malların daşınması gömrük ərazisindən kənarda başlanır və başa çatır.\n• Malların daşınması gömrük ərazisinin 2 məntəqəsi arasında gömrük ərazisindən kənar ərazidən keşməklə baş verir.","2022"],["Beynəlxalq tranzit xüsusi gömrük proseduru ilə əlaqədar gömrük bəyannaməsi hansı müddət ərzində təqdim edilməlidir?","• 15 gündən gec olmayaraq gömrük orqanına təqdim edilməlidir.","2022"],["Beynəlxalq tranzit xüsusi gömrük proseduru altında daşınan mallara görə icazənin verilməsindən hansı hallarda imtina edilir?","• Gömrük ərazisinə gətirilməsinə qadağan qoyulmuş və ya məhdudlaşdırılmış mallar\n• Sənədlərdə yanlış məlumatıarən olması","2022"],["Daxili mallar hansı hallarda və şərtlər daxilində Beynəlxalq tranzit xüsusi gömrük proseduru altında yerləşdirilir?","• Mallar gömrük ərazisinin iki məntəqəsi arasında gömrük ərazisindən kənar ərazidən keçməklə daşındıqda;\n• Mallar gömrük ərazisinin iki məntəqəsi arasında gömrük ərazisindən kənar ərazidən keçməklə daşınaraq üçüncü ölkəyə aparıldıqda.\n• Malların gömrük rəsmiləşdirilməsi bu qaydalara uyğun həyata keçirildikdə\n• Malların statusu dəyişməməsi şərtilə bir yerdən başqa yerə daşınması","2022"],["Daxili tranzit xüsusi gömrük proseduru nədir?","• Malların daxili mal statusu dəyişmədən gömrük ərazisinin bir yerindən başqa yerə daşınmasıdır.","2022"],["Daxili tranzit xüsusi gömrük prosedurunun gömrük rəsmiləşdirilməsi üçün bəyannamənin verilməsi müddəti nə qədərdir?","• 15 gündən gec olamayaraq","2022"],["Tranzit xüsusi gömrük proseduru altında daşınan mallara üzərində hansı yük əməliyyatlarının keçirilməsinə icazə verilir?","• Malları tranzit daşıyan nəqliyyat vasitələrinə əlavə malların yüklənilməsinə və boşaldılmasına həmçinin nəqliyyat vasitəsinin dəyişdirilməsinə\n• Malların bir hissəsinin digər gömrük proseduru altında yerləşdirilməsinə","2022"],["Saxlanc gömrük prosedurunun neçə növü var?","• Müvəqqəti saxlanc\n• Gömrük anbarı","2022"],["Hər iki saxlanc xüsusi gömrük proseduru altında saxlanılan mallar hansıdır?","• Xarici mallar","2022"],["Yalnız Gömrük anbarı xüsusi gömrük proseduru altında saxlanılan mal hansıdır?","• Daxili mallar","2022"],["Hansı mallar müvəqqəti saxlanc xüsusi gömrük proseduru altında yerləşdirilərək bəyan edilir?","• Gömrük ərazisinə gətirilən mallar\n• Sərbəst zonadan birbaşa gətirilən mallar\n• Tranzit xüsusi gömrük proseduru başa çatmış mallar","2022"],["Müvəqqəti saxlanc xüsusi gömrük proseduru altında yerləşdirilməsi üçün gömrük bəyannaməsinin hansı formaları tələb edilir?","• Qısa idxal bəyannaməsi\n• Tranzit sənədi","2022"],["Müvəqqəti saxlanc xüsusi gömrük proseduru altında saxlama müddəti nə qədərdir?","• Maksimum 4 ay ola bilər.","2022"],["Daxili mallar hansı hallarda saxlanc xüsusi gömrük proseduru altında yerləşdirlir?","• Daxili malların ölkə ərazisindən ixracı nəzərdə tutulduqda\n• Daxili mallar daxili tranzit xüsusi gömrük proseduru altında yerləşdirildikdə","2022"],["Hansı malların müvəqqəti saxlanc xüsusi gömrük proseduru altında qalma müddəti 3 sutkadan çox ola bilməz?","• Azərbaycan Respublikası ərazisinə gətirilməsi qadağan olunmuş, məhdudlaşdırılmış və tez xarab olan mallar","2022"],["Müvəqqəti idxal xüsusi gömrük proseduru nədir?","• Təkrar ixrac üçün nəzərdə tutulmuş mallar müvəqqəti idxal xüsusi gömrük proseduru altında yerləşdirilir.","2022"],["Müvəqqəti idxal xüsusi gömrük proseduru hansı mallara şamil edilmir?","• Fiziki şəxslər tərəfindən güzəştli və sadələşdirilmiş qaydada ölkə ərazisinə gətirilən istehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan mallara şamil edilmir.","2022"],["Müvəqqəti idxal xüsusi gömrük prosedurundan hansı şərtlər daxilində istifadə olunur?","• Dəyişikliyə məruz qalmamalıdır\n• Eyniləşdirilməsinə imkan verilməlidir\n• Prosedur sahibi gömrük ərazisindən kənarda təsis edildikdə","2022"],["Müvəqqəti idxal xüsusi gömrük proseduru altında hansı malların yerləşdirilməsinə icazə verilmir?","• Yeyinti məhsullarının, spirtli və spirtsiz içkilərin, tütün və tütün məmulatlarının, xammal və yarımfabrikatların, sərf olunan material və nümunələrin;\n• Sənaye və digər tullantıların.\n• Gömrük ərazisinə gətirilməsi qadağan edilmiş və ya məhdudlaşdırılmış malların;","2022"],["Prosedur sahibi hansı şərtlər daxilində Müvəqqəti idxal xüsusi gömrük prosedurundan istifadə edir?","• Azərbaycan Respublikası adından (dövlətlərarası müqavilələr) və Azərbaycan Respublikasının hökuməti adından (hökumətlərarası müqavilələr) Azərbaycan Respublikasının xarici dövlətlərlə və beynəlxalq təşkilatlarla bağladığı beynəlxalq müqavilələrdə, hasilatın pay bölgüsü haqqında, əsas boru kəməri haqqında və digər bu qəbildən olan sazişlərdə və ya qanunlarda, o cümlədən neft və qaz haqqında, ixrac məqsədli neft-qaz fəaliyyəti və xüsusi iqtisadi zonalar haqqında qanunlarda nəzərdə tutulduqda;\n• Məhsul istehsalı, işlərin görülməsi, xidmətlərin göstərilməsi üzrə dövlət sifarişləri yerinə yetirildikdə;\n• Mədəniyyət, turizm, idman və bu qəbildən olan digər tədbirlər.","2022"],["Malların müvəqqəti idxal xüsusi gömrük proseduru altında qalma müddəti nə qədərdir?","• 24 aydır. 1 ay qalmış müraciət edildikdə 12 ay uzadılır.","2022"],["Müvəqqəti idxal xüsusi gömrük proseduru altında yerləşdirilmiş hansı xarici mallardan gömrük rüsumları və vergilərindən tamamilə azad olunmaqla istifadə olunur?","• Sərgilərdə, yarmarkalarda, konfranslarda, təqdimatlarda, müsabiqələrdə və iclaslarda nümayiş və ya istifadə üçün nəzərdə tutulan mallar;\n• Peşə avadanlığı və həmin avadanlıq üçün ləvazimatlar;\n• Malların qablaşdırılması üçün taralar\n• Malların yüklənməsi üçün konteynerlər\n• Təlim, əhliləşdirmə, çoxaltma, baytarlıq müalicəsi, turizm, təcrübə keçmə və digər xüsusi tədbirlərin həyata keçirilməsi üçün nəzərdə tutulmuş heyvanlar;","2022"],["Son istifadə xüsusi gömrük proseduru nədir?","• Son istifadə xüsusi gömrük proseduru altında yerləşdirilmiş mallar bu prosedurun məqsədinə uyğun olaraq, gömrük rüsumlarından və vergilərdən azad edilməklə, sərbəst dövriyyəyə buraxılır.","2022"],["Son istifadə xüsusi gömrük proseduruna hansı şərtlər əsasında icazə verilir?","• Gömrük orqanlarının son istifadə xgp-na nəzarət emək imkanı olduqda\n• İcazənin verilməsi yerli istehsalçıların mühim maraqlarına mənfi təsir göstərmədikdə","2022"],["Son istifadə xüsusi gömrük proseduru hansı hallarda başa çatmış hesab olunur?","• Mallar gömrük rüsumlarından və vergilərdən azad edilmənin tətbiqi üçün qanunvericiliklə müəyyən edilmiş məqsədlərə istifadə olunduqda;\n• Mallar ixrac və ya məhv edildikdə və ya onlardan dövlətin xeyrinə imtina olunduqda;\n• Mallardan gömrük rüsumlarından və vergilərdən azad olunmanın məqsədləri üçün istifadə edilmədiyi aşkar olunduqda və bununla əlaqədar qanunvericilikdə nəzərdə tutulmuş gömrük rüsumları və vergilər tam ödənildikdə;","2022"],["Xaricdə emal xüsusi gömrük proseduru nədir?","• Gömrük ərazisində sərbəst dövriyyədə olan daxili malların emal üçün gömrük ərazisindən kənara aparılması və sonradan idxal gömrük rüsumları, vergilər və ticarət siyasəti tədbirlərindən azadl olunmaqla sərbəst dövriyəyə buraxılmasıdır.","2022"],["Xaricdə emal xüsusi gömrük proseduru altında yerləşdirilməsinə icazə verilməyən mallar hansılardır?","• İxracı idxal gömrük rüsmlarının və vergilərin qaytarılmasına, onlardan azad olunması ilə nəticələnən mallar\n• İxrac edilməsi ixrac ezrə gömrük ödənişlərinin qaytarılmasına səbəb olan mallar\n• İxracdan əvvəl son istifadə ilə əlaqədar gömrük rüsumlarından və vergilərdən tam və ya qismən azad edilməklə sərbəst dövriyyəyə buraxılmış mallar;","2022"],["Xaricdə emal xüsusi gömrük proseduru altında yerləşdirlən mallar üzərində hansı əməliyyatlar aparıla bilər?","• Onların qorunması, xarici görünüşünün və keyfiyyətinin yaxşılaşdırılması, satış və daşınma üçün hazırlanması məqsədi ilə adi işləmə formalarına məruz qala bilərlər.","2022"],["Xaricdə emal xüsusi gömrük proseduru altında yerləşdirilən mallara hansı şərtlər daxilində icazə verilir?","• Gömrük orqanının xaricdə emal xüsusi gömrük proseduruna nəzarəti həyata keçirmək imkanı olduqda;\n• İcazənin verilməsi yerli istehsalçıların mühüm maraqlarına mənfi təsir göstərmədikdə.","2022"],["Xaricdə emal xüsusi gömrük proseduru altında malların yerləşdirilməsinə hansı şəxslərə icazə verilir?","• Rezidentlərə\n• Yerin təkindən istifadə hüququ verilmiş şəxslərə\n• Zəmanət təqdim edən və gömrük borcunun yarandığı və yarana biləcəyi hallarda onun ödənilməsinə təminat verən şəxslərə;","2022"],["Xaricdə emal xüsusi gömrük prosedurunun müddəti nə qədərdir?","• 2 ilə qədər. Ən azı 15 gün qalmış müraciət edildikdə 1 il uzadılır.","2022"],["Hansı hallarda xaricdə emal xüsusi gömrük proseduru altında yerləşdirilmiş mallar gömrük rüsumları və vergilərdən azad olunurlar?","• Gömrük ərazisindən kənarda ödənişsiz təmir edildiyi müvafiq sənədlərlə təsdiq edildikdə;\n• Qüsurlu daxili malların təmiri ilə əlaqədar standart mübadilə sistemindən istifadəyə icazə verildikdə;\n• Mallar heç bir emala məruz qalmadan, eyni vəziyyətdə gömrük ərazisinə qaytarıldıqda.","2022"],["Daxildə emal xüsusi gömrük proseduru nədir?","• Müəyyən malların emal əməliyyatları aparıldıqdan sonra ixrac edilməsi məqsədi ilə Azərbaycan Respublikasının gömrük ərazisinə gömrük rüsumları və vergilər alınmadan gətirilməsindən ibarət xüsusi gömrük proseduru;","2022"],["Daxildə emal xüsusi gömrük proseduruna hansı şərtlərdə icazə verilir?","• Gömrük orqanının daxildə emal xüsusi gömrük proseduruna nəzarəti həyata keçirmək imkanı olduqda;\n• İcazənin verilməsi yerli istehsalçıların mühüm maraqlarına mənfi təsir göstərmədikdə.","2022"],["Daxildə emal xüsusi gömrük prosedurundan istifadəyə hansı şəxslərə icazə verilir?","• Gömrük borcunun yarandığı və yarana biləcəyi hallarda onun ödənilməsinə təminat verən şəxslərə;\n• Daxildə emal xüsusi gömrük proseduru altında yerləşdirilmiş mallardan emal əməliyyatları aparan şəxsə.","2022"],["Hansı xüsusi gömrük prosedurları altında yerləşdirilmiş mallar ekvivalent mallarla əvəz edilə bilməz?","• Tranzit\n• Müvəqqəti idxal\n• Müvəqqəti saxlanc","2022"],["Hansı malların əvəzinə ekvivalent mallardan istifadəyə icazə verilmir?","• Gömrük anbarlarında saxlanc, emal və ya sərbəst zona xüsusi gömrük prosedurları altında yerləşdirilmiş malların qorunması, xarici görünüşünün və keyfiyyətinin yaxşılaşdırılması, satış və daşınma üçün hazırlanması məqsədi ilə adi işləmə formalarına məruz qaldıqda\n• Ekvivalent mallardan istifadə idxal gömrük rüsum və vergilərində əsassız fayda əldə etməyə imkan yaratdıqda\nGömrük nəzarəti haqqında\n442. Gömrük nəzarəti nədir ?\n• Gömrük qanunvericiliyinə riayət edilməsi məqsədilə gömrük orqanları tərəfindən həyata keçirilən tədbirlərdir.","2022"],["Hasilat normasını müəyyən edərkən nəylərin miqdarı hesablanmalıdır?","• İstehsal tullantıları\n• İstehsal itkilərinin","2022"],["İqtisadi şəraitin təhlili gömrük orqanları tərəfindən hansı hallarda aparılır?","• Malların emal və xüsusi istifadə xüsusi gömrük proseduru altında yerləşdirilməsinə icazə alınması üçün müraciət olunduqda\n• Malların emal və xüsusi istifadə xüsusi gömrük proseduru altında yerləşdirilməsi yerli istehsal sahələrinin mühüm maraqlarına mənfi təsir göstərməsi ilə bağlı kifayət qədər əsas olduqda\n• Yeli istehsalçıların və ya aidiyyəti qurumların əsaslandırılmış müraciəti olduqda\nŞərti buraxılış haqqında.\n203. Şərti buraxılış nədir ?\n• Mallardan və nəqliyyat vasitələrindən istifadə və sərəncam verilməsinə dair məhdudiyyətlərə, tələblərə və şərtlərə riayət edəcəyi haqqında şəxsin öhdəlikləri ilə müşayiət olunan buraxılışdır.","2022"],["Gömrük ödənişləri üzrə güzəştlər verilərək şərti buraxılmış mallardan hansı məqsədlər üçün istifadə olunur?","• Yalnız güzəşlətin verilməsi məqsədləri üçün istifadə oluna bilər.","2022"],["Gömrük ödənişləri üzrə güzəştlər verilərək şərti buraxılmış mallardan nə zaman başqa məqsədlər üçün istifadə oluna bilər?","• Nəzərdə tutulmuş gömrük rüsumları və vergilər tam ödənildikdən , qanunvericiliyin tələbləri yerinə yetirildikdən sonra gömrük orqanlarının icazəsi ilə başqa məqsədlər üçün istifadə oluna bilər.","2022"],["Şərti buraxılışa uyğun olmayan məqsədlər üçün sərəncam verilməsi gömrük orqanlarının icazəsi ilə hansı üsullarla həyata keçirilir?","• Gömrük rüsumları və vergilər tam ödənilməklə, sərbəst dövriyyəyə buraxılış gömrük proseduru altında yerləşdirilməklə,\n• Məhv edilməklə,\n• Dövlət xeyrinə imtina edilməklə,\n• Gömrük ərazisindən faktiki çıxarılmaqla.\nAyrı-ayrı gömrük əməliyyatı və ya gömrük proseduru ilə bağlı gömrük orqanının icazəsinin verilməsi\n207. Ayrı-ayrı gömrük əməliyyatları və ya gömrük prosedurları ilə bağlı icazə gömrük orqanları tərəfindən hansı şərtlər yerinə yetirildikdə verilir ?\n• İcazənin verilməsi üçün əsaslandırılmış müraciət olduqda\n• Gömrük nəzarətinin həyata keçirilməsi üçün zəruri şərait yaradıldıqda\n• Müəyyən edilmiş bütün tələblər yerinə yetirildikdə","2022"],["İcazə kimlərin müraciətinə əsasən verilir?","• Mallara dair səlahiyyətli olan şəxslərə\n• Bəyannaməçiyə","2022"],["İcazənin alınması üçün hara müraciət edilməlidir?","• Gömrük orqanına\nGömrük ödənişlərinin qaytarılması.\n210. Gömrük borcu üzrə ödənilmiş gömrük rüsumları hansı hallarda geri qaytarılır ?\n• Mallar qüsurlu olduqda\n• Gömrük ödənişləri üzrə səhvə yol verildikdə\n• Antidempinq, kompensasiya və mühafizə tədbirləri haqqında‖ Azərbaycan Rerspublikasının Qanununda mü.əyyən edilmiş hallarda","2022"],["Bəyanetmə nədir?","• Azərbaycan Respublikasının gömrük sərhəddindən keçirilən, gömrük nəzarəti altında yerləşdirilən mallar və nəqliyyat vasitələri barəsində məlumatların gömrük orqanına şifahi, kağız üzərində yazılı və elektron formada bəyan edilməsidir.","2022"],["Gömrük Bəyannaməsi nədir?","• Malların müvafiq gömrük proseduru altında yerləşdirilməsi üçün tələb olunan məlumatları əks etdirən, şəxs tərəfindən MİHO-nun müəyyən etdiyi formada gömrük orqanına təqdim olunan sənəddir.","2022"],["Bəyannaməçi kimdir?","• Gömrük bəyannamsəini təqdim edən və ya adından gömrük bəyannaməsi təqdim edilən şəxsdir.","2022"],["Bəyannamənin formaları hansılardır?","• Gömrük bəyannaməsi\n• Natamam bəyannamə\n• Əlavə bəyannamə\n• Sadələşdirilmiş bəyannamə\n• Qısa idxal bəyannaməsi\n• Qısa ixrac bəyannaməsi\n• Dövri bəyannamə","2022"],["Gömrük Bəyannaməsi ilə birlikdə hansı məlumatlara dair sənədlər gömrük orqanına təqdim olunmalıdır?","• Nəqliyyat sənədləri\n• Baytarlıq və fitosanitar sertifikat, qida təhlükəsizliyi sertifikatı\n• Gömrük dəyərini təsdiq edən sənəd\n• Gömrük borcuna görə təminat verilməsini təsdiq edən sənəd\n• İxrac nəzarətinə düşən mallara görə icazə sənədi\n• Mənşə ölkəsini təsdiq edən sənəd","2022"],["Gömrük Bəyannaməsi ilə yanaşı ayrı-ayrı sənədlərin verilməsi üzürlü səbəblərə görə eyni vaxtda baş tutmursa, bu sənədlərin təqdim edilməsi üçün müəyyən edilmiş müddət nə qədərdir?","• 45 gündən gec olmamalıdır.","2022"],["Fiziki şəxslər tərəfindən \"Yaşıl Kanal\" buraxılış dəhlizində keçirilən mallar hansı formada bəyan edilir?","• Şifahi formada","2022"],["Fiziki şəxslər tərəfindən \"Qırmızı Kanal\" buraxılış dəhlizindən keçən mallar hansı formada bəyan edilir?","• Yazılı formada","2022"],["Gömrük ərazisinə gətirilən mallara görə gömrük bəyannaməsi mallar gömrük orqanına təqdim edildiyi vaxtdan hansı müddətə təqdim edilməlidir?","• 15 gündən gec olmayaraq","2022"],["Gömrük bəyannaməsinin təqdim edilməsi müddəti uzadılarsa, bu müddət nə qədər olur (Gün deyil, prosedur çərçivəsində)?","• Malların müvəqqəti saxlanc xgp altında qalma müddəti çərçivəsində","2022"],["Gömrük ərazisindən aparılan mallara görə gömrük bəyannaməsi nə qədər müddətə təqdim edilməlidir?","• Mallar gömrük ərazisindən çıxarılarkən təqdim edilməlidir.","2022"],["Dövri Bəyannamə nədir?","• Gömrük orqanları eyni malları və nəqliyyat vasitələrini müntəzəm olaraq keçirən şəxslərə onları 30 gün müddətinə bir dövri bəyannamə əsasında keçirilməsinə icazə veririlər.","2022"],["Dövri Bəyannamədən istifadə şərtləri hansılardır?","• Eyni koda malik malların eyni şəxs tərəfindən eyni gömrük orqanında rəsmiləşdirilməkdən keçməklə gömrük ərazisinə gətirilməsi və aparılması\n• 3 və ya daha çox mal partiyasının 30 gün müddətində keçirilməsini nəzərdə tutur.\n• 15 gündən gec olmayaraq gömrük borcu ödənilməlidir.","2022"],["Hansı hallarda gömrük orqanına sadələşdirilmiş bəyannamə təqdim olunur?","• SİO tərəfindən keçirilən mallara görə\n• Yardım yüklərinə görə\n• Fiziki şəxslər tərəfindən istehsal və ya kommersiya məqsədilə gətirilməyən mallara görə","2022"],["Hansı mallara görə sadələşdirilmiş bəyannamə təqdim edildikdən sonra onlara görə əlavə bəyannamədə təqdim edilməlidir və hansı müddətə?","• SİO tərəfindən gətirilən mallara görə\n• Yardım yüklərinə görə\n• 30 gün müddətinə","2022"],["Natamam bəyannamənin verilməsinə icazə üçün hansı şərtlər olmalıdır?","• Gömrük nəzarətinin həyata keçirilməsi üçün zəruri imkanlar yaradıldıqda;\n• Gömrük borcunun ödənilməsinə Gömrük Məcəlləsi ilə müəyyən edilmiş qaydada təminat verildikdə.","2022"],["Natamam bəyannamə hansı hallarda təqdim edilir?","• Gömrük orqanlarına faktiki təqdim edilməli olan mal partiyası gömrük bəyannaməsi verildiyi vaxt olmadıqda;\n• Gömrük bəyannaməsi verildiyi vaxt malın miqdarını, keyfiyyətini və dəyərini müəyyənləşdirmək mümkün olmadıqda.","2022"],["Natamam bəyannamə təqdim edildikdən sonra hansı müddətə gömrük bəyannaməsi təqdim edilməlidir?","• 30 gün müddətinə\nDövlət Gömrük Komitəsi haqqında\n59. DGK nə vaxt yarandı və ilk sədri kim olub ?\n• 1992-ci il 30 yanvar və Maqsud Məmmədov\n60. Komitənin fəaliyyət istiqaməti nələrdir?\n• Vahid Dövlət Siyasətinin formalaşdırılması və həyata keçirilməsində iştirak etmək\n• Hüquq mühafizə fəaliyyətini həyata keçirmək\n• Normayaratma fəaliyyətini həyata keçirmək\n• Gömrük işini təşkil etmək və təkmilləşdirmək\n• Qabaqcıl gömrük tənzimlənməsi vasitələrinin tətbiqini təşkil edir.\n61. Komitənin sədr və müavinlərini kim təyin edir ?\n• Komitənin sədr və müavinlərini prezident təyin edir.\n62. Komitə sədrinin neçə müavini olur?\n• Sədrin 2 birinci müavini və 4 müavini olur.\n63. Kollegiya üzvlərinin tərkibinə kimlər daxildir və kimlər daxil edilər bilər?\n• Kollegiya üzvlərinə sədr, onun müavinləri və digər gömrük orqanlarının rəhbər şəxləri daxildir, həmçinin mütəxəssis və ekspertlər daxil edilə bilər.","2022"],["Boru kəmər vasitəsilə keçirilən mallarala əlaqədar gömrük bəyannaməsi təqdim edilə bilmədiyi halda bəyannamənin hansı növü tələb edilir?","• Natamam bəyannamə","2022"],["Natamam bəyannamə təqdim edildiyi gün hansı tədbirlər tətbiq olunur?","• Ticarət siyasəti tədbirləri\n286. Boru kəməri vasitəsilə keçirilən mallara nə tətbiq olunmur?\n• Eyniləşdirilmə vasitələri tətbiq olunmur.\nBəyannamənin doldurulması qaydası.\n287. Gömrük bəyannaməsi neçə hissədən ibarət olur və hansılardır?\n• 2 hissədən ibarət olur əsas və əlavə vərəqlərdən","2022"],["Gömrük bəyannaməsində əlavə vərəqlərdən nə zaman istifadə edilir?","• Bir neçə adda və ya eyni adda müxtəlif mənşəlli malların bəyan olunması zamanı əlavə vərəqdən istifadə edilir.","2022"],["Bir gömrük bəyannaməsində maksimum neçə əlavə vərəq ola bilər?","• 33 əlavə vərəq","2022"],["Gömrük orqanının vəzifəli şəxsləri tərəfindən hansı qrafalar doldurulur?","• D və C qrafaları gömrük orqanının vəzifəli şəxsləri tərəfindən doldurulur.","2022"],["Gömrük bəyannaməsinin hansı qrafası sistem tərəfindən verilir və necə adlanır?","• Sorğu nömrəsi sistem verən rəqəmlə doldurulur və 7-ci qrafadır.","2022"],["Gömrük bəyannaməsi neçə qrafadan ibarət olur?","• 54 rəqəmlə ifadə olunan qrafa və 4 hərflə ifadə olunan qrafa A,B,C,D","2022"],["SİO qrafasında məlumat necə qeyd olunur?","• SİO varsa 1\n• SİO yoxdursa 0\n• 13-cü qrafadır.","2022"],["Konteyner qrafasında məlumat necə qeyd olunur?","• Konteyner varsa 1\n• Konteyner yoxdursa 0\n• 19-cu qrafadır.","2022"],["Gömrük bəyannaməsinin A qrafasında nə qeyd olunur?","• Göndərən gömrük orqanı","2022"],["Gömrük bəyannaməsinin B qrafasında nə qeyd olunur?","• Hesablaşma detalları","2022"],["Gömrük bəyannaməsinin C qrafasında nə qeyd olunur?","• GB-nin bu qrafası gömrük orqanı tərəfindən texnoloji qeydlər üçün istifadə oluna bilər.","2022"],["Gömrük bəyannaməsinin D qrafasında nə qeyd olunur?","• Qrafaya gömrük orqanının ştamp və möhürü vurulur. Lazım olan hallarda isə gömrük nəzarəti nəticələrini əks etdirən başqa qeydlər olunur.\nGömrük müşahidəsi və keşik şəkmə ( patrulluq) haqqında.\n299. Keşik çəkmə və patrulluq nədir ?\n• Gömrük orqanlarının vəzifəli şəxslərinin piyada və nəqliyyat vasitəsilə, gömrük orqanları tərəfindən fəaliyyət ərazisində müəyyən edilmiş marşurutla hərəkət etmklə, gömrük nəzarətinin həyata keçirilməsidir.","2022"],["Gömrük orqanları gömrük nəzarətini həyata keçirmək üçün nələrdən istifadə edir?","• Qanuvericiliklə müəyyən edilmiş forma, üsul və vasitələrdən.\n444. Gömrük formaları hansılardır?\n• Malların və nəqliyyat vasitələrinin yoxlanması\n• Şəxslərin sorğu-sual edilməsi\n• Şəxsi yoxlama\n• Gömrük auditi\n• Sənədlərin və məlumatların yoxlanılması\n• Gömrük baxışı\n• Keşik çəkmə və gömrük müşahidəsi","2022"],["Gömrük nəzarətinin hansı forması gömrük idarəsinin və struktur bölmənin rəhbərinin qərarı əsasında həyata keçirilir?","• Şəxsi yoxlama","2022"],["Gömrük nəzarəti üsulları hansı məqsədlə həyata keçirilir?","• Gömrük nəzarəti formalarının səmərəliliyini artırmaq üçün","2022"],["Gömrük nəzarəti üsulları hansılardır?","• Yardım üçün mütəxəssis və ekspertlərin çağırılması\n• Gömrük nəzarəti zonalarının yaradılması\n• Gömrük təminatı vasitələrindən istifadə etmək","2022"],["Gömrük nəzarəti vasitələri hansılardır?","• Texniki nəzarət vasitələri\n• Gömrük itləri\n• İnformasiya resursları\n• Dəniz və hava gəmiləri","2022"],["Gömrük nəzarətini həyata keçirmək üçün hansı sənədlər təqdim edilməlidir?","• Nəqliyyat sənədləri\n• Bəyannamə","2022"],["Neçə gömrük nəzarəti mərhələsi var və hansılardır?","• 3 gömrük nəzarəti mərhələsi vardır\n• Məlumatlandırma və qeydiyyat mərhələsi\n• Sənədli nəzarət mərhələsi\n• Çatdırılma mərhələsi\nNəzarətli Göndəriş Metodu.\n451. Nəzarətli göndəriş nədir ?\n• Qanunsuz dövriyyəyə daxil edilmiş ayrı-ayrı malların xarici dövlətlərin gömrük və digər səlahiyyətli orqanları ilə razılaşmalara və ya beynəlxalq müqavilələrə uyğun olaraq, əməliyyat axtarış fəaliyyəti subyektlərinin nəzarəti altında gömrük ərazisinə gətirilməsi, bu ərazidən aparılması və ya tranziti üzrə əməliyyat axtarış tədbiridir.\n452. Nəzarətli göndərişin həyata keçirilməsi məqsədi nədir ?\n• Malların qanunsuz beynəlxalq dövriyyəsi ilə bağlı törədilən və ya hazrılanan cinayətlərin qarşısının alınması, açılması və dövriyyədə iştirak edən şəxslərin aşkar edilməsidir.","2022"],["Nəzarət göndərişin metodunda da hansı hallarda mallar götürülür?","• Nəzarətli göndəriş metodundan istifadə edilməsi üçün zərurət aradan qalxdıqda\n• Mallar insanların həyat və sağlamlığı, ətraf mühitə təhlükə yaratdıqda\n• Malların nəzarət altında təyinat yerinə çatdırılması üçün kifayət qədər vəsait, qüvvə və təminat olmadıqda\nGömrük orqanları tərəfindən istifadə olunan texniki vasitələrin siyahısı\n454. Texniki nəzarət vasitələrinin tipləri hansılardır?\n• Portativ\n• Stasionar\n• Daşınan\n• Səyyar","2022"],["Texniki nəzarət vasitələrinin növləri hansılardır?","• Baxış rentgen texnikası\n• Yoxlama baxış sistemi\n• Axtarış- texniki vasitələri\n• Vizual texniki nəzarət vasitələri\n• Operativ rabitə üzə texniki nəzarət vasitələri\n• Qlobal mövqe təyin etmə sistemi\n• Gömrük təminatı atributlarının vurulması vasitələri","2022"],["Axtarış texniki vasitələri hansılardır?","• Buster, metal dedektorlar, nəzarət şupları, baxış güzgüləri, endeskoplar, termovizorlar, georadarlar və.s\nTəhlükəsiz ixrac sxemi\n456. Təhlükəsiz ixrac sisteminin məqsədi nədir?\n• Malların təhlükəsiz qaydada qablaşdırılması\n• Başqa mallardan ayrılıqda daşınması\n• Təyinay yerində boşaldılmasını təyin etməkdir","2022"],["Təhlükəsiz ixrac sxemi çərçivəsində malların qablaşdırılması və onlara kənar müdaxilənin qarşısının alınması üçün nələrdən istifadə edilir?","• Təhlükəsiz bağlamalardan\n• Gömrük təminatı vasitələrindən\n458. Təhlükəsiz ixrac sxemi çərçivəsində ixrac edilən malların yüklənməsinə dair tələblər nələrdir?\n• Kənar müdaxilənin mümkünsüzlüyünü təmin etmək\n• Nizamlı şəkildə yerləşdirmək\n• Qruplaşdıraraq yerləşdirmək\n• Yük bölmələrinin toxunulmazlığının təmin edilməsi","2022"],["Təhlükəsiz ixrac sxemi hansı hallarda təsdiq edilir?","• Mallara kənar müdaxilə ehtimalı olduqda\n• Malların xüsusiyyətlərinə görə onların təhlükəsiz qaydada qablaşdırılaraq ixrac edilməsi zəruri olduqda\nInzibati Xətalar Məcəlləsi\n460. İnzibati xətalar qanunvericiliyinin vəzifələri hansılardır?\n• İnsan və vətəndaş hüquq və azadlılarının, sağlamlığının, ictimai mənəviyyatı, ətraf mühiti, mülkiyyəti, ictimai qaydaları qorumaq\n• Qanunçuluğu möhkəmləndirmək\n• İnzibati xətanın qarşısını almaq","2022"],["Gömrük müşahidəsi nədir?","• Gömrük orqanlarının vəzifəli şəxsləri tərəfindən gömrük nəzarəti altında olan malların və nəqliyyat vasitələrinin daşınma, yükləmə-boşaltma işləri və yük əməliyyatlarının aparılması üzərində həyata keçirilən vizual müşahidədir.","2022"],["Gömrük orqanının vəzifəli şəxsləri hansı yerlərdə keçim çəkmə və gömrük müşahidəsi aparmaq hüququna malikdir?","• Xəzər dənizinin Azərbaycan Respublikasına mənsub olan bölməsi\n• Dəmiryol vağzallarında və stansiyalarında\n• Aeroportlarda və aerodromlarda\n• Gömrük nəzarəti zonalarında\n• Beynəlxalq müqavilələrdə nəzərdə tutulduqda gömrük ərazisindən kənar ərazidə\nBeynəlxalq Yük Daşıması və Beynəlxalq Yük Daşıması kitabçası haqqında.\n302. BYD nədir ?\n• 1975-ci il BYD Konvensiyasının şərtlərinə riayət olunmaqla, göndərən gömrük orqanından təyinat gömrük orqanına qədər yüklərin daşınmasıdır.","2022"],["Gömrük nəzarəti zonası nədir?","• Mal və nəqliyyat vasitələrinin, o cümlədən şəxslər üzərində gömrük nəzarətinin həyata keçirilməsi məqsədi ilə Azərbaycan Respublikasının gömrük ərazisinin gömrük orqanları tərəfindən xüsusi ayrılmış və nişanlanmış hissəsidir.","2022"],["Gömrük nəzarəti zonasının yaradılması haqqında qərarı kim verir?","• Dövlət Gömrük Komitəsinin sədri","2022"],["Gömrük nəzarəti zonaları hansı hallarda ləğv edilir?","• Gömrük sərhəd buraxılışı məntəqəsi ləğv edildikdə\n• Gömrük orqanlarının yerləşdiyi yer dəyişildikdə\n• Gömrük orqanlarının nəzarəti altında olan malların saxlandığı yer dəyişildikdə\n• Gömrük sahələrində gömrük nəzarətini həyata keçirilməsi tədbirləri başa çatdıqda\nİdxal-ixrac əməliyyatları.\n369. Hansı malların idxal-ixrac əməliyyatları Nazirlər Kabinetinin sərəncamı əsasında həyata keçirilir və hansı malların kreditə, konsiqnasiya yolu ilə, sərhədyanı ticarət çərçivəsində ixracına yol verilmir?\n• Silah və hərbi texnika\n• Nüvə materialları\n• Narkotik və psixotrop maddələr\n• Emal edilməmiş almazın ixracı\n• Qan və qan komponenti\n• Barıt,partlayıcı maddələr, pirotexniki məmulatlar.","2022"],["Hansı malların kabotaj daşınması zamanı təminat verilməlidir?","• İdxalı qadağan olunmuş və ya məhdudlaşdırılmış sərbəst döviyyəyə buraxılışı altında yerləşdirilmiş mallar","2022"],["Kabotaj daşınma zamanı hansı sənədlər gömrük orqanlarına təqdim edilməlidir?","• Gəmi haqqında məlumatlar\n• Malların siyahısı\n• Malların boşaldılması həyata keçirilən liman və ya limanların adlarını özündə əks etdirən vahid sənədi\nMallara Gömrük Təminatının vurulması\n412. Gömrük təminatı nədir ?\n• Gömrük nəzarəti və rəsmiləşdirilməsi nəticələrini əks etdirmək üçün gömrük sərhəddindən keçirilən mallara və nəqliyyat vasitələrinə gömrük orqanları tərəfindən vurulan plomblar, möhürlər və digər eyniləşdirmə vasitələridir.","2022"],["Gömrük təminatı kim tərəfindən vurulur?","• Gömrük nəzarətini həyata keçirən gömrü orqanının vəzifəli şəxsi tərəfinən","2022"],["Mallarınn yerləşdirildiyi bağlamalara vurulmuş gömrük təminatı hansı hallarda dəyişdirilir?","• Malların fiziki yoxlaması zamanı\n• Gömrük orqanlarının icazəsi ilə prob və nümunələr götürüldüyü zaman\n• Mallar əlavə edildiyi və ya bağlamalardan malların bir hissəsi çıxarıldığı zaman.","2022"],["Bağlamalara vurulmuş gömrük təminatı hansı hallarda çıxarılır?","• fors-major hallarında malların və nəqliyyat vasitələrinin mühafizəsini təmin etmək məqsədi ilə;\n• malların gömrük yoxlaması həyata keçirildikdə;\n• gömrük rəsmiləşdirilməsi başa çatdıqda;\n• gömrük məqsədləri üçün gömrük orqanının vəzifəli şəxsinin çıxardığı qərara əsasən.","2022"],["Gömrük borcunun yarandığı yer nədir?","• Gömrük borcu gömrük bəyannaməsinin gömrük orqanlarına təqdim edildiyi yerdə yaranır və bütün başqa hallarda gömrük borcunun yaranmasına səbəb olan halların baş verdiyi yer hesab edilir.","2022"],["Gömrük borcunun yarandığı yeri ən geci hansı müddətə müəyyən etmək lazımdır?","• Gömrük borcunun yarandığı yeri 2 aydan gec olamayaraq müəyyən etmək lazımdır.","2022"],["Müəyyən edilən müddət ərzində gömrük borcunu müəyyənləşdirmək mümkün olmadıqda hansı tədbirlər görülür?","• Gömrük proseduru altında yerləşdirildiyi yer hesab edilir\n• Gömrük ərazisinə daxil olduğu yer hesab edilir","2022"],["Malların idxalı üzrə gömrük borcu hansı hallarda yaranır?","• Sərbəst dövriyəyə buraxılış gömrük proseduru altında\n• Müvəqqəti idxal xüsusi gömrük proseduru altında yerləşdirildikdə","2022"],["Malların ixracı üzrə gömrük borcu hansı hallarda yaranır?","• İxrac gömrük proseduru altında yerləşdirildikdə\n• Xaricdə emal xüsusi gömrük proseduru altında yerləşdirildikdə","2022"],["Gömrük borcu nə zaman yaranır?","• Gömrük bəyannaməsinin təsdiq edildiyi zaman yaranır.","2022"],["Gömrük orqanları nə zaman gömrük borcunun ödənilməsinə 14 gündən 60 günədək möhlət verir?","• Fors-major hallar nəticəsində mal sahibinə ziyan dəydikdə\n• Müəyyən edilən gömrük borcunu birdəfəlik ödəyəcəyi təqdirdə, borclu şəxsin iflasına səbəb olarsa","2022"],["Gömrük borcunun ödənilməsinə görə verilən müddət növbəti maliyyə ilinə keçdikdə məlumat verilmə ardıcıllığı hansı qaydada aparılır?","• Gömrük orqanı Dövlət Gömrük Komitəsinə\n• Dövlət Gömrük Komitəsi isə Maliyyə Nazirliyinə bu haqda məlumat verir.","2022"],["Əhatəli təminat kimlərə verilir?","• Gömrük orqanı gömrük və vergi qanunvericiliyinə əməl edən, gömrük prosedurlarından mütəmadi istifadə edən və bu prosedurlarla əlaqədar öhdəlikləri vaxtında və tam yerinə yetirmək imkanı olan rezidentlər","2022"],["Hansı hallarda əhatəli təminatın təqdim edilməsinə icazə verilir?","• İki və daha çox bəyannamə, gömrük əməliyyatı və ya gömrük proseduru ilə bağlı gömrük borcu yarandıqda, yaxud yarana biləcəyi təqdirdə;\n• Gömrük borcunun məbləği müəyyən müddətdə dəyişə biləcəyi təqdirdə.","2022"],["Məcburi təminat hansı hallarda verilir?","• Gömrük borcunun ödənilməsinə görə möhlət verilməsi\n• Qüsurlu malların ixrac edilməzdən əvvəl əvəzləyici malların idxal edilməsi\n• Mallar pirat və ya kontrafakt olmadıqda, malların buraxılışın dayandırılmasına görə mal sahibinə dəyən ziyanın, gömrük xərclərinin ödənilməsi hallarında\n• Mallar xaricdə emal və xüsusi istifadə xg proseduru altında yerləşdirilməsi\n• Müvəqqəti saxlanc və gömrük anbarlarının təsis edilməsi üçün icazənin verilməsi\n• Gömrük rəsmiləşdirilməsi başa çatmamış mallardan istifadə və sərəncam verilməsi hallarında\n• Fiziki şəxslər xarici ölkədə qeydiyyatda olan nəqliyyat vasitəsini müvəqqəti gömrük ərazisinə gətirdikdə","2022"],["Fakultativ təminat hansı hallarda verilir?","• Məcburi təminatın verilməsi formalarında nəzərdə tutulmayan hallarda\n• Malların müvəqqəti saxlanc xgp altında yerləşdirildiyi hallarda\n• Malların daxil emal xgp altında yerləşdirildiyi hallarda","2022"],["Mallar pirat və ya kontrafakt olmadığı təqdirdə yarana biləcək gömrük borcunun məbləğinə görə gömrük orqanlarına ərizəçi hansı məbləğ arasında təminat təqdim etməlidir?","• 5000 manatdan 5 milyon manatadək","2022"],["Təminatın hansı növləri var?","• Veksel zaminliyi\n• Üçüncü şəxsin zaminliyi\n• Bank qarantiyası\n• Avans ödəmələr\n• Siğorta müqaviləsi\n• Depozit hesaba ödəmələr\n• Girov qoyulması","2022"],["hansı mallar girov qoyularkən onların sertifikatı tələb olunur?","• Fitosanitar, baytarlıq, gigiyenik və uyğunluq, digər sertifikatlara , qida təhlükəsizliyi ilə bağlı sertifakata malik qida məhsullar girov qoyularkən","2022"],["Veksel zaminliyi və bank qarantiyası nədir?","• Gömrük borcuna təminat kimi veksel zaminliyi yalnız bank fəaliyyətinin həyata keçirilməsi üçün lisenziyaya malik olan bank və ya bank olmayan kredit təşkilatı avalçı qismində çıxış etdikdə qəbul edilir.\n• Lisenziyaya malik olan və Dövlət Gömrük Komitəsinin reysterinə daxil edilmiş bank və ya bank olmayan kredit təşkilatı tərəfindən verilən bank qarantiyası qəbul edilir.","2022"],["Siğorta müqaviləsi və üçüncü şəxsin zaminliyi nədir?","• Gömrük borcunun ödənilməsi siğorta müqavilələri hesabına həyata keçirilir və yalnız siğorta fəaliyyətinin həyata keçirilməsi üçün lisenziyaya malik olan siğorta təşkilatları tərəfindən verildiyi halda qəbul edilir.\n• Zamin şəxs gömrük ərazisi daxilində müəyyənləşdirilən üçüncü şəxs zamin ola bilər və gömrük orqanı ilə zamin şəxs arasında bağlanılmış müqavilə əsasında rəsmiləşdirilir.","2022"],["Avans ödəmələr nədir?","• Gələcəkdə yarana biləcək gömrük borcunun ödənilməsinin təminatı kimi ödəyici gömrük orqanlarının hesabına avans şəkildə pul vəsaiti köçürə bilərlər.","2022"],["Hansı təminat vasitələri mülki məcəllə ilə tənzimlənir?","• Girov qoyulması\n• Siğorta müqaviləsi\n• Üçüncü şəxsin zaminliyi","2022"],["Hansı təminatda gömrük orqanlarının hesabına köçürülən pul vəsaitinə görə faiz ödənilmir?","• Depozit hesaba ödənilən pul vəsaitlərinin gömrük orqanlarının hesablarında qaldığı müddətə görə faiz ödənilmir.\nGömrük Tarifi Haqqında qanun","2022"],["Gömrük rəsmiləşdirilməsinə görə alınan gömrük yığımlarının məbləği nə qədərdir?","• gömrük dəyəri 1 000 manatadək olduqda 15 manat;\n• gömrük dəyəri 1 000 manatdan yuxarı və 10 000 manatadək olduqda 60 manat;\n• gömrük dəyəri 10 000 manatdan yuxarı və 50 000 manatadək olduqda 120 manat;\n• gömrük dəyəri 50 000 manatdan yuxarı və 100 000 manatadək olduqda 200 manat;\n• gömrük dəyəri 100 000 manatdan yuxarı və 500 000 manatadək olduqda 300 manat;\n• gömrük dəyəri 500 000 manatdan yuxarı və 1 000 000 manatadək olduqda 600 manat;\n• gömrük dəyəri 1 000 000 manatdan yuxarı olduqda 1000 manat.","2022"],["Ölkə ərazisinə gətirilən nəqliyyat vasitələrinin müvəqqəti qeydiyyata alınması üçün nə qədər yığım alınır?","• Yük və minik avtomobilləri, mikroavtobus və avtobuslar üçün - 30 manat;\n• Digər avtonəqliyyat vasitələri üçün - 25 manat.\n73. Hansı hallarda fiziki şəxslərdən istehsal və kommersiya məqsədilə gətirilən mallara görə gömrük yığımı alınmır ?\n• ―Fiziki şəxslər tərəfindən istehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan malların gömrük sərhədindən keçirilməsinin güzəştli və sadələşdirilmiş Qaydaları‖ ilə gömrük ödənişlərindən azadolma tətbiq edildiyi hallarda;\n74. Hansı malların gömrük rəsmiləşdirilməsinə görə gömrük yığımı alınmır?\n• Elektrik enerjisinin qarşılıqlı ötürülməsi hallarında;\n• Humanitar və texniki yardım məqsədilə gətirilən mallar;\n• Qrant müqavilə əsasında malların ixrac və idxalı zamanı;\n• Gömrük ödənişlərindən azadolma tətbiq edildiyi hallarda;\n75. Fiziki gömrük müşayiəti altında malların daşınmasına görə gömrük yığımlarının miqdarı nə qədərdir və nə zaman alınır?\n• 100 manat və gömrük yığımları müşayiətə başlanılmazdan əvvəl ödənilir.","2022"],["GPS xidməti əsasında gömrük müşayiəti altında malların daşınmasına görə nə qədər gömrük yığımı və nə zaman alınır?","• 10 manat və gömrük yığımları müşayiət başa çatdıqdan sonra ödənilir.\n77. Xüsusi saxlanc şəraiti tələb edən malların hər 100 kq görə nə qədər gömrük yığımı alınır?\n• Hər 24 saat üçün 0,5 manat","2022"],["Xüsusi saxlanc şəraiti tələb etməyən malların hər 100 kq görə nə qədər gömrük yığımı alınır?","• Hər 24 saat üçün 0,2 manat\n79. İxtisas attestatına görə alınan gömrük yığımlarının təsnifləndir.\n• İxtisas attestatının verilməsinə görə - 100 manat;\n• İxtisas attestatlarının fəaliyyətinin bərpa edilməsinə görə - 150 manat;\n• İxtisas attestatının dublikatının verilməsinə görə - 30 manat.","2022"],["Gömrük yığımları və haqqın məbləğinin hesablanmasında gömrük orqanı səhvə yol verildikdə, artıq tutulmuş məbləğ hansı orqanın hesabına qaytarılır?","• Azərbaycan Respublikası Dövlət Gömrük Komitəsinin hesablarına köçürülən vəsait hesabına qaytarılır.","2022"],["Qüsurlu mallara görə ödənilmiş gömrük rüsumları hansı hallarda geri qaytarılır?","• Qüsurlu mallardan istifadə edilmədikdə\n• Gömrük ərazisindən aparıldıqdan sonra","2022"],["Gömrük ödənişlərinin qaytarılması üçün ödəyici hansı müddət ərzində hara müraciət etməlidir?","• 1 il müddətində, gömrük ödənişlərinin ödənildiyi gömrük orqanına ərizə ilə müraciət edilməlidir. Fors-major hallarda geciukdirildiyi sübuta yetirildikdə bu müddət 1 il daha uzadıla bilər.","2022"],["Gömrük rüsumlarının qaytarılması üçün gömrük orqanı hara müraciət edir?","• Maliyyə Nazirliyinin təsdiq etdiyi rəylə maliyyə orqanına müraciət edilir.\n215. Gömrük ödənişlərinin qaytarılması hansı orqan tərəfindən həyata keçirilir?\n• Maliyyə orqanı tərəfindən","2022"],["Gömrük ödənişləri qaytarılarkən dövlət büdcəsinin mədaxili hansı formada azalır?","• Faktiki qaytarılmış məbləğ qədər azaldılır","2022"],["Gömrük ödənişlərinin qaytarılması barədə qərar verildikdən sonra hansı müddətə qaytarılmadıqda və hansı qaydada faiz hesablanır?","• 3 ay müddətində qaytarılmadıqda, Mərkəzi Bankın müəyyən etdiyi faiz uçot dərəcəsinə uyğun olaraq Malların preferensial və qeyri-preferensial mənşəyi haqqında\n218. Franko-zavod şərti nədir ?\n• İstehsalçı tərəfindən mal partiyasının malın istehsal olunduğu yerdən və ya anbardan alıcının sərəncamına verilməsi.","2022"],["Gömrük tarifi və gömrük rüsumu nədir?","• Gömrük tarifi gömrük sərhəddindən keçirilən mallara tətbiq edilən və xarici iqtisadi fəaliyyətin mal nomenklaturasına uyğun olaraq sistemləşdirilmiş gömrük rüsumlarının məcmusudur.\n• Gömrük rüsumları malların gömrük ərazisinə gətirilməsi və ya bu ərazidən aparılması zamanı tətbiq edilən gömrük ödənişlərinin bir növüdür.","2022"],["Gömrük tarifinin tətbiq edilməsinin əsas məqsədləri nədir?","• İdxalın əmtəə strukturunu tənzimləmək\n• Azərbaycan Respublikası iqtisadiyyatını xarici rəqabətin mənfi təsirlərindən qorumaq\n• Azərbaycan Respublikası iqtisadiyyatıının dünya iqtisadiyyatına inteqrasiyası təmin etmək\n• Azərbaycan Respublikasının istehsal və istehlak mallarının əmtəə strukturunda mütərəqqi dəyişikliklər üçün şərait yaratmaq\n• Malların Azərbaycan Respublikası ərazisinə gətirilməsi və aparılmasına, habelə valyuta gətirilməsinin və xərclərin nisbətini təmin etmək.","2022"],["Gömrük rüsumları üzrə gömrük borcunun məbləği hesablanarkən nə əsas götürülür?","• Xarici İqtisadi Fəaliyyətin Mal Nomenklaturası üzrə ölçü vahidi\n• Malın gömrük dəyəri","2022"],["Gömrük rüsumu dərəcələrinin hansı növləri tətbiq edilir və onlar nədir?","• Advalor gömrük rüsumu--- malın gömrük dəyərinə nisbətən faizlə hesablanması\n• Spesifik gömrük rüsumu--- mal vahidinə görə müəyyən olunmuş məbləğdə hesablanır\n• Kombinə gömrük rüsumu dərəcəsi--- hər iki üsul əsasında hesablanmış gömrük rüsumu","2022"],["Mövsumi rüsumların tətbiq edilməsi məqsədi nədir və hansı müddətə tətbiq edilir?","• Malların idxal və ixracını operativ tənzimləmək məqsədilə\n• Bir il müddətində 6 aydan çox tətbiq edilə bilməz.","2022"],["Xüsusi, antidempinq və kompensasiya rüsumlarının tətbiqinin məqsədi nədir?","• Azərbaycan Respublikası iqtisadi maraqlarının qorunması məqsədilə","2022"],["Xüsusi, antidempinq və kompensasiya rüsumları ayrı-ayrılıqda nə zaman tətbiq edilir?","• Xüsusi rüsumlar---- ölkə ərazisinə idxal olunmuş məhsulun həcminin artması yerli sahibkarlığa ciddi ziyan vurduqda\n• Antidempinq rüsumları--- ölkə ərazisinə idxal edilən məhsulların dəyərinin normadan aşağı olması yerli sahibkarlığa ciddi ziyan vurduqda\n• Kompensasiya rüsumları --- İstehsalı, ixracı və daşınması xarici dövlətin spesifik subsidiyalarından istifadə olunduğu zaman","2022"],["Malın gömrük dəyəri nədir?","• Malın ― Gömrük Tarifi Haqqında‖ qanuna əsasən müəyyən edilmiş dəyəri malın gömrük dəyəridir.","2022"],["Malın gömrük dəyərinin müəyyən edilməsi nəyə əsaslanır?","• 1994-cü il Tarif və Ticarət üzrə Baş Sazişin VII maddəsinə əsasən müəyyən edilir.","2022"],["Malın gömrük dəyəri nə zaman və kim tərəfindən bəyan edilir?","• Malın gömrük dəyəri gömrük sərhəddindən keçərkən, bəyannaməçi tərəfindən gömrük orqanlarına bəyan edilir.","2022"],["Gömrük dəyəri hansı üsullarla müəyyən edilir?","• Sövdələşmə qiymət üsulu\n• Eyni malların sövdələşmə qiymət üsulu\n• Eynicinsli malların sövdələşmə qiymət üsulu\n• Çıxılmış dəyər üsulu\n• Toplanmış dəyər üsulu\n• Ehtiyyat üsul","2022"],["Sövdələşmə qiyməti üsulu, eyni malların sövdələşmə qiyməti üsulu və eynicinsli malların sövdələşmə qiyməti üsulu nədir və nə zaman tətbiq edilir?","• Sövdələşmə qiymət üsulu malın gömrük dəyərinin müəyyənləşdirilməsində ən əsas üsuldur. Malın üçün faktiki ödənilmiş və ödənilməli olan qiymət əsasında müəyyən edilir.\n• Eyni malların sövdələşmə qiymət üsulundan sövdələşmə qiymət üsuluna görə malın gömrük dəyərini müəyyənləşdirmək mümkün olmadıqda istifadə olunur. Mallarla eyni və ya təqribən eyni vaxtda, eyni kommersiya səviyyəsində, eyni və ya təqribən eyni miqdarda ixrac məqsədilə satılan eyni malların sövdələşmə qiymətinə əsasən müəyyən olunur.\n• Eynicinsli malların sövdələşmə qiymət üsulundan eyni malların sövdələşmə qiymət üsulundan istifadə edilərək malın gömrk dəyərini müəyyənləşdirmək mümkün olmadıqda istifadə olunur. Mallarla eyni vəya təqribən eyni vaxtda ixrac məqsədilən satılan eynicinsli malların sövdələşmə qiymətinə əsasən müəyyən edilir.","2022"],["Çıxılmış dəyər üsulu ilə malın gömrük dəyəri hesablanarkən hansı dəyərlər çıxılır?","• Malın gömrük ərazisində satışı ilə əlaqədar faktiki ödənilən və ödənilmiş komissyon haqlar\n• Malın gömrük ərazisində satışından mənfəət götürülməsi və ümumi xərcləri ödəmək üçün əlavələr\n• Malın gömrük ərazisində daşınması, boşaldılması və yüklənməsi ilə əlaqədar çəkilmiş xərclər\n• Gömrük ərazisidə ödənilməli olan gömrük rüsumları, vergilər və digər ödənişlərin məbləği","2022"],["Toplanmış dəyər üsulu ilə malın gömrük dəyəri hesablanarkən hansı dəyərlər toplanır?","• Hazırlanmasında istifadə edilən materiallara, istehsalına və emalına çəkilən xərclər\n• Malların gömrük ərazisinədək nəqliyyat xərcləri, yüklənilməsi və boşaldılması xərcləri\n• İxrac ölkəsində malların satışı zamanı adətən nəzərə alınan mənfəət və ümumixərclər","2022"],["Ehtiyat üsulu ilə malın gömrük dəyəri tapılan zaman hansı vasitələrdən istifadə edilir?","• Beynəlxalq təcrübədə qəbul edilmiş ümumi prinsiplərdən\n• Gömrük ərazisində mövcud olan məlumatlar əsasında\n• Bu qanunun gömrük dəyərinə uyğun vasitələrdən istifadə etməklə","2022"],["Ehtiyat üsulu ilə malın gömrük dəyəri tapılan zaman hansı vasitələrdən istifadə edilmir?","• Gömrük ərazisində istehsal edilən malların bu ərazidəki satış qiyməti\n• Minimum gömrük dəyəri\n• Kortəbii müəyyən edilən və saxta dəyərlər\n• İxrac ölkəsinin daxili bazarındakı qiymət\n• İki alternativ dəyərdən gömrük məqsədləri üçün ən yüksək olanın seçilməsi\n117. Tarif güzəştləri və preferensiyalar nədir?\n• Tarif güzşətləri və preferensiyalar gömrük sərhəddindən keçirilən mallar üzrə gömrük rüsumlarından azad etmə və gömrük rüsumu dərəcələrinin aşağı salınması, malın preferensial şərtlərlə gətirilməsi üçün tarif kvotaları şəklində verilən güzəştlərdir.","2022"],["Gömrük rüsumlarından azad etmə halları hansılardır?","• Gömrük ərazisindən çıxarılan və bu əraziyə gətirilən Azərbaycan Respublikasının milli valyutası, xarici valyuta və qiymətli kağızlar;\n• Dövlətin mülkiyyətinə keçirilməli olan mallar;\n• Yardım yükü kimi gətirilən, təbii fəlakət zonalarında zərərçəkmiş əhaliyə yardım göstərilməsi üçün göndərilən ərzaq məhsulları;\n• Gömrük ərazisinə qaytarılan milli mədəniyyət sərvətləri;\n• Mallar (aksizli mallar istisna olmaqla) gömrük ərazisi xaricindən xüsusi iqtisadi zonaya idxal edildikdə, habelə gömrük ərazisi xaricindən xüsusi iqtisadi zonaya idxal olunmuş mallar xüsusi iqtisadi zonadan gömrük ərazisi xaricinə ixrac edildikdə;\n• Gömrük ərazisində mallar xüsusi iqtisadi zonalar arasında idxal və ixrac edildikdə;\n“Yaşıl Dəhliz” və digər buraxılış sistemləri haqqında\n119. Yaşıl dəhliz buraxılış sistemi nə vaxt tətbiq edilib?\n• 2016-cı il may 21","2022"],["İdxal edilmiş məlumat daşıyıcı vasitələrin gömrük dəyəri necə müəyyən edilir?","• Məlumat daşıyıcı vasitənin öz qiyməti və dəyəri nəzərə alınır.","2022"],["Məlumat daşıyıcı vasitələrin gömrük dəyəri hansı üsulla müəyyən edilir?","• Sövdələşmə qiymət üsulu əsasında müəyyən olunur.\nBank və bank olmayan kredit təşkilatlarının DGK-nin reysterinə daxil edilməsi haqqında\n418. Kredit təşkilatlarının reysterə daxil edilməsi üçün hansı orqana müraciət edilir ?\n• Dövlət Gömrük Komitəsinə","2022"],["Malların qeyri-preferensial mənşəyinin müəyyən edilməsinin məqsədi nədir?","• Gömrük tarifi\n• Mallarla ticarətin xüsusi sahələrini tənzimləyən tədbirləri\n• Malların qeyri-preferensial mənşəyi ilə bağlı qanunvericiliklə müəyyən edilmiş digər tədbirləri tətbiq etməkdir.","2022"],["Preferensial tarif tədbirlərindən və qeyri-preferensial tədbirlərdən istifadə edilməsi üçün malların preferensial mənşəyi hansı qayda da təsdiq edilməlidir?","• Malların mənşə ölkəsini təsdiq edən sertifikat","2022"],["Hansı mallar tam istehsal olunmuş mallar hesab edilir?","• Yerin təkindən, dəniz ərazisindən, atmosfer havasından hasil edilmiş təbii ehtiyatlar\n• Becərilmiş və ya yığılmış bitki mənşəlli məhsullar\n• Doğulmuş və bəslənilmiş heyvanlar\n• Ovçuluq, balıqçılıq və dəniz vətəgəsi məhsulları\n• Emal gəmilərinin bortunda əldə olunmuş məhsullar","2022"],["Gömrük orqanı hansı hallarda malların gömrük bəyannaməsində göstərilən mənşə ölkəsini təsdiq edən sənədin verilməsini tələb edir?","• Mənşəyi gömrük tarifinə görə Azərbaycan Respublikasının imtiyaz verdiyi ölkələrdən olan mallar olduqda;\n• Müəyyən ölkədən gətirilməsi kəmiyyət məhdudiyyətləri (kvota) ilə və ya xarici iqtisadi fəaliyyətin digər üsulları ilə tənzimlənən mallar olduqda;\n• Azərbaycan Respublikasının tərəfdar çıxdığı beynəlxalq müqavilələrdə nəzərdə tutulmuş hallarda.\nƏlavə Dəyər Vergisi haqqında","2022"],["Yaşıl Dəhliz buraxılış sisteminin tətbiq edilməsində məqsəd nələrdir?","• Məmur – sahibkar münasibətinin minimuma endirilməsi;\n• Gömrük rəsmiləşdirilməsini daha çevik və şəffaf həyata keçirmək;\n• Gömrük nəzarəti formalarının daha optimallaşdırılması;\n• Yarana biləcə ktəhlükənin səviyyəsini qabaqcadan müəyyən edilməsidir.","2022"],["Buraxılış sisteminin növləri hansılardır və onları fərqləndirən xüsusiyyətlər hansılardır?","• Yaşıl dəhliz---malların və nəqliyyat vasitələrinin fiziki yoxlanması aparılmadan gömrük proseduruna uyğun gömrük ərazisinə buraxılışını nəzərdə tutan buraxılış sistemi;\n• Mavi dəhliz---malların və nəqliyyat vasitələrinin gömrük ərazisinə buraxılışından sonra gömrük nəzarəti formalarının tətbiqini nəzərdə tutan buraxılış sistemi;\n• Sarı dəhliz---xüsusi icazənin mövcudluğunun və digər hüquq müəyyənedici sənədlərlə müşayiət olunmasının yoxlanmasını və gömrük nəzarəti formalarının tətbiqini nəzərdə tutan buraxılış sistemi;\n• Qırmızı dəhliz---gömrük məqsədləri üçün lazım olan məlumatların və sənədlərin, eləcə də malların və nəqliyyat vasitələrinin, habelə tələb olunan hallarda şəxsin yoxlanmasını nəzərdə tutan buraxılış sistemi;\n122. Buraxılış sistemlərinin hamısında təqdim edilən bəyannamənin forması hansıdır?\n• Qısa idxal bəyannaməsi","2022"],["Qısa idxal bəyannaməsi hansı müddət ərzində təqdim edilməlidir?","• Gömrük sərhədindən keçməsinə ən azı 1 saat qalmış təqdim edilməlidir.","2022"],["Buraxılış sistemlərində risk qrupları və buraxılış sistemlərinin onlara görə bölgüsü nə cürdür?","• aşağı və orta risk qrupu—yaşıl dəhliz\n• aşağı risk qrupu--- mavi dəhliz\n• orta risk qrupu--- sarı dəhliz\n• yüksək risk qrupu--- qırmızı dəhliz","2022"],["İdxalçılar nə zaman yüksək risk qrupuna və aşağı risk qrupuna daxil edilir?","• Son 3 (üç) il ərzində ən azı bir dəfə idxal əməliyyatı həyata keçirmiş idxalatçılar aşağı risk qrupuna aid edilirlər;\n• Son 3 (üç) il ərzində heç bir idxal əməliyyatı həyata keçirməmiş idxalatçılar yüksək risk qrupuna aid edilirlər.","2022"],["Yaşıl dəhliz buraxılış sistemindən daimi istifadəni kimlər əldə edə bilər?","• Aşağı risk qrupuna aid şəxs\n• İdxal əməliyyatları üzrə son 1 ildə təcrübəsi olan\n• Elektron xidmətıərdən istifadə bacarığı olan və xidmətlərdən istifadəni təmin edəcək səlahiyyətli şəxslə müqaviləsi olan\n• Daşımaları beynəlxalq standartlara cavab verən nəqliyyat vasitələri ilə həyata keçirən\n• Qaçaqmalçılıq və gömrük ödənişlərinin ödənilməməsi ilə bağlı məhkumluğu olmayan şəxslər","2022"],["Yaşıl dəhliz buraxılış sistemindən daimi istifadə hüququndan hansı hallarda imtina edilir?","• Müəyyən edilmiş tələblərə cavab vermədikdə\n• Təqdim edilmiş sənədlərdə yalnış məlumatlar olduqda","2022"],["Yaşıl dəhliz buraxılış sistemindən istifadə etdikdə idxal zamanı hansı üstünlüklər olur?","• Malların şəxsin anbarına birbaşa aparılması\n• Gömrük təminatını müstəqil şəkildə çıxarılması və malların boşaldılması","2022"],["Yaşıl dəhliz buraxılış sistemindən istifadə etdikdə ixrac zamanı hansı üstünlüklər olur?","• Mallara təminatın müstəqil şəkildə tətbiq edilməsi\n• Gömrük orqanlarına getmədən, gömrük bəyannamsəni təqdim etməklə, malları bəyan edildiyi gömrük sərhəd buraxılış məntəqəsinə aparılması\nGömrük sahəsində risk və risklərin diarə olunması sistemi haqqında\n130. Risk nədir ?\n• Azərbaycan Respublikası qanunvericiliyinin tələblərinə riayət olunmaması ehtimalıdır.\n131. Risklərin idarə olunması nədir?\n• Məlumatların toplanması, verilənlər bazasının yenilənməsi, risklərin təhlili, onların nəticələrinin monitorinqi yolu ilə risklərin müəyyən edilməsi, onların təhlükəlilik ehtimalının qiymətləndirilməsi, riskə məruz qalmasının azaldılması və qarşısının alınması üçün DGK-nin sistematik işləyib hazırladığı və mütəmadi həyata keçirilən tədbirlərdir.","2022"],["Səlahiyyətli İqtisadi Operator nədir?","• Ümumidünya Gömrük Təşkilatının norma və standartlarına uyğun olaraq, malların təyinat yerinə çatdırılmasının təhlükəsizliyininin təmin edilməsi və xarici ticarətin asanlaşdırılması məqsədi ilə gömrük nəzarətinin sadələşdirilmiş forma və üsullarından istifadə edən hüquqi şəxsdir.","2022"],["Səlahiyyətli iqtisadi operator statusu verilməsi üçün tələblər hansılardır?","• Ümumdünya Gömrük Təşkilatının müəyyən etdiyi təhlükəsizlik normalarına və standartlarına uyğun olaraq təmin edilməsi imkanının mövcudluğu;\n• Gömrük və vergi qanunvericiliyinin tələblərinə riayət edilməsi;\n• Gömrük nəzarəti baxımından əhəmiyyət kəsb edən kommersiya və nəqliyyat sənədlərinin idarə edilməsinə dair qənaətbəxş sistemin olması;\n• Gömrük ödənişlərini və digər ödənişləri həyata keçirmək üçün maliyyə imkanlarının olması;\n• Hüquqi şəxsin fəaliyyət göstərdiyi sahədə ən azı 2 (iki) il təcrübəsinin olması;\n• Müvafiq təhlükəsizlik və mühafizə standartlarının tətbiqi imkanlarının olması;\n• İnformasiya mübadiləsini lazımi səviyyədə təmin edən texniki bazanın olması.","2022"],["Digər ölkələrin gömrük orqanları tərəfindən verilmiş səlahiyyətli iqtisadi operator statusu hansı şərtlə və nəyə əsasən tanına bilər?","• Gömrük nəzarətinə xələl gətirməmək şərtilə\n• Beynəlxalq müqavilələrə","2022"],["Səlahiyyətli iqtisadi operatorun statusu neçə ay müvəqqəti dayandırıla bilər?","• 6 ay müddətinə\nHasilat norması və iqtisadi şəraitin təhlili.\n200. Hasilat norması nəyə deyilir?\n• Emal xüsusi gömrük proseduru altında yerləşdirilmiş malların emalı nəticəsində alınan məhsulların müyyən miqdarı və faizidri.","2022"],["Risklərin idarə olunması sistemi nədir?","• Təhlükələrin təhlili mexanizmi, nəzarət formalarının seçilməsi, səmərəli iş üsullarının müəyyən edilməsini özündə cəmləşdirən tədbirlər toplusudur.","2022"],["Risk meyarı və kontekst nədir?","• Risk meyarı riskin əhəmiyyətini qiymətləndirmə şərtləridir.\n• Komitənin fəaliyyətinə təsir göstərən xarici və daxili mühit kontekstdir.","2022"],["Risklərin idarə olunması sisteminin əsas üstünlükləri nələrdir?","• Strateji hədəflərə nail olmağa, təşkilatın fəaliyyətinin davamlı inkişafına mühim töhfə verir.\n• Təşkilatın fəaliyyətin ayrılmaz tərkib hissəsidir.\n• Qərar qəbuletmənin bir hissəsidir.\n• Dinamik, davamlı, dəyişikliklərə cavab verməklə hər zaman daxili və xarici kontekstləri nəzərə alır.","2022"],["Risklərin idarə olunması sisteminin strukturu neçə hissəyə ayrılır və hansılardır?","• Risklərin idarə olunması sistemi 2 hissəyə ayrılır və aşağıdakılardır:\n• Risklərin İdarə olunması Şurası üzvləri Komitənin sədri tərəfindən müəyyən edilir.\n• Risklərin idarəolunması sisteminin subyektləri\n135. Risklərin idarə olunması sisteminin subyektləri hansılardır və nəyə deyilir ?\n• Risk Meneceri---Gömrük orqanlarının vahid sistemində risklərin idarə edilməsinə, bu sahədə izibatçılığın, kommunikasiya təşkil olunmasına və nəzərdə tutulan vəzifələrin icra edilməsinə Komitənin cavabdek struktur bölməsi və vəzifəli şəxsidir. Risk reysterini və risk hesabatını hazırlayır.\n• Risk Sahibi--- Riski idarəetmək üçün məsuliyyətə və səlahiyyətə malik olan Komitənin vəzifəli şəxsi və ya struktur bölməsidir. Risk böyüyən zaman risk menecerini məlumatlandırır.\n• Risk Koordinatoru---risk sahibi tərəfindən müəyyən olunan, risklərin idarəolunması ilə bağlı fəaliyyəti əlaqələndirən Komitənin müvafiq struktur bölməsinin vəzifəli şəxsdir. Fəaliyyət sahəsi üzrə müəyyən edilmiş riskə nəzarət edir.\n• Nəzarət sahibi---risklərin idarə edilməsi prosesində Komitənin nəzarət tədbirlərinin həyata keçirilməsinə cavabdeh struktur bölməsi və ya vəzifəli şəxsidir. Tətbiq olunan tədbirlərin nəticələri və onların səmərəli olub-olmaması barədə risk menecerinə məlumat verir.","2022"],["Gömrük orqanlarında risklərin idarə olunması sistemində strateji hədəflər hansılardır?","• Büdcə gəlirlərinin təmin olunması\n• Ətraf mühit və əhalinin sağlamlığının qorunması\n• Ticaətin asanlaşdırılması","2022"],["Risklərin idarə olunması prosesi neçə mərhələdən ibarətdir və hansılardır?","• Risklərin idarə olunması prosesi 5 mərhələdən ibarətdir.\n• Kontekstin müəyyən olunması\n• Riskin qiymətləndirilməsi\n• Riskə dair tədbirlər\n• Monitorinq və icmal\n• Sənədləşmə, kommunikasiya və məsləhətləşmə","2022"],["Risklərin qiymətləndirilməsi özü neçə mərhələyə bölünür və hansılardır?","• Riskin identifikasiyası\n• Riskin təhlili\n• Riskin priotetləşdirilməsi","2022"],["Risklərin idarə olunması mərhələləri nəyə əsassən bölgüdür?","• Yenilənmiş Kyoto Konvensiyasının 6-cı maddəsi\n• İSO 31000 Standartı","2022"],["Riskin təhlili mərhələsində hadisənin baş vermə ehtimalı hansı meyarlara uyğun olaraq qiymətləndirilir?","• Müəyyən olunmuş ---- həftədə bir dəfə baş verir\n• Yüksək ehtimallı ---- ayda bir dəfə baş verir\n• Mümkün---- ildə bir dəfə baş verir\n• Aşağı ehtimal--- 3 ildə bir dəfə baş verir\n• Nadir--- 5 ildə bir dəfə baş verir.","2022"],["Nəticənin qiymətləndirilməsi indikatorları hansılardır?","• Əhəmiyyətsiz\n• Kiçik\n• Əhəmiyyətli\n• Ciddi\n• Ağır","2022"],["Riskin prioritetləşdirilməsi nədir?","• Hansı risklərin dözülən olub-olmamasına dair qərarın qəbul edilməsindən ibarətdir. Riskin nə dərəcədə baş verəcəyini anlamağa kömək edir.","2022"],["Riskə dair görülən tədbirlər hansılardır?","• Riskə dözümlülük\n• Riskə təsir\n• Riskin transferi\n• Riskin ləğvi","2022"],["Risklərin idarə edilməsi sisteminin tətbiqi hansı mərhələlər üzrə müəyyən olunur?","• Məlumatın alınması mərhələsi\n• Gömrük sərhəd buraxılış məntəqəsi mərhələsi\n• Çatdırılma mərhələsi\n• Gömrük rəsmiləşdirilməsini həyata keçirən və ya təyinat gömrük orqanı mərhələsi\n• Buraxılışdan sonrakı mərhələ","2022"],["Ümumi meyarlar hansı bölmələrdən ibarətdir?","• Mallar üzrə\n• Ölkələr üzrə\n• Xarici İqtisadi Fəaliyyət iştirakçısı və fiziki şəxslər üzrə\n• Daşınma xüsusiyyəti üzrə\n• Gömrük əməliyyatlarının a
