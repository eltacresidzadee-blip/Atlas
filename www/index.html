rtlərə riayət etmədiyini müəyyən etdikdə.\nGömrük bəyannaməsinin ləğvi bəyannaməçinin qanunvericilikdə nəzərdə tutulmuş inzibati və ya cinayət məsuliyyətinə cəlb olunması üzrə tədbirlərin tətbiqini istisna etmir.","2023"],["Vətəndaşların müraciətlərinə baxılmasının əsas prinsipləri hansılardır?","qanunçuluq;\nvətəndaşların müraciət hüququnun sərbəst və könüllü həyata keçirməsinə şərait yaradılması;\nmüraciətlərə dair tələblərin vahidliyi;\nfiziki və hüquqi şəxslərin hüquqlarının və qanuni mənafelərinin qorunması;\nmüraciətlərə baxılmasında ayrı-seçkiliyə və süründürməçiliyə yol verilməməsi;\nmüraciətə baxan subyektlərin və onların vəzifəli şəxslərinin fəaliyyətində şəffaflığın təmin edilməsi;\nvətəndaşların müraciət etmək hüququ ilə dövlət maraqlarının uzlaşdırılması","2023"],["Hərbiçilərin və ailələrinin müraciəti müddəti?","Hərbi qulluqçuların və onların ailə üzvlərinin müraciətlərinə daxil olduğu gündən etibarən ən geci 15 iş günü ərzində baxılır","2023"],["1 inspektr 1 bəyannamə ilə bağlı məlumatın varmı?","1 bəyannaməni yalnız 1 gömrük inspektoru rəsmiləşdirə(və ya yoxlaya) bilər","2023"],["Gömrük rəsmiləşdirilməsi nə vaxt başlanır?","Gömrük rəsmiləşdirilməsi bəyannaməçinin gömrük orqanına konkret malların və nəqliyyat vasitələrinin gömrük rəsmiləşdirilməsi ilə bağlı bəyannamə və ya müvafiq sənədləri təqdim etdiyi, yaxud bu Məcəllədə nəzərdə tutulmuş hallarda gömrük rəsmiləşdirilməsini həyata keçirmək barədə niyyətini şifahi formada gömrük orqanına bildirdiyi vaxtdan başlanır.","2023"],["Gömrük rəsmiləşdirilməsi nə vaxt başa çatır?","Malların müvafiq gömrük proseduru altında yerləşdirilməsinə dair tələblərə uyğun olaraq zəruri gömrük əməliyyatları yerinə yetirildikdən və bu Məcəllədə nəzərdə tutulmuş gömrük ödənişləri ödənildikdən sonra gömrük rəsmiləşdirilməsi başa çatır.","2023"],["Odlu silahdan hansı hallarda istifadə etmək olar?","Gömrük orqanlarının odlu silahdan istifadə etmək hüququ olan vəzifəli şəxsləri yalnız zəruri müdafiə və ya son zərurət vəziyyətində real təhlükənin qarşısını alarkən odlu silahı aşağıdakı hallarda tətbiq edə bilərlər:\ngömrük orqanlarının işçilərinin həyatı və sağlamlığı üçün təhlükə yaradan basqının dəf edilməsi üçün;\nbaşqa şəxslərin gömrük orqanlarının vəzifəli şəxslərinin odlu silahını əldə etmək cəhdlərinin qarşısını almaq üçün (gömrük orqanının vəzifəli şəxsi tərəfindən tutulub saxlanılan şəxsin həmin vəzifəli şəxs tərəfindən göstərilən məsafəni azaltmaq yolu ilə onun odlu silahına yaxınlaşmaq və ya bu cür silaha toxunmaq cəhdi bu silahı əldə etmək cəhdi kimi qiymətləndirilir);\ngömrük orqanlarına məxsus və ya onların istifadəsində olan binalara, otaqlara, tikililərə və nəqliyyat vasitələrinə, gömrük nəzarəti altında olan mallara və nəqliyyat vasitələrinə silahlı və ya dəstə şəklində basqının dəf edilməsi üçün;\nsilahlı müqavimət göstərən şəxsin, həmçinin silahın təhvil verilməsi haqqında qanuni tələbi yerinə yetirməkdən imtina edən silahlı şəxsin tutulub saxlanılması üçün;\nsürücü gömrük orqanlarının vəzifəli şəxslərinin həyatı və sağlamlığı üçün real təhlükə yaradarsa və onların nəqliyyat vasitəsini saxlamaq barədə dəfələrlə edilən tələblərinə tabe olmazsa, zədə vurmaqla nəqliyyat vasitələrinin dayandırılması üçün;\ngömrük orqanlarının vəzifəli şəxslərinin həyat və sağlamlığı üçün təhlükə törədən heyvanların zərərsizləşdirilməsi üçün;\nodlu silah tətbiq etmək niyyəti haqqında xəbərdarlıq edilməsi, həyəcan siqnalı verilməsi və ya kömək çağırılması üçün.","2023"],["Malların gömrük ekspertizasına göndərilməsi barədə gömrük orqanlarının sənədində (göndərişində) hansılar göstərilməlidir?","gömrük ekspertizasının aparılmasının məqsədləri;\ngömrük ekspertizasının aparılacağı gömrük laboratoriyasının adı;\nekspert qarşısında qoyulmuş suallar;\nekspertə təqdim edilmiş materialların və sənədlərin siyahısı;\nbilə-bilə yalan rəy verməsinə görə ekspertin məsuliyyəti haqqında xəbərdarlıq.\nGömrük ekspertizasının aparılması məqsədləri üçün yuxarıda nəzərdə tutulan sənədlə (göndərişlə) birlikdə aşağıdakı materiallar və sənədlər təqdim edilir:\ngömrük bəyannaməsinin surəti;\nbağlanılmış müqavilənin surəti (əlavələr və spesifikasiyalarla birlikdə);\nmalın gömrük dəyərini müəyyən edən sənədin surəti;\nnəqliyyat sənədinin surəti;\nemal proseduru altında yerləşdirilmiş mallar üçün emala dair ərizənin, hasilat normalarının, təmir məqsədi ilə emal proseduru altında yerləşdirilmiş mallar üçün qüsur barədə aktın surətləri;\nbaytarlıq, fitosanitar, gigiyenik və digər sertifikatların (şəhadətnamələrin), qida məhsullarına münasibətdə qida təhlükəsizliyi sertifikatının, onların istehsalçılarının qida təhlükəsizliyi qeydiyyatına alınmasına dair dövlət reyestrindən çıxarışın surətləri;\nmalların olduğu yerdə onlara baxış keçirilirməsi halları istisna olmaqla, prob və nümunələr, onların götürülməsi haqqında akt.","2023"],["Prob nədir?","prob - gömrük laboratoriyasına təqdim edilməsi məqsədi ilə tədqiqat üçün tələb olunan minimum miqdarda (sayda, ölçüdə) götürülmüş və malın bütün həcminin tərkib və xassələrini xarakterizə edən mal və ya malın bir hissəsidir;","2023"],["Nümunə nədir?","nümunə - bütün mal (məhsul) partiyasının və ya seriyasının struktur, tərkib və xassələrinə uyğun gələn mal (məhsul) vahidi, yaxud yazılı və ya digər təsvir etmə formalarında təqdim edilmiş tək obyektdir;","2023"],["Gömrük ekspertizası hansı müddətə aparılır?","Gömrük ekspertizası 20 (iyirmi) iş günü müddətində aparılır. Ekspertizanın aparılması müddəti materialların və sənədlərin gömrük laboratoriyasına daxil olduğu gündən sonrakı növbəti iş günündən hesablanır və rəyin imzalandığı tarixdə başa çatır. Ekspertizanın aparılma müddətinin sonuncu günü istirahət, səsvermə, iş günü hesab edilməyən bayram gününə və ya ümumxalq hüzn gününə düşərsə, növbəti iş günü müddətin qurtardığı gün hesab olunur.\nGömrük ekspertizasının aparılması müddəti səbəbləri göstərilməklə, gömrük laboratoriyasının rəhbərinin yazılı icazəsi əsasında gömrük ekspertizasının aparılması üçün 4 (dörd) aydan çox olmayan müddətə uzadıla bilər. Gömrük ekspertizasının aparılması müddətinin uzadılmasına dair icazənin surəti 1 (bir) iş günü müddətində gömrük ekspertizasını təyin etmiş gömrük orqanına və ya gömrük ekspertizasının aparılması ilə əlaqədar müraciət etmiş şəxsə göndərilir.","2023"],["Pirat və kontrafakt nədir və fərqləri nədir?","Pirat məhsul - hüquq sahibinin razılığı olmadan hazırlanan (istehsal edilən) və yayılan audiovizual əsərin, fonoqramın, kompyuter proqramının, məlumat toplusunun və kitabın nüsxələri;\nKontrafakt məhsul – əmtəə nişanları, coğrafi göstəricilər və ya onları qarışdıracaq dərəcədə oxşar nişanlarla qeyri-qanuni təchiz olunan mal;","2023"],["Gömrük rəsmiləşdirilməsi üzrə mütəxəssislər fəaliyyətini hansı qanunvericiliyə əsasən həyata keçirirlər?","Azərbaycan Respublikası Gömrük Məcəlləsi\nAzərbaycan Respublikası Nazirlər Kabinetinin 2014-cü il 23 yanvar tarixli 17 nömrəli qərarı ilə təsdiq edilmiş \"Gömrük Təmsilçiliyi, o cümlədən gömrük brokeri fəaliyyətini tənzimləyən Qaydalar\"\nAzərbaycan Respublikası Nazirlər Kabinetinin 2012-ci il 19 sentyabr tarixli 207 nömrəli qərarı ilə təsdiq edilmiş \"Gömrük rəsmiləşdirilməsi üzrə mütəxəssislərə ixtisas attestatının verilməsi, fəaliyyətinin dayandırılması və ləğv edilməsi Qaydalar\"ı","2023"],["Bəyannamə nə vaxt hüquqi əhəmiyyətə malik sənəd sayılır?","Təstiq edildikdən sonra","2023"],["Azərbaycan müstəqillik illərindən sonra hansı nailiyyətləri olmuşdur?","Heydər Əliyevin 1993-cü ilin iyun ayında yenidən Azərbaycanda siyasi hakimiyyətə qayıdışı ölkəni həm siyasi, həmdə iqtisadi sahələrdə möhkəmləndirdi\n1994-cü ildə imzalanan \"Əsrin müqaviləsi\" Azərbaycanın neft strategiyasının reallaşması üçün imkan yaratdı və Xəzər hövzəsində irimiqyaslı layihələrin uğurla həyata keçirilməsini təmin etdi\n2006-cı ildə Bakı - Tbilisi - Ceyhan neft kəmərinin, 2007-ci ildə Bakı - Tbilisi - Ərzurum qaz kəmərinin fəaliyyətə başlaması böyük strateji uğur və Azərbaycanın dünya iqtisadiyyatına inteqrasiyası yolunda həlledici amil oldu\n2020-ci ildə Azərbaycan Respiblikasının prezidenti İlham Əliyevin qüsursuz siyasəti sayəsində torpqalarımızın işğaldan azad edilməsi və Ermənitan Respublikası üzərində mütləq qalibiyyətimiz","2023"],["Beynəlxalq tranzitdə bəyannamənin yerinə hansı sənədlər təqdim oluna bilər?","Gömrük orqanları tələb etdikləri məlumatların ətraflı qeyd olunduğu və malların daşınması zamanı istifadə olunan Azərbaycan Respublikasının qanunvericiliyində, habelə tərəfdar çıxdığı beynəlxalq müqavilələrdə nəzərdə tutulmuş istənilən kommersiya və ya nəqliyyat sənədini gömrük bəyannaməsi kimi qəbul edir.","2023"],["Gömrüyə aid inzibati xətalar hansılardı?","Malların və nəqliyyat vasitələrinin Azərbaycan Respublikasının gömrük sərhədindən gömrük nəzarətindən kənar keçirilməsi\nMalların və nəqliyyat vasitələrinin Azərbaycan Respublikasının gömrük sərhədindən gömrük nəzarətindən gizlədilməklə keçirilməsi\nMalların və nəqliyyat vasitələrinin Azərbaycan Respublikasının gömrük sərhədindən sənədlərdən və ya eyniləşdirmə vasitələrindən aldatma yolu ilə istifadə etməklə keçirilməs\nMalların və nəqliyyat vasitələrinin bəyan edilməməsi və ya düzgün bəyan edilməməsi\nAzərbaycan Respublikasından xarici ölkəyə və ya xarici ölkədən Azərbaycanda Respublikasına qanunsuz pul köçürülməsi fəaliyyəti ilə məşğul olma\nXarici valyuta vəsaitlərinin xaricdən qaytarılmaması\nGömrük nəzarəti zonası rejiminin pozulması\nMallar və nəqliyyat vasitələri gətirilərkən və ya aparılarkən müvafiq icra hakimiyyəti orqanına məlumatın verilməməsi və ya təhrif olunmuş məlumatın verilməsi, yaxud əvvəlcədən qısa idxal bəyannaməsinin verilməməsi\nFors-major hallarda və ya qəza zamanı müvafiq tədbirin görülməməsi\nGömrük rəsmiləşdirilməsi qaydasının pozulması\nGömrük təminatının pozulması\nMalların emal edilməsi qaydasının pozulması\nMalların məhvi qaydasının pozulması və sairə\nGömrük ödənişlərinin (borcunun) ödənilməsindən yayınma","2023"],["Cinayət Məcəlləsində qaçaqmalçılığın növləri hansılardır?","Malların və nəqliyyat vasitələrinin Azərbaycan Respublikasının gömrük sərhədindən gömrük nəzarətindən kənar keçirilməsi\nMalların və nəqliyyat vasitələrinin Azərbaycan Respublikasının gömrük sərhədindən gömrük nəzarətindən gizlədilməklə keçirilməsi\nMalların və nəqliyyat vasitələrinin Azərbaycan Respublikasının gömrük sərhədindən sənədlərdən və ya eyniləşdirmə vasitələrindən aldatma yolu ilə istifadə etməklə keçirilməsi\nMalların və nəqliyyat vasitələrinin bəyan edilməməsi və ya düzgün bəyan edilməməsi\n“xeyli miqdar” dedikdə - əlli min manatdan yuxarı, lakin iki yüz min manatdan artıq olmayan məbləğ\n“külli miqdar” dedikdə, iki yüz min manatdan yuxarı, lakin beş yüz min manatdan artıq olmayan məbləğ\n“xüsusilə külli miqdar” dedikdə beş yüz min manatdan yuxarı olan məbləğ başa düşülür","2023"],["Xarici valyuta vəsaitlərinin xaricdən qaytarılmaması nədir?","208.1. Xarici iqtisadi fəaliyyətin həyata keçirilməsi nəticəsində əldə edilmiş və Azərbaycan Respublikasının qanunvericiliyinə müvafiq olaraq Azərbaycan Respublikasının müvəkkil edilmiş bankının hesabına məcburi qaydada köçürülməli olan xeyli miqdarda xarici valyuta vəsaitlərini xaricdən qaytarmama—\nüç ilədək müddətə azadlığın məhdudlaşdırılması və ya üç ilədək müddətə azadlıqdan məhrum etmə ilə cəzalandırılır.\n208.2. Eyni əməllər:\n208.2.1. külli miqdarda törədildikdə;\n208.2.2. qabaqcadan əlbir olan bir qrup şəxs tərəfindən törədildikdə—\nüç ildən beş ilədək müddətə azadlıqdan məhrum etmə ilə cəzalandırılır.\nQeyd: Bu maddədə «xeyli miqdar» dedikdə, qaytarılmamış xarici valyuta vəsaitlərinin iyirmi min manatdan, yuxarı, lakin otuz min manatdan artıq olmayan məbləği, “külli miqdar” dedikdə otuz min manatdan artıq olan məbləği başa düşülür","2023"],["Gömrük bəyannaməsi hansı müddətdə təsdiq olunur?","Gömrük bəyannaməsi müəyyən edilmiş şərtlərə cavab verdikdə, həmin bəyannamə təqdim olunduğu gün gömrük orqanları tərəfindən təsdiq edilir.","2023"],["Gömrük bəyannaməsində hansı hallarda düzəliş edilməsinə edilməsinə və ya onun geri götürülməsinə icazə verilmir?","gömrük orqanları bəyannaməçiyə malları yoxlamaq niyyətində olduğunu bildirdikdən sonra;\ngömrük orqanları gömrük bəyannaməsindəki məlumatların düzgün olmadığını müəyyənləşdirdikdən sonra;\nmüvafiq icra hakimiyyəti orqanının müəyyən etdiyi hallar istisna olmaqla, gömrük orqanları tərəfindən malların buraxılışı həyata keçirildikdən sonra.","2023"],["Gömrük bəyannaməsində hansı hallarda malların buraxılışı həyata keçdikdən sonra düzəliş edilməsinə və ya onun geri götürülməsinə icazə verilir?","gömrük ödənişləri üzrə güzəştlər verilərək şərti buraxılmış mallardan başqa məqsədlər üçün istifadə olunduqda;\nmalların buraxılışının həyata keçirilməsinə baxmayaraq, onlar gömrük nəzarəti zonasını tərk etmədikdə.","2023"],["Gömrük bəyannaməsində düzəlişlər məhdudlaşdıra bilərmi?","Gömrük bəyannaməsində aparılan düzəlişlər onun tətbiq sahəsini genişləndirə və ya məhdudlaşdıra bilməz","2023"],["Gömrük bəyannaməsi nədir?","Gömrük bəyannaməsi – malların müvafiq gömrük proseduru altında yerləşdirilməsi üçün tələb olunan məlumatları əks etdirən, şəxslər tərəfindən müvafiq icra hakimiyyəti orqanının müəyyən etdiyi formada gömrük orqanına təqdim olunan sənəd","2023"],["Dövlət Gömrük Komitəsi haqqında əsasnaməni kim təsdiq edir?","Azərbaycan Respublikasının Prezidenti","2023"],["DGK haqqında əsasnamə nələri tənzimləyir?","Komitənin fəaliyyət istiqamətlərini\nKomitənin vəzifələrini\nKomitənin hüquqlarını\nKomitənin fəaliyyətinin təşkilini","2023"],["Gömrük orqanları niye hüquq-mühafizə orqanları sayılır?","gömrük işi sahəsində dövlət siyasətini və tənzimlənməsini həyata keçirir (Məsələn: hüquqpozmaların qarşısını alınması üçün fiziki qüvvə, xüsusi vasitələr və odlu silah tətbiq edir, təhqiqat aparmaq səlahiyyətləri var və sarə)\ngömrük qaydaları əleyhinə olan inzibati xətalar üzrə icraatın aparır və işlərə baxır\nəməliyyat-axtarış fəaliyyəti tədbirləri həyata keçirir\ntəhlükəsizliyini təmin edən tədbirlər görür","2023"],["Gömrük orqanlarında xidmət nə ilə tənzimlənir?","“Gömrük orqanlarında xidmət haqqında“ Azərbaycan Respublikasının 7 dekabr tarixli, 1999-cu il 768-IQ nömrəli Qanunu ilə","2023"],["Aksiz nədir?","Aksiz — aksizli malların satış qiymətinə daxil edilən vergidir.\nAzərbaycan Respublikasının ərazisində istehsal edilən, yaxud idxal olunan aksizli mallardan, vergidən azad edilən mallar istisna olunmaqla, aksiz tutulur.","2023"],["Aksizli mallar hansılardı?","içməli spirt, pivə və spirtli içkilərin bütün növləri;\ntütün məmulatları;\nneft məhsulları;\nminik avtomobilləri (xüsusi nişan və avadanlıqlarla təchiz olunmuş xüsusi təyinatlı avtonəqliyyat vasitələri istisna olmaqla);\nistirahət və ya idman üçün yaxtalar və bu məqsədlər üçün nəzərdə tutulan digər üzən vasitələr;\nidxal olunan platin, qızıl, ondan hazırlanmış zərgərlik və digər məişət məmulatları, emal olunmuş, çeşidlənmiş, çərçivəyə salınmış və bərkidilmiş almaz;\nidxal olunan xəz-dəri məmulatları;\nenergetik içkilər;\navtobuslar (sıxılmış qazla işləyən avtobuslar istisna olmaqla);\nelektron siqaretlər üçün maye;\nistehsal məqsədli tütünlər istisna olmaqla digər çəkməli tütünlər, “homogenləşdirilmiş” və ya “bərpa edilmiş” tütünlər, çeynənilən və ya buruna çəkilən tütünlər, habelə qəlyan üçün tütünlər və tütün əvəzləyiciləri;\nqızdırılma nəticəsində istehlak edilən (buxar) tütün və tütün məhsulları\nbirdəfəlik istifadə üçün elektron siqaret, qəlyan və onların əvəzediciləri.","2023"],["Qızıl aksiz vergisinə cəlb olunurmu?","Bəli\nqızılın min çəki vahidindəki miqdarı 375 (üç yüz yetmiş beş) olduqda, hər qramına görə - 1,5 manat;\nqızılın min çəki vahidindəki miqdarı 500 (beş yüz) olduqda, hər qramına görə - 2,0 manat;\nqızılın min çəki vahidindəki miqdarı 585 (beş yüz səksən beş) olduqda, hər qramına görə - 2,4 manat;\nqızılın min çəki vahidindəki miqdarı 750 (yeddi yüz əlli) olduqda, hər qramına görə - 3,0 manat;\nqızılın min çəki vahidindəki miqdarı 958 (doqquz yüz əlli səkkiz) olduqda, hər qramına görə - 5,0 manat;\nqızılın min çəki vahidindəki miqdarı 999 (doqquz yüz doxsan doqquz) olduqda, hər qramına görə - 6,0 manat;","2023"],["Şəxs təzə 1000 dollarlıq telefon gətirir, bilmir nə etmek lazımdı, gömrükçü kimi nə etməlisən? Hansı bəyannamə ilə rasmiləşdiriləcək?","305 nömrəli qərarı izah edəcəm, nəticə olaraq 800 dolları çıxılıb 200 dolları ödənişə cəlb olunacaq\nSadələşdirilmiş bəyannamə ilə","2023"],["Eyniləşdirmə vasitələrini kim götürə və ya poza bilər?","Fors-major hallarında malların və nəqliyyat vasitələrinin mühafizəsini təmin etmək məqsədləri istisna olmaqla, onlara tətbiq edilmiş eyniləşdirmə vasitələrinin götürülməsi və ya məhv edilməsi yalnız gömrük orqanları tərəfindən, gömrük orqanları tərəfindən səlahiyyət verildiyi hallarda isə səlahiyyətli iqtisadi operatorlar tərəfindən həyata keçirilə bilər.","2023"],["Gömrük ərazisi dedikdə nə başa düşürsən?","Azərbaycan Respublikasının ərazisi vahid gömrük ərazisidir.\nGömrük ərazisinə Azərbaycan Respublikasının quru ərazisi, daxili suları, Xəzər dənizinin (gölünün) Azərbaycan Respublikasına mənsub olan bölməsi (o cümlədən, orada yerləşən adalar, süni adalar, qurğular və tikililər) və onların üzərindəki hava məkanı daxildir","2023"],["İşğaldan azad olunmuş ərazilərdəki güzəştlər nə ilə tənzimlənir?","“İşğaldan azad edilmiş ərazilərdə iqtisadi inkişafın sürətləndirilməsi ilə bağlı bəzi tədbirlər haqqında” Azərbaycan Respublikası Prezidentinin 2021-ci il 10 dekabr tarixli sərəncamı ilə","2023"],["İşğaldan azad olunmuş ərazilərdə fəaliyyət üçün hansı güzəştlər var?","İşğaldan azad edilmiş ərazinin rezidentləri 2023-cü il yanvarın 1-dən etibarən 10 il müddətində mənfəət (gəlir), əmlak, torpaq və sadələşdirilmiş vergidən azaddır.\nbu azadolma işğaldan azad edilmiş ərazinin rezidentinin həmin ərazidəki fəaliyyəti ilə bağlı əldə olunan satışdankənar gəlirlərinə də şamil ediləcək.\nƏDV-nin məqsədləri üçün qeydiyyatda olan işğaldan azad edilmiş ərazinin rezidentləri tərəfindən siyahısı müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən təsdiq edilmiş istehsal fəaliyyəti sahələri üzrə xammal və materialların idxalının 2023-cü il yanvarın 1-dən etibarən 10 il müddətində ƏDV-dən azad edilməsi, işğaldan azad edilmiş ərazinin rezidenti olan hüquqi şəxslərin səhmdarlarının (payçılarının) dividend gəlirlərinin 2023-cü il yanvarın 1-dən etibarən 10 il müddətində vergidən azad edilir.\nİşğaldan azad edilmiş ərazilər daxilində yerləşmə vasitələri hesab edilən mehmanxanalar (hotellar) tərəfindən göstərilən gecələmə və qalma xidmətlərinə (digər əlavə xidmətlər istisna olmaqla) görə nağdsız qaydada ödənilmiş ƏDV-nin 30 faizi, nağd qaydada ödənilmiş ƏDV-nin isə 5 faizi həcmində ƏDV-nin fiziki şəxs olan istehlakçılara geri qaytarılması da təklif olunur.\nVergi azadolmaları aşağıdakı fəaliyyət növlərinə və əməliyyatlara şamil edilməyəcək:\n- maliyyə xidmətlərinin göstərilməsi sahəsində fəaliyyət;\n- avtonəqliyyat vasitələri ilə yük daşıma xidmətləri:\n- dövlət büdcəsinin vəsaitləri hesabına podratçı (işğaldan azad edilmiş ərazi daxilində istehsal fəaliyyətini həyata keçirən rezident podratçılar istisna olmaqla) tərəfindən malların (işlərin və xidmətlərin) təqdim edilməsi.","2023"],["İnvestisiya təşviqi sahələrini kim müəyyən edir?","Azərbaycan Respublikasının Prezidenti","2023"],["Dövlət orqanı nədir?","Dövlət orqanı Azərbaycan Respublikasının qanunvericilik aktları ilə müəyyən edilmiş hüdudlarda dövlətin məqsəd və funksiyalarını həyata keçirən, Azərbaycan Respublikasının dövlət büdcəsindən, Naxçıvan Muxtar Respublikasının büdcəsindən maliyyələşdirilən, Azərbaycan Respublikasının Konstitusiyasına və Azərbaycan Respublikasının qanunlarına uyğun olaraq yaradılan dövlət təsisatıdır.","2023"],["Dövlət orqanının bölməsi nədir?","Dövlət orqanının bölməsi – dövlət orqanın qanunvericilik aktlarında nəzərdə tutulmuş, yaxud müəyyən edilmiş qaydada təsis olunan elə struktur hissəsidir ki, özünə həvalə edilmiş funksiyalar çərçivəsində həmin orqanın səlahiyyətlərinin bir hissəsini həyata keçirir","2023"],["Gömrük ödənişlərini ödəməkdən yayınma nədir və hansı məsuliyyətə səbəb olur?","Maddə 505 (İXM) Gömrük ödənişlərini (borcunu) ödəməkdən yayınmağa görə, bu az miqdarda olduqda -\nödənilməli olan gömrük ödənişlərinin məbləğinin yetmiş faizindən yüz əlli faizinədək məbləğdə cərimə edilir.\nMaddə 209(CM) Xeyli miqdarda gömrük ödənişlərinin ödənilməsindən yayınma—\ncinayət nəticəsində vurulmuş ziyanın iki mislindən üç mislinədək miqdarda cərimə və ya bir ilədək müddətə islah işləri və ya bir ilədək müddətə azadlıqdan məhrum etmə ilə cəzalandırılır.\n209.2. Bu Məcəllənin 209.1-ci maddəsində nəzərdə tutulmuş əməllər:\n209.2.1. təkrar törədildikdə;\n209.2.2. külli miqdarda törədildikdə—\ncinayət nəticəsində vurulmuş ziyanın üç misli miqdarında cərimə və ya iki ilədək müddətə islah işləri və ya iki ilədək müddətə azadlıqdan məhrum etmə ilə cəzalandırılır\n209.3. Bu Məcəllənin 209.1 və 209.2.1-ci maddələrində nəzərdə tutulmuş əməllər xüsusilə külli miqdarda törədildikdə\ncinayət nəticəsində vurulmuş ziyanın dörd misli miqdarında cərimə və ya iki ildən beş ilədək müddətə azadlıqdan məhrum etmə ilə cəzalandırılır.","2023"],["Malların buraxılışı nə vaxt həyata keçirdilir?","Bəyannaməçi, mallar barəsində səlahiyyəti olan digər şəxslər və ya onların nümayəndələri tərəfindən bu Məcəllənin 163-cü maddəsi ilə müəyyən edilmiş şərtlər yerinə yetirildikdən, bəyan olunan mallarla əlaqədar qanunvericiliklə qadağaların və məhdudiyyətlərin olmadığı müəyyən edildikdən, gömrük bəyannaməsindəki məlumatlar yoxlandıqdan dərhal sonra gömrük orqanları malların buraxılışını həyata keçirirlər proseduru altında yerləşdirilmiş malların buraxılışını həyata keçirir. Eyni gömrük bəyannaməsinin əhatə etdiyi bütün mallar gömrük orqanları tərəfindən eyni vaxtda buraxılır","2023"],["Gömrük işi sahəsində normayaratma fəaliyyətin necə izah eləmək olar?","Yəni, kollegiya qərarları qəbul edir və bununla da normalar müəyyənləşdirir.\nEyni zamanda NK-nə , Milli Məclisə gömrük işi sahəsinə aid normalar meəyyən edən təkliflər hazırlayıb göndərir","2023"],["Əlavə ekspertiza ilə təkrar ekspertizanın fərqi nədir?","ilkin ekspertiza - xüsusi biliklərdən istifadə edərək, gömrük ekspertizasının aparılması məqsədlərini müəyyənləşdirilməsi üçün ilk dəfə aparılan ekspertizadır;\nəlavə ekspertiza - ilkin ekspertizaya dair rəydə qoyulmuş suallara tam cavab verilmədikdə və ya tədqiqat obyektinə dair əlavə suallar yarandıqda aparılan ekspertizadır. Əlavə ekspertizanın aparılması həmin və ya başqa ekspertə həvalə edilir;","2023"],["Ekspert rəyi nədir?","Ekspert rəyi - gömrük ekspertizasının nəticələrinə dair ekspert tərəfindən yazılı formada tərtib edilən sənəddir.","2023"],["Ekspertin hüquqları hansılardır?","tədqiqat obyektinə aid materiallar və sənədlərlə tanış olmaq;\ngömrük ekspertizasını aparmaq üçün zəruri olan əlavə materiallar və sənədlər tələb etmək;\ntədqiqat obyektinə aid məlumatların aydınlaşdırılması üçün gömrük orqanlarının vəzifəli şəxslərinə, bəyannaməçiyə, mallar barədə səlahiyyəti olan digər şəxslərə və onların nümayəndələrinə suallar vermək;\nqoyulmuş suallardan əlavə tədqiqat obyektinə aid olan və iş üçün əhəmiyyətli hesab etdiyi digər halları öz rəyində göstərmək;\ngömrük orqanlarının icazəsi ilə gömrük nəzarətinin həyata keçirilməsində iştirak etmək.","2023"],["Ekspertin vəzifələri hansılardır?","şəxslərə gömrük ekspertizasına dair məsləhətlər vermək;\ngömrük ekspertizasına təqdim olunmuş mallardan götürülmüş prob və nümunələrin tədqiqatını aparmaq və onun nəticəsini tam, hərtərəfli və qərəzsiz qiymətləndirməklə rəy təqdim etmək;\ntəqdim olunan materiallar və sənədlər əsasında rəy vermək mümkün olmadıqda, gömrük ekspertizasını təyin etmiş gömrük orqanına, yaxud bununla əlaqədar müraciət etmiş şəxsə səbəbləri göstərilməklə, yazılı məlumat vermək;\ngömrük ekspertizasının aparılması üçün gömrük orqanlarından və digər şəxslərdən aldığı, habelə əldə etdiyi nəticələr barədə məlumatları yaymamaq.","2023"],["Dövlət Gömrük Komitəsi haqqqında ingilis dilində daniş","SCC (The State Customs Committee) is a government agency responsible for carrying out the Republic of Azerbaijan's customs regulations.\nThe committee's primary duties:\n• organizing and improving customs work;\n• implementing customs policy;\n• protecting the Republic of Azerbaijan's economic interests and security within its purview;\n• ensuring the uniformity of the country's customs territory within its purview;\n• organizing the introduction of cutting-edge customs regulation tools in the Republic of Azerbaijan;\n• ensuring compliance with all applicable customs and other laws.","2023"],["Ticarət siyasəti tədbirləri nədir?","Ticarət siyasəti tədbirləri – Ümumdünya Ticarət Təşkilatının qərarlarının tətbiq olunmasının bir hissəsi kimi, malların idxalı və ixracını qanunvericiliklə müəyyən olunmuş formada tənzimləyən qeyri-tarif tədbirləri","2023"],["İdxal olunan mallar üçün hansı rüsüm növləri var?","Azərbaycan Respublikasının iqtisadi maraqlarını qorumaq məqsədi ilə Azərbaycan Respublikasının gömrük ərazisinə (bundan sonra - gömrük ərazisi) idxal edilən mallara müvəqqəti olaraq gömrük rüsumlarının aşağıdakı növləri tətbiq oluna bilər:\nxüsusi rüsumlar;\nantidempinq rüsumları;\nkompensasiya rüsumları.","2023"],["Xüsusi rüsüm nədir?","Xüsusi rüsumlar malın gömrük ərazisinə idxalının artmış həcmi və şərtləri yerli istehsal sahəsinə ciddi zərər vurduqda və ya ciddi zərər vurmaq təhlükəsi yaratdıqda tətbiq edilir","2023"],["Anidempinq rüsumu nədir?","Antidempinq rüsumları malın normal dəyərindən aşağı qiymətə gömrük ərazisinə idxal edilməsi yerli istehsal sahəsinə maddi zərər vurduqda, yerli istehsal sahəsinə maddi zərər vurmaq təhlükəsi yaratdıqda və ya yerli istehsal sahəsinin yaradılmasının mühüm dərəcədə ləngiməsinə səbəb olduqda tətbiq edilir.","2023"],["Kompensasiya rüsumu nədir?","Kompensasiya rüsumları istehsalı, ixracı və ya daşınması zamanı xarici dövlətin spesifik subsidiyasının istifadə olunduğu malın gömrük ərazisinə idxalı yerli istehsal sahəsinə maddi zərər vurduqda, yerli istehsal sahəsinə maddi zərər vurmaq təhlükəsi yaratdıqda və ya yerli istehsal sahəsinin yaradılmasının mühüm dərəcədə ləngiməsinə səbəb olduqda tətbiq edilir","2023"],["Konstitusiyada qanunvericilik təşəbbüsü hüququ kimlərə mənsubdur?","Azərbaycan Respublikasının Milli Məclisində qanunvericilik təşəbbüsü hüququ (qanun layihələrini və başqa məsələləri Azərbaycan Respublikası Milli Məclisinin müzakirəsinə təqdim etmək hüququ) Azərbaycan Respublikası Milli Məclisinin deputatlarına, Azərbaycan Respublikasının Prezidentinə, Azərbaycan Respublikasının Ali Məhkəməsinə, Azərbaycan Respublikasının seçki hüququ olan 40 min vətəndaşına, Azərbaycan Respublikasının Prokurorluğuna və Naxçıvan Muxtar Respublikasının Ali Məclisinə mənsubdur. (PAPAM)","2023"],["Gömrük tarifin meqsedləri?","idxalın əmtəə strukturunu tənzimləmək;\nmalların Azərbaycan Respublikasının gömrük ərazisinə gətirilməsinin və bu ərazidən aparılmasının, habelə valyuta gəlirlərinin və xərclərinin əlverişli nisbətini təmin etmək;\nAzərbaycan Respublikasında malların istehsal və istehlak strukturunda mütərəqqi dəyişikliklər üçün şərait yaratmaq;\nAzərbaycan Respublikasının iqtisadiyyatını xarici rəqabətin mənfi təsirindən qorumaq;\nAzərbaycan Respublikasının iqtisadiyyatının dünya iqtisadiyyatına inteqrasiyasına şərait yaratmaq.","2023"],["1 nəfər qanunvericilk təsəbbüsü hüququnu yerinə yetirə bilərmi?","Xeyr, minimum 40.000 vətandaş olmalıdır","2023"],["Dünyəvi dövlət nədir?","Dünyəvi dövlət — dinin dövlət idarəetməsindən uzaqlaşdırılması nəticəsində yaranmış dövlətdir. Bu kimi ölkələrdə dövlət orqanlarının qərarları dini əsaslı ola bilməz.","2023"],["Komitənin hüquqları?","gömrük işi sahəsində normayaratma fəaliyyətindən irəli gələn hüquqları həyata keçirmək;\ngömrük işi üzrə qanunvericilik aktlarına əsasən gömrük orqanlarına təqdim olunması nəzərdə tutulan sənəd və məlumatları şəxslərdən tələb etmək;\ngömrük orqanlarına təqdim edilən məlumatların, sənədlərin və bəyannamələrin həqiqiliyini və düzgünlüyünü araşdırmaq;\nşəxslərin xarici ticarət əməliyyatlarının gömrük auditini aparmaq;\ndövlət sərhədinin buraxılış məntəqələrindən keçirilən malların və nəqliyyat vasitələrinin sənədlərini, o cümlədən malların baytarlıq, fitosanitar, gigiyenik və digər sertifikatlarını (şəhadətnamələrini), “Qida təhlükəsizliyi haqqında” Azərbaycan Respublikasının Qanununa əsasən tərtib edilən idxal zamanı elektron bildirişi, Qida Təhlükəsizliyi Reyestrindən çıxarışı, sağlamlıq sertifikatını, qida və yem məhsullarının təhlükəsizliyini təsdiq edən sənədləri qanunvericiliyə uyğun olaraq yoxlamaq;[ \\[8\\]](https://e-qanun.az/framework/23659#_edn8)\nmalların və nəqliyyat vasitələrinin buraxılışından sonra şəxslərin bunlar barəsində sərəncam verilməsinə dair məhdudiyyətlərə, tələblərə və şərtlərə riayət etmək öhdəliklərini yerinə yetirmələrini yoxlamaq, gömrük prosedurlarına nəzarəti həyata keçirmək, hüquqpozmaların operativ surətdə qarşısını almaq, əməliyyat-axtarış fəaliyyətini sürətləndirmək və digər məqsədlər üçün gömrük orqanlarının sistemi daxilində mobil qruplar təşkil etmək;\ngömrük işi sahəsində cinayətlərin qarşısını almaq, belə cinayətləri törətmiş, habelə onların törədilməsində şübhəli bilinən şəxslərin saxlanılması və ya təqib edilməsi məqsədi ilə idarə, müəssisə və təşkilatlara (xarici dövlətlərin diplomatik, konsulluq və başqa nümayəndəliklərinə, beynəlxalq təşkilatlara məxsus olan və xüsusi təyinatlı nəqliyyat, rabitə vasitələri istisna edilməklə) məxsus rabitə və nəqliyyat vasitələrindən son zərurət vəziyyətində istifadə etmək;\ntəhqiqatı və istintaqı gömrük orqanlarının səlahiyyətinə aid edilmiş cinayətlərin qarşısının alınması, aşkar edilməsi və açılması, onları hazırlayan, törədən və ya törətmiş şəxsləri müəyyənləşdirmək məqsədi ilə qanunvericiliklə müəyyən edilmiş qaydada əməliyyat-axtarış fəaliyyətini həyata keçirmək;\ncinayət-prosessual qanunvericiliyi ilə müəyyən edilmiş qaydada təhqiqat və ibtidai istintaq aparmaq;\nmüvafiq qanunvericiliyə uyğun olaraq inzibati xətalarla bağlı işlər üzrə icraat aparmaq, bu işlərə baxmaq və inzibati xətalar törətmiş şəxsləri məsuliyyətə cəlb etmək;\nAzərbaycan Respublikasının Gömrük Məcəlləsində nəzərdə tutulmuş hallarda və qaydada fiziki qüvvədən, xüsusi vasitələrdən (o cümlədən texniki vasitələrdən) və odlu silahdan istifadə etmək;\nmüstəqil surətdə, yaxud digər hüquq mühafizə orqanları cəlb edilməklə, gömrük nəzarəti zonasında rejim qaydalarına riayət olunmasına nəzarət etmək, gömrük xidmətinin infrastruktur obyektlərinin mühafizə sistemini təşkil etmək, gömrük sərhədinin qorunması məqsədi ilə başqa tədbirləri həyata keçirmək;\nmalların və nəqliyyat vasitələrinin gömrük sərhədindən keçirilməsi, həmçinin gömrük nəzarəti altında yerləşdirilən malların daşınması, saxlanılması, onlar üzərində yük əməliyyatlarının aparılması ilə bağlı faktları və hadisələri sənədləşdirmək, audioyazılar, video və foto çəkilişlər aparmaq;\nöz funksiyalarını yerinə yetirmək məqsədi ilə şəxslərə gömrük qanunvericiliyinin pozulmasının aradan qaldırılması üçün yazılı formada xəbərdarlıqlar göndərmək və tələblərinin yerinə yetirilməsinə nəzarət etmək;\ngömrük rəsmiləşdirilməsinin və nəzarətinin müasir metod və vasitələrinin tətbiqi məsələləri üzrə xarici ticarət iştirakçıları ilə əməkdaşlıq etmək məqsədi ilə onlarla rəsmi münasibətlər yaratmaq, məsləhətləşmələr aparmaq;\ngömrük orqanlarında kargüzarlığın təşkil edilməsi, icra və əmək intizamına riayət olunması üzrə işin təşkili vəziyyətini yoxlamaq;\nAzərbaycan Respublikasının və xarici dövlətlərin xüsusi təyinatlı təhsil müəssisələrində kadrların hazırlanması üzrə müqavilələr bağlamaq;\nfəaliyyət istiqamətlərinə uyğun rəylər vermək, təhlillər və ümumiləşdirmələr aparmaq, analitik materiallar hazırlamaq, gömrük işi sahəsi üzrə tədqiqatlar aparmaq, təkliflər vermək;\nqanunvericiliklə müəyyən edilmiş qaydada xüsusi bülletenlər və digər nəşrlər buraxmaq;\nAzərbaycan Respublikasının gömrük işi sahəsi üzrə beynəlxalq müqavilələrə tərəfdar çıxması barədə təkliflər vermək;\nqanunvericiliklə müəyyən edilmiş qaydada müvafiq beynəlxalq təşkilatlarla, xarici dövlətlərin aidiyyəti dövlət orqanları (qurumları) ilə əməkdaşlıq etmək, xarici dövlətlərin müvafiq təcrübəsini öyrənmək;\nmüstəqil ekspertləri və mütəxəssisləri qanunvericiliklə müəyyən edilmiş qaydada öz fəaliyyətinə cəlb etmək;\nKomitə sisteminə daxil olan gömrük orqanlarının və onun tabeliyində olan digər qurumların fəaliyyətini yoxlamaq və təftişini həyata keçirmək;\ngömrük işi sahəsi üzrə dövlət və yerli özünüidarəetmə orqanlarına, fiziki və hüquqi şəxslərə zəruri məlumatlar (sənədlər) barədə sorğu vermək və onlardan belə məlumatları (sənədləri) almaq;\nqanunvericiliklə müəyyən edilmiş qaydada …","2023"],["Komitənin vezifələri?","gömrük işi sahəsində normayaratma fəaliyyətindən irəli gələn vəzifələri həyata keçirmək;\nqanunvericilikdə nəzərdə tutulmuş qaydada Azərbaycan Respublikasının iqtisadi və milli təhlükəsizliyini təmin etmək;\nicrasına nəzarət gömrük orqanlarına həvalə edilmiş qanunvericilik aktlarına riayət olunmasını təmin etmək;\ngömrük işinə dair qanunvericilik aktlarının pozulması hallarının qarısını almaq və müvafiq araşdırmalar aparmaq;\nmalların və nəqliyyat vasitələrinin gömrük rəsmiləşdirilməsinin həyata keçirilməsini təşkil etmək, onun təkmilləşdirilməsi və sadələşdirilməsi üçün tədbirlər görmək;\nmallar və nəqliyyat vasitələri gömrük sərhədindən keçirilərkən nəzarəti və gömrük rəsmiləşdirilməsi qaydalarına riayət olunmasını təmin etmək;\ngömrük ödənişlərinin alınmasını təmin etmək;\ngömrük rüsumlarının, müvafiq vergilərin və dövlət rüsumunun vaxtında və tam həcmdə dövlət büdcəsinə köçürülməsini təmin etmək;\nqanunvericilikdə nəzərdə tutulmuş qaydada malların gömrük dəyərinin düzgün müəyyən olunmasına nəzarət sistemini təşkil etmək;\nqanunvericilikdə nəzərdə tutulmuş hallarda lisenziya və ixtisas attestatları vermək, onları ləğv etmək və ya onların fəaliyyətini dayandırmaq;\nmalların və nəqliyyat vasitələrinin gömrük sərhədindən keçirilməsinin sürətləndirilməsi üçün əlverişli şərait yaratmaq;\ngömrük sərhədindən keçirilən mallar barəsində ticarət siyasəti tədbirlərinin işlənib hazırlanmasında və həyata keçirilməsində iştirak etmək;\ngömrük işi sahəsində cinayətlərə, həmçinin qaydaları əleyhinə inzibati xətalara və digər hüquqpozmalara qarşı mübarizə aparılması, narkotik vasitələrin, psixotrop maddələrin və onların prekursorlarının, silahların, ozondağıdıcı maddələrin, xalqların mədəni, tarixi və arxeoloji sərvətlərinin, əqli mülkiyyət hüquqlarının obyektlərinin, yox olmaq təhlükəsi altında olan heyvanların və bitki növlərinin, həmçinin başqa malların gömrük sərhədindən qanunsuz keçirilməsinin qarşısını almaq;\nAzərbaycan Respublikasının dəmiryol vağzallarında, dəniz, çay və hava limanlarında, habelə digər yerlərdə beynəlxalq nəqliyyat vasitələrinin fəaliyyətinə qanunsuz müdaxilənin qarşısının alınmasında və beynəlxalq terrorçuluqla mübarizədə digər hüquq mühafizə orqanlarına yardım göstərmək;\nmilli təhlükəsizliyin, ictimai asayişin, insanların mənəviyyatının, həyat və sağlamlığının, heyvanlar və bitkilər aləminin, ətraf mühitin, xalqların bədii, tarixi və arxeoloji sərvətlərinin qorunması sahəsində tədbirlərin həyata keçirilməsində müvafiq dövlət orqanlarına yardım göstərmək;\nXəzər dənizinin (gölünün) Azərbaycan Respublikasına mənsub olan bölməsində bioloji sərvətlərdən səmərəli istifadə edilməsi və qorunması üzrə dövlət siyasətinin həyata keçirilməsində iştirak etmək, onlar gömrük sərhədindən keçirilərkən qanunvericiliyin tələblərinin yerinə yetirilməsinə nəzarəti təmin etmək;\ninsan alverçilərinin, habelə insan alveri qurbanlarının gömrük sərhədindən keçməsinin qarşısını qanunvericilikdə nəzərdə tutulmuş qaydada almaq;\nAzərbaycan Respublikasında xarici ticarətin gömrük statistikasını və xüsusi gömrük statistikasını beynəlxalq standartlara və təcrübəyə uyğun aparmaq və təkmilləşdirmək;\ngömrük ərazisinə gətirilən mallara münasibətdə istehlakçıların hüquqlarının müdafiəsi üzrə tədbirlərin həyata keçirilməsində müvafiq dövlət orqanlarına yardım göstərmək;\nKomitənin fəaliyyəti ilə əlaqədar insan və vətəndaş hüquqlarının və azadlıqlarının həyata keçirilməsini təmin etmək və onların pozulmasının qarşısını almaq;\ngömrük işini həyata keçirərkən şəxslərin hüquqlarının və maraqlarının qorunması üzrə tədbirlər görmək;\nmilli və xarici valyutanın, digər valyuta sərvətlərinin gömrük sərhədindən müvafiq qanunvericiliyə uyğun olaraq keçirilməsinə nəzarət etmək, habelə qanunla müəyyən edilmiş hallarda valyuta nəzarətini həyata keçirmək, o cümlədən valyuta sərvətlərinin Azərbaycan Respublikasına gətirilməsi və ya Azərbaycan Respublikasından çıxarılması zamanı, cinayət yolu ilə əldə edilmiş pul vəsaitlərinin və ya digər əmlakın leqallaşdırılması və terrorçuluğun maliyyələşdirilməsi izlərini aşkar etdikdə, cinayətin izlərinin qorunması və götürülməsi üçün tədbirlər görmək, əldə olunmuş sənədləri aidiyyəti üzrə cinayət təqibini həyata keçirən orqana göndərmək, habelə bu barədə məlumatı maliyyə monitorinqi orqanına təqdim etmək;\ngömrük işi ilə əlaqədar beynəlxalq müqavilələrin layihələrinin işlənib hazırlanmasında iştirak etmək, bu müqavilələrdə nəzərdə tutulmuş beynəlxalq öhdəliklərin yerinə yetirilməsini təmin etmək;\nqanunvericilikdə nəzərdə tutulmuş qaydada ixrac nəzarətini həyata keçirmək;\n“Kimyəvi silahın hazırlanması, istehsalı, artırılması (yığılması) və tətbiq edilməsinin qadağan olunması və onun məhv edilməsi haqqında” Azərbaycan Respublikasının Qanununa uyğun olaraq kimyəvi maddələr üzrə idxal, ixrac və tranzit əməliyyatlarını həyata keçirən müəssisələrin mərkəzləşdirilmiş qeydiyyatını aparmaq, habelə həmin müəssisələr haqqında illik bəyannamələri hazırlamaq və aidiyyəti üzrə təqdim etmək;[ …","2023"],["Kimlər yaxın qohumlar sayılır gömrük tarifinə uyğun olaraq?","Yaxın qohum – ata, ana, ər (arvad), övlad, baba, nənə, nəvə, qardaş, bacı, övladlığa götürən, övladlığa götürülən, ərin (arvadın) valideyni, qardaşı, bacısı.","2023"],["Müşayiət olunmayan baqaj nədir?","Müşayiət olunmayan baqaj – sərnişinlərə məxsus olan, gömrük sərhədindən nəqliyyat və ya poçt təşkilatı tərəfindən qaimə əsasında keçirilən mallar","2023"],["Müşayiət olunan baqaj nədir?","Müşayiət olunan baqaj – gömrük sərhədindən sərnişinlərin özləri tərəfindən keçirilən mallar;","2023"],["Əlaqəli şəxslər kimlərdi gömrük tarifinə uyğun olaraq?","əlaqəli şəxslər - sövdələşmə iştirakçıları yalnız aşağıdakı hallarda əlaqəli şəxslər hesab edilirlər:\nonlardan biri digərinin biznesində vəzifəli şəxs olduqda;\nonlar biznesdə tərəfdaş olduqda;\nonlar bir-birinə münasibətdə işəgötürən və işçi olduqda;\nhər hansı şəxs onların hər ikisinin nizamnamə kapitalındakı payının və ya dövriyyəyə buraxılmış səs hüququ verən səhmlərinin ən azı 5 (beş) faizinin birbaşa və ya dolayı yolla sahibi olduqda;\nonlardan biri birbaşa və ya dolayı yolla digərinə nəzarət etdikdə;\nonların hər ikisinə birbaşa və ya dolayı yolla üçüncü şəxs tərəfindən nəzarət edildikdə;\nonlar birlikdə birbaşa və ya dolayı yolla üçüncü şəxsə nəzarət etdikdə;\nonlar yaxın qohum olduqda;\nişgüzar fəaliyyətdə bir-biri ilə bağlı olan şəxslərdən biri digərinin yeganə nümayəndəsi, yeganə distribüteri və ya yeganə konsessioneri olduqda, bunun təqdim edilməsi formasından asılı olmayaraq, onlar yuxarıda göstərilən asılılıq meyarlarına uyğun gəldikdə;","2023"],["Ədv nədir?","Əlavə dəyər vergisi vergi tutulan dövriyyədən hesablanan verginin məbləği ilə bu Məcəllənin müddəalarına uyğun olaraq verilən elektron qaimə-fakturalara və ya idxalda ƏDV-nin ödənildiyini göstərən sənədlərə müvafiq surətdə əvəzləşdirilməli olan verginin məbləği arasındakı fərqdir","2023"],["İstehsal itkiləri nədir?","İstehsalat itkiləri — emal məhsulunun istehsalı prosesində əmələ gələn və həmişəlik itirilən materiallar;","2023"],["Dövlət Gömrük Komitəsinin strukturuna daxil olan qurumlar hansılardır?","GÖMRÜK TARİFLƏRİNİN TƏNZİMLƏNMƏSİ VƏ ÖDƏNİŞLƏR BAŞ İDARƏSİ\nGÖMRÜK RİSKLƏRİNİN İDARƏOLUNMASI VƏ AUDİT BAŞ İDARƏSİ\nMALİYYƏ VƏ TƏCHİZAT İDARƏSİ\nİNFRASTRUKTURUN İNKİŞAFI İDARƏSİ\nAVTOMOBİL NƏQLİYYATI İDARƏSİ\nƏMƏLİYYAT VƏ İSTİNTAQ BAŞ İDARƏSİ\nNÖVBƏTÇİ HİSSƏLƏRİN İDARƏEDİLMƏSİ XİDMƏTİ\nBAŞ GÖMRÜK MÜHAFİZƏ XİDMƏTİ\nDÖVLƏT GÖMRÜK KOMİTƏSİ KİNOLOJİ MƏRKƏZİ\nİNZİBATİ İDARƏETMƏNİN TƏŞKİLİ İDARƏSİ\nİDMAN-SAĞLAMLIQ MƏRKƏZİ\nTİBBİ XİDMƏT İDARƏSİ\nMəxfi sənədlərlə iş şöbəsi\nTEXNOLOJİ İNNOVASİYALAR VƏ STATİSTİKA BAŞ İDARƏSİ\nAZƏRBAYCAN RESPUBLİKASI DÖVLƏT GÖMRÜK KOMİTƏSİNİN AKADEMİYASI\nSOSİAL İNNOVASİYALAR VƏ ANALİTİK TƏHLİL İDARƏSİ\nGÖMRÜK SƏRHƏD BURAXILIŞ MƏNTƏQƏLƏRİNİN İŞİNİN TƏŞKİLİ BAŞ İDARƏSİ\n“AZƏRTERMİNALKOMPLEKS” Birliyi\nMƏRKƏZİ GÖMRÜK EKSPERİZASI\nGÖMRÜK NƏZARƏTİNİN TƏŞKİLİ VƏ TİCARƏTİN ASANLAŞDIRILMASI BAŞ İDARƏSİ\nBirbaşa Sədrə tabe olan idarələr:\nKATİBLİK\nDAXİLİ TƏHLÜKƏSİZLİK İDARƏSİ\nBEYNƏLXALQ ƏMƏKDAŞLIQ İDARƏS\nİNSAN RESURSLARI İDARƏSİ\nMƏTBUAT VƏ İCTİMAİYYƏTLƏ ƏLAQƏLƏR İDARƏSİ\nHÜQUQİ TƏMİNAT İDARƏSİ","2023"],["Azərbaycan Respublikasının vətandaşı gələndə şəxsi istifadəsi üçün apardığı əşyaları getirib, bir eded telefon. Hansi kanalda beyan edir?","Ölkdə qeydiyyatdadırsa telefon yaşıl kanal ilə şifahi bəyan edəcək, əgər qeydiyyatda yoxdursa Qırmızı kanal ilə yazılı bəyan edəcək sadələşdirilmiş bəyannamə verərək .","2023"],["Büdcədənkənar inkişaf fondu necə bölünür?","334.1. Gömrük orqanları tərəfindən gömrük işi sahəsində aşkar edilmiş cinayətlər və gömrük qaydaları əleyhinə inzibati xətalar haqqında işlər üzrə məhkəmələrin qərarları əsasında dövlət mülkiyyətinə keçirilmiş malların və nəqliyyat vasitələrinin satışından əldə edilən vəsait, cərimələr və bu Məcəllənin 224.1.5-ci və 224.1.6-cı maddələrində nəzərdə tutulan gömrük ödənişlərinin (bundan sonra – vəsait) 93 faizi müvafiq icra hakimiyyəti orqanının hesabına köçürülür və aşağıdakı məqsədlərə sərf edilir:\n334.1.1. müvafiq icra hakimiyyəti orqanının işçilərinin sosial müdafiəsinin gücləndirilməsinə;\n334.1.2. dövlət büdcəsinə köçürülməklə müvafiq icra hakimiyyəti orqanının xüsusi rütbəsi olan əməkdaşlarının və mülki işçilərinin aylıq vəzifə maaşlarına əlavənin verilməsinə;\n334.1.3. gömrük orqanlarının, müvafiq icra hakimiyyəti orqanının tabeliyində olan qurumların maddi-texniki və sosial bazasının möhkəmləndirilməsinə, habelə gömrük işi sahəsində elmi-texniki potensialın artırılmasına, elmi tədqiqat işlərinin, o cümlədən gömrük tənzimlənməsi vasitələrinin tətbiqi ilə bağlı tədqiqatların aparılmasına, beynəlxalq təcrübədə qəbul olunan yeni metod və üsulların öyrənilməsinə.\n334.2. Bu Məcəllənin 334.1-ci maddəsində nəzərdə tutulmuş vəsaitin 7 faizi dövlət büdcəsinə köçürülür.\n334.3. Bu Məcəllənin 334.1-ci maddəsində nəzərdə tutulmuş vəsaitin bölgüsü və ondan istifadə qaydası Prezident tərəfindən müəyyən olunur.","2023"],["Torba ilə saxta metal pul gəlib poçtla, nə etməlisən?","Qadağan olunmuş mallar gömrük ərazisinə gətirilərkən və ya bu ərazidən aparılarkən müsadirə edilməsi qanunla nəzərdə tutulmamışdırsa, dərhal müvafiq olaraq gömrük ərazisindən çıxarılmalı və ya bu əraziyə qaytarılmalıdır. Həmin mallar onları gömrük sərhədindən keçirən şəxsin hesabına müvafiq olaraq çıxarılır və ya qaytarılır.\nMalları gömrük ərazisindən çıxarmaq və ya bu əraziyə qaytarmaq dərhal mümkün olmadıqda, onlar gömrük orqanlarının müvəqqəti saxlancına verilir. Bu cür malların saxlanc müddətinin son həddi 3 (üç) sutkadır.","2023"],["Ümumdünya Poçt İttifaqının aktlarında nəzərdə tutulmuş sənədlərlə müşayiət olunan beynəlxalq poçt göndərişləri ilə göndərilən mallar üçün bəyannamə tələb olunmurmu?","Xeyir\nÜmumdünya Poçt İttifaqının aktlarında nəzərdə tutulmuş sənədlərlə müşayiət olunan beynəlxalq poçt göndərişləri ilə göndərilən mallar üçün bəyannamə tələb olunmur.\nİstehsal, yaxud kommersiya məqsədləri üçün nəzərdə tutulmayan, Ümumdünya Poçt İttifaqının aktlarında nəzərdə tutulmuş sənədlərlə müşayiət olunan beynəlxalq poçt göndərişləri ilə göndərilən malların gömrük dəyəri bu Qaydaların 2.1.4-cü yarımbəndi ilə müəyyən edilmiş həddən artıq olduqda, həmin mallar üçün gömrük ödənişləri fiziki şəxs tərəfindən poçt rabitəsi operatoruna ödənilir. Poçt rabitəsi operatoru isə həmin ödənişləri bir bank günü müddətində gömrük orqanlarının hesabına köçürür.","2023"],["Beyannamədə 6-cı qrafa nədir? 0 yazıldıqda nəyi bildirir? Hansi mallarda qablashdirma olmur?","Qrafa 6\nQablaşdırmanın ümumi sayı yazılır\nTökülüb doldurula bilən, səpələnib tökülmə və axıcılıq qabiliyyətli yiildər, habelə boru\nkəməri nəqliyyatı, elektrik xətləri vasitəsilə və qalaq halında gömrük sərhəddindən mallar\nkeçirildikdə, bu qrafada «0» rəqəmi yazılır.\nQrafada bəyan olunan malların qablaşdırma növlərində partiyasında yerlərin ümunıi sayı\ngöstəriliır","2023"],["İrandan gələn şəxsi hansi formada sorğu sual edərsən?","Gömrük orqanlarının vəzifəli şəxsləri gömrük ərazisinə daxil olan və ya bu ərazini tərk edən, bu Məcəllədə nəzərdə tutulmuş müvafiq prosedurlardan keçdiyi ərazidə və ya malların müvəqqəti saxlandığı ərazidə olan şəxsləri bu Məcəllənin 92.2.5-ci maddəsinə müvafiq olaraq aşağıdakı məsələlər barədə sorğu-sual etmək hüququna malikdirlər:\nhəmin şəxsdə gömrük ödənişləri ödənilməmiş, gətirilməsi və ya aparılması qanunvericiliklə qadağan edilmiş, yaxud hər hansı digər malların mövcudluğu;\nmalların xassələri, xüsusiyyəti, mənşə ölkəsi, qiyməti, ona mülkiyyət hüququ, nəzərdə tutulan təyinat yeri;\nşəxsin və ya onun təmsil etdiyi idarə, müəssisə və təşkilatın bu Məcəllə ilə müəyyən edilmiş ödənişlər üzrə gömrük borcunun olub-olmaması;\ngömrük borcu mövcuddursa, onun xüsusiyyəti və məbləği.","2023"],["BYD kitabçası nəyi əvəz edir?","Gömrük orqanları tələb etdikləri məlumatların ətraflı qeyd olunduğu və malların daşınması zamanı istifadə olunan Azərbaycan Respublikasının qanunvericiliyində, habelə tərəfdar çıxdığı beynəlxalq müqavilələrdə nəzərdə tutulmuş istənilən kommersiya və ya nəqliyyat sənədini gömrük bəyannaməsi kimi qəbul edir.","2023"],["BYD nədir?","“BYD” — 1975-ci il BYD Konvensiyasının tələblərinə uyğun müəyyən edilmiş qaydalara riayət etməklə, göndərən gömrük orqanından təyinat gömrük orqanına qədər yüklərin daşınmasıdır","2023"],["BYD -da nəqliyyat vasitılırinə texniki cəhətdən tələb var ya yox?","Əvvəlcədən gömrük möhür və plombları altında (ağırçəkili və irihəcmli malların daşınması istisna olmaqla) daşınmaya buraxılmış (icazə verilmiş) yol nəqliyyat vasitələrindən ibarət qatarlarda (karvanlarında) və ya konteynerlərdə daşınmalıdır\nBeynəlxalq yük daşımalarda altı aydan az olmayan təcrübəyə malik olmaq\nHüquqi və fiziki şəxslərə məxsus nəqliyyat vasitələrinə BYD kitabçası təqdim edilməklə gömrük möhürləri və plombları altında yük daşımalarına yararlı olmaları barədə gömrük orqanları tərəfindən şəhadətnamə verildikdən sonra beynəlxalq yük daşımalarına buraxıla bilər.","2023"],["Qaçaqmalçılıq, bir də fiziki şəxs apardığı mədəni sərvəti qaytarmıyıb nə etməlisən?","Mədəniyyət nazirliyinə məlumat verir, cinayət məsuliyyətinə cəlb olunur","2023"],["Nəzarətli göndəriş nədir?","Nəzarətli göndəriş qanunsuz dövriyyəyə daxil edilmiş ayrı-ayrı malların xarici dövlətlərin gömrük və digər səlahiyyətli orqanları ilə razılaşmalara və ya beynəlxalq müqavilələrə uyğun olaraq, əməliyyat-axtarış fəaliyyəti subyektlərinin nəzarəti altında gömrük ərazisinə gətirilməsi, bu ərazidən aparılması və ya tranzitlə keçirilməsi üzrə əməliyyat-axtarış tədbiridir.","2023"],["Ekspertizaya hansı səbəblərə görə göndərilə bilər?","Gömrük ekspertizası mallar üzərində gömrük nəzarəti həyata keçirilərkən və onların gömrük rəsmiləşdirilməsi aparılarkən, habelə malların təsnifatı ilə bağlı məcburi qərarların qəbul edilərkən, bu Məcəllənin 322.1-ci maddəsində(gömrük ekspertizasının aparılmasının məqsədlərini) göstərilənlərin müəyyənləşdirilməsi üçün xüsusi biliklər tələb olunduğu hallarda aparılır.","2023"],["Rüsumsuz, vergisiz gələn sərbəst dövriyyəyə buraxılmış mallar ilə bu qəbildən son istifadədə olan malın fərqi nədir?","Mallar sərbəst dövriyyə üçün gəlirsə rəsmiləşdirilir və gömrük nəzarəti başa çatır. Son istifadədə isə müvafiq hallardan biri baş verənədək(maddə 195) gömrük nəzarəti altında saxlanılır","2023"],["Dərman vasitələri idxal olunarkən tələb olunan sənədlər hansılardır?","Dərman vasitələrinin Azərbaycan Respublikasına idxalına, Azərbaycan Respublikası ərazisində istehsalına, satışına və istifadəsinə yalnız müvafiq icra hakimiyyəti orqanında(SN) dövlət qeydiyyatına alındıqdan sonra yol verilir.\nDövlət qeydiyyatı məqsədi ilə dərman vasitələrinin və həmin dərman vasitələrinin istehsalında istifadə edilən dərman maddəsinin (dərman substansiyasının) nümunələrini Azərbaycan Respublikasının ərazisinə müvafiq icra hakimiyyəti orqanının müəyyən etdiyi miqdarda müvafiq icra hakimiyyəti orqanı, istehsal və ya topdansatış əczaçılıq fəaliyyəti ilə məşğul olan müəssisələr, xarici istehsalçının Azərbaycan Respublikasındakı nümayəndəliyi (filialı) və ya onun müvəkkil etdiyi şəxs idxal edə bilər.\nXarici ölkələrdən humanitar məqsədlər üçün dərman vasitələrinin Azərbaycan Respublikasının ərazisinə idxalı Azərbaycan Respublikasının Səhiyyə Nazirliyi tərəfindən verilən rəy əsasında həyata keçirilir. Müvafiq sənədləri təqdim edirsən.\nAzərbaycan Respublikasının Səhiyyə Nazirliyi təqdim olunmuş sənədlərin ekspertizasının nəticələrinə əsasən xarici ölkələrdən humanitar məqsədlər üçün gətirilən dərman vasitələrinin idxalına rəy verir.\nAzərbaycan Respublikasında dövlət qeydiyyatına alınmayan dərman vasitələrinin ölkəyə humanitar məqsədlər üçün idxalına, onların istehsalçıları tərəfindən təqdim olunan keyfiyyəti təsdiq edən sənədlər olduqda yol verilir.\nAzərbaycan Respublikasının Səhiyyə Nazirliyi tərəfindən keyfiyyətinə təminat verilməyən dərman vasitələrinin humanitar məqsədlər üçün Azərbaycan Respublikasına idxalı qadağandır.\nEpidemiya, təbii fəlakət və digər fövqəladə hallarda Azərbaycan Respublikasında dövlət qeydiyyatına alınmayan dərman vasitələrinin humanitar məqsədlər üçün idxalına istehsalçı ölkələrdə qeydiyyatı və istifadəsini təsdiq edən sənədlər olduqda, Azərbaycan Respublikası Nazirlər Kabinetinin qərarı ilə yol verilir.","2023"],["Normativ hüquqi aktlarla qeyri-normativ hüquqi aktların fərqi nədir?","normativ hüquqi akt – tənzimlənməsi Azərbaycan Respublikasının Konstitusiyası ilə, qanunla və ya fərmanla dövlət orqanının səlahiyyətlərinə aid edilən məsələlər üzrə həmin dövlət orqanı tərəfindən və ya referendum yolu ilə qəbul edilmiş, hamı üçün məcburi davranış qaydalarını əks etdirən, qeyri-müəyyən subyektlər dairəsi üçün və dəfələrlə tətbiq olunmaq üçün nəzərdə tutulmuş müəyyən formalı rəsmi sənəd;\nKonkret (birdəfəlik) təşkilati, nəzarət və ya sərəncamverici tədbirlərin həyata keçirilməsi məqsədi ilə qəbul edilən və ya digər birdəfəlik tətbiq halları üçün nəzərdə tutulan hüquqi aktlar qeyri-normativ hüquqi aktlar sayılır.\nQeyri-normativ hüquqi aktlara aşağıdakılar aiddir:\nAzərbaycan Respublikası Milli Məclisinin qərarları;\nAzərbaycan Respublikası Prezidentinin sərəncamları;\nAzərbaycan Respublikası Nazirlər Kabinetinin sərəncamları;\nvətəndaşlıq vəziyyəti aktlarının dövlət qeydiyyatını həyata keçirən orqanların aktları;\nbu maddənin birinci hissəsinə uyğun olaraq qeyri-normativ hesab edilən digər hüquqi aktlar.\nnormayaratma fəaliyyəti – normativ hüquqi aktların hazırlanması, ekspertizası, qəbul olunması, onlarda dəyişikliklər edilməsi, onların şərh edilməsi, qüvvəsinin dayandırılması və ya ləğv edilməsi üzrə fəaliyyət;","2023"],["Ticarət edən ölkə, tərəfdaş ölkə və göndərən ölkə nədir?","Ərazisindən Azərbaycan Respublikasına mal və nəqliyyat vasitələrinin yola salındığı ilk ölkə göndərən ölkə, xarici ticarət əməliyyatının Azərbaycan Respublikasının rezidenti olmayan tərəfdaşının qeydiyyatda olduğu (yaşadığı) ölkə isə ticarət edən ölkə hesab edilir.\nTərəfdaş ölkə kimi idxalda malın mənşə ölkəsi, ixracda isə malın sonuncu bəlli olan təyinat ölkəsi hesab edilir.\nAşağıdakı hallarda malların idxalı göndərən ölkə üzrə aparılır:\nmənşə ölkəsi bəlli olmayan mallar üçün;\n“təkrar idxal” gömrük proseduru altında yerləşdirilən mallar üçün;\nXİFMN üzrə mal mövqeyinin 97-ci mal qrupuna (İncəsənət əsərləri, kolleksiya əşyaları və antikvariat) daxil edilən mallar üçün.\nMalın mənşə ölkəsi və göndərən ölkə məlum olmadıqda, malın idxalı ticarət edən ölkə üzrə aparılır.\nMalın təyinat ölkəsi məlum olmadıqda, malın ixracı ticarət edən ölkə üzrə aparılır.","2023"],["Konstitusiyada hansı hüquqdan istifadə edirsen müsahibəyə qələrək?","Əmək hüququ\nMüraciət hüququ\nDövlətin idarə olunmasında iştirak etmək hüququ","2023"],["Təqsirsizlik prezumpsiyası nədir?","Maddə 63. Təqsirsizlik prezumpsiyası\nI. Hər kəsin təqsirsizlik prezumpsiyası hüququ vardır. Cinayətin törədilməsində təqsirləndirilən hər bir şəxs, onun təqsiri qanunla nəzərdə tutulan qaydada sübuta yetirilməyibsə və bu barədə məhkəmənin qanuni qüvvəyə minmiş hökmü yoxdursa, təqsirsiz sayılır.\nII. Şəxsin təqsirli olduğuna əsaslı şübhələr varsa, onun təqsirli bilinməsinə yol verilmir.\nIII. Cinayətin törədilməsində təqsirləndirilən şəxs özünün təqsirsizliyini sübuta yetirməyə borclu deyildir.\nIV. Ədalət mühakiməsi həyata keçirilərkən qanunu pozmaqla əldə edilmiş sübutlardan istifadə oluna bilməz.\nV. Məhkəmənin hökmü olmasa, kimsə cinayətdə təqsirli sayıla bilməz.","2023"],["Xüsusi gömrük proseduru ilə ümum gömrük prosedurunun fərqi nədir?","Ümumi gömrük prosedurlarından fərqli olaraq xüsusi gömrük prosedurları uzunmüddətli gömrük nəzarəti tələb edir","2023"],["Daxili mallar gömrük anbarında necə yerləşdirilir?","Daxili mallar saxlanc xüsusi gömrük proseduru altında aşağıdakı hallarda yerləşdirilə bilər:\ndaxili malların ölkə ərazisindən ixrac olunması nəzərdə tutulduqda;\ndaxili mallar daxili tranzit xüsusi gömrük proseduru altında yerləşdirildikdə.\nDaxili malların saxlanc xüsusi gömrük proseduru altında yerləşdirilməsi aşağıdakı şərtlər əsasında həyata keçirilir:\ndaxili mallar yalnız gömrük anbarı xüsusi gömrük proseduru altında yerləşdirilir;\ndaxili mallar ixrac olunduğu halda kağız üzərində yazılı və ya elektron formada ixrac bəyannaməsi, daxili tranzit xüsusi gömrük proseduru altında yerləşdirildiyi halda isə bu prosedur üçün müvafiq icazə gömrük orqanına təqdim edilir.\nDaxili malların gömrük anbarında saxlancı gömrük orqanının icazəsi əsasında həyata keçirilir.\nGömrük anbarının sahibi tərəfindən daxili malların gətirildiyi barədə gömrük orqanına məlumat verildikdən sonra və onlar gömrük anbarında yerləşdirilənədək nəqliyyat vasitələrinin dayanacaq yerinin dəyişdirilməsi, malların boşaldılması və yenidən yüklənməsi, qabların açılması, malların qablaşdırılması, eyniləşdirmə vasitələrinin dəyişdirilməsi, çıxarılması və ya məhv edilməsi yalnız gömrük orqanının icazəsi və nəzarəti altında həyata keçirilir","2023"],["Referendum yolu ilə hansı məsələlər həll edilir?","Maddə 3. Ümumxalq səsverməsi - referendum yolu ilə həll edilən məsələlər\nI. Azərbaycan xalqı öz hüquqları və mənafeləri ilə bağlı olan hər bir məsələni referendumla həll edə bilər.\nII. Aşağıdakı məsələlər yalnız referendumla həll oluna bilər:\n1) Azərbaycan Respublikası Konstitusiyasının qəbul edilməsi və ona dəyişikliklər edilməsi;\n2) Azərbaycan Respublikasının dövlət sərhədlərinin dəyişdirilməsi.\nIII. Aşağıdakı məsələlər üzrə referendum keçirilə bilməz:\n1) vergilər və dövlət büdcəsi;\n2) amnistiya və əfv etmə;\n3) seçilməsi, təyin edilməsi və ya təsdiq edilməsi müvafiq olaraq qanunvericilik və (və ya) icra hakimiyyəti orqanlarının səlahiyyətlərinə aid edilmiş vəzifəli şəxslərin seçilməsi, təyin edilməsi və ya təsdiq edilməsi.","2023"],["Milli Məclisin 83 deputatının səlahiyyəti təsdiq edilməsə nə olacaq?","Azərbaycan Respublikasının Milli Məclisi hər il iki növbəti yaz və payız sessiyalarına yığılır. Azərbaycan Respublikası Milli Məclisinin 83 deputatının səlahiyyətləri təsdiq edildikdən sonra Azərbaycan Respublikası Milli Məclisinin ilk iclası həmin gündən başlayaraq bir həftədən gec olmayaraq çağırılır. Azərbaycan Respublikasının Milli Məclisinə seçkilərdən sonra martın 10-dək onun 83 deputatının sәlahiyyәtlәri təsdiq edilməzsə, Azərbaycan Respublikası Milli Məclisinin ilk iclasının keçirilmə vaxtını Azərbaycan Respublikasının Konstitusiya Məhkəməsi müəyyən edir.","2023"],["Milli Məclisin deputatlarının toxunulmazlığının itirilməsi,Baş prokuror Milli Məclisə ne verir?","Azərbaycan Respublikası Milli Məclisinin deputatının toxunulmazlığına yalnız Azərbaycan Respublikası Baş prokurorunun təqdimatına əsasən Azərbaycan Respublikası Milli Məclisinin qərarı ilə xitam verilə bilər.","2023"],["Konstitusya qanunlari hansidir?","Ali hüquqi qüvvəyə malikdir. Onların içərisində ilk növbədə əsas insan və vətəndaş hüquq və azadlıqlarını təsbit edən, ictimai quruluşun əsaslarını, dövlətin formasını tənzimləyən dövlət orqanlarının təşkili və fəaliyyətinin prinsiplərini müəyyən edən konstitusiya adlananları qeyd etmək lazımdır. Bəzən onu əsas qanun adlandırırlar. AR konstitusiyasına MM-in 95 səs çoxluğu ilə qəbul etdiyi məsələlərdir.\nMaddə 23. Azərbaycan dövlətinin rəmzləri Azərbaycan Respublikası Dövlət bayrağının və Azərbaycan Respublikası Dövlət gerbinin təsviri, Azərbaycan Respublikası Dövlət himninin musiqisi və mətni Konstitusiya qanunu ilə müəyyən edilir\nMaddə 93. Azərbaycan Respublikası Milli Məclisinin aktları Azərbaycan Respublikasının Milli Məclisi öz səlahiyyətlərinə aid məsələlər üzrə Konstitusiya qanunları, qanunlar və qərarlar qəbul edir. Maddə 94. Azərbaycan Respublikası Milli Məclisinin müəyyən etdiyi ümumi qaydalar-a Konstitusiya qanunu ilə əlavələr edilə bilər. Maddə 95. Azərbaycan Respublikası Milli Məclisinin həll etdiyi məsələlər-ə Konstitusiya qanunu ilə əlavələr edilə bilər. Maddə 108. Azərbaycan Respublikası Prezidentinin təminatı Əvvəllər Azərbaycan Respublikası Prezidenti seçilmiş şəxsin təminatı qaydaları Konstitusiya qanunu ilə müəyyən edilir. Maddə 110. Qanunların imzalanması Konstitusiya qanunları Azərbaycan Respublikasının Prezidenti tərəfindən imzalanmazsa, qüvvəyə minmir. Azərbaycan Respublikasının Milli Məclisi 83 səs çoxluğu ilə qəbul edilən qanunları 95 səs çoxluğu ilə, 63 səs çoxluğu ilə qəbul edilən qanunları isə 83 səs çoxluğu ilə yenidən qəbul edirsə, belə qanunlar təkrar səsvermədən sonra qüvvəyə minir. Maddə 134. Naxçıvan Muxtar Respublikasının statusu Naxçıvan Muxtar Respublikasının Konstitusiyası Azərbaycan Respublikasının Milli Məclisinə Azərbaycan Respublikasının Prezidenti tərəfindən təqdim edilir və Konstitusiya qanunu ilə təsdiq edilir. Maddə 149. Normativ hüquqi aktlar Normativ hüquqi aktların dərc edilməsi qaydası Konstitusiya qanunu ilə müəyyən edilir. Maddə 156. Azərbaycan Respublikasının Konstitusiyasına əlavələrin qəbul edilməsi qaydası I. Azərbaycan Respublikası Konstitusiyasına əlavələr Azərbaycan Respublikasının Milli Məclisində 95 səs çoxluğu ilə Konstitusiya qanunları şəklində qəbul edilir. II. Azərbaycan Respublikasının Konstitusiyasına əlavələr haqqında Konstitusiya qanunları Azərbaycan Respublikasının Milli Məclisində iki dəfə səsə qoyulur. İkinci səsvermə birinci səsvermədən 6 ay sonra keçirilir. III. Azərbaycan Respublikasının Konstitusiyasına əlavələr haqqında Konstitusiya qanunları həm birinci, həm də ikinci səsvermədən sonra bu konstitusiyada qanunlar üçün nəzərdə tutulmuş qaydada Azərbaycan Respublikası Prezidentinə imzalanmaq üçün təqdim olunur. IV. Azərbaycan Respublikasının Konstitusiyasına əlavələr haqqında Konstitusiya qanunları Azərbaycan Respublikasının Prezidenti tərəfindən ikinci səsvermədən sonra imzalandıqda qüvvəyə minir. V. Konstitusiya qanunları Azərbaycan Respublikası Konstitusiyasının ayrılmaz hissəsidir və Azərbaycan Respublikası Konstitusiyasının əsas mətninə zidd olmamalıdır.","2023"],["Əmr hansı hissələrdən ibarətdir?","Şərh və sərəncam","2023"],["Mərkəzləşdirilmemiş sistem (Kargüzarlıq)","Strukturu mürəkkəb, sənəd dövriyyəsi isə ildə 25000 sənəddən çox olan, habelə struktur bölmələri ayrı-ayrı ərazilərdə yerləşən təşkilatlarda Mərkəzləşdirilməmiş kargüzarlıq sistemində isə sənədlərin və qeydə alınması tələb olunmayan korrespondensiyanın qəbulunu, göndərilməsini, uçotunu, sənədlərin struktur bölmələrinə paylanmasını kargüzarlıq xidməti, sənədlərin qeydə alınmasını, rəsmiləşdirilməsini, işlərin formalaşdırılmasını isə struktur bölmələri həyata keçirirlər.","2023"],["Mərkəzləşdirilmiş sistem (Kargüzarlıq)","Struktur bölmələrinin sayı az, sənəd dövriyyəsi isə ildə 25000 sənədə qədər olan təşkilatlarda Mərkəzləşdirilmiş kargüzarlıq sistemində sənədlərin və qeydə alınması tələb olunmayan korrespondensiyanın qəbulunu(məktubların gətirildiyi qutu), göndərilməsini, uçotunu, struktur bölmələrinə paylanmasını, habelə sənədlərin qeydə alınmasını, rəsmiləşdirilməsini, işlərin formalaşdırılmasını kargüzarlıq xidməti həyata keçirir.","2023"],["Sənədlərin ölçüsü haqqında (Kargüzarlıq)","Kompüter(Makina) üsulu ilə hazırlanan sənədlərə olan tələblər:\nSənədlərin kompüter üsulu ilə hazırlanması 6.38-90 dövlətlərarası standartın tələbinə uyğun surətdə həyata keçirilir. Kompyuter üsulu ilə yazılan sənədlərin (maliyyə, statistik və digər cədvəllər istisna olmaqla) mətni “Arial” 12 şrifti ilə A4 formatda bir və ya bir yarım sətirarası intervalla yazılmalıdır.\n►Sənədlər çap olunarkən vərəqdə aşağıda göstərilən qədər sahələr saxlanılır:\n-soldan - 25 mm;\n-sağdan - ən azı 8 mm;\n-yuxarıdan - 20 mm; - azı 19 mm; -A5 formatı kağızlar üçün - azı 16 mm. A5 formatlı sənədlərin mətni bir sətirarası intervalla\n-aşağıdan: -A4 formatı kağızlar üçün, mətbəə üsulu ilə nəşr edilən sənədlərin mətni iki sətirarası intervalla, qalan sənədlərin mətni isə bir yarım sətirarası intervalla çap edilir.\nSənədin hər abzasının birinci sətri sol sahənin hüdudundan beş-səkkiz çap işarəsi intervalı ilə çap edilir.","2023"],["Azərbaycan Respublikası Milli Məclisi deputatlığından çıxanların yerinə seçkilər hansı halda keçirilmir?","Azərbaycan Respublikası Milli Məclisi deputatlığından çıxanların yerinə seçkilər Azərbaycan Respublikası Milli Məclisinin səlahiyyət müddətinin bitməsinə 120 gündən az müddət qalarsa, keçirilmir.","2023"],["Loyallıq nədir?","Dövlət qulluqçusu onun xidməti vəzifəsinə aid olmadığı hallarda, dövlət orqanlarının, onların rəhbərlərinin fəaliyyəti ilə əlaqədar (qanunsuz fəaliyyət istisna olmaqla) tənqidi ictimai mülahizələrdən, çıxışlardan və onların fəaliyyətinə ictimai qiymət verilməsindən çəkinməlidir. Bu qayda dövlət qulluqçusunun elmi-pedaqoji fəaliyyəti ilə bağlı çıxışlarına və ya elmi yazılarına şamil olunmur.\nDövlət qulluqçusu dövlət qulluğu ilə bağlı vəzifələrin icrası ilə bir araya sığmayan və onun adına xələl gətirə biləcək, habelə dövlət orqanının nüfuzunu aşağı sala biləcək hərəkətlərə yol verməməlidir.\nDövlət qulluqçusu dövlət orqanı tərəfindən açıq çıxışlarla bağlı müəyyən olunmuş qaydalara əməl etməlidir.\nDövlət qulluqçusu qanunvericilikdə dövlət qulluğu ilə bağlı nəzərdə tutulmuş məhdudiyyətlərə əməl etməlidir.","2023"],["DGK hansı hakimiyyət növünə aiddir?","İcra Hakimiyyəti növünə","2023"],["Gömrük orqanlarında xidmət nədir?","Gömrük orqanlarında xidmət - Azərbaycan Respublikasının hüquq mühafizə orqanları sisteminə daxil olan gömrük orqanlarının vəzifə, funksiya və hüquqlarını öz peşəkar fəaliyyətləri ilə həyata keçirən Azərbaycan Respublikası vətəndaşlarının (bundan sonra “vətəndaşlar” adlanacaq) dövlət qulluğunun xüsusi növüdür.","2023"],["Dövlət qulluğu nədir və prinsipləri hansılardır?","Dövlət qulluğu Azərbaycan Respublikasının Konstitusiyasına və digər qanunvericilik aktlarına uyğun olaraq dövlətin məqsədlərinin və funksiyalarının həyata keçirilməsi sahəsində dövlət qulluqçularının öz vəzifə səlahiyyətlərini yerinə yetirməsidir.\nDövlət qulluğu aşağıdakı prinsiplərə əsaslanır:\nqanunçuluq;\nAzərbaycan Respublikasında qanunvericilik, icra və məhkəmə hakimiyyəti orqanlarının səlahiyyət hüdudlarının müəyyən edilməsi;\ndövlət orqanlarına və dövlət qulluqçularına nəzarət və onların hesabat verməsi;\nyuxarı dövlət orqanlarının və vəzifəli şəxslərin öz səlahiyyətləri hüdudlarında qəbul etdikləri qərarların aşağı dövlət orqanları və vəzifəli şəxslər tərəfindən mütləq yerinə yetirilməsi;\nbütün vətəndaşların və vəzifəli şəxslərin dövlət qulluqçularının qanuni tələblərini icra etməyə və qanuni hərəkətlərini müdafiə etməyə borclu olması;\ndövlət qulluğuna qəbulun şəffaflığı;\nvətəndaşların dövlət qulluğuna müsabiqə və müsahibə əsasında qəbul edilməsi;\nvətəndaşların öz qabiliyyətlərinə, xidməti nailiyyətlərinə və peşə hazırlığına uyğun olaraq dövlət qulluğunun hər hansı vəzifəsini tutmaqda hüquq bərabərliyi;\nirqindən, etnik mənsubiyyətindən, dinindən, dilindən, cinsindən, sosial mənşəyindən, ailə, əmlak və qulluq vəziyyətindən, yaşayış yerindən, əqidəsindən, ictimai birliklərə mənsubiyyətindən, habelə qulluqçuların işgüzarlıq keyfiyyətlərinə dəxli olmayan başqa səbəblərdən asılı olmayaraq dövlət qulluqçularının hüquq bərabərliyi;\ndövlət qulluqçularının potensialının səmərəli istifadəsi, xidməti və peşəkarlıq səviyyəsinin artırılması məqsədilə onların rotasiyası;\ndövlət qulluqçularının sosial və hüquqi müdafiəsi, onların özləri və ailələri üçün ləyaqətli yaşayış səviyyəsinin təmin edilməsi;\nqulluq borcunun yerinə yetirilməsi üçün dövlət qulluqçusunun cavabdehlik daşıması, eləcə də dövlət qulluqçusunun hərəkətlərinə görə dövlət orqanının cavabdehlik daşıması.","2023"],["Gömrük təminatının pozulduğunu gördükdə nə etməlisən, prosedur necə olmalıdır?","Gömrük yoxlaması keçirilməlidir ,qanun pozuntusu (malların sayı tutushmamadiqda,mallar dəyişdirildikdə, mallar olmadiqda və sarə) aşkar olunduqda təhqiqata veriləcək, qanun pozuntusu olmadıqda akt tertib olunacaq yenidən plomblanacaq.","2023"],["Vətəndaşların müraciəti nə vaxt baxılmır və neçə iş gününə cvb verilir?","Müraciət aşağıdakı hallarda baxılmamış saxlanılır:\nbu Qanunun 5-ci maddəsinə uyğun olaraq müraciətin edilməsi və ona baxılması üçün başqa qayda nəzərdə tutulduqda;\nmüraciət bu Qanunun 6.4-6.9-cu maddələrində göstərilən tələblərə cavab vermədikdə;\nmüraciətdə göstərilən məsələ ilə əlaqədar məhkəmənin qanuni qüvvəyə minmiş qərarı olduqda;\nvətəndaşın təkrar müraciətlərinə bir il ərzində 3 dəfə mahiyyəti üzrə əsaslandırılmış cavab verildikdə və təkrar müraciətdə məsələnin həlli üçün yeni məlumatlar olmadıqda;\nbu Qanunun 7.9-cu maddəsində göstərilən hallarda müraciətin aidiyyəti üzrə göndərilməsi mümkün olmadıqda və ya müraciətdə olan məlumatlar onun həlli və ya aidiyyəti üzrə göndərilməsi üçün kifayət etmədikdə;\nmüraciət etmiş şəxs bu Qanunun 14.0.2-ci maddəsinə uyğun olaraq ərizə ilə müraciət etdikdə.\nBu Qanunun 8.1-ci maddəsində göstərilən hallarda müraciətə baxan subyekt və ya onun vəzifəli şəxsi müraciət edən şəxsə səbəblər göstərilməklə müraciətin (anonim müraciət istisna olmaqla) baxılmamış saxlanılması barədə beş iş günündən gec olmayaraq, şifahi müraciətin baxılmamış saxlanılması üçün əsas olduqda isə dərhal məlumat verir.\nMüraciətin baxılmamış saxlanmasına əsas verən hallar aradan qaldırıldıqda müraciətə baxan subyekt ona baxılmanı təmin etməlidir.","2023"],["Korrupsiya nədir?","Korrupsiya - vəzifəli şəxslərin öz statusundan, təmsil etdiyi orqanın (qurumun) statusundan, vəzifə səlahiyyətlərindən və ya həmin status və səlahiyyətlərdən irəli gələn imkanlardan istifadə etməklə qanunsuz olaraq maddi və sair nemətlər, imtiyazlar və ya güzəştlər əldə etməsi, habelə fiziki və hüquqi şəxslər tərəfindən qeyd edilən maddi və sair nemətlərin, imtiyazların və ya güzəştlərin qanunsuz olaraq vəzifəli şəxslərə təklif və ya vəd olunması və yaxud verilməsi yolu ilə həmin vəzifəli şəxslərin ələ alınmasıdır.","2023"],["Korrupsiyanın subyektləri kimlərdi?","Azərbaycan Respublikasının Konstitusiyası və qanunları ilə müəyyən olunmuş qaydada dövlət orqanlarına seçilmiş və ya təyin edilmiş şəxslər;\nxüsusi səlahiyyət əsasında dövlət orqanlarını təmsil edən şəxslər;\ninzibati vəzifə tutan dövlət qulluqçuları;\ndövlət orqanlarının müvafiq struktur vahidlərində, dövlət idarə, müəssisə və təşkilatlarında, habelə dövlətin nəzarət səhm zərfinə sahib olduğu təsərrüfat subyektlərində təşkilati-sərəncamverici və ya inzibati-təsərrüfat funksiyalarını həyata keçirən şəxslər;\nAzərbaycan Respublikasının dövlət orqanlarında seçkili vəzifələrə namizədliyi qanunla müəyyən olunmuş qaydada qeydə alınmış şəxslər;\nAzərbaycan Respublikasının qanunvericiliyi ilə müəyyən edilmiş qaydada yerli özünüidarəetmə orqanlarına seçilmiş şəxslər;\nyerli özünüidarəetmə orqanlarında təşkilati-sərəncamverici və ya inzibati-təsərrüfat funksiyalarını həyata keçirən şəxslər;\nqurumların rəhbərləri və işçiləri, o cümlədən qurumlarda xüsusi səlahiyyət üzrə təşkilati-sərəncamverici və ya inzibati-təsərrüfat funksiyalarını həyata keçirən şəxslər;[ \\]](https://www.e-qanun.az/framework/5809#_edn4)\nqanunla müəyyən edilmiş hallarda dövlət orqanlarının səlahiyyətlərini yerinə yetirən qeyri-dövlət orqanlarında təşkilati-sərəncamverici və ya inzibati-təsərrüfat funksiyalarmı həyata keçirən şəxslər;\nöz nüfuzundan və ya əlaqələrindən istifadə edərək vəzifəli şəxsin qərarına qanunsuz təsir göstərmək müqabilində maddi və sair nemətlər, imtiyazlar və ya güzəştlər əldə edən şəxslər;\nvəzifəli şəxsə qanunsuz olaraq maddi və sair nemətlər, imtiyazlar və ya güzəştlər təklif edən və ya vəd edən, yaxud verən fiziki və hüquqi şəxslər və ya belə hərəkətlərdə vasitəçilik etmiş şəxslər.\nBu Qanunun 1-9 cu bəndlərdə göstərilənlər bu Qanunun məqsədi üçün vəzifəli şəxs hesab edilirlər.","2023"],["Korrupsiyanın təsnifatı hansılardır?","Korrupsiya ilə əlaqədar hüquqpozmalar bilavasitə korrupsiya hüquqpozmalarından və korrupsiyaya şərait yaradan hüquqpozmalardan ibarətdir.\nKorrupsiya hüquqpozmaları aşağıdakılardır:\nvəzifəli şəxsin xidməti vəzifəsinin (səlahiyyətlərinin) icrası ilə əlaqədar hər hansı hərəkətin edilməsi və ya belə hərəkətin edilməsindən imtina olunması müqabilində özü və yaxud üçüncü şəxslər üçün birbaşa və ya dolayı yolla maddi və sair nemətlər, imtiyazlar və ya güzəştlər tələb etməsi, əldə etməsi və ya belə maddi və sair nemətlərin, imtiyazların və ya güzəştlərin verilməsi ilə bağlı təklifi və ya vədi qəbul etməsi;\nxidməti vəzifəsinin (səlahiyyətlərinin) icrası ilə əlaqədar hər hansı hərəkətin edilməsi və ya belə hərəkətin edilməsindən imtina olunması müqabilində vəzifəli şəxsə onun özü və ya üçüncü şəxslər üçün fiziki və ya hüquqi şəxs tərəfindən birbaşa və ya dolayı yolla maddi və sair nemətlər, imtiyazlar və ya güzəştlər təklif olunması, vəd edilməsi və ya verilməsi;\nvəzifəli şəxs tərəfindən xidməti vəzifəsinin (səlahiyyətlərinin) icrası ilə əlaqədar hər hansı hərəkətin edilməsi və ya belə hərəkətin edilməsindən imtina olunması müqabilində qanunsuz olaraq alınmış əmlakdan özü və ya üçüncü şəxslər üçün mənfəət əldə etmək məqsədilə istifadə edilməsi;\nvəzifəli şəxs tərəfindən xidməti vəzifəsinin (səlahiyyətlərinin) icrası ilə əlaqədar maddi və sair nemətləri, imtiyazları və ya güzəştləri haqqı ödənilmədən və ya bazar qiymətlərindən və ya dövlət tərəfindən tənzimlənən qiymətlərdən aşağı qiymətə (tarifə) əldə edilməsi;\nvəzifəli şəxsin xidməti vəzifəsinin (səlahiyyətlərinin) icrası ilə əlaqədar əmanətlərdən (depozitlərdən), qiymətli kağızlardan, rentadan, royaltidən və ya icarədən Azərbaycan Respublikasının qanunvericiliyinə zidd olaraq gəlir götürməsi;\nmüəyyən mükafat müqabilində vəzifəli şəxsin qərarına qanunsuz təsir göstərmək imkanına malik olduğunu bildirən hər hansı şəxsə birbaşa və ya dolayı yolla maddi və sair nemətlərin, imtiyazların və ya güzəştlərin təklif olunması, vəd edilməsi və ya verilməsi;\nmüəyyən mükafat müqabilində vəzifəli şəxsin qərarına qanunsuz təsir göstərmək imkanına malik olduğunu bildirən şəxs tərəfindən maddi və sair nemətlərin, imtiyazların və ya güzəştlərin qəbul edilməsi və ya belə maddi və sair nemətlərin, imtiyazların və ya güzəştlərin verilməsi ilə bağlı təklifin və ya vədin qəbul edilməsi.\nVəzifəli şəxsin aşağıdakı hərəkətləri korrupsiyaya şərait yaradan hüquqpozmalar sayılır:\nxidməti vəzifəsini (səlahiyyətlərini) icra etdiyi dövrdə elmi, pedaqoji və yaradıcılıq fəaliyyəti istisna olmaqla, digər ödənişli vəzifə tutmaq və ya fəaliyyət növü ilə məşğul olmaq;\nstatusundan, təmsil etdiyi orqanın (qurumun) statusundan, vəzifə səlahiyyətlərindən və ya həmin status və səlahiyyətlərdən irəli gələn imkanlardan istifadə etməklə maddi və sair nemətlərin, imtiyazların və ya güzəştlərin əldə edilməsi məqsədilə fiziki və hüquqi şəxslərə sahibkarlıq fəaliyyətini həyata keçirməkdə, eləcə də subsidiyalar, subvensiyalar, dotasiyalar, kreditlər və digər güzəştlər alınmasında qanunsuz kömək etmək;\nbilavasitə, başqa və ya uydurma şəxslər vasitəsilə sahibkarlıq fəaliyyəti ilə məşğul olmaq, əvəzçilik üzrə işləmək (elmi, pedaqoji və yaradıcılıq fəaliyyəti istisna olmaqla), habelə sahibkarlıq fəaliyyətini həyata keçirən təsərrüfat subyektlərinin və maliyyə-kredit müəssisələrinin icra orqanlarının tərkibinə daxil olmaq;\nstatusundan, təmsil etdiyi orqanın (qurumun) statusundan, vəzifə səlahiyyətlərindən və ya həmin status və səlahiyyətlərdən irəli gələn imkanlardan istifadə etməklə onun səlahiyyət dairəsinə daxil olmayan məsələlər üzrə digər dövlət orqanlarının, yerli özünüidarəetmə orqanlarının və ya qurumların fəaliyyətinə qanunsuz müdaxilə etmək;\nstatusundan, təmsil etdiyi orqanın (qurumun) statusundan, vəzifə səlahiyyətlərindən və ya həmin status və səlahiyyətlərdən irəli gələn imkanlardan istifadə etməklə şəxsi maraqlarına aid məsələlərin həllinə təsir etmək;\nnormativ hüquqi aktların və digər qərarların qəbul edilməsi zamanı fiziki və ya hüquqi şəxslərə onların təyinatına uyğun olmayan üstünlüklər vermək;\nvəzifə tutduğu və ya ona tabe olan, onun nəzarətində olan, habelə ona hesabat verən orqanların (qurumların) işi üzrə fiziki və ya hüquqi şəxslərin nümayəndəsi qismində iştirak etmək;\nqanunla və ya digər normativ hüquqi aktlarla verilməsi nəzərdə tutulmuş məlumatların fiziki və ya hüquqi şəxslərə verilməsindən əsassız imtina etmək, belə məlumatların verilməsini gecikdirmək və yaxud natamam və ya təhrif olunmuş məlumatlar vermək;\nqanunla və ya digər normativ hüquqi aktlarla verilməsi nəzərdə tutulmayan məlumatları və sənədləri fiziki və hüquqi şəxslərdən tələb etmək;\ndövlət orqanlarının, yerli özünüidarəetmə orqanlarının və ya qurumların maddi və maliyyə vəsaitlərini qanunsuz olaraq namizədlərin, qeydə alınmış namizədlərin, siyasi partiyaların, siyasi partiya bloklarının, referendum üzrə təşəbbüs qruplarının seçki fonduna vermək;\nqanunvericiliklə başqa hal nəzərdə tutulmamışdırsa, dövlət fondlarına, dövlət …","2023"],["Mal müvəqqəti saxlancda olanda rüsum 15 faiz idi.Qanun dəyişdi 0% oldu. malı sərbəst dövriyyəyə buraxsan hansı faizlə rüsum tutmalısan?","15% ilə\nGömrük rüsumlarının və yığılması gömrük orqanlarına həvalə edilmiş vergilərin hesablanması idxal olunan mallara münasibətdə gömrük sərhədini keçən gündən, ixrac olunan mallara münasibətdə isə, mallara dair bəyannamənin təqdim olunduğu gündən başlanır və həmin gün qüvvədə olan gömrük rüsumları və vergilərin dərəcələri əsas götürülür.","2023"],["Dövlət Gömrük Komitəsi haqqında danışın.","DGK-Azərbaycan Respublikasının gömrük siyasətini həyata keçirən mərkəzi icra hakimiyyəti orqanıdır.\nAzərbaycan Respublikası öz suverenliyini bərpa etdikdən sonra 1992-ci il yanvarın 30-da Azərbaycan Respublikası Gömrük Komitəsi yaradıldı.\nNaxçıvan Muxtar Respublikası Ali Məclisinin 24 fevral 1992-ci il tarixli qərarı ilə Naxçıvan MR Gömrük Komitəsinin yaradıldı və beləliklə, əsl milli gömrük xidmətinin formalaşdırılması istiqamətində mühüm addım atıldı.\n1993-cü ildə xalqın təkidli tələbi ilə respublika rəhbərliyinə gələn Ulu Öndər Heydər Əliyev müstəqil Azərbaycanın yeni inkişaf mərhələsinin əsasını qoydu.\n1995-ci ilin yanvar ayında Azərbaycan Respublikası Prezidenti yanında geniş tərkibdə keçirilən müşavirədə Dövlət Gömrük Komitəsinin fəaliyyəti müzakirə edildi. Dövlət Gömrük Komitəsinin fəaliyyətini və yol verilmiş nöqsanları hərtərəfli təhlil edən Azərbaycan Prezidenti Heydər Əliyev öz tövsiyələrini verərək qeyd etdi ki, \"biz elə bir gömrük orqanı yaratmalıyıq ki, o, xarici- iqtisadi əlaqələrimizdə öz yerini tutsun, iqtisadiyyatımızın inkişafına xidmət etsin, bütün hallarda müstəqil Azərbaycanın nüfuzunun yüksəldilməsinə öz töhfəsini versin\".\n1995-ci il yanvar ayının 17-də Azərbaycan Respublikası Prezidentinin Fərmanı ilə Kəmaləddin Fəttah oğlu Heydərov Dövlət Gömrük Komitəsinin sədri təyin edilmişdir.\nPrezident Heydər Əliyevin sərəncamına əsasən, 1997-ci ildən etibarən 30 yanvar tarixinin gömrükçülərin peşə bayramı günü kimi qeyd edilməsi Ulu Öndərin bu orqanın fəaliyyətinə verdiyi çox yüksək qiymətin, diqqət və qayğının bariz təzahürü idi. Azərbaycanda gömrük işinin möhkəm təməllər üzərində inkişafına böyük məsuliyyət hissə ilə yanaşan və bu sistemin təkamül yolu ilə dünya standartları səviyyəsinə çatdırılmasının vacibliyini başa düşən Dövlət Gömrük Komitəsinin ən sıravi əməkdaşından rəhbərliyə qədər hər birinin gərgin əməyi və xidmətləri danılmazdır.\nAzərbaycan Gömrük Xidməti mükəmməl hüquqi bazaya, inkişaf etmiş infrastruktura malik olmaqla, ölkənin quru, hava və dəniz yollarında respublikanın iqtisadi mənafeyini və təhlükəsizliyini qoruyur, qaçaqmalçılığa qarşı qətiyyətlə mübarizə aparır.\nÖz fəaliyyətini müasir dövrün tələbləri səviyyəsində qurmağa çalışan Dövlət Gömrük Komitəsi son illər xarici ölkələrin gömrük orqanları ilə işgüzar əlaqələr yaratmaqla əməkdaşlığı genişləndirmiş, dünyanın qabaqcıl ölkələrinin təcrübələrindən bəhrələnməklə milli gömrük qanunvericiliyinin tələblərinə uyğun respublikamızın iqtisadi təhlükəsizliyinin, suverenliyinin və maraqlarının qorunmasında, Azərbaycan iqtisadiyyatının dünya təsərrüfatına inteqrasiyasında, iqtisadi islahatların dərinləşdirilməsində, dövlət büdcəsinin gəlirlər hissəsinin formalaşdırılmasında mühüm rol oynayır. Nəticə etibarilə, gömrük siyasəti xarici əlaqələrdə öz əksini taparaq iqtisadiyyatın möhkəmlənməsinə və genişlənməsinə xidmət edir. Dünyanın inkişaf etmiş ölkələrin gömrük orqanları və aidiyyəti beynəlxalq təşkilatları ilə qarşılıqlı faydalı əməkdaşlıq Azərbaycan gömrük sisteminin uğurlu gələcəyindən xəbər verir. Azərbaycan Respublikası Dövlət Gömrük Komitəsi Ümumdünya Gömrük Təşkilatına 1992-ci ilin iyun ayından üzv qəbul edilmişdir. Eyni zamanda, Dövlət Gömrük Komitəsi 1999-cu ildən ÜGT-nin Maliyyə Komitəsində, 2000-ci ildən isə ÜGT-nin ali orqanı-Siyasi Komissiyasında, 2002-ci ildən isə Gömrük Əməkdaşlıq Komitəsində təmsil olunmuşdur.\nÜmumdünya Gömrük Təşkilatı Siyasi Komissiyasının 44-cü sessiyasının 2000-ci ilin dekabr ayında müstəsna hal kimi Bakı şəhərində keçirilməsi (Azərbaycan Müstəqil Dövlətlər Birliyində belə bir tədbirin həyata keçirildiyi ilk ölkə oldu) və sessiya iştirakçılarının Azərbaycan Respublikasının Prezidenti Heydər Əliyev tərəfindən qəbulu dövlət başçısının bu sahəyə xüsusi diqqətini, Azərbaycan gömrük təşkilatının qısa bir müddətdə həqiqətən inkişaf etdiyini və ölkəmizin beynəlxalq aləmdə artan nüfuzunu, dünya dövlətlərinin gömrük xidmətləri ilə sıx əməkdaşlığını əyani olaraq bir daha göstərdi.\nAzərbaycanın beynəlxalq gömrük əməkdaşlığı sahəsində atdığı müsbət addımların nəticəsi olaraq 1996-cı ildə Avropa Birliyi və ona üzv olan dövlətlərlə Tərəfdaşlıq və Əməkdaşlıq Sazişi imzalanmışdır. Elə həmin ildə ölkəmiz \"BYD kitabçasının tətbiqi ilə Beynəlxalq Yükdaşımalar üzrə Gömrük KonvensiyasT'na, 2000-ci ilin may ayında \"Malların Təsviri və Kodlaşdırılması üzrə harmonikləşdirilmiş Sistemə dair Beynəlxalq Konvensiya\"ya, həmin ilin fevral ayında \"Sərhədlərdə yüklərin nəzarətdən keçirilməsi şərtlərinin razılaşdırılması haqqında\" Beynəlxalq Konvensiyaya (Cenevrə Konvensiyası, 1982-ci il), 2002-ci ilin fevral ayında \"Gömrük hüquqpozmalarının qarşısının alınması, təhqiqatların aparılması və aradan qaldırılmasına dair qarşılıqlı inzibati yardım haqqında Beynəlxalq Konvensiya\"ya (Nayrobi Konvensiyası), 2003-cü ilin dekabr ayında isə \"Gömrük prosedurlarının sadələşdirilməsi və harmonizə edilməsi haqqında Beynəlxalq Konvensiya\"ya (Kioto Konvensiyası) qoşulmuşdur. Həmçinin, Birləşmiş Millətlər Təşkilatının Avropa İqtisadi …","2023"],["Dini kitab keçirir 5 ədəd, Səndə ərəb dilini bilmirən, Nə edərsən?","Şəxs kitabın çıxma tarixi... idxal ölkəsi ...mənşə ölkəsi ... adı və müəllifi barədə məlumatı aparıb verir Dini qurumlara\nDini qurumlarda onlara müvafiq rəy verir\nRəy keçərlidirsə biz o kitabları
