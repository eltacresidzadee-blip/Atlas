i Dövlət Gömrük Komitəsinin Mərkəzi Gömrük Ekspertiza İdarəsinin “malların Azərbaycan mənşəli olması haqqında yazılı rəyi” alındıqdan sonra həyata keçirilir?","o":["Azərbaycan Respublikasının hüdudlarından kənarda olduğu müddətdə aparıldığı andakı vəziyyəti dəyişilmiş mallar təkrar idxal edildikdə","Mallar ilk dəfə ixrac edildikdə","Mallar beynəlxalq tranzitlə keçirildikdə","Mallar müvəqqəti saxlanc anbarına yerləşdirildikdə"],"e":"Təkrar idxal üzrə Metodiki Tövsiyə: belə mallar üzrə 31-ci qrafa Mərkəzi Gömrük Ekspertiza İdarəsinin Azərbaycan mənşəli olması haqqında rəyi nəzərə alınmaqla doldurulur.","ex":1},{"d":25,"c":3,"id":"met-rq1","r":"Qrafa 37","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsininm 37-ci qrafasında 40.20.38 kodu qeyd olunduğu halda əvvəlki gömrük bəyannaməsinin 37-ci qrafasının 1-ci yarımbölməsində nə qeyd olunmuşdur?","o":["2000","4020","4000","2040"],"e":"Qrafa 37: ilk iki rəqəm cari prosedur, sonrakı iki rəqəm əvvəlki prosedurdur. 40.20.38 — SDB (40), əvvəlki prosedur son istifadə (20), xüsusiyyət 38 (konsorsiumun son istifadə üçün gətirdiyi malların sərbəst dövriyyəyə buraxılması). Əvvəlki son istifadə bəyannaməsində cari prosedur 20, əvvəlki prosedur isə yox idi (00). Diqqət: bu cavab qaydadan çıxarılıb, metodikada hərfən yazılmayıb.","ex":1},{"d":25,"c":3,"id":"met-rq2","r":"Qrafa B","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən hansı halda gömrük bəyannaməsinin B qrafası 4 elementdən ibarət olur?","o":["Gömrük ödənişlərinin ödənilməsinə möhlət verildiyi hallarda","Mallar əlavə vərəqlərlə bəyan edildikdə","Mallar gömrük anbarına yerləşdirildikdə","47-ci qrafanın “ÖÜ” sütununda “05” göstərildikdə"],"e":"Qrafa B: möhlət verildikdə 4-cü elementdə təminat üsulunun kodu göstərilir. ÖÜ “05” olduqda isə B qrafası doldurulmur.","ex":1},{"d":25,"c":3,"id":"met-rq3","r":"Qrafa 31, 8-ci bölmə","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin 31-ci qrafasının “Malın invoys üzrə təsviri” bölməsinin doldurulması zamanı məlumatın hüquqi bazasını təşkil edən təsdiqedici sənəd olmadıqda həmin xüsusiyyət üzrə mətn tipli xanalarda aşağıda qeyd olunan ifadələrdən hansı qeyd edilmir?","o":["“qeyd edilməyib”","“yoxdur”","“bilinmir”","“məlum deyil”"],"e":"Qrafa 31: mətn tipli xanalarda “yoxdur”, “bilinmir”, “məlum deyil”; rəqəm tipli xanalarda “0”; tarix tipli xanalarda “01.01.1900” yazılır.","ex":1},{"d":25,"c":3,"id":"met-rq4","r":"Qrafa 31","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən aşağıdakılardan hansı gömrük bəyannaməsinin 31-ci qrafasının “Təsvir göstəricilərinə aid malın fiziki xüsusiyyətləri” hissəsinə daxildir?","o":["Malın ölçüləri, forması, rəngi","Malın zəmanət şərtləri, istehsal üsulu, istehsal ili","Malın artikulu, modeli, brendi","Malın daşınma və sığorta məlumatları"],"e":"Qrafa 31: fiziki xüsusiyyətlər — ölçülər, forma, rəng və s.","ex":1},{"d":25,"c":3,"id":"met-rq5","r":"Tranzit tövsiyəsi","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin-nin 1-ci qrafasının 2-ci yarımbölməsində “80” kodu qeyd olunduğu halda həmin qrafanın 1-ci yarımbölməsində aşağıda qeyd olunan məlumatlardan hansı qeyd oluna bilər?","o":["«ID»","«TR»","«EK»","«İM»"],"e":"Tranzit üzrə Metodiki Tövsiyə: Azərbaycan ərazisindən tranzitlə keçirilən mallar üçün «ID», xarici dövlətin ərazisindən keçirilən mallar üçün «IX». 80 beynəlxalq tranzitin kodudur.","ex":1},{"d":25,"c":3,"id":"met-rq6","r":"Qrafa 20, 14 saylı Əlavə","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən ixrac zamanı gömrük bəyannaməsinin 36-cı qrafasında “030” kodu qeyd olunduqda       20-ci qrafanın 3-cü yarımbölməsində hansı kod göstərilir?","o":["«007»","«001»","«002»","«004»"],"e":"İmtiyaz kodu 030 — diplomatik nümayəndəliklərdə xidmət etmiş əməkdaşların malları. Belə hallarda ödəniş qanunvericiliklə tələb olunmur, ona görə «007» (şəxsi əmlak, diplomatik yüklər və s.) göstərilir.","ex":1},{"d":25,"c":3,"id":"met-rq7","r":"Qrafa 31","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin 31-ci qrafasının “malın miqdarı” hissəsi hansı məqsədlər üçün doldurulur?","o":["Tarif tənzimlənməsi üçün","Statistik uçot üçün","Valyuta nəzarəti üçün","Sığorta məqsədləri üçün"],"e":"Qrafa 31, 2-ci bölmə: miqdar tarif tənzimlənməsi üçün aşağı sağ küncdə göstərilir.","ex":1},{"d":25,"c":3,"id":"met-rq8","r":"Qrafa 33","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən 33-cü qrafanın strukturu ilə bağlı düzgün cavab variantını seçin:","o":["1-ci yarımbölmədə 6, 2-ci yarımbölmədə 4 simvol olmaqla 10 rəqəmli kod; 2-ci hissədə bölmədə rəsmiləşdirilən malların ümumi sayı","1-ci yarımbölmədə 4, 2-ci yarımbölmədə 6 simvol olmaqla 10 rəqəmli kod","8 rəqəmli kod, ayırıcı işarələrlə","6 rəqəmli kod, yalnız bir yarımbölmədə"],"e":"Qrafa 33: kod boşluqsuz və ayırıcı işarələr olmadan yazılır.","ex":1},{"d":25,"c":3,"id":"met-rq9","r":"Qrafa B","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin Qrafa B. “Hesablamanın detalları” bölməsinin “gömrük ödənişlərinin ödənilməsi üzrə məlumatlar” hissəsi ilə bağlı qeyd olunanlardan hansı doğrudur?","o":["Bütün elementlər bir-birindən defis işarəsi ilə ayrılır və elementlər daxilində boş yer qoyulmasına yol verilmir","Elementlər vergüllə ayrılır","3-cü elementdə xarici valyutanın kodu göstərilir","Qrafanın aşağı hissəsində yalnız ƏDV-nin məbləği göstərilir"],"e":"Qrafa B: 1 — ödəniş növünün kodu; 2 — məbləğ; 3 — milli valyutanın kodu. Aşağı hissədə gömrük ödənişlərinin cəmi göstərilir.","ex":1},{"d":25,"c":3,"id":"met-rq10","r":"4 saylı Əlavə","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən çatdırılma şərtlərinin təsnifatına uyğun olaraq “Dəyər və icarə” çatdırılma şərtinin hərfi kodu nədir?","o":["CFR","CIF","CPT","FCA"],"e":"4 saylı Əlavə: 05 — CFR (Dəyər və icarə); qısaldılmış adı SFR.","ex":1},{"d":25,"c":3,"id":"met-rq11","r":"Qrafa 6","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən boru kəməri və elektrik ötürücü xətlər vasitəsi ilə malların gömrük sərhədindən keçirilməsi ilə bağlı aşağıda qeyd olunanlardan hansı doğrudur?","o":["Boru kəməri nəqliyyatı və elektrik xətləri vasitəsilə keçirildikdə 6-cı qrafada «0» rəqəmi yazılır","6-cı qrafada boruların sayı yazılır","6-cı qrafada «1» rəqəmi yazılır","6-cı qrafa doldurulmur"],"e":"Qrafa 6. Diqqət: elektrik enerjisi bəyan olunduqda 35 və 38-ci qrafalarda da «0» yazılır.","ex":1},{"d":25,"c":3,"id":"met-rq12","r":"Qrafa 47","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin 47-ci qrafasının “hesablama bazası” sütunu hansı qrafada göstərilən məlumatlar hesabına formalaşır?","o":["12, 38, 45-ci qrafalarda və 31-ci qrafanın aşağı sağ küncündə","22, 42 və 46-cı qrafalarda","12 və 35-ci qrafalarda","45 və 46-cı qrafalarda"],"e":"Qrafa 47, “Hesablama bazası” sütunu.","ex":1},{"d":25,"c":3,"id":"met-rq13","r":"Qrafa 1, 2 saylı Əlavə","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin 1-ci qrafasının 1-ci yarımbölməsində “İX” göstərilmişdirsə, ikinci yarımbölməsində aşağıdakılardan hansı göstərilə bilər?","o":["10","40","41","31"],"e":"«İX» — ixrac istiqaməti; 10 — ixrac prosedurunun kodudur. 40 (SDB), 41 (təkrar idxal), 31 (müvəqqəti idxal) idxal istiqamətinə aiddir.","ex":1},{"d":25,"c":3,"id":"met-rq14","r":"13 saylı Əlavə","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin 44-cü qrafasında hansı sənəd “4021” kodu altında göstərilir?","o":["Dövlətin ərazisində əmtəə nişanı ilə nişanlanmış malların mülki dövriyyəyə buraxılmasını təsdiq edən sənədlər, hüquq sahibinin diler, distribütor ilə müqaviləsi, yazılı razılıq və digər sənədlər","Gömrük anbarına mal yerləşdirmiş şəxslə anbar sahibi arasında bağlanmış müqavilə","Əqli mülkiyyətə hüquqların ötürülməsini təsdiq edən sənədlər","Mal sahibi ilə gömrük təmsilçisi arasında bağlanan müqavilə"],"e":"13 saylı Əlavə: 4021. Digərləri 4011, 4013, 4031-dir.","ex":1},{"d":25,"c":3,"id":"met-rq15","r":"Bənd 1.9","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən ixrac olunan mallara münasibətdə ödənişli əsasda sövdələşmələr üçün gömrük dəyəri dedikdə nə başa düşülür?","o":["Gömrük ərazisindən malların ixrac yerinə çatdırılması (daşınma, yükləmə, boşalma, sığorta) xərcləri və digər lazımi düzəlişlər nəzərə alınmaqla, ixrac olunan malların ödənilmiş və ya ödənilməli olan qiyməti əsasında təyin olunan dəyər","İxrac ölkəsinin daxili bazar qiyməti","Malların istehsal xərclərinin cəmi","Bircinsli malların kommersiya sənədləri ilə təyin olunan dəyəri"],"e":"Bənd 1.9 (“gömrük dəyəri”). Sonuncu variant ödənişsiz sövdələşmələrə aiddir.","ex":1},{"d":25,"c":3,"id":"met-rq16","r":"Qrafa 37","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin “Əməliyyat” qrafasının doldurulması ilə bağlı düzgün cavab variantı seçin:","o":["1-ci yarımbölmədə 4 və 2-ci yarımbölmədə 2 simvol olmaqla 6 rəqəmli kod göstərilir; əvvəlki prosedur məlum olmadıqda «00» yazılır","8 rəqəmli kod göstərilir","Yalnız cari prosedurun 2 rəqəmli kodu göstərilir","Kod hərflərlə göstərilir"],"e":"Qrafa 37.","ex":1},{"d":25,"c":3,"id":"met-rq17","r":"Qrafa B, 10 saylı Əlavə","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin 47-ci qrafasının ödəniş üsulu sütununda “03” qeyd olunduğu halda “B” qrafası ilə bağlı qeyd olunanlardan hansı doğrudur?","o":["“B” qrafası 4 elementdən ibarət olur və 4-cü elementdə təminat üsulunun kodu göstərilir","“B” qrafası doldurulmur","“B” qrafasında yalnız ödəniş məbləği göstərilir","“B” qrafasında xəzinə vekselinin nömrəsi göstərilir"],"e":"10 saylı Əlavə: 03 (ÖM) — ödənişə möhlət verilməsi; 05 (ŞH) — şərti hesablama, bu halda B qrafası doldurulmur.","ex":1},{"d":25,"c":3,"id":"met-rq18","r":"4 saylı Əlavə","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən çatdırılma şərtlərinin təsnifatına əsasən “Gəmi boyunca sərbəst” çatdırılma şərtinin hərfi kodu nədir?","o":["FAS","FOB","FCA","CFR"],"e":"4 saylı Əlavə: 03 — FAS (Gəmi boyunca sərbəst); 04 — FOB (Gəmi içərisində sərbəst).","ex":1},{"d":25,"c":3,"id":"met-rq19","r":"Qrafa 28","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən valyuta nəzarəti məqsədi üçün lazım olan məlumatlar hansı qrafada göstərilir?","o":["28-ci qrafada","22-ci qrafada","44-cü qrafada","9-cu qrafada"],"e":"Qrafa 28 (“Maliyyə və bank məlumatı”).","ex":1},{"d":25,"c":3,"id":"met-rq20","r":"Qrafa 21","q":"“Gömrük bəyannamələrinin doldurulması qaydasının metodikası”na əsasən ixrac əməliyyatları üzrə malları gömrük ərazisindən çıxaracaq nəqliyyat vasitəsi 18-ci qrafada göstərilən nəqliyyat vasitəsilə eyni olduqda, “18-ci qrafaya bax” sözləri bəyannamənin neçənci qrafasında əks olunur?","o":["21-ci qrafada","18-ci qrafada","25-ci qrafada","26-cı qrafada"],"e":"Qrafa 21.","ex":1},{"d":25,"c":3,"id":"met-rq21","r":"Qrafa 37, 20","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən tərtib edilən gömrük bəyannaməsinin 37-ci qrafasında “52 00 34” kodu, 20-ci qrafasının 3 cü yarımbölməsində “007” kodu göstərilmişdirsə aşağıda qeyd olunan fikirlərdən hansı doğrudur?","o":["Mallar xaricdə emal proseduru altında təmirə göndərilir və malın dəyərinin ödənilməsi qanunvericiliklə tələb olunmur","Mallar daxildə emal üçün gətirilir və dəyəri əvvəlcədən ödənilib","Mallar sərbəst dövriyyəyə buraxılır və dəyəri ixracdan sonra ödənilir","Mallar konsiqnasiya yolu ilə ixrac olunur"],"e":"52 — xaricdə emal; 00 — əvvəlki prosedur yoxdur; 34 — təmirə göndərilən və geri qaytarılan mallar; 007 — ödəniş qanunvericiliklə tələb olunmur.","ex":1},{"d":25,"c":3,"id":"met-rq22","r":"Bənd 1.9","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük ödənişlərinin ödəyicisinin eyniləşdirmə nömrəsi barədə qeyd olunanlardan hansı yanlışdır?","o":["GÖÖEN vergi ödəyicisi olan hüquqi şəxslərə verilən eyniləşdirmə nömrəsidir","GÖÖEN vergi ödəyicisi olmayan fiziki şəxslərə verilir","GÖÖEN ilk dəfə əməliyyat aparan şəxslər tərəfindən tez xarab olan mallar üçün bir dəfə istifadə edilə bilər","GÖÖEN 2, 8, 9 və 14-cü qrafaların sağ yuxarı küncündə göstərilir"],"e":"Bənd 1.9: GÖÖEN vergi ödəyicisi OLMAYAN fiziki şəxslərə verilir; vergi ödəyicilərinə VÖEN verilir.","ex":1},{"d":25,"c":3,"id":"met-rq23","r":"Qrafa 47","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin 47-ci qrafası ilə bağlı aşağıda qeyd olunanlardan hansı doğrudur?","o":["47-ci qrafanın bütün sütunları doldurulur","47-ci qrafa yalnız idxal zamanı doldurulur","Hesablanmış məbləğlər tam ədədə qədər yuxarı yuvarlaqlaşdırılır","“ÖÜ” sütununda ödəniş növünün kodu göstərilir"],"e":"Qrafa 47: “Növ” — ödəniş növünün kodu (8 saylı Əlavə); “ÖÜ” — ödəniş üsulu (10 saylı Əlavə); yuvarlaqlaşdırma Mərkəzi Bankın qaydaları ilə aparılır.","ex":1},{"d":25,"c":3,"id":"met-rq24","r":"Qrafa 18","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən gömrük bəyannaməsinin 18-ci qrafası ilə bağlı qeyd olunanlardan hansı yanlışdır?","o":["Hava nəqliyyatı daşımaları zamanı da qrafada təyyarənin nömrəsi göstərilir","Avtomobil nəqliyyatında avtomobilin qeydiyyat nömrəsi göstərilir","Qrafanın sağ yarımbəndində nəqliyyat vasitəsinin mənsub olduğu ölkənin kodu göstərilir","Nəqliyyat vasitəsi birdən çox olduqda sayı göstərilib “qoşma vərəqə bax” qeyd olunur"],"e":"Qrafa 18: hava nəqliyyatı daşımaları zamanı bu qrafa DOLDURULMUR.","ex":1},{"d":25,"c":3,"id":"met-rq25","r":"Müvəqqəti idxal tövsiyəsi","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən malların müvəqqəti idxal xüsusi gömrük proseduru altında yerləşdirilməsinə verilən icazənin son müddəti gömrük bəyannaməsinin hansı qrafasında göstərilir?","o":["44-cü qrafada, 9 rəqəmi altında","48-ci qrafada","37-ci qrafada","40-cı qrafada"],"e":"Müvəqqəti ixrac və idxal üzrə Metodiki Tövsiyə: 44-cü qrafada 9 rəqəmi altında “Malların 99.99.9999-cu ilə qədər çıxarılmasına zəmanət verirəm” yazılır.","ex":1},{"d":25,"c":3,"id":"met-rq26","r":"2 saylı Əlavə","q":"“Gömrük bəyannamələrinin doldurulması qaydasının Metodikası”na əsasən təbii fəlakətlər üçün müvəqqəti idxal olunmuş mallar sonradan sərbəst dövriyyə üçün buraxılış gömrük proseduru altında yerləşdirildiyi zaman 37-ci qrafada hansı kod qeyd olunur?","o":["40 31 05","40 00 05","31 40 05","40 31 00"],"e":"40 — SDB; 31 — əvvəlki prosedur (müvəqqəti idxal); 05 — təbii fəlakət və qəzaların nəticələrini aradan qaldırmaq üçün malların keçirilməsi.","ex":1},{"d":26,"c":0,"id":"byd-0","r":"BYD Qaydaları","q":"Azərbaycan Respublikasının Dövlət Gömrük Komitəsinin 14 may 2005-ci il tarixli 045 nömrəli əmri ilə təsdiq edilmiş Beynəlxalq Yük Daşımalarında (BYD Konvensiyası, 1975) yüklərə gömrük nəzarəti və BYD kitabçasının rəsmiləşdirilməsi Qaydalarına əsasən BYD əməliyyatı zamanı plomblanmış yol nəqliyyat vasitələrində daşınan mallara dair aşağıdakılardan hansı doğrudur?","o":["Azərbaycan Respublikasının gömrük ərazisində BYD əməliyyatı zamanı plomblanmış yol nəqliyyat vasitələrində, plomblanmış nəqliyyat vasitələri qatarında və ya plomblanmış konteynerlərdə daşınan mallar, bir qayda olaraq, aralıq gömrük orqanlarında gömrük yoxlamasından azad olunurlar.","Plomblanmış yol nəqliyyat vasitələrində daşınan mallar bütün aralıq gömrük orqanlarında mütləq gömrük yoxlamasından keçirilir.","Plomblanmış nəqliyyat vasitələrində daşınan mallar üzrə hər aralıq gömrük orqanında gömrük ödənişləri alınır.","Plomblanmış nəqliyyat vasitələrində daşınan mallar yalnız giriş gömrük orqanında yoxlamadan azad olunur."],"e":"Düzgün cavab faylınızdakı kimidir. Bu mövzu üzrə mənbə sənəd proqramda yoxdur; digər variantları mən hazırlamışam.","ex":1},{"d":26,"c":0,"id":"byd-1","r":"BYD Qaydaları","q":"Beynəlxalq Yük Daşımalarında (BYD Konvensiyası, 1975) yüklərə gömrük nəzarəti və BYD kitabçasının rəsmiləşdirilməsi Qaydalarına əsasən “nəzarət məqsədi üçün yol nəqliyyat vasitəsi, nəqliyyat vasitələri qatarı və ya konteynerin yük və ona aid olan BYD kitabçası ilə birlikdə təyinat və ya çıxış (aralıq) gömrük orqanına təqdim edilməsi” anlayışı aşağıdakılardan hansını ifadə edir?","o":["BYD əməliyyatının dayandırılması","BYD əməliyyatının başlanğıcı","BYD əməliyyatının başa çatması","BYD əməliyyatı"],"e":"Düzgün cavab faylınızdakı kimidir.","ex":1},{"d":26,"c":0,"id":"byd-2","r":"BYD Qaydaları","q":"BYD əməliyyatının başlanğıcı anlayışı nəyi nəzərdə tutur?","o":["nəzarət məqsədi üçün yol nəqliyyatı vasitəsi, nəqliyyat vasitələri qatarı və ya konteynerin yük və ona aid olan BYD kitabçası ilə birlikdə göndərən və ya giriş (aralıq) gömrük orqanına təqdim olunması və BYD kitabçasının həmin gömrük orqanları tərəfindən rəsmiləşdirmə üçün qəbul edilməsi","nəzarət məqsədi üçün yol nəqliyyat vasitəsi, nəqliyyat vasitələri qatarı və ya konteynerin yük və ona aid olan BYD kitabçası ilə birlikdə təyinat və ya çıxış (aralıq) gömrük orqanına təqdim edilməsi","konkret BYD əməliyyatının lazımi qaydada dayandırılması faktının gömrük orqanları tərəfindən qəbul edilməsi","BYD kitabçasının zəmanət birliyi tərəfindən daşıyıcıya verilməsi"],"e":"Düzgün cavab faylınızdakı kimidir (C variantı). İkinci variant BYD əməliyyatının dayandırılmasının, üçüncüsü başa çatmasının anlayışıdır.","ex":1},{"d":26,"c":0,"id":"byd-3","r":"BYD Qaydaları","q":"“Razılığa gələn tərəfin gömrük orqanları tərəfindən konkret BYD əməliyyatının lazımi qaydada dayandırılması faktının qəbul edilməsi deməkdir. Bu, gömrük orqanları tərəfindən təyinat və ya çıxış (aralıq gömrük orqanı) gömrük orqanında mövcud olan məlumatların göndərən və ya giriş (aralıq gömrük orqanı) gömrük orqanlarında mövcud olan məlumatlarla müqayisə edilməsi əsasında müəyyənləşdirilir” ifadəsi hansı anlayışı ehtiva edir?","o":["BYD əməliyyatının başa çatması","BYD əməliyyatının dayandırılması","BYD əməliyyatının başlanğıcı","BYD daşıması"],"e":"Düzgün cavab faylınızdakı kimidir (B variantı).","ex":1},{"d":26,"c":0,"id":"byd-4","r":"BYD Qaydaları","q":"Beynəlxalq Yük Daşımalarında (BYD Konvensiyası, 1975) yüklərə gömrük nəzarəti və BYD kitabçasının rəsmiləşdirilməsi Qaydalarına əsasən  BYD-nin bir hissəsinin BYD Konvensiyasına üzv olmayan dövlətin ərazisindən keçməsi ilə bağlı aşağıdakılardan hansı doğrudur?","o":["BYD əməliyyyatı dayandırılır","BYD əməliyyatı heç bir dəyişiklik olmadan davam etdirilir","BYD kitabçası ləğv edilir və mallar müsadirə olunur","Daşıyıcıdan yeni BYD kitabçası tələb olunur"],"e":"Düzgün cavab faylınızdakı kimidir (B variantı).","ex":1},{"d":26,"c":0,"id":"byd-5","r":"BYD Qaydaları","q":"Beynəlxalq Yük Daşımalarında (BYD Konvensiyası, 1975) yüklərə gömrük nəzarəti və BYD kitabçasının rəsmiləşdirilməsi Qaydalarına əsasən gömrük qanunvericiliyi pozulduğu hallarda daşıyıcılar tərəfindən ödənilməli olan gömrük ödənişlərini ödənilməsi ilə bağlı zəmanət birliyinin məsuliyyəti Azərbaycan Respublikası ərazisində BYD daşımasını həyata keçirən aşağıdakı hansı daşıyıcılara şamil edilir ?","o":["BYD kitabçasının hansı milli zəmanət birliyi tərəfindən verilməsindən asılı olmayaraq, Azərbaycan Respublikası ərazisində BYD daşımasını həyata keçirən həm Azərbaycan, həm də xarici dövlətlərin daşıyıcılarına şamil edilir","Yalnız Azərbaycan Respublikasının daşıyıcılarına şamil edilir","Yalnız xarici dövlətlərin daşıyıcılarına şamil edilir","Yalnız Azərbaycanın milli zəmanət birliyinin verdiyi BYD kitabçası ilə daşıma aparan daşıyıcılara şamil edilir"],"e":"Düzgün cavab faylınızdakı kimidir (B variantı).","ex":1},{"d":26,"c":0,"id":"byd-6","r":"BYD Qaydaları","q":"Beynəlxalq Yük Daşımalarında (BYD Konvensiyası, 1975) yüklərə gömrük nəzarəti və BYD kitabçasının rəsmiləşdirilməsi Qaydalarına əsasən zəmanət birliyi aşağıdakı hansı mallara dair gömrük ödənişlərinin ödənilməsinə məsuliyyət daşıyır?\n1. BYD kitabçasında göstərilən mallar üçün\n2. BYD kitabçasında göstərilməyən, lakin plomblanmış yol nəqliyyat vasitəsinin yük yerlərində olan mallar üçün\n3. BYD kitabçasında göstərilməyən, lakin  plomblanmış konteynerlərdə olan mallar üçün","o":["1,2,3","Yalnız 1","1,2","2,3"],"e":"Variantlar və düzgün cavab (D) faylınızdakı kimidir.","ex":1},{"d":26,"c":0,"id":"byd-7","r":"BYD Qaydaları","q":"Beynəlxalq Yük Daşımalarında (BYD Konvensiyası, 1975) yüklərə gömrük nəzarəti və BYD kitabçasının rəsmiləşdirilməsi Qaydalarına əsasən “BYD əməliyyatı” anlayışı aşağıdakılardan hansıdır?","o":["Razılığa gələn tərəfin göndərən və ya giriş (aralıq) gömrük orqanından təyinat və ya çıxış (aralıq) gömrük orqanına qədər həyata keçirilən BYD daşımalarının hissəsi deməkdir.","Yüklərin göndərən gömrük orqanından təyinat gömrük orqanına qədər bütün daşınması deməkdir.","BYD kitabçasının rəsmiləşdirilməsi prosesi deməkdir.","Yalnız bir razılığa gələn tərəfin ərazisində həyata keçirilən daxili daşıma deməkdir."],"e":"Düzgün cavab faylınızdakı kimidir (B variantı).","ex":1},{"d":27,"c":0,"id":"kont-0","r":"Konvensiya","q":"Azərbaycan Respublikasının 12 dekabr 2000-ci il tarixli 37-IIQ nömrəli Qanunla qoşulduğu «Konteynerlərə aid Gömrük Konvensiyası»na əsasən “konteyner” termini ilə bağlı aşağıdakılardan hansı səhvdir ?","o":["daxili həcmi bir kub metrdən az olan qurğudur","yükləri yerləşdirmək üçün istifadə olunan tam və ya qismən qapalı tutumdur və dəfələrlə istifadə etmək üçün dəyişməz xüsusiyyətə malik və bu səbəbdən də çox möhkəm olan","elə quraşdırılır ki, bir nəqliyyat növündən digər nəqliyyat növünə yüklənməsi asan olsun və elə quraşdırılır ki, onun yüklənməsi və boşaldılması asan olsun","yüklərin arada yüklənməməsi şərtilə, yüklərin bir və ya bir neçə nəqliyyat növü ilə daşınmasını asanlaşdırmaq üçün xüsusi  düzəldilmiş"],"e":"Variantlar və düzgün cavab (C) faylınızdakı kimidir.","ex":1},{"d":27,"c":0,"id":"kont-1","r":"Konvensiya","q":"«Konteynerlərə aid Gömrük Ko   VIEWS.forEach(x=>$("v-"+x).hidden=x!==v);
  $("bnav").hidden=!TABS[v];
  document.querySelectorAll(".bnav button").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  if(v!=="quiz") $("sheet").hidden=true;
  else if(S&&S.list[S.i]&&S.list[S.i].done) $("sheet").hidden=false;
  ({home:renderHome,wrong:renderWrong,terms:renderTerms,setup:updPool})[v]?.();
  window.scrollTo(0,0);
}
function go(v){stack.push(v);if(H){try{history.pushState({gx:stack.length},"");}catch(e){H=false;}}show(v);}
function replace(v){stack[stack.length-1]=v;show(v);}
function back(){if(stack.length<=1)return;if(H)history.back();else{stack.pop();show(stack[stack.length-1]);}}
window.addEventListener("popstate",()=>{if(stack.length>1){stack.pop();show(stack[stack.length-1]);}});
document.querySelectorAll(".js-back").forEach(b=>{b.innerHTML=IC.back;b.onclick=back;});
$("qClose").innerHTML=IC.close; $("qClose").onclick=back;
$("nHome").innerHTML=IC.home; $("nWrong").innerHTML=IC.err; $("nTerms").innerHTML=IC.table;
document.querySelectorAll(".bnav button").forEach(b=>b.onclick=()=>{
  const v=b.dataset.v, cur=stack[stack.length-1]; if(v===cur){window.scrollTo({top:0,behavior:"smooth"});return;}
  if(v==="home") back(); else if(cur==="home") go(v); else replace(v);
});

function snack(t){const o=document.querySelector(".snack");if(o)o.remove();const s=document.createElement("div");s.className="snack";s.textContent=t;document.body.appendChild(s);setTimeout(()=>s.remove(),2200);}
function ring(p,size,stroke,label,sub,color){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--s2)" stroke-width="'+stroke+'"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||"var(--primary)")+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-Math.max(0,Math.min(1,p))))+'"/></svg><div class="rl"><b>'+label+'</b><small>'+sub+'</small></div></div>';
}
function initials(n){const w=n.replace(/[“”"()«»]/g,"").split(/\s+/).filter(x=>x&&!/^\d/.test(x));return ((w[0]||"?")[0]+((w[1]||"")[0]||"")).toUpperCase();}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

/* ---------- home ---------- */
function mastered(list){let n=0;for(const q of list) if(M[q.id]===1) n++;return n;}
function renderHome(){
  const ok=mastered(Q), seen=Object.keys(M).filter(id=>QI[id]).length;
  const day=LS.get("gx_day",{d:"",n:0,ok:0}); const tn=day.d===today()?day.n:0, tok=day.d===today()?day.ok:0;
  const acc=seen?Math.round(ok/seen*100):0;
  $("statCard").innerHTML=ring(ok/Q.length,104,10,Math.round(ok/Q.length*100)+"%","öyrənilib")+
    '<div class="kv"><div><b>'+ok+'</b><span>'+Q.length+' sualdan düz</span></div><div><b>'+seen+'</b><span>baxılıb</span></div><div><b>'+tn+'</b><span>bu gün'+(tn?' · '+Math.round(tok/tn*100)+'% düz':'')+'</span></div><div><b>'+wrongSet.size+'</b><span>səhv siyahısında</span></div></div>';
  const rb=$("resumeBtn");
  if(S&&S.i<S.list.length&&S.i>0){rb.hidden=false;rb.innerHTML='<span class="pl">'+IC.play+'</span><span><b>Testə davam et</b><span>'+S.i+' / '+S.list.length+' · '+esc(S.label)+'</span></span>';rb.onclick=()=>go("quiz");}
  else rb.hidden=true;
  const exN=Q.filter(q=>q.ex).length, freshN=Q.length-ok;
  $("tiles").innerHTML=
    '<button class="tile main" id="tMix"><span class="ic">'+IC.shuffle+'</span><span class="tt"><b>Qarışıq test</b><span>Bütün '+D.length+' sənəddən təsadüfi suallar</span></span></button>'+
    '<button class="tile" id="tEx" style="--tc:#B3261E"><span class="ic">'+IC.star+'</span><b>Real imtahan sualları</b><span>'+exN+' sual</span></button>'+
    '<button class="tile" id="tFresh" style="--tc:#6A4C93"><span class="ic">'+IC.bolt+'</span><b>Öyrənmədiklərim</b><span>'+freshN+' sual</span></button>';
  $("tMix").onclick=()=>openSetup(-1,{});
  $("tEx").onclick=()=>openSetup(-1,{ex:1});
  $("tFresh").onclick=()=>openSetup(-1,{fresh:1});
  $("docCnt").textContent=D.length+" sənəd";
  $("dlist").innerHTML=D.map((d,i)=>{const n=BY[i].length,m=mastered(BY[i]),ex=BY[i].filter(q=>q.ex).length,p=n?m/n*100:0;
    return '<button class="ditem" data-i="'+i+'" style="--dc:'+DC[i]+'"><span class="av">'+esc(initials(d.name))+'</span><span><span class="nm">'+esc(d.name)+'</span><span class="mt">'+esc(d.meta)+'</span><div class="pbar"><i style="width:'+p+'%"></i></div></span><span class="rt"><b>'+n+'</b>sual'+(ex?'<br><span class="badge">'+ex+' real</span>':'')+'</span></button>';}).join("");
  $("dlist").querySelectorAll(".ditem").forEach(b=>b.onclick=()=>openSetup(+b.dataset.i,{}));
  updBadge();
}
function updBadge(){const n=wrongSet.size;$("nWrong").innerHTML=IC.err+(n?'<span class="dot">'+(n>99?"99+":n)+'</span>':'');}

/* ---------- setup ---------- */
function openSetup(di,pre){
  cfg={di,ch:new Set(di>=0?D[di].ch.map((_,i)=>i):[])};
  $("fEx").checked=!!pre.ex; $("fFresh").checked=!!pre.fresh; $("fHl").checked=false; $("fT").checked=false; $("fOrder").checked=false;
  if(di>=0){const d=D[di];$("suTitle").textContent=d.name;$("suHead").style.setProperty("--dc",DC[di]);$("suHead").innerHTML='<b>'+esc(d.full)+'</b><span>'+esc(d.meta)+' · '+BY[di].length+' sual</span>';}
  else{$("suTitle").textContent=pre.ex?"Real imtahan sualları":pre.fresh?"Öyrənmədiklərim":"Qarışıq test";$("suHead").style.setProperty("--dc","var(--primary)");$("suHead").innerHTML='<b>Bütün sənədlər</b><span>'+D.length+' sənəd · '+Q.length+' sual</span>';}
  renderCh(); go("setup");
}
function renderCh(){
  const di=cfg.di; $("chBox").hidden=di<0||D[di].ch.length<2; if(di<0) return;
  $("chChips").innerHTML=D[di].ch.map((c,i)=>{const n=BY[di].filter(q=>q.c===i).length;return '<button class="chip" data-i="'+i+'" aria-pressed="'+cfg.ch.has(i)+'">'+esc(c.t)+' <small>'+n+'</small></button>';}).join("");
  $("chChips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;cfg.ch.has(i)?cfg.ch.delete(i):cfg.ch.add(i);b.setAttribute("aria-pressed",cfg.ch.has(i));updPool();});
  $("chAll").textContent=cfg.ch.size===D[di].ch.length?"Hamısını sil":"Hamısını seç";
}
$("chAll").onclick=()=>{const di=cfg.di;if(cfg.ch.size===D[di].ch.length)cfg.ch.clear();else D[di].ch.forEach((_,i)=>cfg.ch.add(i));renderCh();updPool();};
["fEx","fFresh","fHl","fT"].forEach(id=>$(id).addEventListener("change",updPool));
document.querySelectorAll("#fN button").forEach(b=>b.onclick=()=>{nPick=+b.dataset.n;LS.set("gx_n",nPick);updPool();});
function base(){return (cfg.di>=0?BY[cfg.di].filter(q=>cfg.ch.has(q.c)):Q);}
function pool(){const ex=$("fEx").checked,fr=$("fFresh").checked,hl=$("fHl").checked,t=$("fT").checked;
  return base().filter(q=>(!ex||q.ex)&&(!fr||M[q.id]!==1)&&(!hl||q.hl)&&(!t||q.t));}
function updPool(){
  if(!cfg) return;
  const b=base(), c=f=>b.filter(f).length;
  const nEx=c(q=>q.ex), nHl=c(q=>q.hl), nT=c(q=>q.t), nFr=c(q=>M[q.id]!==1);
  $("cEx").textContent=nEx+" sual · sizin fayllarınızdan"; $("rEx").hidden=!nEx&&!$("fEx").checked;
  $("cFresh").textContent=nFr+" sual · düz cavab verilməyənlər";
  $("cHl").textContent=nHl+" sual"; $("rHl").hidden=!nHl&&!$("fHl").checked;
  $("cT").textContent=nT+" sual"; $("rT").hidden=!nT&&!$("fT").checked;
  document.querySelectorAll("#fN button").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.n===nPick));
  const p=pool().length, n=Math.min(p,nPick);
  $("startBtn").innerHTML=IC.play.replace('<svg','<svg width="22" height="22" fill="currentColor"')+(p?'Başla · '+n+' sual':'Uyğun sual yoxdur');
  $("startBtn").disabled=!p;
}
$("startBtn").onclick=()=>{
  let p=pool(); p=$("fOrder").checked?p:shuffle(p); p=p.slice(0,nPick);
  const parts=[cfg.di>=0?D[cfg.di].name:"Bütün sənədlər"];
  if($("fEx").checked)parts.push("real suallar"); if($("fFresh").checked)parts.push("öyrənilməmiş");
  start(p,parts.join(" · "));
};

/* ---------- quiz ---------- */
function mk(q){return {q,opts:shuffle(q.o.map((t,k)=>({t,ok:k===0})))};}
function start(list,label){S={list:list.map(mk),i:0,score:0,ans:[],label};const cur=stack[stack.length-1];if(cur==="quiz"||cur==="result")replace("quiz");else go("quiz");renderQ();}
function tagsHtml(q){const d=D[q.d];return '<span class="tag doc" style="--dc:'+DC[q.d]+'">'+esc(d.name)+'</span><span class="tag">'+esc(q.r)+'</span>'+(q.ex?'<span class="tag ex">Real imtahan</span>':'')+(q.hl?'<span class="tag hl">Rənglənmiş</span>':'');}
function renderQ(){
  const n=S.list.length;
  $("qBar").style.width=(S.i/n*100)+"%"; $("qCount").textContent=Math.min(S.i+1,n)+" / "+n;
  if(S.i>=n){finish();return;}
  const it=S.list[S.i];
  $("qStage").innerHTML='<div class="tags">'+tagsHtml(it.q)+'</div><p class="qtext">'+esc(it.q.q)+'</p><ul class="opts">'+
    it.opts.map((o,k)=>'<li><button class="opt" data-k="'+k+'"><span class="k">'+"ABCD"[k]+'</span><span>'+esc(o.t)+'</span></button></li>').join("")+'</ul><div class="spacer" id="spc" hidden></div>';
  $("qStage").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("sheet").hidden=true;
  if(it.done) paint(it);
}
function paint(it){
  const k=it.pick, ok=it.opts[k].ok;
  $("qStage").querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(it.opts[i].ok)b.classList.add("right");else if(i===k)b.classList.add("wrong");else b.classList.add("dim");});
  $("spc").hidden=false;
  const sh=$("sheet"); sh.className="sheet "+(ok?"ok":"no");
  $("shV").innerHTML='<i>'+(ok?IC.check:IC.close)+'</i>'+(ok?"Düzdür!":"Səhvdir");
  $("shB").innerHTML=(ok?'':'<div class="ca">Düzgün cavab: '+esc(it.q.o[0])+'</div>')+'<div>'+esc(it.q.e)+'</div><div class="ref">'+esc(D[it.q.d].name)+' · '+esc(it.q.r)+'</div>';
  $("nextBtn").textContent=S.i===S.list.length-1?"Nəticəyə bax":"Davam et";
  sh.hidden=false;
}
function answer(k){
  const it=S.list[S.i]; if(it.done) return; it.done=true; it.pick=k;
  const ok=it.opts[k].ok; if(ok) S.score++;
  S.ans.push({it,k,ok});
  M[it.q.id]=ok?1:0; LS.set("gx_m",M);
  if(ok) wrongSet.delete(it.q.id); else wrongSet.add(it.q.id);
  LS.set("gx_all_wrong",[...wrongSet]);
  const day=LS.get("gx_day",{d:"",n:0,ok:0}); if(day.d!==today()){day.d=today();day.n=0;day.ok=0;} day.n++; if(ok)day.ok++; LS.set("gx_day",day);
  try{navigator.vibrate&&navigator.vibrate(ok?15:[30,40,30]);}catch(e){}
  paint(it);
  if(!ok){const b=$("qStage").querySelector('.opt[data-k="'+k+'"]');b.classList.add("shake");}
}
$("nextBtn").onclick=()=>{S.i++;$("sheet").hidden=true;renderQ();window.scrollTo(0,0);};
document.addEventListener("keydown",e=>{
  if($("v-quiz").hidden||!S||S.i>=S.list.length) return;
  const it=S.list[S.i];
  if(!it.done&&/^[1-4]$/.test(e.key)){const k=+e.key-1;if(k<it.opts.length)answer(k);}
  else if(it.done&&e.key==="Enter"){e.preventDefault();$("nextBtn").click();}
});

/* ---------- result ---------- */
function finish(){
  $("sheet").hidden=true;
  const n=S.list.length, pc=n?Math.round(S.score/n*100):0;
  const grade=pc>=90?"Əla! İmtahana hazırsınız.":pc>=75?"Yaxşı nəticə.":pc>=50?"Pis deyil, təkrar lazımdır.":"Daha çox məşq lazımdır.";
  const col=pc>=75?"var(--good)":pc>=50?"var(--primary)":"var(--bad)";
  const docsIn=[...new Set(S.ans.map(a=>a.it.q.d))].sort((a,b)=>a-b);
  let groups;
  if(docsIn.length>1) groups=docsIn.map(d=>{const a=S.ans.filter(x=>x.it.q.d===d);return {l:D[d].name,n:a.length,ok:a.filter(x=>x.ok).length,c:DC[d]};});
  else {const d=docsIn[0];const cs=[...new Set(S.ans.map(a=>a.it.q.c))].sort((a,b)=>a-b);groups=cs.map(c=>{const a=S.ans.filter(x=>x.it.q.c===c);return {l:D[d].ch[c].lab,n:a.length,ok:a.filter(x=>x.ok).length,c:DC[d]};});}
  const wrong=S.ans.filter(a=>!a.ok);
  $("resStage").innerHTML='<div class="card res">'+ring(pc/100,150,14,S.score+"/"+n,pc+"% düz",col)+'<div class="gr">'+grade+'</div><div class="sub">'+esc(S.label)+'</div></div>'+
    (groups.length>1?'<div class="sh"><h3>'+(docsIn.length>1?"Sənədlər üzrə":"Fəsillər üzrə")+'</h3></div><div class="card bars" style="margin:0 16px">'+groups.map(g=>'<div class="brow" style="--dc:'+g.c+'"><div class="bt"><span>'+esc(g.l)+'</span><span>'+g.ok+'/'+g.n+'</span></div><div class="pbar"><i style="width:'+(g.ok/g.n*100)+'%"></i></div></div>').join("")+'</div>':'')+
    '<div class="btnrow">'+(wrong.length?'<button class="btn full" id="retryBtn">Səhvləri təkrar et ('+wrong.length+')</button>':'')+'<button class="btn full '+(wrong.length?'tonal':'')+'" id="againBtn">Yeni test</button></div>'+
    (wrong.length?'<div class="sh"><h3>Səhv cavablar</h3><span>'+wrong.length+'</span></div><div class="rvl">'+wrong.map(a=>rv(a.it.q,a.it.opts[a.k].t)).join("")+'</div>':'');
  $("againBtn").onclick=()=>{S=null;back();};
  if(wrong.length) $("retryBtn").onclick=()=>start(wrong.map(a=>a.it.q),"Səhvlərin təkrarı");
  replace("result");
  S.i=S.list.length;
}
function rv(q,your){return '<div class="rv"><div class="tags">'+tagsHtml(q)+'</div><div class="qq">'+esc(q.q)+'</div>'+(your?'<div class="your">Sizin cavab: '+esc(your)+'</div>':'')+'<div class="ans">✓ '+esc(q.o[0])+'</div><div class="ex">'+esc(q.e)+'</div></div>';}

/* ---------- wrong ---------- */
function renderWrong(){
  updBadge();
  const all=Q.filter(q=>wrongSet.has(q.id));
  if(!all.length){$("wrongStage").innerHTML='<div class="empty"><b>Səhv yoxdur</b>Səhv cavab verdiyiniz suallar burada toplanır. Düz cavab verəndə siyahıdan çıxır.</div>';return;}
  const docs=[...new Set(all.map(q=>q.d))].sort((a,b)=>a-b);
  if(wFilter>=0&&!docs.includes(wFilter)) wFilter=-1;
  const ws=wFilter<0?all:all.filter(q=>q.d===wFilter);
  $("wrongStage").innerHTML='<div class="hscroll"><button class="chip" data-i="-1" aria-pressed="'+(wFilter<0)+'">Hamısı <small>'+all.length+'</small></button>'+docs.map(d=>'<button class="chip" data-i="'+d+'" aria-pressed="'+(wFilter===d)+'">'+esc(D[d].name)+' <small>'+all.filter(q=>q.d===d).length+'</small></button>').join("")+'</div>'+
    '<div class="btnrow" style="margin-bottom:16px"><button class="btn full" id="wPractice">'+IC.play.replace('<svg','<svg width="22" height="22" fill="currentColor"')+'Bunları test et ('+ws.length+')</button></div>'+
    '<div class="rvl">'+ws.map(q=>rv(q,null)).join("")+'</div><div class="btnrow"><button class="btn out full" id="wClear">Bu siyahını təmizlə</button></div>';
  $("wrongStage").querySelectorAll(".hscroll .chip").forEach(b=>b.onclick=()=>{wFilter=+b.dataset.i;renderWrong();});
  $("wPractice").onclick=()=>start(shuffle(ws),"Səhvlərim");
  $("wClear").onclick=()=>{ws.forEach(q=>wrongSet.delete(q.id));LS.set("gx_all_wrong",[...wrongSet]);renderWrong();snack("Siyahı təmizləndi");};
}

/* ---------- terms ---------- */
function renderTerms(){
  const docs=[...new Set(DATA.terms.map(t=>t.d))].sort((a,b)=>a-b);
  if(tDoc<0||!docs.includes(tDoc)) tDoc=docs[0];
  $("tDocs").innerHTML=docs.map(d=>'<button class="chip" data-i="'+d+'" aria-pressed="'+(tDoc===d)+'">'+esc(D[d].name)+'</button>').join("");
  $("tDocs").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{tDoc=+b.dataset.i;renderTerms();});
  const ts=DATA.terms.filter(t=>t.d===tDoc);
  $("termStage").innerHTML='<p class="note"><mark style="background:var(--marker);color:var(--marker-ink);padding:0 5px;border-radius:4px;font-weight:700">sarı</mark> — sənəddə rənglənmiş və ya xətt çəkilmiş</p>'+
    ts.map(t=>'<div class="tgroup"><h4>'+esc(t.g)+'</h4>'+t.rows.map(r=>'<div class="trow"><span class="w">'+esc(r[0])+'</span><span class="v">'+(r[3]?'<mark>'+esc(r[1])+'</mark>':esc(r[1]))+'</span><span class="r">'+esc(r[2])+'</span></div>').join("")+'</div>').join("");
}

applyTheme(); show("home");
</script>
</body>
</html>
