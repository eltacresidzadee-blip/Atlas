.4: cinayətlər, gömrük qaydaları əleyhinə inzibati xətalar və digər hüquqpozmalar."},{"d":5,"c":5,"id":"sio-rq0","r":"Bənd 1.2","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən “Səlahiyyətli iqtisadi operator” kimdir?","o":["Ümumdünya Gömrük Təşkilatının norma və standartlarına uyğun olaraq, malların təyinat yerinə çatdırılmasının təhlükəsizliyinin təmin edilməsi və xarici ticarətin asanlaşdırılması məqsədi ilə gömrük nəzarətinin sadələşdirilmiş forma və üsullarından istifadə edən hüquqi şəxs","Gömrük nəzarətinin sadələşdirilmiş forma və üsullarından istifadə edən fiziki və ya hüquqi şəxs","Gömrük orqanı adından bəyannaməçi kimi çıxış edən gömrük brokeri","Xarici ticarət əməliyyatlarını həyata keçirən istənilən sahibkar"],"e":"Bənd 1.2: SİO yalnız HÜQUQİ şəxs ola bilər.","ex":1},{"d":5,"c":5,"id":"sio-rq1","r":"Bənd 1.3","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən səlahiyyətli iqtisadi operatorlara Gömrük Məcəlləsində nəzərdə tutulmuş gömrük prosedurlarının sadələşdirilmiş forma və üsullarından istifadə etmək üçün müəyyən hüquqlar kim tərəfindən verilir?","o":["Azərbaycan Respublikasının Dövlət Gömrük Komitəsi","Nazirlər Kabineti","İqtisadiyyat Nazirliyi","Ərazi gömrük idarəsi"],"e":"Bənd 1.3.","ex":1},{"d":5,"c":5,"id":"sio-rq2","r":"Bənd 1.4","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən gömrük orqanları və səlahiyyətli iqtisadi operatorlar arasında qarşılıqlı tərəfdaşlıq əlaqələri hansı məqsədlə yaradılır?","o":["Beynəlxalq ticarət-təchizat zəncirinin təhlükəsizliyinin təmin edilməsi məqsədi ilə","Gömrük ödənişlərinin artırılması məqsədi ilə","Gömrük brokerlərinin fəaliyyətinə nəzarət məqsədi ilə","Vergi uçotunun sadələşdirilməsi məqsədi ilə"],"e":"Bənd 1.4.","ex":1},{"d":5,"c":5,"id":"sio-rq3","r":"Bənd 3.10","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən gömrük orqanları və səlahiyyətli iqtisadi operatorlar  hansı halda öz aralarında təqdim olunması gömrük qanunvericiliyi ilə bilavasitə tələb edilməyən məlumatların da mübadiləsini həyata keçirirlər?","o":["Xarici ticarətdə risklərin müəyyənləşdirilməsi və qarşısının alınması üzrə tədbirlərin hazırlanmasında əməkdaşlıq məqsədi ilə","Gömrük ödənişlərinin hesablanması məqsədi ilə","Statistik hesabatların hazırlanması məqsədi ilə","Məhkəmə qərarı olduqda"],"e":"Bənd 3.10.","ex":1},{"d":5,"c":5,"id":"sio-rq4","r":"Bənd 3.5","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən gömrük orqanları tərəfindən səlahiyyət verildikdə, səlahiyyətli iqtisadi operator malların eyniləşdirilməsi tədbirlərini hansı məqsədlə həyata keçirir?","o":["Malların bəyan edildiyi gömrük prosedurunu tənzimləyən şərtlərə əməl olunmasını təmin etmək məqsədi ilə","Gömrük ödənişlərindən azad olunmaq məqsədi ilə","Malların gömrük dəyərini müəyyən etmək məqsədi ilə","Gömrük ekspertizasını əvəz etmək məqsədi ilə"],"e":"Bənd 3.5: Gömrük Məcəlləsinin 87-ci maddəsinə uyğun.","ex":1},{"d":5,"c":5,"id":"sio-rq5","r":"Bənd 2.1","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən aşağıdakılardan hansı səlahiyyətli iqtisadi operator statusunun verilməsi üçün şərtlərə aiddir?","o":["Hüquqi şəxsin fəaliyyət göstərdiyi sahədə ən azı 2 (iki) il təcrübəsinin olması","Hüquqi şəxsin fəaliyyət göstərdiyi sahədə ən azı 5 il təcrübəsinin olması","Nizamnamə kapitalının ən azı 1 milyon manat olması","Hüquqi şəxsin xarici investisiyalı olması"],"e":"Bənd 2.1: 7 şərt — ÜGT təhlükəsizlik standartlarına uyğun çatdırılma imkanı, gömrük və vergi qanunvericiliyinə riayət, sənədlərin idarə edilməsi sistemi, maliyyə imkanları, ən azı 2 il təcrübə, təhlükəsizlik və mühafizə standartları, texniki baza.","ex":1},{"d":5,"c":5,"id":"sio-rq6","r":"Bənd 2.1","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən aşağıdakılardan hansı səlahiyyətli iqtisadi operator statusunun verilməsi üçün şərtlərə aid deyil?","o":["Hüquqi şəxsin ən azı 50 işçisinin olması","Gömrük və vergi qanunvericiliyinin tələblərinə riayət edilməsi","Gömrük ödənişlərini və digər ödənişləri həyata keçirmək üçün maliyyə imkanlarının olması","İnformasiya mübadiləsini lazımi səviyyədə təmin edən texniki bazanın olması"],"e":"Bənd 2.1 (7 şərt). İşçi sayı şərti yoxdur.","ex":1},{"d":5,"c":5,"id":"sio-rq7","r":"Bənd 2.3","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən səlahiyyətli iqtisadi operator statusunun alınması üçün Dövlət Gömrük Komitəsinə ünvanlanan ərizəyə aşağıda qeyd olunan sənədlərdən hansı əlavə olunmalıdır?","o":["2 (iki) ildən az olmayan müddətdə xarici iqtisadi fəaliyyətin həyata keçirilməsi təcrübəsini təsdiq edən gömrük sənədlərinin surəti","Son 5 ilin maliyyə hesabatlarının audit rəyi","Vergi orqanından borcu olmaması barədə arayış","İşçilərin siyahısı və əmək müqavilələrinin surətləri"],"e":"Bənd 2.3: 3 sənəd — dövlət qeydiyyatı şəhadətnaməsi (reyestrdən çıxarış) və nizamnamənin notarial surəti; maliyyə imkanlarını təsdiq edən bank hesabına dair sənəd; 2 ildən az olmayan təcrübəni təsdiq edən gömrük sənədlərinin surəti.","ex":1},{"d":5,"c":5,"id":"sio-rq8","r":"Bənd 2.3","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən səlahiyyətli iqtisadi operator statusunun alınması üçün Dövlət Gömrük Komitəsinə ünvanlanan ərizədə  aşağıda göstərilən sənədlərdən hansı əlavə edilmir?","o":["Vergi orqanından borcun olmaması barədə arayış","Hüquqi şəxsin dövlət qeydiyyatı haqqında şəhadətnamənin və nizamnaməsinin notariat qaydasında təsdiq olunmuş surəti","Maliyyə imkanlarının olmasını təsdiq edən bank hesabına dair sənəd","2 ildən az olmayan xarici iqtisadi fəaliyyət təcrübəsini təsdiq edən gömrük sənədlərinin surəti"],"e":"Bənd 2.3 (3 sənəd). 2.3-1: Elektron Hökumət İnformasiya Sistemi vasitəsilə əldə edilə bilən sənədlər ərizəçidən tələb edilmir.","ex":1},{"d":5,"c":5,"id":"sio-rq9","r":"Bənd 4.4","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən aşağıda qeyd olunanlardan hansı səlahiyyətli iqtisadi operator statusunun ləğv olunması hallarına aid deyil?","o":["Səlahiyyətli iqtisadi operator statusunun verilməsi üçün müəyyən edilmiş şərtlərə riayət olunmadıqda","Səlahiyyətli iqtisadi operator tərəfindən bu barədə müvafiq ərizə təqdim edildikdə","Səlahiyyətli iqtisadi operator statusu almış hüquqi şəxs ləğv edildikdə","Müvəqqəti dayandırılmaya səbəb olmuş hallar 6 ay müddətində aradan qaldırılmadıqda"],"e":"Şərtlərə riayət olunmaması müvəqqəti DAYANDIRMA əsasıdır (4.1.2), ləğv əsası deyil. Ləğv halları 4.4.1–4.4.6-dır.","ex":1},{"d":5,"c":5,"id":"sio-rq10","r":"Bənd 4.4","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən aşağıda qeyd olunanlardan hansı səlahiyyətli iqtisadi operator statusunun ləğv olunması hallarına aiddir?","o":["Səlahiyyətli iqtisadi operatorun cinayətlərə, həmçinin gömrük qaydaları əleyhinə inzibati xətalara və digər hüquqpozmalara yol verdiyi aşkar edildikdə","Səlahiyyətli iqtisadi operator statusunun verilməsi üçün müəyyən edilmiş şərtlərə riayət olunmadıqda","Səlahiyyətli iqtisadi operatorun rəhbəri dəyişdikdə","Səlahiyyətli iqtisadi operator 3 ay ərzində gömrük əməliyyatı aparmadıqda"],"e":"Bənd 4.4.4.","ex":1},{"d":5,"c":5,"id":"sio-rq11","r":"Bənd 4.1","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən aşağıda qeyd olunanlardan hansı səlahiyyətli iqtisadi operator statusunun müvəqqəti dayandırılması hallarına aiddir?","o":["Səlahiyyətli iqtisadi operator statusunun verilməsi üçün müəyyən edilmiş şərtlərə riayət olunmadıqda","Səlahiyyətli iqtisadi operator statusu almış hüquqi şəxs ləğv edildikdə","Təqdim edilmiş sənədlərdə yanlış məlumatlar aşkar edildikdə","Cinayət və ya gömrük qaydaları əleyhinə inzibati xəta aşkar edildikdə"],"e":"Bənd 4.1: 3 hal (6 ayadək dayandırma) — SİO-nun ərizəsi, şərtlərə riayət olunmaması, məhkəmənin qərarı. Digər variantlar ləğv halları (4.4) arasındadır.","ex":1},{"d":5,"c":5,"id":"sio-rq12","r":"Bənd 4.1","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən aşağıda qeyd olunanlardan hansı səlahiyyətli iqtisadi operator statusunun müvəqqəti dayandırılması hallarına aid deyil?","o":["Səlahiyyətli iqtisadi operator statusu almış hüquqi şəxs ləğv edildikdə","Səlahiyyətli iqtisadi operator tərəfindən bu barədə müvafiq ərizə təqdim edildikdə","Statusun verilməsi üçün müəyyən edilmiş şərtlərə riayət olunmadıqda","Məhkəmənin müvafiq qərarı olduqda"],"e":"Hüquqi şəxsin ləğvi statusun LƏĞV əsasıdır (4.4.3), dayandırma əsası deyil.","ex":1},{"d":5,"c":5,"id":"sio-rq13","r":"Bənd 4.5","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən Dövlət Gömrük Komitəsi tərəfindən səlahiyyətli iqtisadi operator statusunun ləğv edilməsi haqqında qərar qəbul etdiyi zaman hansı tədbir görülür?","o":["Qərar qəbul etdiyi andan 1 (bir) iş günü müddətində hüquqi şəxsə və ərazi vergi orqanına məlumat göndərir","Qərar qəbul etdiyi gündən 3 iş günü müddətində hüquqi şəxsə və ərazi vergi orqanlarına məlumat göndərir","Qərarı 10 gün ərzində rəsmi saytda dərc edir","Qərarı 5 iş günü ərzində İqtisadiyyat Nazirliyinə göndərir"],"e":"Bənd 4.5: ləğvdə — 1 iş günü; dayandırmada — 3 iş günü (4.2).","ex":1,"t":1},{"d":5,"c":5,"id":"sio-rq14","r":"Bənd 4.2","q":"“Səlahiyyətli iqtisadi operator statusunun verilməsi, müvəqqəti dayandırılması və ləğv olunması Qaydaları”na əsasən səlahiyyətli iqtisadi operator statusunun fəaliyyətinin dayandırılması haqqında qərar qəbul etdiyi zaman Dövlət Gömrük Komitəsi tərəfindən hansı tədbir görülür?","o":["Qərar qəbul etdiyi gündən 3 (üç) iş günü müddətində hüquqi şəxsə və ərazi vergi orqanlarına məlumat göndərir","Qərar qəbul etdiyi andan 1 iş günü müddətində hüquqi şəxsə və ərazi vergi orqanına məlumat göndərir","Qərarı 5 iş günü ərzində hüquqi şəxsə göndərir","Qərarı 30 gün ərzində məhkəməyə təqdim edir"],"e":"Bənd 4.2: dayandırmada — 3 iş günü; ləğvdə — 1 iş günü (4.5). Dayandırma 6 ayadək olur.","ex":1,"t":1},{"d":6,"c":0,"id":"dq-0","r":"Rekvizitlər","q":"“Dövlət qulluqçularının etik davranış qaydaları haqqında” Qanun nə vaxt qəbul olunub və nömrəsi nədir?","o":["31 may 2007-ci il, № 352-IIIQ","31 may 2007-ci il, № 325-IIIQ","30 sentyabr 2005-ci il, № 1024-IIQ","13 iyun 2013-cü il, № 687-IVQ"],"e":"Qanun 31.05.2007 tarixli, 352-IIIQ nömrəlidir. 1024-IIQ “İnformasiya əldə etmək haqqında” Qanundur.","t":1},{"d":6,"c":0,"id":"dq-1","r":"Maddə 24","q":"Qanun nə vaxt qüvvəyə minir?","o":["Dərc edildiyi gündən","Dərc edildiyi gündən 90 gün sonra","Növbəti ilin 1 yanvarından","İmzalandığı gündən 30 gün sonra"],"e":"Maddə 24. “Gömrük tarifi haqqında” Qanun isə dərcdən 90 gün sonra qüvvəyə minib."},{"d":6,"c":0,"id":"dq-2","r":"Preambula","q":"Qanunun preambulasına görə Qanun nəyi müəyyən edir?","o":["Dövlət qulluqçuları üçün etik davranış qaydalarını və prinsiplərini, onlara əməl edilməsi ilə bağlı hüquqi mexanizmləri","Dövlət qulluğuna qəbulun qaydalarını","Dövlət qulluqçularının intizam tənbehlərini","Dövlət qulluqçularının əmək haqqını"],"e":"Preambula (qırmızı ilə vurğulanıb).","hl":1},{"d":6,"c":0,"id":"dq-3","r":"Əlaqə, Etik Kodeks 1.1","q":"Gömrük orqanlarının Etik Davranış Kodeksi bu Qanunun hansı maddəsinə əsasən hazırlanıb?","o":["21.2.8-ci maddəsinə","20.1-1-ci maddəsinə","22.1-ci maddəsinə","3.3-cü maddəsinə"],"e":"Etik Kodeks, 1.1. Qanunun 21.2.8-ci maddəsinə görə dövlət orqanının rəhbəri etik qaydaları konkretləşdirən aktları hazırlayıb təsdiq etməlidir. 3.3-cü maddə də buna imkan verir."},{"d":6,"c":1,"id":"dq-4","r":"Maddə 1","q":"Qanun kimlərə şamil edilir?","o":["Dövlət qulluqçusu statusuna malik olan bütün şəxslərə","Yalnız inzibati vəzifələrdə olan dövlət qulluqçularına","Yalnız rəhbər vəzifəli şəxslərə","Bütün dövlət orqanı işçilərinə, texniki işçilər də daxil olmaqla"],"e":"Maddə 1 (“bütün şəxslərə” qırmızı).","hl":1},{"d":6,"c":1,"id":"dq-5","r":"Maddə 1","q":"Dövlət qulluqçusu Qanuna əməl edərkən nəyi rəhbər tutmalıdır?","o":["Qanunun aliliyini, insan hüquqlarını, demokratik prinsipləri və yüksək etik davranış qaydalarını","Rəhbərinin göstərişlərini","Dini və milli dəyərləri","Kollektivin rəyini"],"e":"Maddə 1, ikinci abzas (qırmızı).","hl":1},{"d":6,"c":1,"id":"dq-6","r":"Maddə 2","q":"Qanunun neçə məqsədi var?","o":["6","5","4","7"],"e":"Maddə 2.0.1–2.0.6. Gömrük Etik Kodeksinin isə 5 məqsədi var. Saylar fərqlidir, qarışdırmayın.","hl":1,"t":1},{"d":6,"c":1,"id":"dq-7","r":"Maddə 2","q":"Aşağıdakılardan hansı Qanunun məqsədi kimi göstərilib, gömrük Etik Kodeksinin məqsədlərində isə yoxdur?","o":["Dövlət orqanlarının fəaliyyətinin qiymətləndirilməsinə vətəndaşların təsiri imkanlarının genişləndirilməsi","Səmərəliliyin və şəffaflığın artırılması","Korrupsiyanın və maraqların toqquşmasının qarşısının alınması","Nüfuzun artırılması və etimadın yüksəldilməsi"],"e":"Maddə 2.0.6 (qırmızı ilə vurğulanıb). Digər üçü hər iki sənəddə var.","hl":1},{"d":6,"c":1,"id":"dq-8","r":"Maddə 2.0.4","q":"2.0.4-cü maddəyə görə Qanunun məqsədlərindən biri nədir?","o":["Dövlət qulluqçuları tərəfindən etik davranış qaydalarına əməl olunmasının təmin edilməsi","Dövlət qulluqçularının əmək haqlarının artırılması","Etik davranış qaydalarının dərc edilməsi","Dövlət qulluqçularının attestasiyası"],"e":"Maddə 2.0.4 (qırmızı, yanında “fokuslanma” qeydi).","hl":1},{"d":6,"c":1,"id":"dq-9","r":"Maddə 2.0.5","q":"Qanunun 2.0.5-ci maddəsinə görə kim, nə barədə məlumatlandırılmalıdır?","o":["Vətəndaşlar, dövlət qulluqçularından gözlənilən davranış barədə","Dövlət qulluqçuları, vətəndaşların hüquqları barədə","Media, dövlət orqanlarının fəaliyyəti barədə","Rəhbərlər, tabeliyindəki işçilərin davranışı barədə"],"e":"Maddə 2.0.5 (qırmızı).","hl":1},{"d":6,"c":1,"id":"dq-10","r":"Maddə 3.1","q":"Qanuna görə dövlət qulluqçusunun “xidməti davranışı” nədir?","o":["Qanunvericiliklə ona verilmiş hüquqların həyata keçirilməsi və vəzifələrinin yerinə yetirilməsi ilə əlaqədar fəaliyyəti","İş vaxtında etdiyi bütün hərəkətlər","Rəhbərlə münasibəti","Vətəndaşlarla ünsiyyəti"],"e":"Maddə 3.1 (qırmızı).","hl":1},{"d":6,"c":1,"id":"dq-11","r":"Maddə 3.3","q":"Etik davranış qaydalarını dəqiqləşdirən normalar başqa aktlarla müəyyən edilə bilərmi?","o":["Bəli, dövlət orqanlarının digər normativ hüquqi aktları ilə; lakin onlar bu Qanuna zidd olmamalıdır","Xeyr, yalnız bu Qanunla","Bəli, məhdudiyyət olmadan","Yalnız Prezident fərmanı ilə"],"e":"Maddə 3.3 (qırmızı). Gömrük Etik Kodeksi belə aktdır.","hl":1},{"d":6,"c":2,"id":"dq-12","r":"Maddə 4","q":"Vicdanlı davranış qaydasına görə dövlət qulluqçusu vəzifə borcunu kimin maraqları naminə yerinə yetirir?","o":["Şəxsin, cəmiyyətin və dövlətin","Yalnız dövlətin","Dövlət orqanının rəhbərliyinin","Yalnız vətəndaşların"],"e":"Maddə 4.1 (qırmızı): səmərəli yerinə yetirməyə borcludur.","hl":1},{"d":6,"c":2,"id":"dq-13","r":"Maddə 4.2","q":"4.2-ci maddəyə görə dövlət qulluqçusu bütün hallarda nə olmalıdır?","o":["Hər bir şəxs üçün vicdanlılıq nümunəsi","Rəhbəri üçün sadiqlik nümunəsi","Həmkarları üçün peşəkarlıq nümunəsi","Cəmiyyət üçün siyasi nümunə"],"e":"Maddə 4.2. Gömrük Kodeksində (5.2) isə “cəmiyyət üçün” yazılıb."},{"d":6,"c":2,"id":"dq-14","r":"Maddə 5.2","q":"Dövlət qulluqçusu etik davranışı və peşəkar fəaliyyəti ilə nəyi artırmalı və möhkəmləndirməlidir?","o":["Hüquqi və fiziki şəxslərin dövlət orqanlarına inamını","Öz karyera imkanlarını","Dövlət büdcəsinin gəlirlərini","Rəhbərinin nüfuzunu"],"e":"Maddə 5.2 (qırmızı). Gömrük Kodeksində bu müddəa “İctimai etimad” maddəsindədir (8.3).","hl":1},{"d":6,"c":2,"id":"dq-15","r":"Maddə 6","q":"Qanunun 6-cı maddəsində “loyallıq” sözü mötərizədə necə izah olunub?","o":["Sadiqlik","Dürüstlük","Tabelilik","Bitərəflik"],"e":"Maddə 6: “Loyallıq (sadiqlik)”.","hl":1},{"d":6,"c":2,"id":"dq-16","r":"Maddə 6.1","q":"Loyallıq qaydasında tənqidi ictimai mülahizələrdən çəkinmə ilə bağlı neçə şərt və istisna qeyd olunub (sənəddə nömrələnib)?","o":["3: xidməti vəzifəyə aid olmayan hallar; qanunsuz fəaliyyət istisnası; elmi-pedaqoji çıxışlar istisnası","2: yalnız qanunsuz fəaliyyət və elmi yazılar","4: media, siyasət, elm, din","1: yalnız xidməti vəzifəyə aid olmayan hallar"],"e":"Maddə 6.1: sənəddə 1, 2, 3 kimi nömrələnib (qırmızı).","hl":1,"t":1},{"d":6,"c":2,"id":"dq-17","r":"Maddə 6.1","q":"Dövlət qulluqçusu dövlət orqanının fəaliyyətini hansı halda tənqid edə bilər?","o":["Qanunsuz fəaliyyət olduqda və ya elmi-pedaqoji çıxışlarında, elmi yazılarında","Sosial şəbəkədə şəxsi səhifəsində","Rəhbərinin icazəsi ilə istənilən mediada","Heç bir halda"],"e":"Maddə 6.1 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-18","r":"Maddə 6.3","q":"Açıq çıxışlarla bağlı dövlət qulluqçusu nəyə əməl etməlidir?","o":["Dövlət orqanının müəyyən etdiyi qaydalara","Yalnız mətbuat xidmətinin göstərişinə","Medianın tələblərinə","Heç bir qayda yoxdur"],"e":"Maddə 6.3 (qırmızı). Gömrük Kodeksində (10.2) isə açıq çıxış yalnız xüsusi səlahiyyət verildikdə mümkündür.","hl":1},{"d":6,"c":2,"id":"dq-19","r":"Maddə 7.1","q":"İctimai etimad qaydasına görə dövlət qulluqçusu nəyin nüfuzunu möhkəmləndirməyə borcludur?","o":["Azərbaycan Respublikasının, dövlət orqanının və dövlət qulluğunun; öz adını və şərəfini də uca tutmalıdır","Yalnız öz dövlət orqanının","Yalnız rəhbərinin","Siyasi partiyasının"],"e":"Maddə 7.1 (mavi ilə rənglənib və qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-20","r":"Maddə 7.2","q":"Etik qaydaları pozmuş dövlət qulluqçusu 7.2-ci maddəyə görə nə etməlidir?","o":["Pozuntunun nəticələrini aradan qaldırmalı və ictimai etimadın bərpası üçün tədbirlər görməlidir","İstefa verməlidir","Mediada üzr istəməlidir","Yalnız izahat yazmalıdır"],"e":"Maddə 7.2 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-21","r":"Maddə 7.3","q":"Dövlət qulluqçusu media subyektlərinə münasibətdə nə etməlidir?","o":["Qanunla müəyyən edilmiş hallarda və qaydada doğru (dürüst) məlumat almalarına köməklik göstərməlidir","Onlarla heç bir əlaqə saxlamamalıdır","Onlara istənilən məlumatı verməlidir","Yalnız rəhbərin icazəsi ilə müsahibə verməlidir"],"e":"Maddə 7.3 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-22","r":"Maddə 8.1","q":"8.1-ci maddəyə görə dövlət qulluqçularının fəaliyyəti nəyə xidmət etməlidir?","o":["İnsanların hüquq, azadlıq və qanuni maraqlarının təmin olunmasına (qorunmasına və müdafiəsinə)","Dövlət orqanının maraqlarına","Büdcə gəlirlərinin artırılmasına","Rəhbərin tapşırıqlarına"],"e":"Maddə 8.1 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-23","r":"Maddə 8.3","q":"Dövlət qulluqçusu fiziki şəxslərin və digər dövlət qulluqçularının şəxsi həyatı barədə məlumatlara münasibətdə nəyi təmin etməlidir?","o":["Konfidensiallığını, qanunvericiliklə nəzərdə tutulmuş hallar istisna olmaqla","Açıqlığını","Arxivləşdirilməsini","Rəhbərə ötürülməsini"],"e":"Maddə 8.3 (“konfidensiallığını” qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-24","r":"Maddə 8.4","q":"8.4-cü maddəyə görə dövlət qulluqçusu kimin işgüzar nüfuzuna hörmətlə yanaşmalıdır?","o":["Hüquqi şəxslərin","Yalnız dövlət müəssisələrinin","Yalnız xarici şirkətlərin","Siyasi partiyaların"],"e":"Maddə 8.4."},{"d":6,"c":2,"id":"dq-25","r":"Maddə 9","q":"Mədəni davranış qaydasına görə dövlət qulluqçusu hansı keyfiyyətləri göstərməlidir?","o":["Nəzakətli, xeyirxah, diqqətli və səbrli","Sərt, tələbkar və qısa","Rəsmi, soyuq və təmkinli","Səmimi, dostyana və açıq"],"e":"Maddə 9 (qırmızı): bütün şəxslərə, rəhbərə və tabeliyindəkilərə münasibətdə.","hl":1},{"d":6,"c":2,"id":"dq-26","r":"Maddə 10.1","q":"Dövlət qulluqçusu rəhbərinin əmrini yerinə yetirməyə hansı iki şərt olduqda borcludur?","o":["Əmr qanuna uyğun olmalı və rəhbər onu səlahiyyətləri daxilində qəbul etməlidir","Əmr yazılı olmalı və kollektiv tərəfindən bəyənilməlidir","Əmr notarial təsdiqlənməli və möhürlənməlidir","Əmr həmkarlar ittifaqı ilə razılaşdırılmalıdır"],"e":"Maddə 10.1 (qırmızı, sənəddə 1 və 2 kimi nömrələnib).","hl":1},{"d":6,"c":2,"id":"dq-27","r":"Maddə 10.1","q":"10.1-ci maddəyə görə dövlət qulluqçusu hansı formada verilən göstərişləri yerinə yetirməyə borcludur?","o":["Yazılı əmri, sərəncamı və ya şifahi tapşırıqları","Yalnız yazılı əmrləri","Yalnız elektron sərəncamları","Yalnız notarial təsdiqlənmiş göstərişləri"],"e":"Maddə 10.1 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-28","r":"Maddə 10.2","q":"Dövlət qulluqçusu əmrin qanuna zidd olduğuna əmindirsə, ilk olaraq nə etməlidir?","o":["Yazılı əsaslandırmanı birbaşa və ya yuxarı rəhbərinə təqdim etməli və birbaşa rəhbərdən əmrin yazılı təsdiqini tələb etməlidir","Dərhal imtina etməlidir","Prokurorluğa şikayət etməlidir","Əmri yerinə yetirib sonra şikayət etməlidir"],"e":"Maddə 10.2 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-29","r":"Maddə 10.2","q":"Yazılı təsdiq aldıqdan sonra da dövlət qulluqçusu əmrin qanuna zidd olduğuna inanırsa, nə edə bilər?","o":["Əmrin yerinə yetirilməsindən imtina edə bilər","Əmri mütləq yerinə yetirməlidir","İşdən çıxmalıdır","Əmri yarımçıq yerinə yetirməlidir"],"e":"Maddə 10.2 (“imtina edə bilər” qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-30","r":"Maddə 10.3","q":"Qanuni göstərişlərin yerinə yetirilməməsi nəyə səbəb olur?","o":["İntizam məsuliyyətinə","Cinayət məsuliyyətinə","İnzibati cəriməyə","Heç bir məsuliyyətə"],"e":"Maddə 10.3 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-31","r":"Maddə 11.2","q":"Qərəzsizlik qaydasında dövlət qulluqçusu xidməti vəzifələrini yerinə yetirərkən nəyə əməl etməyə borcludur?","o":["Siyasi bitərəfliyə","Partiya intizamına","Dini neytrallığa","Korporativ etikaya"],"e":"Maddə 11.2 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-32","r":"Maddə 11.1","q":"Qərəzsizlik qaydasında hansı əlamətə görə üstünlük verilməsi qadağasının adı çəkilir?","o":["Qulluq vəziyyətinə və dinə münasibətinə görə","Yaşına görə","Təhsilinə görə","Yaşayış yerinə görə"],"e":"Maddə 11.1: irq, milliyyət, din, dil, cins, sosial mənşə, əmlak və qulluq vəziyyəti, dinə münasibət, əqidə, birliyə mənsubiyyət."},{"d":6,"c":2,"id":"dq-33","r":"Maddə 11.3","q":"11.3-cü maddəyə görə dövlət qulluqçusu nəyə yol verməməlidir?","o":["Özünün və ya maraqlı şəxslərin mənafelərinin xidməti vəzifələrinə təsirinə; bu cür təsir üçün şərait yaratmamalıdır","Həmkarlarına kömək etməyə","Vətəndaşlarla görüşməyə","Elmi fəaliyyətə"],"e":"Maddə 11.3 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-34","r":"Maddə 12.3","q":"Qanunla əvəzsiz xidmət göstərən dövlət qulluqçusu həmin xidmətə görə nə tələb edə bilməz?","o":["Hər hansı haqq","Yalnız nəzərdə tutulandan artıq haqq","Yalnız nağd ödəniş","Rəsmi qəbz"],"e":"Maddə 12.3 (“hər hansı haqq” qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-35","r":"Maddə 12.4","q":"Ödənişli xidmət göstərən dövlət qulluqçusu nə tələb edə bilməz?","o":["Nəzərdə tutulan məbləğdən artıq haqq","Ümumiyyətlə heç bir haqq","Qəbz","Şəxsiyyət vəsiqəsi"],"e":"Maddə 12.4 (bənövşəyi ilə rənglənib, “artıq haqq” qırmızı). Fərqə diqqət: əvəzsiz xidmətdə heç bir haqq (12.3), ödənişli xidmətdə yalnız artıq haqq (12.4) tələb oluna bilməz.","hl":1},{"d":6,"c":2,"id":"dq-36","r":"Maddə 12.2","q":"12.2-ci maddəyə görə dövlət qulluqçusu hansı tədbirləri görməlidir?","o":["Hərəkətlərinin və qərarlarının maddi və qeyri-maddi nemət əldə etməyə gətirib çıxarmasını istisna edən tədbirlər","Nemətlərin uçotunu aparan tədbirlər","Nemətlərin rəhbərə təhvil verilməsi tədbirləri","Heç bir tədbir tələb olunmur"],"e":"Maddə 12.2 (“istisna edən” qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-37","r":"Maddə 13.1","q":"Qanuna görə nemət dövlət qulluqçusuna ondan asılı olmayan səbəblərdən verilibsə, o, kimə məlumat verməlidir?","o":["Birbaşa rəhbərinə; nemət isə dövlət orqanına akt üzrə təhvil verilir","Korrupsiya ilə Mübarizə İdarəsinə","Etik davranış üzrə müvəkkilə","Prokurorluğa"],"e":"Qanun, maddə 13.1: birbaşa rəhbərə. Gömrük Etik Kodeksində (13.3) isə korrupsiya hüquqpozmaları üzrə səlahiyyətli bölməyə məlumat verilir."},{"d":6,"c":2,"id":"dq-38","r":"Maddə 13.2","q":"Tərəflərdən biri dövlət qulluqçusunun qulluq keçdiyi dövlət orqanı olan əqdlərdə nə qadağandır?","o":["Həmin dövlət qulluqçusunun digər tərəf olması","Əqdin yazılı bağlanması","Əqdin notarial təsdiqi","Əqdin dərc edilməsi"],"e":"Maddə 13.2 (qırmızı).","hl":1},{"d":6,"c":2,"id":"dq-39","r":"Maddə 14.1","q":"Qanuna görə hədiyyə qadağası hansı hədiyyələrə şamil edilmir?","o":["Qonaqpərvərliklə bağlı və dəyəri “Korrupsiyaya qarşı mübarizə haqqında” Qanunda nəzərdə tutulmuş məbləğdən yuxarı olmayan hədiyyələrə","Bütün bayram hədiyyələrinə","Rəhbərin icazə verdiyi hədiyyələrə","Dəyəri 100 manatdan az olan hər hansı hədiyyəyə"],"e":"Maddə 14.1 (qırmızı). Gömrük Kodeksində (14.1) bu, “kiçik hədiyyələr və sadə qonaqpərvərlik” kimi ifadə olunub.","hl":1},{"d":6,"c":2,"id":"dq-40","r":"Maddə 14.2","q":"Qanuna görə dövlət qulluqçusu hədiyyəni qəbul edib-etməməklə bağlı qərara gələ bilmirsə, kimin rəyini öyrənməlidir?","o":["Birbaşa rəhbərinin","Etik davranış üzrə müvəkkilin","Korrupsiya ilə mübarizə bölməsinin","Hüquq şöbəsinin"],"e":"Qanun, maddə 14.2 (qırmızı): birbaşa rəhbər. Gömrük Etik Kodeksində (14.2) isə korrupsiya hüquqpozmaları üzrə səlahiyyətli bölmənin rəyi öyrənilir. Bu, mühüm tələdir.","hl":1},{"d":6,"c":2,"id":"dq-41","r":"Maddə 15.2","q":"Maraqların toqquşması ehtimalı barədə dövlət qulluqçusu nə vaxt məlumat verməlidir?","o":["Dövlət qulluğuna qəbul olunduqda və bundan sonrakı dövrdə","Yalnız qulluqdan çıxarkən","Yalnız attestasiya zamanı","Yalnız rəhbər tələb etdikdə"],"e":"Maddə 15.2."},{"d":6,"c":2,"id":"dq-42","r":"Maddə 15.3","q":"Başqa vəzifəyə keçmə təklifi maraqların toqquşmasına səbəb ola bilərsə, dövlət qulluqçusu kimə məlumat verməlidir?","o":["Dövlət orqanının rəhbərinə","Birbaşa rəhbərinə","Etik müvəkkilə","Nəzarət orqanına"],"e":"Maddə 15.3. Gömrük Kodeksinin 15.4-cü bəndi də eynidir: gömrük orqanının rəhbərinə."},{"d":6,"c":2,"id":"dq-43","r":"Maddə 15.3","q":"Dövlət qulluğuna xitam verildikdən sonra hansı məhdudiyyət var?","o":["Qanunla müəyyən edilmiş müddət ərzində əvvəllər fəaliyyətinə nəzarət etdiyi təşkilatlara işə qəbul edilə bilməz","Heç bir məhdudiyyət yoxdur","5 il ərzində dövlət qulluğuna qayıda bilməz","Xaricə gedə bilməz"],"e":"Maddə 15.3, ikinci cümlə."},{"d":6,"c":2,"id":"dq-44","r":"Maddə 15.5","q":"Dövlət qulluqçusu etik qaydalar, korrupsiya və maraqların toqquşması ilə bağlı aktlarla nə vaxt tanış olmalıdır?","o":["Vəzifəyə təyin edilərkən və bundan sonrakı müddətdə","Yalnız attestasiyadan əvvəl","Yalnız intizam icraatı başlayanda","Yalnız ilk iş günündə"],"e":"Maddə 15.5: suallar yarandıqda birbaşa və ya yuxarı rəhbərə müraciət etməlidir."},{"d":6,"c":2,"id":"dq-45","r":"Maddə 16","q":"Dövlət əmlakından istifadə ilə bağlı Qanunun tələbi hansıdır?","o":["Qənaətlə və səmərəli istifadə; şəxsi maraqlar üçün və xidmətlə əlaqəsi olmayan məqsədlərlə istifadə qadağandır","Rəhbərin icazəsi ilə şəxsi istifadə mümkündür","İş vaxtından kənar istifadə sərbəstdir","Yalnız maliyyə vəsaitlərinin şəxsi istifadəsi qadağandır"],"e":"Maddə 16.1–16.2."},{"d":6,"c":2,"id":"dq-46","r":"Maddə 17.3","q":"Xidməti fəaliyyət zamanı əldə edilmiş məlumatlardan necə istifadə etmək olmaz?","o":["Şəxsi maraqlar üçün","Xidməti məqsədlər üçün","Hesabat hazırlamaq üçün","Qanunla müəyyən edilmiş qaydada yaymaq üçün"],"e":"Maddə 17.3."},{"d":6,"c":2,"id":"dq-47","r":"Maddə 18.1","q":"Ümumi qaydada dövlət qulluqçusunun ictimai və ya siyasi birliyə üzv olmaq hüququ varmı?","o":["Bəli, qanunvericiliklə başqa qayda nəzərdə tutulmayıbsa","Xeyr, heç bir halda","Yalnız həmkarlar ittifaqına","Yalnız rəhbərin icazəsi ilə"],"e":"Qanun, maddə 18.1: ümumi qayda budur. Gömrük Etik Kodeksi (18.1–18.2) isə gömrük əməkdaşlarına siyasi partiyaya üzvlüyü qadağan edir. Bu, “başqa qayda”dır."},{"d":6,"c":2,"id":"dq-48","r":"Maddə 18.2–18.3","q":"Dövlət qulluqçusunun ictimai və ya siyasi fəaliyyəti ilə bağlı hansı tələb var?","o":["Xidməti vəzifələri qərəzsiz və obyektiv yerinə yetirməsinə ictimai şübhə doğurmamalı; digər qulluqçuları belə birliklərə təhrik etməməlidir","Yalnız iş vaxtından kənar olmalıdır","Rəhbərlə razılaşdırılmalıdır","Heç bir tələb yoxdur"],"e":"Maddə 18.2 və 18.3."},{"d":6,"c":2,"id":"dq-49","r":"Maddə 18.4","q":"Dövlət orqanlarında hansı birliyin struktur bölməsini yaratmaq QADAĞAN DEYİL?","o":["Həmkarlar ittifaqının","Siyasi partiyanın","Dini təşkilatın","İctimai birliyin"],"e":"Maddə 18.4."},{"d":6,"c":2,"id":"dq-50","r":"Maddə 18.5","q":"Seçkilər zamanı dövlət qulluqçusuna nə qadağandır?","o":["Vəzifə mövqeyindən və səlahiyyətlərindən özünün və ya digər namizədlərin, partiyaların, blokların xeyrinə istifadə etmək","Səs vermək","Namizəd kimi qeydiyyatdan keçmək haqqında məlumat almaq","Seçki məntəqəsinə getmək"],"e":"Maddə 18.5."},{"d":6,"c":3,"id":"dq-51","r":"Maddə 19","q":"Dövlət qulluqçusunun davranışının etik qaydalara uyğunluğunu kim müntəzəm təhlil edir?","o":["Özü, birbaşa və ya yuxarı rəhbəri","Yalnız nəzarət orqanı","Yalnız etik müvəkkil","Media"],"e":"Maddə 19.0.1."},{"d":6,"c":3,"id":"dq-52","r":"Maddə 20.1","q":"Etik qaydalara əməl olunmasına nəzarəti dövlət orqanının rəhbəri və yuxarı orqan hansı qaydada həyata keçirir?","o":["Dövlət orqanının rəhbəri xidməti qaydada, yuxarı orqan tabeçilik əsasında","Hər ikisi tabeçilik əsasında","Rəhbər tabeçilik əsasında, yuxarı orqan xidməti qaydada","Hər ikisi məhkəmə nəzarəti qaydasında"],"e":"Maddə 20.1 (qırmızı).","hl":1},{"d":6,"c":3,"id":"dq-53","r":"Maddə 20.1-1","q":"Dövlət orqanlarında etik qaydaların tətbiqi, maarifləndirmə və mübahisələrin həlli məsələlərinə kim məsuldur?","o":["Etik davranış üzrə müvəkkil","Dövlət orqanının rəhbəri","Nəzarət orqanı","Hüquq şöbəsi"],"e":"Maddə 20.1-1."},{"d":6,"c":3,"id":"dq-54","r":"Maddə 20.2","q":"Müvafiq icra hakimiyyəti orqanının yaratdığı qurum etik qaydalara nəzarəti nəyə uyğun həyata keçirir?","o":["Nizamnaməsinə","Bu Qanunun 21-ci maddəsinə","Prezidentin göstərişinə","Dövlət orqanının əsasnaməsinə"],"e":"Maddə 20.2."},{"d":6,"c":3,"id":"dq-55","r":"Maddə 21-1.1","q":"Kim etik davranış üzrə müvəkkil ola bilər?","o":["Rəhbər vəzifələrdə ən azı 3 il olmaqla, dövlət qulluğunda inzibati vəzifələrdə 5 ildən çox qulluq keçən, yüksək mənəvi keyfiyyətli şəxs","Dövlət qulluğunda ən azı 3 il işləmiş istənilən şəxs","Hüquq təhsilli və 5 il stajı olan şəxs","Rəhbər vəzifədə 5 il, ümumi stajı 10 il olan şəxs"],"e":"Maddə 21-1.1: rəhbər vəzifə ≥ 3 il, inzibati vəzifələrdə > 5 il.","t":1},{"d":6,"c":3,"id":"dq-56","r":"Maddə 21-1.2","q":"21-1.2-ci maddədə etik müvəkkilin neçə səlahiyyəti sadalanır?","o":["6","5","8","13"],"e":"21-1.2.1–21-1.2.6.","t":1},{"d":6,"c":3,"id":"dq-57","r":"Maddə 21-1.2","q":"Etik müvəkkil təkliflər, tövsiyələr və təqdimatları kimə verir?","o":["Dövlət orqanının rəhbərinə","Nəzarət orqanına","Prezidentə","Məhkəməyə"],"e":"Maddə 21-1.2.1, 21-1.2.3, 21-1.2.5."},{"d":6,"c":3,"id":"dq-58","r":"Maddə 21-1.2","q":"Aşağıdakılardan hansı etik müvəkkilin səlahiyyəti DEYİL?","o":["Pozuntuya yol vermiş dövlət qulluqçusuna intizam tənbehi tətbiq etmək","Etik qaydaların pozulması ilə bağlı müraciətlərə baxmaq","Təlim proqramları hazırlamaq","Normativ hüquqi bazanın təkmilləşdirilməsinə dair təkliflər vermək"],"e":"Müvəkkil tənbeh tətbiq etmir, yalnız rəhbərə təklif və məlumat verir."},{"d":6,"c":3,"id":"dq-59","r":"Maddə 21.2","q":"21.2-ci maddədə dövlət orqanının rəhbərinin neçə vəzifəsi sadalanır?","o":["13","12","10","6"],"e":"21.2.1–21.2.13.","t":1},{"d":6,"c":3,"id":"dq-60","r":"Maddə 21.2.8","q":"21.2.8-ci maddəyə görə dövlət orqanının rəhbəri nə etməlidir?","o":["Etik qaydaları və təminatları konkretləşdirən normativ hüquqi (və ya normativ xarakterli) aktları hazırlamalı və təsdiq etməlidir","Bütün işçiləri etik test imtahanından keçirməlidir","Etik qaydaları Milli Məclisə təqdim etməlidir","Etik müvəkkili seçkilə müəyyən etməlidir"],"e":"Maddə 21.2.8: gömrük Etik Kodeksi məhz buna əsasən hazırlanıb."},{"d":6,"c":3,"id":"dq-61","r":"Maddə 21.2","q":"Aşağıdakılardan hansı dövlət orqanı rəhbərinin 21.2-ci maddədəki vəzifələrinə AİD DEYİL?","o":["İntizam icraatının gedişinə müdaxilə etməmək barədə nəzarət orqanına hesabat vermək","Tabeliyindəkilərə etik qaydaları izah etmək","Pozuntular üzrə görülmüş tədbirlər barədə vətəndaşları məlumatlandırmaq","Etik qaydaları pozanların intizam məsuliyyətinə cəlb edilməsi üçün tədbir görmək"],"e":"Maddə 21.2.7, 21.2.11 və 21.2.9 rəhbərin vəzifələridir. Müdaxilə qadağası (22.2) nəzarət orqanına aiddir."},{"d":6,"c":3,"id":"dq-62","r":"Maddə 22.2","q":"Nəzarət orqanı etik qaydaların pozulması ilə bağlı intizam icraatına müdaxilə edə bilərmi?","o":["Xeyr, hər hansı formada müdaxilə edə bilməz","Bəli, rəy verə bilər","Bəli, icraatı dayandıra bilər","Yalnız yazılı formada"],"e":"Maddə 22.2."},{"d":6,"c":3,"id":"dq-63","r":"Maddə 22.1","q":"Nəzarət orqanı daxil olmuş materiallarda hüquqpozma əlamətləri aşkar etdikdə nə edir?","o":["Materialları yoxlanılması üçün müvafiq orqanlara göndərir","Özü cəza tətbiq edir","Materialları məhv edir","Dövlət orqanının rəhbərini işdən azad edir"],"e":"Maddə 22.1.7."},{"d":6,"c":3,"id":"dq-64","r":"Maddə 22.1","q":"Nəzarət orqanı etik məsələlər üzrə kimlərlə əməkdaşlıq edir?","o":["Qeyri-hökumət təşkilatları, kütləvi informasiya vasitələri və müstəqil ekspertlərlə","Yalnız siyasi partiyalarla","Yalnız beynəlxalq təşkilatlarla","Heç kimlə"],"e":"Maddə 22.1.6."},{"d":6,"c":3,"id":"dq-65","r":"Maddə 23.1–23.2","q":"Etik qaydaların pozulması nə üçün əsasdır və bu, hansı qaydada həyata keçirilir?","o":["İntizam məsuliyyətinə cəlb edilmək üçün; qanunvericiliklə nəzərdə tutulmuş qaydada və müddətdə","Cinayət məsuliyyəti üçün; Cinayət Məcəlləsi ilə","İnzibati məsuliyyət üçün; İnzibati Xətalar Məcəlləsi ilə","Maddi məsuliyyət üçün; Mülki Məcəllə ilə"],"e":"Maddə 23.1–23.2."},{"d":6,"c":3,"id":"dq-66","r":"Maddə 23.3","q":"Etik qaydaların pozulmasına görə intizam icraatına neçə halda başlanıla bilər?","o":["3","2","4","5"],"e":"23.3.1 hüquqi və ya fiziki şəxsin şikayəti və ya məlumatı; 23.3.2 mediada məlumatın dərci; 23.3.3 etik müvəkkilin pozuntunu müəyyən etməsi.","t":1},{"d":6,"c":3,"id":"dq-67","r":"Maddə 23.3","q":"Aşağıdakılardan hansı intizam icraatına başlanması üçün əsas DEYİL?","o":["Anonim sosial media şərhi","Fiziki şəxsin şikayəti","Mediada pozuntu barədə məlumatın dərc edilməsi","Etik müvəkkilin pozuntunu müəyyən etməsi"],"e":"Maddə 23.3.1–23.3.3."},{"d":6,"c":3,"id":"dq-68","r":"Maddə 23.4","q":"İntizam icraatı zamanı cinayət tərkibinin əlamətləri aşkar edildikdə kim, kimə məlumat verməlidir?","o":["Həmin əlamətləri aşkar etmiş dövlət orqanının rəhbəri, cinayət təqibi orqanına","Etik müvəkkil, məhkəməyə","Nəzarət orqanı, Prezidentə","Dövlət qulluqçusunun özü, prokurorluğa"],"e":"Maddə 23.4."},{"d":6,"c":3,"id":"dq-69","r":"Maddə 21.1","q":"21.1-ci maddəyə görə dövlət orqanlarında etik qaydalara əməl olunmasına nəzarəti kim həyata keçirir?","o":["Həmin orqanların müvafiq qurumları","Yalnız Prezident Administrasiyası","Məhkəmələr","Media"],"e":"Maddə 21.1."},{"d":6,"c":4,"id":"dq-rq0","r":"Maddə 4","q":"“Dövlət qulluqçularının etik davranış qaydaları haqqında” Azərbaycan Respublikasının Qanununa əsasən aşağıdakılardan hansı “vicdanlı davranış” etik davranış qaydasının məzmununa aiddir:","o":["Şəxsin, cəmiyyətin və dövlətin maraqları naminə dövlət qulluqçuları öz vəzifə borcunu səmərəli yerinə yetirməyə borcludur","Dövlət qulluqçusu öz fəaliyyətini peşəkarlıq səviyyəsində yerinə yetirməyə borcludur","Dövlət qulluqçusu dövlət orqanının nüfuzunu möhkəmləndirməyə, öz adını və şərəfini uca tutmağa borcludur","Dövlət qulluqçusu dövlət orqanı tərəfindən açıq çıxışlarla bağlı müəyyən olunmuş qaydalara əməl etməlidir"],"e":"Maddə 4.1 (Vicdanlı davranış). Digərləri: peşəkarlıq (5.1), ictimai etimad (7.1), loyallıq (6.3).","ex":1},{"d":6,"c":4,"id":"dq-rq1","r":"Maddə 5","q":"“Dövlət qulluqçularının etik davranış qaydaları haqqında” Azərbaycan Respublikasının Qanununa əsasən aşağıdakılardan hansı “peşəkarlıq və fərdi məsuliyyətin artırılması” etik davranış qaydasının məzmununa aiddir:","o":["Dövlət qulluqçusu etik davranışı və öz peşəkar fəaliyyəti ilə dövlət orqanlarına hüquqi və fiziki şəxslərin inamını artırmalı və möhkəmləndirməlidir","Dövlət qulluqçusu bütün hallarda hər bir şəxs üçün vicdanlılıq nümunəsi olmalıdır","Dövlət qulluqçusu qanunvericilikdə nəzərdə tutulmuş məhdudiyyətlərə əməl etməlidir","Dövlət qulluqçusu siyasi bitərəfliyə əməl etməyə borcludur"],"e":"Maddə 5.2. Diqqət: Gömrük Etik Kodeksində bu müddəa “İctimai etimad” qaydasındadır (8.3), Qanunda isə “Peşəkarlıq və fərdi məsuliyyətin artırılması”ndadır.","ex":1},{"d":6,"c":4,"id":"dq-rq2","r":"Maddə 6","q":"“Dövlət qulluqçularının etik davranış qaydaları haqqında” Azərbaycan Respublikasının Qanununa əsasən aşağıdakılardan hansı “loyallıq” etik davranış qaydasının məzmununa aid deyildir:","o":["Dövlət qulluqçusu bütün hallarda hər bir şəxs üçün vicdanlılıq nümunəsi olmalıdır","Dövlət qulluqçusu xidməti vəzifəsinə aid olmadığı hallarda dövlət orqanlarının fəaliyyəti ilə əlaqədar tənqidi ictimai mülahizələrdən çəkinməlidir","Dövlət qulluqçusu dövlət orqanının nüfuzunu aşağı sala biləcək hərəkətlərə yol verməməlidir","Dövlət qulluqçusu dövlət orqanı tərəfindən açıq çıxışlarla bağlı müəyyən olunmuş qaydalara əməl etməlidir"],"e":"Vicdanlılıq nümunəsi vicdanlı davranışa aiddir (4.2). Digərləri loyallıq (6.1–6.3).","ex":1},{"d":6,"c":4,"id":"dq-rq3","r":"Maddə 7","q":"“Dövlət qulluqçularının etik davranış qaydaları haqqında” Azərbaycan Respublikasının Qanununa əsasən aşağıdakılardan hansı “ictimai etimad” etik davranış qaydasının məzmununa aid deyildir:","o":["Dövlət qulluqçusu dövlət orqanı tərəfindən açıq çıxışlarla bağlı müəyyən olunmuş qaydalara əməl etməlidir","Dövlət qulluqçusu dövlət orqanının və dövlət qulluğunun nüfuzunu möhkəmləndirməyə, öz adını və şərəfini uca tutmağa borcludur","Dövlət qulluqçusu etik davranış qaydalarının pozulması nəticələrini aradan qaldırmağa, ictimai etimadın bərpası üçün tədbirlər görməyə borcludur","Dövlət qulluqçusu media subyektlərinin qanunla müəyyən edilmiş hallarda doğru məlumat almasına kömək etməlidir"],"e":"Açıq çıxışlarla bağlı qaydalar loyallığa aiddir (6.3). Digərləri ictimai etimaddır (7.1–7.3).","ex":1},{"d":6,"c":4,"id":"dq-rq4","r":"Maddə 13.1","q":"Dövlət qulluqçularının etik davranış qaydaları haqqında” Azərbaycan Respublikasının Qanununa əsasən “Dövlət qulluqçusuna qanunsuz maddi və qeyri-maddi nemətlər, imtiyazlar və ya güzəştlər təklif olunduğu hallarda, dövlət qulluqçusu onlardan imtina etməlidir.” hansı etik davranış qaydasının məzmununa aiddir:","o":["Korrupsiyanın qarşısının alınması","Hədiyyə alma ilə əlaqədar məhdudiyyətlər","Maraqlar toqquşmasının qarşısının alınması","Maddi və qeyri-maddi nemətlərin, imtiyazların və ya güzəştlərin əldə edilməsinə yol verilməməsi"],"e":"Maddə 13.1 (Korrupsiyanın qarşısının alınması). Diqqət: 12-ci maddə qulluqçunun özünün nemət əldə etməyə yönəlmiş hərəkətlərini qadağan edir.","ex":1},{"d":6,"c":4,"id":"dq-rq5","r":"Maddə 15.5","q":"“Dövlət qulluqçularının etik davranış qaydaları haqqında” Azərbaycan Respublikasının Qanununa əsasən “Dövlət qulluqçusu vəzifəyə təyin edilərkən və bundan sonrakı müddətdə etik davranış qaydaları, korrupsiyaya qarşı mübarizə və maraqların toqquşmasının qarşısının alınması ilə normativ hüquqi və normativ xarakterli aktlarla tanış olmalıdırlar.”  hansı etik davranış qaydasının məzmununa aiddir:","o":["Maraqlar toqquşmasının qarşısının alınması","Korrupsiyanın qarşısının alınması","Peşəkarlıq və fərdi məsuliyyətin artırılması","Məlumatlardan istifadə"],"e":"Maddə 15.5.","ex":1},{"d":7,"c":0,"id":"beyan-0","r":"Qərar","q":"Malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları hansı aktla təsdiq edilib?","o":[ ":"Maddə 3.6 (yaşıl).","hl":1,"t":1},{"d":7,"c":2,"id":"beyan-27","r":"Bənd 3.7","q":"Bəyannamənin təqdim müddəti hansı çərçivədə uzadıla bilər?","o":["Əsaslandırılmış müraciət əsasında, müvəqqəti saxlanc prosedurunda qalma müddəti (4 ay) çərçivəsində","İstənilən müddətə","Yalnız 15 gün","Uzadıla bilməz"],"e":"Maddə 3.7 (rənglənib, sənəddə “4 ay” qeydi var).","hl":1,"t":1},{"d":7,"c":2,"id":"beyan-28","r":"Bənd 3.8","q":"Bəyannamənin təqdim edilməsinin son günü qeyri-iş gününə düşərsə, nə olur?","o":["Növbəti iş günü müddətin bitdiyi gün hesab edilir","Müddət qeyri-iş günündən əvvəlki iş günü bitir","Müddət 3 gün uzadılır","Müddət dəyişmir"],"e":"Maddə 3.8."},{"d":7,"c":2,"id":"beyan-29","r":"Bənd 3.9","q":"Gömrük ərazisindən APARILAN mallara dair gömrük bəyannaməsi nə vaxt verilməlidir?","o":["Mallar gömrük ərazisindən çıxarılarkən","Mallar çıxarıldıqdan sonra 15 gün ərzində","45 gün ərzində","Mallar ərazidən çıxdıqdan sonra istənilən vaxt"],"e":"Maddə 3.9 (imtahan sualı). İdxal üçün isə 15 gün var (3.6).","hl":1,"ex":1},{"d":7,"c":2,"id":"beyan-30","r":"Bənd 3.10–3.12","q":"Nəqliyyat vasitələrinin bəyan edilməsi ilə bağlı hansı uyğunluq düzgündür?","o":["Malları daşıyan nəqliyyat mallarla eyni vaxtda; gəmilər su və hava limanlarında; yüksüz və sərnişinsiz nəqliyyat sərhəddən keçərkən","Hamısı yalnız sərhəddə","Hamısı təyinat gömrük orqanında","Gəmilər sərhəddə, yüksüz nəqliyyat limanda"],"e":"Maddə 3.10, 3.11 və 3.12 (rənglənib).","hl":1},{"d":7,"c":2,"id":"beyan-31","r":"Bənd 3.13","q":"Gömrük bəyannaməsinin, qısa idxal (ixrac) bəyannaməsinin və təkrar ixrac bildirişinin formaları Qaydaların hansı əlavələri ilə müəyyən edilir?","o":["1, 2, 3 və 4 nömrəli əlavələr","5 və 6 nömrəli əlavələr","7 və 8 nömrəli əlavələr","9, 10 və 11 nömrəli əlavələr"],"e":"Maddə 3.13. Əlavə bəyannamə 5, dövri 6, natamam 7, SİO-nun sadələşdirilmiş bəyannaməsi 8, yardım yükü 9, Qırmızı kanal 10, düzəliş 11 nömrəli əlavədir.","t":1},{"d":7,"c":3,"id":"beyan-32","r":"Bənd 4.1–4.2","q":"Sadələşdirilmiş bəyannamə verildikdən sonra əlavə bəyannamə hansı müddətdə təqdim edilməlidir?","o":["30 gündən gec olmayaraq","15 gün","45 gün","Dərhal"],"e":"Maddə 4.2 (rənglənib): SİO-lar və yardım yükləri üzrə; 5 nömrəli əlavədəki formada.","hl":1,"t":1},{"d":7,"c":3,"id":"beyan-33","r":"Bənd 5.1","q":"Dövri bəyannamə hansı müddətə və kimə icazə verilir?","o":["30 gün müddətinə, eyni malları müntəzəm keçirən şəxsə","1 il müddətinə, SİO-lara","15 gün müddətinə, fiziki şəxslərə","90 gün müddətinə, istənilən şəxsə"],"e":"Maddə 5.1 (rənglənib).","hl":1,"t":1},{"d":7,"c":3,"id":"beyan-34","r":"Bənd 5.2","q":"Dövri bəyannaməyə icazə üçün şərtlər hansılardır?","o":["XİF MN üzrə eyni kodlu mallar eyni şəxs tərəfindən eyni orqanda; bir müqavilə ilə 30 gündə 3 və ya daha çox partiya; borc mallar təqdim olunduqdan 15 gündən gec olmayaraq ödənilir","Malların dəyəri 100 min manatdan çox; SİO statusu; bank zəmanəti","Eyni nəqliyyat vasitəsi; eyni sürücü; eyni marşrut","Mallar ixrac üçündür; 2 il təcrübə"],"e":"Maddə 5.2.1–5.2.3 (rənglənib; 5.2.1-in yanında “nəqliyyat deyil” qeydi var: şərt eyni kodlu mallara aiddir).","hl":1,"t":1},{"d":7,"c":3,"id":"beyan-35","r":"Bənd 5.2.2","q":"Dövri bəyannamə üçün bir müqavilə əsasında ən azı neçə partiyanın neçə gün ərzində keçirilməsi nəzərdə tutulmalıdır?","o":["3 və ya daha çox partiya, 30 gün ərzində","2 partiya, 15 gün ərzində","5 partiya, 30 gün ərzində","3 partiya, 45 gün ərzində"],"e":"Maddə 5.2.2 (yaşıl).","hl":1,"t":1},{"d":7,"c":3,"id":"beyan-36","r":"Bənd 5.6","q":"Dövri bəyannamə ilə sənədlər hansı gömrük orqanına təqdim edilir?","o":["İcazənin alındığı gömrük orqanına","İstənilən gömrük orqanına","DGK-nın mərkəzi aparatına","Malların son təyinat yerindəki orqana"],"e":"Maddə 5.6 (rənglənib).","hl":1},{"d":7,"c":3,"id":"beyan-37","r":"Bənd 5.7","q":"Dövri bəyannamə üzrə gömrük rəsmiləşdirilməsi hansı tarixdə qüvvədə olan qanunvericiliyə uyğun aparılır?","o":["Dövri bəyannamənin təsdiq edildiyi gün","Hər partiyanın gəldiyi gün","İcazənin verildiyi gün","Müqavilənin bağlandığı gün"],"e":"Maddə 5.7."},{"d":7,"c":3,"id":"beyan-38","r":"Bənd 6.2–6.3","q":"Natamam bəyannamə hansı səbəblərə görə və hansı şərtlərlə verilə bilər?","o":["Mal partiyası bəyannamə verilərkən olmadıqda və ya malın miqdarı, keyfiyyəti, dəyəri müəyyənləşdirilə bilmədikdə; gömrük nəzarəti üçün imkan və borca təminat olduqda","Bəyannaməçi xəstə olduqda; bank zəmanəti ilə","Mallar ixrac edildikdə; SİO statusu ilə","Hər bir halda; heç bir şərt olmadan"],"e":"Maddə 6.2 (2 şərt) və 6.3 (2 səbəb), rənglənib.","hl":1},{"d":7,"c":3,"id":"beyan-39","r":"Bənd 6.5","q":"Natamam bəyannamə rəsmiləşdirildikdən sonra tam gömrük bəyannaməsi hansı müddətdə təqdim edilməlidir?","o":["30 gün","15 gün","45 gün","4 ay"],"e":"Maddə 6.5 (rənglənib).","hl":1,"t":1},{"d":7,"c":3,"id":"beyan-40","r":"Bənd 6.6, 5.5","q":"Dövri və ya natamam bəyannamə üçün icazədən imtina edildikdə şəxsə necə məlumat verilir?","o":["Dərhal, əsaslandırılmış səbəb göstərilməklə, kağız üzərində yazılı və ya elektron formada","3 iş günü ərzində şifahi","15 gün ərzində yazılı","Məlumat verilmir"],"e":"Maddə 5.5 və 6.6."},{"d":7,"c":3,"id":"beyan-41","r":"Bənd 7","q":"SİO-nun sadələşdirilmiş bəyannaməsi gömrük orqanına nə vaxt verilir?","o":["Dərhal","15 gün ərzində","30 gün ərzində","Mallar buraxıldıqdan sonra"],"e":"Maddə 7.3 (rənglənib): 8 nömrəli əlavədəki formada. 7.2-yə görə SİO-nun hesabatı formasında da ola bilər (sənəddə “GM 68” qeydi var).","hl":1},{"d":7,"c":3,"id":"beyan-42","r":"Bənd 8","q":"Gömrük Məcəlləsinin 112.1-ci maddəsində nəzərdə tutulan yardım yükləri necə bəyan edilir?","o":["9 nömrəli əlavədəki formada sadələşdirilmiş bəyannamə ilə, dərhal","Ümumi qaydada, 15 gün ərzində","Şifahi, Yaşıl kanalla","Natamam bəyannamə ilə"],"e":"Maddə 8.1–8.2 (rənglənib). 8.3-ə görə beynəlxalq müqavilələrlə digər sadələşdirmələr də müəyyən edilə bilər.","hl":1},{"d":7,"c":3,"id":"beyan-43","r":"Bənd 9.3–9.4","q":"Fiziki şəxslər yazılı bəyan edilməli malları necə keçirir?","o":["“Qırmızı kanal”la, 10 nömrəli əlavədəki sadələşdirilmiş bəyannamə ilə","“Yaşıl kanal”la, şifahi","Ümumi gömrük bəyannaməsi ilə","Dövri bəyannamə ilə"],"e":"Maddə 9.3–9.4."},{"d":7,"c":3,"id":"beyan-44","r":"Bənd 9.6","q":"Fiziki şəxsin müvəqqəti gətirdiyi mallar hansı vəziyyətdə geri qaytarılmalıdır?","o":["Təbii aşınma və itki istisna olmaqla, dəyişdirilməmiş vəziyyətdə","İstənilən vəziyyətdə","Yalnız yeni vəziyyətdə","Təmir olunmuş vəziyyətdə"],"e":"Maddə 9.6."},{"d":7,"c":3,"id":"beyan-45","r":"Bənd 9.7","q":"Fiziki şəxsin müvəqqəti gətirdiyi malların geri aparılması harada rəsmiləşdirilə bilər?","o":["İstənilən gömrük orqanında","Yalnız malların gətirildiyi gömrük orqanında","Yalnız DGK-nın mərkəzi aparatında","Yalnız Bakı Baş Gömrük İdarəsində"],"e":"Maddə 9.7 (yaşıl).","hl":1},{"d":7,"c":3,"id":"beyan-46","r":"Bənd 9.8","q":"Fiziki şəxslərin kommersiya məqsədli olmayan malları üzrə gömrük borcu nə vaxt ödənilir?","o":["Sadələşdirilmiş bəyannamənin təsdiqi ilə eyni vaxtda","15 gün ərzində","Mallar buraxıldıqdan sonra 30 gün ərzində","Növbəti səfərdə"],"e":"Maddə 9.8 (bənövşəyi).","hl":1},{"d":7,"c":3,"id":"beyan-47","r":"Bənd 9.9","q":"Fiziki şəxslərin malları ilə bağlı digər məsələlər hansı aktla müəyyən edilir?","o":["NK-nın 14 oktyabr 2013-cü il tarixli 305 nömrəli Qərarı ilə təsdiq edilmiş güzəştli və sadələşdirilmiş Qaydalar","NK-nın 28 dekabr 2012-ci il tarixli 324 nömrəli Qərarı","NK-nın 27 avqust 2013-cü il tarixli 230 nömrəli Qərarı","Prezidentin 609 nömrəli Fərmanı"],"e":"Maddə 9.9. 324 nömrəli Qərar nəqliyyat ehtiyatlarına aiddir (20.1).","t":1},{"d":7,"c":4,"id":"beyan-48","r":"Bənd 10.1","q":"Qısa idxal bəyannaməsi hansı hallarda təqdim edilir?","o":["Mallar elektrik xətləri ilə keçirildikdə; müvəqqəti saxlanc prosedurunda; yaşıl, mavi, sarı və qırmızı dəhliz sistemləri üçün əvvəlcədən elektron təqdim edildikdə","Yalnız fiziki şəxslərin malları üçün","Yalnız tranzit mallar üçün","Bütün ixrac mallarında"],"e":"Maddə 10.1.1–10.1.3 (rənglənib).","hl":1,"t":1},{"d":7,"c":4,"id":"beyan-49","r":"Bənd 10.1.3","q":"Qısa idxal bəyannaməsi ilə bağlı neçə rəngli dəhliz buraxılış sistemi qeyd olunub?","o":["4: yaşıl, mavi, sarı, qırmızı","2: yaşıl və qırmızı","3: yaşıl, sarı, qırmızı","5: yaşıl, mavi, sarı, narıncı, qırmızı"],"e":"Maddə 10.1.3 (rənglənib). Fiziki şəxslər üçün isə ikikanallı sistem var: Yaşıl və Qırmızı kanal.","hl":1,"t":1},{"d":7,"c":4,"id":"beyan-50","r":"Bənd 11.1","q":"Qısa ixrac bəyannaməsi hansı hallarda təqdim edilir?","o":["Gömrük bəyannaməsi və ya təkrar ixrac bildirişi tələb olunmadıqda; mallar elektrik xətləri ilə keçirildikdə","Bütün ixrac mallarında","Yalnız SİO-lar üçün","Yalnız müvəqqəti saxlancdan ixracda"],"e":"Maddə 11.1.1–11.1.2 (rənglənib).","hl":1},{"d":7,"c":4,"id":"beyan-51","r":"Bənd 12.1","q":"Gömrük bəyannaməsi hansı hallarda tələb olunmur?","o":["Təkrar ixrac bildirişi təqdim olunduqda; ərazi sularından və hava məkanından dayanmadan keçən nəqliyyatda mallar daşındıqda","Dəyəri 1000 manatdan az olan mallarda","Fiziki şəxslərin bütün mallarında","Tranzit mallarında"],"e":"Maddə 12.1 (rənglənib).","hl":1},{"d":7,"c":4,"id":"beyan-52","r":"Bənd 12.2","q":"Təkrar ixrac bildirişi hansı hallarda tələb olunmur?","o":["Beynəlxalq tranzitlə keçən mallar; sərbəst zonada yenidən yüklənən və ya oradan birbaşa təkrar ixrac edilən mallar; müvəqqəti saxlancdan birbaşa təkrar ixrac edilən mallar","Bütün ixrac mallarında","Yalnız fiziki şəxslərin mallarında","Elektrik enerjisi ixracında"],"e":"Maddə 12.2 (yaşıl): 3 hal.","hl":1,"t":1},{"d":7,"c":4,"id":"beyan-53","r":"Bənd 13.1","q":"Qısa idxal bəyannaməsinin verilməməsi nəyə səbəb olur?","o":["Bəyannaməçinin inzibati məsuliyyətinə; lakin gömrük rəsmiləşdirilməsinə və buraxılışa mane olmur","Malların buraxılışından imtinaya","Cinayət məsuliyyətinə","Malların müsadirəsinə"],"e":"Maddə 13.1 (bənövşəyi).","hl":1},{"d":7,"c":4,"id":"beyan-54","r":"Bənd 13.1","q":"Hansı halda mallar gətirilməzdən əvvəl qısa idxal bəyannaməsi verilmir?","o":["Fiziki şəxslər kommersiya məqsədli olmayan mallar keçirdikdə","SİO-lar malları gətirdikdə","Mallar dəmiryolu ilə gətirildikdə","Aksizli mallar gətirildikdə"],"e":"Maddə 13.1 (bənövşəyi). 13.5-ə görə dayanmadan keçən nəqliyyatda daşınan mallar da bu tələbdən kənardır.","hl":1},{"d":7,"c":4,"id":"beyan-55","r":"Bənd 13.4","q":"Elektron qısa idxal bəyannaməsi nə vaxta qədər təqdim edilir?","o":["Mallar gömrük sərhədini keçənədək","Mallar sərhədi keçdikdən sonra 1 saat ərzində","15 gün ərzində","Bəyannamə təsdiq edilənədək"],"e":"Maddə 13.4."},{"d":7,"c":4,"id":"beyan-56","r":"Bənd 14.1","q":"Gömrük bəyannaməsində düzəliş edilməsinə və ya onun geri götürülməsinə ümumi qaydada hansı əsasla icazə verilir?","o":["Bəyannamə təsdiq edildikdən sonra bəyannaməçinin müraciəti əsasında","Gömrük orqanının təşəbbüsü ilə istənilən vaxt","Yalnız məhkəmə qərarı ilə","Bəyannamə təsdiq edilənədək avtomatik"],"e":"Maddə 14.1 (imtahan sualı).","hl":1,"ex":1},{"d":7,"c":4,"id":"beyan-57","r":"Bənd 14.2","q":"Aşağıdakı hallardan hansında bəyannaməyə düzəliş edilməsinə və ya geri götürülməsinə icazə VERİLMİR?","o":["Gömrük orqanı malları yoxlamaq niyyətində olduğunu bildirdikdən sonra","Bəyannamə təsdiq edildikdən sonra, yoxlama bildirilməmişdirsə","Mallar buraxıldıqdan sonra gömrük nəzarəti zonasını tərk etmədikdə","Yuxarı gömrük orqanının qanuni qərarı olduqda"],"e":"Maddə 14.2 (imtahan sualı): yoxlama niyyəti bildirildikdən sonra, məlumatların səhv olduğu müəyyən edildikdən sonra və buraxılışdan sonra (14.3 istisna olmaqla).","hl":1,"ex":1},{"d":7,"c":4,"id":"beyan-58","r":"Bənd 14.2","q":"14.2-ci bənddə bəyannaməyə düzəliş və geri götürmə qadağasının neçə halı göstərilib?","o":["3","2","4","6"],"e":"Maddə 14.2.1–14.2.3 (imtahan sualı).","hl":1,"t":1,"ex":1},{"d":7,"c":4,"id":"beyan-59","r":"Bənd 14.3","q":"Malların buraxılışından sonra neçə halda bəyannaməyə düzəliş və ya geri götürmə mümkündür?","o":["6","3","4","2"],"e":"Maddə 14.3.1–14.3.6 (rənglənib).","hl":1,"t":1},{"d":7,"c": 16.3.1–16.3.4: gömrük bəyannaməsi, qısa idxal bəyannaməsi, natamam bəyannamə, sadələşdirilmiş bəyannamə."},{"d":7,"c":5,"id":"beyan-71","r":"Bənd 17.1","q":"Gömrük ərazisinə daxil olacaq nəqliyyat vasitəsinə görə məsul şəxs əvvəlcədən neçə növ məlumat təqdim etməlidir?","o":["6","4","5","3"],"e":"Maddə 17.1.1–17.1.6: daxilolma vaxtı, marşrut, heyət və sərnişinlər, boşaldılacaq yük, boşaldılmayacaq yük, daxil olacağı gömrük sahəsi.","t":1},{"d":7,"c":5,"id":"beyan-72","r":"Bənd 17.3","q":"Nəqliyyat vasitəsi gömrük ərazisinə daxil olduqdan sonra daxilolma haqqında məlumat hansı müddətdə verilməlidir?","o":["1 saat ərzində; iş vaxtından kənar daxil olduqda növbəti iş vaxtı başlandıqdan sonra 1 saat ərzində","24 saat ərzində","3 saat ərzində","Dərhal, iş vaxtından asılı olmayaraq"],"e":"Maddə 17.3 (rənglənib).","hl":1,"t":1},{"d":7,"c":5,"id":"beyan-73","r":"Bənd 17.1, 18.1","q":"Nəqliyyat vasitəsinin daxilolma və yola düşmə məlumatlarının əvvəlcədən təqdimi arasında hansı fərq var?","o":["Daxilolma barədə əvvəlcədən təqdim etməlidir (məcburi); yola düşmə barədə təqdim edə bilər (könüllü)","Hər ikisi məcburidir","Hər ikisi könüllüdür","Daxilolma könüllü, yola düşmə məcburidir"],"e":"Maddə 17.1 (“etməlidir” rənglənib) və 18.1 (“edə bilər”).","hl":1},{"d":7,"c":5,"id":"beyan-74","r":"Bənd 17.2","q":"Daxil olan nəqliyyat vasitəsinə görə məsul şəxs nəyə imkan verməməlidir?","o":["Gömrük icazəsi verilənədək heç bir şəxsin nəqliyyat vasitəsini tərk etməsinə və ya oraya daxil olmasına","Gömrük yoxlamasına","Sərnişinlərin sənədlərinin yoxlanılmasına","Yükün boşaldılmasına, istənilən halda"],"e":"Maddə 17.2.2."},{"d":7,"c":5,"id":"beyan-75","r":"Bənd 18.4–18.5","q":"Gömrük orqanları nəqliyyat vasitəsinin rəsmiləşdirmə aparılmadan yola düşməsinə yol verə bilərmi?","o":["Xeyr; bu, Azərbaycan limanlarında dayanmadan keçən gəmilərə tətbiq edilmir","Bəli, gecə saatlarında","Bəli, yüksüz olduqda","Bəli, SİO-ların nəqliyyatında"],"e":"Maddə 18.4 və 18.5."},{"d":7,"c":5,"id":"beyan-76","r":"Bənd 19.1","q":"Qaydalara görə “yüksüz və sərnişinsiz nəqliyyat vasitələri” hansılardır?","o":["Sərnişin və yük olmadan beynəlxalq daşınmada istifadə olunan hava, dəmiryol, dəniz, daxili su və avtomobil nəqliyyatı vasitələri","Yalnız avtomobillər","Daxili daşımada istifadə olunan bütün nəqliyyat","Yalnız boş konteynerlər"],"e":"Maddə 19.1."},{"d":7,"c":5,"id":"beyan-77","r":"Bənd 19.2–19.3","q":"Yüksüz və sərnişinsiz nəqliyyat vasitəsinin rəsmiləşdirilməsi haqqında sənəddə hansı məlumatlar göstərilməlidir?","o":["Texniki göstəricilər; sürücü haqqında məlumat; heyət, sərnişin və ya yük, hərəkət istiqaməti və marşrut","Yalnız qeydiyyat nişanı","Sahibinin bank rekvizitləri","Yanacaq miqdarı və sığorta"],"e":"Maddə 19.3.1–19.3.3 (imtahan sualı, rənglənib).","hl":1,"ex":1},{"d":7,"c":5,"id":"beyan-78","r":"Bənd 20.1","q":"Nəqliyyat vasitələrində istifadə və istismar üçün ehtiyatların bəyan edilməsi hansı Qərara əsaslanır?","o":["NK-nın 28 dekabr 2012-ci il tarixli 324 nömrəli Qərarı","NK-nın 14 oktyabr 2013-cü il tarixli 305 nömrəli Qərarı","NK-nın 14 yanvar 2014-cü il tarixli 3 nömrəli Qərarı","NK-nın 22 iyul 2014-cü il tarixli 263 nömrəli Qərarı"],"e":"Maddə 20.1: 2.1.2-ci yarımbənd.","t":1},{"d":7,"c":5,"id":"beyan-79","r":"Bənd 20.2","q":"Ehtiyatlara dair sənədlərlə müşayiət olunmayan nəqliyyat vasitəsində ehtiyatlar necə bəyan edilir?","o":["Ümumi qaydada","Şifahi, Yaşıl kanalla","Sadələşdirilmiş bəyannamə ilə","Bəyan edilmir"],"e":"Maddə 20.2 (imtahan sualı, mavi).","hl":1,"ex":1},{"d":7,"c":5,"id":"beyan-80","r":"Bənd 20.3","q":"Gəmilərdə və digər nəqliyyat vasitələrində ehtiyatlar harada bəyan edilir?","o":["Gəmilərdə: daxil olduqları və ya yola düşdükləri su və hava limanlarında; digər nəqliyyatda: gömrük sərhədindən keçirilərkən","Hamısı təyinat gömrük orqanında","Hamısı sərhəddə","Gəmilərdə sərhəddə, digərlərində limanda"],"e":"Maddə 20.3 (mavi).","hl":1},{"d":7,"c":5,"id":"beyan-81","r":"Bənd 21.1–21.2","q":"Gömrük ərazisinə daxil olan şəxs gömrük orqanına necə məlumat verir?","o":["Daxil olduğu andan dərhal, Yaşıl və Qırmızı kanallardan istifadə etməklə; nəqliyyatdan düşüb gömrük nəzarəti zonasına getməklə məlumat vermiş hesab edilir","24 saat ərzində yazılı","Telefonla","Yalnız sorğu olduqda"],"e":"Maddə 21.1–21.2."},{"d":7,"c":6,"id":"beyan-rq0","r":"Bənd 2.8","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən ayrı-ayrı sənədlərin üzrlü səbəblərə görə gömrük bəyannaməsi ilə birlikdə təqdim edilməsi mümkün olmadığı hallarda bəyannaməçi sənədlərin vaxtında verilməsinə dair gömrük orqanına aşağıdakılardan hansını təqdim edir?","o":["Yazılı, o cümlədən elektron formada öhdəlik","Bank qarantiyası","Notarial qaydada təsdiq edilmiş ərizə","Sığorta müqaviləsi"],"e":"Bənd 2.8: sənədlər bəyannamə təsdiq edildiyi tarixdən 45 gündən gec olmayaraq təqdim edilməlidir (Gömrük Məcəlləsində daha qısa müddət yoxdursa).","ex":1},{"d":7,"c":6,"id":"beyan-rq1","r":"Bənd 13.1, 13.4","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən qısa idxal bəyannaməsi ilə bağlı aşağıdakılardan hansı doğrudur?","o":["Fiziki şəxslərin kommersiya məqsədli olmayan malları istisna olmaqla, mallar gömrük ərazisinə gətirilməzdən əvvəl elektron formada verilir; verilməməsi inzibati məsuliyyətə səbəb olur, lakin rəsmiləşdirməyə və buraxılışa mane olmur","Qısa idxal bəyannaməsinin verilməməsi malların buraxılışına mane olur","Qısa idxal bəyannaməsi yalnız kağız formada verilir","Qısa idxal bəyannaməsi mallar gömrük sərhədini keçdikdən sonra 15 gün ərzində verilir"],"e":"Bənd 13.1 və 13.4: məlumatların elektron emalı ilə təqdim olunan qısa idxal bəyannaməsi mallar sərhədi keçənədək verilir.","ex":1},{"d":7,"c":6,"id":"beyan-rq2","r":"Bənd 2.5–2.6","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən aşağıdakılardan hansı gömrük bəyannaməsi ilə birlikdə təqdim edilməsi tələb olunan sənədlərə aid deyil?","o":["Malın istehsalçısının vergi orqanından arayışı","Gömrük təmsilçiliyi həyata keçirildikdə səlahiyyəti təsdiq edən sənəd","İdxal olunan malların bəyan edilmiş gömrük dəyərini təsdiq edən sənəd","Məcburi sertifikatlaşdırılmalı olan mallar idxal edildikdə uyğunluq sertifikatı"],"e":"Bənd 2.5–2.6-da belə sənəd yoxdur. Digərləri 2.6.1, 2.6.3, 2.6.5-dir.","ex":1},{"d":7,"c":6,"id":"beyan-rq3","r":"Bənd 2.6-1","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən transplantasiya məqsədilə insan orqan və toxumaları idxal edildikdə gömrük orqanları tərəfindən hansı sənədin mövcudluğu yoxlanılır?","o":["Səhiyyə Nazirliyinin tabeliyindəki Orqan Donorluğu və Transplantasiya üzrə Koordinasiya Mərkəzinin xüsusi icazə barədə qərarı","Xarici ticarət müqaviləsi","Səhiyyə Nazirliyinin dərman vasitələrinin idxalına icazəsi","Qida Təhlükəsizliyi Agentliyinin sertifikatı"],"e":"Bənd 2.6-1: 2.5.1-dəki sənədlərin əvəzinə (NK-nın 03.09.2022 tarixli 345 nömrəli Qərarı).","ex":1},{"d":7,"c":6,"id":"beyan-rq4","r":"Bənd 15.3","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən aşağıdakılardan hansı gömrük ərazisindən aparılması nəzərdə tutulan malların həmin ərazidən aparılmazdan əvvəl bəyanetmə formalarına aid deyil?","o":["Natamam bəyannamə","Müvafiq gömrük bəyannaməsi","Təkrar ixrac bildirişi","Qısa ixrac bəyannaməsi"],"e":"Bənd 15.3: aparılmazdan əvvəl bəyanetmə formaları — gömrük bəyannaməsi, təkrar ixrac bildirişi, qısa ixrac bəyannaməsi. Natamam bəyannamə gətirilmədən əvvəlki formalardandır (16.3.3).","ex":1},{"d":7,"c":6,"id":"beyan-rq5","r":"Bənd 17.1","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən aşağıda göstərilənlərdən hansı gömrük ərazisinə daxil olması nəzərdə tutulan nəqliyyat vasitəsinə görə məsul şəxs tərəfindən gömrük orqanlarına əvvəlcədən təqdim edilməli olan məlumatlara aid deyil?","o":["Nəqliyyat vasitəsinin sahibinin vergi ödəyicisinin eyniləşdirmə nömrəsi","Nəqliyyat vasitəsinin gömrük ərazisinə gözlənilən daxilolma vaxtı","Nəqliyyat vasitəsinin heyəti və sərnişinləri","Nəqliyyat vasitəsinin daxil olacağı gömrük sahəsi"],"e":"Bənd 17.1: 6 məlumat — daxilolma vaxtı, hərəkət istiqamətləri və marşrutları, heyət və sərnişinlər, boşaldılacaq yük, boşaldılmayacaq yük, daxil olacağı gömrük sahəsi.","ex":1},{"d":7,"c":6,"id":"beyan-rq6","r":"Bənd 4.1","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən yardım yüklərinin gömrük rəsmiləşdirilməsi zamanı bəyannaməçi aidiyyəti gömrük proseduru üzrə gömrük bəyannaməsinin tamamlanması üçün hansı bəyannamə təqdim etməlidir?","o":["Əlavə bəyannamə","Dövri bəyannamə","Natamam bəyannamə","Qısa idxal bəyannaməsi"],"e":"Bənd 4.1: SİO-lar və yardım yükləri üzrə sadələşdirilmiş bəyannamədən sonra əlavə bəyannamə verilir.","ex":1},{"d":7,"c":6,"id":"beyan-rq7","r":"Bənd 4.2","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən səlahiyyətli iqtisadi operator gömrük rəsmiləşdirilməsi zamanı gömrük orqanına sadələşdirilmiş bəyannamənin verildiyi tarixdən hansı müddətdə əlavə bəyannamə təqdim etməlidir?","o":["30 (otuz) gündən gec olmayaraq","15 gündən gec olmayaraq","45 gündən gec olmayaraq","10 iş günündən gec olmayaraq"],"e":"Bənd 4.2.","ex":1,"t":1},{"d":7,"c":6,"id":"beyan-rq8","r":"Bənd 3.6","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən gömrük ərazisinə gətirilən mallara dair gömrük bəyannaməsi həmin mallar gömrük ərazisinə gətirilən yerdəki gömrük orqanına təqdim edildiyi tarixdən hansı müddətdə verilməlidir?","o":["15 (on beş) gündən gec olmayaraq","30 gündən gec olmayaraq","10 gündən gec olmayaraq","45 gündən gec olmayaraq"],"e":"Bənd 3.6: daxili tranzitdə — təyinat gömrük orqanına təqdim edildiyi tarixdən. Aparılan mallar üzrə bəyannamə isə mallar çıxarılarkən verilir (3.9).","ex":1,"t":1},{"d":7,"c":6,"id":"beyan-rq9","r":"Bənd 2.5–2.6","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən aşağıdakılardan hansı gömrük bəyannaməsi ilə birlikdə təqdim edilməsi tələb olunan sənədlərə aid deyil?","o":["Malı alan şəxsin bank hesabından çıxarış","Xarici ticarətin həyata keçirilməsini təsdiq edən müqavilə","Nəqliyyat növündən asılı olaraq nəqliyyat sənədləri","Dövlət baytarlıq nəzarətində olan mallar idxal edildikdə baytarlıq sertifikatı"],"e":"Bənd 2.5 (müqavilə, nəqliyyat sənədləri) və 2.6.6 (baytarlıq sertifikatı). Bank hesabından çıxarış tələb olunmur.","ex":1},{"d":7,"c":6,"id":"beyan-rq10","r":"Bənd 5.2","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən aşağıdakılardan hansı eyni malları və nəqliyyat vasitələrini gömrük sərhədindən müntəzəm olaraq partiyalarla keçirən şəxsin onların bir dövri bəyannamə əsasında gömrük sərhədindən keçirilməsinə icazə almaq üçün əməl etməli olduğu şərtlərə aid deyil?","o":["Malların gömrük sərhədindən ən azı 10 partiya ilə keçirilməsi","XİF MN üzrə eyni koda malik malların eyni şəxs tərəfindən eyni gömrük orqanında rəsmiləşdirilməsi","Bir müqavilə əsasında malların 30 gün müddətində 3 və ya daha çox partiya ilə keçirilməsi","Gömrük borcunun mallar təqdim olunduğu tarixdən 15 gündən gec olmayaraq ödənilməsi"],"e":"Bənd 5.2: 3 şərt; partiyaların sayı 3 və daha çox olmalıdır (10 yox). Dövri bəyannamə 30 gün müddətinə verilir (5.1).","ex":1},{"d":7,"c":6,"id":"beyan-rq11","r":"Bənd 6.3","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən aşağıdakılardan hansı natamam bəyannamə təqdim edilməsinin səbəblərinə aid deyil?","o":["Bəyannaməçinin gömrük brokeri ilə müqavilə bağlamaması","Faktiki təqdim edilməli olan mal partiyasının gömrük bəyannaməsi verildiyi vaxt olmaması","Gömrük bəyannaməsi verildiyi vaxt malın miqdarını müəyyənləşdirm qliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən qısa idxal bəyannaməsi ilə bağlı aşağıdakılardan hansı doğrudur?","o":["Gömrük sərhədindən mallar elektrikötürücü xətlər vasitəsilə keçirildikdə qısa idxal bəyannaməsi təqdim edilir","Qısa idxal bəyannaməsinin verilməməsi malların buraxılışına mane olur","Qısa idxal bəyannaməsi fiziki şəxslərin şəxsi istifadə üçün malları üzrə də verilir","Qısa idxal bəyannaməsi yalnız mallar gömrük anbarına yerləşdirildikdə verilir"],"e":"Bənd 10.1: elektrikötürücü xətlər, müvəqqəti saxlanc, yaşıl/mavi/sarı/qırmızı dəhliz sistemlərindən istifadə üçün əvvəlcədən elektron təqdimat.","ex":1},{"d":7,"c":6,"id":"beyan-rq16","r":"Bənd 14.3","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən aşağıdakılardan hansı malların buraxılışı həyata keçirildikdən sonra gömrük bəyannaməsində düzəlişlər edilməsinə icazənin verilməsi hallarına aid deyil?","o":["Gömrük orqanları bəyannaməçiyə malları yoxlamaq niyyətində olduğunu bildirdikdə","Güzəştlərlə şərti buraxılmış mallardan başqa məqsədlər üçün istifadə olunduqda","Buraxılışa baxmayaraq mallar gömrük nəzarəti zonasını tərk etmədikdə","Yuxarı gömrük orqanının və ya məhkəmənin qanuni qüvvəyə minmiş qərarı olduqda"],"e":"Yoxlama niyyəti bildirildikdən sonra düzəlişə icazə VERİLMİR (14.2.1). Buraxılışdan sonrakı icazə halları 14.3.1–14.3.6-dır.","ex":1},{"d":7,"c":6,"id":"beyan-rq17","r":"Bənd 17.1","q":"“Gömrük sərhədindən keçirilən malların və nəqliyyat vasitələrinin bəyan edilməsi Qaydaları”na əsasən aşağıdakılardan hansı gömrük ərazisinə daxil olması nəzərdə tutulan nəqliyyat vasitəsinə görə məsul şəxsin gömrük orqanlarına əvvəlcədən təqdim etməli olduğu məlumatlara aid deyil?","o":["Nəqliyyat vasitəsinin sığorta polisinin nömrəsi","Nəqliyyat vasitəsinin hərəkət istiqamətləri və marşrutları","Gömrük ərazisində boşaldılacaq yük","Gömrük ərazisində boşaldılması nəzərdə tutulmayan yük"],"e":"Bənd 17.1 (6 məlumat).","ex":1},{"d":7,"c":6,"i yarımbəndlərinə istinad olunur.","t":1},{"d":13,"c":0,"id":"melumat-2","r":"Bənd 1.1","q":"Qaydalar Gömrük Məcəlləsinin hansı maddəsinə əsasən hazırlanıb?","o":["8.0.27-ci maddəsinə","146.3-cü maddəsinə","111-ci maddəsinə","31.4-cü maddəsinə"],"e":"Maddə 1.1 (başlıqda “GM 8.0.27” qeydi var).","hl":1,"t":1},{"d":13,"c":0,"id":"melumat-3","r":"Qeyd","q":"Sənəddəki qeydə görə gömrük məsələləri üzrə məlumatların verilməsi gömrük orqanları üçün nədir?","o":["Vəzifə","Hüquq","Könüllü xidmət","Ödənişli xidmət"],"e":"Sənəddə başlığın altında rənglənmiş “Vəzifəsidir” qeydi var. DGK haqqında Əsasnamədə də bu, vəzifə kimi göstərilib (3.1.34).","hl":1},{"d":13,"c":1,"id":"melumat-4","r":"Bənd 1.2","q":"Qaydalar hansı məlumatlara ŞAMİL EDİLMİR?","o":["DGK-nın idxal-ixrac əməliyyatları və digər gömrük məsələləri ilə bağlı aidiyyəti dövlət orqanlarına mütəmadi verdiyi məlumatlara","Fiziki şəxslərin sorğularına","Hüquqi şəxslərin sorğularına","Qaynar xətt vasitəsilə verilən məlumatlara"],"e":"Maddə 1.2 (imtahan sualı, rənglənib).","hl":1,"ex":1},{"d":13,"c":1,"id":"melumat-5","r":"Bənd 1.3","q":"Gömrük orqanlarının aşkar etdiyi hüquqpozmanın araşdırılması digər hüquq mühafizə orqanının səlahiyyətinə aiddirsə, nə edilir?","o":["Müvafiq məlumatlar və sənədlər həmin orqana verilir","Gömrük orqanı özü araşdırır","Məlumat məhv edilir","Məsələ məhkəməyə göndərilir"],"e":"Maddə 1.3."},{"d":13,"c":1,"id":"melumat-6","r":"Bənd 1.4","q":"Gömrük orqanları digər hüquq mühafizə orqanlarına hansı şəxslər haqqında məlumat verir?","o":["Sorğu əsasında, barəsində inzibati xəta icraatı və ya cinayət işi başlanılmış şəxslər haqqında","Bütün sərhəd keçənlər haqqında, avtomatik olaraq","Yalnız məhkum olunmuş şəxslər haqqında","Heç kim haqqında"],"e":"Maddə 1.4."},{"d":13,"c":2,"id":"melumat-7","r":"Bənd 2.1","q":"Şəxslər gömrük məsələləri üzrə məlumatları neçə üsulla əldə edə bilər?","o":["4","3","5","6"],"e":"Maddə 2.1 (rənglənib): məlumat köşkü və ya internet; vəzifəli şəxsə bilavasitə və ya telefonl .6.1–2.6.8 (bir hissəsi rənglənib)."},{"d":13,"c":2,"id":"melumat-19","r":"Bənd 2.8–2.9","q":"Qaynar xətt vasitəsilə gömrük ödənişlərinin məbləği barədə verilmiş məlumatın hüquqi qüvvəsi necədir?","o":["Gömrük orqanları üçün məcburidir; şəxs bildirilən məbləğdən artıq ödəməyə məcbur edilə bilməz","Yalnız məlumat xarakterlidir","Bəyannaməçi üçün məcburidir, gömrük orqanı üçün deyil","Yazılı təsdiq olmadan hüquqi qüvvəsi yoxdur"],"e":"Maddə 2.8 və 2.9. 2.7-yə görə söhbət yazılır və şəxsin istəyi ilə ona təqdim olunur."},{"d":13,"c":2,"id":"melumat-20","r":"Bənd 2.10","q":"Şəxslər gömrük məlumatlarını başqa hansı kanalla əldə edə bilər?","o":["Elektron hökumət portalındakı elektron gömrük xidmətləri vasitəsilə","Yalnız şəxsən","Yalnız notarius vasitəsilə","Mərkəzi Bank vasitəsilə"],"e":"Maddə 2.10."},{"d":13,"c":3,"id":"melumat-21","r":"Bənd 3.1","q":"Sorğu verməklə hansı məlumatı əldə etmək OLMAZ?","o":["4.1-ci bənddə göstərilən məlumatı (qanunla məhdudlaşdırılan, aydın olmayan və ya gömrüklə əlaqəsi olmayan)","Gömrük ödənişləri haqqında məlumatı","Gömrük prosedurları haqqında məlumatı","Gömrük orqanlarının əlaqə məlumatlarını"],"e":"Maddə 3.1 və 4.1."},{"d":13,"c":3,"id":"melumat-22","r":"Bənd 3.3–3.4","q":"Sorğu hansı formalarda verilə bilər?","o":["Yazılı və şifahi; yazılı sorğu şəxsən, poçt, telefaks və ya elektron poçtla","Yalnız yazılı","Yalnız elektron","Yalnız notarial təsdiqli"],"e":"Maddə 3.3 və 3.4."},{"d":13,"c":3,"id":"melumat-23","r":"Bənd 3.5","q":"Gömrük orqanının məsul şəxsi elektron poçtu hansı tezlikdə yoxlamalıdır?","o":["Gündə 2 dəfədən az olmayaraq","Gündə 1 dəfə","Həftədə 2 dəfə","Saatda bir dəfə"],"e":"Maddə 3.5.","t":1},{"d":13,"c":3,"id":"melumat-24","r":"Bənd 3.7","q":"Yazılı sorğuda neçə rekvizit olmalıdır?","o":["6","5","4","7"],"e":"Maddə 3.7.1–3.7.6: gömrük orqanının adı, şəxsin adı (soyadı), əlaqə məlumatları, sorğunun məzmunu, informasiyanın təqdim forması, imza.","t":1},{"d":13,"c":3,"id":"melumat-25","r":"Bənd 3.7","q":"Aşağıdakılard id":"melumat-32","r":"Bənd 5.4","q":"7 iş günü ərzində məlumat operativliyini itirərsə, sorğuya nə vaxt cavab verilməlidir?","o":["Dərhal, mümkün olmadıqda 24 saatdan gec olmayaraq","48 saat ərzində","3 iş günü ərzində","7 iş günü ərzində"],"e":"Maddə 5.4 (yaşıl).","hl":1,"t":1},{"d":13,"c":5,"id":"melumat-33","r":"Bənd 5.5","q":"İnsan həyatı, sağlamlığı və ya azadlığı üçün real təhlükə olduqda, hazırlanması vaxt tələb edən məlumat hansı müddətdə təqdim edilir?","o":["48 saat ərzində (iş günü olmayan günlər istisna olmaqla)","24 saat ərzində","Dərhal","7 iş günü ərzində"],"e":"Maddə 5.5 (yaşıl).","hl":1,"t":1},{"d":13,"c":5,"id":"melumat-34","r":"Bənd 5.4–5.5","q":"24 saat və 48 saat müddətləri arasındakı fərq nədir?","o":["24 saat: məlumat operativliyini itirəcəksə; 48 saat: insan həyatı, sağlamlığı və ya azadlığına real təhlükə olduqda, hazırlığı vaxt tələb edən məlumatlar üçün","24 saat fiziki, 48 saat hüquqi şəxslər üçündür","24 saat şifahi, 48 saat yazılı sorğular üçündür","Fərq yoxdur"],"e":"Maddə 5.4 və 5.5 (yaşıl).","hl":1},{"d":13,"c":5,"id":"melumat-35","r":"Bənd 5.6","q":"Sorğu natamam və ya qeyri-dəqiq tərtib edilibsə, gömrük orqanı şəxsə çatışmazlıqlar barədə hansı müddətdə məlumat verir?","o":["5 iş günü","7 iş günü","3 iş günü","24 saat"],"e":"Maddə 5.6.","t":1},{"d":13,"c":5,"id":"melumat-36","r":"Bənd 5.7–5.8","q":"Həddən artıq sorğu olduqda icra müddəti nə qədər uzadıla bilər və şəxsə bu barədə hansı müddətdə məlumat verilir?","o":["Əlavə 7 iş günü; uzadılma barədə 5 iş günü ərzində","Əlavə 5 iş günü; 3 gün ərzində","Əlavə 14 gün; dərhal","Uzadıla bilməz"],"e":"Maddə 5.7 və 5.8: maksimum 7 + 7 = 14 iş günü.","t":1},{"d":13,"c":5,"id":"melumat-37","r":"Bənd 5.3, 5.7","q":"Uzadılma nəzərə alınmaqla sorğunun icrası üçün maksimum müddət nə qədərdir?","o":["14 iş günü","7 iş günü","10 iş günü","21 iş günü"],"e":"Maddə 5.3 (7 iş günü) və 5.7 (əlavə 7 iş günü).","t":1},{"d":13,"c":5,"id":"melumat-38","r":"Bənd 5.9","q":"Sorğu üzrə məlumatlar şəxslərə necə verilir?","o":["Ödənişsiz","Dövlət rüsumu ödənilməklə","Səhifəyə görə ödənişlə","Yalnız hüquqi şəxslərə ödənişlə"],"e":"Maddə 5.9 (rənglənib).","hl":1},{"d":13,"c":6,"id":"melumat-rq0","r":"Bənd 3.7","q":"Azərbaycan Respublikasının Nazirlər Kabinetinin 2012-ci il 3 avqust tarixli 167 nömrəli Qərarı ilə təsdiq edilmiş “Dövlət orqanlarına, hüquqi və fiziki şəxslərə gömrük məsələləri üzrə məlumatların verilməsi Qaydaları”na əsasən sorğuya dair tələblərdən hansılar yanlışdır ?","o":["Yazılı sorğuda şəxsin doğum tarixi və FİN-i mütləq göstərilməlidir","Yazılı sorğuda şəxsin müraciət etdiyi gömrük orqanının adı göstərilməlidir","Elektron poçtla göndərilən sorğular yazılı sorğulara qoyulan tələblərə cavab verməlidir","Müraciət yazılı və şifahi sorğu formasında edilə bilər"],"e":"Bənd 3.7: yazılı sorğuda 6 məlumat göstərilir: gömrük orqanının adı, hüquqi şəxsin adı və ya fiziki şəxsin adı və soyadı, əlaqə məlumatları, sorğunun məzmunu, informasiyanın təqdim edilmə forması, imza. Doğum tarixi və FİN tələb olunmur. Digər variantlar 3.7.1, 3.6, 3.3-dür.","ex":1},{"d":13,"c":6,"id":"melumat-rq1","r":"Bənd 3.4–3.7","q":"Azərbaycan Respublikasının Nazirlər Kabinetinin 2012-ci il 3 avqust tarixli 167 nömrəli Qərarı ilə təsdiq edilmiş “Dövlət orqanlarına, hüquqi və fiziki şəxslərə gömrük məsələləri üzrə məlumatların verilməsi Qaydaları”na əsasən sorğuya dair tələblərdən hansılar doğrudur ?","o":["Yazılı sorğu gömrük orqanına şəxsən təqdim edilə, yaxud poçt, telefaks və ya elektron poçt vasitəsilə göndərilə bilər","Müraciət yalnız yazılı sorğu formasında edilə bilər","Elektron poçtla göndərilən sorğulara heç bir tələb qoyulmur","Yazılı sorğuda şəxsin imzası tələb olunmur"],"e":"Bənd 3.4. Müraciət yazılı və şifahi ola bilər (3.3), elektron sorğu yazılı sorğu tələblərinə cavab verməlidir (3.6), imza mütləqdir (3.7.6).","ex":1},{"d":13,"c":6,"id":"melumat-rq2","r":"Bənd 4.1","q":"Azərbaycan Respublikasının Nazirlər Kabinetinin 2012-ci il 3 avqust tarixli 167 nömrəli Qərarı ilə təsdiq
