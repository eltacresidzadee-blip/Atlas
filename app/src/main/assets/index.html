asitəsilə Mərkəzi Banka ötürülməsini təmin edir","Mərkəzi Bank məlumatların kağız formada Dövlət Gömrük Komitəsinə ötürülməsini təmin edir","Müvəkkil banklar məlumatları elektron formada Maliyyə Nazirliyinə ötürür","Dövlət Gömrük Komitəsi məlumatları kağız formada İqtisadiyyat Nazirliyinə göndərir"],"e":"Bənd 12.3: gömrük bəyannamələri və ixrac müqavilələri də daxil olmaqla.","ex":1},{"d":14,"c":7,"id":"ixrac-rq7","r":"Bənd 12.4","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən müvəkkil banklar şəxslərin aidiyyəti hesablarına ixrac müqavilələri üzrə xarici valyutanın daxil olması barədə məlumatı müvafiq olaraq hansı müddətə kimə ötürür?","o":["Vəsait daxil olduğu gündən 3 (üç) iş günü ərzində Mərkəzi Banka","Vəsait daxil olduğu gündən 2 iş günü ərzində Dövlət Gömrük Komitəsinə","Vəsait daxil olduğu gündən 10 gün ərzində Mərkəzi Banka","Vəsait daxil olduğu gündən 3 iş günü ərzində Dövlət Gömrük Komitəsinə"],"e":"Bənd 12.4.","ex":1,"t":1},{"d":14,"c":7,"id":"ixrac-rq8","r":"Bənd 12.5","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən ixrac olunan malların müqabilində vəsaitlərin müəyyən olunmuş müddətdə ixracatçının müvəkkil bankdakı hesabına köçürülmədiyi müəyyən edildiyi halda Mərkəzi Bank tərəfindən hansı tədbirlər görülür?","o":["Nəzarət və digər tədbirlərin görülməsi məqsədilə 2 (iki) iş günü müddətində Dövlət Gömrük Komitəsinə məlumat verir","3 iş günü müddətində ixracatçının hesabını dondurur","Ixracatçıya 10 gün müddətində cərimə tətbiq edir","5 iş günü müddətində Maliyyə Nazirliyinə məlumat verir"],"e":"Bənd 12.5.","ex":1,"t":1},{"d":14,"c":7,"id":"ixrac-rq9","r":"Bənd 13.1","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən şəxslər tərəfindən xarici ölkələrdən mal alınmasına və xidmət göstərilməsi ilə bağlı olan hesablaşmalara nəzarət kim tərəfindən həyata keçirilir?","o":["Müvəkkil banklar","Dövlət Gömrük Komitəsi","Maliyyə Nazirliyi","İqtisadiyyat Nazirliyi"],"e":"Bənd 13.1.","ex":1},{"d":14,"c":7,"id":"ixrac-rq10","r":"Bənd 14.9","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən Dövlət Gömrük Komitəsi bütün ixrac-idxal əməliyyatları üzrə hər ay xarici ticarətin gömrük statistikasının məlumatlarını kimə təqdim edir?","o":["Prezidentə, Nazirlər Kabinetinə, İqtisadiyyat və Sənaye Nazirliyinə, Maliyyə Nazirliyinə, Kənd Təsərrüfatı Nazirliyinə, Vergilər Nazirliyinə, Qida Təhlükəsizliyi Agentliyinə, Dövlət Statistika Komitəsinə və Mərkəzi Banka","Yalnız Dövlət Statistika Komitəsinə","Yalnız Nazirlər Kabinetinə və Mərkəzi Banka","Milli Məclisə və Hesablama Palatasına"],"e":"Bənd 14.9: hesabat dövründən sonrakı ayın 15-dən gec olmayaraq.","ex":1},{"d":14,"c":7,"id":"ixrac-rq11","r":"Bənd 15.2","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən xarici ticarət əməliyyatları üzrə malların ölkə ərazisindən çıxarılmasına və bu əraziyə gətirilməsinə nəzarət kim tərəfindən həyata keçirilir?","o":["Dövlət Gömrük Komitəsi","Mərkəzi Bank","Dövlət Sərhəd Xidməti","İqtisadiyyat Nazirliyi"],"e":"Bənd 15.2.","ex":1},{"d":14,"c":7,"id":"ixrac-rq12","r":"Bənd 15.2","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən xarici ticarət əməliyyatlarının hesablaşmalar hissəsinə nəzarət kim tərəfindən həyata keçirilir?","o":["Mərkəzi Bank və Dövlət Gömrük Komitəsi","Yalnız Mərkəzi Bank","Yalnız müvəkkil banklar","Maliyyə Nazirliyi və Dövlət Vergi Xidməti"],"e":"Bənd 15.2.","ex":1},{"d":14,"c":7,"id":"ixrac-rq13","r":"1 nömrəli əlavə","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən aşağıdakı hansı malların idxalı Nazirlər Kabinetinin sərəncamı əsasında  həyata keçirilir?","o":["Qan, qan komponentləri və onlardan hazırlanan preparatlar","Bitkilərin mühafizəsi üçün istifadə edilən kimyəvi vasitələr","Baytarlıq xidmətində tətbiq edilən bioloji preparatlar","İncəsənət əsərləri və əntiq mallar"],"e":"1 nömrəli əlavə: hərbi texnika və silah, barıt və partlayıcılar, nüvə materialları, narkotik və psixotrop maddələr, qan və qan komponentləri, emal edilməmiş almaz (ixrac), ionlaşdırıcı şüa mənbələri. Digər variantlar 2 nömrəli əlavədəndir (rəy ilə).","ex":1},{"d":14,"c":7,"id":"ixrac-rq14","r":"1 nömrəli əlavə","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən aşağıdakı hansı malların ixracı Nazirlər Kabinetinin sərəncamı əsasında  həyata keçirilir?","o":["Emal edilməmiş almaz","Ozondağıdıcı maddələr","Çöl heyvanları və yabanı bitkilər","İxtiralar və «Nou Hau»"],"e":"1 nömrəli əlavə, 6-cı bənd (ixraca münasibətdə).","ex":1},{"d":14,"c":7,"id":"ixrac-rq15","r":"2 nömrəli əlavə","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən aşağıda gödstərilən hansı malların (xidmətlərin və əqli mülkiyyətin) idxalı müvafiq dövlət orqanının rəyi əsasında aparılır?","o":["Bitkilərin mühafizəsi üçün istifadə edilən kimyəvi vasitələr","Barıt, partlayıcı maddələr və pirotexniki məmulatlar","Nüvə materialları və texnologiyaları","Qan və qan komponentləri"],"e":"2 nömrəli əlavə, İdxal: Qida Təhlükəsizliyi Agentliyinin rəyi ilə. Digərləri NK-nın sərəncamı ilə aparılır (1 nömrəli əlavə).","ex":1},{"d":14,"c":7,"id":"ixrac-rq16","r":"2 nömrəli əlavə","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən baytarlıq xidmətində tətbiq edilən bioloji preparatların idxalı kimin rəyi əsasında həyata keçirilir?","o":["Qida Təhlükəsizliyi Agentliyinin","Səhiyyə Nazirliyinin","Kənd Təsərrüfatı Nazirliyinin","Ekologiya və Təbii Sərvətlər Nazirliyinin"],"e":"2 nömrəli əlavə.","ex":1},{"d":14,"c":7,"id":"ixrac-rq17","r":"2 nömrəli əlavə","q":"“Azərbaycan Respublikasında idxal-ixrac əməliyyatlarının tənzimlənməsi Qaydaları”na əsasən vəhşi heyvanlardan və yabanı bitkilərdən dərman istehsalı üçün xammalın ixracı zamanı kimin rəyi tələb olunur?","o":["Ekologiya və Təbii Sərvətlər Nazirliyinin və Səhiyyə Nazirliyinin","Yalnız Ekologiya və Təbii Sərvətlər Nazirliyinin","Qida Təhlükəsizliyi Agentliyinin","Mədəniyyət Nazirliyinin"],"e":"2 nömrəli əlavə: ilan, böyə və əqrəb zəhərləri də eyni qaydadadır.","ex":1},{"d":15,"c":0,"id":"patrul-0","r":"Qərar","q":"Keşik çəkmə (patrulluq) və gömrük müşahidəsi Qaydaları hansı aktla təsdiq edilib?","o":["DGK Kollegiyasının 22 iyul 2014-cü il tarixli 100/02/002 nömrəli Qərarı","Nazirlər Kabinetinin 22 iyul 2014-cü il tarixli 263 nömrəli Qərarı","DGK sədrinin 22 iyul 2014-cü il tarixli əmri","Nazirlər Kabinetinin 18 yanvar 2013-cü il tarixli 7 nömrəli Qərarı"],"e":"DGK Kollegiyasının 22.07.2014 tarixli 100/02/002 nömrəli Qərarı. Kollegiyanın sədri Aydın Əliyev imzalayıb. Eyni gün NK bəyan etmə Qaydalarını (263 nömrəli Qərar) təsdiq edib. Tələdir.","t":1},{"d":15,"c":0,"id":"patrul-1","r":"Qərar, preambula","q":"Kollegiya bu Qərarı DGK haqqında Əsasnamənin hansı bəndinə əsasən qəbul edib?","o":["5.11-ci bəndinə","5.11.6-cı yarımbəndinə","5.6.3-cü yarımbəndinə","3.1.25-ci yarımbəndinə"],"e":"Preambula: 5.11 (kollegiyanın qərar formasında qəbul etdiyi normativ aktlar). Etik Kodeksi təsdiq edən Qərar isə 5.11.6-ya əsaslanır.","t":1},{"d":15,"c":0,"id":"patrul-2","r":"Qərar, 2","q":"Qaydaların Ədliyyə Nazirliyinə təqdimini kim və hansı müddətdə təmin etməlidir?","o":["Hüquq şöbəsi, 3 gün müddətində","Kadrlar şöbəsi, 3 gün müddətində","Hüquqi Təminat İdarəsi, 10 gün müddətində","Aparat rəhbəri, 7 gün müddətində"],"e":"Qərarın 2-ci bəndi: Hüquq şöbəsi (Sənan Muxtarov). Etik Kodeksdə Hüquqi Təminat İdarəsi, Mərkəzi Bankda isə Hüquq departamenti göstərilib. Hamısında müddət 3 gündür.","t":1},{"d":15,"c":0,"id":"patrul-3","r":"Bənd 1.1","q":"Qaydalar 499 nömrəli Fərmanın hansı bəndinə əsasən hazırlanıb?","o":["28.7-ci bəndinə","27.2-ci bəndinə","1.2.5-ci yarımbəndinə","1.1.14-cü yarımbəndinə"],"e":"Maddə 1.1. Proqramdakı digər aktlar 499 nömrəli Fərmanın 27.2 (Etik Kodeks), 1.2.5 (bəyan etmə), 1.2.1 (SİO), 1.1.14 (yardım yükləri) və 1.1.7 (məlumatların verilməsi) bəndlərinə istinad edir.","t":1},{"d":15,"c":0,"id":"patrul-4","r":"Qeyd","q":"Sənəddəki qeydə görə keşik çəkmə və gömrük müşahidəsi Gömrük Məcəlləsinin hansı maddəsi ilə bağlıdır?","o":["56-cı maddə","146-cı maddə","31-ci maddə","13-cü maddə"],"e":"Sənədin başlığında “GM 56” qeydi var. 2.1-ci bənddə Məcəllənin 56.1 və 56.2-ci maddələrinə istinad olunur.","hl":1,"t":1},{"d":15,"c":1,"id":"patrul-5","r":"Bənd 1.2","q":"Qaydalara görə keşik çəkmə (patrulluq) və gömrük müşahidəsi nədir?","o":["Gömrük Məcəlləsinin 92-ci maddəsinə əsasən gömrük nəzarətinin formasıdır","Əməliyyat-axtarış tədbiridir","İnzibati xəta işi üzrə icraat növüdür","Gömrük rəsmiləşdirilməsinin mərhələsidir"],"e":"Maddə 1.2 (rənglənib).","hl":1},{"d":15,"c":1,"id":"patrul-6","r":"Bənd 1.3","q":"Keşik çəkmə necə həyata keçirilir?","o":["Piyada və ya nəqliyyatla, müəyyən olunmuş marşrutla hərəkət etməklə, təkbaşına və ya keşikçi (patrul) dəstəsinin tərkibində","Yalnız stasionar postda","Yalnız gizli şəkildə","Yalnız helikopterlə"],"e":"Maddə 1.3 (rənglənib): hüquqazidd hərəkətlərin aşkar və xəbərdar edilməsi, qarşısının alınması və profilaktikası üçün.","hl":1},{"d":15,"c":1,"id":"patrul-7","r":"Bənd 1.4","q":"Gömrük müşahidəsi necə həyata keçirilən müşahidədir?","o":["Aşkar və məqsədyönlü vizual müşahidə","Gizli əməliyyat müşahidəsi","Yalnız texniki vasitələrlə audio nəzarət","Sənədli yoxlama"],"e":"Maddə 1.4 (rənglənib).","hl":1},{"d":15,"c":1,"id":"patrul-8","r":"Bənd 1.4","q":"Gömrük müşahidəsi nəyin üzərində aparılır?","o":["Gömrük nəzarəti altında olan malların və nəqliyyat vasitələrinin daşınması, yükləmə-boşaltma və digər yük əməliyyatları üzərində","Şəxslərin telefon danışıqları üzərində","Bankların hesabları üzərində","Gömrük əməkdaşlarının özəl həyatı üzərində"],"e":"Maddə 1.4."},{"d":15,"c":2,"id":"patrul-9","r":"Bənd 2.1","q":"Gömrük Məcəlləsinin 56.1 və 56.2-ci maddələrinə əsasən keşik çəkmə neçə növ yerdə aparıla bilər?","o":["5","4","3","6"],"e":"Maddə 2.1.1–2.1.5: Xəzərin Azərbaycan bölməsi (adalar və qurğular daxil); dəmiryol vağzalları və stansiyaları; aeroportlar və aerodromlar; gömrük nəzarəti zonaları; beynəlxalq müqavilələrdə nəzərdə tutulduqda gömrük ərazisindən kənar ərazi.","t":1},{"d":15,"c":2,"id":"patrul-10","r":"Bənd 2.1.5","q":"Keşik çəkmə gömrük ərazisindən kənarda aparıla bilərmi?","o":["Bəli, Gömrük Məcəlləsinin 92.3-cü maddəsinə əsasən beynəlxalq müqavilələrdə nəzərdə tutulduqda","Xeyr, heç bir halda","Bəli, DGK sədrinin əmri ilə","Bəli, hər bir halda"],"e":"Maddə 2.1.5."},{"d":15,"c":2,"id":"patrul-11","r":"Bənd 2.1","q":"Aşağıdakılardan hansı keşik çəkmə aparıla bilən yerlər arasında sadalanmır?","o":["Yaşayış binaları","Xəzər dənizindəki süni adalar","Aeroportların uçuş-enmə zolağı","Dəmiryolunun ehtiyat yolları"],"e":"Maddə 2.1."},{"d":15,"c":2,"id":"patrul-12","r":"Bənd 2.2","q":"Keşik çəkmə və gömrük müşahidəsi nəyin əsasında həyata keçirilir?","o":["Gömrük orqanının rəisinin və ya onu əvəz edən şəxsin yazılı qərarı ilə","DGK sədrinin əmri ilə","Prokurorun sanksiyası ilə","Vəzifəli şəxsin öz təşəbbüsü ilə"],"e":"Maddə 2.2 (yaşıl): qərarda dəstənin tərkibi, yer, vaxt, obyektlər, marşrut, rabitə və dəstə rəhbəri müəyyən edilir.","hl":1},{"d":15,"c":2,"id":"patrul-13","r":"Bənd 2.2","q":"Keşikçi dəstəyə rəhbər kim təyin edilir?","o":["Dəstədə daha hazırlıqlı əməkdaş","Ən yüksək rütbəli əməkdaş","Ən uzun stajlı əməkdaş","Gömrük orqanının rəisi özü"],"e":"Maddə 2.2."},{"d":15,"c":2,"id":"patrul-14","r":"Bənd 2.4–2.5","q":"Keşik çəkmənin nəticələri necə rəsmiləşdirilir?","o":["Gömrük orqanının rəisinə raport təqdim olunur; rapota Məcəllənin 99-cu maddəsinə uyğun tərtib edilmiş protokol əlavə olunur","Yalnız şifahi məruzə edilir","Yalnız akt tərtib edilir","Elektron sistemdə qeyd aparılır, sənəd tələb olunmur"],"e":"Maddə 2.4 və 2.5 (rənglənib).","hl":1},{"d":15,"c":2,"id":"patrul-15","r":"Bənd 2.6","q":"Keşik çəkmə zamanı vəzifəli şəxs gömrük nəzarətinin hansı formalarından istifadə edə bilər?","o":["Məcəllənin 92.2-ci maddəsindəki bütün formalardan (84-cü maddə və digər aktlardakı istisnalar nəzərə alınmaqla)","Yalnız vizual müşahidədən","Yalnız sənəd yoxlamasından","Yalnız şəxsi müayinədən"],"e":"Maddə 2.6."},{"d":15,"c":2,"id":"patrul-16","r":"Bənd 2.7","q":"Keşik çəkmə zamanı istifadə olunan üsul və vasitələr hansı Qaydalarda göstərilib?","o":["NK-nın 18 yanvar 2013-cü il tarixli 7 nömrəli Qərarı ilə təsdiq edilmiş “Gömrük nəzarətinin həyata keçirilməsi Qaydaları”nın 1.6 və 1.7-ci bəndlərində","NK-nın 27 avqust 2012-ci il tarixli 186 nömrəli Qərarında","NK-nın 22 iyul 2014-cü il tarixli 263 nömrəli Qərarında","DGK-nın daxili təlimatında"],"e":"Maddə 2.7. 186 nömrəli Qərar texniki nəzarət vasitələri haqqındadır (3.1).","t":1},{"d":15,"c":2,"id":"patrul-17","r":"Bənd 2.8","q":"Keşik çəkmə və gömrük müşahidəsi hansı geyimdə aparılır?","o":["Xidməti geyim formasında","Mülki geyimdə","Xüsusi kamuflyajda","Vəziyyətdən asılı olaraq istənilən geyimdə"],"e":"Maddə 2.8 (rənglənib).","hl":1},{"d":15,"c":2,"id":"patrul-18","r":"Bənd 2.9","q":"Vəzifəli şəxs keşik çəkmə yerini və ya marşrutunu rəisə bildirməklə neçə halda tərk edə bilər?","o":["10","8","5","12"],"e":"Maddə 2.9.1–2.9.10 (rənglənib).","hl":1,"t":1},{"d":15,"c":2,"id":"patrul-19","r":"Bənd 2.9","q":"Aşağıdakılardan hansı keşik çəkmə marşrutunu tərk etmək üçün əsas DEYİL?","o":["Şəxsi işlərini həll etmək","Hüquqpozma törətmiş nəqliyyat vasitəsini təqib etmək","Qəfləti xəstəlik","Müəyyən olunmuş vaxtda yemək"],"e":"Maddə 2.9: hüquqpozmanın qarşısını almaq, təqib, şəxsi binaya gətirmək, fövqəladə hal, nəqliyyatı dayanacağa çatdırmaq, digər bölmələrə kömək, hadisə yerinin mühafizəsi, qəfləti xəstəlik, yemək, səlahiyyətli şəxsin göstərişi.","hl":1},{"d":15,"c":2,"id":"patrul-20","r":"Bənd 2.9","q":"Vəzifəli şəxs marşrutu tərk edərkən kimə bildirməlidir?","o":["Gömrük orqanının rəisinə (onu əvəz edən şəxsə)","Dəstə yoldaşına","DGK-nın növbətçi hissəsinə","Heç kimə bildirmək tələb olunmur"],"e":"Maddə 2.9 (rənglənib).","hl":1},{"d":15,"c":2,"id":"patrul-21","r":"Bənd 2.10","q":"Keşik çəkmənin təşkilinə və nəticələrin düzgün rəsmiləşdirilməsinə görə kim fərdi məsuliyyət daşıyır?","o":["Gömrük orqanının rəisi və ya onu əvəz edən şəxs","Dəstə rəhbəri","Hər bir dəstə üzvü","DGK-nın sədri"],"e":"Maddə 2.10."},{"d":15,"c":3,"id":"patrul-22","r":"Bənd 3.1","q":"Aparılma üsuluna görə gömrük müşahidəsinin növləri hansılardır?","o":["Birbaşa və vasitəli (texniki nəzarət vasitələri ilə)","Sistematik və birdəfəlik","Aşkar və gizli","Daxili və xarici"],"e":"Maddə 3.1 (rənglənib).","hl":1},{"d":15,"c":3,"id":"patrul-23","r":"Bənd 3.2","q":"Aparılma tezliyinə görə gömrük müşahidəsinin növləri hansılardır?","o":["Sistematik və birdəfəlik","Birbaşa və vasitəli","Aşkar və gizli","Gündəlik və həftəlik"],"e":"Maddə 3.2 (rənglənib).","hl":1},{"d":15,"c":3,"id":"patrul-24","r":"Bənd 3.1–3.2","q":"Gömrük müşahidəsinin təsnifat meyarları ilə növləri arasında düzgün uyğunluq hansıdır?","o":["Üsula görə: birbaşa / vasitəli; tezliyə görə: sistematik / birdəfəlik","Üsula görə: sistematik / birdəfəlik; tezliyə görə: birbaşa / vasitəli","Üsula görə: aşkar / gizli; tezliyə görə: daimi / müvəqqəti","Hər iki meyar üzrə: aşkar / gizli"],"e":"Maddə 3.1 və 3.2.","hl":1},{"d":15,"c":3,"id":"patrul-25","r":"Bənd 3.1","q":"Vasitəli gömrük müşahidəsində istifadə olunan texniki vasitələr hansı aktda göstərilib?","o":["NK-nın 27 avqust 2012-ci il tarixli 186 nömrəli Qərarı ilə təsdiq edilmiş texniki vasitələrin siyahısı və istifadə Qaydaları","NK-nın 18 yanvar 2013-cü il tarixli 7 nömrəli Qərarı","NK-nın 12 dekabr 2012-ci il tarixli 308 nömrəli Qərarı","DGK-nın 22 iyul 2014-cü il tarixli Qərarı"],"e":"Maddə 3.1.","t":1},{"d":15,"c":3,"id":"patrul-26","r":"Bənd 3.3","q":"Gömrük müşahidəsi gizli şəkildə aparıla bilərmi?","o":["Xeyr, aşkar əsaslarla, müşahidə aparılan şəxsə bildirilməklə aparılır","Bəli, həmişə gizli aparılır","Bəli, rəisin qərarı ilə","Yalnız gecə saatlarında gizli aparılır"],"e":"Maddə 3.3."},{"d":15,"c":3,"id":"patrul-27","r":"Bənd 3.4","q":"Aşağıdakılardan hansı gömrük müşahidəsinin obyektləri arasında YOXDUR?","o":["Gömrük əməkdaşlarının şəxsi avtomobilləri","Müşayiət olunmayan baqaj","Beynəlxalq poçt göndərişləri","Sərnişinlərin əl yükü"],"e":"Maddə 3.4 (rənglənib): gömrük nəzarəti altında olan bütün mallar və nəqliyyat vasitələri, əl yükü, müşayiət olunan və olunmayan baqaj, beynəlxalq poçt göndərişləri.","hl":1},{"d":15,"c":4,"id":"patrul-28","r":"Bənd 4.1","q":"Keşik çəkən vəzifəli şəxsin vəzifələri Gömrük Məcəlləsinin hansı maddəsinə əsaslanır və neçə vəzifə sadalanır?","o":["8-ci maddəsinə; 16 vəzifə","9-cu maddəsinə; 9 vəzifə","92-ci maddəsinə; 10 vəzifə","56-cı maddəsinə; 5 vəzifə"],"e":"Maddə 4.1.1–4.1.16. Hüquqlar isə Məcəllənin 9-cu maddəsinə əsaslanır və 9 hüquq sadalanır (5.1).","t":1},{"d":15,"c":4,"id":"patrul-29","r":"Bənd 4.1","q":"Aşağıdakılardan hansı keşik çəkən şəxsin VƏZİFƏSİDİR, hüququ deyil?","o":["İnsan alverçilərinin gömrük sərhədindən keçməsinin qarşısını almaq","Audio yazı, video və foto çəkilişləri aparmaq","Şəxslərdən sənəd və məlumat tələb etmək","Odlu silahdan istifadə etmək"],"e":"Maddə 4.1.11 vəzifədir. Qalanları 5.1-də hüquq kimi göstərilib."},{"d":15,"c":4,"id":"patrul-30","r":"Bənd 4.1.8","q":"Beynəlxalq terrorçuluqla mübarizədə keşik çəkən şəxsin vəzifəsi nədir?","o":["Digər hüquq mühafizə orqanlarına yardım göstərmək","Terrorçuluq işləri üzrə istintaq aparmaq","Antiterror əməliyyatına rəhbərlik etmək","Heç bir vəzifə nəzərdə tutulmayıb"],"e":"Maddə 4.1.8 (DGK haqqında Əsasnamənin 3.1.14-cü bəndi ilə eynidir)."},{"d":15,"c":5,"id":"patrul-31","r":"Bənd 5.1","q":"Keşik çəkən vəzifəli şəxsin hüquqları Gömrük Məcəlləsinin hansı maddəsinə əsaslanır və neçə hüquq sadalanır?","o":["9-cu maddəsinə; 9 hüquq","8-ci maddəsinə; 16 hüquq","56-cı maddəsinə; 10 hüquq","92-ci maddəsinə; 5 hüquq"],"e":"Maddə 5.1.1–5.1.9.","t":1},{"d":15,"c":5,"id":"patrul-32","r":"Bənd 5.1","q":"Aşağıdakılardan hansı keşik çəkən şəxsin HÜQUQUDUR?","o":["Şəxslərə gömrük qanunvericiliyinin pozulmasının aradan qaldırılması üçün yazılı xəbərdarlıq göndərmək","Milli və iqtisadi təhlükəsizliyi təmin etmək","İstehlakçıların hüquqlarının müdafiəsinə yardım göstərmək","Riskləri idarəetmə sistemi əsasında gömrük nəzarətini təkmilləşdirmək"],"e":"Maddə 5.1.7 hüquqdur. Qalanları 4.1-də vəzifə kimi göstərilib."},{"d":15,"c":5,"id":"patrul-33","r":"Bənd 5.1.6","q":"Keşik çəkən vəzifəli şəxs fiziki qüvvədən, xüsusi vasitələrdən və odlu silahdan hansı qaydada istifadə edə bilər?","o":["Gömrük Məcəlləsində nəzərdə tutulmuş hallarda və qaydada","Rəisin şifahi icazəsi ilə istənilən halda","İstifadə edə bilməz","Yalnız polisin iştirakı ilə"],"e":"Maddə 5.1.6."},{"d":15,"c":5,"id":"patrul-34","r":"Bənd 6","q":"Gömrük orqanlarının vəzifəli şəxslərinin keşik çəkmə və müşahidə aparmaq hüququ məhdudlaşdırıla bilərmi?","o":["Gömrük qanunvericiliyində müəyyən edilmiş hallar istisna olmaqla, məhdudlaşdırıla bilməz","Bəli, istənilən dövlət orqanının qərarı ilə","Bəli, yerli icra hakimiyyətinin qərarı ilə","Bəli, mülk sahibinin etirazı ilə"],"e":"Maddə 6 (rənglənib).","hl":1},{"d":16,"c":0,"id":"teminat-0","r":"Qərar","q":"Mallara gömrük təminatının vurulması Qaydaları hansı aktla təsdiq edilib?","o":["Nazirlər Kabinetinin 31 oktyabr 2012-ci il tarixli 253 nömrəli Qərarı","Nazirlər Kabinetinin 22 iyul 2014-cü il tarixli 263 nömrəli Qərarı","Nazirlər Kabinetinin 27 avqust 2012-ci il tarixli 186 nömrəli Qərarı","DGK Kollegiyasının 31 oktyabr 2012-ci il tarixli Qərarı"],"e":"NK-nın 31.10.2012 tarixli 253 nömrəli Qərarı. Qərarı Baş nazir Artur Rasi-zadə imzalayıb. 263 nömrəli Qərar bəyan etmə Qaydalarıdır. Nömrələr bir-birinə yaxındır, qarışdırmayın.","t":1},{"d":16,"c":0,"id":"teminat-1","r":"Qərar, preambula","q":"253 nömrəli Qərar 499 nömrəli Fərmanın hansı yarımbəndinin icrası üçün qəbul edilib?","o":["1.3.11","1.2.5","1.1.14","28.7"],"e":"Preambula: 1.3.11.","t":1},{"d":16,"c":0,"id":"teminat-2","r":"Bənd 1.1","q":"Qaydalar Gömrük Məcəlləsinin hansı maddəsinə əsasən hazırlanıb?","o":["205.1-ci maddəsinə","146.3-cü maddəsinə","8.0.27-ci maddəsinə","92-ci maddəsinə"],"e":"Maddə 1.1.","t":1},{"d":16,"c":0,"id":"teminat-3","r":"Bənd 1.1","q":"Qaydalar hansı mallara gömrük təminatının vurulmasını tənzimləyir?","o":["Gömrük nəzarəti altında qalmaqla idxalı, ixracı və ya tranzitlə keçirilməsi nəzərdə tutulan mallara","Yalnız ixrac mallarına","Yalnız sərbəst dövriyyədə olan mallara","Yalnız fiziki şəxslərin baqajına"],"e":"Maddə 1.1."},{"d":16,"c":1,"id":"teminat-4","r":"Bənd 2.1.1","q":"Qaydalara görə “gömrük təminatı” nədir?","o":["Gömrük nəzarəti və rəsmiləşdirilməsinin nəticələrini əks etdirmək üçün mallara və nəqliyyat vasitələrinə vurulan plomblar, möhürlər və digər eyniləşdirmə vasitələri","Gömrük borcunun ödənilməsinə verilən bank zəmanəti","Gömrük anbarının sığortası","Gömrük ödənişlərinin depozitə qoyulması"],"e":"Maddə 2.1.1 (rənglənib). Gömrük borcuna görə maliyyə “təminatı” ayrıca anlayışdır, qarışdırmayın.","hl":1},{"d":16,"c":1,"id":"teminat-5","r":"Bənd 2.1.2","q":"Qaydalara görə “bağlamalar” nədir?","o":["Gömrük nəzarəti altında olan malların kənar müdaxilədən qorunması üçün yerləşdirildiyi qablaşdırma vasitələri","Poçt göndərişləri","Fiziki şəxslərin baqajı","Nəqliyyat vasitələrinin yük bölmələri"],"e":"Maddə 2.1.2 (rənglənib).","hl":1},{"d":16,"c":2,"id":"teminat-6","r":"Bənd 3.1","q":"Mallar gömrük nəzarəti altında yerləşdirilərkən gömrük təminatını kim vurur?","o":["Gömrük nəzarətini həyata keçirən gömrük orqanının vəzifəli şəxsi","Daşıyıcı","Bəyannaməçi","SİO"],"e":"Maddə 3.1."},{"d":16,"c":2,"id":"teminat-7","r":"Bənd 3.2","q":"Eyniləşdirmə vasitələrini kim seçir və nəyə əsasən?","o":["Gömrük orqanının vəzifəli şəxsi, malların növündən və daşınma xüsusiyyətlərindən asılı olaraq","Bəyannaməçi, öz istəyi ilə","DGK sədri, ümumi qaydada","Daşıyıcı, nəqliyyat növünə görə"],"e":"Maddə 3.2."},{"d":16,"c":2,"id":"teminat-8","r":"Bənd 3.3","q":"Eyniləşdirmə vasitələri konteynerlərə və nəqliyyat vasitələrinə vurularkən neçə şərtə riayət edilməlidir?","o":["3","2","4","5"],"e":"Maddə 3.3.1–3.3.3 (rənglənib): sındırmadan müdaxilə mümkün olmamalı; sadə və etibarlı üsulla vurulmalı; yükün bütün yerləri baxış üçün əlçatan olmalı.","hl":1,"t":1},{"d":16,"c":2,"id":"teminat-9","r":"Bənd 3.3","q":"Aşağıdakılardan hansı gömrük təminatının vurulması şərtlərindən biri DEYİL?","o":["Təminat yalnız elektron olmalıdır","Təminatı sındırmadan və ya zədələmədən mallara müdaxilə mümkün olmamalıdır","Təminat sadə və etibarlı üsulla vurula bilməlidir","Yüklərin yerləşdirilə biləcəyi bütün yerlər gömrük baxışı üçün əlçatan olmalıdır"],"e":"Maddə 3.3 (rənglənib).","hl":1},{"d":16,"c":2,"id":"teminat-10","r":"Bənd 3.4","q":"Gömrük təminatının vurulma yerlərini müəyyənləşdirmək mümkün olmadıqda nə edilir?","o":["Mallar bağlamalara yerləşdirilir","Mallar gömrük anbarına göndərilir","Təminat vurulmur","Mallar müsadirə edilir"],"e":"Maddə 3.4."},{"d":16,"c":2,"id":"teminat-11","r":"Bənd 3.5","q":"Gömrük təminatı hansı xüsusiyyətə malik olmalıdır?","o":["Müdaxilədən sonra ilkin formaya qayıtmasını istisna edən konstruktiv quruluşa","Təkrar istifadə oluna bilməlidir","Elektron izləmə çipi olmalıdır","Rəngli olmalıdır"],"e":"Maddə 3.5 (rənglənib).","hl":1},{"d":16,"c":2,"id":"teminat-12","r":"Bənd 3.6","q":"Gömrük təminatının eyniləşdirmə işarələri haqqında məlumat harada qeyd edilir?","o":["Malların müşayiətedici sənədlərində","Yalnız gömrük orqanının jurnalında","DGK-nın saytında","Heç yerdə"],"e":"Maddə 3.6: hər təminatın xüsusi eyniləşdirmə işarələri olmalıdır."},{"d":16,"c":3,"id":"teminat-13","r":"Bənd 5.1","q":"Bağlamalara vurulmuş gömrük təminatı neçə halda DƏYİŞDİRİLİR?","o":["3","4","2","5"],"e":"Maddə 5.1.1–5.1.3 (rənglənib): fiziki yoxlama; icazə ilə prob və nümunə götürülməsi; icazə ilə mal əlavə edilməsi və ya bir hissəsinin çıxarılması.","hl":1,"t":1},{"d":16,"c":3,"id":"teminat-14","r" eydə alınmış şəxs korrupsiya hüquqpozmasının subyektidirmi?","o":["Bəli","Xeyr, yalnız seçildikdən sonra","Yalnız deputatlığa namizəd olduqda","Yalnız bələdiyyə seçkilərində"],"e":"Maddə 2.1.5."},{"d":18,"c":1,"id":"kor-11","r":"Maddə 3","q":"Qanun Azərbaycanın ərazisindən kənarda kimlərə tətbiq edilir?","o":["Azərbaycan vətəndaşlarına və Azərbaycanda qeydiyyatdan keçmiş hüquqi şəxslərə, beynəlxalq müqavilələrə uyğun olaraq","Bütün əcnəbilərə","Heç kimə","Yalnız diplomatlara"],"e":"Maddə 3 (rənglənib). Azərbaycanın ərazisində isə bütün fiziki (əcnəbilər və vətəndaşlığı olmayanlar da daxil) və hüquqi şəxslərə tətbiq edilir.","hl":1},{"d":18,"c":1,"id":"kor-12","r":"Maddə 4.1","q":"Korrupsiyaya qarşı mübarizəni kim həyata keçirir?","o":["Bütün orqanlar (qurumlar) və vəzifəli şəxslər səlahiyyətləri çərçivəsində; inzibati və ya cinayət məsuliyyəti yarandıqda hüquq mühafizə orqanları","Yalnız prokurorluq","Yalnız Korrupsiyaya qarşı mübarizə üzrə Komissiya","Yalnız məhkəmələr"],"e":"Maddə 4.1 (rənglənib).","hl":1},{"d":18,"c":1,"id":"kor-13","r":"Maddə 4.2–4.3","q":"Korrupsiyanın qarşısının alınması sahəsində ixtisaslaşmış orqan hansıdır və onun tərkibi necə formalaşır?","o":["Korrupsiyaya qarşı mübarizə üzrə Komissiya; üzvləri icra, qanunvericilik və məhkəmə hakimiyyəti orqanları təyin edir","Baş Prokurorluq; üzvləri Prezident təyin edir","Korrupsiyaya qarşı Mübarizə Baş İdarəsi; üzvləri Milli Məclis seçir","Hesablama Palatası; üzvləri NK təyin edir"],"e":"Maddə 4.2 və 4.3 (rənglənib). Komissiyanın səlahiyyətləri qanunla təsdiq edilən Əsasnamə ilə müəyyən olunur.","hl":1},{"d":18,"c":2,"id":"kor-14","r":"Maddə 5.1","q":"Vəzifəli şəxslər neçə növ maliyyə xarakterli məlumat təqdim etməlidir?","o":["6","5","4","7"],"e":"Maddə 5.1.1–5.1.6 (sənəddə “6” qeydi var): gəlirlər, əmlak, əmanət və qiymətli kağızlar, şirkətlərdə pay, 5500 manatdan yuxarı borc, 1100 manatdan yuxarı digər öhdəliklər.","hl":1,"t":1},{"d":18,"c":2,"id":"kor-15","r":"Maddə 5.1.5–5.1.6","q":"Vəzifəli şəxs hansı məbləğdən yuxarı borcu və digər maliyyə öhdəliyini bəyan etməlidir?","o":["Borc: 5500 manatdan yuxarı; digər öhdəliklər: 1100 manatdan yuxarı","Borc: 1100 manat; öhdəliklər: 5500 manat","Hər ikisi 5500 manatdan yuxarı","Hər ikisi 1100 manatdan yuxarı"],"e":"Maddə 5.1.5 və 5.1.6 (rənglənib).","hl":1,"t":1},{"d":18,"c":2,"id":"kor-16","r":"Maddə 5.1.1","q":"Gəlirlər barədə məlumat hansı göstəricilərlə təqdim edilir?","o":["Hər il, mənbəyi, növü və məbləği göstərilməklə","Yalnız məbləği ilə, 5 ildə bir","Yalnız mənbəyi ilə","Yalnız vəzifəyə təyin edilərkən"],"e":"Maddə 5.1.1 (“mənbəyini” rənglənib).","hl":1},{"d":18,"c":2,"id":"kor-17","r":"Maddə 6.3","q":"Maliyyə məlumatlarının üzrsüz səbəbdən təqdim edilməməsi və ya təhrif edilməsi nəyə səbəb ola bilər?","o":["İntizam məsuliyyətinə","Cinayət məsuliyyətinə, avtomatik olaraq","Heç bir məsuliyyətə","Yalnız inzibati cəriməyə"],"e":"Maddə 6.3 (rənglənib): xüsusi intizam qaydası olanlar həmin qaydalarla məsuliyyətə cəlb olunur.","hl":1},{"d":18,"c":2,"id":"kor-18","r":"Maddə 6.4","q":"Komissiya maliyyə tələblərinə əməl etməyən şəxslər barəsində nə edə bilər?","o":["Rəsmi dövlət qəzetində məlumat dərc etdirə bilər","Onları vəzifədən azad edə bilər","Onlara cərimə tətbiq edə bilər","Onların əmlakını müsadirə edə bilər"],"e":"Maddə 6.4 (rənglənib).","hl":1},{"d":18,"c":2,"id":"kor-19","r":"Maddə 7.1","q":"Vəzifəli şəxsin yaxın qohumları ilə bağlı hansı məhdudiyyət var?","o":["Seçkili vəzifələr və qanunla nəzərdə tutulan hallar istisna olmaqla, bilavasitə onun tabeliyində heç bir vəzifə tuta bilməzlər","Eyni orqanda işləyə bilməzlər","Dövlət qulluğuna qəbul edilə bilməzlər","Məhdudiyyət yoxdur"],"e":"Maddə 7.1. Gömrük Etik Kodeksinin 15.5-ci bəndi də eynidir."},{"d":18,"c":2,"id":"kor-20","r":"Maddə 7.2","q":"Yaxın qohumların birgə işləməsi qaydası pozulduqda pozuntu hansı müddətdə könüllü aradan qaldırılmalıdır, qaldırılmazsa nə olur?","o":["30 gün; tabeliyi istisna edən başqa vəzifəyə keçirilmə, mümkün olmadıqda biri vəzifədən azad edilir","15 gün; hər ikisi işdən çıxarılır","60 gün; cərimə tətbiq edilir","30 gün; rəhbər işdən azad edilir"],"e":"Maddə 7.2 (mavi). 7.3-ə görə azad edilən şəxs digər orqanlarda vəzifə tuta bilər.","hl":1,"t":1},{"d":18,"c":2,"id":"kor-21","r":"Maddə 8.2","q":"Vəzifəli şəxs bir il ərzində bir fiziki və ya hüquqi şəxsdən ümumi məbləği hansı həddən yuxarı hədiyyə qəbul edə bilməz?","o":["55 manat","100 manat","550 manat","1100 manat"],"e":"Maddə 8.2 (yaşıl): ondan yuxarı olan hədiyyələr orqana (quruma) məxsus hesab edilir.","hl":1,"t":1},{"d":18,"c":2,"id":"kor-22","r":"Maddə 8.2","q":"55 manatdan yuxarı olan hədiyyələr kimə məxsus hesab edilir?","o":["Vəzifəli şəxsin xidmət etdiyi orqana (quruma)","Dövlət büdcəsinə","Hədiyyəni verənə","Vəzifəli şəxsə"],"e":"Maddə 8.2 (yaşıl).","hl":1},{"d":18,"c":2,"id":"kor-23","r":"Maddə 8.3","q":"Bu Qanuna görə vəzifəli şəxs hədiyyəni qəbul edib-etməməklə bağlı qərara gələ bilmirsə, kimin rəyini öyrənməlidir?","o":["Səlahiyyətli struktur bölmənin (şəxsin)","Birbaşa rəhbərinin","Komissiyanın","Prokurorun"],"e":"Maddə 8.3 (yaşıl). Gömrük Etik Kodeksi də eynidir. “Dövlət qulluqçularının etik davranış qaydaları haqqında” Qanunda (14.2) isə birbaşa rəhbər göstərilib.","hl":1},{"d":18,"c":2,"id":"kor-24","r":"Maddə 8.5","q":"Nemət vəzifəli şəxsə ondan asılı olmayan səbəblərdən verilərsə, o, nə etməlidir?","o":["Səlahiyyətli struktur bölməyə məlumat verməli və neməti orqana akt üzrə təhvil verməlidir","Neməti saxlaya bilər","Neməti verənə poçtla qaytarmalıdır","Polisə müraciət etməlidir"],"e":"Maddə 8.5."},{"d":18,"c":2,"id":"kor-25","r":"Maddə 8-1.2","q":"Orqanda korrupsiya risklərinin müəyyən edilməsi, təhlili və qiymətləndirilməsi hər il hansı dövrdə aparılır?","o":["Yanvarın 15-dən aprelin 15-dək, əvvəlki ili əhatə etməklə","Yanvarın 1-dən martın 1-dək","Sentyabrın 1-dən dekabrın 31-dək","İl ərzində istənilən vaxt"],"e":"Maddə 8-1.2: daha çox şikayət olan bölmələrdə rəhbərin qərarı ilə başqa müddətlərdə də aparıla bilər.","t":1},{"d":18,"c":2,"id":"kor-26","r":"Maddə 8-1.4","q":"Korrupsiya riskləri və görülmüş tədbirlər barədə məlumat Komissiyaya hansı tarixədək təqdim edilir?","o":["Hər il iyunun 1-dək","Hər il yanvarın 31-dək","Hər il aprelin 15-dək","Hər il fevralın 20-dək"],"e":"Maddə 8-1.4: bu məlumatlar dövri olaraq ictimaiyyətə də açıqlanır.","t":1},{"d":18,"c":2,"id":"kor-27","r":"Maddə 8-1.3","q":"Korrupsiya risklərinin qiymətləndirilməsində neçə növ məlumat nəzərə alınır?","o":["7","5","6","4"],"e":"Maddə 8-1.3.1–8-1.3.7: sorğular, müraciətlər, media və internet, hüquqi aktlar, maliyyə nəzarəti və audit, mütəmadi hallar, inzibati mübahisələr.","t":1},{"d":18,"c":2,"id":"kor-28","r":"Maddə 8-1.1","q":"Korrupsiya risklərinin idarə edilməsi üçün səlahiyyətli struktur bölməni kim müəyyən edir?","o":["Orqanın (qurumun) rəhbəri","Komissiya","Nazirlər Kabineti","Baş Prokurorluq"],"e":"Maddə 8-1.1."},{"d":18,"c":3,"id":"kor-29","r":"Maddə 9.1","q":"Korrupsiya ilə əlaqədar hüquqpozmalar hansı iki qrupdan ibarətdir?","o":["Bilavasitə korrupsiya hüquqpozmaları və korrupsiyaya şərait yaradan hüquqpozmalar","İnzibati və cinayət hüquqpozmaları","Fərdi və kollektiv hüquqpozmalar","Daxili və xarici hüquqpozmalar"],"e":"Maddə 9.1 (rənglənib).","hl":1},{"d":18,"c":3,"id":"kor-30","r":"Maddə 9.2","q":"9.2-ci maddədə neçə korrupsiya hüquqpozması sadalanır?","o":["7","13","6","10"],"e":"Maddə 9.2 (sənəddə “7, əzbər, ‘-ması’ ilə bitir” qeydi var).","hl":1,"t":1},{"d":18,"c":3,"id":"kor-31","r":"Maddə 9.3","q":"9.3-cü maddədə neçə korrupsiyaya şərait yaradan hüquqpozma sadalanır?","o":["13","7","10","12"],"e":"Maddə 9.3 (sənəddə “13, ‘-maq’ ilə bitir” qeydi var).","hl":1,"t":1},{"d":18,"c":3,"id":"kor-32","r":"Maddə 9.2, 9.3","q":"Sənəddəki yadda saxlama qeydinə görə 9.2 və 9.3-cü maddələrdəki hüquqpozmalar necə ayırd edilir?","o":["Korrupsiya hüquqpozmaları (9.2, 7 bənd) “-ması” ilə, korrupsiyaya şərait yaradanlar (9.3, 13 bənd) “-maq” ilə bitir","Hər ikisi “-maq” ilə bitir","9.2: 13 bənd; 9.3: 7 bənd","Fərq yoxdur"],"e":"Sənəddəki qeyd: məsələn, 9.2.1 “…qəbul etməsi”, 9.3.1 isə “…məşğul olmaq”.","hl":1},{"d":18,"c":3,"id":"kor-33","r":"Maddə 9.2, 9.3","q":"“Vəzifəli şəxsin xidməti vəzifəsini icra etdiyi dövrdə elmi, pedaqoji və yaradıcılıq fəaliyyəti istisna olmaqla, digər ödənişli vəzifə tutması” hansı qrupa aiddir?","o":["Korrupsiyaya şərait yaradan hüquqpozmalara (9.3.1)","Bilavasitə korrupsiya hüquqpozmalarına (9.2)","Hüquqpozma sayılmır","Cinayətə"],"e":"Maddə 9.3.1 (rənglənib).","hl":1},{"d":18,"c":3,"id":"kor-34","r":"Maddə 9.2.4","q":"Vəzifəli şəxsin xidməti vəzifəsi ilə əlaqədar nemətləri bazar qiymətindən aşağı qiymətə əldə etməsi hansı hüquqpozmadır?","o":["Bilavasitə korrupsiya hüquqpozması (9.2.4)","Korrupsiyaya şərait yaradan hüquqpozma","Hüquqpozma deyil","Vergi pozuntusu"],"e":"Maddə 9.2.4 (rənglənib).","hl":1},{"d":18,"c":3,"id":"kor-35","r":"Maddə 9.2.6–9.2.7","q":"Vəzifəli şəxsin qərarına qanunsuz təsir göstərə biləcəyini bildirən şəxsə nemət təklif edilməsi və həmin şəxsin onu qəbul etməsi hansı hüquqpozmadır?","o":["Hər ikisi bilavasitə korrupsiya hüquqpozmasıdır (nüfuz alveri)","Korrupsiyaya şərait yaradan hüquqpozma","Yalnız qəbul etmək hüquqpozmadır","Hüquqpozma deyil, çünki vəzifəli şəxs iştirak etmir"],"e":"Maddə 9.2.6 (mavi) və 9.2.7 (sarı).","hl":1},{"d":18,"c":3,"id":"kor-36","r":"Maddə 9.3.9","q":"Qanunla nəzərdə tutulmayan sənədləri fiziki şəxslərdən tələb etmək hansı hüquqpozmadır?","o":["Korrupsiyaya şərait yaradan hüquqpozma (9.3.9)","Bilavasitə korrupsiya hüquqpozması","İnzibati xəta deyil","Cinayət"],"e":"Maddə 9.3.9 (rənglənib).","hl":1},{"d":18,"c":3,"id":"kor-37","r":"Maddə 9.3.12","q":"Fiziki və hüquqi şəxslərin hüquqlarının həyata keçirilməsində süni maneələr yaratmaq hansı hüquqpozmadır?","o":["Korrupsiyaya şərait yaradan hüquqpozma (9.3.12)","Bilavasitə korrupsiya hüquqpozması","Hüquqpozma deyil","İntizam xətası deyil"],"e":"Maddə 9.3.12 (mavi).","hl":1},{"d":18,"c":3,"id":"kor-38","r":"Maddə 9.3","q":"Aşağıdakılardan hansı 9.3-cü maddədəki korrupsiyaya şərait yaradan hüquqpozmalardan biri DEYİL?","o":["Elmi-pedaqoji fəaliyyətlə məşğul olmaq","Orqanın vəsaitlərini qanunsuz olaraq seçki fonduna vermək","Tabe olduğu orqanın işi üzrə şəxsin nümayəndəsi kimi iştirak etmək","Qanunla verilməli məlumatların verilməsini gecikdirmək"],"e":"Elmi, pedaqoji və yaradıcılıq fəaliyyəti istisna kimi göstərilib (9.3.1, 9.3.3).","hl":1},{"d":18,"c":3,"id":"kor-39","r":"Maddə 9.4","q":"Korrupsiya ilə əlaqədar hüquqpozmalar başqa qanunlarda da müəyyən edilə bilərmi?","o":["Bəli, vəzifəli şəxslərin fəaliyyətini və statusunu tənzimləyən qanunvericilik aktlarında","Xeyr, yalnız bu Qanunda","Yalnız Cinayət Məcəlləsində","Yalnız Prezident fərmanında"],"e":"Maddə 9.4."},{"d":18,"c":3,"id":"kor-40","r":"Maddə 10.1","q":"Korrupsiya ilə əlaqədar hüquqpozmalar hansı məsuliyyət növlərinə səbəb olur?","o":["4: intizam, mülki-hüquqi, inzibati, cinayət","2: inzibati və cinayət","3: intizam, inzibati, cinayət","1: yalnız cinayət"],"e":"Maddə 10.1 (imtahan sualı).","hl":1,"t":1,"ex":1},{"d":18,"c":3,"id":"kor-41","r":"Maddə 10.4","q":"9-cu maddədəki hüquqpozmalar inzibati və ya cinayət məsuliyyəti yaratmadıqda nəyə səbəb olur?","o":["Xüsusi hallara riayət edilməklə intizam məsuliyyətinə","Heç bir məsuliyyətə","Mülki məsuliyyətə, avtomatik","Komissiyanın xəbərdarlığına"],"e":"Maddə 10.4. Gömrük orqanlarında xidmət haqqında Əsasnamənin 69-cu maddəsi də bu hal üçün intizam tənbehi nəzərdə tutur."},{"d":18,"c":3,"id":"kor-42","r":"Maddə 10.4.1–10.4.4","q":"Korrupsiya hüquqpozması törətmiş müxtəlif şəxslər barədə korrupsiyaya qarşı mübarizə aparan orqan kimə məlumat verir?","o":["Dövlət orqanına seçilmiş şəxs: seçildiyi orqana; bələdiyyə üzvü: seçki komissiyasına; namizəd: Seçki Məcəlləsindəki tədbirlər; hakim: Məhkəmə-Hüquq Şurasına","Hamısı üzrə: Prezidentə","Hamısı üzrə: Milli Məclisə","Hamısı üzrə: Ali Məhkəməyə"],"e":"Maddə 10.4.1–10.4.4 (rənglənib).","hl":1},{"d":18,"c":3,"id":"kor-43","r":"Maddə 10.4.2","q":"Bələdiyyə üzvünün korrupsiya hüquqpozması barədə material daxil olduqdan sonra seçki komissiyası hansı müddətdə bələdiyyəyə məlumat verir?","o":["5 gün","10 gün","30 gün","3 gün"],"e":"Maddə 10.4.2 (rənglənib).","hl":1,"t":1},{"d":18,"c":3,"id":"kor-44","r":"Maddə 10.4.4","q":"Hakim korrupsiya hüquqpozması törətdikdə kimə məlumat verilir?","o":["Məhkəmə-Hüquq Şurasına","Ali Məhkəməyə","Konstitusiya Məhkəməsinə","Ədliyyə Nazirliyinə"],"e":"Maddə 10.4.4 (rənglənib).","hl":1},{"d":18,"c":3,"id":"kor-45","r":"Maddə 11.1–11.2","q":"Fiziki və hüquqi şəxslər cinayət tərkibi yaratmayan korrupsiya hüquqpozmasına görə necə məsuliyyət daşıyır?","o":["İnzibati qaydada cərimə edilirlər; hüquqi şəxslərə cinayət tərkibi olduqda cərimə və ya digər cinayət-hüquqi tədbirlər tətbiq edilir","Heç bir məsuliyyət daşımırlar","Yalnız xəbərdarlıq edilir","Yalnız intizam məsuliyyəti daşıyırlar"],"e":"Maddə 11.1–11.2 (rənglənib).","hl":1},{"d":18,"c":3,"id":"kor-46","r":"Maddə 11-1.1","q":"Korrupsiya hüquqpozması barədə məlumat hansı formada verilə bilər?","o":["Yazılı (o cümlədən elektron) və ya şifahi","Yalnız yazılı","Yalnız notarial təsdiqli","Yalnız elektron"],"e":"Maddə 11-1.1: hər bir şəxs məlumat verə bilər."},{"d":18,"c":3,"id":"kor-47","r":"Maddə 11-1.5","q":"Səlahiyyətli struktur bölmə korrupsiya barədə məlumatı hansı müddətdə araşdırmalı və nəticəni bildirməlidir?","o":["Qeydə alındığı gündən 20 iş günü","10 iş günü","30 gün","5 iş günü"],"e":"Maddə 11-1.5 (rənglənib): “Vətəndaşların müraciətləri haqqında” Qanuna uyğun.","hl":1,"t":1},{"d":18,"c":3,"id":"kor-48","r":"Maddə 11-1.7–11-1.8","q":"Korrupsiya barədə məlumat orqanın RƏHBƏRİ ilə bağlı olduqda məlumat verən şəxs hara müraciət edə bilər?","o":["Rəhbərdən yuxarı vəzifəli şəxsə və ya korrupsiyaya qarşı mübarizə sahəsində ixtisaslaşmış orqanlara","Yalnız həmin rəhbərə","Yalnız mediaya","Yalnız səlahiyyətli struktur bölməyə"],"e":"Maddə 11-1.8. Məlumat səlahiyyətli bölmə ilə bağlıdırsa, orqanın rəhbərinə təqdim edilir (11-1.7)."},{"d":18,"c":3,"id":"kor-49","r":"Maddə 11-1.3","q":"Səlahiyyətli struktur bölmə hansı işlərdə iştirak etməməlidir?","o":["Həvəsləndirmə və intizam tənbehi tətbiqində, insan resurslarının idarə olunmasında və attestasiyada","Korrupsiya məlumatlarının araşdırılmasında","Konfidensial məsləhət verilməsində","Risklərin idarə edilməsində"],"e":"Maddə 11-1.3: zəruri müstəqilliyə malik olmalıdır."},{"d":18,"c":3,"id":"kor-50","r":"Maddə 11-2.1","q":"Məlumat verən şəxs adının açıqlanmasını istəmirsə, nə olur?","o":["Konfidensiallığı təmin edilir; yalnız onun yazılı razılığı ilə açıqlana bilər","Məlumat qəbul edilmir","Adı mütləq açıqlanır","Yalnız məhkəmə qərarı ilə gizli saxlanılır"],"e":"Maddə 11-2.1 (bənövşəyi).","hl":1},{"d":18,"c":3,"id":"kor-51","r":"Maddə 11-2.2","q":"Məlumat verən işçi ona qarşı qisas tədbirləri tətbiq edildiyinə dair dəlil irəli sürdükdə sübut yükü kimin üzərinə düşür?","o":["İşəgötürənin (dəlilləri təkzib etmək)","Məlumat verən işçinin","Komissiyanın","Prokurorluğun"],"e":"Maddə 11-2.2."},{"d":18,"c":3,"id":"kor-52","r":"Maddə 11-2.3","q":"Məlumat verən şəxsə real ölüm və ya zor tətbiqi təhlükəsi olduqda təhlükəsizlik tədbirləri necə tətbiq edilir?","o":["Prokurorluğa müraciət əsasında, cinayət prosesində iştirak edən şəxslərin dövlət müdafiəsi haqqında Qanunla","Polisin öz təşəbbüsü ilə","Komissiyanın qərarı ilə","İşəgötürənin qərarı ilə"],"e":"Maddə 11-2.3."},{"d":18,"c":3,"id":"kor-53","r":"Maddə 11-2.4","q":"Korrupsiya barədə məlumat vermiş işçi attestasiyadan keçirildikdə hansı tələb var?","o":["Səlahiyyətli struktur bölmənin nümayəndəsi attestasiya komissiyasının iclasında iştirak etməlidir","Attestasiya təxirə salınır","İşçi attestasiyadan azad edilir","Komissiyanın üzvü iştirak etməlidir"],"e":"Maddə 11-2.4 (bənövşəyi).","hl":1},{"d":18,"c":3,"id":"kor-54","r":"Maddə 11-2.6","q":"Məlumat verən şəxsin dövlət müdafiəsi hansı halda tətbiq olunmur?","o":["Bilə-bilə yalan məlumat verildikdə və ya qanunsuz nemət əldə etmək məqsədilə məlu edilir (digər öhdəliklər — 1100 manatdan yuxarı).","ex":1},{"d":18,"c":5,"id":"kor-rq18","r":"Maddə 6.3","q":"\"Korrupsiyaya qarşı mübarizə haqqında\" Azərbaycan Respublikasının Qanununa əsasən vəzifəli şəxslər tərəfindən maliyyə xarakterli tələblərin əməl olunmamasına görə hansı məsuliyyət tədbiri nəzərdə tutulmuşdur?","o":["İntizam məsuliyyətinə cəlb olunma","Vəzifədən avtomatik azad olunma","5500 manat cərimə","Əmlak müsadirəsi"],"e":"Maddə 6.3. Bundan əlavə, Komissiya rəsmi dövlət qəzetində məlumat dərc etdirə bilər (6.4).","ex":1},{"d":18,"c":5,"id":"kor-rq19","r":"Preambula","q":"\"Korrupsiyaya qarşı mübarizə haqqında\" Azərbaycan Respublikasının Qanununa əsasən aşağıdakılardan hansı bu Qanunun yönəlmə istiqamətinə (məqsədlərinə) aid deyil:","o":["Vergi daxilolmalarının artırılması","Korrupsiya ilə əlaqədar hüquqpozmaların aşkar edilməsi, qarşısının alınması və nəticələrinin aradan qaldırılması","Orqanlara əhalinin etimadının möhkəmləndirilməsi","Peşəkar kadrların orqanlarda qulluğa həvəsləndirilməsi"],"e":"Preambula: hüquqpozmaların aşkar edilməsi, qarşısının alınması, nəticələrinin aradan qaldırılması, sosial ədalət, insan hüquqlarının müdafiəsi, iqtisadiyyat üçün əlverişli şərait, etimadın möhkəmləndirilməsi, peşəkar kadrların həvəsləndirilməsi.","ex":1},{"d":18,"c":5,"id":"kor-rq20","r":"Maddə 2.2","q":"\"Korrupsiyaya qarşı mübarizə haqqında\" Azərbaycan Respublikasının Qanunun məqsədi üçün vəzifəli şəxs hesab edilirlər:","o":["2.1.1–2.1.8-ci maddələrdə göstərilən şəxslər","2.1.1–2.1.10-cu maddələrdə göstərilən şəxslər","Yalnız dövlət orqanlarına seçilmiş və ya təyin edilmiş şəxslər","Yalnız inzibati vəzifə tutan dövlət qulluqçuları"],"e":"Maddə 2.2.","ex":1},{"d":18,"c":5,"id":"kor-rq21","r":"Maddə 6.2","q":"\"Korrupsiyaya qarşı mübarizə haqqında\" Azərbaycan Respublikasının Qanununa əsasən maliyyə xarakterli tələblərə əməl olunmasına nəzarətin həyata keçirilməsi qaydaları müəyyən edilir:","o":["Qanunvericiliklə","Komissiyanın qərarı ilə","Hər bir orqanın rəhbərinin əmri ilə","Nazirlər Kabinetinin sərəncamı ilə"],"e":"Maddə 6.2.","ex":1},{"d":19,"c":0,"id":"dq2-0","r":"Rekvizitlər","q":"“Dövlət qulluğu haqqında” Qanun nə vaxt, kim tərəfindən imzalanıb və nömrəsi nədir?","o":["21 iyul 2000-ci il, Heydər Əliyev, № 926-IQ","13 yanvar 2004-cü il, İlham Əliyev, № 580-IIQ","21 iyul 2000-ci il, Heydər Əliyev, № 962-IQ","31 may 2007-ci il, İlham Əliyev, № 352-IIIQ"],"e":"Qanunun sonunda: Bakı, 21 iyul 2000-ci il, № 926-IQ, imza: Heydər Əliyev.","t":1},{"d":19,"c":0,"id":"dq2-1","r":"Preambula","q":"Preambulaya görə Qanun dövlət qulluğunun hansı əsaslarını müəyyən edir?","o":["Hüquqi, təşkilati və maliyyə-iqtisadi","Hüquqi, siyasi və sosial","Təşkilati, kadr və intizam","Hüquqi, etik və maliyyə"],"e":"Preambula (rənglənib).","hl":1},{"d":19,"c":0,"id":"dq2-2","r":"Preambula","q":"Qanun Konstitusiyanın hansı müddəasına uyğun qəbul edilib?","o":["94-cü maddənin I hissəsinin 19-cu bəndinə","113-cü maddəyə","7-ci maddənin III hissəsinə","95-ci maddənin I hissəsinə"],"e":"Preambula. 113-cü maddə mərkəzi icra hakimiyyəti orqanları ilə, 7-ci maddənin III hissəsi Ali kateqoriya orqanlarla bağlı xatırlanır."},{"d":19,"c":1,"id":"dq2-3","r":"Maddə 1.1.1","q":"Qanuna görə “dövlət qulluğu” nədir?","o":["Konstitusiyaya və digər normativ hüquqi aktlara uyğun olaraq dövlətin məqsəd və funksiyalarının həyata keçirilməsi sahəsində dövlət qulluğu vəzifəsində xidmət","Dövlət orqanında tutulan ştat vahidi","Dövlət orqanının struktur qurumu","Dövlət büdcəsindən maaş alan hər bir şəxsin fəaliyyəti"],"e":"Maddə 1.1.1 (rənglənib). Sənəddəki qeyd: dövlət qulluğu “prosesdir”, vəzifə isə ştat vahididir (1.1.7).","hl":1},{"d":19,"c":1,"id":"dq2-4","r":"Maddə 1.1.1, 1.1.7","q":"Sənəddəki qeydə görə “dövlət qulluğu” ilə “dövlət qulluğu vəzifəsi” arasında əsas fərq nədir?","o":["Dövlət qulluğu xidmətdir (prosesdir), vəzifə isə ştat cədvəlində müəyyən edilən ştat vahididir","Hər ikisi ştat vahididir","Dövlət qulluğu ştat vahidi, vəzifə isə prosesdir","Fərq yoxdur"],"e":"Maddə 1.1.1 (qeyd: “prosesdir”) və 1.1.7 (“ştat vahidi” rənglənib).","hl":1},{"d":19,"c":1,"id":"dq2-5","r":"Maddə 1.1.2","q":"Qanuna görə “dövlət qulluğunun xüsusi növü” hansı rütbələr nəzərdə tutulan vəzifələrdə qulluqdur?","o":["Xüsusi, hərbi və ya diplomatik","Hərbi, polis və gömrük","Xüsusi, ali və ixtisas","Diplomatik, ədliyyə və prokurorluq"],"e":"Maddə 1.1.2 (rənglənib).","hl":1},{"d":19,"c":1,"id":"dq2-6","r":"Maddə 1.1.3","q":"Aşağıdakılardan hansı “dövlət qulluqçusu” anlayışının əlamətlərindən biri DEYİL?","o":["Əmək haqqını həm də sahibkarlıq gəlirindən alması","Dövlət məvacibini yalnız 1.1.4-dəki mənbələrdən alması","İnzibati və ya yardımçı vəzifə tutması və ixtisas dərəcəsi verilməsi","İnzibati vəzifəyə ilk dəfə daimi qəbul edilərkən and içməsi"],"e":"Maddə 1.1.3: yalnız 1.1.4-dəki mənbələrdən dövlət məvacibi alan, inzibati və ya yardımçı vəzifə tutan, ixtisas dərəcəsi verilən, and içən, Azərbaycan vətəndaşı olan dövlət orqanı işçisi.","hl":1},{"d":19,"c":1,"id":"dq2-7","r":"Maddə 1.1.3","q":"Dövlət qulluqçusu Azərbaycan Respublikasına sadiq olacağına dair and içməni nə vaxt edir?","o":["İnzibati vəzifə üzrə ilk dəfə daimi dövlət qulluğuna qəbul edilərkən","Hər yeni vəzifəyə təyin edilərkən","Yardımçı vəzifəyə qəbul edilərkən","İxtisas dərəcəsi verilərkən"],"e":"Maddə 1.1.3 (“ilk dəfə”, “and içən” rənglənib).","hl":1},{"d":19,"c":1,"id":"dq2-8","r":"Maddə 1.1.4","q":"Dövlət orqanı hansı mənbələrdən maliyyələşdirilir?","o":["Azərbaycanın dövlət büdcəsindən, Naxçıvan MR büdcəsindən və qanunla müəyyən edilən hallarda əlavə olaraq büdcədənkənar vəsaitlər hesabına","Yalnız dövlət büdcəsindən","Yalnız büdcədənkənar vəsaitlər hesabına","Dövlət büdcəsindən və qrantlardan, istənilən halda"],"e":"Maddə 1.1.4 (rənglənib). Büdcədənkənar vəsait yalnız qanunla müəyyən edilən hallarda və əlavə olaraq.","hl":1},{"d":19,"c":1,"id":"dq2-9","r":"Maddə 1.1.4","q":"Qanuna görə dövlət orqanı hansı strukturuna malik olan nədir?","o":["7-ci maddədə nəzərdə tutulan struktura (şöbə, sektor) malik olan dövlət təsisatı","Publik hüquqi şəxs","Məhdud məsuliyyətli cəmiyyət","Qeyri-kommersiya təşkilatı"],"e":"Maddə 1.1.4 (“dövlət təsisatı” rənglənib; qeyd: şöbə, sektor).","hl":1},{"d":19,"c":1,"id":"dq2-10","r":"Maddə 1.1.6","q":"Dövlət məvacibi necə ödənilir?","o":["Pul formasında, nağdsız qaydada, aylıq","Pul formasında, nağd, rüblük","Natura və pul formasında, aylıq","Nağdsız qaydada, hər iki həftədən bir"],"e":"Maddə 1.1.6 (“pul”, “nağdsız”, “aylıq” rənglənib).","hl":1},{"d":19,"c":1,"id":"dq2-11","r":"Maddə 1.1.5","q":"Dövlət orqanlarının kateqoriyası (təsnifatı) hansı göstəricilər nəzərə alınmaqla müəyyən edilir?","o":["Statusu, iyerarxiyası və yurisdiksiyası (ölkə, regional və yerli səviyyədə)","İşçi sayı, büdcəsi və yerləşdiyi yer","Yaranma tarixi və tabeliyi","Funksiyaları və rəhbərinin vəzifəsi"],"e":"Maddə 1.1.5 və 8.1. Qeyd: yurisdiksiya — hüquqi sahədə fəaliyyət dairəsi.","hl":1},{"d":19,"c":1,"id":"dq2-12","r":"Maddə 1.1.9–1.1.10","q":"İnzibati vəzifə ilə yardımçı vəzifə arasında əsas fərq nədir?","o":["İnzibati vəzifə struktur bölmənin səlahiyyətlərini bilavasitə həyata keçirir, yardımçı vəzifə isə bölmənin fəaliyyətini təmin edir","İnzibati vəzifə rəhbər vəzifədir, yardımçı vəzifə icraçıdır","Yardımçı vəzifə səlahiyyətləri bilavasitə həyata keçirir","İnzibati vəzifə ştat cədvəlində olmur"],"e":"Maddə 1.1.9 (“səlahiyyətlərini bilavasitə həyata keçirən” xətt çəkilib) və 1.1.10 (“təmin edən”).","hl":1},{"d":19,"c":1,"id":"dq2-13","r":"Maddə 1.1.11","q":"İnzibati və yardımçı vəzifələrin təsnifat toplusu nəyi özündə əks etdirir və kim tərəfindən təsdiq edilir?","o":["Vəzifələrin adlarını, təsnifatlarını və ixtisas dərəcələrini; müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum) tərəfindən","Vəzifələrin məvacibini; Milli Məclis tərəfindən","Ştat vahidlərinin sayını; dövlət orqanının rəhbəri tərəfindən","Vəzifə təlimatlarını; Nazirlər Kabineti tərəfindən"],"e":"Maddə 1.1.11 (rənglənib): ştat cədvəllərinin hazırlanması üçün əsasdır.","hl":1},{"d":19,"c":1,"id":"dq2-14","r":"Maddə 1.1.16","q":"Sənəddəki qeydə görə rotasiya zamanı dövlət qulluqçusu yuxarı vəzifəyə keçirilə bilərmi?","o":["Xeyr; rotasiya inzibati vəzifə tutanların 31-1-ci maddəyə uyğun bir vəzifədən başqa vəzifəyə keçirilməsidir, yuxarı vəzifəyə getmək yoxdur","Bəli, həmişə yuxarı vəzifəyə keçirilir","Bəli, yalnız yardımçı vəzifələrdə","Yalnız xidməti fəaliyyəti “əla” qiymətləndirildikdə"],"e":"Maddə 1.1.16 (qeyd: “yuxarı vəzifəyə getmək yoxdur”). Rotasiya yalnız inzibati vəzifə tutanlara aiddir.","hl":1},{"d":19,"c":1,"id":"dq2-15","r":"Maddə 1.1.19, 30-1.1","q":"Dövlət qulluqçusunun xidməti fəaliyyəti nə vaxt yoxlanılır (qiymətləndirilir)?","o":["Hər təqvim ilinin sonunda","Hər rübün sonunda","Hər 3 ildən bir","Hər yarımilin sonunda"],"e":"Maddə 1.1.19 və 30-1.1."},{"d":19,"c":1,"id":"dq2-16","r":"Maddə 1.1.21","q":"Qanuna görə sektor necə yaradılır?","o":["Şöbə daxilində və ya müstəqil şəkildə","Yalnız şöbə daxilində","Yalnız müstəqil şəkildə","Yalnız aparat daxilində"],"e":"Maddə 1.1.21 (rənglənib).","hl":1},{"d":19,"c":1,"id":"dq2-17","r":"Maddə 1.1.14","q":"Qanuna görə “dövlət orqanının aparatı” nədir?","o":["Struktur bölmələri (şöbə və sektor) birləşdirən və səlahiyyətlərin həyata keçirilməsini bilavasitə təşkil və təmin edən struktur qurumu","Dövlət orqanının rəhbərliyi","Dövlət orqanının yerli bölməsi","Dövlət orqanının tabeliyindəki hüquqi şəxs"],"e":"Maddə 1.1.14."},{"d":19,"c":1,"id":"dq2-18","r":"Maddə 1.1.15","q":"Dövlət orqanının struktur bölməsi kimin qərarı ilə yaradılır?","o":["Dövlət orqanının rəhbərinin","Müvafiq icra hakimiyyəti orqanının","Milli Məclisin","Bilavasitə rəhbərin"],"e":"Maddə 1.1.15: əsasnaməyə uyğun ona həvalə edilmiş səlahiyyətləri həyata keçirir."},{"d":19,"c":1,"id":"dq2-19","r":"Maddə 1.1.22","q":"Vəzifə təlimatını kim təsdiq edir?","o":["Dövlət orqanının rəhbəri","Bilavasitə rəhbər","Müvafiq icra hakimiyyəti orqanı","Dövlət qulluğu məsələləri üzrə komissiya"],"e":"Maddə 1.1.22: vəzifənin adı, qulluq funksiyaları və tutulma şərtləri əks olunur."},{"d":19,"c":1,"id":"dq2-20","r":"Maddə 1.1.23","q":"Mərkəzi icra hakimiyyəti orqanının səlahiyyətləri Konstitusiyanın hansı maddəsi ilə müəyyən edilir və o, nəyi həyata keçirir?","o":["113-cü maddə (Prezidentin aktları); fəaliyyət sahələrində dövlət siyasətini və tənzimləməni","94-cü maddə; qanunvericiliyi","7-ci maddə; ədalət mühakiməsini","124-cü maddə; prokuror nəzarətini"],"e":"Maddə 1.1.23 (“dövlət siyasətini”, “tənzimlənməsini” rənglənib; qeyd: Prezidentin aktları).","hl":1},{"d":19,"c":1,"id":"dq2-21","r":"Maddə 1.1.27","q":"Qanuna görə müsabiqə nədən ibarət prosesdir?","o":["Test imtahanından və müsahibədən","Yalnız test imtahanından","Yalnız müsahibədən","Sənədlərin yoxlanılmasından və attestasiyadan"],"e":"Maddə 1.1.27: inzibati vəzifələrin tutulması məqsədilə keçirilir."},{"d":19,"c":1,"id":"dq2-22","r":"Maddə 1.1.28–1.1.29","q":"Daxili və ümumi müsahibə hansı təsnifatlara uyğun vakant vəzifələr üçün keçirilir?","o":["Daxili: 1–5-ci kateqoriya orqanlarda birinci–yeddinci təsnifat; ümumi: dördüncü–yeddinci təsnifat","Daxili: dördüncü–yeddinci; ümumi: birinci–yeddinci","Hər ikisi: birinci–beşinci təsnifat","Daxili: ali–üçüncü; ümumi: dördüncü–yeddinci"],"e":"Maddə 1.1.28 və 1.1.29.","t":1},{"d":19,"c":1,"id":"dq2-23","r":"Maddə 1.1.29","q":"Ümumi müsahibədə dövlət qulluqçusu olmayan şəxs hansı şərtlə iştirak edə bilər?","o":["Azı 5 il qulluq stajı olmalı və dövlət orqanında inzibati vəzifələrdə çalışmış olmalıdır (və ya 29.3-ün birinci hissəsindəki digər şəxslər)","Azı 3 il iş stajı olmalıdır","Ali təhsil diplomu kifayətdir","Heç bir halda iştirak edə bilməz"],"e":"Maddə 1.1.29.","t":1},{"d":19,"c":2,"id":"dq2-24","r":"Maddə 2.1","q":"Qanun kimlərə şamil edilir?","o":["Dövlət orqanlarının struktur qurumlarında qulluq keçən dövlət qulluqçularına","Bütün dövlət işçilərinə, o cümlədən tabelikdəki hüquqi şəxslərin işçilərinə","Yalnız mərkəzi icra hakimiyyəti orqanlarının işçilərinə","Bələdiyyə qulluqçularına"],"e":"Maddə 2.1 (rənglənib).","hl":1},{"d":19,"c":2,"id":"dq2-25","r":"Maddə 2.2","q":"Sənəddəki qeydə görə 2.2-ci maddədəki “başqa hal nəzərdə tutulmamışdırsa” ifadəsi nəyə işarədir (yəni Qanunun hansı müddəası 2.2-dəki şəxslərə də aid ola bilər)?","o":["Fasiləsiz xidmət illərinə görə əlavələrə","İntizam məsuliyyətinə","Müsabiqə qaydasına","Xidməti fəaliyyətin qiymətləndirilməsinə"],"e":"Maddə 2.2 (qırmızı qeyd: “fasiləsiz xidmət illərinə görə əlavələr”).","hl":1},{"d":19,"c":2,"id":"dq2-26","r":"Maddə 2.2","q":"Aşağıdakılardan hansına Qanun şamil OLUNUR (2.2-ci maddədəki istisnalar siyahısında yoxdur)?","o":["Mərkəzi icra hakimiyyəti orqanının şöbə müdirinə","Mərkəzi icra hakimiyyəti orqanının rəhbərinin müavininə","Hesablama Palatasının auditoruna","Media və Yayım Şurasının üzvünə"],"e":"Maddə 2.2: siyahıda rəhbərlər və onların müavinləri, Hesablama Palatasının auditorları, Media və Yayım Şurasının üzvləri var; şöbə müdiri yoxdur."},{"d":19,"c":2,"id":"dq2-27","r":"Maddə 2.2","q":"Aşağıdakılardan hansına Qanun şamil OLUNMUR?","o":["Hərbi qulluqçulara və hakimlərə","Şöbə müdirlərinə","Aparatın baş məsləhətçilərinə","Sektor müdirlərinə"],"e":"Maddə 2.2-nin sonunda: hakimlər və hərbi qulluqçular istisna edilib."},{"d":19,"c":2,"id":"dq2-28","r":"Maddə 2.4","q":"Dövlət orqanlarının tabeliyində olan hüquqi şəxslərin (məs., MMC və publik hüquqi şəxslərin) işçilərinin əmək münasibətləri hansı aktla tənzimlənir?","o":["Əmək Məcəlləsi ilə — bu Qanun onlara şamil edilmir","“Dövlət qulluğu haqqında” Qanunla","Mülki Məcəllə ilə","Vergi Məcəlləsi ilə"],"e":"Maddə 2.4 (rənglənib, xətt çəkilib) və 2.2-dəki qeyd.","hl":1},{"d":19,"c":2,"id":"dq2-29","r":"Maddə 2.3","q":"Dövlət qulluğunun xüsusi növündə çalışanların qulluğu necə tənzimlənir?","o":["Bu Qanunun qəbul hüququ, müsabiqə və müsahibə, qiymətləndirmə, digər prinsiplər və 15-1-ci maddə (şəxsi iş) müddəaları nəzərə alınmaqla başqa qanunlarla","Tamamilə bu Qanunla","Yalnız Əmək Məcəlləsi ilə","Bu Qanun onlara heç bir halda tətbiq edilmir"],"e":"Maddə 2.3 (rənglənib).","hl":1},{"d":19,"c":2,"id":"dq2-30","r":"Maddə 2.3","q":"Xüsusi növ qulluq nəzərdə tutulan orqanda çalışan, lakin xüsusi, hərbi və ya diplomatik rütbəsi olmayan dövlət qulluqçusuna bu Qanun şamil edilirmi?","o":["Bəli (dövlət qulluqçusu olmayan digər işçilər istisna olmaqla)","Xeyr","Yalnız 6 aydan çox işlədikdə","Yalnız rəhbər vəzifədə olduqda"],"e":"Maddə 2.3, ikinci cümlə."},{"d":19,"c":2,"id":"dq2-31","r":"Maddə 3.0","q":"Dövlət qulluğunun neçə əsas vəzifəsi var və birincisi nədir?","o":["3; vətəndaşların hüquq və azadlıqlarının təmin edilməsi","3; vətəndaşların vəzifələrinin təmin edilməsi","4; qərarların hazırlanması","12; qanunçuluq"],"e":"Maddə 3.0.1–3.0.3. Qeyd: “vəzifələri deyil” — hüquq və azadlıqlar.","hl":1,"t":1},{"d":19,"c":2,"id":"dq2-32","r":"Maddə 3.0.2","q":"Aşağıdakılardan hansı dövlət qulluğunun əsas vəzifələrindəndir?","o":["Qərarların hazırlanması, qəbul edilməsi, icrası və icrasına nəzarət","Siyasi partiyaların fəaliyyətinin təşkili","Dövlət büdcəsinin təsdiqi","Sahibkarlıq fəaliyyəti"],"e":"Maddə 3.0.2 (“icrasına nəzarət” rənglənib).","hl":1},{"d":19,"c":2,"id":"dq2-33","r":"Maddə 4.1","q":"Qanunun 4.1-ci maddəsində dövlət qulluğunun neçə prinsipi sadalanır?","o":["12","10","7","9"],"e":"Maddə 4.1.1–4.1.12.","t":1},{"d":19,"c":2,"id":"dq2-34","r":"Maddə 4.1.3","q":"4.1.3-cü maddəyə görə dövlət orqanları və dövlət qulluqçuları ilə bağlı hansı prinsip var?","o":["Onlara nəzarət və onların hesabat verməsi","Onların müstəqilliyi və toxunulmazlığı","Onların siyasi neytrallığı","Onların həmkarlar ittifaqına üzvlüyü"],"e":"Maddə 4.1.3 (“nəzarət”, “hesabat” rənglənib).","hl":1},{"d":19,"c":2,"id":"dq2-35","r":"Maddə 4.1.4","q":"Yuxarı kateqoriya orqanların öz səlahiyyətləri hüdudlarında qəbul etdikləri qərarlar aşağı kateqoriya orqanlar üçün necədir?","o":["Yerinə yetirilməsi məcburidir","Tövsiyə xarakteri daşıyır","Yalnız razılaşdırıldıqda icra olunur","Məhkəmə təsdiq etdikdən sonra icra olunur"],"e":"Maddə 4.1.4 (“məcburiliyi” rənglənib).","hl":1},{"d":19,"c":2,"id":"dq2-36","r":"Maddə 4.1.5","q":"Vətəndaşlar və vəzifəli şəxslər dövlət qulluqçularının hansı tələblərini icra etməyə borcludur?","o":["Qanuni tələblərini; həmçinin qanuni hərəkətlərini müdafiə etməyə","Bütün tələblərini","Yalnız yazılı tələblərini","Yalnız rəhbərin tələblərini"],"e":"Maddə 4.1.5 (“qanuni tələblərini”, “qanuni hərəkətlərini” rənglənib).","hl":1},{"d":19,"c":2,"id":"dq2-37","r":"Maddə 4.1.7","q":"Vətəndaşlar dövlət qulluğuna hansı əsasla qəbul edilir?","o":["Müsabiqə və müsahibə əsasında","Yalnız tövsiyə məktubu əsasında","Yalnız diplom əsasında","Rəhbərin şəxsi seçimi əsasında"],"e":"Maddə 4.1.7; 4.1.6 — qəbulun şəffaflığı."},{"d":19,"c":2,"id":"dq2-38","r":"Maddə 4.1.10","q":"Dövlət qulluğu prinsiplərinə görə rotasiyanın məqsədi nədir?","o":["Qulluqçuların potensialının səmərəli istifadəsi, xidməti və peşəkarlıq səviyyəsinin artırılması","İntizam tənbehi","Ştatların ixtisarı","Məvacibin azaldılması"],"e":"Maddə 4.1.10."},{"d":19,"c":2,"id":"dq2-39","r":"Maddə 4.1.12","q":"Dövlət orqanlarının və ya vəzifəli şəxslərin qanunsuz hərəkətləri (hərəkətsizliyi) nəticəsində vurulmuş zərərə görə prinsip üzrə kim məsuliyyət daşıyır?","o":["Dövlət orqanları","Yalnız vəzifəli şəxsin özü","Bilavasitə rəhbər","Heç kim"],"e":"Maddə 4.1.12."},{"d":19,"c":2,"id":"dq2-40","r":"Maddə 4.2–4.3","q":"Dövlət orqanlarında hansı strukturlar yaradılmır?","o":["Siyasi partiyaların və ictimai birliklərin strukturları","Həmkarlar ittifaqı komitələri","Sektorlar","Şöbələr"],"e":"Maddə 4.2 (rənglənib). 4.3: siyasi partiyaların və ictimai birliklərin qərarlarının dövlət qulluqçularına dəxli yoxdur.","hl":1},{"d":19,"c":2,"id":"dq2-41","r":"Maddə 4.1.9","q":"4.1.9-cu maddədə dövlət qulluqçularının hüquq bərabərliyinə təsir etməyən əsaslar sırasında aşağıdakılardan hansı göstərilməyib?","o":["Peşə hazırlığı və xidməti nailiyyətlər","Dini və dili","Həmkarlar ittifaqlarına mənsubiyyəti","Yaşayış yeri və əqidəsi"],"e":"Peşə hazırlığı və xidməti nailiyyətlər 4.1.8-də vəzifə tutmaq üçün meyar kimi göstərilib, ayrı-seçkilik əsası deyil."},{"d":19,"c":3,"id":"dq2-42","r":"Maddə 8.1","q":"Maddə 8-ə görə dövlət orqanları neçə kateqoriyaya bölünür?","o":["6: Ali və 1–5-ci kateqoriyalar","5: 1–5-ci kateqoriyalar","7: Ali və 1–6-cı kateqoriyalar","4: Ali və 1–3-cü kateqoriyalar"],"e":"Maddə 8.1.1–8.1.6.","t":1},{"d":19,"c":3,"id":"dq2-43","r":"Maddə 8.1.1","q":"Konstitusiya Məhkəməsi hansı kateqoriya dövlət orqanıdır?","o":["Ali kateqoriya","1-ci kateqoriya","2-ci kateqoriya","3-cü kateqoriya"],"e":"Maddə 8.1.1 (“Konstitusiya Məhkəməsi” rənglənib, xətt çəkilib).","hl":1},{"d":19,"c":3,"id":"dq2-44","r":"Maddə 8.1.1","q":"Prezidentin Administrasiyası hansı kateqoriya dövlət orqanıdır?","o":["Ali kateqoriya","1-ci kateqoriya","2-ci kateqoriya","Kateqoriyaya aid edilmir"],"e":"Maddə 8.1.1."},{"d":19,"c":3,"id":"dq2-45","r":"Maddə 8.1.2","q":"Baş Prokurorluq, Hesablama Palatası və Ombudsman Aparatı hansı kateqoriyaya aiddir?","o":["1-ci kateqoriya","Ali kateqoriya","2-ci kateqoriya","3-cü kateqoriya"],"e":"Maddə 8.1.2."},{"d":19,"c":3,"id":"dq2-46","r":"Maddə 8.1.3","q":"Korrupsiyaya qarşı mübarizə üzrə Komissiyanın Katibliyi və apellyasiya məhkəmələri hansı kateqoriyaya aiddir?","o":["2-ci kateqoriya","1-ci kateqoriya","3-cü kateqoriya","4-cü kateqoriya"],"e":"Maddə 8.1.3. Mərkəzi Seçki Komissiyasının Katibliyi də 2-ci kateqoriyadır."},{"d":19,"c":3,"id":"dq2-47","r":"Maddə 8.1.4","q":"Ağır cinayətlər, inzibati, kommersiya və hərbi məhkəmələr, Bakı şəhər prokurorluğu hansı kateqoriyaya aiddir?","o":["3-cü kateqoriya","2-ci kateqoriya","4-cü kateqoriya","5-ci kateqoriya"],"e":"Maddə 8.1.4."},{"d":19,"c":3,"id":"dq2-48","r":"Maddə 8.1.5","q":"Rayon (şəhər) məhkəmələri və rayon (şəhər) prokurorluqları hansı kateqoriyaya aiddir?","o":["4-cü kateqoriya","3-cü kateqoriya","5-ci kateqoriya","2-ci kateqoriya"],"e":"Maddə 8.1.5."},{"d":19,"c":3,"id":"dq2-49","r":"Maddə 8.1.3, 8.1.4","q":"Müvafiq icra hakimiyyəti orqanlarının yanında yaradılan dövlət agentlikləri hansı halda 2-ci kateqoriyaya aid edilir?","o":["Rəhbəri və rəhbərinin müavinləri müvafiq icra hakimiyyəti orqanı tərəfindən təyin və azad edildikdə; digər hallarda 3-cü kateqoriyaya aiddir","Həmişə 2-ci kateqoriyaya aiddir","Bakıda yerləşdikdə","Büdcədənkənar maliyyələşdikdə"],"e":"Maddə 8.1.3 və 8.1.4."},{"d":19,"c":3,"id":"dq2-50","r":"Maddə 8.1.6","q":"Agentliklərin və dövlət xidmətlərinin yerli bölmələri, inzibati ərazi dairələri üzrə nümayəndəliklər hansı kateqoriyaya aiddir?","o":["5-ci kateqoriya","4-cü kateqoriya","3-cü kateqoriya","Ali kateqoriya"],"e":"Maddə 8.1.6."},{"d":19,"c":3,"id":"dq2-51","r":"Maddə 8.2","q":"Dövlət orqanlarının bölmələri funksiyalarına görə necə bölünür?","o":["Aparıcı və köməkçi","İnzibati və yardımçı","Mərkəzi və yerli","Rəhbər və icraçı"],"e":"Maddə 8.2. Diqqət: “inzibati və yardımçı” vəzifələrə aiddir (1.1.8), bölmələrə yox."},{"d":19,"c":4,"id":"dq2-52","r":"Maddə 15-1.1","q":"Dövlət qulluqçusu üçün neçə şəxsi iş tərtib edilir?","o":["Qulluq keçdiyi dövr ərzində yalnız bir","Hər dövlət orqanında ayrıca","Hər vəzifə dəyişikliyində yenisi","Hər 5 ildən bir yenisi"],"e":"Maddə 15-1.1 (rənglənib).","hl":1},{"d":19,"c":4,"id":"dq2-53","r":"Maddə 15-1.3–15-1.4","q":"Şəxsi işin aparılması qaydalarını kim müəyyən edir və tələbləri pozan şəxs hansı məsuliyyət daşıyır?","o":["Müvafiq icra hakimiyyəti orqanı; İnzibati Xətalar Məcəlləsinə əsasən","Dövlət orqanının rəhbəri; intizam məsuliyyəti","Milli Məclis; cinayət məsuliyyəti","Dövlət İmtahan Mərkəzi; mülki məsuliyyət"],"e":"Maddə 15-1.3 və 15-1.4 (“İnzibati Xətalar Məcəlləsində” rənglənib).","hl":1},{"d":19,"c":4,"id":"dq2-54","r":"Maddə 30-1.2","q":"Aşağıdakılardan hansının xidməti fəaliyyəti qiymətləndirilir?","o":["1-ci kateqoriya orqanda dördüncü təsnifat vəzifəsində 1 ildir işləyən qulluqçunun","Ali kateqoriya orqanda ali–üçüncü təsnifat vəzifəsini tutan qulluqçunun","Sınaq müddəti ilə qəbul də 30-1.7 (mavi), “PİKK” qeydi: P–İ–K–K.","hl":1,"t":1},{"d":19,"c":4,"id":"dq2-60","r":"Maddə 30-1.6, 30-1.7","q":"Aşağıdakılardan hansı YALNIZ rəhbər vəzifə tutanlar üçün qiymətləndirmə meyarıdır?","o":["Komanda qurmaq bacarığı","Kollektivdə işləmək və ünsiyyət bacarığı","İş təcrübəsi və onu bölüşmə","Təhlil aparmaq və qərar vermək bacarığı"],"e":"Maddə 30-1.7.4. Digərləri hamı üçün olan 30-1.6 meyarlarıdır. Sənəddəki qeyd: 30-1.6 — “kollektiv”, 30-1.7 — “rəhbər meyarları”.","hl":1},{"d":19,"c":4,"id":"dq2-61","r":"Maddə 30-1.8","q":"Xidməti fəaliyyət hansı qiymətlərlə qiymətləndirilir?","o":["Əla, yaxşı, kafi, qeyri-kafi","1-dən 10-a qədər bal","A, B, C, D","Uyğundur / uyğun deyil"],"e":"Maddə 30-1.8.1–30-1.8.4."},{"d":19,"c":4,"id":"dq2-62","r":"Maddə 30-1.9","q":"Yekun qiymət hansı nisbətdə formalaşır?","o":["50% tapşırıqlar (hədəflər), 40% meyarlar, 10% əmək intizamı","40% tapşırıqlar, 50% meyarlar, 10% əmək intizamı","50% meyarlar, 30% tapşırıqlar, 20% intizam","60% tapşırıqlar, 30% meyarlar, 10% intizam"],"e":"Maddə 30-1.9 (“10 faizi” qırmızı, “əmək intizamı” rənglənib).","hl":1,"t":1},{"d":19,"c":4,"id":"dq2-63","r":"Maddə 30-1.10","q":"Dövlət qulluqçusu qiymətləndirmə nəticəsi ilə razılaşmadıqda sənədə nə əlavə edilir və nəticələr harada saxlanılır?","o":["Onun rəyi; nəticələr şəxsi işində","Rəhbərin izahatı; nəticələr kadr şöbəsində","Komissiya qərarı; nəticələr arxivdə","Heç nə; nəticələr dövlət orqanının saytında"],"e":"Maddə 30-1.10 (“rəy”, “şəxsi işində” rənglənib).","hl":1},{"d":19,"c":4,"id":"dq2-64","r":"Maddə 30-1.11","q":"Yekun qiymət müəyyən edildikdən sonra keçirilən müsahibədə nə edilə bilər?","o":["Qiymət və şərhlər müzakirə olunur; növbəti qiymətləndirilmə ili üçün tapşırıqlar və onların mühümlük dərəcəsi müəyyən edilə bilər","Qiymət mütləq dəyişdirilir","İntizam tənbehi tətbiq olunur","Qulluqçu işdən azad edilir"],"e":"Maddə 30-1.11 (“növbəti qiymətləndirilmə ili”, “müəyyən edilə bilər” rənglənib).","hl":1},{"d":19,"c":4,"id":"dq2-65","r":"Maddə 30-1.12","q":"Qiymətləndirmə nəticəsində dövlət orqanının rəhbəri hansı tədbirlərdən birini görə bilər?","o":["5 tədbirdən biri: mükafatlandırma, vaxtından əvvəl ixtisas dərəcəsi, əlavə təhsil və ya təlim, digər analoji vəzifəyə keçirmə, aşağı inzibati vəzifəyə keçirmə","İntizam tənbehi və ya işdən azad etmə","Yalnız mükafatlandırma","Məvacibin azaldılması"],"e":"Maddə 30-1.12.1–30-1.12.5 (rənglənib).","hl":1,"t":1},{"d":19,"c":4,"id":"dq2-66","r":"Maddə 30-1.12","q":"Aşağıdakılardan hansı 30-1.12-ci maddədə qiymətləndirmə nəticəsində görülən tədbirlər sırasında YOXDUR?","o":["Dövlət qulluğundan azad etmə","Aşağı inzibati vəzifəyə keçirmə","Vaxtından əvvəl ixtisas dərəcəsinin verilməsi","Digər analoji vəzifəyə keçirmə"],"e":"Maddə 30-1.12-də işdən azad etmə yoxdur."},{"d":19,"c":4,"id":"dq2-67","r":"Maddə 30-1.13–30-1.14","q":"Qiymətləndirmə qaydasını kim müəyyən edir və qulluqçu nəticə ilə razı olmadıqda nə edə bilər?","o":["Müvafiq icra hakimiyyəti orqanının müəyyən etdiyi orqan (qurum); inzibati və məhkəmə qaydasında şikayət edə bilər","Dövlət orqanının rəhbəri; yalnız məhkəməyə müraciət edə bilər","Milli Məclis; şikayət hüququ yoxdur","Bilavasitə rəhbər; yalnız Ombudsmana müraciət edə bilər"],"e":"Maddə 30-1.13 və 30-1.14."},{"d":19,"c":5,"id":"dq2-rq0","r":"Maddə 8.1.5","q":"  “Dövlət qulluğu haqqında” Azərbaycan Respublikasının Qanununa əsasən aşağıdakılardan hansı dördüncü kateqoriya dövlət orqanlarına aid deyil?","o":["Bakı şəhər prokurorluğu","Rayon (şəhər) məhkəmələri","Rayon (şəhər) prokurorluqları","Müvafiq icra hakimiyyəti orqanlarının yerli bölmələri"],"e":"Maddə 8.1.5 (4-cü kateqoriya): rayon (şəhər) məhkəmələri, prokurorluqları və hərbi prokurorluqları, yerli icra hakimiyyəti orqanları, yerli bölmələr, tabelikdəki orqanlar. Bakı şəhər prokurorluğu 3-cü kateqoriyadır (8.1.4).","ex":1},{"d":19,"c":5,"id":"dq2-rq1","r":"Maddə 1.1","q":"  “Dövlət qulluğu haqqında” Azərbaycan Respublikasının Qanununa əsasən aşağıdakı anlayışlardan hansı səhv göstə ":"em2-7","r":"Maddə 42.1","q":"Əmək müqaviləsi necə bağlanır?","o":["Sərbəst; heç kəs əmək müqaviləsi bağlamağa məcbur edilə bilməz","Məcburi təyinatla","Yalnız dövlət sifarişi ilə","İşəgötürənin qərarı ilə"],"e":"Maddə 42.1 (rənglənib).","hl":1},{"d":22,"c":1,"id":"em2-8","r":"Maddə 42.3–42.4, 46.4","q":"Neçə yaşından şəxs işçi kimi əmək müqaviləsinin tərəfi ola bilər və 15–18 yaş arası şəxslərlə müqavilə bağlanarkən nə tələb olunur?","o":["15 yaşından; valideynlərdən birinin (övladlığa götürənin, himayəçinin) yazılı razılığı","16 yaşından; notarial razılıq","14 yaşından; məktəbin razılığı","18 yaşından; heç nə"],"e":"Maddə 42.3 (“on beş yaşına çatmış” rənglənib) və 46.4. 15 yaşa çatmayanla bağlanan müqavilə etibarsızdır, işəgötürən 312-ci maddə ilə inzibati məsuliyyət daşıyır.","hl":1,"t":1},{"d":22,"c":1,"id":"em2-9","r":"Maddə 42.4","q":"Tam fəaliyyət qabiliyyəti olmayan şəxs işəgötürən ola bilərmi?","o":["Xeyr","Bəli","Yalnız qəyyumun razılığı ilə","Yalnız 16 yaşından"],"e":"Maddə 42.4 (xətt çəkilib).","hl":1},{"d":22,"c":1,"id":"em2-10","r":"Maddə 43.4, 46.6","q":"Əmək müqaviləsinin şərtləri necə dəyişdirilə bilər?","o":["Yalnız tərəflərin razılığı ilə; Məcəllədə başqa hal yoxdursa birtərəfli dəyişdirilə bilməz","İşəgötürənin əmri ilə","İşçinin ərizəsi ilə","Həmkarlar ittifaqının qərarı ilə"],"e":"Maddə 43.4 və 46.6."},{"d":22,"c":1,"id":"em2-11","r":"Maddə 44.1, 44.3","q":"Əmək müqaviləsi hansı formada bağlanılır?","o":["7.2-1-dəki hallarda kağız daşıyıcıda (azı 2 nüsxə), digər hallarda elektron sənəd formasında","Həmişə kağız üzərində 3 nüsxədə","Həmişə şifahi","Yalnız notarial qaydada"],"e":"Maddə 44.1 (rənglənib) və 44.3.","hl":1},{"d":22,"c":1,"id":"em2-12","r":"Maddə 45.1–45.2","q":"Əmək müqaviləsində müddət göstərilməyibsə, o, necə hesab edilir?","o":["Müddətsiz","1 illik","5 illik","Etibarsız"],"e":"Maddə 45.2 (mavi).","hl":1},{"d":22,"c":1,"id":"em2-13","r":"Maddə 45.5","q":"Müddətli əmək müqaviləsi fasiləsiz olaraq neçə ildən artıq davam edərsə, müd ":"Maddə 77.4","q":"İşçinin razılığı ilə 9 təqvim həftəlik xəbərdarlıq müddəti əvəzinə nə ödənilə bilər?","o":["Orta aylıq əmək haqqının 2 misli","1,4 misli","0,9 misli","3 misli"],"e":"Maddə 77.4: 2 həftə → 0,5; 4 həftə → 0,9; 6 həftə → 1,4; 9 həftə → 2 misli.","t":1},{"d":22,"c":2,"id":"em2-26","r":"Maddə 77.2","q":"Xəbərdarlıq müddətində işçiyə iş axtarmaq üçün nə imkan yaradılır?","o":["Hər iş həftəsində əmək haqqı saxlanılmaqla azı 1 iş günü işdən azad edilir","Hər gün 2 saat","Ayda 1 gün ödənişsiz","Heç nə"],"e":"Maddə 77.2."},{"d":22,"c":2,"id":"em2-27","r":"Maddə 77.7","q":"İşçinin vəfatı ilə əlaqədar əmək müqaviləsinə xitam verildikdə vərəsələrə hansı müavinət ödənilir?","o":["Orta aylıq əmək haqqının azı 3 misli","2 misli","1 misli","5 misli"],"e":"Maddə 77.7."},{"d":22,"c":2,"id":"em2-28","r":"Maddə 77.9","q":"Müddətli həqiqi hərbi xidmətdən buraxılan şəxs əvvəlki işinə qayıtmaq hüququnu hansı müddətdə saxlayır?","o":["Buraxıldıqdan ən geci 60 təqvim günü keçənədək","30 gün","3 ay","1 il"],"e":"Maddə 77.9 (yaşıl): müəssisənin ləğvi və ya fiziki şəxs işəgötürənin vergi uçotundan çıxması halları istisnadır.","hl":1,"t":1},{"d":22,"c":2,"id":"em2-29","r":"Maddə 78","q":"İxtisar zamanı işdə saxlanmağa ilk növbədə kim üstünlük qazanır?","o":["Peşəkarlıq səviyyəsi daha yüksək olan işçi; səviyyə eyni olduqda — şəhid ailəsi üzvləri, müharibə iştirakçıları və s.","Stajı ən çox olan işçi","Ən gənc işçi","Həmkarlar ittifaqı üzvü"],"e":"Maddə 78.1–78.2 (xətt çəkilib).","hl":1},{"d":22,"c":2,"id":"em2-30","r":"Maddə 78.2","q":"Peşəkarlıq səviyyəsi eyni olduqda üstünlük hüququ olanlar sırasında hansı YOXDUR?","o":["Bir uşağı olan işçi","Öhdəsində iki və daha çox 16 yaşınadək uşağı olan","Əsgər və zabitlərin arvadı (əri)","Məcburi köçkün və qaçqın statuslu şəxs"],"e":"Maddə 78.2: iki və daha çox 16 yaşınadək uşaq."},{"d":22,"c":2,"id":"em2-31","r":"Maddə 79.1","q":"Aşağıdakı işçilərdən hansı ilə işəgötürənin təşəbbüsü ilə müqaviləyə xitam verilməsi qadağan DEYİL?","o":[  yivsiz odlu ov silahı və həmin silah üçün döyüş sursatının Azərbaycan Respublikasının Cinayət Məcəlləsinə əsasən gömrük sərhədindən qaçaqmalçılıq yolu ilə keçirilməsi Azərbaycan Respublikasının Cinayət Məcəlləsinin hansı maddələri ilə cinayət məsuliyyəti yaradır?","o":["cinayət məsuliyyəti yaratmır, inzibati məsuliyyət yaradır","qaçaqmalçılıq","gömrük nəzarətindən yayınma","saxtakarlıq"],"e":"Variantlar sizin faylınızdakı kimidir. 206.2-də yivsiz odlu ov silahı və onun sursatı istisna edilib; 4100 manat isə 206.1-dəki xeyli miqdardan (50 000 manatdan yuxarı) azdır. Ona görə əməl İXM ilə inzibati xətadır.","ex":1},{"d":23,"c":4,"id":"cm-rq1","r":"Maddə 206.3","q":"Aşağıdakılardan hansı Cinayət Məcəlləsinin 206-cı maddəsində (Qaçaqmalçılıq) cinayət əməlini ağırlaşdıran halların sırasında göstərilməmişdir ?","o":["Yetkinlik yaşına çatmayan şəxs tərəfindən törədildikdə","Təkrar törədildikdə","Qabaqcadan əlbir olan bir qrup şəxs tərəfindən törədildikdə","Gömrük nəzarətini həyata keçirən şəxsə zor tətbiq etməklə törədildikdə"],"e":"206.3-də 4 ağırlaşdırıcı hal var: təkrar; qabaqcadan əlbir qrup; vəzifəli şəxsin qulluq mövqeyindən istifadəsi; gömrük nəzarətini həyata keçirən şəxsə zor tətbiqi. Faylınızdakı “sərxoş halda” variantı da bu siyahıda yoxdur.","ex":1},{"d":23,"c":4,"id":"cm-rq2","r":"Maddə 206.3","q":"Aşağıdakılardan hansı Cinayət Məcəlləsinin 206-cı maddəsində (Qaçaqmalçılıq) cinayət əməlini ağırlaşdıran halların sırasında göstərilmişdir ?","o":["Vəzifəli şəxs tərəfindən öz qulluq mövqeyindən istifadə etməklə törədildikdə","Sərxoş halda törədildikdə","Yetkinlik yaşına çatmayan şəxs tərəfindən törədildikdə","Gecə vaxtı törədildikdə"],"e":"Maddə 206.3.3. Faylınızdakı ikinci düzgün variant — gömrük nəzarətini həyata keçirən şəxsə zor tətbiqi (206.3.4) da ağırlaşdırıcı haldır.","ex":1},{"d":23,"c":4,"id":"cm-rq3","r":"Maddə 206","q":"Azərbaycan Respublikasının Cinayət Məcəlləsinə əsasən Qaçaqmalçılıq cinayəti hansı halda ehtiyyatsızlıqla törədilmiş sayılır ?","o":["Qaçaqmalçılıq ehtiyatsızlıqla törədilə bilməz — yalnız qəsdən törədilən cinayətdir","Malları bəyan etməyi unutduqda","Sənədlərdə səhvən yanlış məlumat göstərildikdə","Malların dəyərini bilmədən düzgün bəyan etmədikdə"],"e":"Diqqət: bu cavab fayldakı maddələrdə birbaşa yazılmayıb, Cinayət Məcəlləsinin ümumi hissəsinə əsaslanır. 206-cı maddədəki üsullar (gizlətmə, aldatma yolu ilə istifadə və s.) qəsd tələb edir.","ex":1},{"d":23,"c":4,"id":"cm-rq4","r":"Maddə 208, qeyd","q":"Azərbaycan Respublikasının Cinayət Məcəlləsinə əsasən xarici valyuta vəsaitlərini xaricdən qaytarmama cinayətində külli miqdar deyiləndə hansı məbləğ başa düşülür?","o":["Otuz min manatdan artıq olan məbləğ","İyirmi min manatdan yuxarı, lakin otuz min manatdan artıq olmayan məbləğ","Əlli min manatdan artıq olan məbləğ","İki yüz min manatdan artıq olan məbləğ"],"e":"Maddə 208-in qeydi: xeyli — 20 000–30 000; külli — 30 000 manatdan artıq.","ex":1,"t":1},{"d":23,"c":4,"id":"cm-rq5","r":"Maddə 206","q":"Aşağıdakılardan hansı Azərbaycan Respublikasının Cinayət Məcəlləsinin 206-cı (qaçaqmalçılıq) maddəsinin tövsifedici əlaməti deyil?","o":["Sərxoş halda törədilmə","Təkrar törədilmə","Mütəşəkkil dəstə tərəfindən törədilmə","Külli miqdarda törədilmə"],"e":"206-nın tövsifedici əlamətləri: külli və xüsusilə külli miqdar (206.1-1, 206.1-2), 206.3-dəki 4 hal və mütəşəkkil dəstə (206.4).","ex":1},{"d":23,"c":4,"id":"cm-rq6","r":"Maddə 209","q":"Aşağıdakılardan hansı Azərbaycan Respublikasının Cinayət Məcəlləsinin 209-cu (gömrük ödənişlərinin ödənilməsindən yayınma) maddəsinin tövsifedici əlaməti deyil?","o":["Qabaqcadan əlbir olan bir qrup şəxs tərəfindən törədilmə","Təkrar törədilmə","Külli miqdarda törədilmə","Xüsusilə külli miqdarda törədilmə"],"e":"Maddə 209.2: təkrar və ya külli miqdar; 209.3: xüsusilə külli miqdar. Qrup halında törətmə 209-da yoxdur.","ex":1},{"d":24,"c":0,"id":"ixm-0","r":"Rekvizitlər","q":"İnzibati Xətalar Məcəlləsi hansı qanunla təsdiq edilib və nə vaxt qüvvəyə minib?","o":["29 dekabr 2015-ci il, № 96-VQ; 1 mart 2016-cı ildən","29 dekabr 2015, № 795; 1 yanvar 2016","15 fevral 2016, № 96-VQ; 1 mart 2016","1 mart 2016, № 96-VQ; dərc edildiyi gündən"],"e":"Rekvizitlər (rənglənib). Tətbiqi haqqında Fərman: 15 fevral 2016, № 795.","hl":1,"t":1},{"d":24,"c":0,"id":"ixm-1","r":"Fəsil 37","q":"Gömrük qaydaları əleyhinə olan inzibati xətalar İXM-in hansı fəslindədir?","o":["37-ci fəsil (maddə 479–509)","36-cı fəsil","38-ci fəsil","25-ci fəsil"],"e":"VI bölmə, 37-ci fəsil (rənglənib).","hl":1},{"d":24,"c":0,"id":"ixm-2","r":"Maddə 479","q":"479-cu maddəyə görə “gömrük nəzarətindən kənar keçirmə” nədir?","o":["DGK-nın müəyyən etdiyi yerlərdən kənar yerdən və ya gömrük rəsmiləşdirilməsinin müəyyən edilmiş vaxtından kənar vaxtda keçirmə","Gizli saxlanc yerlərindən istifadə etməklə keçirmə","Saxta sənədlərlə keçirmə","Bəyan etmədən keçirmə"],"e":"Maddə 479 (rənglənib).","hl":1},{"d":24,"c":0,"id":"ixm-3","r":"Maddə 479 Qeyd","q":"479–481, 482.1, 482.2 və 482-1-ci maddələrdə “az miqdarda” nə deməkdir?","o":["50 000 manatadək","20 000 manatadək","500 manatadək","200 000 manatadək"],"e":"Maddə 479-un qeydi (rənglənib). Cinayət Məcəlləsində qaçaqmalçılıq üçün xeyli miqdar 50 000 manatdan yuxarıdır.","hl":1,"t":1},{"d":24,"c":0,"id":"ixm-4","r":"Maddə 479–482.1","q":"Az miqdarda malın gömrük nəzarətindən kənar, gizli, aldatma yolu ilə və ya bəyan edilmədən keçirilməsinə görə hansı tənbeh var?","o":["Mallar müsadirə edilir, yaxud dəyərinin 40–60 faizi məbləğində cərimə","Dəyərinin 30–60 faizi cərimə","Dəyərinin 70–150 faizi","Sabit 500 manat cərimə"],"e":"Maddə 479, 480, 481, 482.1 (“qırx” rənglənib).","hl":1,"t":1},{"d":24,"c":0,"id":"ixm-5","r":"Maddə 480","q":"480-ci maddəyə görə “gömrük nəzarətindən gizlədilməklə keçirmə” nəyi əhatə edir?","o":["Gizli saxlanc yerlərindən və ya aşkarlanmanı çətinləşdirən üsullardan istifadə, yaxud bir qəbildən olan malların digər şəklə salınması","DGK-nın müəyyən etdiyi yerdən kənar keçirmə","Saxta eyniləşdirmə vasitələrindən lardan hansı başa düşülmür?","o":["DGK-nın müəyyən etdiyi yerlərdən kənar yerdən keçirilmə","Gizli saxlanc yerlərindən istifadə edilməklə keçirilmə","Malların aşkar edilməsini çətinləşdirən digər üsullardan istifadə","Bir qəbildən olan malların digər şəklə salınmaqla keçirilməsi"],"e":"DGK-nın müəyyən etdiyi yerdən kənar keçirmə “gömrük nəzarətindən kənar” keçirmədir (479). Gizlətmə üsulları 480-ci maddədədir.","ex":1},{"d":24,"c":5,"id":"ixm-rq2","r":"Maddə 480","q":"Malların və nəqliyyat vasitələrinin Azərbaycan Respublikasının gömrük sərhədindən gömrük nəzarətindən gizlədilməklə keçirilməsi hansı halda inzibati məsuliyyətə səbəb olur?","o":["Gizlədilməklə keçirilən malların dəyəri 45 min manat olduqda","Gizlədilməklə keçirilən malların dəyəri 55 min manat olduqda","Gizlədilməklə keçirilən malların dəyəri 120 min manat olduqda","Gizlədilməklə keçirilən malların dəyəri 250 min manat olduqda"],"e":"İnzibati məsuliyyət az miqdarda, yəni 50 000 manatadək olduqda yaranır. Ondan yuxarı məbləğ CM 206.1-ə aiddir.","ex":1},{"d":24,"c":5,"id":"ixm-rq3","r":"Maddə 481","q":"Malların və nəqliyyat vasitələrinin sənədlərdən və ya eyniləşdirmə vasitələrindən aldatma yolu ilə istifadə etməklə gömrük sərhədindən keçirilməsi aşağıdakılardan hansını ehtiva etmir?","o":["Gizli saxlanc yerlərindən istifadə edilməsi","Doğru olmayan məlumatları əks etdirən sənədlərin təqdim edilməsi","Etibarsız sənədlərin və ya digər mallara aid sənədlərin təqdim edilməsi","Saxta eyniləşdirmə vasitələrindən istifadə edilməsi"],"e":"Gizli saxlanc 480-ci maddəyə aiddir.","ex":1},{"d":24,"c":5,"id":"ixm-rq4","r":"Maddə 480","q":"Malların və nəqliyyat vasitələrinin Azərbaycan Respublikasının gömrük sərhədindən gömrük nəzarətindən gizlədilməklə keçirilməsi hansı halda inzibati məsuliyyətə səbəb olur?","o":["Gizlədilməklə keçirilən malların dəyəri 47 min manat olduqda","gizlədilməklə keçirilən malların dəyəri 57 min manat olduqda","gizlədilməklə keçirilən malların dəyəri 77 min manat olduqda","Gizlədilməklə keçirilən malların dəyəri 120 min manat olduqda"],"e":"Faylınızdakı iki variant (57 və 77 min) 50 000 manatdan yuxarıdır, ona görə cinayət məsuliyyəti yaradır (CM 206.1). İnzibati məsuliyyət 50 000 manatadəkdir.","ex":1},{"d":25,"c":0,"id":"met-0","r":"Metodika, 1.2–1.8","q":"Azərbaycan Respublikası Dövlət Gömrük Komitəsinin 31 oktyabr 2014-cü il tarixli 100/143 nömrəli sərəncamı ilə təsdiq edilmiş \"Gömrük bəyannamələrinin doldurulması qaydasının Metodikası\"na əsasən gömrük bəyannaməsinin doldurulması ilə bağlı verilənlərdən yanlış olanı seçin:","o":["Əlavə vərəqlərin hər biri beş adda mal bəyan etməyə imkan verir.","Bir GB-də əlavə vərəqlərin sayı 33-dən artıq ola bilməz.","GB Azərbaycan dilində doldurulur. Keyfiyyətsiz şəkildə doldurulmuş GB-ləri gömrük orqanları tərəfindən qəbul edilmir.","GB-nin əsas vərəqi eyni mənşəli və adlı mallar (XİF MN üzrə mal mövqeyi 10-cu işarə səviyyəsinə qədər eyni təsnifat olunanlar) haqqında məlumatları göstərmək üçün istifadə olunur."],"e":"Metodikanın 1.5-ci bəndinə görə hər əlavə vərəq ÜÇ adda mal bəyan etməyə imkan verir. Digər variantlar düzdür: 33 vərəq həddi (1.6), Azərbaycan dili (1.7), 10-cu işarə səviyyəsi (1.4).","hl":1,"ex":1},{"d":25,"c":0,"id":"met-1","r":"Qrafa 31","q":"Azərbaycan Respublikası Dövlət Gömrük Komitəsinin 31 oktyabr 2014-cü il tarixli 100/143 nömrəli sərəncamı ilə təsdiq edilmiş \"Gömrük bəyannamələrinin doldurulması qaydasının Metodikası\"na əsasən gömrük bəyannaməsinin “malların təsviri” adlı 31-ci Qrafasında aşağıda verilənlərdən hansı göstərilmir?","o":["Malın gömrük dəyəri","Konteynerin nömrəsi","Malın əlavə kəmiyyət miqdarı","Yer sayı (malların yer, qablaşdırma, tara sayı)"],"e":"Qrafa 31-də 8 bölmə var: malın adı, miqdarı, ölçü vahidi, əlavə kəmiyyət miqdarı, onun ölçü vahidi, konteynerin nömrəsi, yer sayı, invoys üzrə təsvir. Gömrük dəyəri 45-ci qrafada göstərilir.","hl":1,"ex":1},{"d":25,"c":0,"id":"met-2","r":"Qrafa 31, 8-ci bölmə","q":"Azərbaycan Respublikası Dövlət Gömrük Komitəsinin 31 okt
