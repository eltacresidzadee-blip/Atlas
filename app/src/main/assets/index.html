llegiyanın üzvləri arasından seçilən şəxs","Prezidentin təyin etdiyi xüsusi şəxs"],"e":"Maddə 5.8 (“kollegiyanın sədri” rənglənib).","hl":1},{"d":1,"c":5,"id":"dgk-105","r":"Bənd 5.8","q":"Kollegiyanın tərkibinə kimlər daxil edilir?","o":["Sədr, müavinlər, digər rəhbər işçilər; həmçinin mütəxəssislər və alimlər də daxil edilə bilər","Yalnız sədr və müavinlər","Sədr, müavinlər və Milli Məclisin nümayəndəsi","Bütün ərazi gömrük idarələrinin rəisləri, məcburi qaydada"],"e":"Maddə 5.8 (qırmızı).","hl":1},{"d":1,"c":5,"id":"dgk-106","r":"Bənd 5.9","q":"Kollegiya üzvlərinin sayını və tərkibini kim təsdiq edir?","o":["Prezident","Komitənin sədri","Nazirlər Kabineti","Kollegiyanın özü"],"e":"Maddə 5.9 (yaşıl ilə rənglənib, qırmızı).","hl":1},{"d":1,"c":5,"id":"dgk-107","r":"Bənd 5.10","q":"Aşağıdakılardan hansı 5.10-cu bəndə görə kollegiya iclaslarında müzakirə olunan məsələlər arasında göstərilib?","o":["Kadr məsələləri və normativ hüquqi aktların layihələri","Sədrin vəzifədən azad edilməsi","Prezident fərmanlarının ləğvi","Məhkəmə qərarlarına yenidən baxılması"],"e":"Maddə 5.10: fəaliyyətin əsas istiqamətləri, icra intizamının vəziyyəti, kadr məsələləri, NHA layihələri və digər mühüm məsələlər."},{"d":1,"c":5,"id":"dgk-108","r":"Bənd 5.11.1","q":"Aşağıdakı normativ hüquqi aktlardan hansını kollegiya qəbul edir?","o":["Komitə ilə digər şəxslər (qurumlar) arasında münasibətləri tənzimləyən aktlar","Komitənin aparatının struktur bölmələrinin əsasnamələri (sədrin təşəbbüsü olmadan)","Əmr və sərəncamlar formasında qeyri-normativ aktlar","Ştat cədvəli və xərclər smetası"],"e":"Maddə 5.11.1 (imtahan sualı). Struktur bölmələrin əsasnamələrini sədr qəbul edir (5.6.3), kollegiyaya isə yalnız sədrin təşəbbüsü ilə çıxarılır (5.11.5).","hl":1,"ex":1},{"d":1,"c":5,"id":"dgk-109","r":"Bənd 5.11","q":"5.11-ci bənddə kollegiyanın qəbul etdiyi neçə növ normativ hüquqi akt sadalanır?","o":["6","5","4","8"],"e":"5.11.1–5.11.6.","hl":1,"t":1,"ex":1},{"d":1,"c":5,"id":"dgk-110","r":"Bənd 5.11.2–5.11.4","q":"Aşağıdakılardan hansı kollegiyanın qəbul etdiyi normativ aktlara AİD DEYİL?","o":["Komitənin daxili təhlükəsizliyinin təminatı ilə bağlı qərarlar","Prezident və ya Nazirlər Kabineti tərəfindən Komitəyə tapşırılmış konkret normativ aktlar","Bir neçə dövlət orqanının fəaliyyətini tənzimləyən vahid (birgə) aktlar","Müvafiq dövlət orqanları ilə razılaşdırılmalı olan normativ aktlar"],"e":"Daxili təhlükəsizliklə bağlı qərarları sədr qəbul edir (5.6.21). Qalan üçü 5.11.2–5.11.4-dədir.","hl":1},{"d":1,"c":5,"id":"dgk-111","r":"Bənd 5.11.5","q":"5.6.3-cü yarımbənddə nəzərdə tutulmuş aktlar kollegiyada hansı halda qəbul edilir?","o":["Sədrin təşəbbüsü ilə kollegiyanın müzakirəsinə çıxarıldıqda","Kollegiya üzvlərinin yarısının tələbi ilə","Prezidentin göstərişi ilə","Heç bir halda, onlar yalnız sədrin səlahiyyətidir"],"e":"Maddə 5.11.5.","hl":1},{"d":1,"c":5,"id":"dgk-112","r":"Bənd 5.12","q":"Kollegiyanın iclası hansı halda səlahiyyətlidir və qərarlar necə qəbul edilir?","o":["Üzvlərinin yarıdan çoxu iştirak etdikdə; sadə səs çoxluğu ilə","Üzvlərinin üçdə ikisi iştirak etdikdə; sadə səs çoxluğu ilə","Üzvlərinin yarıdan çoxu iştirak etdikdə; üçdə iki səs çoxluğu ilə","Bütün üzvlər iştirak etdikdə; yekdilliklə"],"e":"Maddə 5.12 (bənövşəyi ilə rənglənib).","hl":1},{"d":1,"c":5,"id":"dgk-113","r":"Bənd 5.12","q":"Kollegiya 9 üzvdən ibarətdirsə, iclasın səlahiyyətli olması üçün ən azı neçə üzv iştirak etməlidir?","o":["5","4","6","7"],"e":"Maddə 5.12: yarıdan çox. 9-un yarısı 4,5-dir, ondan çox olan ən kiçik tam ədəd 5-dir.","hl":1,"t":1},{"d":1,"c":5,"id":"dgk-114","r":"Bənd 5.12","q":"Kollegiyada qərar qəbul edilərkən səslər bərabər olarsa, nə baş verir?","o":["Kollegiya sədrinin səsi həlledici hesab edilir","Qərar qəbul edilməmiş sayılır","Məsələ Prezidentə göndərilir","Səsvermə növbəti iclasda təkrarlanır"],"e":"Maddə 5.12 (qırmızı).","hl":1},{"d":1,"c":5,"id":"dgk-115","r":"Bənd 5.13–5.14","q":"Kollegiyanın iclaslarını kim çağırır və iş qaydasını kim müəyyənləşdirir?","o":["Hər ikisini sədr: iclaslar mütəmadi çağırılır","İclasları sədr çağırır; iş qaydasını Prezident təsdiq edir","İclasları birinci müavin çağırır; iş qaydasını kollegiya müəyyənləşdirir","İclaslar ayda bir dəfə avtomatik keçirilir; iş qaydasını Nazirlər Kabineti müəyyən edir"],"e":"Maddə 5.13 və 5.14 (rənglənib).","hl":1},{"d":1,"c":5,"id":"dgk-116","r":"Bənd 5.15","q":"Kollegiya üzvləri ilə sədr arasında fikir ayrılığı yarandıqda nə baş verir?","o":["Sədr bu barədə Prezidentə məlumat verərək öz qərarını həyata keçirir; üzvlər şəxsi fikirlərini Prezidentə çatdıra bilərlər","Kollegiyanın qərarı qüvvədə qalır","Məsələ Nazirlər Kabinetinin həllinə verilir","Qərar Prezident həll edənədək dayandırılır"],"e":"Maddə 5.15 (qırmızı).","hl":1},{"d":1,"c":5,"id":"dgk-117","r":"Bənd 5.16","q":"Kollegiyanın iclaslarına kimlər dəvət edilə bilər?","o":["Zəruri hallarda digər icra hakimiyyəti orqanlarının, təşkilatların və qeyri-hökumət təşkilatlarının nümayəndələri","Yalnız Prezident Administrasiyasının nümayəndələri","Yalnız kütləvi informasiya vasitələri","Heç kim, iclaslar qapalıdır"],"e":"Maddə 5.16 (bənövşəyi).","hl":1},{"d":1,"c":6,"id":"dgk-118","r":"Struktur, 2.1","q":"Komitənin strukturunda neçə ərazi gömrük idarəsi var?","o":["10","9","8","12"],"e":"Bakı, Naxçıvan, Astara, Balakən, Biləsuvar, Gəncə, Xaçmaz, Sumqayıt, Şərqi Zəngəzur, Tovuz: 10.","t":1},{"d":1,"c":6,"id":"dgk-119","r":"Struktur, 2.1","q":"Hansı ərazi gömrük idarələri “Baş” statusundadır?","o":["Bakı və Naxçıvan","Bakı və Gəncə","Bakı, Naxçıvan və Sumqayıt","Yalnız Bakı"],"e":"Əlavə II, 2.1.1 və 2.1.2 (“Baş” qırmızı)."},{"d":1,"c":6,"id":"dgk-120","r":"Struktur, 2.1","q":"Aşağıdakılardan hansı strukturdakı ərazi gömrük idarələri arasında YOXDUR?","o":["Lənkəran Gömrük İdarəsi","Şərqi Zəngəzur Gömrük İdarəsi","Biləsuvar Gömrük İdarəsi","Tovuz Gömrük İdarəsi"],"e":"Siyahıda Astara var, Lənkəran yoxdur."},{"d":1,"c":6,"id":"dgk-121","r":"Struktur, 2.2","q":"Neçə ixtisaslaşdırılmış gömrük idarəsi var və onlardan hansı “Baş” deyil?","o":["4; Azad və Xüsusi İqtisadi Zonalar üzrə Gömrük İdarəsi","4; Aksizli mallar üzrə Gömrük İdarəsi","3; Hava nəqliyyatında Gömrük İdarəsi","5; Dəniz Nəqliyyatı Gömrük İdarəsi"],"e":"Əlavə II, 2.2: Hava nəqliyyatında Baş GI, Dəniz Nəqliyyatı və Enerji Resursları Baş GI, Aksizli mallar üzrə Baş GI, Azad və Xüsusi İqtisadi Zonalar üzrə GI.","t":1},{"d":1,"c":6,"id":"dgk-122","r":"Struktur, 2.2.2","q":"İxtisaslaşdırılmış idarənin düzgün adı hansıdır?","o":["Dəniz Nəqliyyatı və Enerji Resursları Baş Gömrük İdarəsi","Dəniz və Çay Nəqliyyatı Baş Gömrük İdarəsi","Enerji Resursları və Neft Baş Gömrük İdarəsi","Dəniz Nəqliyyatı Gömrük İdarəsi"],"e":"Əlavə II, 2.2.2."},{"d":1,"c":6,"id":"dgk-123","r":"Struktur, 2.2.3","q":"Aksizli mallar üzrə Baş Gömrük İdarəsi strukturun hansı qrupuna aiddir?","o":["İxtisaslaşdırılmış gömrük idarələrinə","Ərazi gömrük idarələrinə","Tabeliyində olan digər qurumlara","Komitənin aparatına"],"e":"Əlavə II, 2.2.3."},{"d":1,"c":6,"id":"dgk-124","r":"Struktur, 2.4","q":"Tabeliyində olan digər qurumlar siyahısında neçə bənd var?","o":["9","7","8","10"],"e":"Tibbi Xidmət İdarəsi, Avtomobil Nəqliyyatı İdarəsi, Mərkəzi Gömrük Ekspertizası İdarəsi, Baş Gömrük Mühafizə Xidməti, Akademiya, “Azərterminalkompleks” Birliyi, İdman-Sağlamlıq Mərkəzi, Kinoloji Mərkəz, gömrük laboratoriyaları.","t":1},{"d":1,"c":6,"id":"dgk-125","r":"Struktur, 2.4","q":"Aşağıdakılardan hansı tabeliyində olan digər qurumlar sırasında YOXDUR?","o":["Gömrük Tədris Mərkəzi","Kinoloji Mərkəz","Mərkəzi Gömrük Ekspertizası İdarəsi","İdman-Sağlamlıq Mərkəzi"],"e":"Təhsil qurumu kimi siyahıda yalnız Dövlət Gömrük Komitəsinin Akademiyası var."},{"d":1,"c":6,"id":"dgk-126","r":"Struktur, 2.4.4","q":"Tabeliyində olan qurumlardan hansının adında “Baş” sözü var?","o":["Gömrük Mühafizə Xidməti","Tibbi Xidmət İdarəsi","Mərkəzi Gömrük Ekspertizası İdarəsi","Avtomobil Nəqliyyatı İdarəsi"],"e":"Əlavə II, 2.4.4: Baş Gömrük Mühafizə Xidməti (“Baş” qırmızı)."},{"d":1,"c":6,"id":"dgk-127","r":"Struktur","q":"Strukturda adında “Baş” sözü olan cəmi neçə qurum var?","o":["6","5","4","7"],"e":"Bakı Baş GI, Naxçıvan Baş GI, Hava nəqliyyatında Baş GI, Dəniz Nəqliyyatı və Enerji Resursları Baş GI, Aksizli mallar üzrə Baş GI, Baş Gömrük Mühafizə Xidməti: 6.","t":1},{"d":1,"c":6,"id":"dgk-128","r":"Struktur, 2.4.6","q":"“Azərterminalkompleks” strukturda hansı hüquqi formada göstərilib?","o":["Birlik","Açıq Səhmdar Cəmiyyəti","MMC","Publik hüquqi şəxs"],"e":"Əlavə II, 2.4.6: “Azərterminalkompleks” Birliyi."},{"d":1,"c":6,"id":"dgk-129","r":"Struktur, 2","q":"Gömrük postları strukturun hansı hissəsinə daxildir?","o":["Komitənin strukturuna daxil olan gömrük orqanlarına (2.3)","Komitənin aparatına","Ərazi gömrük idarələrinin daxili bölmələrinə, strukturda ayrıca göstərilmir","Tabeliyində olan digər qurumlara"],"e":"Əlavə II, 2.3: gömrük postları."},{"d":1,"c":6,"id":"dgk-130","r":"Struktur, 1–2","q":"Əlavə II-yə görə Komitənin strukturu hansı iki əsas hissədən ibarətdir?","o":["Komitənin aparatı; strukturuna daxil olan gömrük orqanları və tabeliyində olan digər qurumlar","Kollegiya və aparat","Ərazi və ixtisaslaşdırılmış idarələr","Mərkəzi aparat və Naxçıvan Baş Gömrük İdarəsi"],"e":"Əlavə II, 1-ci və 2-ci bəndlər."},{"d":1,"c":5,"id":"dgk-131","r":"Bənd 5.2, 5.4, 5.9","q":"Aşağıdakılardan hansını Prezident DEYİL, sədr müəyyən edir?","o":["Kollegiyanın iş qaydası","Komitənin strukturu və işçilərin ümumi say tərkibi","Kollegiya üzvlərinin sayı və tərkibi","Sədr müavinlərinin vəzifəyə təyini"],"e":"Kollegiyanın iş qaydasını sədr müəyyənləşdirir (5.14). Qalanları Prezidentin səlahiyyətidir (5.2, 5.9, 5.5).","hl":1},{"d":1,"c":5,"id":"dgk-132","r":"Bənd 5.6","q":"Sədrin səlahiyyətləri əsasən hansı fellərlə ifadə olunur (sənəddəki qeydə görə)?","o":["Qərarlar qəbul edir, təmin edir, təsdiq edir","Yardım edir, iştirak edir","Təkliflər verir, məlumat alır","Əlaqələndirir, məsləhət verir"],"e":"Sənəddə 5.6-nın yanında “qərarlar qəbul edir, təmin edir” qeydi var, bir çox yarımbənddə də “təsdiq edir” qırmızı ilə vurğulanıb. Hüquqlar bölməsi üçün isə “məlumatı almaq, təkliflər vermək” qeyd olunub.","hl":1},{"d":1,"c":7,"id":"dgk-rq0","r":"Bənd 1.1","q":"Azərbaycan Respublikası Dövlət Gömrük Komitəsinin tərifi hansı bənddə doğru verilmişdir? (tam doğru cavabı seçin)","o":["Bu Əsasnamə ilə müəyyən edilmiş fəaliyyət istiqamətlərinə uyğun olaraq, gömrük işi sahəsində dövlət siyasətini və tənzimlənməsini həyata keçirən, hüquq mühafizə orqanı statusu olan mərkəzi icra hakimiyyəti orqanıdır","Gömrük işi sahəsində dövlət siyasətini həyata keçirən, Nazirlər Kabinetinin tabeliyində olan publik hüquqi şəxsdir","Gömrük işi sahəsində dövlət siyasətini və tənzimlənməsini həyata keçirən nazirlikdir","Gömrük ödənişlərini toplayan, hüquq mühafizə orqanı statusu olmayan dövlət agentliyidir"],"e":"Bənd 1.1.","ex":1},{"d":1,"c":7,"id":"dgk-rq1","r":"Bənd 1.2","q":"Komitə öz fəaliyyətində rəhbər tutur: (tam doğru cavabı seçin)","o":["Konstitusiyanı, qanunları, Prezidentin fərman və sərəncamlarını, Nazirlər Kabinetinin qərar və sərəncamlarını, Azərbaycanın tərəfdar çıxdığı beynəlxalq müqavilələri və bu Əsasnaməni","Yalnız Konstitusiyanı və Gömrük Məcəlləsini","Konstitusiyanı, qanunları və Ümumdünya Gömrük Təşkilatının qərarlarını","Prezidentin fərmanlarını və Komitənin kollegiyasının qərarlarını"],"e":"Bənd 1.2.","ex":1},{"d":1,"c":7,"id":"dgk-rq2","r":"Bənd 1.4","q":"Komitə öz fəaliyyətini hansı prinsiplər əsasında qurur? (tam doğru cavabı seçin)","o":["Qanunun aliliyi, insan hüquqlarının və azadlıqlarının qorunması, şəxslərin qanun qarşısında hüquq bərabərliyi, aşkarlıq, peşəkarlıq və xidmətdə nizam-intizam","Qanunçuluq, humanizm, demokratizm və mərkəzləşmə","Qanunun aliliyi, məxfilik, tabelik və vahid komandanlıq","Şəffaflıq, səmərəlilik, müstəqillik və siyasi bitərəflik"],"e":"Bənd 1.4: 5 prinsip.","ex":1},{"d":1,"c":7,"id":"dgk-rq3","r":"Bənd 5.6, 5.9","q":"Aşağıdakılardan biri Dövlət Gömrük Komitəsi sədrinin səlahiyyətlərinə aid deyil:","o":["Kollegiya üzvlərinin sayını və tərkibini təsdiq edir","Komitənin işini təşkil edir və ona rəhbərlik edir","Müavinləri arasında vəzifə bölgüsü aparır","Gömrük orqanlarının vəzifəli şəxslərinə xüsusi rütbələr verir"],"e":"Kollegiya üzvlərinin sayı və tərkibi Prezident tərəfindən təsdiq edilir (5.9). Digərləri sədrin səlahiyyətləridir (5.6.1, 5.6.2, 5.6.20).","ex":1},{"d":1,"c":7,"id":"dgk-rq4","r":"Fərman","q":"“Azərbaycan Respublikasının Dövlət Gömrük Komitəsi haqqında” Əsasnamə nə vaxt qəbul edilmişdir?","o":["Azərbaycan Respublikası Prezidentinin 2012-ci il 4 iyun tarixli 646 nömrəli Fərmanı ilə","Prezidentin 2011-ci il 15 sentyabr tarixli 499 nömrəli Fərmanı ilə","Milli Məclisin 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə","Nazirlər Kabinetinin 2012-ci il 3 avqust tarixli 167 nömrəli Qərarı ilə"],"e":"Əlavə I, 4 iyun 2012, № 646.","ex":1},{"d":1,"c":7,"id":"dgk-rq5","r":"Bənd 5.2","q":"Komitənin işçilərinin ümumi say tərkibi kim tərəfindən müəyyən edilir?","o":["Azərbaycan Respublikasının Prezidenti","Komitənin sədri","Nazirlər Kabineti","Komitənin kollegiyası"],"e":"Bənd 5.2: struktur və işçilərin ümumi say tərkibi Prezident tərəfindən müəyyən edilir.","ex":1},{"d":1,"c":7,"id":"dgk-rq6","r":"Bənd 5.2","q":"Komitənin strukturu kim tərəfindən müəyyən edilir?","o":["Azərbaycan Respublikasının Prezidenti","Komitənin sədri","Nazirlər Kabineti","Milli Məclis"],"e":"Bənd 5.2. Diqqət: müəyyən edilmiş struktur daxilində aparatın, gömrük orqanlarının strukturunu və ştat cədvəlini isə sədr təsdiq edir (5.6.5).","ex":1},{"d":1,"c":7,"id":"dgk-rq7","r":"Bənd 2.1","q":"Komitənin fəaliyyət istiqamətlərindən biri düzgün göstərilməyib:","o":["Gömrük işi sahəsində ədalət mühakiməsini həyata keçirir","Gömrük işini təşkil edir və onun inkişafını təmin edir","Gömrük işi sahəsində normayaratma fəaliyyətini həyata keçirir","Hüquq mühafizə fəaliyyətini həyata keçirir"],"e":"Bənd 2.1: 5 fəaliyyət istiqaməti — vahid dövlət siyasətinin formalaşmasında iştirak, gömrük işinin təşkili, normayaratma, hüquq mühafizə fəaliyyəti, qabaqcıl gömrük tənzimlənməsi vasitələrinin tətbiqi.","ex":1},{"d":1,"c":7,"id":"dgk-rq8","r":"Bənd 3.1","q":"Komitənin vəzifələrindən biri düzgün göstərilməyib:","o":["İdxal gömrük rüsumlarının dərəcələrini təsdiq etmək","Gömrük ödənişlərinin alınmasını təmin etmək","Xarici ticarətin gömrük statistikasını beynəlxalq standartlara uyğun aparmaq","Qanunvericilikdə nəzərdə tutulmuş qaydada ixrac nəzarətini həyata keçirmək"],"e":"Rüsum dərəcələrini Nazirlər Kabineti müəyyən edir. Digərləri Komitənin vəzifələridir (3.1.7, 3.1.18, 3.1.24).","ex":1},{"d":1,"c":7,"id":"dgk-rq9","r":"Struktur, 2.1","q":"Aşağıdakılardan biri ərazi gömrük idarəsi deyil:","o":["Hava nəqliyyatında Baş Gömrük İdarəsi","Bakı Baş Gömrük İdarəsi","Naxçıvan Baş Gömrük İdarəsi","Şərqi Zəngəzur Gömrük İdarəsi"],"e":"Hava nəqliyyatında Baş Gömrük İdarəsi ixtisaslaşdırılmış gömrük idarəsidir (2.2.1). Ərazi idarələri (2.1): Bakı Baş, Naxçıvan Baş, Astara, Balakən, Biləsuvar, Gəncə, Xaçmaz, Sumqayıt, Şərqi Zəngəzur, Tovuz.","ex":1},{"d":1,"c":7,"id":"dgk-rq10","r":"Bənd 3.1","q":"Aşağıdakılardan biri Komitənin vəzifələrinə aid deyil:","o":["Vergi ödəyicilərini dövlət qeydiyyatına almaq","Gömrük işi sahəsində riskləri idarəetmə sistemi əsasında gömrük nəzarətini təkmilləşdirmək","Malların gömrük dəyərinin düzgün müəyyən olunmasına nəzarət sistemini təşkil etmək","İnsan alverçilərinin gömrük sərhədindən keçməsinin qarşısını almaq"],"e":"Vergi qeydiyyatı vergi orqanlarının işidir. Digərləri 3.1.30, 3.1.9, 3.1.17-dir.","ex":1},{"d":1,"c":7,"id":"dgk-rq11","r":"Bənd 4.1","q":"Komitənin hüquqlarından biri düzgün göstərilməyib:","o":["Məhkəmənin qərarı olmadan şəxslərin əmlakını müsadirə etmək","Şəxslərin xarici ticarət əməliyyatlarının gömrük auditini aparmaq","Cinayət-prosessual qanunvericiliyi ilə müəyyən edilmiş qaydada təhqiqat və ibtidai istintaq aparmaq","Gömrük orqanlarının və tabeliyində olan digər qurumların fəaliyyətini yoxlamaq və təftişini həyata keçirmək"],"e":"Belə hüquq yoxdur. Digərləri 4.1.4, 4.1.9, 4.1.23-dür.","ex":1},{"d":1,"c":7,"id":"dgk-rq12","r":"Bənd 5.11","q":"Aşağıdakılardan biri Komitənin kollegiyası tərəfindən barəsində qərar qəbul edilənlərə aid deyil:","o":["Sədrin müavinləri arasında vəzifə bölgüsü","Komitə ilə digər şəxslər (qurumlar) arasında münasibətləri tənzimləyən normativ hüquqi aktlar","Bir neçə dövlət orqanının fəaliyyətini tənzimləyən vahid (birgə) normativ hüquqi aktlar","Prezident və ya Nazirlər Kabineti tərəfindən Komitəyə tapşırılmış konkret normativ hüquqi aktlar"],"e":"Vəzifə bölgüsünü sədr aparır (5.6.2). Kollegiya qərarları 5.11.1–5.11.6-dadır (imtahan sualı).","ex":1},{"d":1,"c":7,"id":"dgk-rq13","r":"Struktur, 2.2","q":"Aşağıdakılardan biri ixtisaslaşdırılmış gömrük idarəsi deyil:","o":["Bakı Baş Gömrük İdarəsi","Hava nəqliyyatında Baş Gömrük İdarəsi","Dəniz Nəqliyyatı və Enerji Resursları Baş Gömrük İdarəsi","Aksizli mallar üzrə Baş Gömrük İdarəsi"],"e":"Bakı Baş Gömrük İdarəsi ərazi idarəsidir (2.1.1). İxtisaslaşdırılmış idarələr (2.2): Hava nəqliyyatında Baş, Dəniz Nəqliyyatı və Enerji Resursları Baş, Aksizli mallar üzrə Baş, Azad və Xüsusi İqtisadi Zonalar üzrə Gömrük İdarəsi.","ex":1},{"d":1,"c":7,"id":"dgk-rq14","r":"Struktur, 2.4","q":"Aşağıdakılardan biri Komitənin tabeliyində olan digər qurum deyil:","o":["Aksizli mallar üzrə Baş Gömrük İdarəsi","Mərkəzi Gömrük Ekspertizası İdarəsi","Kinoloji Mərkəz","“Azərterminalkompleks” Birliyi"],"e":"Aksizli mallar üzrə Baş Gömrük İdarəsi ixtisaslaşdırılmış idarədir (2.2.3). Tabelikdəki digər qurumlar (2.4): Tibbi Xidmət İdarəsi, Avtomobil Nəqliyyatı İdarəsi, Mərkəzi Gömrük Ekspertizası İdarəsi, Baş Gömrük Mühafizə Xidməti, Akademiya, “Azərterminalkompleks”, İdman-Sağlamlıq Mərkəzi, Kinoloji Mərkəz, gömrük laboratoriyaları.","ex":1},{"d":2,"c":0,"id":"etik-0","r":"Qərar","q":"Etik Davranış Kodeksi hansı qərarla təsdiq edilib?","o":["DGK Kollegiyasının 3 noyabr 2023-cü il tarixli 3-33/3-2-000001/2023 nömrəli Qərarı","DGK sədrinin 3 noyabr 2023-cü il tarixli əmri","Nazirlər Kabinetinin 3 noyabr 2023-cü il tarixli qərarı","DGK Kollegiyasının 30 yanvar 2012-ci il tarixli 01/03 nömrəli Qərarı"],"e":"Kodeks DGK Kollegiyasının 03.11.2023 tarixli 3-33/3-2-000001/2023 nömrəli Qərarı ilə təsdiq edilib. 2012-ci il tarixli 01/03 nömrəli Qərar isə ləğv edilib.","t":1},{"d":2,"c":0,"id":"etik-1","r":"Qərar, preambula","q":"Kollegiya Qərarı Prezidentin hansı Fərmanının hansı bəndinin icrasını təmin etmək məqsədilə qəbul edilib?","o":["2011-ci il 15 sentyabr tarixli 499 nömrəli Fərmanın 27.2-ci bəndi","2012-ci il 4 iyun tarixli 646 nömrəli Fərmanın 5.11.6-cı bəndi","2011-ci il 15 sentyabr tarixli 499 nömrəli Fərmanın 5.11.6-cı bəndi","2007-ci il 31 may tarixli 352 nömrəli Fərmanın 21.2.8-ci bəndi"],"e":"Preambula (tarix və nömrə xətt çəkilib): Gömrük Məcəlləsinin tətbiqi barədə 15.09.2011 tarixli 499 nömrəli Fərmanın 27.2-ci bəndi.","hl":1,"t":1},{"d":2,"c":0,"id":"etik-2","r":"Qərar, preambula","q":"Kollegiya Qərarı qəbul edərkən DGK haqqında Əsasnamənin hansı yarımbəndini rəhbər tutub?","o":["5.11.6","5.11.1","5.6.3","5.6.11"],"e":"Preambula: 646 nömrəli Fərmanla təsdiq edilmiş Əsasnamənin 5.11.6-cı yarımbəndi. Bu yarımbənd kollegiyanın qəbul etdiyi aktların ləğvi və dəyişdirilməsinə aiddir.","t":1},{"d":2,"c":0,"id":"etik-3","r":"Qərar, 2","q":"Yeni Qərarla hansı akt ləğv edilib?","o":["DGK Kollegiyasının 2012-ci il 30 yanvar tarixli 01/03 nömrəli Qərarı","DGK Kollegiyasının 2011-ci il 15 sentyabr tarixli 499 nömrəli Qərarı","DGK sədrinin 2012-ci il 30 yanvar tarixli əmri","Nazirlər Kabinetinin 2012-ci il 30 yanvar tarixli 01/03 nömrəli Qərarı"],"e":"Qərarın 2-ci bəndi.","t":1},{"d":2,"c":0,"id":"etik-4","r":"Qərar, 3","q":"Qərarın Hüquqi Aktların Dövlət Reyestrinə daxil edilməsi üçün Ədliyyə Nazirliyinə təqdim olunmasını hansı qurum və hansı müddətdə təmin etməlidir?","o":["Hüquqi Təminat İdarəsi, 3 gün müddətində","Kadrlar İdarəsi, 3 gün müddətində","Hüquqi Təminat İdarəsi, 10 gün müddətində","Aparatın rəhbəri, 5 gün müddətində"],"e":"Qərarın 3-cü bəndi.","t":1},{"d":2,"c":0,"id":"etik-5","r":"Qərar","q":"Qərarı Kollegiyanın sədri kimi kim imzalayıb?","o":["Şahin Bağırov","Aydın Əliyev","Səfər Mehdiyev","Qərar imzasız dərc edilib"],"e":"Qərarı Kollegiyanın sədri Şahin Bağırov imzalayıb."},{"d":2,"c":1,"id":"etik-6","r":"Preambula","q":"Kodeks nəyi müəyyən edir?","o":["Gömrük orqanı əməkdaşının etik davranış qaydalarını və onlara əməl edilməsi ilə bağlı hüquqi mexanizmləri","Gömrük orqanlarında intizam tənbehlərinin növlərini","Gömrük orqanlarında xidmətə qəbulun qaydalarını","Gömrük orqanlarının strukturunu"],"e":"Kodeksin preambulası."},{"d":2,"c":1,"id":"etik-7","r":"Bənd 1.1","q":"Kodeks Gömrük Məcəlləsinin hansı maddəsinə əsasən hazırlanıb?","o":["53.9-cu maddəsinə","7.2-ci maddəsinə","53.1-ci maddəsinə","27.2-ci maddəsinə"],"e":"Maddə 1.1.","t":1},{"d":2,"c":1,"id":"etik-8","r":"Bənd 1.1","q":"Kodeks “Dövlət qulluqçularının etik davranış qaydaları haqqında” Qanunun hansı maddəsinə əsasən hazırlanıb və həmin Qanunun tarixi, nömrəsi nədir?","o":["21.2.8-ci maddəsi; 31 may 2007, № 352-IIIQ","21.2.8-ci maddəsi; 30 sentyabr 2005, № 1024-IIQ","12.2.8-ci maddəsi; 31 may 2007, № 352-IIIQ","21.2.8-ci maddəsi; 7 dekabr 1999, № 768-IQ"],"e":"Maddə 1.1.","t":1},{"d":2,"c":1,"id":"etik-9","r":"Bənd 1.1","q":"Kodeks kimlərə şamil edilir?","o":["Xüsusi rütbəli vəzifəli şəxslərə və xüsusi rütbə nəzərdə tutulmayan vəzifələrdə çalışan əməkdaşlara","Yalnız xüsusi rütbəli vəzifəli şəxslərə","Yalnız DGK-nın Aparatının əməkdaşlarına","Gömrük orqanlarına müraciət edən bütün şəxslərə"],"e":"Maddə 1.1: hər iki qrup birlikdə “gömrük orqanı əməkdaşları” adlanır."},{"d":2,"c":1,"id":"etik-10","r":"Bənd 1.2","q":"1.2-ci bəndə görə əməkdaş Kodeksi öyrənərkən və ona əməl edərkən nəyi rəhbər tutmalıdır?","o":["Qanunun aliliyini, insan hüquqlarını, demokratik prinsipləri və etik davranış tələblərini","Yalnız rəhbərinin göstərişlərini","Dini və milli dəyərləri","Kollegiyanın qərarlarını"],"e":"Maddə 1.2."},{"d":2,"c":1,"id":"etik-11","r":"Bənd 2.1","q":"Kodeksin neçə məqsədi göstərilib?","o":["5","4","6","3"],"e":"Maddə 2.1 (mavi ilə rənglənib): 2.1.1–2.1.5.","hl":1,"t":1},{"d":2,"c":1,"id":"etik-12","r":"Bənd 2.1","q":"Aşağıdakılardan hansı 2.1-ci bənddə Kodeksin məqsədləri arasında YOXDUR?","o":["Gömrük ödənişlərinin artırılması","Gömrük orqanlarının fəaliyyətində səmərəliliyin və şəffaflığın artırılması","Maraqların toqquşmasının qarşısının alınması","Hüquqi və fiziki şəxslərin əməkdaşların gözlənilən davranışları barədə öncədən məlumatlandırılması"],"e":"Maddə 2.1 (rənglənib): nüfuz və etimad, səmərəlilik və şəffaflıq, korrupsiya və maraqların toqquşması, şəxslərin öncədən məlumatlandırılması, Konstitusiyaya və qanunvericiliyə riayətə sövq.","hl":1},{"d":2,"c":1,"id":"etik-13","r":"Bənd 2.1.4","q":"Kodeksin məqsədlərindən biri kimin öncədən məlumatlandırılmasıdır?","o":["Hüquqi və fiziki şəxslərin, əməkdaşların gözlənilən davranışları barədə","Əməkdaşların, intizam tənbehləri barədə","Rəhbərlərin, əməkdaşların şəxsi həyatı barədə","Medianın, gömrük statistikası barədə"],"e":"Maddə 2.1.4 (rənglənib).","hl":1},{"d":2,"c":1,"id":"etik-14","r":"Bənd 3.1","q":"Kodeksə görə “xidməti davranış” nədir?","o":["Əməkdaşın qanunvericiliklə ona verilmiş hüquqların həyata keçirilməsi və vəzifələrin yerinə yetirilməsi ilə əlaqədar fəaliyyəti","Əməkdaşın iş vaxtında etdiyi bütün hərəkətlər","Əməkdaşın xidməti geyim formasında olduğu vaxtdakı davranışı","Əməkdaşın rəhbərlə münasibəti"],"e":"Maddə 3.1."},{"d":2,"c":1,"id":"etik-15","r":"Bənd 3.2","q":"Əməkdaşın xidməti davranışı hansı aktlarla tənzimlənir?","o":["“Dövlət qulluqçularının etik davranış qaydaları haqqında” Qanun, bu Kodeks və digər normativ hüquqi aktlarla","Yalnız bu Kodekslə","Əmək Məcəlləsi və Gömrük Məcəlləsi ilə","Yalnız “Gömrük orqanlarında xidmət haqqında” Əsasnamə ilə"],"e":"Maddə 3.2."},{"d":2,"c":1,"id":"etik-16","r":"Bənd 4.1","q":"4.1-ci bənddə gömrük orqanlarında neçə etik dəyər göstərilib?","o":["5","6","4","7"],"e":"Maddə 4.1: dövlətçilik və ictimai mənafeyin qorunması, korrupsiyaya qarşı mübarizəyə dəstək, nümunəvilik, məsuliyyətlilik, birlik və əməkdaşlıq.","hl":1,"t":1},{"d":2,"c":1,"id":"etik-17","r":"Bənd 4.1","q":"Aşağıdakılardan hansı 4.1-ci bənddə gömrük orqanlarının etik DƏYƏRLƏRİ arasında YOXDUR?","o":["Dürüstlük","Nümunəvilik","Məsuliyyətlilik","Birlik və əməkdaşlıq"],"e":"Sənəddə 4.1-in yanında “dürüstlük səhv” qeydi var. Dürüstlük dəyər deyil, Fəsil 2-də etik davranış qaydasıdır (maddə 6). Bu, ən çox düşülən tələdir.","hl":1},{"d":2,"c":1,"id":"etik-18","r":"Bənd 4.1","q":"Aşağıdakılardan hansı etik dəyər deyil, etik DAVRANIŞ QAYDASIDIR?","o":["Qərəzsizlik","Dövlətçilik və ictimai mənafeyin qorunması","Korrupsiyaya qarşı mübarizəyə dəstək","Nümunəvilik"],"e":"Qərəzsizlik maddə 7-dədir (Fəsil 2, etik davranış qaydaları). Qalanları 4.1-də dəyərdir.","hl":1},{"d":2,"c":1,"id":"etik-19","r":"Bənd 4.1.1","q":"“Dövlətçilik və ictimai mənafeyin qorunması” dəyəri nəyi ehtiva edir?","o":["Dövlətçiliyə yüksək hörmət, dövlətin maraqlarının və nüfuzunun uca tutulması, ictimai mənafeyin gözlənilməsi","Siyasi partiyalara dəstək","Dövlət sirrinin qorunması","Dövlət əmlakından düzgün istifadə"],"e":"Maddə 4.1.1."},{"d":2,"c":1,"id":"etik-20","r":"Bənd 4.1.2","q":"“Korrupsiyaya qarşı mübarizəyə dəstək” dəyərinə görə əməkdaş nə edir?","o":["Səlahiyyətləri çərçivəsində korrupsiya hüquqpozmalarının və korrupsiyaya şərait yaradan hüquqpozmaların qarşısını alır","Korrupsiya işləri üzrə istintaq aparır","Korrupsiya halları barədə yalnız mediaya məlumat verir","Antikorrupsiya qanunvericiliyini hazırlayır"],"e":"Maddə 4.1.2."},{"d":2,"c":1,"id":"etik-21","r":"Bənd 4.1.3","q":"“Nümunəvilik” dəyəri hansı vaxtı əhatə edir?","o":["Xidməti və xidmətdənkənar vaxtları","Yalnız xidməti vaxtı","Yalnız xidmətdənkənar vaxtı","Yalnız xidməti geyim formasında olduğu vaxtı"],"e":"Maddə 4.1.3 (mavi): xidməti və xidmətdənkənar vaxtlarda əxlaq, sosial və ailə-məişət dəyərlərinə riayət.","hl":1},{"d":2,"c":1,"id":"etik-22","r":"Bənd 4.1.3","q":"“Nümunəvilik” dəyərinə hansı dəyərlərə riayət daxildir?","o":["Hamılıqla qəbul olunmuş əxlaq, sosial və ailə-məişət dəyərləri","Dini və milli dəyərlər","Siyasi və ideoloji dəyərlər","Korporativ və kommersiya dəyərləri"],"e":"Maddə 4.1.3 (rənglənib). Həmçinin vətəndaş kimi qanunvericiliklə müəyyən edilmiş vəzifə və öhdəliklərin icrası.","hl":1},{"d":2,"c":1,"id":"etik-23","r":"Bənd 4.1.4","q":"“Məsuliyyətlilik” dəyərinə nə daxildir?","o":["Vəzifə funksiyalarının vaxtında və keyfiyyətlə icrası, zəruri bilik və bacarıqların mütəmadi inkişaf etdirilməsi","Rəhbərin bütün göstərişlərinin müzakirəsiz icrası","Pozuntulara görə intizam məsuliyyətinə cəlb olunma","Həmkarların səhvlərinə görə məsuliyyət daşımaq"],"e":"Maddə 4.1.4 (mavi).","hl":1},{"d":2,"c":1,"id":"etik-24","r":"Bənd 4.1.5","q":"“Birlik və əməkdaşlıq” dəyəri nəyi nəzərdə tutur?","o":["Hər bir əməkdaşın gömrük siyasətinin icrasında rolunu dərk etməsi, birgə səy, əməkdaşlıq və qarşılıqlı köməklik","Həmkarlar ittifaqına məcburi üzvlük","Digər dövlət orqanları ilə birgə əməliyyatlar","Kollektivin qərarlarına şərtsiz tabe olmaq"],"e":"Maddə 4.1.5 (mavi).","hl":1},{"d":2,"c":2,"id":"etik-25","r":"Bənd 5","q":"Vicdanlı davranışa görə əməkdaş xidməti vəzifələrini kimin maraqları naminə yerinə yetirir?","o":["Fiziki və hüquqi şəxslərin, cəmiyyətin və dövlətin","Yalnız dövlətin","Yalnız gömrük orqanının","Rəhbərliyin"],"e":"Maddə 5.1: səmərəli və ədalətlə. 5.2-yə görə əməkdaş bütün hallarda cəmiyyət üçün vicdanlılıq nümunəsi olmalıdır."},{"d":2,"c":2,"id":"etik-26","r":"Bənd 6","q":"“Dürüstlük” Kodeksdə nə kimi göstərilib?","o":["Fəsil 2-də etik davranış qaydası (maddə 6)","Fəsil 1-də etik dəyər (4.1)","Kodeksin məqsədi (2.1)","Nəzarət forması (30.1)"],"e":"Maddə 6 (bənövşəyi): həmkarlarla səmimi olmaq, həqiqəti söyləmək, riyakarlıqdan qaçmaq, qanuni və ədalətli qərarlarla düzgün mövqe nümayiş etdirmək.","hl":1},{"d":2,"c":2,"id":"etik-27","r":"Bənd 6","q":"Dürüstlük qaydasına görə əməkdaş nədən qaçmalıdır?","o":["Riyakarlıqdan","Tənqiddən","Mediadan","Ezamiyyətlərdən"],"e":"Maddə 6: həqiqəti söyləməklə riyakarlıqdan qaçmalı.","hl":1},{"d":2,"c":2,"id":"etik-28","r":"Bənd 7.1","q":"Qərəzsizlik qaydasında hansı əlamətə görə üstünlüyə yol verilməməsi xüsusi qeyd olunub?","o":["Xidmət sahəsinə görə","Yaşa görə","Təhsilə görə","Boya görə"],"e":"Maddə 7.1: irq, milliyyət, din, dil, cins, sosial mənsubiyyət, əmlak vəziyyəti və xidmət sahəsi, əqidə, ictimai və digər birliyə mənsubiyyət."},{"d":2,"c":2,"id":"etik-29","r":"Bənd 7.2","q":"Qərəzsizlik qaydasına görə əməkdaş kimlərin onun xidməti fəaliyyətinə təsirinə yol verməməlidir?","o":["Ailə üzvlərinin, qohumlarının, dostlarının, sosial və digər münasibətlərinin","Yalnız ailə üzvlərinin","Yalnız rəhbərlərinin","Yalnız medianın"],"e":"Maddə 7.2."},{"d":2,"c":2,"id":"etik-30","r":"Bənd 8.1","q":"İctimai etimad qaydasına görə əməkdaş nəyi uca tutmağa borcludur?","o":["Gömrük orqanlarının nüfuzunu, öz adını və şərəfini","Yalnız dövlət bayrağını","Rəhbərinin nüfuzunu","Həmkarlar ittifaqının nüfuzunu"],"e":"Maddə 8.1 (bənövşəyi).","hl":1},{"d":2,"c":2,"id":"etik-31","r":"Bənd 8.3","q":"8.3-cü bəndə görə əməkdaş etik davranışı və peşəkar fəaliyyəti ilə nəyi artırmalı və möhkəmləndirməlidir?","o":["Hüquqi və fiziki şəxslərin dövlət orqanlarına inamını","Gömrük ödənişlərinin həcmini","Öz karyera imkanlarını","Kollektivdə öz nüfuzunu"],"e":"Maddə 8.3 (bənövşəyi).","hl":1},{"d":2,"c":2,"id":"etik-32","r":"Bənd 8.4","q":"Etik normaları pozmuş əməkdaş 8.4-cü bəndə görə nə etməyə borcludur?","o":["Pozuntunun nəticələrini aradan qaldırmağa səy göstərməyə, ictimai etimadın bərpası üçün tədbirlər görməyə","Dərhal istefa verməyə","Yalnız yazılı izahat verməyə","Mediada açıq üzr istəməyə"],"e":"Maddə 8.4 (bənövşəyi).","hl":1},{"d":2,"c":2,"id":"etik-33","r":"Bənd 8.2","q":"8.2-ci bəndə görə əməkdaş hansı hərəkətlərə yol verməməlidir?","o":["Xidməti vəzifələrlə bir araya sığmayan, adına xələl gətirə bilən və orqanın nüfuzunu aşağı sala bilən hərəkətlərə","Yalnız cinayət xarakterli hərəkətlərə","Yalnız iş vaxtında edilən hərəkətlərə","Yalnız rəhbərin qadağan etdiyi hərəkətlərə"],"e":"Maddə 8.2 (bənövşəyi).","hl":1},{"d":2,"c":2,"id":"etik-34","r":"Bənd 9.1","q":"Mədəni davranış qaydasına görə əməkdaş münasibətlərdə hansı keyfiyyətləri göstərməlidir?","o":["Nəzakətli, xeyirxah, diqqətli və səbrli olmaq","Sərt, tələbkar və qısa olmaq","Yalnız rəsmi və soyuq olmaq","Səmimi və dostyana olmaq"],"e":"Maddə 9.1: müraciət edənlərlə, rəhbərlərlə, tabeliyində olanlarla və həmkarlarla."},{"d":2,"c":2,"id":"etik-35","r":"Bənd 9.2","q":"Xidmətlə əlaqədar ünsiyyətdə əməkdaş hansı qaydalara uyğun davranmalıdır?","o":["İşgüzar etiket qaydalarına","Hərbi nizamnamə qaydalarına","Diplomatik protokol qaydalarına","Daxili intizam qaydalarına"],"e":"Maddə 9.2: hər bir şəxslə hörmətlə və işgüzar etiket qaydalarına uyğun."},{"d":2,"c":2,"id":"etik-36","r":"Bənd 10.1","q":"Loyallıq qaydasına görə əməkdaş dövlət orqanlarının fəaliyyəti barədə tənqidi ictimai müzakirələrdən çəkinməlidir. Hansı hal İSTİSNADIR?","o":["Qanunsuz fəaliyyət, həmçinin elmi-pedaqoji fəaliyyətlə bağlı çıxışlar və elmi yazılar","Sosial mediada şəxsi səhifədə paylaşım","Həmkarlar arasında qeyri-rəsmi müzakirə","Xarici mediaya müsahibə"],"e":"Maddə 10.1: qanunsuz fəaliyyət istisnadır. Qayda elmi-pedaqoji çıxışlara və elmi yazılara da şamil olunmur."},{"d":2,"c":2,"id":"etik-37","r":"Bənd 10.2","q":"Əməkdaş açıq çıxışlar etməkdən hansı hal istisna olmaqla çəkinməlidir?","o":["Ona xüsusi səlahiyyət verilmiş hallar","Rəhbərinin şifahi razılığı olduqda","Bayram tədbirlərində","Heç bir istisna yoxdur"],"e":"Maddə 10.2 (bənövşəyi).","hl":1},{"d":2,"c":2,"id":"etik-38","r":"Bənd 10.3","q":"10.3-cü bəndə görə loyallıq qaydasına nə daxildir?","o":["Xidmət keçmə ilə bağlı qanunvericiliklə nəzərdə tutulmuş məhdudiyyətlərə əməl etmək","Rəhbərliyin siyasi baxışlarını bölüşmək","Xidmətdən çıxdıqdan sonra 5 il susmaq","Gömrük orqanlarını yalnız müsbət işıqlandırmaq"],"e":"Maddə 10.3 (bənövşəyi).","hl":1},{"d":2,"c":2,"id":"etik-39","r":"Bənd 11.2","q":"11.2-ci bəndə görə əməkdaş hansı qərar və hərəkətlərə (hərəkətsizliyə) yol verməməlidir?","o":["Fiziki şəxslərin hüquq və azadlıqlarını pozan, şərəf, ləyaqət və işgüzar nüfuzunu ləkələyə biləcək","Yalnız qanunu açıq pozan","Yalnız hüquqi şəxslərin maraqlarına zidd olan","Yalnız rəhbərin razılığı olmayan"],"e":"Maddə 11.2."},{"d":2,"c":2,"id":"etik-40","r":"Bənd 12.3","q":"Peşəkarlıq qaydasına görə əməkdaş hansı hala yol verməməlidir?","o":["Süründürməçilik hallarına","Əlavə təhsil almağa","Təşəbbüs göstərməyə","Həmkarlarına kömək etməyə"],"e":"Maddə 12.3: özünə qarşı tələbkar olmalı, vəzifələri vaxtında və vicdanla yerinə yetirməli, süründürməçiliyə yol verməməlidir. 20.2-də də vətəndaşlarla ünsiyyətdə süründürməçilik qadağandır."},{"d":2,"c":2,"id":"etik-41","r":"Bənd 12.4–12.5","q":"12.4 və 12.5-ci bəndlərə görə əməkdaş nəyə yaxından bələd olmalı və nəyi izləməlidir?","o":["İnsan hüquq və azadlıqlarına dair prinsip və normalara; milli qanunvericilikdə və beynəlxalq hüquqda olan yeniliklərə","Yalnız Gömrük Məcəlləsinə; xarici dövlətlərin gömrük tariflərinə","Yalnız daxili təlimatlara","Mediada gömrük orqanları haqqında yazılara"],"e":"Maddə 12.4 və 12.5."},{"d":2,"c":2,"id":"etik-42","r":"Bənd 13.2","q":"Əməkdaşa qanunsuz maddi nemət təklif olunarsa, nə etməlidir?","o":["Təklifdən imtina etməlidir","Qəbul edib sonra rəhbərə təhvil verməlidir","Mediaya məlumat verməlidir","Təklif edəni dərhal saxlamalıdır"],"e":"Maddə 13.2."},{"d":2,"c":2,"id":"etik-43","r":"Bənd 13.3","q":"Maddi nemət əməkdaşa ondan asılı olmayan səbəblərdən verilibsə, o, nə etməlidir?","o":["Korrupsiya hüquqpozmaları üzrə məlumatları qəbul edən və araşdıran səlahiyyətli bölməyə məlumat verməli və neməti gömrük orqanına akt üzrə təhvil verməlidir","Neməti sahibinə qaytarmalıdır","Neməti xeyriyyəyə verməlidir","Yalnız bilavasitə rəhbərinə şifahi məlumat verməlidir"],"e":"Maddə 13.3."},{"d":2,"c":2,"id":"etik-44","r":"Bənd 13.4","q":"Tərəflərindən biri gömrük orqanı olan əqdlərdə əməkdaşın statusu necədir?","o":["Əməkdaş digər tərəf ola bilməz","Əməkdaş rəhbərin icazəsi ilə digər tərəf ola bilər","Əməkdaş yalnız vasitəçi ola bilər","Məhdudiyyət yoxdur"],"e":"Maddə 13.4."},{"d":2,"c":2,"id":"etik-45","r":"Bənd 14.1","q":"Hədiyyə qadağası hansı hallara ŞAMİL OLUNMUR?","o":["Xidməti vəzifələrin icrasına təsir etməmək şərtilə kiçik hədiyyələrə və sadə qonaqpərvərliyə","Dəyəri 50 manatdan az olan istənilən hədiyyəyə","Bayram hədiyyələrinə","Xarici ticarət iştirakçılarının hədiyyələrinə"],"e":"Maddə 14.1."},{"d":2,"c":2,"id":"etik-46","r":"Bənd 14.2","q":"Əməkdaş hədiyyəni qəbul edib-etməməklə bağlı qərara gələ bilmirsə, kimin rəyini öyrənməlidir?","o":["Korrupsiya hüquqpozmaları üzrə məlumatları qəbul edən və araşdıran səlahiyyətli struktur bölmənin (şəxsin)","Bilavasitə rəhbərinin","Etik davranış üzrə məsul şəxsin","Həmkarlar ittifaqının"],"e":"Maddə 14.2."},{"d":2,"c":2,"id":"etik-47","r":"Bənd 14.3","q":"14.3-cü bəndə görə əməkdaşa nə qadağandır?","o":["Xarici ölkələrə gedən şəxslərdən özü və ya başqası üçün hər hansı əşyanın gətirilməsini tələb və ya sifariş etmək","Xarici ölkəyə ezamiyyətə getmək","Xarici ölkədən hədiyyə almaq","Xarici ticarət iştirakçıları ilə görüşmək"],"e":"Maddə 14.3."},{"d":2,"c":2,"id":"etik-48","r":"Bənd 14.4","q":"Beynəlxalq tədbirdə protokol qaydalarına görə hədiyyə qəbul edən əməkdaş TƏK ezam olunubsa, kimə və nə vaxt məlumat verməlidir?","o":["Ezamiyyətdən qayıtdıqdan sonra bilavasitə rəhbərinə","Dərhal nümayəndə heyətinin rəhbərinə","Dərhal etik davranış üzrə məsul şəxsə","Hədiyyəni aldığı gün DGK sədrinə"],"e":"Maddə 14.4: nümayəndə heyəti ilə olduqda dərhal heyətin rəhbərinə, tək olduqda isə qayıtdıqdan sonra bilavasitə rəhbərinə.","hl":1},{"d":2,"c":2,"id":"etik-49","r":"Bənd 15.2","q":"Xidməti vəzifə ilə şəxsi maraq arasında ziddiyyət yarandıqda əməkdaş kimə məlumat verməyə borcludur?","o":["Bilavasitə rəhbərinə","Etik davranış üzrə məsul şəxsə","DGK sədrinə","Daxili təhlükəsizlik bölməsinə"],"e":"Maddə 15.2."},{"d":2,"c":2,"id":"etik-50","r":"Bənd 15.3","q":"Maraqların toqquşması barədə məlumat almış struktur bölmə rəhbərinin görə biləcəyi neçə tədbir göstərilib?","o":["3","2","4","5"],"e":"Maddə 15.3: funksiyaların başqasına həvalə edilməsi, xidməti vəzifələrin dəyişdirilməsi, razılığı ilə analoji vəzifəyə keçirilmə. Bunlardan biri və ya bir neçəsi tətbiq olunur.","t":1},{"d":2,"c":2,"id":"etik-51","r":"Bənd 15.3.3","q":"Maraqların toqquşmasının qarşısını almaq üçün əməkdaşı başqa vəzifəyə keçirmək hansı şərtlə mümkündür?","o":["Öz razılığı ilə digər analoji vəzifəyə","Razılığı olmadan aşağı vəzifəyə","Yalnız attestasiyadan sonra","Yalnız intizam tənbehi qaydasında"],"e":"Maddə 15.3.3."},{"d":2,"c":2,"id":"etik-52","r":"Bənd 15.4","q":"Başqa vəzifəyə keçirilmə təklifi maraqların toqquşmasına səbəb ola bilərsə, əməkdaş kimə məlumat verməlidir?","o":["Gömrük orqanının rəhbərinə","Bilavasitə rəhbərinə","Kadrlar bölməsinə","Kollegiyaya"],"e":"Maddə 15.4. Fərqə diqqət: 15.2-də bilavasitə rəhbər, 15.4-də gömrük orqanının rəhbəri."},{"d":2,"c":2,"id":"etik-53","r":"Bənd 15.5","q":"Vəzifəli şəxsin yaxın qohumları ilə bağlı hansı məhdudiyyət var?","o":["Bilavasitə onun tabeliyində olan heç bir vəzifə tuta bilməzlər","Eyni gömrük orqanında işləyə bilməzlər","Gömrük orqanlarına qəbul edilə bilməzlər","Məhdudiyyət yoxdur"],"e":"Maddə 15.5."},{"d":2,"c":2,"id":"etik-54","r":"Bənd 16","q":"Xidməti əmlakdan istifadə ilə bağlı hansı fikir DOĞRUDUR?","o":["Xidməti nəqliyyat və kommunikasiya sistemlərindən şəxsi maraqlar və xidmətlə əlaqəsi olmayan məqsədlər üçün istifadə qadağandır","Rəhbərin icazəsi ilə şəxsi məqsədlər üçün istifadə edilə bilər","İş vaxtından kənar istifadə sərbəstdir","Yalnız maliyyə vəsaitlərinin şəxsi istifadəsi qadağandır"],"e":"Maddə 16."},{"d":2,"c":2,"id":"etik-55","r":"Bənd 17.2","q":"Şifrələrlə bağlı əməkdaşın vəzifəsi hansıdır?","o":["Öz şifrələrini başqalarına verməməli və başqalarının şifrələrindən istifadə etməməli","Şifrələri yalnız rəhbərinə verə bilər","Şifrəni hər ay dəyişməli","Ümumi şəbəkəyə qoşulmayan cihazlarda şifrə qaydaları tətbiq olunmur"],"e":"Maddə 17.2."},{"d":2,"c":2,"id":"etik-56","r":"Bənd 17.3","q":"17.2-ci bənddəki məlumatların məxfiliyi pozulduqda nə edilməlidir?","o":["Dərhal bilavasitə və ya yuxarı rəhbərə məlumat verilməli və həmin şifrənin istifadəsi dayandırılmalıdır","24 saat ərzində etik davranış üzrə məsul şəxsə məlumat verilməlidir","Yalnız şifrə dəyişdirilməlidir","Daxili təhlükəsizlik bölməsinə yazılı şikayət verilməlidir"],"e":"Maddə 17.3."},{"d":2,"c":2,"id":"etik-57","r":"Bənd 17.4","q":"17.4-cü bəndə görə əməkdaş hansı şifrələrdən istifadə etməməlidir?","o":["Gömrük orqanlarının məxfi rejimdə xarici ticarət iştirakçılarına təqdim etdiyi şifrələrdən (parollardan)","Öz xidməti şifrəsindən","Ümumi istifadəli Wi-Fi şifrələrindən","Rəhbərin verdiyi şifrələrdən"],"e":"Maddə 17.4: həmçinin ona məlum olan kommersiya sirrini qorumalıdır."},{"d":2,"c":2,"id":"etik-58","r":"Bənd 17.5","q":"Açıq informasiyanın əldə olunması və yayılması hansı Qanuna əsasən təmin edilir?","o":["“İnformasiya əldə etmək haqqında” 30 sentyabr 2005-ci il tarixli 1024-IIQ nömrəli Qanun","“İnformasiya, informasiyalaşdırma və informasiyanın mühafizəsi haqqında” Qanun","“Dövlət qulluqçularının etik davranış qaydaları haqqında” 352-IIIQ nömrəli Qanun","“Kütləvi informasiya vasitələri haqqında” Qanun"],"e":"Maddə 17.5.","t":1},{"d":2,"c":2,"id":"etik-59","r":"Bənd 17.6","q":"Gömrük orqanlarının fəaliyyəti barədə məlumatları media subyektlərinə vermək üçün nə tələb olunur?","o":["Bilavasitə və ya yuxarı rəhbərin icazəsi","Etik davranış üzrə məsul şəxsin rəyi","Kollegiyanın qərarı","Heç bir icazə tələb olunmur"],"e":"Maddə 17.6."},{"d":2,"c":2,"id":"etik-60","r":"Bənd 18.1","q":"Əməkdaş hansı istisna ilə seçkili və ya digər təyinatlı vəzifə tuta bilər?","o":["Həmkarlar ittifaqları","Bələdiyyələr","İctimai birliklər","Dini təşkilatlar"],"e":"Maddə 18.1: həmkarlar ittifaqları istisna olmaqla heç bir seçkili və ya təyinatlı vəzifə tuta, siyasi fəaliyyətlə məşğul ola bilməz."},{"d":2,"c":2,"id":"etik-61","r":"Bənd 18.2","q":"Aşağıdakılardan hansı 18.2-ci bəndə görə əməkdaşa QADAĞAN DEYİL?","o":["Həmkarlar təşkilatında birləşmək","Siyasi partiyaya üzv olmaq","Siyasi aksiyada iştirak etmək","Siyasi partiyaya maddi dəstək vermək"],"e":"Həmkarlar təşkilatında birləşmək 18.3-ə görə hüquqdur. Qalanları 18.2 ilə qadağandır."},{"d":2,"c":2,"id":"etik-62","r":"Bənd 18.3","q":"18.3-cü bəndə görə əməkdaşın hansı hüququ var?","o":["Qanunvericiliklə başqa qayda nəzərdə tutulmayıbsa, ictimai birliyə üzv olmaq, o cümlədən həmkarlar təşkilatında birləşmək","Siyasi partiyaya üzv olmaq","Dini təşkilata üzv olmaq","Gömrük orqanında ictimai birliyin bölməsini yaratmaq"],"e":"Maddə 18.3 (mavi ilə rənglənib).","hl":1},{"d":2,"c":2,"id":"etik-63","r":"Bənd 18.4","q":"Gömrük orqanlarında hansı birliyin struktur bölməsini yaratmaq QADAĞAN DEYİL?","o":["Həmkarlar ittifaqının","Siyasi partiyanın","Dini təşkilatın","İctimai birliyin"],"e":"Maddə 18.4: həmkarlar ittifaqları istisna olmaqla ictimai və siyasi birliklərin, dini təşkilatların struktur bölmələrini yaratmaq qadağandır."},{"d":2,"c":2,"id":"etik-64","r":"Bənd 19.1","q":"Zorakılıq və qısnama qadağası hansı münasibətlərə aiddir?","o":["Xidməti və ya xidmətdənkənar münasibətlərdən asılı olmayaraq","Yalnız xidməti münasibətlərə","Yalnız vətəndaşlarla münasibətlərə","Yalnız tabelikdə olan işçilərə"],"e":"Maddə 19.1."},{"d":2,"c":2,"id":"etik-65","r":"Bənd 19.3","q":"Kodeksə görə seksual qısnama hansı formalarda təzahür edə bilər?","o":["Fiziki hərəkətlər, ədəbsiz sözlər, jestlər, hədələr, ləkələyici təkliflər və ya dəvətlər","Yalnız fiziki hərəkətlər","Yalnız yazılı mesajlar","Yalnız hədələr"],"e":"Maddə 19.3: əməkdaş belə davranışa yol verməməli, təhrik etməməli, üçüncü şəxslərin buna yol verməsinə şərait yaratmamalıdır."},{"d":2,"c":2,"id":"etik-66","r":"Bənd 19.4","q":"Əməkdaş ona qarşı zorakılıq və qısnama halları barədə kimə məlumat verməlidir?","o":["Bilavasitə və ya yuxarı rəhbərinə","Yalnız polisə","Yalnız etik davranış üzrə məsul şəxsə","Mediaya"],"e":"Maddə 19.4."},{"d":2,"c":2,"id":"etik-67","r":"Bənd 19.5","q":"Qısnamaya görə şikayət etmiş əməkdaşla bağlı Kodeks nəyi təmin edir?","o":["Ona təzyiq göstərilməsinə və ya onun təqib olunmasına yol verilmir","Onu avtomatik başqa vəzifəyə keçirir","Ona maddi kompensasiya ödəyir","Şikayəti məxfi saxlamır"],"e":"Maddə 19.5."},{"d":2,"c":2,"id":"etik-68","r":"Bənd 20.1","q":"Vətəndaşları qəbul edərkən əməkdaş nə etməlidir?","o":["Diqqətlə dinləməli, hüquq və vəzifələrini izah etməli, problemin həlli yolunu göstərməli","Müraciəti yazılı formada qəbul edib cavab gözləməyi tövsiyə etməli","Yalnız rəhbərin qəbul saatlarını bildirməli","Vətəndaşı hüquqşünasa yönləndirməli"],"e":"Maddə 20.1."},{"d":2,"c":2,"id":"etik-69","r":"Bənd 20.2","q":"Vətəndaşlarla ünsiyyətdə əməkdaş nəyə yol verməməli və nəyə çalışmalıdır?","o":["Süründürməçiliyə yol verməməli; gömrük orqanlarına etimadın möhkəmləndirilməsinə çalışmalı","Tənqidə yol verməməli; gömrük ödənişlərinin artırılmasına çalışmalı","Şikayətlərə yol verməməli; tez cavab verməyə çalışmalı","Mübahisəyə yol verməməli; ünsiyyəti qısaltmağa çalışmalı"],"e":"Maddə 20.2 (bənövşəyi).","hl":1},{"d":2,"c":2,"id":"etik-70","r":"Bənd 20.4","q":"Vətəndaşlarla ünsiyyətə zərurət yarandıqda, qanunla nəzərdə tutulmuş hallar istisna olmaqla, ünsiyyət harada aparılmalıdır?","o":["Üstünlük gömrük orqanlarının inzibati binasına verilməlidir","Vətəndaşın yaşayış yerində","İctimai iaşə obyektlərində","Telefonla"],"e":"Maddə 20.4."},{"d":2,"c":2,"id":"etik-71","r":"Bənd 21.2","q":"Həmkarların işindəki nöqsanlara münasibət nəyi ehtiva etməlidir?","o":["Obyektiv yanaşma ilə hörmət, dözümlülük, təmkinlilik və nəzakətlilik","Dərhal rəhbərə yazılı məlumat","Açıq tənqid","Susmaq və müdaxilə etməmək"],"e":"Maddə 21.2."},{"d":2,"c":2,"id":"etik-72","r":"Bənd 21.4","q":"Rəhbərliklə münasibətlərdə əməkdaş nəyə riayət etməlidir, tabeliyindəki işçilərə münasibətdə isə nəyi nümayiş etdirməməlidir?","o":["Subordinasiyaya və tabelik qaydalarına riayət etməli; vəzifə səlahiyyətlərindən irəli gələn üstünlüyünü nümayiş etdirməməli","Rəhbərə şəxsi sədaqət göstərməli; tələbkarlıq nümayiş etdirməməli","Rəhbərlə bərabərhüquqlu davranmalı; nəzakət nümayiş etdirməməli","Rəhbəri tənqid etməli; qayğı nümayiş etdirməməli"],"e":"Maddə 21.4."},{"d":2,"c":2,"id":"etik-73","r":"Bənd 22.3","q":"Digər dövlət orqanları ilə münasibətlərdə əməkdaşa nə yasaqdır?","o":["Ona verilmiş imtiyaz və səlahiyyətləri nümayiş etdirmək və əməkdaşlıqdan şəxsi məqsədlər üçün istifadə etmək","Onlarla əməkdaşlıq etmək","Onlara məlumat sorğusu göndərmək","Birgə tədbirlərdə iştirak etmək"],"e":"Maddə 22.3."},{"d":2,"c":2,"id":"etik-74","r":"Bənd 23.2","q":"Əməkdaşın mediada çıxışları nə ilə razılaşdırılmalıdır?","o":["Gömrük orqanlarının həmin sahə ilə bağlı fəaliyyəti həyata keçirən struktur bölmələri ilə","Etik davranış üzrə məsul şəxslə","Kollegiya ilə","Ədliyyə Nazirliyi ilə"],"e":"Maddə 23.2: çıxışlar gömrük orqanlarının mövqeyini əks etdirdiyi üçün etibarlı və balanslaşdırılmış olmalıdır."},{"d":2,"c":2,"id":"etik-75","r":"Bənd 23.2","q":"Mediadakı çıxışlar dil baxımından hansı normalara uyğun olmalıdır?","o":["Azərbaycan dilinin leksik, qrammatik və fonetik normalarına","Yalnız orfoqrafiya normalarına","Rəsmi-işgüzar üslubun normalarına","Beynəlxalq jurnalistika standartlarına"],"e":"Maddə 23.2: aydın, səlis və lakonik olmaqla."},{"d":2,"c":2,"id":"etik-76","r":"Bənd 23.3","q":"23.3-cü bənddə mediada çıxış zamanı neçə qayda sadalanır?","o":["3","4","2","5"],"e":"23.3.1–23.3.3: səlahiyyətə aid olmayan məsələlər və məxfi məlumatlar; ayrı-seçkilik və ədavət ifadə edən çıxışlar; risklərin nəzərə alınması və sözlərin düzgün seçilməsi.","t":1},{"d":2,"c":2,"id":"etik-77","r":"Bənd 24.1","q":"Əməkdaş digər dövlətlərin gömrük orqanları və beynəlxalq təşkilatlarla əməkdaşlıqda hansı şərtlə iştirak edir?","o":["Vəzifələrinin icrasından irəli gəldiyi hallarda və bilavasitə rəhbərinin göstərişi ilə","Öz təşəbbüsü ilə","Yalnız DGK sədrinin əmri ilə","Yalnız Xarici İşlər Nazirliyinin razılığı ilə"],"e":"Maddə 24.1."},{"d":2,"c":2,"id":"etik-78","r":"Bənd 24.2","q":"Xarici ölkəyə ezam olunan əməkdaş nəyə riayət etməlidir?","o":["Ezamiyyə məqsədlərinə, tədbirin proqramına, işgüzar geyim qaydalarına, həmin ölkənin adət-ənənələrinə və əxlaq qaydalarına","Yalnız tədbirin proqramına","Yalnız Azərbaycanın milli adətlərinə","Yalnız nümayəndə heyətinin rəhbərinin göstərişlərinə"],"e":"Maddə 24.2."},{"d":2,"c":3,"id":"etik-79","r":"Bənd 25.1","q":"25.1-ci bənddə xidməti davranışa dair neçə tələb var?","o":["10","8","9","12"],"e":"25.1.1–25.1.10.","t":1},{"d":2,"c":3,"id":"etik-80","r":"Bənd 25.1.2","q":"Fövqəladə hallar baş verdikdə əməkdaş xidmət yerinə necə gəlməlidir?","o":["Çağırışsız","Bilavasitə rəhbərin ilk çağırışı ilə","Növbə qrafikinə uyğun","Yalnız yazılı əmr olduqda"],"e":"Maddə 25.1.2: adi halda rəhbərin ilk çağırışı ilə, fövqəladə hallarda isə çağırışsız gəlməlidir."},{"d":2,"c":3,"id":"etik-81","r":"Bənd 25.1.2","q":"Əməkdaş bilavasitə rəhbərinin icazəsi olmadan xidmət yerini hansı halda tərk edə bilər?","o":["Fövqəladə hallarda","Nahar fasiləsində","İş günü bitməyə 1 saat qalmış","Heç bir halda"],"e":"Maddə 25.1.2: fövqəladə hallar istisna olmaqla."},{"d":2,"c":3,"id":"etik-82","r":"Bənd 25.1.4","q":"Xidməti icraat zamanı əməkdaş hansı məlumatları açıqlamaya bilər?","o":["Araşdırma ilə əlaqədar məxfi məlumatları","Şəxsi həyatına aid bütün məlumatları","Həmkarlarına aid məlumatları","Heç bir istisna yoxdur"],"e":"Maddə 25.1.4: sualları tam və səmimi cavablandırmalı, araşdırma ilə əlaqədar məxfi məlumatlar istisna olmaqla bildiklərini açıqlamalıdır."},{"d":2,"c":3,"id":"etik-83","r":"Bənd 25.1.6","q":"Əməkdaş hansı məsələlər barədə açıqlama verməməlidir?","o":["Müzakirə mərhələsində olan və qərar qəbul edilməmiş məsələlər","Artıq qəbul edilmiş qərarlar","Gömrük orqanının rəsmi saytında dərc olunmuş məlumatlar","Ümumi gömrük statistikası"],"e":"Maddə 25.1.6."},{"d":2,"c":3,"id":"etik-84","r":"Bənd 25.1.7","q":"Əməkdaş hansı şəxslərlə xidməti zərurətlə bağlı olmayan əlaqələr qurmamalıdır?","o":["Müəmmalı həyat tərzi keçirən, qaçaqmalçılığa görə məhkum olunmuş və mütəmadi belə işlərlə məşğul olan şəxslərlə","Xarici ticarət iştirakçıları ilə","Digər hüquq mühafizə orqanlarının əməkdaşları ilə","Jurnalistlərlə"],"e":"Maddə 25.1.7."},{"d":2,"c":3,"id":"etik-85","r":"Bənd 25.1.8","q":"Anket məlumatlarında dəyişiklik baş verdikdə əməkdaş nə etməlidir?","o":["Dərhal xidmət etdiyi orqanın rəhbərini məlumatlandırmalı","Növbəti attestasiyada bildirməli","İl sonunda kadrlar bölməsinə bildirməli","Yalnız ailə vəziyyəti dəyişdikdə bildirməli"],"e":"Maddə 25.1.8: özü və ailə üzvləri haqqında məlumatları düzgün göstərməli, heç bir faktı gizlətməməlidir."},{"d":2,"c":3,"id":"etik-86","r":"Bənd 25.1.10","q":"25.1-ci bəndin sonuncu tələbi nədir?","o":["Hərbi salamlaşma qaydalarına riayət etmək","Xidməti geyim formasını səliqəli daşımaq","Anket məlumatlarını düzgün göstərmək","Xidməti icraatda səmimi olmaq"],"e":"Maddə 25.1.10. Geyim forması 25.1.9-dadır."},{"d":2,"c":3,"id":"etik-87","r":"Bənd 26.2","q":"Xidmətdənkənar davranışa görə əməkdaş iş vaxtından kənar ictimai yerlərdə nəyə məhdudiyyət qoymalıdır?","o":["Xüsusi geyim formasından istifadəyə","Xarici dildə danışmağa","Sosial şəbəkələrdən istifadəyə","Şəxsi avtomobildən istifadəyə"],"e":"Maddə 26.2: həmçinin forma, silah və əmlakı nümayiş etdirməklə şəxslərə qanunsuz təsir göstərməməlidir."},{"d":2,"c":3,"id":"etik-88","r":"Bənd 26.3","q":"Əməkdaş Əmək Məcəlləsinin hansı maddəsində göstərilən əmək vəzifələrinin kobud pozulması hallarına yol verməməlidir?","o":["72-ci maddəsi","70-ci maddəsi","68-ci maddəsi","53-cü maddəsi"],"e":"Maddə 26.3.","t":1},{"d":2,"c":3,"id":"etik-89","r":"Bənd 27","q":"Dini fəaliyyətlə bağlı hansı fikir YANLIŞDIR?","o":["Əməkdaş öz dini mənsubiyyətini açıq şəkildə təbliğ edə bilər","Əməkdaşın dinə etiqadını sərbəst müəyyən etmək hüququ var","Əməkdaş hər hansı dini təşkilatın üzvü olmamalıdır","Əməkdaş həmkarlarını dini təşkilatın fəaliyyətinə təhrik etməməlidir"],"e":"Maddə 27.3: dini mənsubiyyətini açıq şəkildə təbliğ etməməlidir."},{"d":2,"c":3,"id":"etik-90","r":"Bənd 27.4.1","q":"Dini təşkilatlarla bağlı əməkdaşa nə qadağandır?","o":["Üzv olmaq, onlara maddi və ya digər dəstək vermək və belə dəstək almaq","Dini ayinləri icra etmək","Dini mərasimlərdə iştirak etmək","Dinə etiqad etmək"],"e":"Maddə 27.4.1. Ayin və mərasimlərdə iştirak qadağan deyil, yalnız ictimai qaydanı pozmamalıdır (27.4.4)."},{"d":2,"c":3,"id":"etik-91","r":"Bənd 28","q":"Elmi, pedaqoji və ya yaradıcılıq fəaliyyəti Kodeksə görə nədir?","o":["Əməkdaşın hüququ; xidməti vəzifəyə mane olmamaq və məxfi məlumatları açıqlamamaq şərti ilə","Rəhbərin icazəsi ilə mümkün olan istisna","Qadağandır","Yalnız iş vaxtından kənar mümkündür, icazə ilə"],"e":"Maddə 28.1–28.2."},{"d":2,"c":3,"id":"etik-92","r":"Bənd 29.2","q":"Sosial mediada nə qadağandır?","o":["Gömrük orqanlarına məxsus elektron poçt ünvanlarından fərdi sosial media hesablarının yaradılması və ya şəxsi kommunikasiya üçün istifadə","Şəxsi sosial media hesabının olması","Real adla hesab açmaq","Ailə fotolarını paylaşmaq"],"e":"Maddə 29.2."},{"d":2,"c":3,"id":"etik-93","r":"Bənd 29.3.1","q":"Fərdi sosial media hesablarında aşağıdakılardan hansını paylaşmaq OLMAZ?","o":["Xüsusi geyim formasında və xidmət yerinə aid foto və ya videogörüntüləri","Ailə tədbirlərinə aid fotoları","İdman fəaliyyəti ilə bağlı paylaşımları","Səyahət fotolarını"],"e":"Maddə 29.3.1: həmçinin rəmz və emblemlərdən istifadə və gündəlik iş prosesinə aid məlumatların yayılması qadağandır."},{"d":2,"c":3,"id":"etik-94","r":"Bənd 29.3.2","q":"Gömrük orqanlarının fəaliyyətinə aid sosial mediada paylaşılan məlumatlar hansı həddi aşmamalıdır?","o":["Orqanın rəsmi veb-saytında və rəsmi sosial media platformalarında paylaşılan məlumatlardan artıq olmamalı","Rəhbərin icazə verdiyi həcmi","Gündə bir paylaşımı","Heç bir məhdudiyyət yoxdur"],"e":"Maddə 29.3.2: iş yeri və vəzifə barədə detallı məlumat qeyd olunmamalıdır."},{"d":2,"c":3,"id":"etik-95","r":"Bənd 29.3.3","q":"29.3.3-cü bəndə görə əməkdaş ayrı-seçkilik ifadə edən paylaşımlarla bağlı nə etməməlidir?","o":["Paylaşmamalı, belə paylaşım və şərhləri bəyənməməli və şərh yazmamalı","Yalnız paylaşmamalı, bəyənmək olar","Yalnız şərh yazmamalı","Yalnız iş vaxtında paylaşmamalı"],"e":"Maddə 29.3.3."},{"d":2,"c":4,"id":"etik-96","r":"Bənd 30.1","q":"Etik davranış qaydalarına riayətə nəzarətin neçə forması var və onlar hansılardır?","o":["2: cari nəzarət və ümumi nəzarət","3: cari, ümumi və xüsusi nəzarət","2: daxili və xarici nəzarət","3: ilkin, cari və sonrakı nəzarət"],"e":"Maddə 30.1.","t":1},{"d":2,"c":4,"id":"etik-97","r":"Bənd 30.2","q":"Cari nəzarəti kimlər həyata keçirir?","o":["Bilavasitə rəhbərlər, gömrük orqanlarının rəhbərləri və Komitənin daxili təhlükəsizlik sahəsində təşkilati və nəzarət funksiyalarını həyata keçirən struktur bölməsi","Yalnız etik davranış üzrə məsul şəxs","Kollegiya","İnsan resursları bölməsi"],"e":"Maddə 30.2 (qırmızı).","hl":1},{"d":2,"c":4,"id":"etik-98","r":"Bənd 30.3, 32.1","q":"Ümumi nəzarəti kim həyata keçirir və o, kimdir?","o":["Etik davranış üzrə məsul şəxs: insan resursları sahəsində funksiyaları həyata keçirən struktur bölmənin (Kadrlar) rəhbəri","Daxili təhlükəsizlik bölməsinin rəhbəri","DGK sədrinin birinci müavini","Hüquqi Təminat İdarəsinin rəisi"],"e":"Maddə 30.3 (qırmızı, yanında “Kadrlar” qeydi) və 32.1.","hl":1},{"d":2,"c":4,"id":"etik-99","r":"Bənd 31.1.4","q":"Bilavasitə rəhbərlər və gömrük orqanlarının rəhbərləri görülmüş tədbirlər barədə etik davranış üzrə məsul şəxsə hansı tarixə qədər məlumat verməlidir?","o":["Hər il yanvarın 31-dən gec olmayaraq","Hər il fevralın 20-dək","Hər rübün sonunda","Hər il dekabrın 31-dək"],"e":"Maddə 31.1.4. 20 fevral isə məsul şəxsin sədrə hesabat müddətidir (32.3.9).","hl":1,"t":1},{"d":2,"c":4,"id":"etik-100","r":"Bənd 32.3.9","q":"Etik davranış üzrə məsul şəxs il ərzində görülmüş tədbirlər barədə hesabatı kimə və nə vaxt təqdim edir?","o":["Komitə sədrinə, növbəti ilin fevral ayının 20-dək","Kollegiyaya, yanvarın 31-dək","Prezidentə, martın 1-dək","Daxili təhlükəsizlik bölməsinə, fevralın 20-dək"],"e":"Maddə 32.3.9.","hl":1,"t":1},{"d":2,"c":4,"id":"etik-101","r":"Bənd 31.1","q":"31.1-ci bənddə cari nəzarət üzrə rəhbərlərin neçə tədbiri sadalanır?","o":["12","10","11","6"],"e":"31.1.1–31.1.12.","t":1},{"d":2,"c":4,"id":"etik-102","r":"Bənd 31.1","q":"Aşağıdakılardan hansı bilavasitə rəhbərin cari nəzarət üzrə vəzifəsi DEYİL?","o":["Etik davranış qaydalarına dair təlim proqramları hazırlamaq","Tabeliyində olanların xidməti davranışına gündəlik nəzarət etmək","Şəxsi münasibətlər zəminində kadr təkliflərinə yol verməmək","Pozuntuya görə intizam tənbehi ilə bağlı məsələ qaldırmaq"],"e":"Təlim proqramlarını məsul şəxs hazırlayır (32.3.3). Qalanları 31.1.1, 31.1.7 və 31.1.10-dadır."},{"d":2,"c":4,"id":"etik-103","r":"Bənd 31.2","q":"Kodeksin pozulması barədə müraciət və şikayətləri cari nəzarət çərçivəsində kim qəbul edir və araşdırır?","o":["Komitənin daxili təhlükəsizlik sahəsində funksiyaları həyata keçirən struktur bölməsi","Bilavasitə rəhbər","Hüquqi Təminat İdarəsi","Kollegiya"],"e":"Maddə 31.2.1–31.2.2."},{"d":2,"c":4,"id":"etik-104","r":"Bənd 31.2.3","q":"Pozuntu faktı müəyyən olunduqda daxili təhlükəsizlik bölməsi intizam tənbehinin növü ilə bağlı kimin rəyini alır?","o":["Etik davranış məsələləri üzrə məsul şəxsin","Bilavasitə rəhbərin","Hüquqi Təminat İdarəsinin","Həmkarlar ittifaqının"],"e":"Maddə 31.2.3: sonra rəhbər vəzifəli şəxs qarşısında vəsatət qaldırır."},{"d":2,"c":4,"id":"etik-105","r":"Bənd 31.2.6","q":"İntizam icraatı zamanı cinayət xarakterli hüquqpozma əlamətləri aşkar edildikdə daxili təhlükəsizlik bölməsi nə edir?","o":["Toplanmış materialların "Etik davranış üzrə məsul şəxsə","Prokurorluğa"],"e":"Maddə 33.2: əməkdaş dərhal bilavasitə rəhbərinə məlumat verir, sübutlar toplanıb sənədləşdirilir."},{"d":2,"c":4,"id":"etik-112","r":"Bənd 33.4","q":"Qəsdə məruz qalmış əməkdaşın təhqiqat, istintaq və məhkəmədə iştirakı ilə bağlı xərcləri kim ödəyir?","o":["Gömrük orqanları","Əməkdaşın özü","Qəsd edən şəxs","Dövlət hüquqi yardım fondu"],"e":"Maddə 33.4: həmçinin hüquqi yardım göstərilir."},{"d":2,"c":4,"id":"etik-113","r":"Bənd 34.1","q":"Etik davranış qaydalarının pozulması nə üçün əsasdır?","o":["İntizam məsuliyyətinə cəlb edilmək üçün","Cinayət məsuliyyətinə cəlb edilmək üçün","Dərhal xidmətdən xaric edilmək üçün","İnzibati cərimə üçün"],"e":"Maddə 34.1."},{"d":2,"c":4,"id":"etik-114","r":"Bənd 34.2","q":"İntizam məsuliyyətinə cəlb etmə hansı aktlarla nəzərdə tutulmuş qaydada və müddətdə həyata keçirilir?","o":["1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunla təsdiq edilmiş “Gömrük orqanlarında xidmət haqqında” Əsasnamə və Əmək Məcəlləsi","Yalnız bu Kodeks","“Dövlət qulluqçularının etik davranış qaydaları haqqında” Qanun və Gömrük Məcəlləsi","646 nömrəli Fərmanla təsdiq edilmiş DGK haqqında Əsasnamə"],"e":"Maddə 34.2. Buna görə tənbeh müddətləri 768-IQ Əsasnamənin 72–73-cü maddələrinə tabedir.","t":1},{"d":2,"c":5,"id":"etik-rq0","r":"Bənd 5.1","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən “Fiziki və hüquqi şəxslərin, cəmiyyətin və dövlətin maraqları naminə gömrük orqanı əməkdaşı öz xidməti vəzifələrini səmərəli və ədalətlə yerinə yetirməyə borcludur.” fikri hansı etik davranış qaydasının məzmununu təşkil edir?","o":["Vicdanlı davranış","Dürüstlük","Qərəzsizlik","Peşəkarlıq və fərdi məsuliyyətin artırılması"],"e":"Bənd 5.1 (Vicdanlı davranış).","ex":1},{"d":2,"c":5,"id":"etik-rq1","r":"Bənd 6","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən “Gömrük orqanı əməkdaşı öz vəzifələrini qanunvericiliyin tələblərini və bu Kodeks ilə müəyyən edilmiş etik davranış qaydalarını rəhbər tutmaqla icra etməli, həmkarları və digər şəxslərlə münasibətlərdə səmimi olmalı, həqiqəti söyləməklə riyakarlıqdan qaçmalı, qanuni və ədalətli qərar və hərəkətləri ilə düzgün mövqe nümayiş etdirməlidir.” fikri hansı etik davranış qaydasının məzmununu təşkil edir?","o":["Dürüstlük","Vicdanlı davranış","Loyallıq","Mədəni davranış"],"e":"Bənd 6 (Dürüstlük).","ex":1},{"d":2,"c":5,"id":"etik-rq2","r":"Bənd 10","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən aşağıdakılardan hansı “Loyallıq” etik davranış qaydasının məzmununa aiddir?","o":["Gömrük orqanı əməkdaşı ona xüsusi səlahiyyət verilmiş hallar istisna olmaqla açıq çıxışlar etməkdən çəkinməlidir","Gömrük orqanı əməkdaşı gömrük orqanlarının nüfuzunu, öz adını və şərəfini uca tutmağa borcludur","Gömrük orqanı əməkdaşı bütün hallarda cəmiyyət üçün vicdanlılıq nümunəsi olmalıdır","Gömrük orqanı əməkdaşı özünün bilik və bacarıqlarını daim inkişaf etdirməlidir"],"e":"Bənd 10.2 (Loyallıq). Digərləri: ictimai etimad (8.1), vicdanlı davranış (5.2), peşəkarlıq (12.2).","ex":1},{"d":2,"c":5,"id":"etik-rq3","r":"Bənd 13","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən aşağıdakılardan hansı “Korrupsiyanın qarşısının alınması” etik davranış qaydasının məzmununa aiddir?","o":["Tərəflərdən birinin gömrük orqanı olduğu əqdlər üzrə gömrük orqanı əməkdaşı digər tərəf ola bilməz","Gömrük orqanı əməkdaşı həmkarları ilə qarşılıqlı hörmətə əsaslanan münasibət qurmalıdır","Gömrük orqanı əməkdaşı xidməti geyim formasını səliqəli daşımalıdır","Gömrük orqanı əməkdaşı hərbi salamlaşma qaydalarına riayət etməlidir"],"e":"Bənd 13.4 (Korrupsiyanın qarşısının alınması). 13.2: qanunsuz nemət təklif olunduqda imtina etməlidir; 13.3: ondan asılı olmayan səbəblərdən verildikdə səlahiyyətli struktur bölməyə məlumat verməlidir.","ex":1},{"d":2,"c":5,"id":"etik-rq4","r":"Bənd 26","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən aşağıdakılardan hansı gömrük orqanı əməkdaşının xidmətdənkənar davranışının xüsusiyyətlərinə aiddir?","o":["Şəxsi həyatında ümumi qəbul edilmiş milli əxlaq, ictimai davranış normalarına əməl etməli və xidmətdənkənar davranışı peşə nüfuzuna xələl gətirməməlidir","Hərbi salamlaşma qaydalarına riayət etməlidir","Gündəlik iş və ya növbə qrafikinə ciddi riayət etməlidir","Anket məlumatlarında özü və ailə üzvləri haqqında məlumatları düzgün göstərməlidir"],"e":"Bənd 26.1. Digər variantlar xidməti davranışa aid tələblərdir (25.1).","ex":1},{"d":2,"c":5,"id":"etik-rq5","r":"Bənd 15","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən aşağıdakılardan hansı “Maraqların toqquşmasının qarşısının alınması” etik davranış qaydasının məzmununa aiddir?","o":["Xidməti vəzifələri ilə şəxsi maraqları arasında ziddiyyət yarana biləcəyi hallarda həmin maraqların xarakteri barədə bilavasitə rəhbərinə məlumat verməyə borcludur","Siyasi partiyalara üzv olmamalıdır","Dövlət sirrinin qorunmasına cavabdehdir","Dini təşkilatların yaradılmasına yardım etməməlidir"],"e":"Bənd 15.2. Struktur bölmənin rəhbəri 15.3-dəki tədbirləri görür; başqa vəzifəyə keçirilmə təklifləri ilə bağlı isə gömrük orqanının rəhbərinə məlumat verilir (15.4).","ex":1},{"d":2,"c":5,"id":"etik-rq6","r":"Bənd 30.2–30.3","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən gömrük orqanlarında etik davranış qaydalarına riayət olunmasına cari nəzarəti həyata keçirmir:","o":["Komitənin etik davranış məsələləri üzrə məsul şəxsi","Bilavasitə rəhbərlər","Gömrük orqanlarının rəhbərləri","Komitənin daxili təhlükəsizlik sahəsində təşkilati və nəzarət funksiyalarını həyata keçirən struktur bölməsi"],"e":"Bənd 30.2: cari nəzarət — bilavasitə rəhbərlər, gömrük orqanlarının rəhbərləri və daxili təhlükəsizlik bölməsi. Etik davranış üzrə məsul şəxs ümumi nəzarəti həyata keçirir (30.3).","ex":1},{"d":2,"c":5,"id":"etik-rq7","r":"Bənd 30.3, 32.1","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən gömrük orqanlarında etik davranış qaydalarına riayət olunmasına ümumi nəzarət həyata keçirilir?","o":["Etik davranış məsələləri üzrə məsul şəxs — Komitənin insan resursları sahəsində təşkilati və nəzarət funksiyalarını həyata keçirən struktur bölməsinin rəhbəri tərəfindən","Bilavasitə rəhbərlər tərəfindən","Komitənin Daxili Təhlükəsizlik İdarəsi tərəfindən","Komitə sədri tərəfindən şəxsən"],"e":"Bənd 30.3 və 32.1.","ex":1},{"d":2,"c":5,"id":"etik-rq8","r":"Bənd 31","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən Etik davranış qaydalarına əməl olunmasına cari nəzarətə aşağıdakılardan hansı aid deyil?","o":["Gömrük orqanı əməkdaşlarının etik davranış qaydalarının tətbiqi ilə bağlı təlim proqramlarını hazırlamaq","Tabeliyində olan əməkdaşların xidməti davranışlarının Kodeksə uyğunluğuna gündəlik nəzarət etmək","Tabeliyində olan əməkdaşlara etik davranış qaydalarını izah etmək","Kodeksin tələblərinin pozulması barədə müraciətləri və şikayətləri qəbul etmək"],"e":"Təlim proqramlarının hazırlanması ÜMUMİ nəzarət tədbiridir (32.3.3). Digərləri cari nəzarətə aiddir (31.1.1, 31.1.2, 31.2.1).","ex":1},{"d":2,"c":5,"id":"etik-rq9","r":"Bənd 32.3","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən Etik davranış qaydalarına əməl olunmasına ümumi nəzarət üzrə tədbirlərə aid deyil?","o":["Tabeliyində olan əməkdaşların xidməti davranışlarının Kodeksə uyğunluğuna gündəlik nəzarət etmək","Etik davranış qaydalarına dair izah vermək","Etik davranış məsələləri üzrə ictimai rəyi öyrənmək","Növbəti ilin fevral ayının 20-dək Komitə sədrinə hesabat təqdim etmək"],"e":"Gündəlik nəzarət cari nəzarət tədbiridir (31.1.1). Digərləri ümumi nəzarət tədbirləridir (32.3.4, 32.3.2, 32.3.9).","ex":1},{"d":2,"c":5,"id":"etik-rq10","r":"Bənd 34.1","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən etik davranış tələblərinin pozulmasına görə hansı məsuliyyət növü nəzərdə tutulmuşdur?","o":["İntizam məsuliyyəti","Cinayət məsuliyyəti","İnzibati məsuliyyət","Maddi məsuliyyət"],"e":"Bənd 34.1–34.2: intizam məsuliyyəti 768-IQ Əsasnamə və Əmək Məcəlləsinə uyğun tətbiq edilir.","ex":1},{"d":2,"c":5,"id":"etik-rq11","r":"Bənd 31.2","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən cari nəzarət üzrə Komitənin Daxili Təhlükəsizlik İdarəsi etik davranış qaydalarına əməl olunması məqsədilə aşağıdakı tədbirlərdən hansını həyata keçirmir?","o":["Gömrük orqanı əməkdaşlarının etik davranış qaydaları ilə bağlı təlim proqramlarını hazırlayır","Kodeksin tələblərinin pozulması barədə müraciətləri və şikayətləri qəbul edir","Kodeksin müddəalarının pozulması barədə daxil olmuş məlumatları araşdırır","Etik davranış qaydalarının təkmilləşdirilməsinə dair təkliflər verir"],"e":"Bənd 31.2: Daxili təhlükəsizlik bölməsinin tədbirləri. Təlim proqramlarını etik davranış üzrə məsul şəxs hazırlayır (32.3.3).","ex":1},{"d":2,"c":5,"id":"etik-rq12","r":"Bənd 26.3; ƏM 72","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən aşağıdakılardan hansı gömrük orqanı əməkdaşı tərəfindən Azərbaycan Respublikasının Əmək Məcəlləsi ilə müəyyən olunan əmək vəzifələrinin kobud şəkildə pozulması hallarına aid deyildir?","o":["İş gününə 15 dəqiqə gecikmək","Üzürlü səbəb olmadan bütün iş günü işə gəlməmək","Sərxoş vəziyyətdə işə gəlmək","Dövlət, kommersiya və ya vergi sirrini yaymaq"],"e":"Kodeksin 26.3-cü bəndi Əmək Məcəlləsinin 72-ci maddəsinə istinad edir. Gecikmə 72-ci maddədəki kobud pozuntular arasında yoxdur.","ex":1},{"d":2,"c":5,"id":"etik-rq13","r":"Bənd 27.4","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən dini fəaliyyətlə əlaqədar gömrük orqanı əməkdaşının əməl etməli olduğu qaydalara aid deyildir:","o":["Dini ayinlərdə və mərasimlərdə ümumiyyətlə iştirak etməmək","Hər hansı dini təşkilatın üzvü olmamaq","Həmkarlarını dini təşkilatın fəaliyyətində iştiraka təhrik etməmək","Dini təşkilatların yaradılmasına yardım etməmək"],"e":"Bənd 27.4.4: dini ayin və mərasimlərdə iştirak qadağan deyil, sadəcə ictimai qayda pozulmamalıdır.","ex":1},{"d":2,"c":5,"id":"etik-rq14","r":"Kollegiya Qərarı","q":"“Gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksi” hansı hüquqi aktla təsdiq edilmişdir?","o":["DGK Kollegiyasının 3 noyabr 2023-cü il tarixli 3-33/3-2-000001/2023 nömrəli Qərarı ilə","DGK Kollegiyasının 30 yanvar 2012-ci il tarixli 01/03 nömrəli Qərarı ilə","Nazirlər Kabinetinin qərarı ilə","Prezidentin 499 nömrəli Fərmanı ilə"],"e":"Kollegiya Qərarı, 03.11.2023. Bu qərarla 30.01.2012 tarixli 01/03 nömrəli qərar ləğv edilib.","ex":1},{"d":2,"c":5,"id":"etik-rq15","r":"Bənd 8.1","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksinə əsasən “Gömrük orqanı əməkdaşı Azərbaycan Respublikasının gömrük orqanlarının nüfuzunu, öz adını və şərəfini uca tutmağa borcludur.” fikri hansı etik davranış qaydasının məzmununu təşkil edir?","o":["İctimai etimad","Loyallıq","Dürüstlük","Vicdanlı davranış"],"e":"Bənd 8.1 (İctimai etimad).","ex":1},{"d":2,"c":5,"id":"etik-rq16","r":"Bənd 23.3","q":"Aşağıdakılardan hansı “Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksi”nə əsasən gömrük orqanı əməkdaşının mediada çıxış edərkən riayət etməli olduğu qaydalara aiddir?","o":["Onun səlahiyyətinə aid olmayan məsələlərlə bağlı rəsmi açıqlamalardan, mühakimələrdən və qiymətləndirmələrdən çəkinməli","Gömrük orqanlarının bütün daxili sənədlərini ictimaiyyətə açıqlamalı","Öz şəxsi siyasi baxışlarını ifadə etməli","Media ilə yalnız sosial şəbəkələr vasitəsilə əlaqə saxlamalı"],"e":"Bənd 23.3.1–23.3.3.","ex":1},{"d":2,"c":5,"id":"etik-rq17","r":"Bənd 15.4","q":"Azərbaycan Respublikası gömrük orqanlarının vəzifəli şəxslərinin Etik Davranış Kodeksi”nə əsasən gömrük orqanı əməkdaşı başqa vəzifəyə keçirilməsi ilə əlaqədar təkliflərin maraqların toqquşmasına səbəb ola biləcəyi hallarda bu barədə kimə (və ya hara) məlumat verməlidir?","o":["Gömrük orqanının rəhbərinə","Bilavasitə rəhbərinə","Komitənin Daxili Təhlükəsizlik İdarəsinə","Korrupsiyaya qarşı mübarizə üzrə Komissiyaya"],"e":"Bənd 15.4. Ümumi maraqlar toqquşmasında isə bilavasitə rəhbərə məlumat verilir (15.2).","ex":1},{"d":3,"c":0,"id":"tarif-0","r":"Rekvizitlər","q":"“Gömrük tarifi haqqında” Qanun nə vaxt qəbul olunub və nömrəsi nədir?","o":["13 iyun 2013-cü il, № 687-IVQ","13 iyun 2013-cü il, № 678-IVQ","6 oktyabr 2013-cü il, № 687-IVQ","20 iyun 1995-ci il, № 1064"],"e":"Qanun 13.06.2013-də qəbul olunub, nömrəsi 687-IVQ-dir. 20.06.1995 tarixli 1064 nömrəli Qanun köhnə “Gömrük tarifi haqqında” Qanundur və ləğv edilib.","t":1},{"d":3,"c":0,"id":"tarif-1","r":"Rekvizitlər, 23.1","q":"Qanun nə vaxt qüvvəyə minib və bu, hansı qaydaya əsaslanır?","o":["06.10.2013; dərc edildiyi gündən 90 gün sonra","13.06.2013; imzalandığı gündən","01.01.2014; növbəti ilin əvvəlindən","06.10.2013; dərc edildiyi gündən 30 gün sonra"],"e":"Maddə 23.1: Qanun dərc edildiyi gündən 90 gün sonra qüvvəyə minir. Faktiki qüvvəyəminmə tarixi 06.10.2013-dür.","t":1},{"d":3,"c":0,"id":"tarif-2","r":"Preambula","q":"Qanunun preambulasına görə Qanun nəyi müəyyən edir?","o":["Gömrük tarifinin formalaşdırılması və tətbiqi, həmçinin gömrük sərhədindən keçirilən mallardan gömrük rüsumlarının tutulması qaydalarını","Bütün gömrük ödənişlərinin, o cümlədən ƏDV və aksizin hesablanmasını","Gömrük orqanlarının strukturunu və səlahiyyətlərini","Yalnız malların gömrük dəyərinin müəyyən edilməsini"],"e":"Preambula (xətt çəkilib).","hl":1},{"d":3,"c":1,"id":"tarif-3","r":"Maddə 1.1.1","q":"Qanuna görə “gömrük tarifi” nədir?","o":["Gömrük sərhədindən keçirilən mallara tətbiq edilən və XİF mal nomenklaturasına uyğun sistemləşdirilmiş gömrük rüsumu dərəcələrinin məcmusu","Malların gömrük dəyərinin müəyyən edilməsi qaydaları","Gömrük orqanlarının aldığı bütün ödənişlərin siyahısı","Gömrük rüsumlarından azadolmaların siyahısı"],"e":"Maddə 1.1.1 (xətt çəkilib).","hl":1},{"d":3,"c":1,"id":"tarif-4","r":"Maddə 1.1.2","q":"Qanuna görə “gömrük rüsumları” nədir?","o":["Malların gömrük ərazisinə gətirilməsi və bu ərazidən aparılması zamanı gömrük orqanlarının aldığı gömrük ödənişlərinin bir növü","Gömrük ödənişlərinin yeganə növü","Malların ölkə daxilində satışı zamanı tutulan vergi","Yalnız idxal zamanı alınan ödəniş"],"e":"Maddə 1.1.2 (xətt çəkilib): gömrük ödənişlərinin bir növüdür, yeganə növü deyil.","hl":1},{"d":3,"c":1,"id":"tarif-5","r":"Maddə 1.1.3","q":"XİF mal nomenklaturasını kim təsdiq edir və o, malları necə təsnif edir?","o":["Nazirlər Kabineti; qrup, mövqe, yardımçı mövqe və alt yardımçı mövqe üzrə rəqəm işarələri (kodlar) şəklində","DGK; yalnız qrup üzrə hərf kodları ilə","Prezident; mal adlarının əlifba sırası ilə","İqtisadiyyat Nazirliyi; yalnız mövqe üzrə"],"e":"Maddə 1.1.3 (xətt çəkilib).","hl":1},{"d":3,"c":1,"id":"tarif-6","r":"Maddə 1.1.4","q":"“Tarif kvotası (məhdudiyyət)” hansı tənzimləmə üsuludur?","o":["Müəyyən miqdara (dəyərə) qədər daha aşağı, ondan artıq hissəyə daha yüksək idxal rüsumunun tətbiqini nəzərdə tutan müddətli üsul","Müəyyən miqdardan artıq idxalın qadağan edilməsi","İxrac olunan mallara sabit rüsumun tətbiqi","Müddətsiz tətbiq olunan sıfır dərəcəli rüsum"],"e":"Maddə 1.1.4 (xətt çəkilib): müddətli tənzimlənmə üsulu.","hl":1},{"d":3,"c":1,"id":"tarif-7","r":"Maddə 1.1.5","q":"Qanuna görə malların gömrük dəyəri hansı rüsum dərəcəsinin tətbiqi məqsədilə müəyyən edilir?","o":["Advalor","Spesifik","Kombinə edilmiş","Mövsümi"],"e":"Maddə 1.1.5 (xətt çəkilib): advalor dərəcənin tətbiqi məqsədilə malların dəyərinin müəyyən edilməsi.","hl":1},{"d":3,"c":1,"id":"tarif-8","r":"Maddə 1.1.6–1.1.7","q":"“Eyni mallar” ilə “eynicinsli mallar” arasındakı fərq nədir?","o":["Eyni mallar bütün xüsusiyyətlərinə görə eynidir; eynicinsli mallar oxşar xüsusiyyətlərinə görə eyni funksiyanı yerinə yetirir və kommersiya baxımından əvəz oluna bilir","Eyni mallar eyni istehsalçıdan, eynicinsli mallar fərqli istehsalçıdan olur","Eyni mallar eyni ölkədən, eynicinsli mallar fərqli ölkələrdən olur","Fərq yoxdur, anlayışlar sinonimdir"],"e":"Maddə 1.1.6 və 1.1.7 (xətt çəkilib).","hl":1},{"d":3,"c":1,"id":"tarif-9","r":"Maddə 1.1.6","q":"Malları “eyni mallar” hesab etməyə nə mane olmur?","o":["Malların dəyərinə təsir etməyən kiçik fərqlər","Keyfiyyət fərqləri","Bazardakı nüfuz fərqi","Fiziki xassələrdəki əhəmiyyətli fərqlər"],"e":"Maddə 1.1.6: fiziki xassələr (dəyərə təsir etməyən kiçik fərqlər istisna olmaqla), keyfiyyət və bazardakı nüfuz daxil olmaqla, bütün xüsusiyyətlər eyni olmalıdır.","hl":1},{"d":3,"c":1,"id":"tarif-10","r":"Maddə 1.1.7","q":"Malların eynicinsliliyinin müəyyən edilməsində hansı amillər nəzərə alınır?","o":["Keyfiyyət, bazardakı nüfuz və əmtəə nişanının olması","Yalnız qiymət","Yalnız istehsal ölkəsi","Rəng və ölçü"],"e":"Maddə 1.1.7 (xətt çəkilib).","hl":1},{"d":3,"c":1,"id":"tarif-11","r":"Maddə 1.1.9","q":"Qanuna görə “istehsal” anlayışına nə daxildir?","o":["Yetişdirmə, hazırlama, hasil etmə","Yalnız sənaye emalı","Hazırlama və qablaşdırma","Yığma və təmir"],"e":"Maddə 1.1.9 (xətt çəkilib).","hl":1},{"d":3,"c":1,"id":"tarif-12","r":"Maddə 1.1.10–1.1.11","q":"“Birbaşa nəzarət” ilə “dolayı nəzarət” arasında fərq nədir?","o":["Birbaşa nəzarət müəssisənin siyasətini idarə etmək səlahiyyətidir; dolayı nəzarət qərarlara əhəmiyyətli təsir göstərir, lakin siyasət üzərində birbaşa nəzarəti təmin etmir","Birbaşa nəzarət 50%-dən çox pay, dolayı nəzarət 5%-dən çox paydır","Birbaşa nəzarət dövlət, dolayı nəzarət özəl müəssisələrə aiddir","Fərq yoxdur"],"e":"Maddə 1.1.10 və 1.1.11 (xətt çəkilib). Hər ikisində məqsəd mənfəət əldə etməkdir.","hl":1},{"d":3,"c":1,"id":"tarif-13","r":"Maddə 1.1.12–1.1.13","q":"Qanuna görə “alıcı” və “satıcı” kimdir?","o":["Alıcı Azərbaycana ixrac məqsədilə satılan malları alan, satıcı isə həmin malları satan şəxsdir","Alıcı Azərbaycandan ixrac edən şəxsdir","Alıcı və satıcı yalnız Azərbaycan rezidentləridir","Alıcı gömrük brokeri, satıcı istehsalçıdır"],"e":"Maddə 1.1.12 və 1.1.13 (xətt çəkilib).","hl":1},{"d":3,"c":1,"id":"tarif-14","r":"Maddə 1.1.14","q":"“Faktiki ödənilmiş və ya ödənilməli olan qiymət” nədir?","o":["İdxal edilən mallara görə alıcının satıcı üçün və ya onun xeyrinə həyata keçirdiyi və ya keçirməli olduğu tam ödəniş","Yalnız invoysda göstərilən məbləğ","Satıcının maya dəyəri","Gömrük rüsumu daxil olmaqla son qiymət"],"e":"Maddə 1.1.14 (xətt çəkilib).","hl":1},{"d":3,"c":1,"id":"tarif-15","r":"Maddə 1.1.15","q":"Sövdələşmə iştirakçıları neçə halda “əlaqəli şəxslər” hesab edilir?","o":["9","7","8","10"],"e":"Maddə 1.1.15 (rənglənib): 1.1.15.1–1.1.15.9. Söz “yalnız aşağıdakı hallarda”dır, yəni siyahı qapalıdır.","hl":1,"t":1},{"d":3,"c":1,"id":"tarif-16","r":"Maddə 1.1.15.4","q":"Hər hansı şəxs hər iki tərəfin nizamnamə kapitalındakı payının və ya səs hüququ verən səhmlərinin ən azı neçə faizinin sahibi olduqda onlar əlaqəli şəxs sayılır?","o":["5 faiz","10 faiz","25 faiz","50 faiz"],"e":"Maddə 1.1.15.4 (sarı və qırmızı ilə rənglənib): ən azı 5 (beş) faiz, birbaşa və ya dolayı yolla.","hl":1,"t":1},{"d":3,"c":1,"id":"tarif-17","r":"Maddə 1.1.15","q":"Aşağıdakılardan hansı 1.1.15-ci maddəyə görə şəxsləri əlaqəli ETMİR?","o":["Eyni şəhərdə qeydiyyatda olmaq","Biznesdə tərəfdaş olmaq","İşəgötürən və işçi olmaq","Yaxın qohum olmaq"],"e":"Maddə 1.1.15.1–1.1.15.9: vəzifəli şəxs, tərəfdaş, işəgötürən və işçi, 5% pay, nəzarətin üç forması, yaxın qohumluq, yeganə nümayəndə (distribüter, konsessioner). Eyni şəhərdə qeydiyyat siyahıda yoxdur.","hl":1},{"d":3,"c":1,"id":"tarif-18","r":"Maddə 1.1.15.9","q":"Yeganə distribüter hansı halda əlaqəli şəxs sayılır?","o":["Təqdim edilmə formasından asılı olmayaraq, yuxarıdakı
