üçün; altı ay: NK aktları üçün","İki ay: hər iki tapşırıq üçün"],"e":"Fərmanın 3.1 və 3.2-ci bəndləri: hər ikisi üç ay müddətində.","t":1},{"d":1,"c":0,"id":"dgk-5","r":"Fərman, 3.1–3.2","q":"Fərmanın 3.1 və 3.2-ci bəndlərindəki tapşırıqların fərqi nədir?","o":["3.1: Prezident aktları üzrə təklif hazırlayıb Prezidentə təqdim etmək; 3.2: NK aktlarını uyğunlaşdırıb Prezidentə məlumat vermək","3.1: NK aktlarını uyğunlaşdırmaq; 3.2: Prezident aktları üzrə təklif vermək","Hər ikisi Milli Məclisə məlumat verməyi nəzərdə tutur","3.1: DGK-nın aktları; 3.2: Gömrük Məcəlləsi"],"e":"Fərmanın 3.1 və 3.2-ci bəndləri."},{"d":1,"c":1,"id":"dgk-6","r":"Bənd 1.1","q":"1.1-ci bəndə görə Dövlət Gömrük Komitəsinin statusu necədir?","o":["Hüquq mühafizə orqanı statusu olan mərkəzi icra hakimiyyəti orqanı","Hüquq mühafizə orqanı statusu olan yerli icra hakimiyyəti orqanı","Nazirlər Kabinetinin tabeliyində olan publik hüquqi şəxs","Hərbi status daşıyan mərkəzi icra hakimiyyəti orqanı"],"e":"Maddə 1.1 (qırmızı ilə vurğulanıb): hüquq mühafizə orqanı statusu olan mərkəzi icra hakimiyyəti orqanı.","hl":1},{"d":1,"c":1,"id":"dgk-7","r":"Bənd 1.2","q":"Komitənin öz fəaliyyətində rəhbər tutduğu aktlar arasında hansı YOXDUR?","o":["Milli Məclisin qərarları","Prezidentin fərman və sərəncamları","Nazirlər Kabinetinin qərar və sərəncamları","Azərbaycanın tərəfdar çıxdığı beynəlxalq müqavilələr"],"e":"Maddə 1.2 (rənglənib): Konstitusiya, qanunlar, Prezidentin fərman və sərəncamları, NK-nın qərar və sərəncamları, beynəlxalq müqavilələr və bu Əsasnamə.","hl":1},{"d":1,"c":1,"id":"dgk-8","r":"Bənd 1.3","q":"Komitə vəzifələrini yerinə yetirərkən kimlərlə qarşılıqlı əlaqədə fəaliyyət göstərir?","o":["Digər icra hakimiyyəti orqanları, yerli özünüidarəetmə orqanları və qeyri-hökumət təşkilatları ilə","Yalnız digər hüquq mühafizə orqanları ilə","Siyasi partiyalar və həmkarlar ittifaqları ilə","Yalnız mərkəzi icra hakimiyyəti orqanları ilə"],"e":"Maddə 1.3 (qırmızı).","hl":1},{"d":1,"c":1,"id":"dgk-9","r":"Bənd 1.4","q":"Aşağıdakılardan hansı 1.4-cü bənddə Komitənin fəaliyyət prinsipləri arasında YOXDUR?","o":["Humanizm","Qanunun aliliyi","Şəxslərin qanun qarşısında hüquq bərabərliyi","Xidmətdə nizam-intizam"],"e":"Maddə 1.4 (qırmızı): qanunun aliliyi, insan hüquq və azadlıqlarının qorunması, hüquq bərabərliyi, aşkarlıq və peşəkarlıq, nizam-intizam. “Humanizm” gömrük orqanlarında xidmət haqqında Əsasnamənin 9-cu maddəsindədir, burada yoxdur.","hl":1},{"d":1,"c":1,"id":"dgk-10","r":"Bənd 1.4","q":"1.4-cü bənddə Komitənin fəaliyyəti neçə prinsip əsasında qurulur?","o":["5","4","6","7"],"e":"1) qanunun aliliyi, 2) insan hüquq və azadlıqlarının qorunması, 3) hüquq bərabərliyi, 4) aşkarlıq və peşəkarlıq, 5) nizam-intizam.","hl":1,"t":1},{"d":1,"c":1,"id":"dgk-11","r":"Bənd 1.4","q":"“Aşkarlıq” prinsipi 1.4-cü bənddə hansı prinsiplə birlikdə verilib?","o":["Peşəkarlıq","Qanunçuluq","Şəffaflıq","Hesabatlılıq"],"e":"Maddə 1.4, 4-cü prinsip: “aşkarlıq, peşəkarlıq”.","hl":1},{"d":1,"c":1,"id":"dgk-12","r":"Bənd 1.5","q":"Aşağıdakılardan hansı 1.5-ci bəndə görə Komitənin malik olduğu atributlar arasında YOXDUR?","o":["Öz himni","Müstəqil balans","Xəzinə və bank hesabları","Emblem və bayraq"],"e":"Maddə 1.5: müstəqil balans, dövlət əmlakı, xəzinə və bank hesabları, Dövlət gerbi və adı həkk olunmuş möhür, emblem, bayraq, ştamplar və blanklar."},{"d":1,"c":1,"id":"dgk-13","r":"Bənd 1.5","q":"Komitənin möhüründə nə həkk olunub?","o":["Azərbaycan Respublikası Dövlət gerbinin təsviri və Komitənin adı","Yalnız Komitənin emblemi","Dövlət bayrağı və Komitənin adı","Komitənin emblemi və yaranma tarixi"],"e":"Maddə 1.5."},{"d":1,"c":1,"id":"dgk-14","r":"Bənd 1.6","q":"Komitənin saxlanma xərcləri və fəaliyyəti nə hesabına maliyyələşdirilir?","o":["Dövlət büdcəsi və qanunvericilikdə nəzərdə tutulmuş digər mənbələr hesabına","Yalnız dövlət büdcəsi hesabına","Yalnız gömrük sisteminin büdcədənkənar inkişaf fondu hesabına","Gömrük rüsumlarının 10 faizi hesabına"],"e":"Maddə 1.6 (rənglənib).","hl":1},{"d":1,"c":1,"id":"dgk-15","r":"Bənd 1.7","q":"Komitə harada yerləşir?","o":["Bakı şəhərində","Sumqayıt şəhərində","Naxçıvan şəhərində","Qanunvericilik yerləşmə yerini müəyyən etmir"],"e":"Maddə 1.7."},{"d":1,"c":2,"id":"dgk-16","r":"Bənd 2.1","q":"2.1-ci bənddə Komitənin neçə fəaliyyət istiqaməti göstərilib?","o":["5","4","6","8"],"e":"2.1.1–2.1.5: dövlət siyasəti, gömrük işinin təşkili və inkişafı, normayaratma, hüquq mühafizə fəaliyyəti, qabaqcıl gömrük tənzimlənməsi vasitələri.","hl":1,"t":1},{"d":1,"c":2,"id":"dgk-17","r":"Bənd 2.1.1","q":"Vahid dövlət siyasəti ilə bağlı Komitənin fəaliyyət istiqaməti necə ifadə olunub?","o":["Gömrük işi sahəsində vahid dövlət siyasətinin formalaşdırılmasında iştirak edir və həyata keçirilməsini təmin edir","Vahid dövlət siyasətini formalaşdırır və təsdiq edir","Vahid dövlət siyasətinin həyata keçirilməsində digər orqanlara yardım edir","Vahid dövlət siyasətini müəyyən edir və ona nəzarət edir"],"e":"Maddə 2.1.1 (rənglənib): formalaşdırılmasında “iştirak edir”, həyata keçirilməsini “təmin edir”.","hl":1},{"d":1,"c":2,"id":"dgk-18","r":"Bənd 2.1","q":"Aşağıdakılardan hansı 2.1-ci bənddə fəaliyyət istiqaməti kimi göstərilməyib?","o":["Gömrük tariflərini təsdiq etmək","Gömrük işi sahəsində normayaratma fəaliyyətini həyata keçirmək","Hüquq mühafizə fəaliyyətini həyata keçirmək","Gömrük işini təşkil etmək və onun inkişafını təmin etmək"],"e":"Gömrük tariflərinin təsdiqi fəaliyyət istiqamətləri arasında yoxdur.","hl":1},{"d":1,"c":2,"id":"dgk-19","r":"Bənd 2.1.5","q":"2.1.5-ci bəndə görə Komitə Azərbaycanda nəyin tətbiqini təşkil edir?","o":["Qabaqcıl gömrük tənzimlənməsi vasitələrinin","Elektron hökumət xidmətlərinin","Vahid gömrük tarifinin","Beynəlxalq ticarət standartlarının"],"e":"Maddə 2.1.5."},{"d":1,"c":3,"id":"dgk-20","r":"Bənd 3.1.2","q":"Azərbaycanın iqtisadi və milli təhlükəsizliyi ilə bağlı Komitənin 3.1.2-ci bənddəki vəzifəsi necə ifadə olunub?","o":["Qanunvericilikdə nəzərdə tutulmuş qaydada təmin etmək","Müvafiq dövlət orqanlarına yardım göstərmək","Həyata keçirilməsində iştirak etmək","Təkliflər vermək"],"e":"Maddə 3.1.2 (“təmin etmək” rənglənib). 3.1.15-də isə milli təhlükəsizliyin qorunması sahəsində tədbirlərdə dövlət orqanlarına “yardım göstərmək” yazılıb. Bunları qarışdırmayın.","hl":1},{"d":1,"c":3,"id":"dgk-21","r":"Bənd 3.1.3","q":"İcrasına nəzarət gömrük orqanlarına həvalə edilmiş qanunvericilik aktları ilə bağlı Komitənin vəzifəsi nədir?","o":["Həmin aktlara riayət olunmasını təmin etmək","Həmin aktların layihələrini hazırlamaq","Həmin aktları şərh etmək","Həmin aktlara dəyişiklik təklif etmək"],"e":"Maddə 3.1.3 (“təmin etmək” rənglənib).","hl":1},{"d":1,"c":3,"id":"dgk-22","r":"Bənd 3.1.8","q":"Komitə hansı ödənişlərin vaxtında və tam həcmdə dövlət büdcəsinə köçürülməsini təmin edir?","o":["Gömrük rüsumlarının, müvafiq vergilərin və dövlət rüsumunun","Yalnız gömrük rüsumlarının","Gömrük rüsumlarının və cərimələrin","Bütün vergilərin, sosial sığorta haqları da daxil olmaqla"],"e":"Maddə 3.1.8."},{"d":1,"c":3,"id":"dgk-23","r":"Bənd 3.1.10","q":"Lisenziya və ixtisas attestatları ilə bağlı Komitənin vəzifəsi hansıdır?","o":["Normativ aktlarda nəzərdə tutulmuş hallarda vermək, ləğv etmək və ya fəaliyyətini dayandırmaq","Yalnız vermək","Yalnız ləğv etmək, verilməsi isə Nazirlər Kabinetinə aiddir","Yalnız fəaliyyətini dayandırmaq"],"e":"Maddə 3.1.10."},{"d":1,"c":3,"id":"dgk-24","r":"Bənd 3.1.13","q":"3.1.13-cü bənddə gömrük sərhədindən qanunsuz keçirilməsinin qarşısı alınan mallar sırasında hansının adı çəkilmir?","o":["Radioaktiv tullantılar","Ozondağıdıcı maddələr","Əqli mülkiyyət hüquqlarının obyektləri","Yox olmaq təhlükəsi altında olan heyvan və bitki növləri"],"e":"Maddə 3.1.13: narkotik vasitələr, psixotrop maddələr, prekursorlar, silahlar, ozondağıdıcı maddələr, mədəni, tarixi və arxeoloji sərvətlər, əqli mülkiyyət obyektləri, nəsli kəsilən heyvan və bitki növləri və başqa mallar."},{"d":1,"c":3,"id":"dgk-25","r":"Bənd 3.1.14","q":"Beynəlxalq terrorçuluqla mübarizədə Komitənin vəzifəsi nədir?","o":["Digər hüquq mühafizə orqanlarına yardım göstərmək","Terrorçuluqla mübarizəni əlaqələndirmək","Terrorçuluq işləri üzrə ibtidai istintaq aparmaq","Antiterror əməliyyatlarına rəhbərlik etmək"],"e":"Maddə 3.1.14: vağzallarda, dəniz, çay və hava limanlarında beynəlxalq nəqliyyata qanunsuz müdaxilənin qarşısının alınmasında və terrorçuluqla mübarizədə yardım göstərmək."},{"d":1,"c":3,"id":"dgk-26","r":"Bənd 3.1.15","q":"Ətraf mühitin, heyvan və bitki aləminin qorunması tədbirlərində Komitənin rolu nədir?","o":["Müvafiq dövlət orqanlarına yardım göstərmək","Bu sahədə dövlət siyasətini həyata keçirmək","Bu sahədə nəzarəti təmin etmək","Bu sahədə normativ aktlar qəbul etmək"],"e":"Maddə 3.1.15: yardım göstərmək."},{"d":1,"c":3,"id":"dgk-27","r":"Bənd 3.1.16","q":"Xəzər dənizinin (gölünün) Azərbaycana mənsub bölməsindəki bioloji sərvətlər üzrə Komitənin vəzifəsi hansıdır?","o":["Dövlət siyasətinin həyata keçirilməsində iştirak etmək və sərhəddən keçirilərkən qanunvericiliyə nəzarəti təmin etmək","Balıq ovuna icazələr vermək","Bioloji sərvətlərin qorunması üzrə dövlət siyasətini müəyyən etmək","Ekologiya Nazirliyinə yalnız məlumat vermək"],"e":"Maddə 3.1.16."},{"d":1,"c":3,"id":"dgk-28","r":"Bənd 3.1.18","q":"Gömrük statistikası ilə bağlı Komitənin vəzifəsi necə ifadə olunub?","o":["Xarici ticarətin gömrük statistikasını və xüsusi gömrük statistikasını beynəlxalq standartlara və təcrübəyə uyğun aparmaq və təkmilləşdirmək","Yalnız xarici ticarətin gömrük statistikasını aparmaq","Gömrük statistikasını Dövlət Statistika Komitəsinə təhvil vermək","Xüsusi gömrük statistikasını milli standartlara uyğun aparmaq"],"e":"Maddə 3.1.18 (yaşıl ilə rənglənib).","hl":1},{"d":1,"c":3,"id":"dgk-29","r":"Bənd 3.1.19","q":"Gömrük ərazisinə gətirilən mallara münasibətdə istehlakçıların hüquqlarının müdafiəsində Komitənin vəzifəsi nədir?","o":["Müvafiq dövlət orqanlarına yardım göstərmək","İstehlakçı hüquqlarının müdafiəsini təmin etmək","Bu sahədə dövlət siyasətini formalaşdırmaq","İstehlakçıların şikayətlərinə baxıb qərar qəbul etmək"],"e":"Maddə 3.1.19 (“yardım göstərmək” qırmızı).","hl":1},{"d":1,"c":3,"id":"dgk-30","r":"Bənd 3.1.21","q":"Gömrük işini həyata keçirərkən şəxslərlə bağlı Komitənin vəzifəsi hansıdır?","o":["Hüquqlarının və maraqlarının qorunması üzrə tədbirlər görmək","Yalnız müraciətlərinə cavab vermək","Onlara hüquqi yardım göstərmək","Onların məlumatlarını açıqlamaq"],"e":"Maddə 3.1.21 (qırmızı).","hl":1},{"d":1,"c":3,"id":"dgk-31","r":"Bənd 3.1.22","q":"Valyuta keçirilərkən cinayət yolu ilə əldə edilmiş vəsaitlərin leqallaşdırılması izləri aşkar edildikdə Komitə məlumatları hara göndərir?","o":["Aidiyyəti üzrə cinayət təqibini həyata keçirən orqana; həmçinin maliyyə monitorinqi orqanına","Yalnız Mərkəzi Banka","Yalnız prokurorluğa","Maliyyə Nazirliyinə və vergi orqanlarına"],"e":"Maddə 3.1.22."},{"d":1,"c":3,"id":"dgk-32","r":"Bənd 3.1.23","q":"Gömrük işi ilə bağlı beynəlxalq müqavilələrin LAYİHƏLƏRİ üzrə Komitənin vəzifəsi nədir?","o":["Layihələrin işlənib hazırlanmasında iştirak etmək","Layihələri təsdiq etmək","Layihələri imzalamaq","Layihələri ratifikasiya üçün Milli Məclisə təqdim etmək"],"e":"Maddə 3.1.23 (qırmızı): iştirak etmək. 4.1.20-də isə tərəfdar çıxmaq barədə “təkliflər vermək” hüququ var.","hl":1},{"d":1,"c":3,"id":"dgk-33","r":"Bənd 3.1.24-1","q":"Kimyəvi maddələr üzrə idxal, ixrac və tranzit əməliyyatlarını həyata keçirən müəssisələrlə bağlı Komitənin vəzifəsi nədir?","o":["Mərkəzləşdirilmiş qeydiyyatını aparmaq və illik bəyannamələri hazırlayıb aidiyyəti üzrə təqdim etmək","Onlara lisenziya vermək","Onların fəaliyyətini dayandırmaq","Yalnız rüblük hesabat tələb etmək"],"e":"Maddə 3.1.24-1: Kimyəvi silahın qadağan olunması haqqında Qanuna uyğun olaraq."},{"d":1,"c":3,"id":"dgk-34","r":"Bənd 3.1.25","q":"Buraxılış məntəqələrində baytarlıq, fitosanitar və sanitariya nəzarəti hansı prinsip əsasında həyata keçirilir?","o":["“Bir pəncərə” prinsipi","“Vahid gömrük” prinsipi","“Yaşıl dəhliz” prinsipi","“Risk əsaslı” prinsip"],"e":"Maddə 3.1.25: “bir pəncərə” prinsipi, mümkün qədər qısa vaxtda."},{"d":1,"c":3,"id":"dgk-35","r":"Bənd 3.1.25-1","q":"Avtonəqliyyat sahiblərinin mülki məsuliyyətinin icbari sığortası üzrə Komitənin vəzifəsi hansı növlərə aiddir?","o":["Sərhəd sığorta müqaviləsinə və Azərbaycan Yaşıl Kartı növünə münasibətdə sığortalanmaya nəzarət etmək","Bütün icbari sığorta növlərinə nəzarət etmək","Sərhəddə sığorta polisləri satmaq","Yalnız Yaşıl Kart verilməsini təşkil etmək"],"e":"Maddə 3.1.25-1 (qırmızı): nəzarət etmək.","hl":1},{"d":1,"c":3,"id":"dgk-36","r":"Bənd 3.1.26","q":"Heyvanların xüsusi təhlükəli xəstəlikləri qeydə alınan qonşu ölkələrdən gələn nəqliyyat vasitələri ilə bağlı Komitənin vəzifəsi nədir?","o":["Baytarlıq qanunvericiliyində müəyyən edilmiş qaydada və müddətdə məcburi dezinfeksiya etmək","Onların ölkəyə girişini qadağan etmək","Onları karantin zonasında 30 gün saxlamaq","Yalnız baytarlıq müfəttişliyinə məlumat vermək"],"e":"Maddə 3.1.26 (qırmızı).","hl":1},{"d":1,"c":3,"id":"dgk-37","r":"Bənd 3.1.27","q":"Başqa ölkələrdən gətirilən heyvanların təcrid olunmuş halda saxlanılması məqsədilə Komitə nə edir?","o":["Müvafiq ərazi dövlət baytarlıq müfəttişliyinə məlumat verir","Heyvanları özü təcrid edir","Heyvanların gətirilməsini qadağan edir","Heyvanları məcburi dezinfeksiya edir"],"e":"Maddə 3.1.27 (qırmızı).","hl":1},{"d":1,"c":3,"id":"dgk-38","r":"Bənd 3.1.28","q":"Beynəlxalq avtomobil daşımalarını yerinə yetirən nəqliyyat vasitələrinə buraxılış məntəqələrində Komitə nə verir?","o":["İcazə blankları","Yaşıl Kart","Tranzit vizası","Sürücülük vəsiqəsi"],"e":"Maddə 3.1.28."},{"d":1,"c":3,"id":"dgk-39","r":"Bənd 3.1.28-1","q":"3.1.28-1-ci bənddə icazələrin verilməsi hansı aktlara uyğun həyata keçirilir?","o":["Gömrük Məcəlləsinə və “Lisenziyalar və icazələr haqqında” Qanuna","Vergi Məcəlləsinə və Gömrük Məcəlləsinə","“Sahibkarlıq haqqında” Qanuna","Yalnız Nazirlər Kabinetinin qərarına"],"e":"Maddə 3.1.28-1: icazə, dublikat və əlavələrin verilməsi, yenidən rəsmiləşdirilməsi, dayandırılması, bərpası və ləğvi."},{"d":1,"c":3,"id":"dgk-40","r":"Bənd 3.1.30","q":"Komitə gömrük nəzarətini nəyin əsasında təkmilləşdirir?","o":["Riskləri idarəetmə sistemi əsasında, müasir texnologiya və avadanlıqlardan istifadə etməklə","Tam yoxlama prinsipi əsasında","Yalnız fiziki yoxlamaların artırılması ilə","Xarici ekspertlərin rəyi əsasında"],"e":"Maddə 3.1.30."},{"d":1,"c":3,"id":"dgk-41","r":"Bənd 3.1.31","q":"Komitə hansı nomenklaturanın aparılması ilə əlaqədar tədbirlər görür?","o":["Xarici iqtisadi fəaliyyətin mal nomenklaturası","Kadr nomenklaturası","Ümumrespublika məhsul təsnifatı","Vahid tarif nomenklaturası"],"e":"Maddə 3.1.31: XİF mal nomenklaturası. Kadr nomenklaturasını isə sədr təsdiq edir (5.6.7)."},{"d":1,"c":3,"id":"dgk-42","r":"Bənd 3.1.35","q":"3.1.35-ci bəndə görə Komitə kimlərlə məlumatların elektron mübadiləsini həyata keçirir?","o":["Dövlət orqanları, xarici ticarətin iştirakçıları və səlahiyyətli iqtisadi operatorlarla","Yalnız xarici dövlətlərin gömrük xidmətləri ilə","Yalnız bank və sığorta təşkilatları ilə","Yalnız yerli özünüidarəetmə orqanları ilə"],"e":"Maddə 3.1.35. Digər dövlətlərin gömrük xidmətləri ilə mübadilə 3.1.36-dadır."},{"d":1,"c":3,"id":"dgk-43","r":"Bənd 3.1.36","q":"Digər dövlətlərin gömrük xidmətləri ilə məlumat mübadiləsi və ticarət-təchizat zəncirinin idarə olunmasında iştirak hansı məqsədə xidmət edir?","o":["Beynəlxalq ticarətin asanlaşdırılmasına şərait yaratmaq","Gömrük ödənişlərini artırmaq","Xarici investisiyaları cəlb etmək","Gömrük tariflərini unifikasiya etmək"],"e":"Maddə 3.1.36 (“şərait yaratmaq” qırmızı).","hl":1},{"d":1,"c":3,"id":"dgk-44","r":"Bənd 3.1.37","q":"Xarici ticarət iştirakçıları və səlahiyyətli iqtisadi operatorlarla tərəfdaşlıq əlaqələri hansı məqsədlə yaradılır?","o":["Beynəlxalq ticarət-təchizat zəncirinin təhlükəsizliyinin təmin edilməsi","Gömrük rüsumlarının azaldılması","Reklam və təbliğat","Yeni gömrük postlarının açılması"],"e":"Maddə 3.1.37."},{"d":1,"c":3,"id":"dgk-45","r":"Bənd 3.1.38","q":"Digər dövlət orqanları ilə münasibətdə Komitənin 3.1.38-ci bənddəki vəzifəsi hansıdır?","o":["Əməkdaşlıq etmək və qanunvericilikdə nəzərdə tutulmuş hallarda onların fəaliyyətini əlaqələndirmək","Onların fəaliyyətinə nəzarət etmək","Onların fəaliyyətini təftiş etmək","Onlara məcburi göstərişlər vermək"],"e":"Maddə 3.1.38 (rənglənib, “əməkdaşlıq etmək” qırmızı).","hl":1},{"d":1,"c":3,"id":"dgk-46","r":"Bənd 3.1.39","q":"Gömrük işi sahəsində islahatlar və inkişafın sürətləndirilməsi məqsədilə Komitə nə edir?","o":["Dövlət proqramları hazırlayır və onların yerinə yetirilməsi üçün tədbirlər görür","Dövlət proqramlarını təsdiq edir","Yalnız digər orqanların proqramlarını icra edir","İnkişaf konsepsiyasını Milli Məclisə təqdim edir"],"e":"Maddə 3.1.39."},{"d":1,"c":3,"id":"dgk-47","r":"Bənd 3.1.42","q":"Komitənin internet saytında yerləşdirilən məlumatlar sırasında hansı xüsusi qeyd olunub?","o":["İdxalatçıların müəyyən risk qrupuna aid edilməsi və ya risk qruplarının dəyişdirilməsi barədə məlumatlar","Vəzifəli şəxslərin əmək haqları","Gömrük vəzifəli şəxslərinin şəxsi işləri","Əməliyyat-axtarış fəaliyyətinin nəticələri"],"e":"Maddə 3.1.42."},{"d":1,"c":3,"id":"dgk-48","r":"Bənd 3.1.43","q":"Fiziki və hüquqi şəxslərin müraciətləri əsasında Komitə nə təqdim edir?","o":["Müvafiq məlumatlar (arayışlar)","Lisenziyalar","Gömrük bəyannamələri","Rəsmi şərhlər"],"e":"Maddə 3.1.43 (qırmızı): informasiya və məsləhət təminatını təşkil etmək, arayışlar təqdim etmək.","hl":1},{"d":1,"c":3,"id":"dgk-49","r":"Bənd 3.1.43-1","q":"Barəsində qətimkan tədbiri seçilmiş şəxs haqqında məlumat hansı siyahıya daxil edilir?","o":["“Sərhədkeçməyə məhdudiyyət siyahısı”","“Sərhədkeçmə zamanı xüsusi diqqət siyahısı”","“Risk qrupu siyahısı”","“Qara siyahı”"],"e":"Maddə 3.1.43-1 (mavi): axtarışda olan, tutulma qərarı olan, təqsirləndirilən şəxs qismində cəlb olunan və qətimkan tədbiri seçilən şəxslər məhdudiyyət siyahısına düşür.","hl":1},{"d":1,"c":3,"id":"dgk-50","r":"Bənd 3.1.43-2","q":"Kommersiya məqsədli malları ölkəyə müvəqqəti gətirən fiziki şəxs haqqında məlumat hansı siyahıya daxil edilir?","o":["“Sərhədkeçmə zamanı xüsusi diqqət siyahısı”","“Sərhədkeçməyə məhdudiyyət siyahısı”","“Səlahiyyətli iqtisadi operatorlar reyestri”","Heç bir siyahıya daxil edilmir"],"e":"Maddə 3.1.43-2."},{"d":1,"c":3,"id":"dgk-51","r":"Bənd 3.1.43-3","q":"Gömrük qaydaları əleyhinə inzibati xətaya görə hansı müddət ərzində tənbeh almış şəxs xüsusi diqqət siyahısına daxil edilir?","o":["Son bir il ərzində","Son altı ay ərzində","Son iki il ərzində","Son üç il ərzində"],"e":"Maddə 3.1.43-3 (rənglənib): son bir il ərzində inzibati tənbeh tətbiq edilən şəxslər.","hl":1,"t":1},{"d":1,"c":3,"id":"dgk-52","r":"Bənd 3.1.43-3","q":"Məhkumluğu olan hansı şəxslər “Sərhədkeçmə zamanı xüsusi diqqət siyahısı”na daxil edilir?","o":["İbtidai istintaqı DGK tərəfindən aparılan cinayətlərə görə məhkumluğu olanlar","İstənilən cinayətə görə məhkumluğu olanlar","Yalnız ağır cinayətlərə görə məhkumluğu olanlar","Məhkumluğu olanlar siyahıya daxil edilmir"],"e":"Maddə 3.1.43-3."},{"d":1,"c":3,"id":"dgk-53","r":"Bənd 3.1.43-2/3","q":"Xüsusi diqqət siyahısındakı məlumatlarla bağlı müvafiq əsaslar aradan qalxdıqda nə edilir?","o":["Məlumatların aktiv statusu dəyişdirilir","Məlumatlar dərhal silinir","Şəxs məhdudiyyət siyahısına keçirilir","Məlumatlar arxivə 5 il müddətinə verilir"],"e":"Maddə 3.1.43-2 və 3.1.43-3."},{"d":1,"c":3,"id":"dgk-54","r":"Bənd 3.1.46","q":"Gömrük sisteminin büdcədənkənar inkişaf fondu ilə bağlı Komitənin vəzifəsi nədir?","o":["Qanunvericiliklə müəyyən edilmiş qaydada fondu idarə etmək və onun üzərində sərəncam vermək","Fondun vəsaitlərini dövlət büdcəsinə köçürmək","Fondu yaratmaq üçün Prezidentə təklif vermək","Fondun yalnız uçotunu aparmaq"],"e":"Maddə 3.1.46."},{"d":1,"c":3,"id":"dgk-55","r":"Bənd 3.1.50","q":"3.1.50-ci bəndə görə gömrük orqanlarının fəaliyyəti və vəzifəli şəxslərin peşə hazırlığı necə yoxlanılır?","o":["Mütəmadi","İldə bir dəfə","5 ildə bir dəfə","Yalnız şikayət olduqda"],"e":"Maddə 3.1.50: kadr hazırlığını təmin etmək üçün mütəmadi yoxlamaq və zəruri tədbirlər görmək."},{"d":1,"c":3,"id":"dgk-56","r":"Bənd 3.1.54","q":"Gömrük orqanlarının vəzifəli şəxslərinin fiziki hazırlığı və tibbi təminatı ilə bağlı Komitənin vəzifəsi nədir?","o":["Fiziki hazırlığını təmin etmək və tibbi təminatını həyata keçirmək","Səhiyyə Nazirliyinə yardım göstərmək","Fiziki hazırlıq normativlərini Nazirlər Kabinetinə təqdim etmək","Tibbi sığorta müqavilələri bağlamaq"],"e":"Maddə 3.1.54 (qırmızı).","hl":1},{"d":1,"c":3,"id":"dgk-57","r":"Bənd 3.1.55","q":"Komitə idman sahəsində nəyi TƏSDİQ edir?","o":["Xidməti-tətbiqi idman növlərinin inkişafı proqramlarını, idman tədbirlərinin təqvim planlarını və hərbi idman kompleksinin normativlərini","Yalnız olimpiya idman növlərinin proqramlarını","İdman federasiyalarının nizamnamələrini","İdman-Sağlamlıq Mərkəzinin büdcəsini"],"e":"Maddə 3.1.55 (qırmızı).","hl":1},{"d":1,"c":3,"id":"dgk-58","r":"Bənd 3, 4","q":"Aşağıdakılardan hansı Komitənin HÜQUQU deyil, VƏZİFƏSİDİR?","o":["Gömrük ödənişlərinin alınmasını təmin etmək","Şəxslərin xarici ticarət əməliyyatlarının gömrük auditini aparmaq","Müstəqil ekspertləri öz fəaliyyətinə cəlb etmək","Xüsusi bülletenlər və digər nəşrlər buraxmaq"],"e":"Gömrük ödənişlərinin alınmasını təmin etmək vəzifədir (3.1.7). Digər üçü hüquqdur (4.1.4, 4.1.22, 4.1.19).","hl":1},{"d":1,"c":3,"id":"dgk-59","r":"Bənd 3, 4","q":"Aşağıdakılardan hansı Komitənin VƏZİFƏSİ deyil, HÜQUQUDUR?","o":["Gömrük orqanlarında kargüzarlığın və icra intizamının vəziyyətini yoxlamaq","Lisenziya və ixtisas attestatları vermək","İxrac nəzarətini həyata keçirmək","Arxiv sənədlərinin saxlanılmasını təmin etmək"],"e":"Kargüzarlığı və icra intizamını yoxlamaq hüquqdur (4.1.16). Digərləri vəzifədir (3.1.10, 3.1.24, 3.1.49).","hl":1},{"d":1,"c":4,"id":"dgk-60","r":"Bənd 4.1.2–4.1.3","q":"Gömrük orqanlarına təqdim edilən məlumat, sənəd və bəyannamələrlə bağlı Komitənin hüququ hansıdır?","o":["Onların həqiqiliyini və düzgünlüyünü araşdırmaq","Onları ləğv etmək","Onları dərc etmək","Onları üçüncü şəxslərə satmaq"],"e":"Maddə 4.1.3. 4.1.2-yə görə isə Komitə həmin sənədləri şəxslərdən tələb edə bilər."},{"d":1,"c":4,"id":"dgk-61","r":"Bənd 4.1.5","q":"Tütün məmulatının idxalını həyata keçirən subyektlərin reyestrindən çıxarışı Komitə hansı Qanuna əsasən yoxlayır?","o":["“Tütün və tütün məmulatı haqqında” Qanun","“Qida təhlükəsizliyi haqqında” Qanun","“Lisenziyalar və icazələr haqqında” Qanun","“Aksizli mallar haqqında” Qanun"],"e":"Maddə 4.1.5. Elektron bildiriş və Qida Təhlükəsizliyi Reyestrindən çıxarış isə “Qida təhlükəsizliyi haqqında” Qanuna əsasən yoxlanılır."},{"d":1,"c":4,"id":"dgk-62","r":"Bənd 4.1.6","q":"Malların buraxılışından sonra öhdəliklərin yerinə yetirilməsini yoxlamaq və hüquqpozmaların operativ qarşısını almaq üçün Komitə nə təşkil edə bilər?","o":["Gömrük orqanlarının sistemi daxilində mobil qruplar","Xüsusi təyinatlı polis bölmələri","Müvəqqəti istintaq komissiyaları","İctimai nəzarət şuraları"],"e":"Maddə 4.1.6."},{"d":1,"c":4,"id":"dgk-63","r":"Bənd 4.1.7","q":"Cinayətin qarşısını almaq və şübhəli şəxsi təqib etmək üçün son zərurət vəziyyətində Komitə hansı nəqliyyat vasitəsindən istifadə edə BİLMƏZ?","o":["Xarici dövlətin konsulluğuna məxsus nəqliyyat vasitəsi","Özəl şirkətə məxsus yük maşını","Dövlət müəssisəsinə məxsus avtomobil","İctimai təşkilata məxsus mikroavtobus"],"e":"Maddə 4.1.7 (qırmızı): xarici dövlətlərin diplomatik, konsulluq və başqa nümayəndəliklərinə, beynəlxalq təşkilatlara məxsus və xüsusi təyinatlı nəqliyyat və rabitə vasitələri istisnadır.","hl":1},{"d":1,"c":4,"id":"dgk-64","r":"Bənd 4.1.7","q":"Komitə idarə, müəssisə və təşkilatlara məxsus rabitə və nəqliyyat vasitələrindən hansı şəraitdə istifadə edə bilər?","o":["Son zərurət vəziyyətində","Sahibinin yazılı razılığı ilə istənilən vaxt","Məhkəmənin qərarı ilə","Hər bir gömrük əməliyyatı zamanı"],"e":"Maddə 4.1.7."},{"d":1,"c":4,"id":"dgk-65","r":"Bənd 4.1.8","q":"Komitə əməliyyat-axtarış fəaliyyətini hansı cinayətlər üzrə həyata keçirir?","o":["Təhqiqatı və istintaqı gömrük orqanlarının səlahiyyətinə aid edilmiş cinayətlər üzrə","Bütün iqtisadi cinayətlər üzrə","Yalnız qaçaqmalçılıq üzrə","Prokurorluğun tapşırdığı istənilən cinayət üzrə"],"e":"Maddə 4.1.8 (qırmızı).","hl":1},{"d":1,"c":4,"id":"dgk-66","r":"Bənd 4.1.9","q":"Komitə təhqiqat və ibtidai istintaqı hansı qaydada aparır?","o":["Cinayət-prosessual qanunvericiliyi ilə müəyyən edilmiş qaydada","Gömrük Məcəlləsi ilə müəyyən edilmiş qaydada","İnzibati Xətalar Məcəlləsinə uyğun","Sədrin təsdiq etdiyi daxili qaydalara uyğun"],"e":"Maddə 4.1.9 (qırmızı).","hl":1},{"d":1,"c":4,"id":"dgk-67","r":"Bənd 4.1.10","q":"İnzibati xətalarla bağlı işlər üzrə Komitənin hüququ hansıdır?","o":["İcraat aparmaq, işlərə baxmaq və şəxsləri məsuliyyətə cəlb etmək","Yalnız protokol tərtib edib məhkəməyə göndərmək","Yalnız işə baxmaq","İnzibati xəta işləri Komitənin səlahiyyətinə aid deyil"],"e":"Maddə 4.1.10 (qırmızı).","hl":1},{"d":1,"c":4,"id":"dgk-68","r":"Bənd 4.1.11","q":"Fiziki qüvvədən, xüsusi vasitələrdən və odlu silahdan istifadə halları və qaydası nə ilə müəyyən edilir?","o":["Gömrük Məcəlləsi ilə","Polis haqqında Qanunla","Bu Əsasnamə ilə","Sədrin əmri ilə"],"e":"Maddə 4.1.11 (qırmızı). Xüsusi vasitələrə texniki vasitələr də daxildir.","hl":1},{"d":1,"c":4,"id":"dgk-69","r":"Bənd 4.1.12","q":"Gömrük nəzarəti zonasında rejim qaydalarına riayətə nəzarəti Komitə necə həyata keçirir?","o":["Müstəqil surətdə, yaxud digər hüquq mühafizə orqanlarını cəlb etməklə","Yalnız Dövlət Sərhəd Xidməti ilə birgə","Yalnız polis orqanlarının iştirakı ilə","Yalnız prokurorun sanksiyası ilə"],"e":"Maddə 4.1.12."},{"d":1,"c":4,"id":"dgk-70","r":"Bənd 4.1.13","q":"Gömrük nəzarəti altındakı mallarla bağlı fakt və hadisələri sənədləşdirərkən Komitə nə edə bilər?","o":["Audioyazılar, video və foto çəkilişlər aparmaq","Yalnız yazılı protokol tərtib etmək","Yalnız məhkəmənin icazəsi ilə foto çəkmək","Malları müsadirə etmək"],"e":"Maddə 4.1.13."},{"d":1,"c":4,"id":"dgk-71","r":"Bənd 4.1.14","q":"Gömrük qanunvericiliyinin pozulmasının aradan qaldırılması üçün Komitə şəxslərə nə göndərə bilər?","o":["Yazılı formada xəbərdarlıqlar və onların yerinə yetirilməsinə nəzarət edir","Şifahi tövsiyələr","Cərimə qərarları, məhkəməsiz","İcra vərəqələri"],"e":"Maddə 4.1.14 (qırmızı).","hl":1},{"d":1,"c":4,"id":"dgk-72","r":"Bənd 4.1.15","q":"Gömrük rəsmiləşdirilməsinin müasir metodları üzrə əməkdaşlıq məqsədilə Komitə xarici ticarət iştirakçıları ilə nə edə bilər?","o":["Rəsmi münasibətlər yaratmaq və məsləhətləşmələr aparmaq","Kommersiya müqavilələri bağlamaq","Birgə müəssisələr yaratmaq","Onların fəaliyyətini təftiş etmək"],"e":"Maddə 4.1.15 (qırmızı).","hl":1},{"d":1,"c":4,"id":"dgk-73","r":"Bənd 4.1.17","q":"Kadr hazırlığı üzrə müqavilələri Komitə hansı təhsil müəssisələri ilə bağlaya bilər?","o":["Azərbaycan Respublikasının və xarici dövlətlərin xüsusi təyinatlı təhsil müəssisələri ilə","Yalnız Azərbaycanın dövlət universitetləri ilə","Yalnız Komitənin Akademiyası ilə","Yalnız beynəlxalq təşkilatlarla"],"e":"Maddə 4.1.17."},{"d":1,"c":4,"id":"dgk-74","r":"Bənd 4.1.20","q":"Azərbaycanın gömrük sahəsində beynəlxalq müqavilələrə tərəfdar çıxması ilə bağlı Komitənin HÜQUQU nədir?","o":["Təkliflər vermək","Müqavilələri ratifikasiya etmək","Müqavilələrə qoşulmaq barədə qərar qəbul etmək","Müqavilələri imzalamaq"],"e":"Maddə 4.1.20 (qırmızı).","hl":1},{"d":1,"c":4,"id":"dgk-75","r":"Bənd 4.1.21","q":"Beynəlxalq təşkilatlar və xarici dövlət orqanları ilə münasibətdə Komitənin hüququ hansıdır?","o":["Qanunvericiliklə müəyyən edilmiş qaydada əməkdaşlıq etmək və xarici təcrübəni öyrənmək","Onların ərazisində gömrük postları açmaq","Onlara göstərişlər vermək","Onların adından müqavilə bağlamaq"],"e":"Maddə 4.1.21 (“əməkdaşlıq etmək” qırmızı).","hl":1},{"d":1,"c":4,"id":"dgk-76","r":"Bənd 4.1.23","q":"4.1.23-cü bəndə görə Komitə kimin fəaliyyətini yoxlamaq və təftiş etmək hüququna malikdir?","o":["Komitə sisteminə daxil olan gömrük orqanlarının və tabeliyindəki digər qurumların","Bütün xarici ticarət iştirakçılarının","Digər hüquq mühafizə orqanlarının","Yerli özünüidarəetmə orqanlarının"],"e":"Maddə 4.1.23 (imtahan sualı).","hl":1,"ex":1},{"d":1,"c":4,"id":"dgk-77","r":"Bənd 4.1.24","q":"Gömrük işi üzrə Komitə kimlərə sorğu verib zəruri məlumatları (sənədləri) ala bilər?","o":["Dövlət və yerli özünüidarəetmə orqanlarına, fiziki və hüquqi şəxslərə","Yalnız dövlət orqanlarına","Yalnız hüquqi şəxslərə","Yalnız məhkəmənin qərarı ilə istənilən şəxsə"],"e":"Maddə 4.1.24."},{"d":1,"c":4,"id":"dgk-78","r":"Bənd 4.1.26","q":"Komitənin ehtiyacları üçün əsaslı tikinti və təmirlə bağlı Komitənin hüququ hansıdır?","o":["İşlər görmək, qanunvericilikdə nəzərdə tutulmuş hallarda müsabiqə keçirmək, müqavilələr bağlamaq və icrasına nəzarət etmək","Yalnız Nazirlər Kabinetinə müraciət etmək","Yalnız Dövlət Əmlakı Komitəsi vasitəsilə tikinti aparmaq","Tikinti işləri Komitənin hüququna daxil deyil"],"e":"Maddə 4.1.26."},{"d":1,"c":4,"id":"dgk-79","r":"Bənd 4.1.27","q":"Vəzifəli şəxslərin əmək şəraitinin, maddi təminatının və sosial-məişət xidmətinin yaxşılaşdırılması ilə bağlı Komitənin hüququ nədir?","o":["Təkliflər vermək","Əmək haqlarını müstəqil artırmaq","Bu barədə normativ akt qəbul etmək","Sosial fondlar yaratmaq"],"e":"Maddə 4.1.27 (“təkliflər vermək” qırmızı).","hl":1},{"d":1,"c":5,"id":"dgk-80","r":"Bənd 5.1","q":"5.1-ci bəndə görə Komitənin vahid sistemini nə təşkil edir?","o":["Komitənin aparatı, onun strukturuna daxil olan gömrük orqanları və tabeliyində olan digər qurumlar","Yalnız Komitənin aparatı və ərazi gömrük idarələri","Komitə, Dövlət Sərhəd Xidməti və gömrük postları","Komitənin aparatı və kollegiyası"],"e":"Maddə 5.1 (imtahan sualı). Komitə fəaliyyətini bilavasitə və həmin qurumlar vasitəsilə həyata keçirir.","hl":1,"ex":1},{"d":1,"c":5,"id":"dgk-81","r":"Bənd 5.2","q":"Komitənin strukturu və
