<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6A64">
<title>Gömrük İmtahanı</title>
<style>
:root{
  --bg:#F4FBF9; --surface:#FFFFFF; --s1:#EAF3F1; --s2:#DCE8E5; --ink:#161D1C; --muted:#4F5F5C; --line:#C9D6D3;
  --primary:#0B6A64; --on-primary:#FFFFFF; --pc:#B4EFE7; --on-pc:#00201D;
  --good:#1E7A47; --good-c:#CFF2DA; --bad:#B3261E; --bad-c:#F9DEDC; --marker:#F6D85A; --marker-ink:#2A2306; --on-sig:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06);
  --d0:#0D5C61; --d1:#6A4C93; --d2:#B5651D; --d3:#2B5C9E; --d4:#7A7F2A; --d5:#A23E6B; --d6:#3F6B3A; --d7:#8A5A00; --d8:#4A5568; --d9:#9C2F2F; --d10:#1F6F8B; --d11:#7B3FA0; --d12:#2F7A5C; --d13:#B04A1E; --d14:#2C5282; --d15:#6B4F1D; --d16:#8B2252; --d17:#3E6E1E; --d18:#A61B1B; --d19:#1F5F8B; --d20:#8A5A00; --d21:#6B2E8A; --d22:#2E6B5A; --d23:#9B1C4B; --d24:#4A5A12; --d25:#1B4F72; --d26:#7A3B12; --d27:#245E4F; --d28:#5B3A8C;
  --font:Roboto,"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#171D1C; --s1:#1D2625; --s2:#27312F; --ink:#DDE4E2; --muted:#A3B2AF; --line:#3A4644;
  --primary:#85D5CC; --on-primary:#003734; --pc:#00504B; --on-pc:#A1F2E8;
  --good:#7DD89E; --good-c:#123A22; --bad:#F2B8B5; --bad-c:#5C1712; --marker:#D8B93C; --marker-ink:#1E1802; --on-sig:#0F1514;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --d0:#53B5AF; --d1:#B39DDB; --d2:#E2A15F; --d3:#7FA8E0; --d4:#C2C766; --d5:#E27FA9; --d6:#8FCB86; --d7:#E8B44C; --d8:#A0AEC0; --d9:#F08A8A; --d10:#6FC3E0; --d11:#C79BE6; --d12:#7FD1AE; --d13:#F2A07A; --d14:#90B4F0; --d15:#D9B77A; --d16:#E991B8; --d17:#9FD67A; --d18:#F48C8C; --d19:#8CC4EE; --d20:#E8B860; --d21:#D3A4EE; --d22:#8ED8C2; --d23:#F59BBE; --d24:#C8DA7E; --d25:#85C1E9; --d26:#E8A06E; --d27:#7FCFB8; --d28:#B9A0E6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#171D1C; --s1:#1D2625; --s2:#27312F; --ink:#DDE4E2; --muted:#A3B2AF; --line:#3A4644;
  --primary:#85D5CC; --on-primary:#003734; --pc:#00504B; --on-pc:#A1F2E8;
  --good:#7DD89E; --good-c:#123A22; --bad:#F2B8B5; --bad-c:#5C1712; --marker:#D8B93C; --marker-ink:#1E1802; --on-sig:#0F1514;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --d0:#53B5AF; --d1:#B39DDB; --d2:#E2A15F; --d3:#7FA8E0; --d4:#C2C766; --d5:#E27FA9; --d6:#8FCB86; --d7:#E8B44C; --d8:#A0AEC0; --d9:#F08A8A; --d10:#6FC3E0; --d11:#C79BE6; --d12:#7FD1AE; --d13:#F2A07A; --d14:#90B4F0; --d15:#D9B77A; --d16:#E991B8; --d17:#9FD67A; --d18:#F48C8C; --d19:#8CC4EE; --d20:#E8B860; --d21:#D3A4EE; --d22:#8ED8C2; --d23:#F59BBE; --d24:#C8DA7E; --d25:#85C1E9; --d26:#E8A06E; --d27:#7FCFB8; --d28:#B9A0E6;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.view{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:0 16px}
/* app bars */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:4px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;min-height:64px}
.bar h2{font-size:20px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.ib{width:48px;height:48px;border-radius:24px;border:0;background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:active{background:var(--s2)}
.ib svg{width:24px;height:24px;fill:currentColor}
.hero-top{padding:calc(20px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:flex-start;gap:8px}
.hero-top .t{flex:1}
.eyebrow{font-size:13px;font-weight:600;color:var(--primary);letter-spacing:.06em;text-transform:uppercase}
h1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.01em;margin-top:2px}
/* cards */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.stat{margin:12px 16px 0;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .rl{position:absolute;text-align:center;line-height:1.1}
.ring .rl b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ring .rl small{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.kv div b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.kv div span{font-size:12px;color:var(--muted)}
.resume{margin:12px 16px 0;padding:14px 16px;display:flex;align-items:center;gap:14px;background:var(--pc);color:var(--on-pc);border:0;border-radius:20px;width:calc(100% - 32px);text-align:left;cursor:pointer}
.resume .pl{width:44px;height:44px;border-radius:22px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.resume .pl svg{width:24px;height:24px;fill:currentColor}
.resume b{display:block;font-weight:600}
.resume span{font-size:13px;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px 0}
.tile{border:0;text-align:left;cursor:pointer;padding:16px;border-radius:20px;background:var(--s1);display:flex;flex-direction:column;gap:10px;min-height:118px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tc,var(--primary));color:#fff}
.tile .ic svg{width:22px;height:22px;fill:currentColor}
.tile b{font-weight:600;font-size:15px;line-height:1.25}
.tile span{font-size:12px;color:var(--muted);margin-top:-6px}
.tile.main{grid-column:1/-1;background:var(--primary);color:var(--on-primary);flex-direction:row;align-items:center;min-height:0}
.tile.main .ic{background:rgba(255,255,255,.18)}
.tile.main span{color:inherit;opacity:.85;margin:0}
.tile.main .tt{flex:1;display:flex;flex-direction:column;gap:2px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:26px 16px 10px}
.sh h3{font-size:18px;font-weight:600}
.sh span{font-size:13px;color:var(--muted)}
/* doc list */
.dlist{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.ditem{border:0;width:100%;text-align:left;cursor:pointer;background:var(--surface);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;box-shadow:var(--shadow)}
.ditem:active{background:var(--s1)}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,transparent)}
.ditem .nm{font-weight:600;font-size:15px;line-height:1.3;display:block}
.ditem .mt{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.pbar{height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--dc,var(--primary));border-radius:2px}
.ditem .rt{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.ditem .rt b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:8px;background:var(--bad-c);color:var(--bad);margin-top:3px}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--s1);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{display:flex;width:100%;max-width:560px}
.bnav button{flex:1;border:0;background:none;cursor:pointer;padding:12px 0 14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.bnav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;transition:background .2s}
.bnav svg{width:24px;height:24px;fill:currentColor}
.bnav button[aria-current="page"]{color:var(--ink)}
.bnav button[aria-current="page"] .pill{background:var(--pc);color:var(--on-pc)}
.bnav .dot{position:absolute;top:0;right:10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);font-size:10px;font-weight:700;display:grid;place-items:center;color:var(--on-sig)}
/* setup */
.dhead{margin:4px 16px 0;padding:18px;border-radius:20px;background:color-mix(in srgb,var(--dc) 12%,var(--surface));border-left:5px solid var(--dc)}
.dhead b{font-size:18px;line-height:1.3;display:block}
.dhead span{font-size:13px;color:var(--muted);display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center;text-align:left}
.chip[aria-pressed="true"]{background:var(--pc);border-color:transparent;color:var(--on-pc)}
.chip[aria-pressed="true"]::before{content:"";width:14px;height:14px;flex:none;background:currentColor;-webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/contain no-repeat;mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/contain no-repeat}
.chip small{opacity:.7;font-size:12px}
.tb{border:0;background:none;color:var(--primary);font-weight:600;font-size:14px;cursor:pointer;padding:6px 8px;border-radius:8px}
.group{margin:0 16px;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.sw-row{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-top:1px solid var(--line)}
.sw-row:first-child{border-top:0}
.sw-row .tx{flex:1;min-width:0}
.sw-row .tx b{display:block;font-weight:500;font-size:15px}
.sw-row .tx small{display:block;font-size:12px;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--s2);border:2px solid var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:all .2s}
.sw:checked{background:var(--primary);border-color:var(--primary)}
.sw:checked::after{left:24px;top:2px;width:24px;height:24px;background:var(--on-primary)}
.seg{display:flex;margin:0 16px;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.seg button{flex:1;border:0;border-left:1px solid var(--line);background:none;padding:10px 0;cursor:pointer;font-size:14px;font-weight:500}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--pc);color:var(--on-pc)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.dock .in{max-width:528px;margin:0 auto}
.btn{border:0;cursor:pointer;border-radius:24px;padding:0 24px;height:48px;font-weight:600;font-size:15px;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%;height:56px;border-radius:28px;font-size:16px}
.btn.tonal{background:var(--pc);color:var(--on-pc)}
.btn.out{background:none;border:1px solid var(--line);color:var(--primary)}
.btn:disabled{opacity:.4}
.btn:active{filter:brightness(.92)}
/* quiz */
.qbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
.qprog{flex:1;height:10px;border-radius:5px;background:var(--s2);overflow:hidden}
.qprog i{display:block;height:100%;width:0;background:var(--primary);border-radius:5px;transition:width .3s}
.qc{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);padding-right:8px;white-space:nowrap}
.qwrap{padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;padding:3px 9px;border-radius:8px;background:var(--s1);color:var(--muted)}
.tag.doc{background:color-mix(in srgb,var(--dc) 14%,transparent);color:var(--dc);font-weight:600}
.tag.ex{background:var(--bad-c);color:var(--bad);font-weight:600}
.tag.hl{background:var(--marker);color:var(--marker-ink);font-weight:600}
.qtext{font-size:19px;line-height:1.45;font-weight:500;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.opt{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 14px;text-align:left;cursor:pointer;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;font-size:16px;line-height:1.4;transition:border-color .15s,background .15s,transform .1s}
.opt:active:not(:disabled){transform:scale(.985)}
.opt .k{width:32px;height:32px;border-radius:16px;background:var(--s1);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-c)}
.opt.right .k{background:var(--good);color:var(--on-sig)}
.opt.wrong{border-color:var(--bad);background:var(--bad-c)}
.opt.wrong .k{background:var(--bad);color:var(--on-sig)}
.opt.dim{opacity:.55}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .in{width:100%;max-width:560px;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);padding:10px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:62vh;display:flex;flex-direction:column;gap:10px}
.sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sheet .vd{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.sheet .vd i{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--on-sig);font-style:normal}
.sheet .vd i svg{width:22px;height:22px;fill:currentColor}
.sheet.ok .vd{color:var(--good)} .sheet.ok .vd i{background:var(--good)}
.sheet.no .vd{color:var(--bad)} .sheet.no .vd i{background:var(--bad)}
.sheet .body{overflow-y:auto;font-size:15px;line-height:1.5;color:var(--ink)}
.sheet .ca{font-weight:600;margin-bottom:6px}
.sheet .ref{font-size:12px;color:var(--muted);margin-top:8px}
.sheet.ok .btn{background:var(--good);color:var(--on-sig)}
.sheet.no .btn{background:var(--bad);color:var(--on-sig)}
.spacer{height:46vh}
/* result */
.res{margin:8px 16px 0;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.res .gr{font-size:20px;font-weight:600}
.res .sub{font-size:14px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:12px;padding:16px}
.brow .bt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.brow .bt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.btnrow{display:flex;flex-direction:column;gap:10px;margin:16px 16px 0}
/* review */
.rv{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);font-size:15px}
.rv .qq{font-weight:500;line-height:1.45}
.rv .ans{color:var(--good);font-weight:600}
.rv .your{color:var(--bad)}
.rv .ex{font-size:13px;color:var(--muted)}
.rvl{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{white-space:nowrap;flex:none}
.empty{margin:24px 16px;padding:36px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:20px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
/* terms */
.tgroup{margin:0 16px 12px;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.tgroup h4{margin:0;padding:12px 16px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--s1);font-weight:600}
.trow{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.trow:first-of-type{border-top:0}
.trow .w{grid-column:1/-1}
.trow .v{font-weight:700;font-variant-numeric:tabular-nums}
.trow .v mark{background:var(--marker);color:var(--marker-ink);padding:0 5px;border-radius:4px}
.trow .r{color:var(--primary);font-size:12px;text-align:right;align-self:end;white-space:nowrap}
.note{font-size:13px;color:var(--muted);padding:0 16px;margin-bottom:12px}
.snack{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);animation:in .2s}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){.qtext{font-size:21px}}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<section class="view" id="v-home">
  <div class="hero-top">
    <div class="t"><div class="eyebrow">Hazırlıq</div><h1>Gömrük İmtahanı</h1></div>
    <button class="ib" id="themeBtn" aria-label="Mövzunu dəyiş"></button>
  </div>
  <div class="card stat" id="statCard"></div>
  <button class="resume" id="resumeBtn" hidden></button>
  <div class="tiles" id="tiles"></div>
  <div class="sh"><h3>Sənədlər</h3><span id="docCnt"></span></div>
  <div class="dlist" id="dlist"></div>
</section>

<!-- SETUP -->
<section class="view" id="v-setup" hidden>
  <div class="bar"><button class="ib js-back" aria-label="Geri"></button><h2 id="suTitle">Test</h2></div>
  <div class="dhead" id="suHead"></div>
  <div id="chBox">
    <div class="sh"><h3>Fəsillər</h3><button class="tb" id="chAll">Hamısını seç</button></div>

yyətinin əsaslarını","Gömrük orqanlarının strukturunu və ştat cədvəlini","Gömrük rüsumlarının tətbiqi qaydalarını","Gömrük orqanlarının yalnız intizam qaydalarını"],"e":"Preambula (rənglənib): Əsasnamə gömrük orqanlarında və təşkilatlarında xidmətin qaydalarını və vəzifəli şəxslərin hüquqi vəziyyətinin əsaslarını müəyyən edir.","hl":1},{"d":0,"c":0,"id":"xidmet-3","r":"Maddə 1","q":"1-ci maddəyə görə gömrük orqanlarında xidmət nədir?","o":["Hüquq mühafizə orqanları sisteminə daxil olan gömrük orqanlarında dövlət qulluğunun xüsusi növü","İcra hakimiyyəti orqanlarında inzibati dövlət qulluğunun ümumi növü","Hərbi xidmətin xüsusi növü","Siyasi vəzifə tutan şəxslərin qulluq növü"],"e":"Maddə 1 (qırmızı ilə vurğulanıb): xidmət hüquq mühafizə orqanları sisteminə daxil olan gömrük orqanlarında vətəndaşların həyata keçirdiyi dövlət qulluğunun xüsusi növüdür.","hl":1},{"d":0,"c":0,"id":"xidmet-4","r":"Maddə 2","q":"Gömrük orqanlarında xidmət haqqında qanunvericilik ilk növbədə nəyə əsaslanır?","o":["Azərbaycan Respublikasının Konstitusiyasına","Gömrük Məcəlləsinə","Əmək Məcəlləsinə","“Dövlət qulluğu haqqında” Qanuna"],"e":"Maddə 2: qanunvericilik Konstitusiyaya əsaslanır və Gömrük Məcəlləsindən, bu Əsasnamədən və digər normativ hüquqi aktlardan ibarətdir.","hl":1},{"d":0,"c":0,"id":"xidmet-5","r":"Maddə 2","q":"Əmək münasibətlərinə dair Əsasnamədə nəzərdə tutulmayan məsələlər nə ilə tənzimlənir?","o":["Əmək Məcəlləsinin müvafiq normaları ilə","“Dövlət qulluğu haqqında” Qanunla","DGK-nın əmrləri ilə","Gömrük Məcəlləsi ilə"],"e":"Maddə 2, üçüncü abzas (qırmızı): Əsasnamədə nəzərdə tutulmayan əmək məsələləri Əmək Məcəlləsinin müvafiq normaları ilə tənzimlənir.","hl":1},{"d":0,"c":0,"id":"xidmet-6","r":"Maddə 2","q":"Gömrük orqanlarında xüsusi rütbə nəzərdə tutulmayan vəzifələrdə işləyən şəxslərin qulluq keçməsi nə ilə tənzimlənir?","o":["“Dövlət qulluğu haqqında” Qanunla","Əmək Məcəlləsi ilə","Bu Əsasnamə ilə","Gömrük Məcəlləsi ilə"],"e":"Maddə 2: xüsusi rütbə nəzərdə tutulmayan vəzifələr “Dövlət qulluğu haqqında” Qanunla, dövlət qulluqçusu olmayan işçilər (xadimə, gözətçi və s.) isə Əmək Məcəlləsi ilə tənzimlənir.","hl":1},{"d":0,"c":0,"id":"xidmet-7","r":"Maddə 2","q":"Gömrük orqanında işləyən ocaqçının (dövlət qulluqçusu olmayan işçinin) əmək münasibətləri nə ilə tənzimlənir?","o":["Əmək Məcəlləsinin müvafiq normaları ilə","“Dövlət qulluğu haqqında” Qanunla","Bu Əsasnamə ilə","Nazirlər Kabinetinin qərarı ilə"],"e":"Maddə 2: xadimə, dalandar, bağban, gözətçi, ocaqçı, ixtisas dərəcəsi olmayan fəhlə kimi işçilərin əmək münasibətləri Əmək Məcəlləsi ilə tənzimlənir."},{"d":0,"c":0,"id":"xidmet-8","r":"Maddə 2","q":"“Dövlət qulluğu haqqında” Qanunun hansı maddəsi gömrük orqanlarına xidmətə qəbul edilən şəxslərə ayrıca şamil edilir?","o":["15-1-ci maddəsi","15-ci maddəsi","9-cu maddəsi","5.1-ci maddəsi"],"e":"Maddə 2, ikinci abzas: həmin Qanunun 15-1-ci maddəsi gömrük orqanlarına xidmətə qəbul edilənlərə şamil edilir.","t":1},{"d":0,"c":0,"id":"xidmet-9","r":"Maddə 3","q":"Əsasnaməyə görə “gömrük orqanlarının vəzifəli şəxsi” sayılmaq üçün hansı şərtlər birlikdə tələb olunur?","o":["Vahid sistem təşkil edən gömrük orqanlarında vəzifə tutmaq və Əsasnamədə nəzərdə tutulmuş qaydada xüsusi rütbə almış olmaq","Gömrük orqanlarında vəzifə tutmaq və sınaq müddətini bitirmək","Xüsusi rütbə almaq və and içmək","Dövlət qulluğuna qəbul olunmaq və attestasiyadan keçmək"],"e":"Maddə 3 (imtahan sualı): vəzifəli şəxs vahid sistem təşkil edən gömrük orqanlarında vəzifə tutan və xüsusi rütbə verilmiş vətəndaşdır. Hər iki şərt birlikdə lazımdır.","hl":1,"ex":1},{"d":0,"c":0,"id":"xidmet-10","r":"Maddə 3","q":"Xidmət münasibətlərinin tənzimlənməsi üçün gömrük orqanlarında neçə heyət kateqoriyası müəyyən edilir?","o":["4: kiçik heyət, orta, baş və ali rəis heyəti","3: kiçik, orta və ali heyət","5: kiçik, orta, baş, ali və tibb heyəti","2: rəis heyəti və sıravi heyət"],"e":"Maddə 3 və 8: kiçik heyət, orta rəis, baş rəis və ali rəis heyəti.","t":1},{"d":0,"c":0,"id":"xidmet-11","r":"Maddə 4","q":"Xüsusi geyim forması ilə bağlı səlahiyyətlərin düzgün bölgüsü hansıdır?","o":["Fərqlənmə nişanlarının təsviri: Prezident; təchizat normaları: Nazirlər Kabineti; daşınma qaydaları: DGK","Təsvir: DGK; təchizat normaları: Prezident; daşınma qaydaları: Nazirlər Kabineti","Təsvir: Nazirlər Kabineti; təchizat normaları: DGK; daşınma qaydaları: Prezident","Hamısını DGK müəyyən edir"],"e":"Maddə 4 (qırmızı): təsviri PR, təchizat normalarını NK, daşınma qaydalarını DGK müəyyən edir.","hl":1},{"d":0,"c":0,"id":"xidmet-12","r":"Maddə 4","q":"Gömrük orqanlarının vəzifəli şəxslərinə xüsusi geyim forması necə verilir?","o":["Pulsuz","Dəyərinin 50 faizi ödənilməklə","Əmək haqqından tutulmaqla","İlk dəfə pulsuz, sonrakılar ödənişli"],"e":"Maddə 4: xüsusi geyim forması pulsuz verilir. Maddə 98-ə görə DGK-nın qərarı ilə növbəti forma əvəzinə pul kompensasiyası da ödənilə bilər."},{"d":0,"c":0,"id":"xidmet-13","r":"Maddə 5","q":"Xidməti vəsiqələrin qaydası, forması və etibarlılıq müddəti kim tərəfindən müəyyən edilir?","o":["Dövlət Gömrük Komitəsi","Nazirlər Kabineti","Azərbaycan Respublikasının Prezidenti","Daxili İşlər Nazirliyi"],"e":"Maddə 5 (mavi ilə rənglənib): xidməti vəsiqələr DGK-nın müəyyən etdiyi qaydada, formada və etibarlılıq müddətinə verilir.","hl":1},{"d":0,"c":0,"id":"xidmet-14","r":"Maddə 6","q":"Gömrük orqanlarında istifadə olunan xüsusi vasitələrin, odlu silahın və döyüş sursatının siyahısını kim müəyyən edir?","o":["Müvafiq icra hakimiyyəti orqanı","DGK-nın sədri","Milli Məclis","Gömrük Məcəlləsi"],"e":"Maddə 6: siyahını müvafiq icra hakimiyyəti orqanı müəyyən edir. Fiziki qüvvənin və silahın tətbiqi halları isə Gömrük Məcəlləsi ilə müəyyən edilir."},{"d":0,"c":0,"id":"xidmet-15","r":"Maddə 7","q":"Gömrük xidməti və tibb xidməti rütbələri birlikdə sayılarsa, 7-ci maddədə cəmi neçə xüsusi rütbə var?","o":["23","13","20","26"],"e":"13 pillə var. 1–10-cu pillələrdə gömrük və tibb variantı var (20 rütbə), 11–13-cü pillələr yalnız gömrük xidməti üçündür (3 rütbə): 20 + 3 = 23.","t":1},{"d":0,"c":0,"id":"xidmet-16","r":"Maddə 7","q":"Aşağıdakı rütbələrdən hansı Əsasnamədə YOXDUR?","o":["Tibb xidməti general-leytenantı","Tibb xidməti general-mayoru","Tibb xidməti baş giziri","Tibb xidməti polkovnik-leytenantı"],"e":"Tibb xidmətində ən yüksək rütbə general-mayordur. General-leytenant, general-polkovnik və həqiqi dövlət gömrük xidməti müşaviri yalnız gömrük xidməti üçündür."},{"d":0,"c":0,"id":"xidmet-17","r":"Maddə 7","q":"Gömrük orqanlarında ən yüksək xüsusi rütbə hansıdır?","o":["Azərbaycan Respublikasının həqiqi dövlət gömrük xidməti müşaviri","Gömrük xidməti general-polkovniki","Gömrük xidməti general-leytenantı","Dövlət gömrük xidməti baş müşaviri"],"e":"Maddə 7, 13-cü bənd: həqiqi dövlət gömrük xidməti müşaviri."},{"d":0,"c":0,"id":"xidmet-18","r":"Maddə 8","q":"Tibb xidməti general-mayoru hansı heyətə aiddir?","o":["Ali rəis heyətinə","Baş rəis heyətinə","Orta rəis heyətinə","Ayrıca tibb heyətinə"],"e":"Maddə 8, 4-cü bənd: ali rəis heyətinə gömrük generalları, həqiqi dövlət gömrük xidməti müşaviri və tibb xidməti general-mayoru daxildir."},{"d":0,"c":0,"id":"xidmet-19","r":"Maddə 8","q":"Gömrük xidməti kapitanı hansı heyətə aiddir?","o":["Orta rəis heyətinə","Baş rəis heyətinə","Kiçik heyətə","Ali rəis heyətinə"],"e":"Maddə 8: orta rəis heyəti kiçik leytenantdan kapitana qədərdir. Baş rəis heyəti mayordan başlayır."},{"d":0,"c":0,"id":"xidmet-20","r":"Maddə 8","q":"Baş rəis heyətinə hansı rütbələr daxildir?","o":["Mayor, polkovnik-leytenant, polkovnik","Kapitan, mayor, polkovnik-leytenant","Mayor, polkovnik-leytenant, polkovnik, general-mayor","Baş leytenant, kapitan, mayor"],"e":"Maddə 8, 3-cü bənd: baş rəis heyəti mayor, polkovnik-leytenant və polkovnikdən ibarətdir (gömrük və tibb xidməti)."},{"d":0,"c":0,"id":"xidmet-21","r":"Maddə 8","q":"Vəzifəli şəxs pensiya hüququ ilə xidmətdən azad edildikdə xüsusi rütbəsinə hansı söz əlavə olunur?","o":["“istefada olan”","“ehtiyatda olan”","“təqaüddə olan”","“fəxri”"],"e":"Maddə 8, son abzas (rənglənib): rütbəyə “istefada olan” sözü əlavə olunur.","hl":1},{"d":0,"c":1,"id":"xidmet-22","r":"Maddə 9","q":"Aşağıdakılardan hansı 9-cu maddədə gömrük xidmətinin təşkili prinsipləri arasında YOXDUR?","o":["Kollegiallıq","Humanizm","Müvafiq dövlət hakimiyyəti orqanları qarşısında cavabdehlik","Xidmət fəaliyyətinin nəticələrinə və ixtisasa görə xidməti irəliləyiş"],"e":"Maddə 9: qanunçuluq, humanizm, cavabdehlik, intizama və etik davranış qaydalarına riayət, nəticələrə və ixtisasa görə irəliləyiş. Kollegiallıq siyahıda yoxdur."},{"d":0,"c":1,"id":"xidmet-23","r":"Maddə 10","q":"10-cu maddəyə görə vəzifəli şəxs olmaq üçün dil ilə bağlı hansı tələb var?","o":["Dövlət dilini sərbəst bilmək","Dövlət dilini və bir xarici dili bilmək","Dövlət dilindən sertifikatı olmaq","Dil tələbi yoxdur"],"e":"Maddə 10 (qırmızı): Azərbaycan Respublikasının dövlət dilini sərbəst bilən vətəndaşlar.","hl":1},{"d":0,"c":1,"id":"xidmet-24","r":"Maddə 11","q":"Xidmətə qəbul hansı prinsiplər əsasında həyata keçirilir?","o":["Könüllülük, müsabiqə və şəffaflıq","Könüllülük, rotasiya və müsabiqə","Müsabiqə, tövsiyə və şəffaflıq","Məcburilik, müsabiqə və aşkarlıq"],"e":"Maddə 11: könüllülük prinsipi, müsabiqə və şəffaflıq."},{"d":0,"c":1,"id":"xidmet-25","r":"Maddə 11","q":"Xidmətə qəbul üzrə müsabiqə nədən ibarətdir və onun qaydasını kim müəyyən edir?","o":["Test imtahanı və müsahibə; qaydanı Prezident müəyyən edir","Test imtahanı və müsahibə; qaydanı DGK müəyyən edir","Yalnız test imtahanı; qaydanı Nazirlər Kabineti müəyyən edir","Test, müsahibə və fiziki hazırlıq; qaydanı DGK müəyyən edir"],"e":"Maddə 11 (rənglənib): müsabiqə test imtahanından və müsahibədən ibarətdir və Prezidentin müəyyən etdiyi qaydada keçirilir.","hl":1},{"d":0,"c":1,"id":"xidmet-26","r":"Maddə 12","q":"12-ci maddəyə görə vətəndaş xidmətə qəbul olunarkən neçə növ sənəd təqdim edir?","o":["8","6","7","10"],"e":"Ərizə, şəxsiyyət vəsiqəsi, əmək kitabçası, təhsil sənədi, tibbi arayış, tərcümeyi-hal, qohumlar haqqında məlumat, hərbi bilet: 8.","t":1},{"d":0,"c":1,"id":"xidmet-27","r":"Maddə 12","q":"Aşağıdakı sənədlərdən hansı 12-ci maddədə tələb olunanlar arasında YOXDUR?","o":["Əvvəlki iş yerindən xasiyyətnamə","Tərcümeyi-hal","Hərbi bilet və ya digər hərbi uçot sənədi","Sağlamlığın vəziyyəti haqqında tibbi arayış"],"e":"Xasiyyətnamə siyahıda yoxdur. Qalan üçü 12-ci maddədə var."},{"d":0,"c":1,"id":"xidmet-28","r":"Maddə 12","q":"Əmək kitabçası xidmətə qəbul zamanı hansı şərtlə təqdim edilir?","o":["Olduğu halda","Hər bir halda məcburidir","Yalnız ali rəis heyəti vəzifələrinə qəbulda","Yalnız 30 yaşdan yuxarı şəxslərdən"],"e":"Maddə 12, 3-cü bənd (sarı): “əmək kitabçası (olduğu halda)”.","hl":1},{"d":0,"c":1,"id":"xidmet-29","r":"Maddə 12","q":"Namizəd hansı şəxs haqqında məlumat təqdim etmək məcburiyyətində DEYİL?","o":["Əmisi (dayısı)","Doğma bacısı","Həyat yoldaşı","Himayəsində olan şəxs"],"e":"Maddə 12, 7-ci bənd: ata (ana), ər (arvad), oğul (qız), doğma qardaş (bacı) və himayəsində olanlar. Əmi və dayı siyahıda yoxdur."},{"d":0,"c":1,"id":"xidmet-30","r":"Maddə 12-1","q":"Lazımi sənədi Elektron Hökumət İnformasiya Sistemi vasitəsilə əldə etmək mümkün deyilsə, nə edilir?","o":["Vətəndaşın razılığı ilə sorğu əsasında müvafiq orqandan tələb olunur və ya vətəndaş özü təqdim edir","Vətəndaşın qəbulundan imtina edilir","Sənəd tələb edilmədən qəbul həyata keçirilir","Yalnız notarial qaydada təsdiqlənmiş surət tələb olunur"],"e":"Maddə 12-1: EHİS vasitəsilə mümkün olduqda sənəd vətəndaşdan tələb edilmir. Mümkün olmadıqda vətəndaşın razılığı ilə sorğu edilir və ya vətəndaş özü təmin edir."},{"d":0,"c":1,"id":"xidmet-31","r":"Maddə 14","q":"Yoxlama nəticəsində qəbula maneə müəyyən olunarsa, vətəndaşa imtinanın səbəbləri barədə hansı müddətdə və hansı formada məlumat verilir?","o":["Bir ay müddətində, yazılı formada","10 gün müddətində, yazılı formada","Bir ay müddətində, şifahi və ya yazılı formada","İki həftə müddətində, elektron formada"],"e":"Maddə 14: bir ay müddətində yazılı formada.","t":1},{"d":0,"c":1,"id":"xidmet-32","r":"Maddə 15","q":"Aşağıdakı şəxslərdən hansı 15-ci maddənin birinci hissəsinə görə xidmətə qəbul üçün QADAĞAN SİYAHISINA DÜŞMÜR?","o":["Məhkumluğu qanunla müəyyən edilmiş qaydada götürülmüş şəxs","İkili vətəndaşlığı olan şəxs","Din xadimi","Digər dövlətlər qarşısında öhdəlikləri olan şəxs"],"e":"Maddə 15 (rənglənib) yalnız məhkumluğu ödənilməmiş və ya götürülməmiş şəxsləri qadağan edir. Məhkumluğu götürülmüş şəxs bu bəndə düşmür.","hl":1},{"d":0,"c":1,"id":"xidmet-33","r":"Maddə 15","q":"Fəaliyyət qabiliyyəti olmayan və ya məhdud fəaliyyət qabiliyyətli şəxsin qəbul edilməməsi üçün hansı əsas tələb olunur?","o":["Məhkəmənin qanuni qüvvəyə minmiş qərarı","Tibb komissiyasının rəyi","DGK-nın xidməti araşdırması","Polisin arayışı"],"e":"Maddə 15: “məhkəmənin qanuni qüvvəyə minmiş qərarı ilə fəaliyyət qabiliyyəti olmayan və ya məhdud fəaliyyət qabiliyyətli hesab edilmiş” şəxslər.","hl":1},{"d":0,"c":1,"id":"xidmet-34","r":"Maddə 15","q":"“Bir qayda olaraq” yaşı 30-u keçmiş vətəndaşlar xidmətə qəbul edilmir. Bu qaydadan istisna hansıdır?","o":["Ali rəis heyəti üçün nəzərdə tutulan vəzifələrə qəbul olunanlar","Elmi dərəcəsi olanlar","Hərbi xidməti keçmiş şəxslər","Dövlət qulluğunda 5 ildən çox işləmiş şəxslər"],"e":"Maddə 15, ikinci hissə (qırmızı “bir qayda olaraq”): istisna yalnız ali rəis heyəti vəzifələrinə qəbul olunanlardır.","hl":1,"t":1},{"d":0,"c":1,"id":"xidmet-35","r":"Maddə 15","q":"Müddətli həqiqi hərbi xidmət keçməmiş çağırış yaşlı vətəndaşlardan kim xüsusi rütbəli vəzifəyə qəbul edilə BİLƏR?","o":["Qanuni əsaslarla çağırışdan möhlət hüququ olan şəxs","Hərbi xidmətdən yayınmış, lakin ali təhsilli şəxs","Müsabiqədə ən yüksək bal toplayan istənilən şəxs","Yalnız qadınlar"],"e":"Maddə 15 (sarı): möhlət hüququ olanlar və çağırışdan azad edilənlər istisnadır.","hl":1},{"d":0,"c":1,"id":"xidmet-36","r":"Maddə 15","q":"Təhsil tələbləri ilə bağlı hansı doğrudur?","o":["Kiçik heyətə ən azı tam orta və orta ixtisas təhsilli, orta, baş və ali rəis heyətinə yalnız müvafiq ali təhsilli şəxslər","Bütün heyətlərə yalnız ali təhsilli şəxslər","Kiçik və orta rəis heyətinə orta təhsil kifayətdir","Ali rəis heyətinə magistr dərəcəsi tələb olunur"],"e":"Maddə 15, son abzas (rənglənib).","hl":1},{"d":0,"c":1,"id":"xidmet-37","r":"Maddə 16","q":"Aşağıdakılardan hansı gömrük orqanının vəzifəli şəxsi üçün QADAĞAN DEYİL?","o":["Həmkarlar ittifaqlarına birləşmək","Tətillərin keçirilməsində iştirak etmək","Siyasi partiyanın işində iştirak etmək","Gömrük məsələləri üzrə üçüncü şəxsin müvəkkili olmaq"],"e":"Tətil, siyasi partiya və müvəkkillik 16-cı maddə ilə qadağandır. Həmkarlar ittifaqlarına birləşmək isə 43-cü maddədə hüquq kimi göstərilib.","hl":1},{"d":0,"c":1,"id":"xidmet-38","r":"Maddə 16","q":"Əvəzçilik şərti ilə ödənişli işlərdən hansına icazə verilir?","o":["Elmi-tədris və yaradıcılıq fəaliyyətinə","Hüquq məsləhətçiliyinə","DGK-nın icazəsi ilə istənilən işə","Heç birinə icazə verilmir"],"e":"Maddə 16, 8-ci bənd: elmi-tədris və yaradıcılıq fəaliyyətindən başqa.","hl":1},{"d":0,"c":1,"id":"xidmet-39","r":"Maddə 16","q":"Sahibkarlıq fəaliyyəti ilə bağlı qadağa necə müəyyən olunub?","o":["Vasitəçilərin köməyi ilə də sahibkarlıqla məşğul olmaq qadağandır","Yalnız şəxsən sahibkarlıq qadağandır","DGK-nın razılığı ilə icazə verilir","Yalnız gömrük işi ilə bağlı sahibkarlıq qadağandır"],"e":"Maddə 16, 1-ci bənd: “o cümlədən vasitəçilərin köməyi ilə”."},{"d":0,"c":1,"id":"xidmet-40","r":"Maddə 16","q":"16-cı maddənin 1-1-ci bəndi “Korrupsiyaya qarşı mübarizə haqqında” Qanunun hansı maddəsinə istinad edir?","o":["9-cu maddəsinə","5.1-ci maddəsinə","15-1-ci maddəsinə","7-ci maddəsinə"],"e":"Maddə 16, 1-1: həmin Qanunun 9-cu maddəsindəki korrupsiya hüquqpozmaları. 5.1-ci maddəyə 69-cu maddə istinad edir.","t":1},{"d":0,"c":1,"id":"xidmet-41","r":"Maddə 17","q":"Vəzifəyə ilk dəfə təyin edilən şəxslərə hansı sınaq müddəti müəyyən edilə bilər?","o":["6 aya qədər","3 aya qədər","1 ilə qədər","6 aydan 1 ilədək"],"e":"Maddə 17 (rənglənib): 6 aya qədər.","hl":1,"t":1},{"d":0,"c":1,"id":"xidmet-42","r":"Maddə 17","q":"Sınaq müddəti müəyyən edilmiş şəxs bu müddətdə nə alır?","o":["Xüsusi rütbə verilmədən təyin olunur və yalnız vəzifə maaşı alır","İlk xüsusi rütbəni alır, lakin əlavələr ödənilmir","Vəzifə maaşının 50 faizini alır","Tam əmək haqqı və rütbə əlavəsi alır"],"e":"Maddə 17: xüsusi rütbə verilmədən təyin olunur və həmin müddətdə yalnız vəzifə maaşı alır."},{"d":0,"c":1,"id":"xidmet-43","r":"Maddə 18","q":"Sınaq müddəti harada göstərilir və onu kim qısalda bilər?","o":["İşə qəbula dair əmrdə; DGK qısalda bilər","Əmək müqaviləsində; birbaşa rəis qısalda bilər","Şəxsi işdə; Nazirlər Kabineti qısalda bilər","İşə qəbul əmrində; qısaldıla bilməz"],"e":"Maddə 18: sınaq müddəti işə qəbul əmrində göstərilir və DGK tərəfindən qısaldıla bilər."},{"d":0,"c":1,"id":"xidmet-44","r":"Maddə 18-1","q":"Xidmətə qəbul edilən dövlət qulluqçusunun ixtisas dərəcəsi xüsusi rütbəyə uyğunlaşdırılarkən sınaq müddəti necə olur?","o":["Sınaq müddəti müəyyən edilmir","3 aya qədər müəyyən edilir","6 aya qədər müəyyən edilir","DGK-nın qərarı ilə 1 ilədək"],"e":"Maddə 18-1 (rənglənib): sınaq müddəti müəyyən edilmir.","hl":1},{"d":0,"c":1,"id":"xidmet-45","r":"Maddə 20","q":"Kimlərə sınaq müddəti müəyyən edilmir və daimi qulluğa qəbul edilir?","o":["Rəhbər vəzifələrə təyin olunanlara və elmi dərəcəsi olan şəxslərə","Ali təhsilli bütün şəxslərə","Hərbi xidməti keçmiş şəxslərə","Müsabiqədə 90 baldan çox toplayanlara"],"e":"Maddə 20 (rənglənib).","hl":1},{"d":0,"c":1,"id":"xidmet-46","r":"Maddə 19","q":"Sınaq müddəti ilə bağlı hansı fikir DOĞRUDUR?","o":["Xidmət stajına daxil edilir, xidmət illərinə görə əlavələrdə və pensiya təyinində nəzərə alınır","Staja daxil edilmir","Staja daxildir, lakin pensiyada nəzərə alınmır","Yalnız sınaq qənaətbəxş olduqda staja daxil edilir"],"e":"Maddə 19, ikinci abzas."},{"d":0,"c":1,"id":"xidmet-47","r":"Maddə 20","q":"Sınağın keçirilməsi qaydası və şərtləri kim tərəfindən müəyyən edilir?","o":["DGK","Nazirlər Kabineti","Prezident","Birbaşa rəis"],"e":"Maddə 20, ikinci abzas."},{"d":0,"c":1,"id":"xidmet-48","r":"Maddə 21","q":"Vəzifəli şəxslərin peşə hazırlığı və əlavə təhsili xarici dövlətlərin təhsil müəssisələrində necə həyata keçirilir?","o":["Müqavilə əsasında","Yalnız Prezidentin sərəncamı ilə","Həyata keçirilə bilməz","Şəxsin öz vəsaiti hesabına"],"e":"Maddə 21: DGK-nın təhsil müəssisəsində, digər yerli və xarici təhsil müəssisələrində müqavilə əsasında."},{"d":0,"c":2,"id":"xidmet-49","r":"Maddə 22","q":"Xüsusi rütbələr ardıcıl qaydada verilir. Bu qaydadan istisnanı hansı maddə müəyyən edir?","o":["29-cu maddə","25-ci maddə","34-cü maddə","66-cı maddə"],"e":"Maddə 22: rütbələr fərdi və ardıcıl qaydada verilir (29-cu maddədə nəzərdə tutulmuş hallar istisna olmaqla)."},{"d":0,"c":2,"id":"xidmet-50","r":"Maddə 23","q":"“Gömrük xidməti polkovniki” xüsusi rütbəsini kim verir?","o":["DGK","Prezident","Nazirlər Kabineti","Milli Məclis"],"e":"Maddə 23: kiçik, orta və baş rəis heyəti rütbələri, gömrük xidməti polkovniki və tibb xidməti polkovniki də daxil olmaqla, DGK tərəfindən verilir. Prezident yalnız ali rəis heyəti rütbələrini verir."},{"d":0,"c":2,"id":"xidmet-51","r":"Maddə 23","q":"Gömrük xidməti general-mayoru rütbəsini kim verir?","o":["Prezident","DGK","Nazirlər Kabineti","Milli Məclis"],"e":"Maddə 23: ali rəis heyəti rütbələrini Prezident verir."},{"d":0,"c":2,"id":"xidmet-52","r":"Maddə 24","q":"Əsasnamə qüvvəyə minənədək xidmət edən vəzifəli şəxslərə xüsusi rütbələrin verilmə qaydasını kim müəyyən edir?","o":["Prezident","DGK","Nazirlər Kabineti","Milli Məclis"],"e":"Maddə 24."},{"d":0,"c":2,"id":"xidmet-53","r":"Maddə 25","q":"Növbəti xüsusi rütbə hansı iki şərt birlikdə olduqda verilir?","o":["Ştat üzrə tutduğu vəzifənin rütbəsinə uyğun olduqda və əvvəlki rütbədə xidmət illəri bitdikdə","Attestasiyadan keçdikdə və intizam tənbehi olmadıqda","Xidmət illəri bitdikdə və birbaşa rəis təqdimat verdikdə","Ali təhsil olduqda və 5 il staj olduqda"],"e":"Maddə 25 (rənglənib).","hl":1},{"d":0,"c":2,"id":"xidmet-54","r":"Maddə 26","q":"Gömrük xidməti giziri rütbəsində xidmət müddəti nə qədərdir?","o":["5 il","1 il","2 il","Müəyyən edilmir"],"e":"Maddə 26 (bənövşəyi ilə rənglənib): gizir, 5 il.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-55","r":"Maddə 26","q":"Gömrük xidməti baş giziri rütbəsində xidmət müddəti nə qədərdir?","o":["Müəyyən edilmir","5 il","3 il","2 il"],"e":"Maddə 26, son abzas (rənglənib): baş gizir, polkovnik və daha yüksək rütbələr üçün xidmət illəri müəyyən edilmir.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-56","r":"Maddə 26","q":"Gömrük xidməti kiçik leytenantı rütbəsində xidmət müddəti nə qədərdir?","o":["1 il","2 il","3 il","6 ay"],"e":"Maddə 26 (yaşıl): kiçik leytenant, 1 il.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-57","r":"Maddə 26","q":"Xüsusi rütbələrdə xidmət müddətlərinin düzgün ardıcıllığı hansıdır (leytenant, baş leytenant, kapitan, mayor)?","o":["2 il, 2 il, 3 il, 4 il","2 il, 3 il, 3 il, 4 il","1 il, 2 il, 3 il, 5 il","2 il, 2 il, 4 il, 5 il"],"e":"Maddə 26: leytenant 2, baş leytenant 2, kapitan 3, mayor 4 il.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-58","r":"Maddə 26","q":"Gömrük xidməti polkovnik-leytenantı rütbəsində xidmət müddəti nə qədərdir?","o":["5 il","4 il","3 il","Müəyyən edilmir"],"e":"Maddə 26 (bənövşəyi): polkovnik-leytenant, 5 il. Polkovnik üçün müəyyən edilmir.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-59","r":"Maddə 26","q":"Kiçik leytenant rütbəsini yenicə almış şəxs vaxtından əvvəl rütbə almadan mayor rütbəsini ən tez neçə ildən sonra ala bilər?","o":["8 il","10 il","7 il","12 il"],"e":"Kiçik leytenant 1 + leytenant 2 + baş leytenant 2 + kapitan 3 = 8 il.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-60","r":"Maddə 26","q":"26-cı maddədə müəyyən edilmiş rütbədə xidmət illəri hansı heyətlərə aiddir?","o":["Kiçik, orta rəis və baş rəis heyətinə","Bütün heyətlərə, ali rəis heyəti də daxil olmaqla","Yalnız orta və baş rəis heyətinə","Yalnız kiçik heyətə"],"e":"Maddə 26, birinci abzas (rənglənib): kiçik, orta rəis və baş rəis heyəti üçün.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-61","r":"Maddə 29","q":"Kapitan rütbəsi olan şəxsə xüsusi şəxsi xidmətlərinə görə növbəti rütbə ən tez nə vaxt verilə bilər?","o":["1 il 6 aydan sonra","1 ildən sonra","2 ildən sonra","3 ildən sonra"],"e":"Maddə 29: müəyyən olunmuş xidmət illərinin yarısı keçdikdən sonra. Kapitan üçün 3 il, yarısı 1,5 ildir.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-62","r":"Maddə 29","q":"Vaxtından əvvəl rütbə verilərkən yuxarı hədd nədir?","o":["Tutduğu vəzifə üçün ştat üzrə nəzərdə tutulmuş rütbədən bir pillə yüksək olmamaq","Ştat rütbəsindən iki pillə yüksək olmamaq","Ştat rütbəsindən yüksək olmamaq","Məhdudiyyət yoxdur"],"e":"Maddə 29 (rənglənib).","hl":1},{"d":0,"c":2,"id":"xidmet-63","r":"Maddə 29","q":"Rütbənin vaxtından əvvəl və vəzifə rütbəsindən bir pillə yuxarı verilməsinə bütün xidmət müddətində neçə dəfə yol verilir?","o":["Yalnız 2 dəfə","Yalnız 1 dəfə","3 dəfə","Hər rütbədə 1 dəfə"],"e":"Maddə 29, ikinci abzas (rənglənib): yalnız 2 dəfə.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-64","r":"Maddə 29","q":"Kiçik heyətdə olan gizir orta rəis heyəti vəzifəsinə təyin olunur. Ona hansı rütbə verilir?","o":["Mövcud rütbədə xidmət müddətindən asılı olmayaraq orta rəis heyətinin ilk rütbəsi (kiçik leytenant)","Yalnız gizir rütbəsində 5 il bitdikdən sonra baş gizir","Birbaşa leytenant","Attestasiyadan sonra kapitan"],"e":"Maddə 29, üçüncü abzas: həmin heyətin ilk xüsusi rütbəsi verilir."},{"d":0,"c":2,"id":"xidmet-65","r":"Maddə 30","q":"Təhsil müəssisəsində dinləyici (adyunkt, doktorant) olan vəzifəli şəxsə növbəti rütbə hansı vəzifəyə uyğun verilir?","o":["Tədrisə qədər ştat üzrə tutduğu vəzifəyə; bitirdikdən sonra isə təyin olunduğu vəzifəyə","Təhsil müddətində rütbə verilmir","Təhsil müəssisəsinin rəhbərinin təqdimatına görə","Yalnız bitirdikdən sonra təyin olunduğu vəzifəyə"],"e":"Maddə 30."},{"d":0,"c":2,"id":"xidmet-66","r":"Maddə 31","q":"Növbəti xüsusi rütbədə xidmət illəri hansı gündən hesablanır?","o":["Əvvəlki rütbədə xidmət illərinin bitdiyi gündən","Növbəti rütbə haqqında əmrin imzalandığı gündən","Rütbənin təqdim edildiyi gündən","Növbəti təqvim ilinin əvvəlindən"],"e":"Maddə 31, ikinci abzas (rənglənib). Birinci abzasa görə isə xidmət illəri rütbənin verildiyi gündən hesablanır.","hl":1},{"d":0,"c":2,"id":"xidmet-67","r":"Maddə 32","q":"İntizam tənbehi qaydasında aşağı salınmış rütbədə keçən xidmət müddəti ilə bağlı hansı doğrudur?","o":["Bərpa olunmuş rütbədə xidmət illərinə əlavə edilmir","Bərpa olunmuş rütbədə xidmət illərinə tam əlavə edilir","Yarısı əlavə edilir","DGK-nın qərarı ilə əlavə edilə bilər"],"e":"Maddə 32, birinci abzas."},{"d":0,"c":2,"id":"xidmet-68","r":"Maddə 32","q":"Barəsində cinayət işi qaldırılan vəzifəli şəxsə növbəti rütbə nə vaxta qədər verilmir?","o":["Cinayət işinə bəraətverici əsaslarla xitam verilənədək","İstintaq başlayandan 6 ay keçənədək","Məhkəmə hökmü çıxanadək, nəticəsindən asılı olmayaraq","Cinayət işi rütbənin verilməsinə təsir etmir"],"e":"Maddə 32, ikinci abzas."},{"d":0,"c":2,"id":"xidmet-69","r":"Maddə 33","q":"Növbəti rütbənin verilməsi əsassız gecikdirilibsə, sonrakı rütbə üçün xidmət illəri nə vaxtdan hesablanır?","o":["Əvvəlki rütbədə xidmət illərinin bitdiyi vaxtdan","Rütbənin faktiki verildiyi gündən","Gecikmənin müəyyən edildiyi gündən","Növbəti attestasiya günündən"],"e":"Maddə 33 (rənglənib).","hl":1},{"d":0,"c":2,"id":"xidmet-70","r":"Maddə 33-1","q":"33-1-ci maddəyə görə sərəncamda olan işçilərdən hansılar bu maddənin güzəştinə DÜŞMÜR?","o":["İntizam tənbehi qaydasında vəzifədən azad edilərək sərəncamda olanlar","Təşkilati-ştat tədbirləri ilə əlaqədar sərəncamda olanlar","Barəsində xidməti araşdırması müsbət rəylə bitənlər","Məhkəmə hökmü ilə bəraət alanlar"],"e":"Maddə 33-1: intizam tənbehi qaydasında vəzifədən azad edilib sərəncamda olanlar istisnadır."},{"d":0,"c":2,"id":"xidmet-71","r":"Maddə 34","q":"34-cü maddəyə görə hansı rütbəli vəzifəli şəxsin rütbəsi intizam qaydalarını pozduğuna görə aşağı salına BİLMƏZ?","o":["Gömrük xidməti kiçik leytenantı","Gömrük xidməti leytenantı","Gömrük xidməti kapitanı","Gömrük xidməti polkovniki"],"e":"Maddə 34 (rənglənib) leytenantdan polkovnikə qədər rütbələri sadalayır. Kiçik leytenant, gizir, baş gizir və ali rəis heyəti rütbələri siyahıda yoxdur.","hl":1},{"d":0,"c":2,"id":"xidmet-72","r":"Maddə 35","q":"Xüsusi rütbənin aşağı salınması haqqında qərar nəyin əsasında qəbul edilir?","o":["Xidməti araşdırmanı aparmış müvafiq orqanın rəyi əsasında","Attestasiya komissiyasının qiyməti əsasında","Məhkəmə qərarı əsasında","Birbaşa rəisin şifahi göstərişi əsasında"],"e":"Maddə 35."},{"d":0,"c":2,"id":"xidmet-73","r":"Maddə 36","q":"Rütbəsi aşağı salınmış şəxs hansı şərtlə əvvəlki rütbəsinə bərpa olunur və bu məsələni kim həll edir?","o":["Attestasiyanın nəticələri müsbət olduqda, ştat vəzifəsindən asılı olmayaraq; DGK həll edir","6 ay keçdikdə; birbaşa rəis həll edir","Yeni vəzifəyə təyin olunduqda; Prezident həll edir","Tənbeh götürüldükdə; Nazirlər Kabineti həll edir"],"e":"Maddə 36 (sarı və qırmızı ilə vurğulanıb).","hl":1},{"d":0,"c":2,"id":"xidmet-74","r":"Maddə 37","q":"İntizam tənbehi olan vəzifəli şəxsə növbəti rütbə nə vaxt verilə bilər?","o":["İntizam tənbehi götürüləndən sonra","Xidmət illəri bitən kimi","Tənbehdən 3 ay sonra","Birbaşa rəisin təqdimatı ilə istənilən vaxt"],"e":"Maddə 37."},{"d":0,"c":2,"id":"xidmet-75","r":"Maddə 38","q":"Xüsusi rütbə hansı müddətə verilir?","o":["Ömürlük; yalnız qanunvericiliklə müəyyən edilmiş qaydada məhrum oluna bilər","Xidmət müddətinə","Son yaş həddinədək","Hər 5 ildən bir attestasiya ilə təsdiqlənməklə"],"e":"Maddə 38."},{"d":0,"c":2,"id":"xidmet-76","r":"Maddə 39","q":"Ali rəis heyəti üçün nəzərdə tutulan vəzifələrin və rütbələrin siyahısını kim təsdiq edir?","o":["Prezident","DGK","Nazirlər Kabineti","Milli Məclis"],"e":"Maddə 39 (rənglənib). Kiçik, orta və baş rəis heyəti üçün siyahını isə DGK təsdiq edir (maddə 40).","hl":1},{"d":0,"c":2,"id":"xidmet-77","r":"Maddə 41","q":"Xüsusi rütbələrə görə əlavələr hansı əsasla müəyyən edilir?","o":["Daxili işlər orqanları əməkdaşlarının rütbələrə görə müvafiq maaşlarına bərabər","Hərbi qulluqçuların maaşlarına bərabər","Vəzifə maaşının 25 faizi həcmində","Nazirlər Kabinetinin müəyyən etdiyi sabit məbləğdə"],"e":"Maddə 41 (rənglənib).","hl":1},{"d":0,"c":3,"id":"xidmet-78","r":"Maddə 43","q":"Aşağıdakılardan hansı 43-cü maddədə hüquq kimi deyil, 44-cü maddədə VƏZİFƏ kimi göstərilib?","o":["Fiziki və hüquqi şəxslərin müraciətlərinə vaxtında baxmaq","Həmkarlar ittifaqlarına birləşmək","Şəxsi işindəki materiallarla tanış olmaq","Vəzifəli şəxslərin iclaslarında iştirak etmək"],"e":"Maddə 44: “xidməti vəzifələri hüdudlarında fiziki və hüquqi şəxslərin müraciətlərinə vaxtında baxmaq” vəzifədir. Qalan üçü 43-cü maddədə hüquqdur.","hl":1},{"d":0,"c":3,"id":"xidmet-79","r":"Maddə 43","q":"Vəzifəli şəxs əlavə təhsili hansı vəsait hesabına almaq hüququna malikdir?","o":["DGK-nın saxlanılması üçün nəzərdə tutulan vəsaitlər hesabına","Öz vəsaiti hesabına","Dövlət büdcəsinin ehtiyat fondu hesabına","Beynəlxalq qrantlar hesabına"],"e":"Maddə 43.","hl":1},{"d":0,"c":3,"id":"xidmet-80","r":"Maddə 43","q":"Şərəf və ləyaqətini alçaldan məlumatlar yayıldıqda vəzifəli şəxsin hansı hüququ var?","o":["Təkzib üçün xidməti araşdırmanın aparılmasını tələb etmək","Birbaşa cinayət işi açmaq","Mətbuatda cavab dərc etdirmək","Məlumatı yayana intizam tənbehi vermək"],"e":"Maddə 43."},{"d":0,"c":3,"id":"xidmet-81","r":"Maddə 44","q":"44-cü maddədə vəzifəli şəxsin neçə vəzifəsi sadalanır?","o":["6","8","13","5"],"e":"Maddə 44 (rənglənib, “vəzifə 6”): 6 vəzifə.","hl":1,"t":1},{"d":0,"c":3,"id":"xidmet-82","r":"Maddə 44","q":"Aşağıdakılardan hansı 44-cü maddədə sadalanan vəzifələrdən biri DEYİL?","o":["Hər il attestasiyadan keçmək","Dövlət sirrini və qanunla qorunan digər sirləri qorumaq","Rəislərin səlahiyyətləri çərçivəsində verdiyi əmrləri yerinə yetirmək","Konstitusiyaya, qanunlara və digər normativ hüquqi aktlara riayəti təmin etmək"],"e":"Attestasiya hər il keçirilmir (maddə 115: 5 ildə bir dəfədən çox olmayaraq) və vəzifə kimi göstərilməyib."},{"d":0,"c":3,"id":"xidmet-83","r":"Maddə 46","q":"Vəzifə təlimatlarının hazırlanması və təsdiqi qaydasını kim müəyyən edir?","o":["DGK","Nazirlər Kabineti","Prezident","Hər gömrük orqanının rəisi"],"e":"Maddə 46."},{"d":0,"c":3,"id":"xidmet-84","r":"Maddə 47","q":"Aşağıdakılardan hansı 47-ci maddəyə görə xidməti vəzifələrin icrasına DAXİLDİR?","o":["Müalicədə olmaq, müalicə yerinə getmək və qayıtmaq","İllik əsas məzuniyyətdə olmaq","Elmi-tədris fəaliyyəti ilə məşğul olmaq","İstirahət günü şəxsi işlərlə məşğul olmaq"],"e":"Maddə 47: təlimlər, xidmət yerinə gedib-qayıtmaq, ezamiyyət, müalicə və müalicəyə gedib-qayıtmaq, vətəndaşların və öz təhlükəsizliyinin qorunması."},{"d":0,"c":3,"id":"xidmet-85","r":"Maddə 48","q":"Xidməti vəzifələrini yerinə yetirərkən vəzifəli şəxsin statusu necədir?","o":["Dövlət nümayəndəsi kimi təmsil olunur və dövlətin mühafizəsi altındadır","Gömrük orqanının nümayəndəsi kimi çıxış edir, lakin xüsusi mühafizə olunmur","Yalnız rəisin icazəsi ilə dövləti təmsil edir","Hüquq mühafizə orqanlarının nəzarəti altındadır"],"e":"Maddə 48."},{"d":0,"c":3,"id":"xidmet-86","r":"Maddə 50","q":"Təşkilati-ştat tədbirləri ilə bağlı vəzifədən azad edilən şəxs DGK-nın sərəncamında nə qədər saxlanıla bilər?","o":["Üç ayadək; məzuniyyət müddəti buraya daxil edilmir","Altı ayadək; məzuniyyət müddəti daxil edilir","Bir ayadək","Üç ayadək; məzuniyyət müddəti daxil edilir"],"e":"Maddə 50 (rənglənib): üç ayadək. Məzuniyyət müddəti daxil edilmir.","hl":1,"t":1},{"d":0,"c":3,"id":"xidmet-87","r":"Maddə 50","q":"Sərəncamda olduğu müddətdə vəzifəli şəxsin əmək haqqı ilə bağlı hansı doğrudur?","o":["Əvvəlki vəzifədə aldığı əmək haqqı saxlanılır","Əmək haqqı saxlanılmır","Yalnız rütbə əlavəsi ödənilir","Vəzifə maaşının 50 faizi ödənilir"],"e":"Maddə 50 (rənglənib). 57-ci maddədəki “müvəqqəti kənar edilmə” ilə qarışdırmayın: orada əmək haqqı saxlanılmır.","hl":1},{"d":0,"c":3,"id":"xidmet-88","r":"Maddə 51","q":"Xidmətə qəbul edilmiş vətəndaş and içməlidir. Hansı müddətdə?","o":["İlk xüsusi rütbəni aldıqdan sonra iki aydan gec olmayaraq","Xidmətə qəbul olunduğu gündən bir ay ərzində","Sınaq müddəti bitdikdən sonra bir ay ərzində","İlk xüsusi rütbəni aldıqdan sonra altı ay ərzində"],"e":"Maddə 51 (sarı və qırmızı): ilk xüsusi rütbəni aldıqdan sonra 2 aydan gec olmayaraq, Gömrük Məcəlləsində nəzərdə tutulan məzmunda.","hl":1,"t":1},{"d":0,"c":3,"id":"xidmet-89","r":"Maddə 51","q":"Andın məzmunu və andiçmə mərasiminin qaydası müvafiq olaraq nə ilə müəyyən edilir?","o":["Məzmun Gömrük Məcəlləsi ilə; mərasim qaydası DGK tərəfindən","Hər ikisi DGK tərəfindən","Məzmun Prezident tərəfindən; mərasim Nazirlər Kabineti tərəfindən","Məzmun Əsasnamə ilə; mərasim Gömrük Məcəlləsi ilə"],"e":"Maddə 51."},{"d":0,"c":3,"id":"xidmet-90","r":"Maddə 52","q":"Vəzifəli şəxsin həmin yerdə yerləşən digər gömrük orqanına və ya başqa yerə xidmətə keçirilməsi hansı şərtlə mümkündür?","o":["Vəzifəli şəxsin razılığı əsasında","DGK-nın əmri ilə, razılıq tələb olunmadan","Birbaşa rəisin təqdimatı ilə","Attestasiya komissiyasının tövsiyəsi ilə"],"e":"Maddə 52 (imtahan sualı): vəzifəli şəxsin razılığı əsasında yol verilir.","hl":1,"ex":1},{"d":0,"c":3,"id":"xidmet-91","r":"Maddə 53","q":"Aşağıdakılardan hansı 53-cü maddəyə görə AŞAĞI vəzifəyə keçirilmə əsası DEYİL?","o":["Ailə vəziyyətinə görə","Attestasiyanın nəticələrinə görə vəzifəyə uyğun gəlmədikdə","İntizam tənbehi qaydasında","Səhhətinə görə (tibb komissiyasının rəyi ilə) bərabər vəzifə mümkün olmadıqda"],"e":"Ailə vəziyyəti 53-cü maddənin 2-ci bəndindədir və “digər vəzifəyə” keçirilmə əsasıdır, aşağı vəzifəyə keçirilmə əsası deyil.","hl":1},{"d":0,"c":3,"id":"xidmet-92","r":"Maddə 54","q":"Başqa işə keçirilmə necə rəsmiləşdirilir?","o":["Keçirilmənin əsası göstərilməklə əmrlə; əmr vəzifəli şəxsə imza etdirilməklə elan olunur","Şifahi göstərişlə","Əmək müqaviləsinə əlavə ilə","Attestasiya vərəqəsində qeydlə"],"e":"Maddə 54."},{"d":0,"c":3,"id":"xidmet-93","r":"Maddə 55","q":"Ştatların ixtisarı və ya səhhəti ilə əlaqədar azmaaşlı vəzifəyə keçirilən şəxsin əvvəlki vəzifə maaşı neçə il xidmət olduqda saxlanılır?","o":["15 il və daha çox","10 il və daha çox","20 il və daha çox","5 il və daha çox"],"e":"Maddə 55.","t":1},{"d":0,"c":3,"id":"xidmet-94","r":"Maddə 57","q":"Barəsində cinayət işi qaldırıldığına görə vəzifədən müvəqqəti kənar edilən şəxsin bu müddətdə əmək haqqı ilə bağlı hansı doğrudur?","o":["Əmək haqqı saxlanılmır","Tam saxlanılır","50 faizi saxlanılır","Yalnız rütbə əlavəsi saxlanılır"],"e":"Maddə 56–57 (rənglənib): vəzifədən müvəqqəti kənar edilən şəxsin həmin müddətdə əmək haqqı saxlanılmır.","hl":1},{"d":0,"c":3,"id":"xidmet-95","r":"Maddə 58","q":"Gömrük orqanlarında xidmət etmiş şəxs digər dövlət orqanına qəbul edildikdə rütbə və ixtisas dərəcələrinin uyğunlaşdırılması qaydasını kim müəyyən edir?","o":["Prezident","DGK","Nazirlər Kabineti","Dövlət Qulluğu Məsələləri üzrə Komissiya"],"e":"Maddə 58."},{"d":0,"c":3,"id":"xidmet-96","r":"Maddə 59","q":"Yeni qulluq yerinə köçmə xərcləri hansı vəsaitdən ödənilir?","o":["Nazirlər Kabinetinin qaydası ilə, Gömrük Məcəlləsinin 334.1-ci maddəsində nəzərdə tutulmuş vəsaitlərdən","Dövlət büdcəsinin ehtiyat fondundan","Vəzifəli şəxsin öz vəsaitindən, sonradan kompensasiya ilə","Yerli icra hakimiyyətinin vəsaitindən"],"e":"Maddə 59."},{"d":0,"c":3,"id":"xidmet-97","r":"Maddə 59-1","q":"Qulluq yerinin dəyişməsi ilə əlaqədar kirayə mənzildə yaşayan şəxsə ödənilən pul kompensasiyasının qaydası və məbləği kim tərəfindən müəyyən edilir?","o":["Nazirlər Kabineti","DGK","Prezident","Yerli icra hakimiyyəti"],"e":"Maddə 59-1."},{"d":0,"c":4,"id":"xidmet-98","r":"Maddə 65","q":"Gömrük orqanlarının nümunəvi daxili intizam qaydalarını kim təsdiq edir?","o":["DGK","Nazirlər Kabineti","Prezident","Milli Məclis"],"e":"Maddə 65."},{"d":0,"c":4,"id":"xidmet-99","r":"Maddə 66","q":"66-cı maddədə neçə həvəsləndirmə tədbiri nəzərdə tutulub?","o":["8","6","7","10"],"e":"Maddə 66 (rənglənib): 8 tədbir.","hl":1,"t":1},{"d":0,"c":4,"id":"xidmet-100","r":"Maddə 66","q":"Aşağıdakılardan hansı 66-cı maddədəki həvəsləndirmə tədbirlərindən biri DEYİL?","o":["Əlavə ödənişli məzuniyyət verilməsi","Təltif silahının verilməsi","Döş nişanı ilə təltif","Tətbiq edilmiş intizam tənbehinin vaxtından əvvəl geri götürülməsi"],"e":"Əlavə məzuniyyət həvəsləndirmə tədbirləri arasında yoxdur.","hl":1},{"d":0,"c":4,"id":"xidmet-101","r":"Maddə 66","q":"Fəxri fərmanla təltif kimin adından verilir?","o":["DGK-nın","Prezidentin","Nazirlər Kabinetinin","Milli Məclisin"],"e":"Maddə 66, 3-cü bənd: DGK-nın fəxri fərmanı."},{"d":0,"c":4,"id":"xidmet-102","r":"Maddə 67","q":"Təltif silahı ilə mükafatlandırma nəyin əsasında həyata keçirilir?","o":["DGK-nın qərarı","Prezidentin fərmanı","Nazirlər Kabinetinin qərarı","Birbaşa rəisin əmri"],"e":"Maddə 67."},{"d":0,"c":4,"id":"xidmet-103","r":"Maddə 68","q":"Qaçaqmalçılığa qarşı mübarizədə fərqlənən vəzifəli şəxs barəsində 68-ci maddə nəyi nəzərdə tutur?","o":["Qanunvericiliklə müəyyən edilmiş qaydada dövlət təltifinə təqdim oluna bilər","Avtomatik olaraq növbəti rütbə alır","Vəzifə maaşının 50 faizi həcmində birdəfəlik mükafat alır","Təltif silahı ilə mütləq təltif olunur"],"e":"Maddə 68 (rənglənib).","hl":1},{"d":0,"c":4,"id":"xidmet-104","r":"Maddə 69","q":"Aşağıdakılardan hansı 69-cu maddədəki intizam tənbehlərindən biridir?","o":["6 ay müddətinə aşağı vəzifəyə keçirilmə","1 il müddətinə aşağı vəzifəyə keçirilmə","Vəzifə maaşının 20 faizi həcmində cərimə","Xüsusi rütbənin iki pillə aşağı salınması"],"e":"Maddə 69, 4-cü bənd: 6 ay müddətinə aşağı vəzifəyə keçirilmə. Rütbə yalnız bir pillə aşağı salına bilər. Cərimə yoxdur.","hl":1,"t":1},{"d":0,"c":4,"id":"xidmet-105","r":"Maddə 69","q":"Aşağıdakılardan hansı intizam tənbehi DEYİL?","o":["Xəbərdarlıq (sonuncu olmayan)","İrad","Sonuncu xəbərdarlıqla şiddətli töhmət","Xüsusi rütbədən məhrum edilməklə xaric etmə"],"e":"Maddə 69: irad, töhmət, sonuncu xəbərdarlıqla şiddətli töhmət, 6 ay aşağı vəzifə, rütbənin bir pillə aşağı salınması, vəzifədən azad etmə, xaric etmə, rütbədən məhrum edilməklə xaric etmə. Ayrıca “xəbərdarlıq” yoxdur."},{"d":0,"c":4,"id":"xidmet-106","r":"Maddə 69","q":"69-cu maddəyə görə intizam tənbehi hansı maddələrin tələbləri pozulduqda tətbiq oluna bilər?","o":["Əsasnamənin 16-cı və 44-cü maddələri; Korrupsiya Qanununun 5.1-ci maddəsi və 9-cu maddəsi","Əsasnamənin 43-cü və 44-cü maddələri","Əsasnamənin 16-cı maddəsi və Gömrük Məcəlləsi","Yalnız Korrupsiya Qanununun 9-cu maddəsi"],"e":"Maddə 69: inzibati və ya cinayət məsuliyyəti yaratmadıqda."},{"d":0,"c":4,"id":"xidmet-107","r":"Maddə 69-1","q":"“Gömrük orqanlarından xaric etmə” tənbehi (69-cu maddə, 7-ci bənd) hansı hallarda tətbiq edilə bilər?","o":["Xidməti intizamın bir dəfə kobud pozulması, vəzifələrin müntəzəm yerinə yetirilməməsi və ya 16-cı maddədəki hərəkətlər","Yalnız cinayət törədildikdə","Üç irad alındıqda","Attestasiyadan keçmədikdə"],"e":"Maddə 69-1 (“7-ci” sözü rənglənib): üç əsas göstərilib.","hl":1},{"d":0,"c":4,"id":"xidmet-108","r":"Maddə 70","q":"İntizam tənbehi qüvvədə olduğu müddətdə 66-cı maddədəki həvəsləndirmələrdən hansı tətbiq edilə BİLƏR?","o":["Tətbiq edilmiş intizam tənbehinin vaxtından əvvəl geri götürülməsi","Təşəkkür elan edilməsi","Pul və ya qiymətli əşya verilməsi","Növbəti rütbənin vaxtından əvvəl verilməsi"],"e":"Maddə 70 (rənglənib): 7-ci bənd istisna olmaqla həvəsləndirmə tətbiq edilə bilməz.","hl":1},{"d":0,"c":4,"id":"xidmet-109","r":"Maddə 71","q":"Vəzifəli şəxs yazılı izahat verməkdən imtina edərsə, nə baş verir?","o":["Bu, ona intizam tənbehi verilməsini istisna etmir","Tənbeh verilə bilməz","Tənbeh yalnız məhkəmə qərarı ilə verilir","Tənbeh avtomatik ən ağır növdə verilir"],"e":"Maddə 71, ikinci abzas."},{"d":0,"c":4,"id":"xidmet-110","r":"Maddə 72","q":"İntizam tənb iyyət hüququnun yaranması"],"e":"Andiçmə 2 ay ərzindədir (maddə 51). Qalanları 6 aydır (maddə 17, 75, 86).","hl":1,"t":1},{"d":0,"c":7,"id":"xidmet-173","r":"Maddə 123","q":"Aşağıdakı müddətlərdən hansı 1 aydır?","o":["Öz təşəbbüsü ilə xidmətdən çıxmazdan əvvəl rəisin xəbərdar edilməsi","Sərəncamda saxlanılma","Pozuntu məlum olduqdan sonra tənbeh vermə müddəti","Andiçmə"],"e":"1 ay: maddə 123 (həmçinin maddə 14 və 72-nin ikinci hissəsi). Sərəncam 3 ay, tənbeh 20 gün, and 2 aydır.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-174","r":"Maddə 26","q":"Aşağıdakılardan hansında “5 il” müddəti YOXDUR?","o":["Kapitan rütbəsində xidmət illəri","Gizir rütbəsində xidmət illəri","Son yaş həddinin artırılmasının yuxarı həddi","Attestasiyanın dövriliyi"],"e":"Kapitan 3 ildir. Gizir 5 il (maddə 26), yaş artırımı 5 ilə qədər (maddə 28), attestasiya 5 ildə bir dəfədən çox olmayaraq (maddə 115).","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-175","r":"Maddə 27","q":"Gömrük xidməti kapitanı üçün son yaş həddi neçədir?","o":["50 yaş","55 yaş","45 yaş","60 yaş"],"e":"Maddə 27: gizirdən kapitana qədər 50 yaş.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-176","r":"Maddə 27","q":"Gömrük xidməti mayoru və polkovnik-leytenantı üçün son yaş həddi neçədir?","o":["55 yaş","50 yaş","60 yaş","58 yaş"],"e":"Maddə 27 (sənəddə 7-ci və 8-ci bəndlərin yanında “55 yaş” qeydi var).","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-177","r":"Maddə 27","q":"Gömrük xidməti polkovniki üçün son yaş həddi neçədir?","o":["60 yaş","55 yaş","65 yaş","Müəyyən edilməyib"],"e":"Maddə 27: polkovnik və generallar üçün 60 yaş.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-178","r":"Maddə 27","q":"Kimlər üçün son yaş həddi müəyyən edilməyib?","o":["Həqiqi dövlət gömrük xidməti müşaviri və Prezident tərəfindən vəzifəyə təyin olunan şəxslər","Bütün ali rəis heyəti","Yalnız general-polkovniklər","Elmi dərəcəsi olan şəxslər"],"e":"Maddə 27 (imtahan sualı).","hl":1,"ex":1},{"d":0,"c":2,"id":"xidmet-179","r":"Maddə 27","q":"Qadın gömrük xidməti mayoru öz arzusu ilə hansı yaşadək xidmət edə bilər?","o":["50 yaşadək","55 yaşadək","45 yaşadək","60 yaşadək"],"e":"Maddə 27, son abzas (rənglənib): qadınlar öz arzuları ilə 5 il az xidmət edə bilər: 55 − 5 = 50.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-180","r":"Maddə 28","q":"Tibbi cəhətdən yararlı gömrük xidməti polkovnikinin son yaş həddi maksimum hansı yaşadək artırıla bilər?","o":["65 yaşadək","60 yaşadək","63 yaşadək","70 yaşadək"],"e":"Maddə 28 (rənglənib): DGK yaş həddini 5 ilə qədər artıra bilər: 60 + 5 = 65.","hl":1,"t":1},{"d":0,"c":2,"id":"xidmet-181","r":"Maddə 28","q":"27-ci maddədəki yaş hədlərini kim və hansı şərtlə artıra bilər?","o":["DGK, vəzifəli şəxs tibbi cəhətdən yararlı olduqda, 5 ilə qədər","Prezident, istənilən müddətə","Nazirlər Kabineti, 3 ilə qədər","Attestasiya komissiyası, 5 ilə qədər"],"e":"Maddə 28 (rənglənib).","hl":1},{"d":0,"c":10,"id":"xidmet-rq0","r":"Maddə 2","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən  gömrük orqanlarında xidmət haqqında qanunvericilik (tam və düzgün cavabı qeyd edin):","o":["Konstitusiyaya əsaslanır və Gömrük Məcəlləsindən, bu Əsasnamədən və gömrük orqanlarında xidmətin qaydalarını tənzimləyən digər normativ hüquqi aktlardan ibarətdir","Yalnız Gömrük Məcəlləsindən ibarətdir","Əmək Məcəlləsindən və “Dövlət qulluğu haqqında” Qanundan ibarətdir","Konstitusiyadan və DGK-nın əmrlərindən ibarətdir"],"e":"Maddə 2.","ex":1},{"d":0,"c":10,"id":"xidmet-rq1","r":"Maddə 2","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən  gömrük orqanlarında dövlət qulluqçusu olmayan işçilərin əmək münasibətləri:","o":["Əmək Məcəlləsinin müvafiq normaları ilə tənzimlənir","“Dövlət qulluğu haqqında” Qanunla tənzimlənir","Bu Əsasnamə ilə tənzimlənir","DGK-nın əmrləri ilə tənzimlənir"],"e":"Maddə 2: xadimə, dalandar, bağban, gözətçi, ocaqçı və s. Xüsusi rütbəsiz vəzifələrdə işləyən dövlət qulluqçuları isə “Dövlət qulluğu haqqında” Qanunla tənzimlənir.","ex":1},{"d":0,"c":10,"id":"xidmet-rq2","r":"Maddə 8","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən kiçik heyət, orta, baş və ali rəis heyətinə aid olan vəzifələr üzrə müəyyən edilən xüsusi rütbə hədləri ilə bağlı aşağıda göstərilənlərdən tam və doğru olanı qeyd edin:","o":["Kiçik heyət — gizir və baş gizir; orta rəis heyəti — kiçik leytenantdan kapitanadək; baş rəis heyəti — mayor, polkovnik-leytenant, polkovnik; ali rəis heyəti — general-mayor, general-leytenant, general-polkovnik, həqiqi dövlət gömrük xidməti müşaviri, tibb xidməti general-mayoru","Kiçik heyət — gizirdən leytenantadək; orta rəis heyəti — baş leytenantdan mayoradək; baş rəis heyəti — polkovnik-leytenant və polkovnik; ali rəis heyəti — generallar","Kiçik heyət — gizir; orta rəis heyəti — baş gizirdən kapitanadək; baş rəis heyəti — mayordan general-mayoradək; ali rəis heyəti — general-leytenant və general-polkovnik","Kiçik heyət — gizir və baş gizir; orta rəis heyəti — kiçik leytenantdan mayoradək; baş rəis heyəti — polkovnik-leytenant və polkovnik; ali rəis heyəti — generallar"],"e":"Maddə 8.","ex":1},{"d":0,"c":10,"id":"xidmet-rq3","r":"Maddə 9","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən gömrük orqanlarında xidmət hansı prinsiplər əsasında təşkil edilir?","o":["Qanunçuluq, humanizm, müvafiq dövlət hakimiyyəti orqanları qarşısında cavabdehlik, xidməti intizama və etik davranış qaydalarına riayət, xidmət fəaliyyətinin nəticələrinə və ixtisasına görə xidməti irəliləyiş","Qanunun aliliyi, insan hüquqlarının qorunması, aşkarlıq, peşəkarlıq və nizam-intizam","Könüllülük, müsabiqə və şəffaflıq","Vahid komandanlıq, tabelik və məxfilik"],"e":"Maddə 9. Diqqət: “könüllülük, müsabiqə və şəffaflıq” xidmətə QƏBULUN prinsipləridir (11), 1.4-dəki siyahı isə DGK Əsasnaməsinə aiddir.","ex":1},{"d":0,"c":10,"id":"xidmet-rq4","r":"Maddə 19","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən sınaq müddəti dövründə sınağın nəticəsi qənaətedici olmadıqda, gömrük orqanının vəzifəli şəxsinin xidmətinə xitam verilir:","o":["Bu Əsasnaməyə uyğun olaraq","Əmək Məcəlləsinə uyğun olaraq","“Dövlət qulluğu haqqında” Qanuna uyğun olaraq","Attestasiya komissiyasının qərarı ilə, məhkəmə qaydasında"],"e":"Maddə 19: sınaq müddəti 6 aya qədərdir (17), DGK tərəfindən qısaldıla bilər (18).","ex":1},{"d":0,"c":10,"id":"xidmet-rq5","r":"Maddə 27","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən son yaş həddi ilə əlaqədar aşağıda göstərilənlərdən doğru olanı qeyd edin:","o":["Həqiqi dövlət gömrük xidməti müşaviri, habelə Prezident tərəfindən vəzifəyə təyin olunan şəxslər üçün son yaş həddi müəyyən edilməmişdir","Gizirdən kapitanadək rütbəsi olanlar üçün son yaş həddi 55 yaşdır","Polkovnik və generallar üçün son yaş həddi 65 yaşdır","Qadın vəzifəli şəxslər öz arzuları ilə son yaş həddindən 3 il az xidmət edə bilərlər"],"e":"Maddə 27 (imtahan sualı): gizir–kapitan — 50; mayor, polkovnik-leytenant — 55; polkovnik və generallar — 60 yaş; qadınlar arzusu ilə 5 il az. Yaş həddi 5 ilə qədər uzadıla bilər (28).","ex":1},{"d":0,"c":10,"id":"xidmet-rq6","r":"Maddə 23","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən xüsusi rütbənin verilmə qaydası haqqında aşağıda göstərilənlərdən hansı yanlışdır?","o":["Ali rəis heyəti üçün nəzərdə tutulan xüsusi rütbələr DGK tərəfindən verilir","Xüsusi rütbələr fərdi şəkildə, ardıcıl qaydada verilir","Gömrük xidməti polkovniki xüsusi rütbəsi DGK tərəfindən verilir","Xüsusi rütbə ömürlük verilir"],"e":"Maddə 23: ali rəis heyətinin rütbələrini PREZİDENT verir. Kiçik, orta və baş rəis heyətinin (polkovnik daxil) rütbələrini DGK verir. Rütbə ömürlükdür (38).","ex":1},{"d":0,"c":10,"id":"xidmet-rq7","r":"Maddə 43","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən gömrük orqanının vəzifəli şəxsinin  hüquqlarını sadalayın:","o":["Şəxsi işindəki materiallarla tanış olmaq, həmkarlar ittifaqlarına birləşmək, xidmət illəri nəzərə alınmaqla pensiya təminatı, hesabına əlavə təhsil almaq, şərəf və ləyaqətini alçaldan məlumatların təkzibi üçün araşdırma tələb etmək","Sahibkarlıq fəaliyyəti ilə məşğul olmaq, tətillərin təşkilində iştirak etmək","Gömrük məsələləri üzrə üçüncü şəxslərin müvəkkili olmaq","Siyasi partiyalar yaratmaq və onların işində iştirak etmək"],"e":"Maddə 43: 13 hüquq. Digər variantlar 16-cı maddədəki qadağalardır.","ex":1},{"d":0,"c":10,"id":"xidmet-rq8","r":"Maddə 44","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən gömrük orqanının vəzifəli şəxsi aşağıda göstərilənlərdən hansını etməyə borcludur?","o":["Dövlət sirrini və qanunla qorunan digər sirləri qorumaq, xidməti vəzifələrini yerinə yetirərkən ona məlum olmuş məlumatları açıqlamamaq","Həmkarlar ittifaqına üzv olmaq","Hər il attestasiyadan keçmək","Siyasi partiyaların fəaliyyətində iştirak etmək"],"e":"Maddə 44: 6 vəzifə.","ex":1},{"d":0,"c":10,"id":"xidmet-rq9","r":"Maddə 51","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən gömrük orqanlarında xidmətə qəbul edilmiş vətəndaşlar ilk xüsusi rütbəni aldıqdan sonra hansı müddətdə Azərbaycan Respublikasının Gömrük Məcəlləsi ilə nəzərdə tutulan məzmunda and içirlər?","o":["İki aydan gec olmayaraq","Bir aydan gec olmayaraq","Üç aydan gec olmayaraq","Altı aydan gec olmayaraq"],"e":"Maddə 51.","ex":1,"t":1},{"d":0,"c":10,"id":"xidmet-rq10","r":"Maddə 53","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən gömrük orqanlarının vəzifəli şəxsləri xidmət üzrə aşağıdakı hansı halda aşağı vəzifəyə keçirilirlər?","o":["Attestasiyanın nəticələrinə görə tutduğu vəzifəyə uyğun gəlmədiyi müəyyən edildikdə","Ailə vəziyyətinə görə","Ali təhsil müəssisəsinin əyani şöbəsini bitirdikdə","Yüksək vəzifəyə keçirildikdə"],"e":"Maddə 53, 4-cü bənd: aşağı vəzifəyə keçirmə — səhhət və ya ştat ixtisarı (bərabər vəzifə mümkün deyilsə), attestasiya nəticəsi, intizam tənbehi. Ailə vəziyyəti və ali təhsil isə başqa vəzifəyə keçirmə əsaslarıdır (53.2, 53.3).","ex":1},{"d":0,"c":10,"id":"xidmet-rq11","r":"Maddə 52–57","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən gömrük orqanlarında xidmətlə bağlı qeyd edilənlərdən hansı yanlışdır?","o":["Vəzifəli şəxsin həmin yerdə yerləşən digər gömrük orqanına keçirilməsi onun razılığı olmadan həyata keçirilir","Başqa işə keçirilmə əsas göstərilməklə əmrlə rəsmiləşdirilir","15 il və daha çox xidmət illəri olanlar ştat ixtisarı və ya səhhətinə görə azmaaşlı vəzifəyə keçirilərkən əvvəlki vəzifə maaşı saxlanılır","Vəzifədən müvəqqəti kənar edilən vəzifəli şəxsin həmin müddətdə əmək haqqı saxlanılmır"],"e":"Maddə 52 (imtahan sualı): belə keçirilmə vəzifəli şəxsin RAZILIĞI əsasında olur. Digərləri 54, 55, 57-dir.","ex":1},{"d":0,"c":10,"id":"xidmet-rq12","r":"Maddə 66","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən aşağıdakılardan biri həvəsləndirmə tədbiri deyil?","o":["Əlavə məzuniyyət verilməsi","Təşəkkür elan edilməsi","Təltif silahının verilməsi","Tətbiq edilmiş intizam tənbehinin vaxtından əvvəl geri götürülməsi"],"e":"Maddə 66: 8 həvəsləndirmə tədbiri — təşəkkür, pul və ya qiymətli əşya, DGK-nın fəxri fərmanı, növbəti rütbənin vaxtından əvvəl verilməsi, təltif silahı, rütbənin bir pillə yuxarı verilməsi, tənbehin vaxtından əvvəl götürülməsi, döş nişanı.","ex":1},{"d":0,"c":10,"id":"xidmet-rq13","r":"Maddə 43","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən aşağıdakılardan hansı gömrük orqanının vəzifəli şəxsinin hüququdur?","o":["Həmkarlar ittifaqlarına birləşmək","Əvəzçilik şərti ilə istənilən haqqı ödənilən işi görmək","Təsərrüfat subyektlərinin idarə edilməsində iştirak etmək","Tətillərin təşkilində iştirak etmək"],"e":"Maddə 43. Digərləri 16-cı maddədəki qadağalardır.","ex":1},{"d":0,"c":10,"id":"xidmet-rq14","r":"Maddə 71","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən intizam tənbehi verilərkən nəzərə alınmır:","o":["Vəzifəli şəxsin ailə vəziyyəti","Vəzifəli şəxsin əvvəlki peşəkarlıq səviyyəsi və xidmətə münasibəti","Törətdiyi xətanın ağırlığı və xarakteri","Xətanın törədildiyi zaman mövcud olmuş hallar"],"e":"Maddə 71. Tənbehdən əvvəl yazılı izahat tələb edilir; izahat verməkdən imtina tənbehi istisna etmir.","ex":1},{"d":0,"c":10,"id":"xidmet-rq15","r":"Maddə 72–75","q":"Azərbaycan Respublikasının 1999-cu il 7 dekabr tarixli 768-IQ nömrəli Qanunu ilə təsdiq edilmiş \"Gömrük orqanlarında xidmət haqqında\" Əsasnaməyə əsasən intizam tənbehi ilə bağlı qeyd edilənlərdən hansı yanlışdır?","o":["İntizam tənbehi 1 il ərzində yeni tənbeh tətbiq olunmadıqda götürülür","İntizam tənbehinin verilməsi əmrlə rəsmiləşdirilir","İntizam tənbehi vəzifəli şəxsin xəstə, məzuniyyətdə və ya ezamiyyətdə olduğu vaxt tətbiq ol
